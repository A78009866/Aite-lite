name: Delete All Files

on:
  workflow_dispatch: # تشغيل يدوي فقط للحماية

jobs:
  empty-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # إعطاء الصلاحية للكتابة والتعديل على المستودع

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete all files and commit
        run: |
          # إعداد بيانات البوت الخاص بـ GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # حذف جميع الملفات والمجلدات
          git rm -rf .
          
          # عمل Commit للتغييرات
          git commit -m "🚨 Empty the repository via GitHub Actions"
          
          # رفع التغييرات إلى المستودع
          git push
