<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Aite — ريلز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: #000;
      height: 100%; width: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif;
    }

    /* حاوية الريلز الرئيسية - إصلاح التمرير */
    #reelsContainer {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: scroll; 
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
      scroll-behavior: smooth;
    }
    #reelsContainer::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .reel-card {
      position: relative;
      width: 100%; height: 100%; /* تأخذ كامل ارتفاع الشاشة الثابت */
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }

    .reel-media {
      width: 100%; height: 100%;
      object-fit: cover; /* تغطية الشاشة بالكامل */
    }

    /* الأزرار الجانبية والمعلومات */
    .side-controls {
      position: absolute; right: 12px; bottom: 100px;
      z-index: 50; display: flex; flex-direction: column; gap: 18px;
    }
    .control-btn {
      display: flex; flex-direction: column; align-items: center;
      color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .icon-circle {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.1);
    }

    .bottom-info {
      position: absolute; bottom: 30px; left: 15px; right: 70px;
      z-index: 50; color: white;
    }

    /* نافذة التعليقات - إصلاح ظهور كل التعليقات */
    .comments-overlay {
      position: fixed; bottom: 0; left: 0; right: 0; height: 75%;
      background: #121212; border-radius: 20px 20px 0 0;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000; display: flex; flex-direction: column;
      border-top: 1px solid #333;
    }
    .comments-overlay.active { transform: translateY(0); }
    
    .comments-header {
        padding: 15px; text-align: center; border-bottom: 1px solid #222;
        position: relative; font-weight: bold;
    }

    #commentsList {
      flex: 1; overflow-y: auto; padding: 15px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .comment-box { display: flex; gap: 10px; }
    .comment-box img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .comment-text { background: #222; padding: 10px 14px; border-radius: 15px; flex: 1; }
    .comment-user { font-weight: bold; font-size: 13px; color: #bbb; display: block; margin-bottom: 2px; }

    .comment-input-bar {
      padding: 15px; background: #1a1a1a; border-top: 1px solid #333;
      display: flex; gap: 10px; align-items: center;
    }
    .comment-input-bar input {
      flex: 1; background: #262626; border: none; padding: 12px 18px;
      border-radius: 25px; color: white; outline: none;
    }

    /* أزرار التنقل العلوية */
    .top-nav {
      position: fixed; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; z-index: 100;
    }
    .nav-circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.4); display: flex; align-items: center;
      justify-content: center; color: white; backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="/chat_list" class="nav-circle"><i class="fas fa-arrow-right"></i></a>
    <a href="/reels/create" class="nav-circle"><i class="fas fa-plus"></i></a>
  </div>

  <div id="reelsContainer"></div>

  <div id="commentsOverlay" class="comments-overlay">
    <div class="w-12 h-1 bg-gray-700 rounded-full mx-auto mt-3" onclick="toggleComments()"></div>
    <div class="comments-header">التعليقات</div>
    <div id="commentsList"></div>
    <div class="comment-input-bar">
      <input type="text" id="commentInput" placeholder="أضف تعليقاً لـ Aite..." autocomplete="off">
      <button onclick="postComment()" class="text-blue-500 font-bold px-2">نشر</button>
    </div>
  </div>

<script>
  let currentReelId = null;
  let reelsData = [];
  const container = document.getElementById('reelsContainer');

  // جلب البيانات عند التحميل
  async function fetchReels() {
    try {
      const res = await fetch('/api/reels');
      const data = await res.json();
      if(data.ok) {
        reelsData = data.reels;
        renderReels();
      }
    } catch(e) { console.error("Error fetching reels:", e); }
  }

  function renderReels() {
    container.innerHTML = '';
    reelsData.forEach(reel => {
      const card = document.createElement('div');
      card.className = 'reel-card';
      card.dataset.id = reel.reelId;
      
      const media = reel.media.type === 'video' 
        ? `<video class="reel-media" src="${reel.media.url}" loop playsinline></video>`
        : `<img class="reel-media" src="${reel.media.url}">`;

      card.innerHTML = `
        ${media}
        <div class="side-controls">
          <div class="control-btn" onclick="likeReel('${reel.reelId}', this)">
            <div class="icon-circle"><i class="fas fa-heart text-2xl ${reel.is_liked ? 'text-red-500' : 'text-white'}"></i></div>
            <span class="text-xs font-bold">${reel.likes || 0}</span>
          </div>
          <div class="control-btn" onclick="openComments('${reel.reelId}')">
            <div class="icon-circle"><i class="fas fa-comment-dots text-2xl"></i></div>
            <span class="text-xs font-bold">${reel.commentsCount || 0}</span>
          </div>
          <div class="control-btn">
            <div class="icon-circle"><i class="fas fa-share text-2xl"></i></div>
          </div>
        </div>
        <div class="bottom-info">
          <div class="flex items-center gap-2 mb-2">
            <img src="${reel.user.profile_picture_url}" class="w-9 h-9 rounded-full border border-gray-700">
            <span class="font-bold">@${reel.user.username}</span>
          </div>
          <p class="text-sm opacity-90">${reel.description || ''}</p>
        </div>
      `;
      container.appendChild(card);
    });

    setupVideoObserver();
  }

  // التحكم بتشغيل الفيديو عند التمرير
  function setupVideoObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (entry.isIntersecting) {
          if (video) video.play().catch(() => {});
        } else {
          if (video) video.pause();
        }
      });
    }, { threshold: 0.8 });

    document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
  }

  // --- نظام التعليقات المطور ---
  const commentsOverlay = document.getElementById('commentsOverlay');
  const commentsList = document.getElementById('commentsList');

  function toggleComments() { commentsOverlay.classList.toggle('active'); }

  async function openComments(reelId) {
    currentReelId = reelId;
    toggleComments();
    commentsList.innerHTML = '<div class="text-center text-gray-500 py-10">جاري تحميل التعليقات...</div>';
    
    try {
      const res = await fetch(`/api/reels/${reelId}/comments`);
      const data = await res.json();
      
      commentsList.innerHTML = ''; // مسح الرسالة السابقة
      
      if(data.comments && data.comments.length > 0) {
        // حلقة تكرار صحيحة لإضافة كل تعليق في عنصر منفصل
        data.comments.forEach(comment => {
          const commentEl = document.createElement('div');
          commentEl.className = 'comment-box';
          commentEl.innerHTML = `
            <img src="${comment.user.profile_picture_url}">
            <div class="comment-text">
              <span class="comment-user">${comment.user.username}</span>
              <div class="text-sm text-white">${comment.content}</div>
            </div>
          `;
          commentsList.appendChild(commentEl);
        });
      } else {
        commentsList.innerHTML = '<div class="text-center text-gray-600 py-10">لا توجد تعليقات بعد، كن أول من يعلق!</div>';
      }
    } catch(e) {
      commentsList.innerHTML = '<div class="text-center text-red-500 py-10">حدث خطأ أثناء تحميل التعليقات.</div>';
    }
  }

  async function postComment() {
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if(!content || !currentReelId) return;

    try {
      const res = await fetch(`/api/reels/${currentReelId}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      if(res.ok) {
        input.value = '';
        openComments(currentReelId); // إعادة التحديث لإظهار التعليق الجديد
      }
    } catch(e) { alert("فشل إرسال التعليق"); }
  }

  async function likeReel(reelId, btn) {
    const icon = btn.querySelector('i');
    const countSpan = btn.querySelector('span');
    const isLiked = icon.classList.contains('text-red-500');
    
    // تغيير واجهة المستخدم فوراً (Optimistic UI)
    icon.classList.toggle('text-red-500');
    icon.classList.toggle('text-white');
    countSpan.innerText = parseInt(countSpan.innerText) + (isLiked ? -1 : 1);

    await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
  }

  // البدء
  fetchReels();
</script>
</body>
</html>
