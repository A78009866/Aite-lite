<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimer Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: sans-serif; overflow: hidden; }

        /* حاوية الريلز الرئيسية */
        .reels-container {
            height: 100vh;
            width: 100vw;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none; /* للهاتف */
        }
        .reels-container::-webkit-scrollbar { display: none; } /* للحاسوب */

        /* كل فيديو ريل منفرد */
        .reel-item {
            position: relative;
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        /* الجزء العلوي: الأزرار */
        .top-nav {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .top-nav a {
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        /* الأزرار الجانبية (يمين) */
        .side-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        .action-btn {
            background: none;
            border: none;
            color: white;
            text-align: center;
            cursor: pointer;
        }
        .action-btn i { font-size: 28px; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        .action-btn span { display: block; font-size: 12px; margin-top: 5px; }

        /* بيانات البروفيل (أسفل) */
        .reel-footer {
            position: absolute;
            bottom: 30px;
            right: 15px;
            left: 70px; /* لترك مساحة للأزرار */
            color: white;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; }
        .user-info h4 { font-size: 16px; font-weight: bold; }
        .reel-description { font-size: 14px; line-height: 1.4; }

        /* تأثيرات الإعجاب */
        .liked { color: #ff3b5c !important; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="/chat_list"><i class="fas fa-arrow-right"></i> الرئيسية</a>
        <a href="/create-reel"><i class="fas fa-plus"></i> إنشاء ريل</a>
    </div>

    <div class="reels-container" id="reelsContainer">
        </div>

    <script>
        async function loadReels() {
            const container = document.getElementById('reelsContainer');
            try {
                // ملاحظة: تأكد من وجود مسار /api/reels في server.js
                const response = await fetch('/api/posts'); // نستخدم posts حالياً للتجربة
                const data = await response.json();

                if (data.ok) {
                    // فلترة المنشورات التي تحتوي على فيديو فقط
                    const videoPosts = data.posts.filter(p => p.media && p.media.type === 'video');
                    
                    if (videoPosts.length === 0) {
                        container.innerHTML = '<div style="color:white; padding:100px; text-align:center;">لا توجد ريلز حالياً</div>';
                        return;
                    }

                    container.innerHTML = videoPosts.map(post => `
                        <div class="reel-item">
                            <video loop onclick="togglePlay(this)">
                                <source src="${post.media.url}" type="video/mp4">
                            </video>
                            
                            <div class="side-actions">
                                <button class="action-btn ${post.is_liked ? 'liked' : ''}" onclick="likePost('${post.postId}', this)">
                                    <i class="fas fa-heart"></i>
                                    <span>${post.likes || 0}</span>
                                </button>
                                <button class="action-btn" onclick="openComments('${post.postId}')">
                                    <i class="fas fa-comment-dots"></i>
                                    <span>${post.commentsCount || 0}</span>
                                </button>
                                <button class="action-btn" onclick="copyLink('${post.postId}')">
                                    <i class="fas fa-share"></i>
                                    <span>نشر</span>
                                </button>
                            </div>

                            <div class="reel-footer">
                                <div class="user-info">
                                    <img src="${post.user.profile_picture_url}" alt="avatar">
                                    <h4>@${post.user.username}</h4>
                                </div>
                                <div class="reel-description">
                                    ${post.content || ''}
                                </div>
                            </div>
                        </div>
                    `).join('');

                    setupIntersectionObserver();
                }
            } catch (err) {
                console.error("Error loading reels:", err);
            }
        }

        // تشغيل الفيديو عند ظهوره في الشاشة وتوقيف الآخرين
        function setupIntersectionObserver() {
            const options = { threshold: 0.6 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        video.play();
                    } else {
                        video.pause();
                    }
                });
            }, options);

            document.querySelectorAll('.reel-item').forEach(item => observer.observe(item));
        }

        function togglePlay(video) {
            if (video.paused) video.play();
            else video.pause();
        }

        async function likePost(postId, btn) {
            const res = await fetch(\`/api/posts/\${postId}/like\`, { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                btn.classList.toggle('liked');
                btn.querySelector('span').innerText = data.newLikes;
            }
        }

        function copyLink(postId) {
            const url = window.location.origin + '/reels?id=' + postId;
            navigator.clipboard.writeText(url).then(() => {
                alert('تم نسخ الرابط!');
            });
        }

        window.onload = loadReels;
    </script>
</body>
</html>
