<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimer Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* حاوية الريلز الرئيسية */
        .reels-container {
            height: 100vh; overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* إخفاء شريط التمرير لـ Firefox */
        }
        .reels-container::-webkit-scrollbar { display: none; } /* إخفاء لـ Chrome/Safari */

        .reel-video-container {
            height: 100vh; width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background: black;
            display: flex; align-items: center; justify-content: center;
        }

        video { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
        
        /* الأزرار الجانبية */
        .reel-actions {
            position: absolute; bottom: 100px; left: 15px;
            display: flex; flex-direction: column; align-items: center;
            gap: 20px; z-index: 10;
        }
        .action-btn { color: white; text-align: center; font-size: 26px; cursor: pointer; transition: 0.2s; }
        .action-btn span { display: block; font-size: 13px; margin-top: 5px; font-weight: bold; }
        .liked { color: #ff3040 !important; }

        /* معلومات المستخدم والوصف */
        .reel-info {
            position: absolute; bottom: 40px; right: 15px;
            color: white; z-index: 10; text-align: right; width: 75%;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }
        .user-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .user-pic { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; }
        .reel-content { font-size: 15px; line-height: 1.4; margin: 0; }

        /* نافذة التعليقات السفلية */
        .comments-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 65%;
            background: #121212; border-radius: 20px 20px 0 0;
            z-index: 100; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); 
            padding: 20px; box-sizing: border-box; color: white;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .comments-sheet.active { bottom: 0; }
        .comment-list { height: calc(100% - 100px); overflow-y: auto; margin-top: 15px; }
        .comment-item { display: flex; gap: 12px; margin-bottom: 18px; align-items: flex-start; }
        
        .comment-input-area {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: flex; gap: 10px; background: #262626; padding: 5px 15px; border-radius: 25px;
        }
        .comment-input-area input {
            flex: 1; background: none; border: none; color: white; padding: 10px 0; outline: none;
        }

        /* تأثير القلب عند الضغط المزدوج */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: white; opacity: 0; pointer-events: none; z-index: 5;
        }
        @keyframes heartPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* زر الحذف */
        .delete-btn { color: #888; font-size: 18px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="reels-container" id="reelsWrapper">
    </div>

<div class="comments-sheet" id="commentSheet">
    <div style="width: 40px; height: 4px; background: #333; margin: 0 auto 15px; border-radius: 10px;" onclick="closeComments()"></div>
    <h3 style="text-align:center; font-size: 16px;">التعليقات</h3>
    
    <div class="comment-list" id="commentList"></div>

    <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="إضافة تعليق...">
        <button onclick="postComment()" style="background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer;">نشر</button>
    </div>
</div>

<script>
    let currentReels = [];
    let activeReelId = null;

    // 1. جلب الريلز من السيرفر
    async function loadReels() {
        try {
            const res = await fetch('/api/reels');
            const data = await res.json();
            if (data.ok) {
                currentReels = data.reels;
                renderReels();
                observeVideos(); // تفعيل التشغيل التلقائي عند التمرير
            }
        } catch (e) { console.error("Error loading reels", e); }
    }

    // 2. بناء واجهة الريلز
    function renderReels() {
        const container = document.getElementById('reelsWrapper');
        container.innerHTML = currentReels.map(reel => `
            <div class="reel-video-container" id="reel-${reel.reelId}">
                <video src="${reel.media?.url}" loop playsinline onclick="togglePlay(this)" 
                       ondblclick="handleDoubleLike(event, '${reel.reelId}')"></video>
                
                <div class="heart-overlay" id="heart-${reel.reelId}"><i class="fas fa-heart"></i></div>

                <div class="reel-actions">
                    <div class="action-btn ${reel.is_liked ? 'liked' : ''}" id="like-btn-${reel.reelId}" onclick="toggleLike('${reel.reelId}')">
                        <i class="fas fa-heart"></i>
                        <span id="like-count-${reel.reelId}">${reel.likes || 0}</span>
                    </div>
                    <div class="action-btn" onclick="openComments('${reel.reelId}')">
                        <i class="fas fa-comment"></i>
                        <span>${reel.commentsCount || 0}</span>
                    </div>
                    ${reel.userId === 'current_user_id_logic' ? `<div class="delete-btn" onclick="deleteReel('${reel.reelId}')"><i class="fas fa-trash"></i></div>` : ''}
                </div>

                <div class="reel-info">
                    <div class="user-row" onclick="window.location.href='/profile/${reel.userId}'">
                        <img src="${reel.user.profile_picture_url}" class="user-pic">
                        <strong>${reel.user.username}</strong>
                    </div>
                    <p class="reel-content">${reel.content}</p>
                </div>
            </div>
        `).join('');
    }

    // 3. التحكم في التشغيل والإيقاف
    function togglePlay(video) {
        if (video.paused) video.play();
        else video.pause();
    }

    // 4. نظام الإعجاب (النقر المزدوج والزر)
    async function handleDoubleLike(event, reelId) {
        const heart = document.getElementById(`heart-${reelId}`);
        heart.style.animation = 'heartPop 0.8s ease-out';
        setTimeout(() => heart.style.animation = '', 800);
        
        const btn = document.getElementById(`like-btn-${reelId}`);
        if (!btn.classList.contains('liked')) toggleLike(reelId);
    }

    async function toggleLike(reelId) {
        const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
            const btn = document.getElementById(`like-btn-${reelId}`);
            const count = document.getElementById(`like-count-${reelId}`);
            btn.classList.toggle('liked', data.action === 'liked');
            count.innerText = data.newLikes;
        }
    }

    // 5. إدارة التعليقات الحقيقية
    async function openComments(reelId) {
        activeReelId = reelId;
        document.getElementById('commentSheet').classList.add('active');
        const list = document.getElementById('commentList');
        list.innerHTML = '<p style="text-align:center;">جاري التحميل...</p>';

        const res = await fetch(`/api/reels/${reelId}/comments`);
        const data = await res.json();
        if (data.ok) {
            list.innerHTML = data.comments.map(c => `
                <div class="comment-item">
                    <img src="${c.user.profile_picture_url}" style="width:32px; height:32px; border-radius:50%;">
                    <div>
                        <strong style="font-size:13px; color:#aaa;">${c.user.username}</strong>
                        <p style="margin:3px 0; font-size:14px;">${c.content}</p>
                    </div>
                </div>
            `).join('');
        }
    }

    async function postComment() {
        const input = document.getElementById('commentInput');
        if (!input.value.trim()) return;

        const res = await fetch(`/api/reels/${activeReelId}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: input.value })
        });
        if ((await res.json()).ok) {
            input.value = '';
            openComments(activeReelId);
        }
    }

    function closeComments() { document.getElementById('commentSheet').classList.remove('active'); }

    // 6. تشغيل الفيديو التلقائي عند التمرير (Intersection Observer)
    function observeVideos() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) video.play();
                else video.pause();
            });
        }, { threshold: 0.7 });

        document.querySelectorAll('video').forEach(v => observer.observe(v));
    }

    window.onload = loadReels;
</script>

</body>
</html>
