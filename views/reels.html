<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>ريلز — Reels</title>

  <!-- Tailwind + Font Awesome + Cairo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --bg: #000; --muted: #9ca3af; --accent: #06b6d4; }
    html,body { height:100%; background:var(--bg); font-family:'Cairo',sans-serif; color:#fff; }
    /* full-screen vertical snap container like Instagram Reels */
    #reelsContainer {
      height: 100vh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .reel {
      position: relative;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .reel video, .reel img {
      max-height: 100%;
      width: 100%;
      object-fit: cover;
    }

    /* overlay info */
    .overlay {
      position: absolute;
      bottom: 24px;
      right: 16px;
      left: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      pointer-events: none;
    }
    .meta {
      flex: 1;
      pointer-events: auto;
    }
    .meta .username { font-weight:700; font-size: 15px; }
    .meta .desc { color: var(--muted); margin-top: 6px; max-height: 4.4em; overflow: hidden; line-height:1.2; font-size: 13px; }
    .actions {
      width: 72px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      pointer-events: auto;
    }
    .action-btn {
      display:flex; flex-direction:column; align-items:center; gap:6px; color:#fff; cursor:pointer;
      transform: translateZ(0);
    }
    .action-btn .count { font-size:12px; color:var(--muted); }

    .profile-thumb {
      width:44px; height:44px; border-radius:9999px; overflow:hidden; border:2px solid rgba(255,255,255,0.06);
    }

    /* double-tap heart animation */
    .heart {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
      transform: scale(0); opacity:0;
    }
    .heart.show { animation: pop 600ms ease forwards; }
    @keyframes pop {
      0% { transform: scale(0.5); opacity:0; }
      30% { transform: scale(1.15); opacity:1; }
      100% { transform: scale(1); opacity:0; }
    }

    /* comments drawer */
    .comments-drawer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(10,10,10,0.96), rgba(0,0,0,0.98));
      border-top-left-radius: 16px; border-top-right-radius: 16px;
      max-height: 70vh;
      transform: translateY(100%);
      transition: transform .28s ease;
      z-index: 60;
      color: #fff;
      overflow: hidden;
      display:flex;
      flex-direction:column;
    }
    .comments-drawer.open { transform: translateY(0); }
    .comments-body { overflow-y:auto; padding: 12px 16px; flex:1; }
    .comment { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .comment .c-text { color:var(--muted); font-size:13px; }

    /* loader */
    .small-loader { width:18px; height:18px; border:3px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius:9999px; animation:spin 1s linear infinite;}
    @keyframes spin { to { transform: rotate(360deg);} }

    /* page header */
    header.appbar {
      position: fixed;
      top:0; right:0; left:0; z-index:70; display:flex; align-items:center; justify-content:space-between;
      padding: 10px 14px; background: linear-gradient(0deg, rgba(0,0,0,0.0), rgba(0,0,0,0.35)); pointer-events:none;
    }
    header.appbar * { pointer-events:auto; }
    .snap-indicator { font-size:12px; color:var(--muted); }

    /* responsive adjustments */
    @media (min-width: 900px) {
      .reel { align-items:center; justify-content:center; }
      .reel .content-wrap { width: 480px; height: calc(100vh - 40px); border-radius: 12px; overflow:hidden; background:#000; }
    }
  </style>
</head>
<body class="bg-black">

  <header class="appbar">
    <a href="/chat_list" class="text-white text-lg flex items-center gap-2"><i class="fas fa-arrow-right"></i> العودة</a>
    <div class="snap-indicator">ريلز — تصفح</div>
    <a href="/create-reel" class="text-white text-lg"><i class="fas fa-plus"></i></a>
  </header>

  <!-- reels container -->
  <main id="reelsContainer" class="pt-12">
    <!-- Reels will be rendered here dynamically -->
    <div id="emptyState" class="reel" style="display:none;">
      <div class="text-center p-4">
        <i class="fas fa-video-slash text-4xl text-gray-500 mb-4"></i>
        <div class="text-gray-400">لا توجد ريلز بعد</div>
        <div class="text-sm text-gray-500 mt-2">أنشئ ريل جديداً <a href="/create-reel" class="text-cyan-400">هنا</a></div>
      </div>
    </div>
  </main>

  <!-- comments drawer -->
  <aside id="commentsDrawer" class="comments-drawer" aria-hidden="true">
    <div class="p-3 flex items-center justify-between border-b border-white/5">
      <div class="flex items-center gap-3">
        <button id="closeComments" class="p-2 text-gray-300"><i class="fas fa-chevron-down"></i></button>
        <div class="text-sm font-bold">التعليقات</div>
      </div>
      <div id="commentsLoader" style="display:none;"><div class="small-loader"></div></div>
    </div>
    <div id="commentsBody" class="comments-body">
      <!-- comments go here -->
    </div>
    <div class="p-3 border-t border-white/5">
      <form id="commentForm" class="flex gap-2">
        <input id="commentInput" class="flex-1 bg-[#0b0b0b] border border-white/5 rounded-xl px-3 py-2 text-sm text-white" placeholder="أكتب تعليقاً..." />
        <button type="submit" class="bg-cyan-500 px-4 py-2 rounded-xl font-bold">إرسال</button>
      </form>
    </div>
  </aside>

<script>
  // Client for /api/reels integration
  const container = document.getElementById('reelsContainer');
  const commentsDrawer = document.getElementById('commentsDrawer');
  const commentsBody = document.getElementById('commentsBody');
  const commentsLoader = document.getElementById('commentsLoader');
  const closeComments = document.getElementById('closeComments');
  const commentForm = document.getElementById('commentForm');
  const commentInput = document.getElementById('commentInput');
  const emptyState = document.getElementById('emptyState');

  let reels = [];
  let loading = false;
  let lastTimestamp = null;
  let activeReelId = null;
  let commentsForReel = null;

  // Helper: fetch with credentials (server uses session cookie)
  async function apiFetch(url, options = {}) {
    options.credentials = options.credentials || 'same-origin';
    options.headers = options.headers || {};
    return fetch(url, options);
  }

  // Render a single reel DOM
  function createReelEl(reel) {
    const el = document.createElement('section');
    el.className = 'reel';
    el.dataset.reelId = reel.reelId;

    const contentWrap = document.createElement('div');
    contentWrap.className = 'content-wrap w-full h-full relative';

    // Video element
    const video = document.createElement('video');
    video.src = reel.media?.url || '';
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.muted = true;
    video.loop = true;
    video.controls = false;
    video.preload = 'metadata';
    video.className = 'w-full h-full';

    // center double-tap heart
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '<i class="fas fa-heart text-white text-6xl" style="text-shadow:0 6px 18px rgba(0,0,0,0.6)"></i>';

    // overlay
    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="profile-thumb overflow-hidden">
          <img src="${reel.user?.profile_picture_url || '/default_profile.png'}" alt="${reel.user?.username || 'مستخدم'}" class="w-full h-full object-cover"/>
        </div>
        <div>
          <div class="username">${escapeHtml(reel.user?.username || 'مستخدم')}</div>
          <div class="text-xs text-gray-400"> ${timeAgo(reel.timestamp)} </div>
        </div>
      </div>
      <div class="desc mt-3">${escapeHtml(reel.description || '')}</div>
    `;

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `
      <div class="action-btn like-btn" title="إعجاب">
        <i class="fa-solid fa-heart text-2xl" style="color:${reel.is_liked ? '#ef4444' : 'white'}"></i>
        <div class="count">${reel.likes || 0}</div>
      </div>
      <div class="action-btn comment-btn" title="تعليقات">
        <i class="fa-regular fa-comment text-2xl"></i>
        <div class="count">${reel.commentsCount || 0}</div>
      </div>
      <div class="action-btn share-btn" title="مشاركة">
        <i class="fa-solid fa-paper-plane text-2xl"></i>
        <div class="count">مشاركة</div>
      </div>
    `;

    overlay.appendChild(meta);
    overlay.appendChild(actions);

    contentWrap.appendChild(video);
    contentWrap.appendChild(heart);
    contentWrap.appendChild(overlay);
    el.appendChild(contentWrap);

    // Event handlers
    // Play/pause handled by IntersectionObserver globally

    // Double-tap to like
    let lastTap = 0;
    contentWrap.addEventListener('touchend', (ev) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        // double tap detected
        showHeart(heart);
        toggleLike(reel, el, true);
      }
      lastTap = now;
    });

    // Desktop double click
    contentWrap.addEventListener('dblclick', () => {
      showHeart(heart);
      toggleLike(reel, el, true);
    });

    // Like button
    actions.querySelector('.like-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(reel, el, false);
    });

    // Comment button opens drawer
    actions.querySelector('.comment-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openComments(reel);
    });

    // share button copy link
    actions.querySelector('.share-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const shareUrl = `${location.origin}/reels?r=${reel.reelId}`;
      navigator.clipboard?.writeText(shareUrl).then(() => {
        toast('تم نسخ رابط الريل');
      }).catch(() => {
        toast('تعذر نسخ الرابط');
      });
    });

    return el;
  }

  // Show animated heart
  function showHeart(heartEl) {
    heartEl.classList.remove('show');
    void heartEl.offsetWidth;
    heartEl.classList.add('show');
    setTimeout(() => heartEl.classList.remove('show'), 700);
  }

  // Toggle like optimistically; if fromDoubleTap skip toggling UI twice
  async function toggleLike(reel, reelEl, fromDoubleTap) {
    const btn = reelEl.querySelector('.like-btn');
    const icon = btn.querySelector('i');
    const countEl = btn.querySelector('.count');

    // optimistic update
    const prevLiked = !!reel.is_liked;
    reel.is_liked = !prevLiked;
    reel.likes = Math.max(0, (reel.likes || 0) + (reel.is_liked ? 1 : -1));
    icon.style.color = reel.is_liked ? '#ef4444' : 'white';
    countEl.textContent = reel.likes;

    try {
      const resp = await apiFetch(`/api/reels/${reel.reelId}/like`, { method: 'POST' });
      if (!resp.ok) throw new Error('Request failed');
      const data = await resp.json();
      // update according to server response (in case of mismatch)
      if (data && data.newLikes !== undefined) {
        reel.likes = data.newLikes;
        countEl.textContent = reel.likes;
      }
    } catch (err) {
      // revert
      reel.is_liked = prevLiked;
      reel.likes = Math.max(0, (reel.likes || 0) + (prevLiked ? 0 : -1) ); // best effort
      icon.style.color = reel.is_liked ? '#ef4444' : 'white';
      countEl.textContent = reel.likes;
      toast('فشل إجراء الإعجاب');
    }
  }

  // Open comments drawer and load comments for a reel
  async function openComments(reel) {
    commentsDrawer.classList.add('open');
    commentsDrawer.setAttribute('aria-hidden', 'false');
    commentsForReel = reel;
    commentsBody.innerHTML = '';
    commentInput.value = '';
    commentsLoader.style.display = 'block';
    try {
      const resp = await apiFetch(`/api/reels/${reel.reelId}/comments`);
      const body = await resp.json();
      commentsLoader.style.display = 'none';
      if (!body.ok) {
        commentsBody.innerHTML = `<div class="p-3 text-gray-400">خطأ في جلب التعليقات</div>`;
        return;
      }
      const comments = body.comments || [];
      if (!comments.length) {
        commentsBody.innerHTML = `<div class="p-3 text-gray-400">لا توجد تعليقات بعد</div>`;
        return;
      }
      for (const c of comments) {
        const node = document.createElement('div');
        node.className = 'comment';
        node.innerHTML = `
          <div class="w-10 h-10 rounded-full overflow-hidden">
            <img src="${c.user?.profile_picture_url || '/default_profile.png'}" class="w-full h-full object-cover"/>
          </div>
          <div>
            <div class="text-sm font-semibold">${escapeHtml(c.user?.username || 'مستخدم')}</div>
            <div class="c-text">${escapeHtml(c.content)}</div>
            <div class="text-xs text-gray-500 mt-1">${timeAgo(c.timestamp)}</div>
          </div>
        `;
        commentsBody.appendChild(node);
      }
    } catch (err) {
      commentsLoader.style.display = 'none';
      commentsBody.innerHTML = `<div class="p-3 text-gray-400">خطأ في الاتصال</div>`;
    }
  }

  closeComments.addEventListener('click', () => {
    commentsDrawer.classList.remove('open');
    commentsDrawer.setAttribute('aria-hidden', 'true');
    commentsBody.innerHTML = '';
    commentsForReel = null;
  });

  // submit comment
  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = commentInput.value.trim();
    if (!text || !commentsForReel) return;
    commentInput.disabled = true;
    try {
      const resp = await apiFetch(`/api/reels/${commentsForReel.reelId}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: text })
      });
      const data = await resp.json();
      if (!data.ok) throw new Error('error');
      // prepend the new comment locally to drawer
      const c = data.comment;
      const node = document.createElement('div');
      node.className = 'comment';
      node.innerHTML = `
        <div class="w-10 h-10 rounded-full overflow-hidden">
          <img src="${c.user?.profile_picture_url || '/default_profile.png'}" class="w-full h-full object-cover"/>
        </div>
        <div>
          <div class="text-sm font-semibold">${escapeHtml(c.user?.username || 'مستخدم')}</div>
          <div class="c-text">${escapeHtml(c.content)}</div>
          <div class="text-xs text-gray-500 mt-1">الآن</div>
        </div>
      `;
      commentsBody.insertBefore(node, commentsBody.firstChild);
      commentInput.value = '';
      toast('تم إرسال التعليق');
    } catch (err) {
      toast('فشل إرسال التعليق');
    } finally {
      commentInput.disabled = false;
    }
  });

  // Simple toast
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 bg-white/5 backdrop-blur px-4 py-2 rounded-md text-sm';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // Escape helper
  function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Convert firebase timestamp (ServerValue.TIMESTAMP replaced on write) to relative time
  function timeAgo(ts) {
    if (!ts) return '';
    const t = Number(ts);
    const diff = Date.now() - t;
    const s = Math.floor(diff / 1000);
    if (s < 60) return 'الآن';
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}د`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}س`;
    const d = Math.floor(h / 24);
    return `${d}ي`;
  }

  // IntersectionObserver to autoplay visible reel
  const observerOptions = { root: container, threshold: 0.65 };
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const reelEl = entry.target;
      const video = reelEl.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        // pause previously active
        if (activeReelId && activeReelId !== reelEl.dataset.reelId) {
          const prev = container.querySelector(`.reel[data-reel-id="${activeReelId}"]`);
          if (prev) {
            const v = prev.querySelector('video');
            try { v?.pause(); } catch(e){}
          }
        }
        activeReelId = reelEl.dataset.reelId;
        video.play().catch(()=>{ /* may fail on autoplay if not muted; we set muted:true */ });
      } else {
        try { video.pause(); } catch(e){}
      }
    });
  }, observerOptions);

  // Load initial reels
  async function loadReels(limit = 8) {
    if (loading) return;
    loading = true;
    try {
      const q = lastTimestamp ? `?limit=${limit}&before=${lastTimestamp}` : `?limit=${limit}`;
      const resp = await apiFetch(`/api/reels${q}`);
      const body = await resp.json();
      if (!body.ok) throw new Error('failed');
      const newReels = body.reels || [];
      if (!newReels.length && reels.length === 0) {
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
      }
      // append DOM
      for (const r of newReels) {
        reels.push(r);
        const el = createReelEl(r);
        container.appendChild(el);
        io.observe(el);
      }
      lastTimestamp = body.lastTimestamp || (newReels.length ? newReels[newReels.length - 1].timestamp : lastTimestamp);
    } catch (err) {
      console.error('Error loading reels', err);
      toast('خطأ في جلب الريلز');
    } finally {
      loading = false;
    }
  }

  // infinite scroll: when near bottom, load more
  container.addEventListener('scroll', () => {
    if (loading) return;
    const nearBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 300;
    if (nearBottom) loadReels(6);
  });

  // initial call
  loadReels(6);

  // keyboard support for desktop: up/down
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') {
      e.preventDefault();
      container.scrollBy({ top: container.clientHeight, behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      container.scrollBy({ top: -container.clientHeight, behavior: 'smooth' });
    } else if (e.key === 'k') {
      // toggle mute on active reel
      const active = container.querySelector(`.reel[data-reel-id="${activeReelId}"]`);
      if (active) {
        const v = active.querySelector('video');
        if (v) v.muted = !v.muted;
        toast(v.muted ? 'كتم' : 'صوت');
      }
    }
  });

  // Accessibility: pause all videos when page hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      document.querySelectorAll('video').forEach(v => v.pause());
    } else {
      const active = container.querySelector(`.reel[data-reel-id="${activeReelId}"]`);
      active?.querySelector('video')?.play().catch(()=>{});
    }
  });
</script>

</body>
</html>
