<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Reels - Trimer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: black; color: white; font-family: 'Cairo', sans-serif; overflow: hidden; }
    .swiper { width: 100%; height: 100%; }
    .swiper-slide { background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    
    /* أنيميشن القلب */
    .big-heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 80px; color: white; text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; z-index: 20; }
    .big-heart.animate { animation: heart-pop 0.8s ease-out; }
    @keyframes heart-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }

    /* تأثير الزجاج لنافذة التأكيد */
    .glass-modal {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
    }

    /* نافذة التعليقات */
    .comments-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-radius: 16px 16px 0 0; height: 60vh; transform: translateY(100%); transition: transform 0.3s ease-out; z-index: 50; display: flex; flex-direction: column; }
    .comments-sheet.open { transform: translateY(0); }
    .overlay-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 40; display: none; }
    .overlay-backdrop.open { display: block; }
  </style>
</head>
<body>

  <div class="fixed top-4 right-4 z-30 flex gap-3">
    <a href="/chat_list" class="text-white text-xl p-2 drop-shadow-lg"><i class="fas fa-arrow-right"></i></a>
  </div>
  <div class="fixed top-4 left-4 z-30">
    <a href="/create-reel" class="text-white text-2xl p-2 drop-shadow-lg"><i class="fas fa-plus-circle"></i></a>
  </div>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper" id="reelsWrapper"></div>
  </div>

  <div id="deleteModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-6 bg-black/40 backdrop-blur-sm">
    <div class="glass-modal w-full max-w-xs p-6 text-center animate-in fade-in zoom-in duration-300">
      <div id="deleteContent">
        <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-trash-alt text-2xl"></i>
        </div>
        <h3 class="text-lg font-bold mb-2">حذف الريل؟</h3>
        <p class="text-gray-300 text-sm mb-6">لا يمكن التراجع عن هذه العملية بعد إتمامها.</p>
        <div class="flex flex-col gap-2">
          <button id="confirmDeleteBtn" class="bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold transition">حذف نهائي</button>
          <button onclick="closeDeleteModal()" class="text-white py-3 font-medium">إلغاء</button>
        </div>
      </div>
      <div id="deleteLoading" class="hidden py-8">
        <i class="fas fa-circle-notch fa-spin text-4xl text-red-500"></i>
        <p class="mt-4 text-sm text-gray-300">جاري الحذف...</p>
      </div>
    </div>
  </div>

  <div id="backdrop" class="overlay-backdrop"></div>
  <div id="commentsSheet" class="comments-sheet border-t border-white/10">
    <div class="p-4 border-b border-white/10 flex justify-between items-center">
      <h3 class="font-bold">التعليقات</h3>
      <button id="closeComments" class="text-gray-400"><i class="fas fa-times"></i></button>
    </div>
    <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    <div class="p-4 bg-black border-t border-white/10 flex gap-2">
      <input type="text" id="commentInput" placeholder="اكتب تعليقاً..." class="flex-1 bg-white/10 rounded-full px-4 py-2 outline-none text-sm">
      <button id="sendCommentBtn" class="text-blue-500 font-bold px-2">نشر</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  let swiperInstance = null;
  let currentUserId = null;
  let reelIdToDelete = null;

  document.addEventListener('DOMContentLoaded', loadReels);

  async function loadReels() {
    try {
      const res = await fetch('/api/reels/feed');
      const data = await res.json();
      if(data.ok) {
        currentUserId = data.currentUserId; // تخزين معرف المستخدم الحالي
        renderReels(data.reels);
        initSwiper();
      }
    } catch(e) { console.error(e); }
  }

  function renderReels(reels) {
    const wrapper = document.getElementById('reelsWrapper');
    wrapper.innerHTML = reels.map((reel) => `
      <div class="swiper-slide" data-id="${reel.reelId}">
        <video src="${reel.videoUrl}" class="w-full h-full object-cover" playsinline loop></video>
        
        <i class="fas fa-heart big-heart" id="bigHeart-${reel.reelId}"></i>
        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/80 pointer-events-none"></div>

        <div class="absolute left-4 bottom-24 flex flex-col items-center gap-6 z-20">
          <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="handleLike('${reel.reelId}')">
            <i class="${reel.is_liked ? 'fas text-red-500' : 'far text-white'} fa-heart text-3xl drop-shadow-lg" id="likeIcon-${reel.reelId}"></i>
            <span class="text-xs font-bold" id="likeCount-${reel.reelId}">${reel.likes}</span>
          </div>
          <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openComments('${reel.reelId}')">
            <i class="fas fa-comment-dots text-3xl text-white drop-shadow-lg"></i>
            <span class="text-xs font-bold">${reel.commentsCount}</span>
          </div>
          <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="shareReel('${reel.reelId}')">
            <i class="fas fa-share text-3xl text-white drop-shadow-lg"></i>
            <span class="text-xs font-bold">مشاركة</span>
          </div>
          
          ${reel.userId === currentUserId ? `
            <div class="flex flex-col items-center gap-1 cursor-pointer text-red-400 mt-2" onclick="openDeleteModal('${reel.reelId}')">
              <i class="fas fa-trash-alt text-2xl drop-shadow-lg"></i>
              <span class="text-[10px] font-bold">حذف</span>
            </div>
          ` : ''}
        </div>

        <div class="absolute right-4 bottom-8 left-16 z-20 text-right pointer-events-none">
          <div class="flex items-center gap-3 mb-2 pointer-events-auto cursor-pointer" onclick="window.location.href='/profile/${reel.userId}'">
            <img src="${reel.user.profile_picture_url}" class="w-10 h-10 rounded-full border border-white/50 object-cover">
            <h3 class="font-bold text-white text-base">@${reel.user.username}</h3>
          </div>
          <p class="text-sm text-gray-200 line-clamp-2 pr-1 drop-shadow-md">${reel.description}</p>
        </div>
      </div>
    `).join('');

    setupVideoControls();
  }

  function setupVideoControls() {
    document.querySelectorAll('video').forEach(vid => {
      let lastTap = 0;
      vid.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < 300) {
          const reelId = vid.closest('.swiper-slide').getAttribute('data-id');
          handleLike(reelId, true);
          animateHeart(reelId);
        } else {
          vid.paused ? vid.play() : vid.pause();
        }
        lastTap = now;
      });
    });
  }

  function initSwiper() {
    if(swiperInstance) swiperInstance.destroy();
    swiperInstance = new Swiper(".mySwiper", {
      direction: "vertical",
      mousewheel: true,
      keyboard: true,
      on: {
        slideChange: function () {
          document.querySelectorAll('video').forEach(v => { v.pause(); v.currentTime = 0; });
          const activeVid = this.slides[this.activeIndex].querySelector('video');
          if(activeVid) activeVid.play();
        }
      }
    });
  }

  // --- منطق الحذف ---
  window.openDeleteModal = function(reelId) {
    reelIdToDelete = reelId;
    const modal = document.getElementById('deleteModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  };

  window.closeDeleteModal = function() {
    document.getElementById('deleteModal').classList.add('hidden');
    document.getElementById('deleteModal').classList.remove('flex');
    document.getElementById('deleteContent').classList.remove('hidden');
    document.getElementById('deleteLoading').classList.add('hidden');
    reelIdToDelete = null;
  };

  document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
    if(!reelIdToDelete) return;
    
    // إظهار مؤشر التحميل
    document.getElementById('deleteContent').classList.add('hidden');
    document.getElementById('deleteLoading').classList.remove('hidden');

    try {
      const res = await fetch(`/api/reels/${reelIdToDelete}`, { method: 'DELETE' });
      const data = await res.json();
      if(data.ok) {
        // حذف الشريحة من الواجهة
        const slideIndex = swiperInstance.activeIndex;
        swiperInstance.removeSlide(slideIndex);
        closeDeleteModal();
      } else {
        alert('حدث خطأ أثناء الحذف');
        closeDeleteModal();
      }
    } catch(e) {
      console.error(e);
      closeDeleteModal();
    }
  });

  // --- لايك وتعليقات (نفس المنطق السابق) ---
  async function handleLike(reelId, forceLike = false) {
    const icon = document.getElementById(`likeIcon-${reelId}`);
    const countSpan = document.getElementById(`likeCount-${reelId}`);
    if (forceLike && icon.classList.contains('text-red-500')) return;
    
    const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
    const data = await res.json();
    if(data.ok) {
      icon.className = data.is_liked ? 'fas text-red-500 fa-heart text-3xl' : 'far text-white fa-heart text-3xl';
      countSpan.textContent = data.likes;
    }
  }

  function animateHeart(reelId) {
    const h = document.getElementById(`bigHeart-${reelId}`);
    h.classList.remove('animate'); void h.offsetWidth; h.classList.add('animate');
  }

  window.openComments = async function(reelId) {
    document.getElementById('backdrop').classList.add('open');
    document.getElementById('commentsSheet').classList.add('open');
    // ... جلب التعليقات كما في السابق ...
  };

  document.getElementById('closeComments').onclick = () => {
    document.getElementById('backdrop').classList.remove('open');
    document.getElementById('commentsSheet').classList.remove('open');
  };
</script>
</body>
</html>
