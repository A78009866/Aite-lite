<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trimer Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* إعدادات الصفحة الأساسية لمنع التمدد وإصلاح التمرير */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000; color: white;
            overflow: hidden; /* نمنع تمرير الجسم الرئيسي */
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* حاوية الريلز - هذا الجزء المسؤول عن التمرير العمودي */
        .reels-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch; /* تمرير ناعم على آيفون */
        }

        .reel-video-container {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* يحافظ على أبعاد الفيديو بدون قص */
        }

        /* نافذة التعليقات - سوداء تماماً */
        .comments-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 70%;
            background: #000;
            border-top: 1px solid #333;
            border-radius: 20px 20px 0 0;
            z-index: 9999;
            transition: bottom 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }
        .comments-sheet.active { bottom: 0; }

        .sheet-header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        .close-btn {
            position: absolute; left: 20px;
            font-size: 22px; cursor: pointer;
        }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .comment-input-area {
            padding: 15px;
            border-top: 1px solid #222;
            display: flex; gap: 10px;
            background: #000;
        }
        .comment-input-area input {
            flex: 1; background: #1a1a1a; border: 1px solid #333;
            border-radius: 20px; padding: 10px 15px; color: white; outline: none;
        }

        /* الأزرار والمعلومات */
        .reel-actions {
            position: absolute; bottom: 100px; left: 15px;
            display: flex; flex-direction: column; gap: 20px; z-index: 10;
        }
        .action-btn { color: white; text-align: center; cursor: pointer; font-size: 28px; }
        .action-btn span { display: block; font-size: 12px; margin-top: 5px; }
        .liked { color: #ff3040; }

        .reel-info {
            position: absolute; bottom: 40px; right: 15px;
            z-index: 10; text-align: right; width: 75%;
        }
        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .user-pic { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #fff; }

        .heart-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: white; opacity: 0; pointer-events: none;
        }
        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="reels-container" id="reelsWrapper">
    </div>

<div class="comments-sheet" id="commentSheet">
    <div class="sheet-header">
        <i class="fas fa-times close-btn" onclick="closeComments()"></i>
        <strong>التعليقات</strong>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="أضف تعليقاً...">
        <button onclick="postComment()" style="background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer;">نشر</button>
    </div>
</div>

<script>
    let activeReelId = null;

    // جلب البيانات عند التشغيل
    window.onload = async () => {
        await loadReels();
    };

    async function loadReels() {
        try {
            const res = await fetch('/api/reels');
            const data = await res.json();
            if (data.ok) {
                renderReels(data.reels);
                setupObserver();
            }
        } catch (e) { console.error("Load error:", e); }
    }

    function renderReels(reels) {
        const container = document.getElementById('reelsWrapper');
        container.innerHTML = reels.map(reel => `
            <div class="reel-video-container">
                <video src="${reel.media?.url}" loop muted playsinline 
                       onclick="handleVideoClick(this)" 
                       ondblclick="handleDoubleLike(event, '${reel.reelId}')"></video>
                
                <div class="heart-overlay" id="heart-${reel.reelId}"><i class="fas fa-heart"></i></div>

                <div class="reel-actions">
                    <div class="action-btn ${reel.is_liked ? 'liked' : ''}" id="like-btn-${reel.reelId}" onclick="toggleLike('${reel.reelId}')">
                        <i class="fas fa-heart"></i>
                        <span id="like-count-${reel.reelId}">${reel.likes || 0}</span>
                    </div>
                    <div class="action-btn" onclick="openComments('${reel.reelId}')">
                        <i class="fas fa-comment"></i>
                        <span>${reel.commentsCount || 0}</span>
                    </div>
                </div>

                <div class="reel-info">
                    <div class="user-row">
                        <img src="${reel.user.profile_picture_url}" class="user-pic">
                        <strong>${reel.user.username}</strong>
                    </div>
                    <p>${reel.content}</p>
                </div>
            </div>
        `).join('');
    }

    function handleVideoClick(video) {
        if (video.muted) video.muted = false; // تشغيل الصوت عند أول لمسة
        if (video.paused) video.play();
        else video.pause();
    }

    function setupObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.play().catch(() => {});
                } else {
                    entry.target.pause();
                }
            });
        }, { threshold: 0.8 });
        document.querySelectorAll('video').forEach(v => observer.observe(v));
    }

    // --- وظائف التعليقات ---
    async function openComments(reelId) {
        activeReelId = reelId;
        document.getElementById('commentSheet').classList.add('active');
        const list = document.getElementById('commentList');
        list.innerHTML = '<p style="text-align:center">جاري التحميل...</p>';

        try {
            const res = await fetch(`/api/reels/${reelId}/comments`);
            const data = await res.json();
            if (data.ok) {
                list.innerHTML = data.comments.length ? data.comments.map(c => `
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <img src="${c.user.profile_picture_url}" style="width:30px; height:30px; border-radius:50%;">
                        <div>
                            <div style="font-weight:bold; font-size:12px; color:#888;">${c.user.username}</div>
                            <div style="font-size:14px;">${c.content}</div>
                        </div>
                    </div>
                `).join('') : '<p style="text-align:center; color:#555;">لا توجد تعليقات</p>';
            }
        } catch(e) { list.innerHTML = 'خطأ في التحميل'; }
    }

    function closeComments() {
        document.getElementById('commentSheet').classList.remove('active');
    }

    async function postComment() {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();
        if (!content || !activeReelId) return;

        try {
            const res = await fetch(`/api/reels/${activeReelId}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            const data = await res.json();
            if (data.ok) {
                input.value = '';
                openComments(activeReelId); // إعادة تحديث القائمة
            }
        } catch (e) { alert("فشل إرسال التعليق"); }
    }

    // --- وظائف الإعجاب ---
    async function toggleLike(reelId) {
        try {
            const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                const btn = document.getElementById(`like-btn-${reelId}`);
                btn.classList.toggle('liked', data.action === 'liked');
                document.getElementById(`like-count-${reelId}`).innerText = data.newLikes;
            }
        } catch(e) {}
    }

    function handleDoubleLike(event, reelId) {
        const heart = document.getElementById(`heart-${reelId}`);
        heart.style.animation = 'heartPop 0.7s ease';
        setTimeout(() => heart.style.animation = '', 700);
        
        const btn = document.getElementById(`like-btn-${reelId}`);
        if (!btn.classList.contains('liked')) toggleLike(reelId);
    }
</script>
</body>
</html>
