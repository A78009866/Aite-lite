<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden; /* لمنع التمرير العادي */
        }
        
        /* حاوية الريلز العمودية */
        .reels-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        .reel-video-wrapper {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        /* الأزرار الجانبية */
        .side-actions {
            position: absolute;
            left: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 40;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s;
        }

        .action-btn:active { transform: scale(0.9); }

        /* النافذة السفلية للتعليقات */
        .comments-drawer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 70vh;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comments-drawer.open { transform: translateY(0); }

        .drawer-handle {
            width: 40px; height: 5px; background: #555;
            border-radius: 10px; margin: 15px auto;
        }
    </style>
</head>
<body>

    <div class="reels-container" id="reelsFeed">
        <div class="reel-video-wrapper">
            <video src="video_path_here.mp4" loop playsinline onclick="togglePlay(this)"></video>
            
            <div class="side-actions">
                <button class="action-btn" onclick="handleLike('reel_id', this)">
                    <i class="fas fa-heart text-xl"></i>
                    <span class="text-[10px] mt-1">12K</span>
                </button>
                <button class="action-btn" onclick="openComments('reel_id')">
                    <i class="fas fa-comment-dots text-xl"></i>
                    <span class="text-[10px] mt-1">450</span>
                </button>
                <button class="action-btn" onclick="copyLink('reel_url_here')">
                    <i class="fas fa-share text-xl"></i>
                    <span class="text-[10px] mt-1">نسخ</span>
                </button>
            </div>

            <div class="absolute bottom-10 right-5 text-white z-30">
                <h3 class="font-bold">@username</h3>
                <p class="text-sm opacity-90">وصف الريل الجذاب هنا... #Aite</p>
            </div>
        </div>
    </div>

    <div id="commentsDrawer" class="comments-drawer">
        <div class="drawer-handle" onclick="closeComments()"></div>
        <div class="flex flex-col h-full p-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">التعليقات</h3>
                <button onclick="closeComments()" class="text-gray-400 text-2xl">&times;</button>
            </div>
            
            <div id="drawerCommentsList" class="flex-grow overflow-y-auto space-y-4 mb-20">
                </div>

            <div class="absolute bottom-0 left-0 right-0 p-4 bg-[#111] border-t border-white/10">
                <div class="flex gap-2">
                    <input type="text" id="drawerCommentInput" placeholder="أضف تعليقاً..." 
                           class="flex-grow bg-white/10 rounded-full py-2 px-4 text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <button onclick="postDrawerComment()" class="bg-blue-600 text-white p-2 rounded-full w-10 h-10">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const drawer = document.getElementById('commentsDrawer');
        let currentReelId = null;

        // وظيفة تشغيل/إيقاف الفيديو عند النقر
        function togglePlay(video) {
            if (video.paused) video.play();
            else video.pause();
        }

        // فتح نافذة التعليقات
        function openComments(reelId) {
            currentReelId = reelId;
            drawer.classList.add('open');
            // استدعاء API لجلب التعليقات هنا
        }

        // إغلاق نافذة التعليقات
        function closeComments() {
            drawer.classList.remove('open');
        }

        // نسخ الرابط
        function copyLink(url) {
            navigator.clipboard.writeText(url);
            alert("تم نسخ رابط الريل!");
        }

        // إضافة تعليق من النافذة السفلية
        async function postDrawerComment() {
            const input = document.getElementById('drawerCommentInput');
            if(!input.value.trim()) return;

            const content = input.value;
            // إضافة التعليق للواجهة فوراً (Optimistic UI)
            const list = document.getElementById('drawerCommentsList');
            list.innerHTML += `
                <div class="flex gap-3 animate-pulse">
                    <div class="w-8 h-8 bg-gray-700 rounded-full"></div>
                    <div class="bg-white/5 p-3 rounded-2xl flex-grow">
                        <p class="text-xs text-gray-400">أنت</p>
                        <p class="text-sm text-white">${content}</p>
                    </div>
                </div>
            `;
            input.value = '';
            list.scrollTop = list.scrollHeight;

            // أرسل للـ API هنا
            // await fetch(`/api/reels/${currentReelId}/comment`, { ... });
        }

        // التعامل مع الإعجاب
        function handleLike(id, btn) {
            const icon = btn.querySelector('i');
            icon.classList.toggle('text-red-500');
            icon.classList.toggle('fas');
            icon.classList.toggle('far');
            // إرسال للـ API
        }
    </script>
</body>
</html>
