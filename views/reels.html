<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>ريلز — Reels</title>

  <!-- Tailwind + Font Awesome + Cairo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --glass: rgba(255,255,255,0.04);
      --glass-strong: rgba(255,255,255,0.06);
      --muted: #9ca3af;
      --accent: #06b6d4;
      --danger: #ef4444;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg,#000,#050505 60%);
      font-family: 'Cairo', sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden; /* make #reelsViewport the scroll container */
    }

    /* header */
    header.appbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.05));
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    header.appbar * { pointer-events: auto; }

    /* viewport that scrolls (only this element scrolls) */
    #reelsViewport {
      position: absolute;
      top: 56px; /* header height */
      right: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: y mandatory;
      background: transparent;
    }

    /* each reel takes the full available viewport (under header) */
    .reel {
      position: relative;
      height: calc(100vh - 56px);
      min-height: calc(100vh - 56px);
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.15));
      overflow: hidden;
    }

    /* content wrapper with glass effect */
    .content-wrap {
      width: 100%;
      height: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px) saturate(1.05);
    }

    .reel video, .reel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* translucent gradient overlay for readability */
    .top-gradient { position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.0) 30%); z-index:6; }
    .bottom-gradient { position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(180deg, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.6) 100%); z-index:6; }

    /* overlay info */
    .overlay {
      position: absolute;
      bottom: 18px;
      right: 16px;
      left: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }
    .meta {
      flex: 1;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta .username { font-weight:700; font-size: 15px; }
    .meta .desc {
      color: var(--muted);
      margin-top: 2px;
      max-height: 5.6em;
      overflow: hidden;
      line-height:1.25;
      font-size: 13px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .actions {
      width: 78px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      pointer-events: auto;
    }

    .action-btn {
      display:flex; flex-direction:column; align-items:center; gap:6px;
      color:#fff; cursor:pointer; user-select:none;
      width:54px; height:54px; border-radius:14px; justify-content:center;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: transform .12s ease, background .12s ease;
    }
    .action-btn:active { transform: scale(.96); }
    .action-btn .count { font-size:12px; color:var(--muted); }

    .profile-thumb {
      width:46px; height:46px; border-radius:9999px; overflow:hidden; border:2px solid rgba(255,255,255,0.06);
    }

    /* double-tap heart animation */
    .heart {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
      transform: scale(0); opacity:0; z-index: 20;
    }
    .heart.show { animation: pop 600ms ease forwards; }
    @keyframes pop {
      0% { transform: scale(0.5); opacity:0; }
      30% { transform: scale(1.15); opacity:1; }
      100% { transform: scale(1); opacity:0; }
    }

    /* comments drawer */
    .comments-drawer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(6,6,6,0.95), rgba(0,0,0,0.98));
      border-top-left-radius: 16px; border-top-right-radius: 16px;
      max-height: 72vh;
      transform: translateY(100%);
      transition: transform .28s ease;
      z-index: 80;
      color: #fff;
      overflow: hidden;
      display:flex;
      flex-direction:column;
    }
    .comments-drawer.open { transform: translateY(0); }
    .comments-body { overflow-y:auto; padding: 12px 16px; flex:1; }
    .comment { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .comment .c-text { color:var(--muted); font-size:13px; }

    /* loader */
    .small-loader { width:18px; height:18px; border:3px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius:9999px; animation:spin 1s linear infinite;}
    @keyframes spin { to { transform: rotate(360deg);} }

    /* responsive */
    @media (min-width: 900px) {
      .content-wrap { width: 720px; border-radius: 16px; }
      .actions { width: 88px; }
      .profile-thumb { width:54px; height:54px; }
    }
  </style>
</head>
<body>

  <header class="appbar">
    <a href="/chat_list" class="text-white text-lg flex items-center gap-2"><i class="fas fa-arrow-right"></i> العودة</a>
    <div class="snap-indicator text-sm text-gray-300">ريلز — تصفح</div>
    <a href="/create-reel" class="text-white text-lg"><i class="fas fa-plus"></i></a>
  </header>

  <!-- scrollable viewport (only this element scrolls) -->
  <main id="reelsViewport" aria-label="Reels viewport">
    <div id="emptyState" class="reel" style="display:none;">
      <div class="text-center p-4">
        <i class="fas fa-video-slash text-4xl text-gray-500 mb-4"></i>
        <div class="text-gray-400">لا توجد ريلز بعد</div>
        <div class="text-sm text-gray-500 mt-2">أنشئ ريل جديداً <a href="/create-reel" class="text-cyan-400">هنا</a></div>
      </div>
    </div>
  </main>

  <!-- comments drawer -->
  <aside id="commentsDrawer" class="comments-drawer" aria-hidden="true">
    <div class="p-3 flex items-center justify-between border-b border-white/5">
      <div class="flex items-center gap-3">
        <button id="closeComments" class="p-2 text-gray-300"><i class="fas fa-chevron-down"></i></button>
        <div class="text-sm font-bold">التعليقات</div>
      </div>
      <div id="commentsLoader" style="display:none;"><div class="small-loader"></div></div>
    </div>
    <div id="commentsBody" class="comments-body">
      <!-- comments go here -->
    </div>
    <div class="p-3 border-t border-white/5">
      <form id="commentForm" class="flex gap-2">
        <input id="commentInput" class="flex-1 bg-[#0b0b0b] border border-white/5 rounded-xl px-3 py-2 text-sm text-white" placeholder="أكتب تعليقاً..." />
        <button type="submit" class="bg-cyan-500 px-4 py-2 rounded-xl font-bold">إرسال</button>
      </form>
    </div>
  </aside>

<script>
  // DOM references
  const viewport = document.getElementById('reelsViewport');
  const commentsDrawer = document.getElementById('commentsDrawer');
  const commentsBody = document.getElementById('commentsBody');
  const commentsLoader = document.getElementById('commentsLoader');
  const closeComments = document.getElementById('closeComments');
  const commentForm = document.getElementById('commentForm');
  const commentInput = document.getElementById('commentInput');
  const emptyState = document.getElementById('emptyState');

  let reels = [];
  let loading = false;
  let lastTimestamp = null;
  let activeReelId = null;
  let commentsForReel = null;

  // fetch wrapper (send session cookie)
  async function apiFetch(url, options = {}) {
    options.credentials = options.credentials || 'same-origin';
    return fetch(url, options);
  }

  // Create reel element
  function createReelEl(reel) {
    const el = document.createElement('section');
    el.className = 'reel';
    el.dataset.reelId = reel.reelId;

    const contentWrap = document.createElement('div');
    contentWrap.className = 'content-wrap';

    // video (muted to allow autoplay)
    const video = document.createElement('video');
    video.src = reel.media?.url || '';
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.muted = true;
    video.loop = true;
    video.controls = false;
    video.preload = 'metadata';
    video.className = '';

    // gradients
    const topG = document.createElement('div'); topG.className = 'top-gradient';
    const bottomG = document.createElement('div'); bottomG.className = 'bottom-gradient';

    // heart animation
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '<i class="fas fa-heart text-white text-6xl" style="text-shadow:0 6px 18px rgba(0,0,0,0.6)"></i>';

    // overlay
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="meta">
        <div class="flex items-center gap-3">
          <div class="profile-thumb overflow-hidden" style="flex:0 0 auto;">
            <img src="${escapeHtml(reel.user?.profile_picture_url || '/default_profile.png')}" alt="${escapeHtml(reel.user?.username || 'مستخدم')}" style="width:100%;height:100%;object-fit:cover"/>
          </div>
          <div>
            <div class="username">${escapeHtml(reel.user?.username || 'مستخدم')}</div>
            <div class="text-xs text-gray-400">${timeAgo(reel.timestamp)}</div>
          </div>
        </div>
        <div class="desc">${escapeHtml(reel.description || '')}</div>
      </div>
      <div class="actions">
        <div class="action-btn like-btn" title="إعجاب">
          <i class="fa-solid fa-heart text-2xl" style="color:${reel.is_liked ? '#ef4444' : 'white'}"></i>
          <div class="count">${reel.likes || 0}</div>
        </div>
        <div class="action-btn comment-btn" title="تعليقات">
          <i class="fa-regular fa-comment text-2xl"></i>
          <div class="count">${reel.commentsCount || 0}</div>
        </div>
        <div class="action-btn share-btn" title="مشاركة">
          <i class="fa-solid fa-paper-plane text-2xl"></i>
          <div class="count">مشاركة</div>
        </div>
      </div>
    `;

    contentWrap.appendChild(video);
    contentWrap.appendChild(topG);
    contentWrap.appendChild(bottomG);
    contentWrap.appendChild(heart);
    contentWrap.appendChild(overlay);
    el.appendChild(contentWrap);

    // event handlers
    // double-tap / double-click
    let lastTap = 0;
    contentWrap.addEventListener('touchend', (ev) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        showHeart(heart);
        toggleLike(reel, el);
      }
      lastTap = now;
    });

    contentWrap.addEventListener('dblclick', () => {
      showHeart(heart);
      toggleLike(reel, el);
    });

    // like button
    contentWrap.querySelector('.like-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(reel, el);
    });

    // comment button
    contentWrap.querySelector('.comment-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openComments(reel);
    });

    // share button
    contentWrap.querySelector('.share-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const shareUrl = `${location.origin}/reels?r=${reel.reelId}`;
      navigator.clipboard?.writeText(shareUrl).then(() => {
        toast('تم نسخ رابط الريل');
      }).catch(() => toast('تعذر نسخ الرابط'));
    });

    return el;
  }

  // Show animated heart
  function showHeart(heartEl) {
    heartEl.classList.remove('show');
    void heartEl.offsetWidth;
    heartEl.classList.add('show');
    setTimeout(() => heartEl.classList.remove('show'), 700);
  }

  // Toggle like (optimistic)
  async function toggleLike(reel, reelEl) {
    const btn = reelEl.querySelector('.like-btn');
    const icon = btn.querySelector('i');
    const countEl = btn.querySelector('.count');

    const prevLiked = !!reel.is_liked;
    reel.is_liked = !prevLiked;
    reel.likes = Math.max(0, (reel.likes || 0) + (reel.is_liked ? 1 : -1));
    icon.style.color = reel.is_liked ? '#ef4444' : 'white';
    countEl.textContent = reel.likes;

    try {
      const resp = await apiFetch(`/api/reels/${reel.reelId}/like`, { method: 'POST' });
      if (!resp.ok) throw new Error('Request failed');
      const data = await resp.json();
      if (data && data.newLikes !== undefined) {
        reel.likes = data.newLikes;
        countEl.textContent = reel.likes;
      }
    } catch (err) {
      // revert if failed
      reel.is_liked = prevLiked;
      reel.likes = Math.max(0, (reel.likes || 0) + (prevLiked ? 0 : -1));
      icon.style.color = reel.is_liked ? '#ef4444' : 'white';
      countEl.textContent = reel.likes;
      toast('فشل إجراء الإعجاب');
    }
  }

  // open comments drawer and render ALL comments robustly
  async function openComments(reel) {
    commentsDrawer.classList.add('open');
    commentsDrawer.setAttribute('aria-hidden', 'false');
    commentsForReel = reel;
    commentsBody.innerHTML = '';
    commentInput.value = '';
    commentsLoader.style.display = 'block';

    try {
      const resp = await apiFetch(`/api/reels/${reel.reelId}/comments`);
      const body = await resp.json();
      commentsLoader.style.display = 'none';
      if (!body.ok) {
        commentsBody.innerHTML = `<div class="p-3 text-gray-400">خطأ في جلب التعليقات</div>`;
        return;
      }

      // server may return comments as array or object; normalize to array
      let comments = body.comments || [];
      if (!Array.isArray(comments)) {
        comments = Object.values(comments || {});
      }

      // sort newest first (server returns ordered by timestamp but normalize anyway)
      comments.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

      if (!comments.length) {
        commentsBody.innerHTML = `<div class="p-3 text-gray-400">لا توجد تعليقات بعد</div>`;
        return;
      }

      // render all comments
      const frag = document.createDocumentFragment();
      for (const c of comments) {
        const node = document.createElement('div');
        node.className = 'comment';
        node.innerHTML = `
          <div class="w-10 h-10 rounded-full overflow-hidden">
            <img src="${escapeHtml(c.user?.profile_picture_url || '/default_profile.png')}" class="w-full h-full object-cover"/>
          </div>
          <div>
            <div class="text-sm font-semibold">${escapeHtml(c.user?.username || 'مستخدم')}</div>
            <div class="c-text">${escapeHtml(c.content)}</div>
            <div class="text-xs text-gray-500 mt-1">${timeAgo(c.timestamp)}</div>
          </div>
        `;
        frag.appendChild(node);
      }
      commentsBody.appendChild(frag);

    } catch (err) {
      commentsLoader.style.display = 'none';
      commentsBody.innerHTML = `<div class="p-3 text-gray-400">خطأ في الاتصال</div>`;
    }
  }

  closeComments.addEventListener('click', () => {
    commentsDrawer.classList.remove('open');
    commentsDrawer.setAttribute('aria-hidden', 'true');
    commentsBody.innerHTML = '';
    commentsForReel = null;
  });

  // submit comment
  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = commentInput.value.trim();
    if (!text || !commentsForReel) return;
    commentInput.disabled = true;
    try {
      const resp = await apiFetch(`/api/reels/${commentsForReel.reelId}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: text })
      });
      const data = await resp.json();
      if (!data.ok) throw new Error('error');

      // prepend new comment locally
      const c = data.comment;
      const node = document.createElement('div');
      node.className = 'comment';
      node.innerHTML = `
        <div class="w-10 h-10 rounded-full overflow-hidden">
          <img src="${escapeHtml(c.user?.profile_picture_url || '/default_profile.png')}" class="w-full h-full object-cover"/>
        </div>
        <div>
          <div class="text-sm font-semibold">${escapeHtml(c.user?.username || 'مستخدم')}</div>
          <div class="c-text">${escapeHtml(c.content)}</div>
          <div class="text-xs text-gray-500 mt-1">الآن</div>
        </div>
      `;
      commentsBody.insertBefore(node, commentsBody.firstChild);
      commentInput.value = '';
      toast('تم إرسال التعليق');

      // update comments count shown on reel UI
      const reelEl = document.querySelector(`.reel[data-reel-id="${commentsForReel.reelId}"]`);
      if (reelEl) {
        const countEl = reelEl.querySelector('.comment-btn .count');
        if (countEl) {
          // increment safely
          const current = Number(countEl.textContent || 0) + 1;
          countEl.textContent = current;
          // also update local model
          commentsForReel.commentsCount = current;
        }
      }

    } catch (err) {
      toast('فشل إرسال التعليق');
    } finally {
      commentInput.disabled = false;
    }
  });

  // Simple toast
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 bg-white/5 backdrop-blur px-4 py-2 rounded-md text-sm';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // Escape helper
  function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Convert timestamp to relative
  function timeAgo(ts) {
    if (!ts) return '';
    const t = Number(ts);
    const diff = Date.now() - t;
    const s = Math.floor(diff / 1000);
    if (s < 60) return 'الآن';
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}د`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}س`;
    const d = Math.floor(h / 24);
    return `${d}ي`;
  }

  // IntersectionObserver to autoplay visible reel (root is viewport)
  const observerOptions = { root: viewport, threshold: 0.66 };
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const reelEl = entry.target;
      const video = reelEl.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        // pause previously active
        if (activeReelId && activeReelId !== reelEl.dataset.reelId) {
          const prev = viewport.querySelector(`.reel[data-reel-id="${activeReelId}"]`);
          if (prev) {
            const v = prev.querySelector('video');
            try { v?.pause(); } catch(e){}
          }
        }
        activeReelId = reelEl.dataset.reelId;
        video.play().catch(()=>{ /* autoplay may fail if not allowed; videos are muted by default */ });
      } else {
        try { video.pause(); } catch(e){}
      }
    });
  }, observerOptions);

  // Load reels from server
  async function loadReels(limit = 8) {
    if (loading) return;
    loading = true;
    try {
      const q = lastTimestamp ? `?limit=${limit}&before=${lastTimestamp}` : `?limit=${limit}`;
      const resp = await apiFetch(`/api/reels${q}`);
      const body = await resp.json();
      if (!body.ok) throw new Error('failed');
      const newReels = body.reels || [];
      if (!newReels.length && reels.length === 0) {
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
      }

      // append DOM elements
      for (const r of newReels) {
        reels.push(r);
        const el = createReelEl(r);
        viewport.appendChild(el);
        io.observe(el);
      }

      // update lastTimestamp safely
      lastTimestamp = body.lastTimestamp || (newReels.length ? newReels[newReels.length - 1].timestamp : lastTimestamp);

      // if only one reel visible because viewport height isn't large enough: ensure container scroll works
      // (no action needed here because CSS ensures viewport is scrollable)
    } catch (err) {
      console.error('Error loading reels', err);
      toast('خطأ في جلب الريلز');
    } finally {
      loading = false;
    }
  }

  // infinite scroll when near bottom
  viewport.addEventListener('scroll', () => {
    if (loading) return;
    const nearBottom = viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 300;
    if (nearBottom) loadReels(6);
  });

  // initial load
  loadReels(6);

  // keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') {
      e.preventDefault();
      viewport.scrollBy({ top: viewport.clientHeight, behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      viewport.scrollBy({ top: -viewport.clientHeight, behavior: 'smooth' });
    } else if (e.key === 'k') {
      const active = viewport.querySelector(`.reel[data-reel-id="${activeReelId}"]`);
      if (active) {
        const v = active.querySelector('video');
        if (v) {
          v.muted = !v.muted;
          toast(v.muted ? 'كتم' : 'صوت');
        }
      }
    }
  });

  // pause videos on page hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      document.querySelectorAll('video').forEach(v => v.pause());
    } else {
      const active = viewport.querySelector(`.reel[data-reel-id="${activeReelId}"]`);
      active?.querySelector('video')?.play().catch(()=>{});
    }
  });

  // make sure touch swipes are smooth on mobile
  viewport.addEventListener('touchstart', ()=>{}, {passive:true});
</script>

</body>
</html>
