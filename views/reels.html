<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>ريل — استعرض</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.06);
      --accent: #3b82f6;
    }
    body { font-family: 'Cairo', sans-serif; background: #000; color: #fff; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    /* Fullscreen vertical snap container (TikTok-like) */
    .reels-container {
      height: calc(100vh - 64px);
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .reel-item {
      height: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Glass card overlay */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Double-tap animated heart */
    .heart-anim {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      transition: transform 300ms cubic-bezier(.2,.9,.2,1), opacity 300ms;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    }
    .heart-anim.show {
      transform: translate(-50%, -50%) scale(1.15);
      opacity: 1;
    }

    /* controls hide scrollbar on desktop */
    .reels-container::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Top bar -->
  <header class="h-16 flex items-center justify-between px-4 glass">
    <div class="flex items-center gap-3">
      <a id="backBtn" href="/chat_list" title="العودة للرئيسية" class="p-2 rounded-full hover:bg-white/5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
      </a>
    </div>

    <div class="text-center">
      <h1 class="font-bold text-sm">استعراض الريلز</h1>
    </div>

    <div class="flex items-center gap-3">
      <a id="newReelBtn" href="/create-reel" title="نشر ريل جديد" class="p-2 rounded-full hover:bg-white/5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M11 5v6H5v2h6v6h2v-6h6v-2h-6V5z"/></svg>
      </a>
    </div>
  </header>

  <!-- Reels area -->
  <main class="reels-container" id="reelsContainer" aria-live="polite">
    <!-- Reel items rendered here -->
    <div id="emptyState" class="reel-item glass hidden flex-col gap-4 p-6 text-center max-w-2xl mx-auto rounded-lg">
      <p class="text-gray-300">لا توجد ريل بعد</p>
      <a href="/create-reel" class="mt-2 px-4 py-2 bg-blue-600 rounded-md text-white">انشر أول ريل</a>
    </div>
  </main>

  <!-- Bottom action bar for desktop (floating) -->
  <div id="floatingBar" class="hidden md:flex fixed left-1/2 -translate-x-1/2 bottom-6 gap-3 glass px-4 py-2 rounded-full items-center shadow-lg">
    <span class="text-sm text-gray-300">اسحب للأعلى/الأسفل للتنقّل • دوبل-تاب للإعجاب</span>
  </div>

  <!-- Comments modal (bottom sheet) -->
  <div id="commentsModal" class="fixed inset-0 z-40 hidden">
    <div id="cmBackdrop" class="absolute inset-0 bg-black/60" onclick="closeComments()"></div>
    <div class="absolute left-0 right-0 bottom-0 max-h-[85vh] rounded-t-xl p-4 glass overflow-hidden flex flex-col" style="min-height:200px;">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold">التعليقات</h3>
        <button onclick="closeComments()" class="p-2 rounded-full hover:bg-white/5">
          ✕
        </button>
      </div>

      <div id="commentsList" class="flex-1 overflow-auto space-y-3 px-1 pb-3"></div>

      <div class="mt-2 flex gap-2">
        <input id="commentInput" placeholder="اكتب تعليق..." class="flex-1 bg-transparent border border-white/8 rounded-xl px-3 py-2 outline-none text-sm" />
        <button id="sendCommentBtn" class="px-4 py-2 bg-blue-600 rounded-xl">إرسال</button>
      </div>
    </div>
  </div>

<script>
/*
  Reels viewer script
  - vertical scroll-snap list
  - lazy load videos when they enter viewport
  - double-tap to like with heart animation
  - like button, comments bottom sheet, share (copy link), delete (owner only)
  - responsive glass UI
*/

const reelsContainer = document.getElementById('reelsContainer');
const commentsModal = document.getElementById('commentsModal');
const commentsList = document.getElementById('commentsList');
const commentInput = document.getElementById('commentInput');
const sendCommentBtn = document.getElementById('sendCommentBtn');
const emptyState = document.getElementById('emptyState');

let currentUser = null; // will contain { id, username, ... }
let reels = []; // loaded reels
let pageLimit = 6;
let lastTimestamp = null;
let isLoading = false;
let activeReelIdForComments = null;

// fetch current user profile
async function loadCurrentUser() {
  try {
    const res = await fetch('/api/profile', { credentials: 'same-origin' });
    if (!res.ok) return;
    const data = await res.json();
    currentUser = data;
  } catch (err) {
    console.warn('Could not fetch profile', err);
  }
}

// load reels (pagination)
async function loadReels() {
  if (isLoading) return;
  isLoading = true;
  const url = new URL('/api/reels', location.origin);
  url.searchParams.set('limit', pageLimit);
  if (lastTimestamp) url.searchParams.set('before', lastTimestamp);
  try {
    const res = await fetch(url.toString(), { credentials: 'same-origin' });
    if (!res.ok) throw new Error('فشل جلب الريلز');
    const data = await res.json();
    if (data.reels && data.reels.length) {
      appendReels(data.reels);
      lastTimestamp = data.lastTimestamp;
    } else if (reels.length === 0) {
      // no reels at all
      emptyState.classList.remove('hidden');
    }
  } catch (err) {
    console.error(err);
  } finally {
    isLoading = false;
  }
}

function appendReels(newReels) {
  newReels.forEach(r => {
    // skip duplicates
    if (reels.some(x => x.reelId === r.reelId)) return;
    reels.push(r);
    const node = createReelNode(r);
    reelsContainer.appendChild(node);
  });
  // after adding, lazy-load videos in view
  observeVideos();
}

// create DOM for a reel
function createReelNode(r) {
  const item = document.createElement('section');
  item.className = 'reel-item';
  item.dataset.reelId = r.reelId;

  // full-bleed video container
  item.innerHTML = `
    <div class="absolute inset-0 bg-black/60"></div>

    <div class="relative w-full h-full flex items-center justify-center">
      <video class="w-full h-full object-contain bg-black" playsinline muted loop preload="metadata" data-src="${r.media.url}"></video>

      <!-- top left: publisher -->
      <div class="absolute top-4 left-4 md:top-6 md:left-6 flex items-center gap-3 glass px-3 py-2 rounded-full">
        <img src="${r.user.profile_picture_url || '/default.png'}" alt="${r.user.username}" class="w-10 h-10 rounded-full object-cover border border-white/6">
        <div class="text-left">
          <div class="text-sm font-semibold">${escapeHtml(r.user.username)}</div>
          <div class="text-xs text-gray-300">${timeAgo(r.timestamp)}</div>
        </div>
      </div>

      <!-- right actions -->
      <div class="absolute top-1/2 -translate-y-1/2 right-4 md:right-8 flex flex-col items-center gap-4">
        <button class="likeBtn flex flex-col items-center gap-1 glass w-14 h-14 rounded-xl p-2" title="إعجاب">
          <svg class="likeIcon w-6 h-6" viewBox="0 0 24 24" fill="${r.is_liked ? 'url(#likedGradient)' : 'none'}" stroke="white" stroke-width="1.4" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s-7.5-4.5-9.5-8a5 5 0 0 1 8-6 5 5 0 0 1 8 6C19.5 16.5 12 21 12 21z" /></svg>
          <span class="text-[12px]">${r.likes || 0}</span>
        </button>

        <button class="commentBtn glass w-12 h-12 rounded-xl flex items-center justify-center" title="التعليقات">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg"><path d="M21 15a4 4 0 0 1-4 4H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>

        <button class="shareBtn glass w-12 h-12 rounded-xl flex items-center justify-center" title="مشاركة">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
        </button>

        <button class="moreBtn glass w-12 h-12 rounded-xl flex items-center justify-center hidden" title="المزيد">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>

        <button class="deleteBtn glass w-12 h-12 rounded-xl flex items-center justify-center text-red-400 hidden" title="حذف الريل">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18"/><path d="M8 6v14a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>

      <!-- bottom left: description and actions -->
      <div class="absolute left-4 bottom-6 right-4 md:bottom-10 md:left-8 md:right-20">
        <div class="glass p-3 rounded-xl max-w-3xl">
          <div class="text-sm mb-2">${escapeHtml(r.description || '')}</div>
          <div class="flex items-center gap-3 text-xs text-gray-300">
            <span>تعليقات: ${r.commentsCount || 0}</span>
            <span>•</span>
            <span>مشاهدات: —</span>
          </div>
        </div>
      </div>

      <!-- heart animation placeholder -->
      <svg viewBox="0 0 24 24" class="heart-anim" width="120" height="120" fill="red" stroke="rgba(255,255,255,0.9)" stroke-width="0.5" id="heart-${r.reelId}">
        <path d="M12 21s-7.5-4.5-9.5-8a5 5 0 0 1 8-6 5 5 0 0 1 8 6C19.5 16.5 12 21 12 21z"/>
      </svg>
    </div>
  `;

  // events binding (after element exists)
  setTimeout(() => {
    const video = item.querySelector('video');
    const likeBtn = item.querySelector('.likeBtn');
    const commentBtn = item.querySelector('.commentBtn');
    const shareBtn = item.querySelector('.shareBtn');
    const deleteBtn = item.querySelector('.deleteBtn');

    // show delete only when owner
    if (currentUser && r.user && currentUser.id === r.user.id) {
      deleteBtn.classList.remove('hidden');
    }

    // like button click
    likeBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await toggleLike(r.reelId, likeBtn, r);
    });

    // comments
    commentBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      openComments(r.reelId);
    });

    // share
    shareBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const link = `${location.origin}/reels?r=${r.reelId}`;
      try {
        await navigator.clipboard.writeText(link);
        showToast('تم نسخ الرابط');
      } catch {
        // fallback
        prompt('انسخ الرابط:', link);
      }
    });

    // delete
    deleteBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if (!confirm('هل تريد حذف هذا الريل نهائياً؟')) return;
      try {
        const res = await fetch(`/api/reels/${r.reelId}`, { method: 'DELETE', credentials: 'same-origin' });
        if (!res.ok) throw new Error('فشل الحذف');
        // remove from DOM & reels array
        item.remove();
        reels = reels.filter(x => x.reelId !== r.reelId);
        showToast('تم الحذف');
      } catch (err) {
        console.error(err);
        alert('فشل حذف الريل');
      }
    });

    // double-tap detection
    bindDoubleTapLike(item, video, r);

    // when clicked once on center: play/pause toggle
    item.addEventListener('click', (ev) => {
      // ignore if double-tap handled (we will briefly pause)
      if (video.paused) video.play(); else video.pause();
    });

  }, 50);

  return item;
}

// escape HTML to avoid injection
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// simple time ago
function timeAgo(ts) {
  try {
    const t = Number(ts) || Date.now();
    let diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff} ثانية`;
    if (diff < 3600) return `${Math.floor(diff/60)} دقيقة`;
    if (diff < 86400) return `${Math.floor(diff/3600)} ساعة`;
    return `${Math.floor(diff/86400)} يوم`;
  } catch { return ''; }
}

// observe videos to lazy-load and auto-play when visible
let io = null;
function observeVideos() {
  if (io) io.disconnect();
  const options = { root: reelsContainer, threshold: 0.6 };
  io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (!video) return;
      if (entry.isIntersecting) {
        // load src
        if (!video.src || video.src === '') {
          video.src = video.dataset.src;
        }
        // play and mute
        video.muted = false; // unmuted for better experience, change if needed
        video.play().catch(()=>{});
      } else {
        // pause when out of view
        video.pause();
      }
    });
  }, options);

  document.querySelectorAll('video[data-src]').forEach(v => io.observe(v));
}

// double-tap like logic (touch & mouse)
function bindDoubleTapLike(container, video, reel) {
  let lastTap = 0;
  const maxDelay = 300;
  const heart = container.querySelector(`#heart-${reel.reelId}`);

  container.addEventListener('touchend', async (e) => {
    const now = Date.now();
    if (now - lastTap < maxDelay) {
      // double tap
      showHeartAtTouch(e.changedTouches[0], heart, container);
      await toggleLike(reel.reelId, container.querySelector('.likeBtn'), reel, true);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  // also support mouse double click
  container.addEventListener('dblclick', async (e) => {
    showHeartAtTouch(e, heart, container);
    await toggleLike(reel.reelId, container.querySelector('.likeBtn'), reel, true);
  });
}

function showHeartAtTouch(e, heartSvg, container) {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX || e.pageX) - rect.left;
  const y = (e.clientY || e.pageY) - rect.top;
  heartSvg.style.left = `${x}px`;
  heartSvg.style.top = `${y}px`;
  heartSvg.classList.add('show');
  setTimeout(()=> heartSvg.classList.remove('show'), 700);
}

// toggle like (calls API)
async function toggleLike(reelId, likeBtnEl, reelObj, quiet=false) {
  try {
    const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST', credentials: 'same-origin' });
    if (!res.ok) throw new Error('like fail');
    const data = await res.json();
    // update UI: like count and fill
    const countEl = likeBtnEl.querySelector('span');
    let count = Number(countEl.textContent) || 0;
    if (data.action === 'liked') count += 1;
    else if (data.action === 'unliked') count = Math.max(0, count - 1);
    countEl.textContent = count;

    // toggle icon fill (simple visual)
    if (data.action === 'liked') {
      likeBtnEl.querySelector('.likeIcon').style.fill = 'url(#likedGradient)';
    } else {
      likeBtnEl.querySelector('.likeIcon').style.fill = 'none';
    }

    if (!quiet) showToast(data.action === 'liked' ? 'أعجبتك' : 'تم إلغاء الإعجاب');
  } catch (err) {
    console.error(err);
  }
}

// comments modal control
function openComments(reelId) {
  activeReelIdForComments = reelId;
  commentsModal.classList.remove('hidden');
  commentInput.value = '';
  loadCommentsForReel(reelId);
}

function closeComments() {
  commentsModal.classList.add('hidden');
  commentsList.innerHTML = '';
  activeReelIdForComments = null;
}

// load comments
async function loadCommentsForReel(reelId) {
  commentsList.innerHTML = '<div class="text-gray-400 text-center py-6">جارٍ تحميل التعليقات...</div>';
  try {
    const res = await fetch(`/api/reels/${reelId}/comments`, { credentials: 'same-origin' });
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    if (!data.ok) throw new Error('no ok');
    renderComments(data.comments || []);
  } catch (err) {
    commentsList.innerHTML = '<div class="text-red-400 text-center py-6">فشل تحميل التعليقات</div>';
  }
}

function renderComments(comments) {
  if (!comments.length) {
    commentsList.innerHTML = '<div class="text-gray-300 text-center py-6">لا توجد تعليقات بعد</div>';
    return;
  }
  commentsList.innerHTML = '';
  comments.forEach(c => {
    const node = document.createElement('div');
    node.className = 'flex gap-3 items-start';
    node.innerHTML = `
      <img src="${c.user?.profile_picture_url || '/default.png'}" class="w-9 h-9 rounded-full object-cover" />
      <div>
        <div class="text-sm font-semibold">${escapeHtml(c.user?.username || 'مستخدم')}</div>
        <div class="text-sm text-gray-300">${escapeHtml(c.content)}</div>
        <div class="text-xs text-gray-400 mt-1">${timeAgo(c.timestamp)}</div>
      </div>
    `;
    commentsList.appendChild(node);
  });
}

// send comment
sendCommentBtn.addEventListener('click', async () => {
  const text = commentInput.value.trim();
  if (!text || !activeReelIdForComments) return;
  sendCommentBtn.disabled = true;
  try {
    const res = await fetch(`/api/reels/${activeReelIdForComments}/comment`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ content: text })
    });
    if (!res.ok) throw new Error('fail comment');
    const data = await res.json();
    // prepend the new comment
    loadCommentsForReel(activeReelIdForComments);
    commentInput.value = '';
    showToast('تم إضافة التعليق');
  } catch (err) {
    console.error(err);
    alert('فشل إرسال التعليق');
  } finally {
    sendCommentBtn.disabled = false;
  }
});

// observe scroll to load more when near end
reelsContainer.addEventListener('scroll', () => {
  const bottom = reelsContainer.scrollHeight - reelsContainer.scrollTop - reelsContainer.clientHeight;
  if (bottom < 200 && !isLoading) loadReels();
});

// small toast
let toastTimer = null;
function showToast(text) {
  let t = document.getElementById('__reel_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '__reel_toast';
    t.className = 'fixed left-1/2 -translate-x-1/2 bottom-32 glass px-4 py-2 rounded-md text-sm';
    document.body.appendChild(t);
  }
  t.textContent = text;
  t.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.style.opacity = '0', 2000);
}

// initial boot
(async function init() {
  await loadCurrentUser();
  await loadReels();

  // keyboard navigation (optional)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      reelsContainer.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
    } else if (e.key === 'ArrowUp') {
      reelsContainer.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
    } else if (e.key === 'Escape') {
      closeComments();
    }
  });

  // ensure first video plays muted automatically on some browsers
  setTimeout(() => {
    const v = document.querySelector('video[data-src]');
    if (v) {
      if (!v.src) v.src = v.dataset.src;
      v.muted = false;
      v.play().catch(()=>{});
    }
  }, 500);
})();

</script>
</body>
</html>
