<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ريلز — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <style>
    html,body { height:100%; background: linear-gradient(180deg,#000,#060606); color:#e6eef8; margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .glass-bg { background: rgba(8,8,10,0.5); backdrop-filter: blur(12px); border:1px solid rgba(255,255,255,0.05); }
    .reel-card { height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; scroll-snap-align:start; }
    .reel-media { width:100%; height:100vh; object-fit:cover; background:#000; display:block; }
    /* تحريك الأزرار: أنزلها قليلاً لتكون فوق البروفايل مباشرة */
    .right-controls { position:absolute; bottom:120px; right:12px; display:flex; flex-direction:column; gap:14px; z-index:40; align-items:center; }
    .control-btn { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.06); cursor:pointer; transition: transform .12s ease, box-shadow .12s ease; }
    .control-btn:active { transform: scale(.96); }
    .bottom-info { position:absolute; left:0; right:0; bottom:20px; padding:16px; z-index:40; display:flex; gap:12px; align-items:flex-end; pointer-events:none; }
    .reel-meta { flex:1; text-align:right; pointer-events:auto; }
    .comments-sheet { position:fixed; left:0; right:0; bottom:0; height:60vh; transform: translateY(100%); transition: transform .28s ease; z-index:60; display:flex; flex-direction:column; }
    .comments-sheet.open { transform: translateY(0%); }
    .comments-sheet .sheet-inner { height:100%; overflow:auto; padding:16px; }
    .copy-toast { position:fixed; left:50%; transform:translateX(-50%); bottom:90px; z-index:80; background:rgba(0,0,0,0.7); color:#fff; padding:8px 14px; border-radius:10px; display:none; }
    .profile-pill { display:flex; gap:10px; align-items:center; pointer-events:auto; }
    .heart-burst { position:absolute; transform: translate(-50%,-50%) scale(0.9); left:50%; top:50%; z-index:80; pointer-events:none; animation: burst .6s ease-out forwards; }
    @keyframes burst {
      0% { transform:translate(-50%,-50%) scale(.6); opacity:1; }
      60% { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
      100% { transform:translate(-50%,-50%) scale(1.6); opacity:0; }
    }

    /* تحسين نافذة التعليقات: رأس ثابت وداخل قابل للتمرير */
    .sheet-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.04); }
    .comment-item { display:flex; gap:12px; align-items:flex-start; }
    .comment-box { background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); padding:10px; border-radius:12px; color:#e6eef8; }
    .comment-input-row { display:flex; gap:8px; align-items:center; padding:12px; border-top:1px solid rgba(255,255,255,0.03); }
    .comment-input { flex:1; background:transparent; border-radius:999px; padding:10px 14px; border:1px solid rgba(255,255,255,0.04); color:#fff; outline:none; }
    .small-muted { color:#9aa4b2; font-size:.9rem; }

    /* smooth scroll snapping container */
    #reelsContainer { height:100vh; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }

    /* زر تشغيل/إيقاف صغير */
    .play-overlay { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:30; pointer-events:none; opacity:0; transition:opacity .12s ease; }
    .show-play-overlay { opacity:1; }

    /* عندما يكون الفيديو في وضع المؤقت (موقوف) نظهر أيقونة التشغيل الشفافة */
    .video-paused .play-overlay { opacity:1; pointer-events:none; }

    /* جعل عناصر البوتوم قابلة للنقر */
    .bottom-info * { pointer-events:auto; }

  </style>
</head>
<body>

  <header class="glass-bg p-3 fixed top-4 left-4 right-4 z-50 rounded-xl flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/chat_list" class="text-white font-bold app-logo text-lg">Aite</a>
    </div>
    <div class="flex items-center gap-2">
      <a href="/create-reel" class="px-4 py-2 bg-blue-500 text-white rounded-full">إنشاء ريل</a>
    </div>
  </header>

  <main id="reelsContainer" class="h-screen">
    <!-- Reels will be injected here -->
  </main>

  <div id="commentsSheet" class="comments-sheet glass-bg rounded-t-2xl shadow-2xl">
    <div class="sheet-inner">
      <div class="sheet-header">
        <div>
          <h3 class="text-lg font-semibold">التعليقات</h3>
          <div class="small-muted" id="commentsCountMeta">—</div>
        </div>
        <div>
          <button id="closeCommentsBtn" class="text-gray-300 px-3 py-1 rounded-md glass-bg"><i class="fas fa-times"></i></button>
        </div>
      </div>

      <div id="commentsList" class="mt-4 space-y-3" aria-live="polite"></div>

      <div class="comment-input-row">
        <input id="commentInput" class="comment-input" placeholder="أضف تعليقاً..." aria-label="تعليق"/>
        <button id="sendCommentBtn" class="px-4 py-2 bg-blue-500 rounded-full text-white"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <div id="copyToast" class="copy-toast rounded-lg">تم نسخ الرابط</div>

<script>
  // متغيرات الحالة
  let currentUserId = null;
  let reels = [];
  let loading = false;
  let lastTimestamp = null;
  const reelsContainer = document.getElementById('reelsContainer');
  const commentsSheet = document.getElementById('commentsSheet');
  const commentsList = document.getElementById('commentsList');
  const commentInput = document.getElementById('commentInput');
  const sendCommentBtn = document.getElementById('sendCommentBtn');
  const closeCommentsBtn = document.getElementById('closeCommentsBtn');
  const copyToast = document.getElementById('copyToast');
  const commentsCountMeta = document.getElementById('commentsCountMeta');
  let activeReelIdForComments = null;

  // جلب بروفايل المستخدم الحالي
  fetch('/api/profile').then(r => r.ok ? r.json() : null).then(data => {
    if (data && data.id) currentUserId = data.id;
  }).catch(()=>{});

  // ---------- إنشاء كرت الريل مع الأحداث المحسنة ----------
  function createReelElement(reel) {
    const wrapper = document.createElement('section');
    wrapper.className = 'reel-card snap-start relative';
    wrapper.dataset.reelId = reel.reelId;

    // media element
    let mediaEl;
    if (reel.media && reel.media.type === 'video') {
      mediaEl = document.createElement('video');
      mediaEl.id = `video-${reel.reelId}`;
      mediaEl.className = 'reel-media';
      mediaEl.src = reel.media.url;
      mediaEl.setAttribute('playsinline', '');
      mediaEl.preload = 'metadata';
      mediaEl.muted = true; // سيعمل التشغيل التلقائي في بعض المتصفحات عند وجود muted
      mediaEl.controls = false;
    } else if (reel.media && reel.media.type === 'image') {
      mediaEl = document.createElement('img');
      mediaEl.className = 'reel-media';
      mediaEl.src = reel.media.url;
      mediaEl.alt = 'ريل';
    } else {
      mediaEl = document.createElement('div');
      mediaEl.className = 'reel-media flex items-center justify-center';
      mediaEl.textContent = 'محتوى غير مدعوم';
    }

    wrapper.appendChild(mediaEl);

    // play overlay (large)
    const playOverlay = document.createElement('div');
    playOverlay.className = 'play-overlay';
    playOverlay.innerHTML = `<i class="fas fa-play text-white text-6xl"></i>`;
    wrapper.appendChild(playOverlay);

    // right controls (moved lower via CSS)
    const rightControls = document.createElement('div');
    rightControls.className = 'right-controls';
    rightControls.innerHTML = `
      <div class="control-btn like-btn" title="إعجاب" data-liked="${reel.is_liked ? '1' : '0'}">
        <i class="${reel.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-white'}"></i>
      </div>
      <div class="control-btn comment-btn" title="التعليقات">
        <i class="far fa-comment-dots text-white"></i>
      </div>
      <div class="control-btn copy-btn" title="نسخ الرابط">
        <i class="fas fa-link text-white"></i>
      </div>
    `;
    wrapper.appendChild(rightControls);

    // bottom meta (profile + description)
    const bottomInfo = document.createElement('div');
    bottomInfo.className = 'bottom-info';
    bottomInfo.innerHTML = `
      <div class="reel-meta">
        <div class="profile-pill">
          <img src="${reel.user.profile_picture_url}" class="w-12 h-12 rounded-full border border-white/10" alt="${reel.user.username}">
          <div>
            <div class="text-white font-semibold">${reel.user.username}</div>
            <div class="text-gray-300 text-sm mt-1">${escapeHtml(reel.description || '')}</div>
          </div>
        </div>
        <div class="text-gray-300 text-sm mt-3 flex gap-4 items-center">
          <span class="likes-count"><i class="fas fa-heart ml-1"></i> ${reel.likes || 0}</span>
          <span class="comments-count"><i class="far fa-comment-dots ml-1"></i> ${reel.commentsCount || 0}</span>
        </div>
      </div>
    `;
    wrapper.appendChild(bottomInfo);

    // ---------- أحداث التفاعل ----------
    // like button click
    rightControls.querySelector('.like-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      await toggleLike(reel.reelId, wrapper);
    });

    // comment open
    rightControls.querySelector('.comment-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openComments(reel.reelId);
    });

    // copy link
    rightControls.querySelector('.copy-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const url = `${location.origin}/reel.html?reelId=${reel.reelId}`;
      navigator.clipboard?.writeText(url).then(()=> showCopyToast()).catch(()=> showCopyToast());
    });

    // play/pause & double-tap to like (mobile-friendly)
    if (mediaEl.tagName === 'VIDEO' || mediaEl.tagName === 'AUDIO') {
      // single tap toggles play/pause; double tap likes
      let lastTap = 0;
      mediaEl.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const now = Date.now();
        const dt = now - lastTap;
        if (dt < 300 && dt > 0) {
          // double tap -> like
          spawnHeart(wrapper);
          toggleLike(reel.reelId, wrapper);
          lastTap = 0;
        } else {
          // single tap -> toggle play/pause after short delay to detect double-tap
          setTimeout(() => {
            if (Date.now() - lastTap >= 300) {
              toggleVideoPlay(mediaEl, wrapper);
            }
          }, 310);
          lastTap = now;
        }
      });

      // show play overlay when paused
      mediaEl.addEventListener('play', () => {
        wrapper.classList.remove('video-paused');
        playOverlay.classList.remove('show-play-overlay');
        mediaEl.muted = false; // unmute when playing (if desired)
      });
      mediaEl.addEventListener('pause', () => {
        wrapper.classList.add('video-paused');
        playOverlay.classList.add('show-play-overlay');
      });

      // stop other videos when this plays
      mediaEl.addEventListener('play', () => {
        document.querySelectorAll('video').forEach(v => { if (v !== mediaEl) { v.pause(); v.muted = true; }});
      });
    } else {
      // clicks on images toggle nothing, but we can allow opening in new tab on double click
      wrapper.addEventListener('dblclick', (e)=> {
        e.stopPropagation();
        toggleLike(reel.reelId, wrapper);
        spawnHeart(wrapper);
      });
    }

    return wrapper;
  }

  // spawn heart animation on double tap like
  function spawnHeart(wrapper) {
    const heart = document.createElement('div');
    heart.className = 'heart-burst';
    heart.innerHTML = `<i class="fas fa-heart text-red-500 text-6xl"></i>`;
    wrapper.appendChild(heart);
    setTimeout(()=> heart.remove(), 700);
  }

  // toggle video play/pause helper
  function toggleVideoPlay(videoEl, wrapper) {
    if (!videoEl) return;
    if (videoEl.paused) {
      // pause other media
      document.querySelectorAll('video').forEach(v => { if (v !== videoEl) { v.pause(); }});
      // play this
      videoEl.play().catch(()=>{});
    } else {
      videoEl.pause();
    }
  }

  // like/unlike
  async function toggleLike(reelId, wrapper) {
    const btn = wrapper.querySelector('.like-btn');
    btn.classList.add('opacity-60');
    try {
      const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
      const json = await res.json();
      if (res.ok && json.ok) {
        const likesCountEl = wrapper.querySelector('.likes-count');
        likesCountEl.innerHTML = `<i class="fas fa-heart ml-1"></i> ${json.newLikes}`;
        const icon = btn.querySelector('i');
        if (json.action === 'liked') {
          icon.className = 'fas fa-heart text-red-500';
        } else {
          icon.className = 'far fa-heart text-white';
        }
      }
    } catch (err) {
      console.error('Like err', err);
    } finally {
      btn.classList.remove('opacity-60');
    }
  }

  // ---------- التعليقات: فتح و تحميل و ارسال ----------
  async function openComments(reelId) {
    activeReelIdForComments = reelId;
    commentsList.innerHTML = '<div class="text-center small-muted p-4">جاري تحميل التعليقات...</div>';
    commentsSheet.classList.add('open');
    document.body.style.overflow = 'hidden';
    commentsCountMeta.textContent = '...';
    try {
      const res = await fetch(`/api/reels/${reelId}/comments`);
      const json = await res.json();
      if (res.ok && json.ok) {
        commentsList.innerHTML = '';
        if (!json.comments || json.comments.length === 0) {
          commentsList.innerHTML = '<div class="text-center small-muted p-4">لا توجد تعليقات بعد.</div>';
        } else {
          json.comments.forEach(c => commentsList.insertAdjacentHTML('beforeend', createCommentHTML(c)));
          // scroll to bottom
          commentsList.scrollTop = commentsList.scrollHeight;
        }
        commentsCountMeta.textContent = `${json.comments ? json.comments.length : 0} تعليق`;
        // update comment count badge in reel card
        updateReelCommentsCountInCard(reelId, json.comments ? json.comments.length : 0);
      } else {
        commentsList.innerHTML = '<div class="text-center text-red-400 p-4">فشل في تحميل التعليقات.</div>';
      }
    } catch (err) {
      commentsList.innerHTML = '<div class="text-center text-red-400 p-4">خطأ في الاتصال.</div>';
    }
  }

  function createCommentHTML(c) {
    const date = new Date(c.timestamp).toLocaleString('ar-EG', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    return `
      <div class="comment-item">
        <img src="${c.user.profile_picture_url}" class="w-10 h-10 rounded-full" />
        <div class="comment-box">
          <div class="flex justify-between items-center mb-1">
            <div class="text-white font-semibold">${c.user.username}</div>
            <div class="small-muted text-xs">${date}</div>
          </div>
          <div class="text-gray-200">${escapeHtml(c.content)}</div>
        </div>
      </div>
    `;
  }

  closeCommentsBtn.addEventListener('click', closeComments);

  function closeComments() {
    commentsSheet.classList.remove('open');
    document.body.style.overflow = 'auto';
    activeReelIdForComments = null;
    commentInput.value = '';
    commentsList.innerHTML = '';
  }

  sendCommentBtn.addEventListener('click', postComment);
  commentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); postComment(); }});

  async function postComment() {
    const content = commentInput.value.trim();
    if (!content || !activeReelIdForComments) return;
    sendCommentBtn.disabled = true;
    sendCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    // Optimistic UI: append temporary comment
    const tempComment = {
      user: { username: 'أنت', profile_picture_url: '/https://res.cloudinary.com/duixjs8az/image/upload/v1765009560/post_media/1765009560909-default_profile.png' },
      content: content,
      timestamp: Date.now()
    };
    commentsList.insertAdjacentHTML('beforeend', createCommentHTML(tempComment));
    commentsList.scrollTop = commentsList.scrollHeight;
    try {
      const res = await fetch(`/api/reels/${activeReelIdForComments}/comment`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ content })
      });
      const json = await res.json();
      if (res.ok && json.ok) {
        // replace temporary last comment with server comment (simple approach: remove last and append returned)
        // (for robust solution you'd track IDs)
        // remove last (optimistic) item
        const items = commentsList.querySelectorAll('.comment-item');
        if (items.length) items[items.length-1].remove();
        commentsList.insertAdjacentHTML('beforeend', createCommentHTML(json.comment));
        updateReelCommentsCountInCard(activeReelIdForComments, json.newComments);
        commentsCountMeta.textContent = `${json.newComments} تعليق`;
      } else {
        alert(json.error || 'فشل في إضافة التعليق.');
        // remove optimistic
        const items = commentsList.querySelectorAll('.comment-item');
        if (items.length) items[items.length-1].remove();
      }
    } catch (err) {
      alert('فشل الاتصال بالخادم.');
      const items = commentsList.querySelectorAll('.comment-item');
      if (items.length) items[items.length-1].remove();
    } finally {
      sendCommentBtn.disabled = false;
      sendCommentBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      commentInput.value = '';
    }
  }

  function updateReelCommentsCountInCard(reelId, count) {
    const reelCard = document.querySelector(`section[data-reel-id="${reelId}"]`);
    if (reelCard) {
      const el = reelCard.querySelector('.comments-count');
      if (el) el.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${count}`;
    }
  }

  // ---------- IntersectionObserver لتشغيل الفيديوهات تلقائياً ----------
  let videoObserver = null;
  function observeVideos() {
    if (videoObserver) videoObserver.disconnect();
    const options = { root: null, rootMargin: '0px', threshold: 0.65 };
    videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const media = entry.target;
        if (media.tagName !== 'VIDEO') return;
        if (entry.isIntersecting) {
          // pause others, play current
          document.querySelectorAll('video').forEach(v => { if (v !== media) { v.pause(); v.muted = true; }});
          media.play().catch(()=>{});
          media.muted = false;
        } else {
          media.pause();
        }
      });
    }, options);

    document.querySelectorAll('.reel-media').forEach(el => {
      if (el.tagName === 'VIDEO') videoObserver.observe(el);
    });
  }

  // ---------- تحميل الريلز مع تمرير واحد لكل صفحة (تسلسل) ----------
  async function loadReels(initial = false) {
    if (loading) return;
    loading = true;
    const params = new URLSearchParams();
    params.set('limit', 6);
    if (lastTimestamp && !initial) params.set('before', lastTimestamp);
    try {
      const res = await fetch('/api/reels?' + params.toString());
      const json = await res.json();
      if (res.ok && json.ok) {
        if (json.reels && json.reels.length) {
          json.reels.forEach(r => {
            reels.push(r);
            reelsContainer.appendChild(createReelElement(r));
          });
          lastTimestamp = json.lastTimestamp;
          // observe videos after injection
          observeVideos();
          // Attach one-by-one scroll handlers
          attachOneByOneScroll();
        } else if (initial) {
          reelsContainer.innerHTML = '<div class="h-screen flex items-center justify-center text-gray-400">لا توجد ريلز حتى الآن.</div>';
        }
      }
    } catch (err) {
      console.error('Error loading reels', err);
    } finally {
      loading = false;
    }
  }

  // ---------- تمرير صفحة بصفحة: استمع للـ wheel و touch ----------
  let scrollCooldown = false;
  function attachOneByOneScroll() {
    // mouse wheel
    reelsContainer.addEventListener('wheel', (e) => {
      if (scrollCooldown) return;
      const delta = e.deltaY;
      if (Math.abs(delta) < 10) return;
      e.preventDefault();
      if (delta > 0) scrollToNext(); else scrollToPrev();
      scrollCooldown = true;
      setTimeout(()=> scrollCooldown = false, 380);
    }, { passive: false });

    // touch swipe
    let startY = null;
    reelsContainer.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) startY = e.touches[0].clientY;
    }, { passive: true });
    reelsContainer.addEventListener('touchend', (e) => {
      if (startY === null) return;
      const endY = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : startY;
      const diff = startY - endY;
      if (Math.abs(diff) > 50) {
        if (diff > 0) scrollToNext(); else scrollToPrev();
      }
      startY = null;
    }, { passive: true });

    // keyboard arrows
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); scrollToNext(); }
      if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); scrollToPrev(); }
    });
  }

  function scrollToNext() {
    const cards = Array.from(document.querySelectorAll('.reel-card'));
    const top = window.scrollY || document.documentElement.scrollTop;
    // find currently visible index
    let curIndex = cards.findIndex(c => {
      const r = c.getBoundingClientRect();
      return r.top >= -10 && r.top < window.innerHeight*0.5;
    });
    if (curIndex === -1) curIndex = 0;
    const nextIndex = Math.min(cards.length - 1, curIndex + 1);
    if (nextIndex === cards.length - 1 && !loading) {
      // load more when nearing end
      loadReels();
    }
    cards[nextIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function scrollToPrev() {
    const cards = Array.from(document.querySelectorAll('.reel-card'));
    let curIndex = cards.findIndex(c => {
      const r = c.getBoundingClientRect();
      return r.top >= -10 && r.top < window.innerHeight*0.5;
    });
    if (curIndex === -1) curIndex = 0;
    const prevIndex = Math.max(0, curIndex - 1);
    cards[prevIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // show copy toast
  function showCopyToast() {
    copyToast.style.display = 'block';
    setTimeout(()=> { copyToast.style.display = 'none'; }, 1400);
  }

  // safety escape
  function escapeHtml(text) {
    const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' };
    return String(text || '').replace(/[&<>"']/g, m => map[m]);
  }

  // initial load
  loadReels(true);

  // ensure we observe videos again if new nodes are loaded dynamically later
  // (loadReels calls observeVideos internally)

</script>

</body>
</html>
