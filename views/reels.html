<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Reels - Trimer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: black; color: white; overflow: hidden; }
    
    /* Scroll Snap Logic */
    .reels-container {
      height: 100vh;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    .reel-item {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hide Scrollbar */
    .reels-container::-webkit-scrollbar { display: none; }
    .reels-container { -ms-overflow-style: none; scrollbar-width: none; }

    /* Heart Animation */
    .big-heart {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px;
      color: white; /* TikTok style uses white heart with shadow usually, or red */
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 20;
    }
    .big-heart.animate {
      animation: heart-pop 0.8s ease-out;
    }
    @keyframes heart-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; transform: rotate(-10deg); }
      30% { transform: translate(-50%, -50%) scale(1.2); transform: rotate(10deg); }
      50% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }

    /* Comments Sheet */
    .comments-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #111;
      border-radius: 16px 16px 0 0;
      height: 60vh;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      z-index: 50;
      display: flex; flex-direction: column;
    }
    .comments-sheet.open { transform: translateY(0); }
    .overlay-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 40; display: none;
    }
    .overlay-backdrop.open { display: block; }
  </style>
</head>
<body>

  <div class="fixed top-4 right-4 z-30 flex gap-4">
    <a href="/chat_list" class="text-white text-xl drop-shadow-lg"><i class="fas fa-arrow-right"></i></a>
  </div>
  
  <div class="fixed top-4 left-4 z-30">
      <a href="/create-reel" class="text-white text-2xl drop-shadow-lg"><i class="fas fa-camera"></i></a>
  </div>

  <div id="reelsContainer" class="reels-container">
    </div>

  <div id="backdrop" class="overlay-backdrop"></div>
  <div id="commentsSheet" class="comments-sheet border-t border-gray-800">
    <div class="p-3 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm">التعليقات</h3>
      <button id="closeComments" class="text-gray-400"><i class="fas fa-times"></i></button>
    </div>
    <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4">
      </div>
    <div class="p-3 border-t border-gray-800 flex items-center gap-2 bg-black">
      <input type="text" id="commentInput" placeholder="أضف تعليقاً..." 
             class="flex-1 bg-[#222] text-white text-sm rounded-full px-4 py-2 outline-none focus:ring-1 focus:ring-blue-500">
      <button id="sendCommentBtn" class="text-blue-500 font-bold text-sm disabled:opacity-50">نشر</button>
    </div>
  </div>

<script>
  const reelsContainer = document.getElementById('reelsContainer');
  let currentReels = [];
  let currentReelIdForComments = null;

  // عند التحميل
  document.addEventListener('DOMContentLoaded', loadReels);

  async function loadReels() {
    try {
      const res = await fetch('/api/reels/feed');
      const data = await res.json();
      if(data.ok && data.reels.length > 0) {
        currentReels = data.reels;
        renderReels(data.reels);
        setupIntersectionObserver();
      } else {
        reelsContainer.innerHTML = '<div class="h-screen flex items-center justify-center text-gray-500">لا توجد ريلز حالياً</div>';
      }
    } catch(e) {
      console.error(e);
    }
  }

  function renderReels(reels) {
    reelsContainer.innerHTML = reels.map((reel, index) => `
      <div class="reel-item" data-id="${reel.reelId}" data-index="${index}">
        <video src="${reel.videoUrl}" class="w-full h-full object-cover cursor-pointer" loop playsinline></video>
        
        <i class="fas fa-heart big-heart" id="bigHeart-${reel.reelId}"></i>

        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/90 pointer-events-none"></div>

        <div class="absolute left-4 bottom-20 flex flex-col items-center gap-6 z-20">
          
          <div class="relative">
             <img src="${reel.user.profile_picture_url}" class="w-10 h-10 rounded-full border border-white">
             <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-red-600 rounded-full w-4 h-4 flex items-center justify-center text-[10px]">
               <i class="fas fa-plus text-white"></i>
             </div>
          </div>

          <div class="flex flex-col items-center gap-1">
            <button onclick="handleLike('${reel.reelId}')" class="text-3xl drop-shadow-md transition transform active:scale-75">
              <i class="${reel.is_liked ? 'fas text-red-500' : 'far text-white'} fa-heart" id="likeIcon-${reel.reelId}"></i>
            </button>
            <span class="text-xs font-bold" id="likeCount-${reel.reelId}">${reel.likes}</span>
          </div>

          <div class="flex flex-col items-center gap-1">
            <button onclick="openComments('${reel.reelId}')" class="text-3xl text-white drop-shadow-md transition active:scale-90">
              <i class="fas fa-comment-dots"></i>
            </button>
            <span class="text-xs font-bold" id="commentCount-${reel.reelId}">${reel.commentsCount}</span>
          </div>

          <div class="flex flex-col items-center gap-1">
            <button onclick="shareReel('${reel.reelId}')" class="text-3xl text-white drop-shadow-md transition active:scale-90">
              <i class="fas fa-share"></i>
            </button>
            <span class="text-xs font-bold">مشاركة</span>
          </div>

        </div>

        <div class="absolute right-4 bottom-8 left-16 z-20 text-right pointer-events-none">
          <div class="flex items-center gap-2 mb-2 pointer-events-auto">
            <h3 class="font-bold text-white shadow-black drop-shadow-md">@${reel.user.username}</h3>
          </div>
          <p class="text-sm text-gray-200 line-clamp-2 leading-relaxed drop-shadow-md dir-rtl">
            ${reel.description}
          </p>
        </div>

        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/40 p-4 rounded-full pointer-events-none opacity-0 transition" id="muteIcon-${reel.reelId}">
           <i class="fas fa-volume-mute text-white text-2xl"></i>
        </div>

      </div>
    `).join('');

    // Attach Double Tap Listeners
    document.querySelectorAll('.reel-item video').forEach(vid => {
      let lastTap = 0;
      
      // Toggle Play/Pause on single Click
      vid.addEventListener('click', (e) => {
        const now = new Date().getTime();
        const timesince = now - lastTap;
        
        if (timesince < 300 && timesince > 0) {
          // Double Tap Detected
          const reelItem = vid.closest('.reel-item');
          const reelId = reelItem.getAttribute('data-id');
          
          // Trigger Like Logic
          handleLike(reelId, true); // true = force like animation
          
          // Show Animation
          const heart = document.getElementById(`bigHeart-${reelId}`);
          heart.classList.remove('animate');
          void heart.offsetWidth; // trigger reflow
          heart.classList.add('animate');
          
        } else {
          // Single Tap (Toggle Play/Mute logic can go here)
           if(vid.paused) vid.play(); else vid.pause();
        }
        lastTap = new Date().getTime();
      });
    });
  }

  // --- Scroll & Video Handling ---
  function setupIntersectionObserver() {
    const options = { threshold: 0.6 };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const vid = entry.target.querySelector('video');
        if (entry.isIntersecting) {
          vid.currentTime = 0; // Start from beginning or continue
          vid.play().catch(err => console.log('Autoplay blocked:', err));
        } else {
          vid.pause();
        }
      });
    }, options);

    document.querySelectorAll('.reel-item').forEach(item => observer.observe(item));
  }

  // --- Actions ---

  async function handleLike(reelId, isDoubleTap = false) {
    const icon = document.getElementById(`likeIcon-${reelId}`);
    const countSpan = document.getElementById(`likeCount-${reelId}`);
    
    // UI Optimistic Update
    const isCurrentlyLiked = icon.classList.contains('fas') && icon.classList.contains('text-red-500');
    
    // If double tap and already liked, don't toggle off, just animate
    if (isDoubleTap && isCurrentlyLiked) return; 

    // Toggle
    if (isCurrentlyLiked) {
      icon.classList.remove('fas', 'text-red-500');
      icon.classList.add('far', 'text-white');
      countSpan.textContent = parseInt(countSpan.textContent) - 1;
    } else {
      icon.classList.remove('far', 'text-white');
      icon.classList.add('fas', 'text-red-500');
      countSpan.textContent = parseInt(countSpan.textContent) + 1;
    }

    // API Call
    try {
      await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
    } catch (e) { console.error(e); }
  }

  function shareReel(reelId) {
    const url = `${window.location.origin}/reels?r=${reelId}`;
    navigator.clipboard.writeText(url).then(() => {
      alert('تم نسخ الرابط!');
    });
  }

  // --- Comments Logic ---
  const backdrop = document.getElementById('backdrop');
  const sheet = document.getElementById('commentsSheet');
  const closeBtn = document.getElementById('closeComments');
  const commentsList = document.getElementById('commentsList');
  const sendBtn = document.getElementById('sendCommentBtn');
  const commentInput = document.getElementById('commentInput');

  window.openComments = async function(reelId) {
    currentReelIdForComments = reelId;
    backdrop.classList.add('open');
    sheet.classList.add('open');
    commentsList.innerHTML = '<div class="text-center text-gray-500 mt-4"><i class="fas fa-circle-notch fa-spin"></i></div>';
    
    try {
      const res = await fetch(`/api/reels/${reelId}/comments`);
      const data = await res.json();
      if(data.ok) {
        renderComments(data.comments);
      }
    } catch(e) { console.error(e); }
  };

  function renderComments(comments) {
    if(comments.length === 0) {
      commentsList.innerHTML = '<div class="text-center text-gray-500 text-sm mt-10">كن أول من يعلق!</div>';
      return;
    }
    commentsList.innerHTML = comments.map(c => `
      <div class="flex gap-3 mb-4">
        <img src="${c.profile_picture_url || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-gray-400 text-xs font-bold">${c.username}</span>
            <span class="text-gray-600 text-[10px]">${new Date(c.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
          <p class="text-sm text-gray-200 mt-0.5">${c.content}</p>
        </div>
      </div>
    `).join('');
    commentsList.scrollTop = commentsList.scrollHeight;
  }

  function closeCommentsSheet() {
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
    currentReelIdForComments = null;
  }

  backdrop.addEventListener('click', closeCommentsSheet);
  closeBtn.addEventListener('click', closeCommentsSheet);

  sendBtn.addEventListener('click', async () => {
    const content = commentInput.value.trim();
    if(!content || !currentReelIdForComments) return;
    
    commentInput.value = '';
    
    // Add locally immediately (Optimistic)
    const tempHtml = `
      <div class="flex gap-3 mb-4 opacity-50">
        <img src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full">
        <div><p class="text-sm text-gray-200">جاري النشر...</p></div>
      </div>
    `;
    commentsList.insertAdjacentHTML('beforeend', tempHtml);
    commentsList.scrollTop = commentsList.scrollHeight;

    try {
      const res = await fetch(`/api/reels/${currentReelIdForComments}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      const data = await res.json();
      
      if(data.ok) {
        // Refresh comments properly
        const refreshRes = await fetch(`/api/reels/${currentReelIdForComments}/comments`);
        const refreshData = await refreshRes.json();
        renderComments(refreshData.comments);
        
        // Update count on UI
        const countEl = document.getElementById(`commentCount-${currentReelIdForComments}`);
        if(countEl) countEl.textContent = parseInt(countEl.textContent) + 1;
      }
    } catch(e) {
      alert('فشل التعليق');
    }
  });

</script>
</body>
</html>
