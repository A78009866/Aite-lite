<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>ريلز — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-dark: rgba(20, 20, 20, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    
    html, body {
      margin: 0; padding: 0;
      background-color: #000; color: #fff;
      font-family: 'Cairo', sans-serif;
      height: 100%; width: 100%;
      overflow: hidden; 
    }

    /* حاوية الريلز - التمرير العمودي */
    #reelsContainer {
      height: 100vh; width: 100%;
      overflow-y: scroll; 
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
      position: relative;
    }
    #reelsContainer::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    /* كارت الريل الواحد */
    .reel-card {
      position: relative;
      width: 100%; height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      overflow: hidden;
    }

    .reel-media {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* تدرج لوني للنصوص أسفل الشاشة */
    .gradient-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      pointer-events: none; z-index: 10;
    }

    /* الأزرار الجانبية (لايك، تعليق، مشاركة، حذف) */
    .side-controls {
      position: absolute; bottom: 100px; right: 10px;
      z-index: 30; display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    .control-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .control-icon-bg {
      width: 45px; height: 45px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .control-icon-bg:active { transform: scale(0.9); }
    .control-label { font-size: 12px; font-weight: 600; text-shadow: 0 1px 2px black; }

    /* المعلومات أسفل الشاشة */
    .bottom-info {
      position: absolute; bottom: 20px; left: 16px; right: 70px;
      z-index: 30; pointer-events: none;
    }
    .bottom-info > * { pointer-events: auto; }

    /* زر الإضافة (+) */
    .add-reel-btn {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      width: 45px; height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* زر العودة */
    .back-btn {
        position: fixed; top: 20px; left: 20px; z-index: 100;
        width: 40px; height: 40px; 
        display: flex; align-items: center; justify-content: center; 
        border-radius: 50%; 
        background: rgba(0,0,0,0.4); 
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        text-decoration: none;
    }

    /* نافذة التعليقات */
    .comments-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; height: 70vh;
      background: #111; border-top-left-radius: 20px; border-top-right-radius: 20px;
      z-index: 200; transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; border-top: 1px solid #333;
    }
    .comments-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 5px; background: #444; border-radius: 3px; margin: 12px auto; }
    
    /* قائمة التعليقات - إصلاح العرض */
    .comments-list { 
        flex: 1; 
        overflow-y: auto; 
        padding: 10px 16px 80px 16px; 
        display: flex; 
        flex-direction: column;
        gap: 15px; 
    }
    
    .comment-input-area {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #111; padding: 15px; border-top: 1px solid #222;
      display: flex; align-items: center; gap: 10px;
    }
    .modern-input {
      flex: 1; background: #222; border: none; border-radius: 20px;
      padding: 10px 15px; color: #fff; outline: none;
    }

    /* أيقونة التشغيل عند الإيقاف */
    .play-icon-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 4rem; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 15;
    }
    .paused .play-icon-overlay { opacity: 0.7; }
    
    /* أنيميشن القلب عند النقر المزدوج */
    .heart-anim {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      font-size: 6rem; color: #ef4444; z-index: 25; pointer-events: none;
      animation: heartPopup 0.8s ease-out forwards;
    }
    @keyframes heartPopup {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5) translateY(-100px); opacity: 0; }
    }
  </style>
</head>
<body>

  <a href="/chat_list" class="back-btn">
    <i class="fas fa-arrow-right"></i>
  </a>

  <a href="/reels/create" class="add-reel-btn">
    <i class="fas fa-plus"></i>
  </a>

  <main id="reelsContainer">
    </main>

  <div id="commentsSheet" class="comments-sheet">
    <div class="sheet-handle" id="closeCommentsHandle"></div>
    <div class="px-4 pb-2 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm text-gray-300">التعليقات</h3>
      <button id="closeCommentsBtn" class="text-gray-400 p-2"><i class="fas fa-times"></i></button>
    </div>
    
    <div id="commentsList" class="comments-list">
      </div>
    
    <div class="comment-input-area">
      <input id="commentInput" type="text" class="modern-input" placeholder="أضف تعليقاً..." autocomplete="off">
      <button id="sendCommentBtn" class="text-blue-500 font-bold p-2 text-sm">نشر</button>
    </div>
  </div>

<script>
  let currentUserId = null;
  let isLoading = false;
  let hasMore = true;
  let lastTimestamp = null;
  
  const container = document.getElementById('reelsContainer');

  // تهيئة الصفحة
  async function init() {
    try {
      // جلب معرف المستخدم الحالي
      const res = await fetch('/api/profile');
      if (res.ok) {
        const data = await res.json();
        currentUserId = data.id;
      }
    } catch(e) { console.error(e); }
    
    // تحميل الريلز
    loadReels(true);
  }
  
  init();

  // دالة تحميل الريلز من السيرفر
  async function loadReels(initial = false) {
    if (isLoading || (!hasMore && !initial)) return;
    isLoading = true;

    const params = new URLSearchParams({ limit: 5 });
    if (!initial && lastTimestamp) params.set('before', lastTimestamp);

    try {
      const res = await fetch('/api/reels?' + params.toString());
      const data = await res.json();

      if (data.ok && data.reels.length > 0) {
        lastTimestamp = data.lastTimestamp;
        
        // إضافة الريلز إلى الصفحة
        data.reels.forEach(reel => {
          if (!container.querySelector(`[data-id="${reel.reelId}"]`)) {
            container.appendChild(createReelElement(reel));
          }
        });

        // إذا كان هذا التحميل الأولي، نربط المراقب (Observer)
        if (initial) {
             setupObserver();
             
             // التحقق مما إذا كان هناك ريل محدد في الرابط لتشغيله
             const urlParams = new URLSearchParams(window.location.search);
             const targetId = urlParams.get('r');
             if(targetId) {
                setTimeout(() => {
                    const targetEl = container.querySelector(`[data-id="${targetId}"]`);
                    if(targetEl) targetEl.scrollIntoView({ behavior: 'auto' });
                }, 100);
             }
        }

      } else if (initial) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-gray-500 bg-black">
            <p>لا توجد فيديوهات حالياً</p>
            <a href="/reels/create" class="mt-4 text-blue-400 underline font-bold">أنشئ أول ريل!</a>
          </div>`;
      } else {
        hasMore = false;
      }
    } catch (e) {
      console.error(e);
    } finally {
      isLoading = false;
    }
  }

  // إنشاء عنصر HTML للريل
  function createReelElement(reel) {
    const el = document.createElement('div');
    el.className = 'reel-card paused'; // نبدأ بحالة التوقف
    el.dataset.id = reel.reelId;

    const isOwner = (currentUserId && String(reel.userId) === String(currentUserId));
    
    // تحديد نوع الميديا
    const media = reel.media.type === 'video' 
      ? `<video class="reel-media" src="${reel.media.url}" loop playsinline webkit-playsinline></video>`
      : `<img class="reel-media" src="${reel.media.url}">`;

    // زر الحذف (يظهر فقط للمالك)
    const deleteBtn = isOwner 
      ? `<div class="control-item" onclick="deleteReel('${reel.reelId}')">
           <div class="control-icon-bg bg-red-900/20 border-red-500/30">
             <i class="fas fa-trash text-red-500"></i>
           </div>
           <span class="control-label text-red-400">حذف</span>
         </div>` 
      : '';

    el.innerHTML = `
      ${media}
      <div class="play-icon-overlay"><i class="fas fa-play"></i></div>
      <div class="gradient-overlay"></div>

      <div class="side-controls">
        <div class="control-item" onclick="toggleLike('${reel.reelId}', this)">
          <div class="control-icon-bg">
            <i class="fas fa-heart text-2xl ${reel.is_liked ? 'text-red-500' : 'text-white'}"></i>
          </div>
          <span class="control-label likes-count">${reel.likes}</span>
        </div>

        <div class="control-item" onclick="openComments('${reel.reelId}')">
          <div class="control-icon-bg"><i class="fas fa-comment-dots text-2xl text-white"></i></div>
          <span class="control-label">${reel.commentsCount || 0}</span>
        </div>

        <div class="control-item" onclick="shareReel('${reel.reelId}')">
          <div class="control-icon-bg"><i class="fas fa-share text-2xl text-white"></i></div>
          <span class="control-label">مشاركة</span>
        </div>

        ${deleteBtn}
      </div>

      <div class="bottom-info">
        <div class="flex items-center gap-2 mb-3">
          <img src="${reel.user.profile_picture_url}" class="w-10 h-10 rounded-full border border-white/20 bg-gray-800 object-cover">
          <span class="font-bold text-base text-shadow">${reel.user.username}</span>
          ${isOwner ? '<span class="bg-blue-600 text-[10px] px-2 py-0.5 rounded text-white">أنا</span>' : ''}
        </div>
        <p class="text-sm text-gray-100 line-clamp-2 pl-1 leading-relaxed">${reel.description || ''}</p>
      </div>
    `;

    // التعامل مع النقر (تشغيل/إيقاف ولايك)
    const video = el.querySelector('video');
    el.addEventListener('click', e => {
      // منع التشغيل عند الضغط على الأزرار
      if(e.target.closest('.side-controls') || e.target.closest('.bottom-info')) return;
      
      const now = Date.now();
      // دبل كليك للايك
      if (now - (el.lastClick || 0) < 300) {
        animateHeart(el);
        toggleLike(reel.reelId, el.querySelector('.side-controls .control-item'), true);
      } else {
        // نقرة واحدة للتشغيل/الإيقاف
        setTimeout(() => {
          if (Date.now() - (el.lastClick || 0) >= 300) {
            if (video) {
              if (video.paused) { video.play(); el.classList.remove('paused'); }
              else { video.pause(); el.classList.add('paused'); }
            }
          }
        }, 310);
      }
      el.lastClick = now;
    });

    return el;
  }

  // --- دوال التحكم ---

  // حذف الريل
  async function deleteReel(id) {
    if(!confirm("هل أنت متأكد من حذف هذا الفيديو؟")) return;
    try {
      const res = await fetch(`/api/reels/${id}`, { method: 'DELETE' });
      if (res.ok) {
        const card = container.querySelector(`[data-id="${id}"]`);
        if (card) {
             card.remove();
             // محاولة تشغيل الفيديو التالي تلقائياً
             // سيقوم الـ Observer بذلك تلقائياً
        }
      } else {
        alert("فشل الحذف.");
      }
    } catch(e) { alert("حدث خطأ"); }
  }

  // مشاركة الريل
  function shareReel(id) {
    const url = `${window.location.origin}/reels?r=${id}`;
    if (navigator.share) {
        navigator.share({ title: 'شاهد هذا الريل', url: url }).catch(()=>{});
    } else {
        navigator.clipboard.writeText(url).then(() => alert('تم نسخ الرابط!')).catch(() => alert('فشل النسخ'));
    }
  }

  // مراقبة التمرير لتشغيل الفيديوهات
  function setupObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (entry.isIntersecting) {
          // الفيديو دخل الشاشة
          if (video) {
              video.currentTime = 0;
              video.play().catch(()=>{});
          }
          entry.target.classList.remove('paused');
          
          // إيقاف جميع الفيديوهات الأخرى
          document.querySelectorAll('video').forEach(v => {
            if (v !== video) v.pause();
          });

          // التحقق من الحاجة لتحميل المزيد عند الوصول للنهاية
          if (entry.target === container.lastElementChild) {
            loadReels();
          }
        } else {
          // الفيديو خرج من الشاشة
          if (video) video.pause();
          entry.target.classList.add('paused');
        }
      });
    }, { threshold: 0.6 }); // 60% من الفيديو ظاهر لتشغيله

    // مراقبة العناصر الجديدة
    const observeAll = () => {
        document.querySelectorAll('.reel-card').forEach(c => observer.observe(c));
    };
    
    // مراقبة التغييرات في الحاوية (عند إضافة عناصر جديدة)
    const mutationObserver = new MutationObserver(observeAll);
    mutationObserver.observe(container, { childList: true });
    
    observeAll();
  }

  // تأثير القلب الكبير
  function animateHeart(card) {
    const h = document.createElement('div'); h.className = 'heart-anim';
    h.innerHTML = '<i class="fas fa-heart"></i>'; card.appendChild(h);
    setTimeout(() => h.remove(), 800);
  }

  // تبديل اللايك
  async function toggleLike(id, btn, forceHeartOnly = false) {
    const icon = btn.querySelector('i');
    const txt = btn.querySelector('.likes-count');
    
    if (forceHeartOnly && icon.classList.contains('text-red-500')) return; // إذا كان معجب بالفعل، لا تفعل شيئاً في الدبل كليك
    
    const isLiked = icon.classList.contains('text-red-500');
    
    // تحديث الواجهة فوراً
    icon.className = isLiked ? 'fas fa-heart text-2xl text-white' : 'fas fa-heart text-2xl text-red-500';
    let count = parseInt(txt.innerText) || 0;
    txt.innerText = isLiked ? Math.max(0, count - 1) : count + 1;
    
    // إرسال للسيرفر
    await fetch(`/api/reels/${id}/like`, { method: 'POST' });
  }

  // --- إدارة التعليقات ---
  const commentsSheet = document.getElementById('commentsSheet');
  const commentsList = document.getElementById('commentsList');
  let activeReelId = null;

  async function openComments(id) {
    activeReelId = id;
    commentsSheet.classList.add('open');
    commentsList.innerHTML = '<div class="text-center py-4 text-gray-500">جاري التحميل...</div>';
    
    try {
        const res = await fetch(`/api/reels/${id}/comments`);
        const data = await res.json();
        
        commentsList.innerHTML = '';
        
        if (!data.comments || data.comments.length === 0) {
            commentsList.innerHTML = '<div class="text-center py-8 text-gray-600">كن أول من يعلق!</div>';
        } else {
            // تجميع HTML لكل التعليقات
            let commentsHTML = '';
            data.comments.forEach(c => {
              const time = new Date(c.timestamp).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
              commentsHTML += `
                <div class="flex gap-3 items-start w-full">
                  <img src="${c.user.profile_picture_url}" class="w-8 h-8 rounded-full bg-gray-700 flex-shrink-0 object-cover">
                  <div class="flex-1">
                    <div class="flex items-baseline gap-2">
                        <span class="text-xs font-bold text-gray-300">${c.user.username}</span>
                        <span class="text-[10px] text-gray-600">${time}</span>
                    </div>
                    <div class="text-sm text-white mt-0.5 leading-snug bg-gray-800/30 p-2 rounded-lg inline-block min-w-[100px]">${c.content}</div>
                  </div>
                </div>`;
            });
            commentsList.innerHTML = commentsHTML;
            // التمرير لأسفل القائمة
            setTimeout(() => commentsList.scrollTop = commentsList.scrollHeight, 100);
        }
    } catch(e) {
        commentsList.innerHTML = '<div class="text-red-500 text-center">خطأ في التحميل</div>';
    }
  }
  
  // إغلاق التعليقات
  const closeComments = () => commentsSheet.classList.remove('open');
  document.getElementById('closeCommentsBtn').onclick = closeComments;
  document.getElementById('closeCommentsHandle').onclick = closeComments;

  // إرسال تعليق جديد
  document.getElementById('sendCommentBtn').onclick = async () => {
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if(!content || !activeReelId) return;
    
    // إضافة واجهة وهمية للسرعة
    const tempDiv = document.createElement('div');
    tempDiv.className = 'flex gap-3 items-start w-full opacity-50';
    tempDiv.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gray-700"></div>
        <div class="text-sm text-white bg-gray-800 p-2 rounded">جاري النشر...</div>`;
    commentsList.appendChild(tempDiv);
    commentsList.scrollTop = commentsList.scrollHeight;

    try {
        const res = await fetch(`/api/reels/${activeReelId}/comment`, {
          method: 'POST', 
          headers:{'Content-Type':'application/json'}, 
          body: JSON.stringify({content: content})
        });
        
        if(res.ok) {
            input.value = '';
            openComments(activeReelId); // إعادة تحميل القائمة الحقيقية
        } else {
            throw new Error();
        }
    } catch(e) {
        tempDiv.remove();
        alert('فشل التعليق');
    }
  };
</script>
</body>
</html>
