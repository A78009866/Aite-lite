<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trimer Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #e91e63; --glass: rgba(0, 0, 0, 0.6); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; }
        
        /* Reels Container */
        .reels-container { height: 100vh; overflow-y: scroll; snap-type: y mandatory; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel-video-container { 
            position: relative; height: 100vh; width: 100%; snap-align: start; 
            display: flex; align-items: center; justify-content: center;
        }

        video { height: 100%; width: 100%; object-fit: cover; }

        /* Overlay UI */
        .reel-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: white;
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        .user-info h4 { margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid white; }
        .user-info p { margin: 0; font-size: 14px; opacity: 0.9; }

        .side-actions { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-bottom: 20px; }
        .action-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; transition: 0.2s; }
        .action-btn span { font-size: 12px; display: block; text-align: center; margin-top: 5px; }
        .liked { color: #ff2d55; transform: scale(1.1); }

        /* Double Tap Heart Animation */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            color: white; font-size: 80px; opacity: 0; pointer-events: none;
        }
        .heart-animate { animation: heartPop 0.8s ease-out; }
        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Comments Bottom Sheet */
        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; right: 0; background: white;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            height: 70vh; transition: 0.3s; z-index: 1000; padding: 20px; color: #333;
        }
        .bottom-sheet.active { bottom: 0; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .comments-list { height: calc(100% - 100px); overflow-y: auto; padding: 15px 0; }
        .comment-item { display: flex; gap: 10px; margin-bottom: 15px; }
        .comment-item img { width: 30px; height: 30px; border-radius: 50%; }
        .comment-input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; background: #fff; display: flex; gap: 10px; }
        .comment-input-area input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        
        .nav-back { position: absolute; top: 20px; right: 20px; z-index: 10; color: white; font-size: 24px; text-decoration: none; }
    </style>
</head>
<body>

    <a href="/chat_list" class="nav-back"><i class="fas fa-arrow-right"></i></a>
    <div class="reels-container" id="reelsContainer">
        </div>

    <div class="bottom-sheet" id="commentsSheet">
        <div class="sheet-header">
            <h3>التعليقات</h3>
            <button class="action-btn" style="color: #333;" onclick="closeComments()"><i class="fas fa-times"></i></button>
        </div>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-input-area">
            <input type="text" id="commentInput" placeholder="أضف تعليقاً...">
            <button class="action-btn" style="color: var(--primary-color);" onclick="submitComment()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let currentReelId = null;
        let lastTap = 0;

        async function fetchReels() {
            const res = await fetch('/api/reels');
            const data = await res.json();
            if (data.ok) {
                const container = document.getElementById('reelsContainer');
                container.innerHTML = data.reels.map(reel => `
                    <div class="reel-video-container" id="reel-${reel.reelId}" onclick="handleDoubleTap(event, '${reel.reelId}')">
                        <video loop playsinline onclick="togglePlay(this)">
                            <source src="${reel.media.url}" type="video/mp4">
                        </video>
                        <i class="fas fa-heart heart-overlay" id="heart-${reel.reelId}"></i>
                        
                        <div class="reel-overlay">
                            <div class="user-info">
                                <h4><img src="${reel.user.profile_picture_url}"> @${reel.user.username}</h4>
                                <p>${reel.content || ''}</p>
                            </div>
                            <div class="side-actions">
                                <button class="action-btn ${reel.is_liked ? 'liked' : ''}" id="like-btn-${reel.reelId}" onclick="likeReel('${reel.reelId}')">
                                    <i class="fas fa-heart"></i>
                                    <span id="like-count-${reel.reelId}">${reel.likes || 0}</span>
                                </button>
                                <button class="action-btn" onclick="openComments('${reel.reelId}')">
                                    <i class="fas fa-comment"></i>
                                    <span>${reel.commentsCount || 0}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

                // تشغيل أول فيديو تلقائياً
                const firstVideo = container.querySelector('video');
                if(firstVideo) firstVideo.play();
            </div>
        }

        function togglePlay(video) {
            video.paused ? video.play() : video.pause();
        }

        function handleDoubleTap(e, reelId) {
            const now = Date.now();
            if (now - lastTap < 300) {
                const heart = document.getElementById(`heart-${reelId}`);
                heart.classList.add('heart-animate');
                setTimeout(() => heart.classList.remove('heart-animate'), 800);
                if (!document.getElementById(`like-btn-${reelId}`).classList.contains('liked')) {
                    likeReel(reelId);
                }
            }
            lastTap = now;
        }

        async function likeReel(reelId) {
            const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                const btn = document.getElementById(`like-btn-${reelId}`);
                const count = document.getElementById(`like-count-${reelId}`);
                data.action === 'liked' ? btn.classList.add('liked') : btn.classList.remove('liked');
                count.innerText = data.newLikes;
            }
        }

        async function openComments(reelId) {
            currentReelId = reelId;
            document.getElementById('commentsSheet').classList.add('active');
            const res = await fetch(`/api/reels/${reelId}/comments`);
            const data = await res.json();
            const list = document.getElementById('commentsList');
            list.innerHTML = data.comments.map(c => `
                <div class="comment-item">
                    <img src="${c.user.profile_picture_url}">
                    <div>
                        <strong>${c.user.username}</strong>
                        <p style="margin:2px 0">${c.content}</p>
                    </div>
                </div>
            `).join('');
        }

        function closeComments() {
            document.getElementById('commentsSheet').classList.remove('active');
        }

        async function submitComment() {
            const input = document.getElementById('commentInput');
            if (!input.value.trim()) return;
            const res = await fetch(`/api/reels/${currentReelId}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: input.value })
            });
            if ((await res.json()).ok) {
                input.value = '';
                openComments(currentReelId);
            }
        }

        // Observer لتشغيل الفيديو الذي يظهر في الشاشة فقط
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) video.play();
                else video.pause();
            });
        }, { threshold: 0.8 });

        window.onload = async () => {
            await fetchReels();
            document.querySelectorAll('.reel-video-container').forEach(el => observer.observe(el));
        };
    </script>
</body>
</html>
