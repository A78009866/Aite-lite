<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>ريلز — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-dark: rgba(20, 20, 20, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
    }
    
    /* إصلاح مشاكل التمرير والارتفاع */
    html, body {
      margin: 0; padding: 0;
      background-color: #000; color: #fff;
      font-family: 'Cairo', sans-serif;
      height: 100%;
      width: 100%;
      overflow: hidden; /* يمنع تمرير الصفحة نفسها */
    }

    /* حاوية الريلز - هي التي تقبل التمرير */
    #reelsContainer {
      height: 100vh; /* ارتفاع كامل */
      width: 100%;
      overflow-y: scroll; /* تفعيل التمرير العمودي */
      scroll-snap-type: y mandatory; /* تفعيل السناب */
      scrollbar-width: none;
    }
    #reelsContainer::-webkit-scrollbar { display: none; }

    /* بطاقة الريل */
    .reel-card {
      position: relative;
      width: 100%;
      height: 100vh; /* كل ريل يأخذ الشاشة كاملة */
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      overflow: hidden;
    }

    /* الميديا */
    .reel-media {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* تدرج لوني للنصوص */
    .gradient-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      pointer-events: none; z-index: 10;
    }

    /* الأزرار الجانبية */
    .side-controls {
      position: absolute; bottom: 120px; right: 16px;
      z-index: 30; display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    .control-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .control-icon-bg {
      width: 45px; height: 45px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.4); /* خلفية داكنة شفافة */
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .control-icon-bg:active { transform: scale(0.9); }
    .control-label { font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px black; }

    /* المعلومات بالأسفل */
    .bottom-info {
      position: absolute; bottom: 20px; left: 16px; right: 70px;
      z-index: 30; pointer-events: none;
    }
    .bottom-info > * { pointer-events: auto; }

    /* زر الحذف - يظهر للمالك فقط */
    .delete-badge {
      position: absolute; top: 70px; left: 20px; z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      display: flex; align-items: center; gap: 5px;
    }

    /* زر الإضافة الشفاف الرمادي */
    .add-reel-btn {
      position: fixed; top: 20px; right: 20px; z-index: 60;
      width: 45px; height: 45px;
      border-radius: 50%;
      background: rgba(80, 80, 80, 0.3); /* رمادي شفاف */
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      transition: 0.2s;
    }
    .add-reel-btn:active { transform: scale(0.95); background: rgba(80, 80, 80, 0.5); }

    /* نافذة التعليقات */
    .comments-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; height: 70vh;
      background: #111; border-top-left-radius: 20px; border-top-right-radius: 20px;
      z-index: 100; transform: translateY(110%); transition: transform 0.3s ease-out;
      display: flex; flex-direction: column; border-top: 1px solid #333;
    }
    .comments-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 5px; background: #444; border-radius: 3px; margin: 12px auto; }
    .comments-list { flex: 1; overflow-y: auto; padding: 0 16px 80px 16px; }
    .comment-input-area {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #111; padding: 15px; border-top: 1px solid #222;
      display: flex; align-items: center; gap: 10px;
    }
    .modern-input {
      flex: 1; background: #222; border: none; border-radius: 20px;
      padding: 10px 15px; color: #fff; outline: none;
    }

    /* أيقونات التشغيل والقلب */
    .play-icon-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 4rem; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 15;
    }
    .paused .play-icon-overlay { opacity: 0.7; }
    
    .heart-anim {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      font-size: 6rem; color: #ef4444; z-index: 25; pointer-events: none;
      animation: heartPopup 0.8s ease-out forwards;
    }
    @keyframes heartPopup {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5) translateY(-100px); opacity: 0; }
    }
  </style>
</head>
<body>

  <a href="/chat_list" class="fixed top-5 left-5 z-50 w-10 h-10 flex items-center justify-center rounded-full bg-black/40 backdrop-blur text-white border border-white/10">
    <i class="fas fa-arrow-right"></i>
  </a>

  <a href="/reels/create" class="add-reel-btn">
    <i class="fas fa-plus"></i>
  </a>

  <main id="reelsContainer">
    </main>

  <div id="commentsSheet" class="comments-sheet">
    <div class="sheet-handle" id="closeCommentsHandle"></div>
    <div class="px-4 pb-2 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm text-gray-300">التعليقات</h3>
      <button id="closeCommentsBtn" class="text-gray-400 p-2"><i class="fas fa-times"></i></button>
    </div>
    <div id="commentsList" class="comments-list mt-2"></div>
    <div class="comment-input-area">
      <input id="commentInput" type="text" class="modern-input" placeholder="اكتب تعليقاً..." autocomplete="off">
      <button id="sendCommentBtn" class="text-blue-500 font-bold p-2">نشر</button>
    </div>
  </div>

<script>
  let currentUserId = null;
  let currentUserData = null;
  let isLoading = false;
  let hasMore = true;
  let lastTimestamp = null;
  
  const container = document.getElementById('reelsContainer');

  // 1. التهيئة المتسلسلة (لضمان ظهور زر الحذف)
  async function init() {
    try {
      // ننتظر جلب البروفايل أولاً
      const res = await fetch('/api/profile');
      if (res.ok) {
        currentUserData = await res.json();
        currentUserId = currentUserData.id;
        console.log("Logged in as:", currentUserId);
      }
    } catch(e) {
      console.error("Profile Error", e);
    }
    
    // بعد الانتهاء، نبدأ تحميل الريلز
    loadReels(true);
  }
  
  init();

  // 2. تحميل الريلز
  async function loadReels(initial = false) {
    if (isLoading || (!hasMore && !initial)) return;
    isLoading = true;

    const params = new URLSearchParams({ limit: 10 }); // جلب 10
    if (!initial && lastTimestamp) params.set('before', lastTimestamp);

    try {
      // إضافة طابع زمني لمنع التخزين المؤقت
      const res = await fetch('/api/reels?' + params.toString() + '&t=' + Date.now());
      const data = await res.json();

      if (data.ok && data.reels.length > 0) {
        lastTimestamp = data.lastTimestamp;
        
        data.reels.forEach(reel => {
          // التحقق من التكرار
          if (!container.querySelector(`[data-id="${reel.reelId}"]`)) {
            container.appendChild(createReelElement(reel));
          }
        });

        setupObserver();

      } else if (initial) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-gray-500">
            <p>لا توجد فيديوهات حالياً</p>
            <a href="/reels/create" class="mt-4 text-blue-400 underline">انشر أول فيديو</a>
          </div>`;
      } else {
        hasMore = false;
      }
    } catch (e) {
      console.error(e);
    } finally {
      isLoading = false;
    }
  }

  // 3. إنشاء عنصر الريل (مع زر الحذف الصحيح)
  function createReelElement(reel) {
    const el = document.createElement('div');
    el.className = 'reel-card';
    el.dataset.id = reel.reelId;

    // التحقق من الملكية
    // تأكد أن السيرفر يرسل userId داخل كائن الريل
    const isOwner = (currentUserId && String(reel.userId) === String(currentUserId));
    
    // HTML المحتوى
    const media = reel.media.type === 'video' 
      ? `<video class="reel-media" src="${reel.media.url}" loop playsinline></video>`
      : `<img class="reel-media" src="${reel.media.url}">`;

    const deleteBtn = isOwner 
      ? `<div class="delete-badge" onclick="deleteReel('${reel.reelId}', this)">
           <i class="fas fa-trash"></i> حذف
         </div>` 
      : '';

    el.innerHTML = `
      ${media}
      <div class="play-icon-overlay"><i class="fas fa-play"></i></div>
      <div class="gradient-overlay"></div>
      
      ${deleteBtn}

      <div class="side-controls">
        <div class="control-item" onclick="toggleLike('${reel.reelId}', this)">
          <div class="control-icon-bg">
            <i class="fas fa-heart text-2xl ${reel.is_liked ? 'text-red-500' : 'text-white'}"></i>
          </div>
          <span class="control-label likes-count">${reel.likes}</span>
        </div>
        <div class="control-item" onclick="openComments('${reel.reelId}')">
          <div class="control-icon-bg"><i class="fas fa-comment text-2xl text-white"></i></div>
          <span class="control-label">${reel.commentsCount || 0}</span>
        </div>
      </div>

      <div class="bottom-info">
        <div class="flex items-center gap-2 mb-2">
          <img src="${reel.user.profile_picture_url}" class="w-9 h-9 rounded-full border border-white/20">
          <span class="font-bold text-sm text-shadow">${reel.user.username}</span>
        </div>
        <p class="text-sm text-gray-200 line-clamp-2 pl-2">${reel.description || ''}</p>
      </div>
    `;

    // أحداث الفيديو
    const video = el.querySelector('video');
    el.addEventListener('click', e => {
      if(e.target.closest('.side-controls') || e.target.closest('.bottom-info') || e.target.closest('.delete-badge')) return;
      
      // منطق النقر المزدوج (لايك) والنقر المفرد (تشغيل/إيقاف)
      const now = Date.now();
      if (now - (el.lastClick || 0) < 300) {
        animateHeart(el);
        toggleLike(reel.reelId, el.querySelector('.side-controls .control-item'), true);
      } else {
        setTimeout(() => {
          if (Date.now() - (el.lastClick || 0) >= 300) {
            if (video) {
              if (video.paused) { video.play(); el.classList.remove('paused'); }
              else { video.pause(); el.classList.add('paused'); }
            }
          }
        }, 310);
      }
      el.lastClick = now;
    });

    return el;
  }

  // 4. حذف الريل
  async function deleteReel(id, btn) {
    if(!confirm("حذف هذا الفيديو نهائياً؟")) return;
    btn.innerHTML = "جارِ الحذف...";
    try {
      const res = await fetch(`/api/reels/${id}`, { method: 'DELETE' });
      if (res.ok) {
        const card = container.querySelector(`[data-id="${id}"]`);
        if (card) card.remove();
      } else {
        alert("فشل الحذف");
        btn.innerHTML = '<i class="fas fa-trash"></i> حذف';
      }
    } catch(e) { alert("خطأ"); }
  }

  // 5. مراقب التمرير (تشغيل الفيديو الظاهر فقط)
  function setupObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (entry.isIntersecting) {
          if (video) video.play().catch(()=>{});
          entry.target.classList.remove('paused');
          
          // إيقاف البقية
          document.querySelectorAll('video').forEach(v => {
            if (v !== video) { v.pause(); v.currentTime = 0; }
          });

          // تحميل المزيد عند الاقتراب من النهاية
          if (entry.target === container.lastElementChild) {
            loadReels();
          }
        } else {
          if (video) video.pause();
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll('.reel-card').forEach(c => observer.observe(c));
  }

  // --- دوال مساعدة (لايك، قلب، تعليقات) ---
  function animateHeart(card) {
    const h = document.createElement('div'); h.className = 'heart-anim';
    h.innerHTML = '<i class="fas fa-heart"></i>'; card.appendChild(h);
    setTimeout(() => h.remove(), 800);
  }

  async function toggleLike(id, btn, force) {
    const icon = btn.querySelector('i');
    const txt = btn.querySelector('.likes-count');
    if (force && icon.classList.contains('text-red-500')) return;
    
    const isLiked = icon.classList.contains('text-red-500');
    icon.className = isLiked ? 'fas fa-heart text-2xl text-white' : 'fas fa-heart text-2xl text-red-500';
    txt.innerText = parseInt(txt.innerText) + (isLiked ? -1 : 1);
    
    await fetch(`/api/reels/${id}/like`, { method: 'POST' });
  }

  // دوال التعليقات (مبسطة)
  const commentsSheet = document.getElementById('commentsSheet');
  const commentsList = document.getElementById('commentsList');
  let activeReelId = null;

  async function openComments(id) {
    activeReelId = id;
    commentsSheet.classList.add('open');
    commentsList.innerHTML = '<div class="text-center py-4 text-gray-500">تحميل...</div>';
    const res = await fetch(`/api/reels/${id}/comments`);
    const data = await res.json();
    commentsList.innerHTML = '';
    data.comments.forEach(c => {
      commentsList.innerHTML += `
        <div class="flex gap-2 mb-3">
          <img src="${c.user.profile_picture_url}" class="w-8 h-8 rounded-full">
          <div>
            <div class="text-xs font-bold text-gray-300">${c.user.username}</div>
            <div class="text-sm text-white">${c.content}</div>
          </div>
        </div>`;
    });
  }
  
  document.getElementById('closeCommentsBtn').onclick = () => commentsSheet.classList.remove('open');
  document.getElementById('sendCommentBtn').onclick = async () => {
    const input = document.getElementById('commentInput');
    if(!input.value.trim()) return;
    await fetch(`/api/reels/${activeReelId}/comment`, {
      method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content: input.value})
    });
    input.value = '';
    openComments(activeReelId); // تحديث القائمة
  };

</script>
</body>
</html>
