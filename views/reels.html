<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimer Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            background: #000; color: white;
            height: 100%; width: 100%; overflow: hidden;
            font-family: sans-serif;
        }
        
        /* حاوية الريلز - الإصلاح الأساسي للتمرير */
        .reels-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .reel-video-container {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            height: 100%;
            width: 100%;
            object-fit: contain; /* لضمان عدم قص الفيديو */
        }

        /* نافذة التعليقات - سوداء بالكامل */
        .comments-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 70%;
            background: #000000; /* أسود صريح */
            border-top: 1px solid #333;
            border-radius: 20px 20px 0 0;
            z-index: 9999;
            transition: bottom 0.4s ease;
            display: flex;
            flex-direction: column;
        }
        .comments-sheet.active { bottom: 0; }

        .sheet-header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #222;
            position: relative;
        }
        .close-sheet {
            position: absolute;
            left: 20px; top: 15px;
            font-size: 20px; cursor: pointer; color: #fff;
        }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .comment-input-area {
            padding: 20px;
            background: #111;
            display: flex;
            gap: 10px;
        }
        .comment-input-area input {
            flex: 1; background: #222; border: none;
            padding: 12px; border-radius: 25px; color: white; outline: none;
        }

        /* الأزرار الجانبية والمعلومات */
        .reel-actions {
            position: absolute; bottom: 100px; left: 15px;
            display: flex; flex-direction: column; gap: 20px; z-index: 10;
        }
        .action-btn { color: white; text-align: center; cursor: pointer; font-size: 24px; }
        .action-btn span { display: block; font-size: 12px; margin-top: 4px; }
        .liked { color: #ff3040; }

        .reel-info {
            position: absolute; bottom: 40px; right: 15px;
            z-index: 10; text-align: right; width: 70%;
        }
        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .user-pic { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #fff; }

        /* قلب النقر المزدوج */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; color: white; opacity: 0; pointer-events: none;
        }
        @keyframes heartPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="reels-container" id="reelsWrapper">
    </div>

<div class="comments-sheet" id="commentSheet">
    <div class="sheet-header">
        <div class="close-sheet" onclick="closeComments()"><i class="fas fa-times"></i></div>
        <strong>التعليقات</strong>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="أضف تعليقاً...">
        <button onclick="postComment()" style="background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer;">نشر</button>
    </div>
</div>

<script>
    let activeReelId = null;

    async function loadReels() {
        try {
            const res = await fetch('/api/reels');
            const data = await res.json();
            if (data.ok) {
                renderReels(data.reels);
                setupObserver();
            }
        } catch (e) { console.error("Load failed", e); }
    }

    function renderReels(reels) {
        const container = document.getElementById('reelsWrapper');
        container.innerHTML = reels.map(reel => `
            <div class="reel-video-container" id="reel-${reel.reelId}">
                <video src="${reel.media?.url}" loop muted playsinline 
                       onclick="togglePlay(this)" 
                       ondblclick="handleDoubleLike(event, '${reel.reelId}')"></video>
                
                <div class="heart-overlay" id="heart-${reel.reelId}"><i class="fas fa-heart"></i></div>

                <div class="reel-actions">
                    <div class="action-btn ${reel.is_liked ? 'liked' : ''}" id="like-btn-${reel.reelId}" onclick="toggleLike('${reel.reelId}')">
                        <i class="fas fa-heart"></i>
                        <span id="like-count-${reel.reelId}">${reel.likes || 0}</span>
                    </div>
                    <div class="action-btn" onclick="openComments('${reel.reelId}')">
                        <i class="fas fa-comment"></i>
                        <span>${reel.commentsCount || 0}</span>
                    </div>
                </div>

                <div class="reel-info">
                    <div class="user-row">
                        <img src="${reel.user.profile_picture_url}" class="user-pic">
                        <strong>${reel.user.username}</strong>
                    </div>
                    <p>${reel.content}</p>
                </div>
            </div>
        `).join('');
    }

    function togglePlay(video) {
        // عند أول ضغطة، نقوم بإلغاء الكتم
        if (video.muted) video.muted = false;
        
        if (video.paused) video.play();
        else video.pause();
    }

    function setupObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    video.play().catch(err => console.log("Auto-play blocked, waiting for interaction"));
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('video').forEach(v => observer.observe(v));
    }

    // التعليقات
    async function openComments(reelId) {
        activeReelId = reelId;
        document.getElementById('commentSheet').classList.add('active');
        const list = document.getElementById('commentList');
        list.innerHTML = 'جاري التحميل...';

        const res = await fetch(`/api/reels/${reelId}/comments`);
        const data = await res.json();
        if (data.ok) {
            list.innerHTML = data.comments.map(c => `
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <img src="${c.user.profile_picture_url}" style="width:30px; height:30px; border-radius:50%;">
                    <div>
                        <div style="font-weight:bold; font-size:12px;">${c.user.username}</div>
                        <div style="font-size:14px;">${c.content}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    function closeComments() {
        document.getElementById('commentSheet').classList.remove('active');
    }

    async function toggleLike(reelId) {
        const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
            const btn = document.getElementById(`like-btn-${reelId}`);
            btn.classList.toggle('liked', data.action === 'liked');
            document.getElementById(`like-count-${reelId}`).innerText = data.newLikes;
        }
    }

    function handleDoubleLike(event, reelId) {
        const heart = document.getElementById(`heart-${reelId}`);
        heart.style.animation = 'heartPop 0.7s ease';
        setTimeout(() => heart.style.animation = '', 700);
        toggleLike(reelId);
    }

    window.onload = loadReels;
</script>

</body>
</html>
