<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Reels - Trimer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    html, body { 
      margin: 0; padding: 0; 
      height: 100%; width: 100%; 
      background: black; color: white; 
      font-family: 'Cairo', sans-serif; 
      overflow: hidden; 
    }

    .swiper { width: 100%; height: 100%; }
    .swiper-slide {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    video {
      -webkit-user-select: none;
      user-select: none;
      background: black;
    }

    .big-heart {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px; color: white; 
      text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; z-index: 20;
    }
    .big-heart.animate { animation: heart-pop 0.8s ease-out; }
    @keyframes heart-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; transform: rotate(-10deg); }
      30% { transform: translate(-50%, -50%) scale(1.2); transform: rotate(10deg); }
      50% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 30;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: opacity 0.25s ease, transform 0.18s ease;
      opacity: 0;
      pointer-events: none;
    }
    .play-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .play-btn i {
      font-size: 34px;
      color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    /* شريط التقدم (RTL) */
    .video-progress {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      z-index: 30;
      overflow: visible;
      cursor: pointer;
    }
    .video-progress .progress {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #007AFF 0%, #00D4FF 100%);
      transition: width 0.08s linear;
      border-radius: 999px;
    }
    .video-progress .thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(180deg, #00D4FF, #007AFF);
      border: 2px solid rgba(255,255,255,0.95);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 35;
    }

    .comments-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #111; border-radius: 16px 16px 0 0;
      height: 60vh; transform: translateY(100%);
      transition: transform 0.3s ease-out; z-index: 50;
      display: flex; flex-direction: column;
    }
    .comments-sheet.open { transform: translateY(0); }
    .overlay-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 40; display: none;
    }
    .overlay-backdrop.open { display: block; }

    /* top bar */
    .topbar {
      position: fixed; top: 8px; left: 12px; right: 12px; z-index: 60;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      pointer-events: none;
    }
    .topbar a, .topbar button { pointer-events: auto; }

    /* VERIFIED BADGE IMAGE */
    .verified-badge-img {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      margin-left: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.06);
      vertical-align: middle;
    }

    /* Comments list tweaks */
    .comment-row { display:flex; gap:12px; }
    .comment-actions { display:flex; gap:8px; align-items:center; margin-top:6px; }
    .comment-like-btn { display:flex; align-items:center; gap:6px; cursor:pointer; color:#cbd5e1; }
    .comment-like-btn.liked { color:#ef4444; }
    .reply-box { margin-top:8px; display:flex; gap:8px; align-items:center; }
    .reply-box input { flex:1; padding:8px 12px; border-radius:999px; background:#222; color:#fff; border:1px solid rgba(255,255,255,0.03); outline:none; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="flex items-center gap-2">
      <a href="/chat_list" class="text-white text-xl drop-shadow-lg p-2 bg-black/40 rounded-full"><i class="fas fa-arrow-right"></i></a>
    </div>
    <div class="flex items-center gap-2">
      <a id="createReelBtn" href="/create-reel" class="text-white text-xl drop-shadow-lg p-2 bg-black/40 rounded-full"><i class="fas fa-plus"></i></a>
      <!-- Notification icon intentionally removed -->
    </div>
  </div>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper" id="reelsWrapper"></div>
  </div>

  <div id="backdrop" class="overlay-backdrop"></div>
  <div id="commentsSheet" class="comments-sheet border-t border-gray-800">
    <div class="p-3 border-b border-gray-800 flex justify-between items-center">
      <h3 class="font-bold text-sm">التعليقات</h3>
      <button id="closeComments" class="text-gray-400 p-2"><i class="fas fa-times"></i></button>
    </div>
    <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20"></div>
    <div class="p-3 border-t border-gray-800 flex items-center gap-2 bg-black absolute bottom-0 w-full">
      <input type="text" id="commentInput" placeholder="أضف تعليقاً..." 
             class="flex-1 bg-[#222] text-white text-sm rounded-full px-4 py-2 outline-none">
      <button id="sendCommentBtn" class="text-blue-500 font-bold text-sm px-3">نشر</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
  const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

  let swiperInstance = null;
  let currentReelsData = [];
  let currentUserId = null;
  let currentReelIdForComments = null;
  const BLACK_POSTER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="9" viewBox="0 0 16 9"><rect width="16" height="9" fill="black"/></svg>');

  // Persisted local map for comment likes so UI doesn't "lose" like state when re-rendering
  function getLocalLikesMap() {
    try { return JSON.parse(localStorage.getItem('reel_comment_likes') || '{}'); } catch(e){ return {}; }
  }
  function setLocalLikesMap(m) { try { localStorage.setItem('reel_comment_likes', JSON.stringify(m)); } catch(e){} }

  document.addEventListener('DOMContentLoaded', loadReels);

  async function loadReels() {
    try {
      const res = await fetch('/api/reels/feed', { credentials: 'include' });
      if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
      const data = await res.json();
      currentUserId = data.currentUserId || null;
      if(data.ok && data.reels && data.reels.length > 0) {
        currentReelsData = data.reels;
        renderReels(data.reels);
        initSwiper();
      } else {
        document.getElementById('reelsWrapper').innerHTML = '<div class="swiper-slide text-gray-500">لا توجد ريلز حالياً</div>';
      }
    } catch(e) {
      console.error(e);
      document.getElementById('reelsWrapper').innerHTML = `<div class="swiper-slide text-red-500">خطأ في التحميل</div>`;
    }
  }

  function renderReels(reels) {
    const wrapper = document.getElementById('reelsWrapper');
    wrapper.innerHTML = reels.map((reel, index) => {
      const isOwner = reel.userId === currentUserId;
      const poster = reel.thumbnailUrl || BLACK_POSTER;
      return `
      <div class="swiper-slide" data-index="${index}" data-id="${reel.reelId}">
        <video src="${reel.videoUrl}" poster="${poster}" class="w-full h-full object-cover" playsinline preload="metadata" webkit-playsinline></video>
        <i class="fas fa-heart big-heart" id="bigHeart-${reel.reelId}"></i>
        <div class="play-btn" id="playBtn-${reel.reelId}"><i class="fas fa-play"></i></div>
        <div class="video-progress" id="progress-${reel.reelId}">
          <div class="progress" id="progressBar-${reel.reelId}"></div>
          <div class="thumb" id="thumb-${reel.reelId}"></div>
        </div>
        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/90 pointer-events-none"></div>

        <div class="absolute left-4 bottom-24 flex flex-col items-center gap-6 z-20 pointer-events-auto">
          <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="handleLike('${reel.reelId}')">
            <i class="${reel.is_liked ? 'fas text-red-500' : 'far text-white'} fa-heart text-3xl drop-shadow-md" id="likeIcon-${reel.reelId}"></i>
            <span class="text-xs font-bold" id="likeCount-${reel.reelId}">${reel.likes}</span>
          </div>
          <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openComments('${reel.reelId}')">
            <i class="fas fa-comment-dots text-3xl text-white drop-shadow-md"></i>
            <span class="text-xs font-bold" id="commentCount-${reel.reelId}">${reel.commentsCount}</span>
          </div>
          <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="shareReel('${reel.reelId}')">
            <i class="fas fa-share text-3xl text-white drop-shadow-md"></i>
            <span class="text-xs font-bold">مشاركة</span>
          </div>
          ${isOwner ? `<div class="flex flex-col items-center gap-1 cursor-pointer text-red-500" onclick="deleteReel('${reel.reelId}')"><i class="fas fa-trash-can text-2xl drop-shadow-md"></i><span class="text-[10px] font-bold">حذف</span></div>` : ''}
        </div>

        <div class="absolute right-4 bottom-8 left-16 z-20 text-right">
          <a href="/profile?userId=${encodeURIComponent(reel.userId)}" class="flex items-center gap-3 mb-2 pointer-events-auto cursor-pointer" style="text-decoration:none;color:inherit;">
            <img src="${escapeHtml(reel.user.profile_picture_url || 'https://via.placeholder.com/40')}" class="w-10 h-10 rounded-full border border-white object-cover">
            <h3 class="font-bold text-white shadow-black drop-shadow-md text-base">@${escapeHtml(reel.user.username)} <span class="verified-placeholder" data-user-id="${escapeAttr(reel.userId)}"></span></h3>
          </a>
          <p class="text-sm text-gray-200 line-clamp-2 leading-relaxed drop-shadow-md dir-rtl pr-1">${escapeHtml(reel.description)}</p>
        </div>
      </div>
    `}).join('');

    setupVideoInteractions();
    updateVerifiedBadges();
  }

  function setupVideoInteractions() {
    document.querySelectorAll('video').forEach(vid => {
      const slide = vid.closest('.swiper-slide');
      const reelId = slide.getAttribute('data-id');
      const progressBar = document.getElementById(`progressBar-${reelId}`);
      const progressContainer = document.getElementById(`progress-${reelId}`);
      const playBtn = document.getElementById(`playBtn-${reelId}`);
      const thumb = document.getElementById(`thumb-${reelId}`);

      vid.addEventListener('timeupdate', () => {
        if (!progressBar || !vid.duration || isNaN(vid.duration)) return;
        const pct = (vid.currentTime / vid.duration) * 100;
        progressBar.style.width = pct + '%';
        if (thumb) thumb.style.left = (100 - pct) + '%';
      });

      if (progressContainer) {
        progressContainer.addEventListener('click', (ev) => {
          const rect = progressContainer.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          let pct = 1 - (x / rect.width);
          if (pct < 0) pct = 0; if (pct > 1) pct = 1;
          if (vid.duration && !isNaN(vid.duration)) {
            vid.currentTime = pct * vid.duration;
            vid.play().catch(() => {});
          }
        });
      }

      if (playBtn) {
        playBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePlayPause(vid, reelId, true);
        });
      }

      let lastTap = 0;
      vid.addEventListener('click', (e) => {
        const now = Date.now();
        const delta = now - lastTap;
        if (delta < 300 && delta > 0) {
          const id = vid.closest('.swiper-slide').getAttribute('data-id');
          handleLike(id, true);
          animateHeart(id);
        } else {
          const id = vid.closest('.swiper-slide').getAttribute('data-id');
          togglePlayPause(vid, id, true);
        }
        lastTap = now;
      });

      vid.addEventListener('pause', () => { showPlayBtnTemporarily(reelId, true); });
      vid.addEventListener('play', () => { showPlayBtnTemporarily(reelId, false); });
      vid.addEventListener('ended', () => { showPlayBtnTemporarily(reelId, true); });
    });
  }

  function initSwiper() {
    if(swiperInstance) swiperInstance.destroy(true, true);
    swiperInstance = new Swiper(".mySwiper", {
      direction: "vertical",
      mousewheel: true,
      keyboard: { enabled: true },
      speed: 400,
      on: {
        init: function() { playCurrentVideo(this); },
        slideChange: function () {
          pauseAllVideos();
          playCurrentVideo(this);
        }
      }
    });
  }

  function pauseAllVideos() {
    document.querySelectorAll('video').forEach(v => { try { v.pause(); } catch(e) {} });
  }

  function playCurrentVideo(swiper) {
    const activeSlide = swiper.slides[swiper.activeIndex];
    const video = activeSlide.querySelector('video');
    if (video) {
      video.muted = false;
      video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); });
      const reelId = activeSlide.getAttribute('data-id');
      showPlayBtnTemporarily(reelId, false);
    }
  }

  function togglePlayPause(videoEl, reelId, showButton) {
    const playBtn = document.getElementById(`playBtn-${reelId}`);
    try {
      if (videoEl.paused) {
        videoEl.play().catch(()=>{});
        if (playBtn) { playBtn.classList.remove('show'); playBtn.querySelector('i').className = 'fas fa-pause'; }
      } else {
        videoEl.pause();
        if (playBtn) { playBtn.querySelector('i').className = 'fas fa-play'; showPlayBtnTemporarily(reelId, true); }
      }
      if (showButton && playBtn) {
        playBtn.classList.add('show');
        setTimeout(() => { playBtn.classList.remove('show'); }, 1400);
      }
    } catch(e) {}
  }

  function showPlayBtnTemporarily(reelId, isPaused) {
    const playBtn = document.getElementById(`playBtn-${reelId}`);
    if (!playBtn) return;
    const icon = playBtn.querySelector('i');
    if (isPaused) { icon.className = 'fas fa-play'; playBtn.classList.add('show'); }
    else { icon.className = 'fas fa-pause'; playBtn.classList.remove('show'); }
    if (isPaused) setTimeout(() => { playBtn.classList.remove('show'); }, 1400);
  }

  function animateHeart(reelId) {
    const heart = document.getElementById(`bigHeart-${reelId}`);
    if(!heart) return;
    heart.classList.remove('animate');
    void heart.offsetWidth;
    heart.classList.add('animate');
    const icon = document.getElementById(`likeIcon-${reelId}`);
    if(icon && !icon.classList.contains('text-red-500')) {
      icon.classList.remove('far');
      icon.classList.add('fas', 'text-red-500');
      const countEl = document.getElementById(`likeCount-${reelId}`);
      if(countEl) countEl.textContent = parseInt(countEl.textContent || '0') + 1;
    }
  }

  window.deleteReel = async function(reelId) {
    if(!confirm('هل تريد حذف هذا الريل نهائياً؟')) return;
    try {
      const res = await fetch(`/api/reels/${reelId}`, { method: 'DELETE', credentials: 'include' });
      const data = await res.json().catch(()=>({ ok: false }));
      if(res.ok && data.ok) location.reload();
      else { console.error('Delete reel failed', res.status, data); alert(data.error || 'خطأ في الحذف'); }
    } catch(e) { console.error('Delete reel error', e); alert('فشل الاتصال بالسيرفر'); }
  };

  async function handleLike(reelId, forceLike = false) {
    const icon = document.getElementById(`likeIcon-${reelId}`);
    const countSpan = document.getElementById(`likeCount-${reelId}`);
    const isLiked = icon.classList.contains('text-red-500');
    if (forceLike && isLiked) return;

    if (isLiked) {
      icon.className = 'far fa-heart text-3xl text-white drop-shadow-md';
      countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
    } else {
      icon.className = 'fas fa-heart text-3xl text-red-500 drop-shadow-md';
      countSpan.textContent = parseInt(countSpan.textContent) + 1;
    }
    try { await fetch(`/api/reels/${encodeURIComponent(reelId)}/like`, { method: 'POST', credentials: 'include' }); } catch(e) { console.error('like error', e); }
  }

  // Comments sheet
  const backdrop = document.getElementById('backdrop');
  const sheet = document.getElementById('commentsSheet');
  const commentsList = document.getElementById('commentsList');

  // --- Open comments: fetch comments and render UI with like/reply support ---
  window.openComments = async function(reelId) {
    currentReelIdForComments = reelId;
    backdrop.classList.add('open');
    sheet.classList.add('open');
    if(swiperInstance) swiperInstance.allowTouchMove = false;

    commentsList.innerHTML = '<div class="text-center mt-5"><i class="fas fa-circle-notch fa-spin text-blue-500"></i></div>';
    try {
      const res = await fetch(`/api/reels/${encodeURIComponent(reelId)}/comments`, { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to fetch comments: ' + res.status);
      const data = await res.json();
      const comments = data.comments || [];
      renderComments(reelId, comments);
    } catch(e) {
      console.error('openComments error', e);
      commentsList.innerHTML = '<div class="text-center text-red-500 mt-4">فشل في جلب التعليقات.</div>';
    }
  };

  function closeCommentsSheet() {
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
    if(swiperInstance) swiperInstance.allowTouchMove = true;
    currentReelIdForComments = null;
  }

  // Create top-level comment element HTML
  function createReelCommentElement(comment, reelId) {
    const commentId = comment.id || comment.commentId || '';
    const username = comment.username || comment.user?.username || 'مستخدم';
    const avatar = comment.profile_picture_url || comment.user?.profile_picture_url || 'https://via.placeholder.com/40';
    const time = comment.timestamp ? new Date(comment.timestamp).toLocaleTimeString() : '';
    const serverLikes = typeof comment.likes !== 'undefined' ? comment.likes : 0;

    const localMap = getLocalLikesMap();
    const key = `${reelId}:${commentId}`;
    const localLiked = !!localMap[key];
    const displayedLikes = serverLikes + (localLiked ? 1 : 0);

    return `
      <div class="comment-row" data-comment-id="${escapeAttr(commentId)}">
        <img src="${escapeHtml(avatar)}" class="w-8 h-8 rounded-full flex-shrink-0 object-cover" alt="${escapeHtml(username)}">
        <div class="flex-1">
          <div class="flex items-center justify-between">
            <div>
              <div class="font-bold text-xs commenter-name" data-username="${escapeAttr(username)}">${escapeHtml(username)} <span class="verified-placeholder" data-user-id="${escapeAttr(comment.userId || '')}"></span></div>
              <div class="text-[11px] text-gray-400 mt-1">${escapeHtml(time)}</div>
            </div>
          </div>
          <p class="text-sm mt-2 comment-content">${escapeHtml(comment.content)}</p>

          <div class="comment-actions">
            <div class="comment-like-btn ${localLiked ? 'liked' : ''}" onclick="toggleCommentLikeReel('${escapeAttr(reelId)}','${escapeAttr(commentId)}', this)">
              <i class="${localLiked ? 'fas' : 'far'} fa-heart"></i>
              <span class="text-[12px]" id="reel-comment-like-count-${escapeAttr(commentId)}">${displayedLikes}</span>
            </div>
            <div class="text-xs text-gray-400 cursor-pointer" onclick="openReplyBoxReel('${escapeAttr(commentId)}','${escapeAttr(username)}')">
              <i class="fas fa-reply"></i> رد
            </div>
          </div>

          <div id="replies-container-${escapeAttr(commentId)}" class="mt-3 space-y-2"></div>

          <div class="reply-box hidden" id="reply-box-${escapeAttr(commentId)}">
            <input id="reply-input-${escapeAttr(commentId)}" placeholder="اكتب رد..." />
            <button onclick="postReplyReel('${escapeAttr(reelId)}','${escapeAttr(commentId)}','${escapeAttr(username)}')" class="text-white bg-blue-600 px-3 py-1 rounded">إرسال</button>
          </div>
        </div>
      </div>
    `;
  }

  // Render comments list. We will render top-level comments in order.
  // For replies posted via this client, we append them under the parent comment's replies-container.
  function renderComments(reelId, comments) {
    commentsList.innerHTML = '';
    if(!comments || comments.length === 0) {
      commentsList.innerHTML = '<div class="text-center text-gray-500 text-sm mt-10">كن أول من يعلق!</div>';
      return;
    }

    // Render all comments as top-level. Replies posted via this client will be appended under parent.
    // Use server data for likes if present, but merge with local likes map so likes don't "disappear".
    const html = comments.map(c => createReelCommentElement(c, reelId)).join('');
    commentsList.innerHTML = html;

    updateVerifiedBadges();

    // scroll to bottom to show latest
    setTimeout(()=> { commentsList.scrollTop = commentsList.scrollHeight; }, 80);
  }

  backdrop.addEventListener('click', closeCommentsSheet);
  document.getElementById('closeComments').addEventListener('click', closeCommentsSheet);
  
  // Post new top-level comment (uses server response to append)
  document.getElementById('sendCommentBtn').addEventListener('click', async () => {
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if(!content || !currentReelIdForComments) return;
    input.disabled = true;
    try {
      const res = await fetch(`/api/reels/${encodeURIComponent(currentReelIdForComments)}/comment`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      const json = await res.json().catch(()=>({ ok: false }));
      if (res.ok && json.ok && json.comment) {
        // append the returned comment as top-level
        commentsList.insertAdjacentHTML('beforeend', createReelCommentElement(json.comment, currentReelIdForComments));
        updateVerifiedBadges();
        // update comment count badge on reel slide
        const commentCountSpan = document.getElementById(`commentCount-${currentReelIdForComments}`);
        if (commentCountSpan) commentCountSpan.textContent = parseInt(commentCountSpan.textContent || '0') + 1;
        // scroll to bottom
        setTimeout(()=> { commentsList.scrollTop = commentsList.scrollHeight; }, 80);
        input.value = '';
      } else {
        throw new Error(json.error || 'Failed to post comment');
      }
    } catch(e) {
      console.error('send comment error', e);
      alert('فشل الإرسال');
    } finally {
      input.disabled = false;
    }
  });

  // Toggle like on a reel comment. We persist locally (localStorage) so like doesn't disappear on rerender.
  // We also try to call an API endpoint (`/api/reels/:reelId/comments/:commentId/like`) if backend implements it.
  async function toggleCommentLikeReel(reelId, commentId, btnEl) {
    if (!btnEl) btnEl = document.querySelector(`[data-comment-id="${commentId}"] .comment-like-btn`);
    if (!btnEl) return;
    btnEl.style.pointerEvents = 'none';

    const countEl = document.getElementById(`reel-comment-like-count-${commentId}`);
    let count = parseInt(countEl ? countEl.textContent : '0') || 0;

    const localMap = getLocalLikesMap();
    const key = `${reelId}:${commentId}`;
    const currentlyLiked = !!localMap[key];

    // toggle local like immediately (optimistic)
    if (currentlyLiked) {
      delete localMap[key];
      btnEl.classList.remove('liked');
      const icon = btnEl.querySelector('i');
      if (icon) { icon.classList.remove('fas'); icon.classList.add('far'); }
      count = Math.max(0, count - 1);
    } else {
      localMap[key] = true;
      btnEl.classList.add('liked');
      const icon = btnEl.querySelector('i');
      if (icon) { icon.classList.remove('far'); icon.classList.add('fas'); }
      count = count + 1;
    }
    if (countEl) countEl.textContent = count;
    setLocalLikesMap(localMap);

    // fire-and-forget to server endpoint if exists
    try {
      const res = await fetch(`/api/reels/${encodeURIComponent(reelId)}/comments/${encodeURIComponent(commentId)}/like`, {
        method: 'POST',
        credentials: 'include'
      });
      if (res.ok) {
        const data = await res.json().catch(()=>null);
        // if server responds with authoritative likes/is_liked, use it
        if (data && data.ok) {
          if (typeof data.likes !== 'undefined' && countEl) countEl.textContent = data.likes;
          if (typeof data.is_liked !== 'undefined') {
            // sync localMap according to server
            if (data.is_liked) localMap[key] = true; else delete localMap[key];
            setLocalLikesMap(localMap);
            if (data.is_liked) btnEl.classList.add('liked'); else btnEl.classList.remove('liked');
            const icon = btnEl.querySelector('i');
            if (icon) { if (data.is_liked) { icon.classList.remove('far'); icon.classList.add('fas'); } else { icon.classList.remove('fas'); icon.classList.add('far'); } }
          }
        }
      }
    } catch (e) {
      // ignore server error; we kept optimistic state
      console.warn('reel comment like endpoint failed', e);
    } finally {
      btnEl.style.pointerEvents = '';
    }
  }

  // Open reply input under a specific comment
  function openReplyBoxReel(commentId, username) {
    const box = document.getElementById(`reply-box-${commentId}`);
    if (!box) return;
    box.classList.toggle('hidden');
    const input = document.getElementById(`reply-input-${commentId}`);
    if (input && !box.classList.contains('hidden')) {
      input.focus();
      input.value = '';
      input.setAttribute('placeholder', `الرد إلى ${username}`);
    }
  }

  // Post a reply to a reel comment.
  // We'll post a regular reel comment to backend but, on success, append it nested under the parent comment's replies container.
  async function postReplyReel(reelId, commentId, username) {
    const input = document.getElementById(`reply-input-${commentId}`);
    if (!input) return;
    const content = input.value.trim();
    if (!content) return;
    input.disabled = true;
    try {
      // Construct reply content - we keep original server behavior (prefix with @username)
      const bodyContent = `@${username} ${content}`;
      const res = await fetch(`/api/reels/${encodeURIComponent(reelId)}/comment`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: bodyContent })
      });
      const json = await res.json().catch(()=>({ ok: false }));
      if (res.ok && json.ok && json.comment) {
        // Append reply visually under parent comment
        const reply = json.comment;
        const repliesContainer = document.getElementById(`replies-container-${commentId}`);
        if (repliesContainer) {
          repliesContainer.insertAdjacentHTML('beforeend', `
            <div class="reply-item flex items-start gap-2">
              <img src="${escapeHtml(reply.profile_picture_url || 'https://via.placeholder.com/40')}" class="small-avatar flex-shrink-0" alt="${escapeHtml(reply.username || '')}">
              <div class="flex-1">
                <div class="text-xs text-gray-300 font-bold">${escapeHtml(reply.username || '')}</div>
                <div class="text-sm text-gray-200">${escapeHtml(reply.content || '')}</div>
              </div>
            </div>
          `);
        } else {
          // if parent container missing, append at bottom of list
          commentsList.insertAdjacentHTML('beforeend', createReelCommentElement(reply, reelId));
        }

        // update reel comment count visually
        const commentCountSpan = document.getElementById(`commentCount-${reelId}`);
        if (commentCountSpan) commentCountSpan.textContent = parseInt(commentCountSpan.textContent || '0') + 1;

        // hide reply box and clear input
        const box = document.getElementById(`reply-box-${commentId}`);
        if (box) box.classList.add('hidden');
        input.value = '';

        // scroll to show new reply
        setTimeout(()=> { const container = document.getElementById(`replies-container-${commentId}`); if (container) container.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 80);
      } else {
        throw new Error(json.error || 'Failed to post reply');
      }
    } catch (e) {
      console.error('postReplyReel error', e);
      alert('فشل في إرسال الرد');
    } finally {
      input.disabled = false;
    }
  }

  window.shareReel = function(reelId) {
    const shareUrl = window.location.origin + '/reels?id=' + reelId;
    if (navigator.share) {
      navigator.share({ title: 'شاهد هذا الريل', url: shareUrl });
    } else {
      navigator.clipboard.writeText(shareUrl);
      alert('تم نسخ الرابط!');
    }
  };

  // VERIFIED BADGES: find placeholders and replace with badge image when profile.is_verified === true
  async function updateVerifiedBadges() {
    const placeholders = Array.from(document.querySelectorAll('.verified-placeholder'));
    if (placeholders.length === 0) return;
    // dedupe ids
    const byId = {};
    placeholders.forEach(ph => {
      const uid = ph.dataset.userId;
      if (uid) byId[uid] = true;
    });
    const ids = Object.keys(byId).filter(id => id);
    await Promise.all(ids.map(async uid => {
      try {
        const r = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'include' });
        if (!r.ok) return; 
        const data = await r.json();
        if (data && data.is_verified) {
          // replace all placeholders for this uid
          document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => {
            const img = document.createElement('img');
            img.src = VERIFIED_IMG_URL;
            img.alt = 'موثق';
            img.title = 'موثق';
            img.className = 'verified-badge-img';
            ph.replaceWith(img);
          });
        } else {
          // remove placeholders for this uid
          document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
        }
      } catch (e) {
        // on error, just remove placeholders to avoid stale UI
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
      }
    }));
  }

  // small helpers
  function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/"/g, '&quot;');
  }

  // Update badges again when user comes back to view
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') updateVerifiedBadges();
  });
</script>
</body>
