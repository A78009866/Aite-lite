<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; overflow: hidden; margin: 0; }
        .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reel-item { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; }
        .action-btn { background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .comment-sheet { position: fixed; bottom: 0; left: 0; width: 100%; height: 70vh; background: #121212; border-radius: 2rem 2rem 0 0; transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        .comment-sheet.active { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="reels-container" id="reelsList">
        <div class="reel-item">
            <video loop playsinline onclick="this.paused ? this.play() : this.pause()" class="w-full h-full object-cover" src=""></video>
            
            <div class="absolute left-4 bottom-24 flex flex-col gap-5 z-50">
                <button onclick="handleLike(this)" class="flex flex-col items-center">
                    <div class="action-btn text-white"><i class="fas fa-heart"></i></div>
                    <span class="text-white text-xs mt-1 font-bold">12K</span>
                </button>
                <button onclick="openComments('REEL_ID')" class="flex flex-col items-center">
                    <div class="action-btn text-white"><i class="fas fa-comment-dots"></i></div>
                    <span class="text-white text-xs mt-1 font-bold">450</span>
                </button>
                <button onclick="copyLink()" class="flex flex-col items-center">
                    <div class="action-btn text-white"><i class="fas fa-share"></i></div>
                    <span class="text-white text-xs mt-1 font-bold">نسخ</span>
                </button>
            </div>
        </div>
    </div>

    <div id="commentSheet" class="comment-sheet p-6 flex flex-col">
        <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-6" onclick="closeComments()"></div>
        <h3 class="text-white font-bold text-lg mb-4">التعليقات</h3>
        <div id="commentsContent" class="flex-1 overflow-y-auto space-y-4 mb-20 text-white">
            </div>
        <div class="absolute bottom-6 left-6 right-6 flex gap-2">
            <input id="commentInput" type="text" placeholder="أضف تعليقاً..." class="flex-1 bg-white/10 rounded-full px-6 py-3 text-white outline-none">
            <button onclick="postComment()" class="bg-blue-600 w-12 h-12 rounded-full text-white"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        function openComments(id) {
            document.getElementById('commentSheet').classList.add('active');
        }
        function closeComments() {
            document.getElementById('commentSheet').classList.remove('active');
        }
        function handleLike(btn) {
            const icon = btn.querySelector('i');
            icon.classList.toggle('text-red-500');
            icon.style.transform = 'scale(1.2)';
            setTimeout(() => icon.style.transform = 'scale(1)', 200);
        }
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('تم نسخ الرابط بنجاح!');
        }
        function postComment() {
            const val = document.getElementById('commentInput').value;
            if(!val) return;
            const list = document.getElementById('commentsContent');
            list.innerHTML += `<div class="bg-white/5 p-3 rounded-2xl"><p class="text-sm">${val}</p></div>`;
            document.getElementById('commentInput').value = '';
        }
    </script>
</body>
</html>
