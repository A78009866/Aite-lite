<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الريلز - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow:  hidden;
        }

        . reels-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .reel-item {
            width: 100%;
            height:  100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Overlay Controls */
        .reel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent, rgba(0,0,0,0.6));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition:  opacity 0.3s ease;
            z-index: 10;
        }

        .reel-item.active .reel-overlay {
            opacity: 1;
        }

        /* Top Controls */
        .reel-top-controls {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reel-back-btn {
            width: 44px;
            height: 44px;
            border-radius:  50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .reel-back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Center Play Button */
        .reel-play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition:  opacity 0.3s ease;
            z-index: 5;
            cursor: pointer;
        }

        .reel-item.paused .reel-play-overlay {
            opacity: 1;
        }

        . reel-play-button {
            width: 80px;
            height: 80px;
            border-radius:  50%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .reel-item.paused .reel-play-button: hover {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Right Side Actions */
        .reel-actions {
            position: absolute;
            right: 1rem;
            bottom: 8rem;
            display: flex;
            flex-direction: column;
            gap: 1. 5rem;
            z-index: 20;
        }

        .action-button {
            width: 50px;
            height: 50px;
            border-radius:  50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            gap: 0.25rem;
        }

        .action-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .action-button.liked {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            border-color: #ef4444;
        }

        .action-button i {
            font-size: 1.5rem;
        }

        . action-label {
            font-size: 0.7rem;
            text-align: center;
            line-height: 1;
            margin-top: 0.25rem;
        }

        /* Bottom Info */
        .reel-bottom-info {
            padding: 2rem 1rem 5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .reel-user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom:  1rem;
        }

        .reel-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            cursor: pointer;
        }

        .reel-user-name {
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .reel-user-name:hover {
            color: #3b82f6;
        }

        .reel-caption {
            color: #e4e6eb;
            line-height: 1.4;
            word-wrap: break-word;
            margin-bottom: 1rem;
        }

        /* Bottom Controls Bar */
        .reel-bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display:  flex;
            align-items: center;
            justify-content: space-between;
            z-index: 15;
        }

        .progress-container {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin:  0 0.5rem;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition:  width 0.1s linear;
        }

        .time-display {
            color: #e4e6eb;
            font-size: 0.75rem;
            font-family: monospace;
            min-width: 60px;
            text-align: center;
        }

        /* Comments Modal */
        .comments-modal {
            position: fixed;
            bottom: 0;
            left:  0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 70vh;
            overflow-y:  auto;
            animation: slideUp 0.3s ease;
            z-index: 50;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .comments-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 1. 5rem;
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom:  1px solid rgba(255, 255, 255, 0.1);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
            max-height: calc(70vh - 200px);
            overflow-y: auto;
        }

        .comment-item {
            display: flex;
            gap: 0.75rem;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius:  50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        . comment-username {
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
        }

        .comment-time {
            color: #9ca3af;
            font-size: 0.75rem;
        }

        .comment-text {
            color: #e4e6eb;
            font-size: 0.9rem;
            line-height: 1.3;
            word-wrap: break-word;
        }

        .comment-input-container {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comment-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border:  1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 20px;
            font-size:  0.9rem;
        }

        .comment-input:: placeholder {
            color: #9ca3af;
        }

        .comment-input: focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #3b82f6;
        }

        . comment-submit {
            background:  #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        .comment-submit:hover {
            background: #2563eb;
        }

        .comment-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading State */
        .reel-loading {
            position:  absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 100;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            width: 100%;
            height:  100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
        }

        . empty-state p {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* Scrollbar for Comments */
        .comments-list: :-webkit-scrollbar {
            width: 6px;
        }

        . comments-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .comments-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="reels-container" id="reelsContainer">
        <!-- Reels will be injected here -->
    </div>

    <!-- Comments Modal -->
    <div id="commentsModal" class="comments-modal hidden">
        <div class="comments-container">
            <div class="comments-header">
                <h3 class="text-lg font-bold text-white">التعليقات</h3>
                <button id="closeCommentsBtn" class="text-gray-400 hover:text-white transition text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="comments-list" id="commentsList"></div>
            <div class="comment-input-container">
                <input type="text" id="commentInput" placeholder="أضف تعليقاً..." class="comment-input">
                <button id="commentSubmitBtn" class="comment-submit">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== Variables ====================
        let reels = [];
        let currentReelIndex = 0;
        let currentUserId = null;
        let commentsModalOpen = false;
        let currentReelForComments = null;

        const reelsContainer = document.getElementById('reelsContainer');
        const commentsModal = document.getElementById('commentsModal');
        const commentsList = document.getElementById('commentsList');
        const commentInput = document.getElementById('commentInput');
        const commentSubmitBtn = document.getElementById('commentSubmitBtn');
        const closeCommentsBtn = document.getElementById('closeCommentsBtn');

        // ==================== Fetch Reels ====================
        async function fetchReels() {
            try {
                const response = await fetch('/api/reels');
                const result = await response.json();

                if (result.ok && result.reels.length > 0) {
                    reels = result. reels;
                    renderReels();
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('Error fetching reels:', error);
                showEmptyState();
            }
        }

        // ==================== Render Reels ====================
        function renderReels() {
            reelsContainer.innerHTML = '';

            reels.forEach((reel, index) => {
                const reelElement = createReelElement(reel, index);
                reelsContainer.appendChild(reelElement);
            });

            // Set first reel as active
            setActiveReel(0);
            attachScrollListener();
        }

        function createReelElement(reel, index) {
            const div = document.createElement('div');
            div.className = 'reel-item';
            div. dataset.index = index;

            const isVideo = reel.media?. type === 'video';
            const mediaUrl = reel.media?.url || '';

            div.innerHTML = `
                <video 
                    class="reel-video" 
                    data-reel-id="${reel.reelId}"
                    ${isVideo ? `src="${mediaUrl}"` : `poster="${mediaUrl}"`}
                    loop
                    muted
                    playsinline>
                </video>

                <div class="reel-play-overlay" onclick="toggleReelPlayPause(${index}, event)">
                    <div class="reel-play-button">
                        <i class="fas fa-play"></i>
                    </div>
                </div>

                <div class="reel-overlay">
                    <div class="reel-top-controls">
                        <a href="/reels" class="reel-back-btn" title="عودة">
                            <i class="fas fa-arrow-right"></i>
                        </a>
                        <div></div>
                    </div>

                    <div class="reel-bottom-info">
                        <div class="reel-user-info">
                            <img src="${reel.user.profile_picture_url}" alt="${reel.user.username}" class="reel-user-avatar">
                            <span class="reel-user-name">${reel.user.username}</span>
                        </div>
                        ${reel.content ?  `<p class="reel-caption">${escapeHtml(reel.content)}</p>` : ''}
                    </div>
                </div>

                <div class="reel-actions">
                    <button class="action-button like-btn ${reel.is_liked ? 'liked' :  ''}" 
                            onclick="toggleLikeReel('${reel.reelId}', ${index}, event)"
                            title="إعجاب">
                        <i class="fas fa-heart"></i>
                        <span class="action-label">${reel.likes}</span>
                    </button>
                    <button class="action-button" onclick="openCommentsModal('${reel.reelId}', ${index}, event)" title="تعليقات">
                        <i class="fas fa-comment"></i>
                        <span class="action-label">${reel.commentsCount}</span>
                    </button>
                    <button class="action-button" onclick="shareReel('${reel.reelId}', event)" title="مشاركة">
                        <i class="fas fa-share"></i>
                    </button>
                </div>

                <div class="reel-bottom-controls">
                    <div class="time-display">0:00</div>
                    <div class="progress-container" onclick="seekVideo(${index}, event)">
                        <div class="progress-bar"></div>
                    </div>
                    <div class="time-display">0:00</div>
                </div>
            `;

            return div;
        }

        // ==================== Reel Controls ====================
        function setActiveReel(index) {
            document.querySelectorAll('.reel-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
                
                const video = item.querySelector('video');
                if (i === index) {
                    video.play().catch(e => console.log('Autoplay prevented:', e));
                    item.classList.remove('paused');
                    startVideoProgressTracking(index);
                } else {
                    video.pause();
                }
            });

            currentReelIndex = index;
        }

        function toggleReelPlayPause(index, event) {
            event.stopPropagation();
            const reel = document.querySelector(`[data-index="${index}"]`);
            const video = reel.querySelector('video');

            if (video.paused) {
                video.play();
                reel.classList.remove('paused');
            } else {
                video.pause();
                reel.classList.add('paused');
            }
        }

        function startVideoProgressTracking(index) {
            const reel = document.querySelector(`[data-index="${index}"]`);
            const video = reel. querySelector('video');
            const progressBar = reel.querySelector('.progress-bar');
            const timeDisplays = reel.querySelectorAll('.time-display');

            const updateProgress = () => {
                if (video.duration) {
                    const percent = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = percent + '%';

                    timeDisplays[0].textContent = formatTime(video.currentTime);
                    timeDisplays[1].textContent = formatTime(video.duration);
                }
            };

            video.addEventListener('timeupdate', updateProgress);

            return () => {
                video.removeEventListener('timeupdate', updateProgress);
            };
        }

        function seekVideo(index, event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percent = clickX / rect.width;

            const reel = document.querySelector(`[data-index="${index}"]`);
            const video = reel.querySelector('video');

            video.currentTime = percent * video.duration;
        }

        // ==================== Like Functionality ====================
        async function toggleLikeReel(reelId, index, event) {
            event.stopPropagation();

            const button = document.querySelector(`[data-index="${index}"] .like-btn`);
            const labelSpan = button.querySelector('.action-label');

            try {
                const response = await fetch(`/api/reels/${reelId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.ok) {
                    button.classList.toggle('liked', result.action === 'liked');
                    labelSpan.textContent = result.newLikes;
                    reels[index].is_liked = result.action === 'liked';
                    reels[index].likes = result.newLikes;
                }
            } catch (error) {
                console.error('Error liking reel:', error);
            }
        }

        // ==================== Comments ====================
        async function openCommentsModal(reelId, index, event) {
            event.stopPropagation();

            currentReelForComments = { reelId, index };
            commentsModalOpen = true;
            commentsModal.classList.remove('hidden');

            await fetchCommentsForReel(reelId);
        }

        closeCommentsBtn.addEventListener('click', () => {
            commentsModal.classList.add('hidden');
            commentsModalOpen = false;
            currentReelForComments = null;
            commentInput.value = '';
        });

        async function fetchCommentsForReel(reelId) {
            try {
                const response = await fetch(`/api/reels/${reelId}/comments`);
                const result = await response.json();

                commentsList.innerHTML = '';

                if (result.ok && result.comments.length > 0) {
                    result.comments.forEach(comment => {
                        const commentDiv = createCommentElement(comment);
                        commentsList.appendChild(commentDiv);
                    });
                } else {
                    commentsList.innerHTML = '<p class="text-gray-400 text-center">لا توجد تعليقات حتى الآن</p>';
                }

                // Scroll to bottom
                commentsList.scrollTop = commentsList.scrollHeight;
            } catch (error) {
                console. error('Error fetching comments:', error);
            }
        }

        function createCommentElement(comment) {
            const div = document.createElement('div');
            div.className = 'comment-item';

            const date = new Date(comment.timestamp).toLocaleString('ar-EG', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            div.innerHTML = `
                <img src="${comment.user.profile_picture_url}" alt="${comment. user.username}" class="comment-avatar">
                <div class="comment-content">
                    <div class="comment-header">
                        <span class="comment-username">${comment.user.username}</span>
                        <span class="comment-time">${date}</span>
                    </div>
                    <p class="comment-text">${escapeHtml(comment. content)}</p>
                </div>
            `;

            return div;
        }

        commentSubmitBtn.addEventListener('click', async () => {
            if (! currentReelForComments || !commentInput.value.trim()) return;

            const { reelId, index } = currentReelForComments;
            const content = commentInput.value.trim();

            try {
                commentSubmitBtn.disabled = true;
                commentSubmitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                const response = await fetch(`/api/reels/${reelId}/comment`, {
                    method: 'POST',
                    headers:  { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                const result = await response.json();

                if (result.ok) {
                    const commentDiv = createCommentElement(result.comment);
                    commentsList.appendChild(commentDiv);

                    // Update comment count
                    const button = document.querySelector(`[data-index="${index}"] .action-button: nth-child(2)`);
                    button.querySelector('.action-label').textContent = result.newComments;
                    reels[index].commentsCount = result.newComments;

                    commentInput.value = '';
                    commentsList.scrollTop = commentsList.scrollHeight;
                }
            } catch (error) {
                console.error('Error posting comment:', error);
            } finally {
                commentSubmitBtn. disabled = false;
                commentSubmitBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        });

        commentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commentSubmitBtn.click();
            }
        });

        // ==================== Scroll Listener ====================
        function attachScrollListener() {
            let scrollTimeout;

            reelsContainer.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);

                scrollTimeout = setTimeout(() => {
                    const scrollTop = reelsContainer.scrollTop;
                    const itemHeight = window.innerHeight;
                    const newIndex = Math.round(scrollTop / itemHeight);

                    if (newIndex !== currentReelIndex && newIndex < reels.length) {
                        setActiveReel(newIndex);
                    }
                }, 100);
            });

            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                if (commentsModalOpen) return;

                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const newIndex = Math.max(0, currentReelIndex - 1);
                    reelsContainer.scrollTo({
                        top: newIndex * window.innerHeight,
                        behavior: 'smooth'
                    });
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const newIndex = Math.min(reels.length - 1, currentReelIndex + 1);
                    reelsContainer.scrollTo({
                        top: newIndex * window. innerHeight,
                        behavior:  'smooth'
                    });
                } else if (e.key === ' ') {
                    e. preventDefault();
                    toggleReelPlayPause(currentReelIndex, { stopPropagation: () => {} });
                }
            });
        }

        // ==================== Share ====================
        function shareReel(reelId, event) {
            event.stopPropagation();

            const text = `شاهد هذا الريل المذهل على Aite!  🎬`;
            const url = window.location.origin + '/reels';

            if (navigator.share) {
                navigator.share({
                    title: 'Aite',
                    text: text,
                    url: url
                });
            } else {
                // Fallback
                const shareText = `${text}\n${url}`;
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('تم نسخ رابط المشاركة! ');
                });
            }
        }

        // ==================== Utility ====================
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showEmptyState() {
            reelsContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-film"></i>
                    <p>لا توجد ريلز لعرضها حالياً</p>
                    <a href="/create-reel" class="text-blue-400 hover:text-blue-300 transition">
                        <i class="fas fa-plus ml-1"></i>أنشئ ريل الآن
                    </a>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile')
                .then(r => r.json())

                    fetchReels();

                .catch(() => fetchReels());
