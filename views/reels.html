<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trimer Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; color: #fff; }
        
        /* حاوية الريلز */
        .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel-video-wrapper { position: relative; width: 100%; height: 100vh; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* واجهة التحكم الجانبية */
        .reel-actions { position: absolute; bottom: 80px; left: 15px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .action-btn i { font-size: 28px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .action-btn span { font-size: 12px; font-weight: bold; }
        .liked i { color: #ff3b5c; }

        /* معلومات المستخدم */
        .reel-info { position: absolute; bottom: 30px; right: 15px; left: 80px; z-index: 10; text-align: right; }
        .user-details { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .user-details img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; }
        .user-details h4 { margin: 0; font-size: 16px; }
        .reel-content { font-size: 14px; margin: 0; opacity: 0.9; }

        /* نافذة التعليقات السفلية */
        .comments-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 70%; background: #1a1a1a; border-radius: 20px 20px 0 0; z-index: 100; transition: 0.3s ease-out; display: flex; flex-direction: column; }
        .comments-sheet.active { bottom: 0; }
        .sheet-header { padding: 15px; border-bottom: 1px solid #333; text-align: center; position: relative; }
        .close-sheet { position: absolute; left: 15px; top: 15px; font-size: 20px; color: #888; }
        .comments-list { flex: 1; overflow-y: auto; padding: 15px; }
        .comment-item { display: flex; gap: 10px; margin-bottom: 15px; }
        .comment-item img { width: 30px; height: 30px; border-radius: 50%; }
        .comment-text h5 { margin: 0; font-size: 13px; color: #aaa; }
        .comment-text p { margin: 2px 0 0; font-size: 14px; }
        
        .comment-input-area { padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; }
        .comment-input-area input { flex: 1; background: #333; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; }

        /* أنيميشن القلب عند الضغط المزدوج */
        .heart-overlay { position: absolute; font-size: 100px; color: white; opacity: 0; transform: scale(0); pointer-events: none; transition: 0.3s; z-index: 20; }
        .heart-overlay.animate { opacity: 0.8; transform: scale(1.2); animation: pop 0.8s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 0; } }

        /* شريط التنقل السفلي */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; z-index: 50; }
        .nav-bar a { color: #fff; text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>

<div class="reels-container" id="reelsContainer">
    </div>

<div class="comments-sheet" id="commentsSheet">
    <div class="sheet-header">
        <i class="fas fa-times close-sheet" onclick="toggleComments()"></i>
        <span>التعليقات</span>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="أضف تعليقاً...">
        <button class="action-btn" onclick="postComment()"><i class="fas fa-paper-plane" style="color: #0095f6;"></i></button>
    </div>
</div>

<div class="nav-bar">
    <a href="/chat_list"><i class="fas fa-home"></i></a>
    <a href="/reels" style="color: #ff3b5c;"><i class="fas fa-play-circle"></i></a>
    <a href="/create-reel"><i class="fas fa-plus-square"></i></a>
    <a href="/profile"><i class="fas fa-user"></i></a>
</div>

<script>
    let currentReelId = null;

    async function loadReels() {
        const res = await fetch('/api/reels');
        const data = await res.json();
        if (data.ok) {
            const container = document.getElementById('reelsContainer');
            container.innerHTML = data.reels.map(reel => `
                <div class="reel-video-wrapper" ondblclick="handleLike('${reel.reelId}', this)">
                    <video loop playsinline onclick="togglePlay(this)">
                        <source src="${reel.media.url}" type="video/mp4">
                    </video>
                    <i class="fas fa-heart heart-overlay"></i>
                    
                    <div class="reel-actions">
                        <div class="action-btn ${reel.is_liked ? 'liked' : ''}" id="like-btn-${reel.reelId}" onclick="handleLike('${reel.reelId}', this.parentElement.parentElement)">
                            <i class="fas fa-heart"></i>
                            <span id="like-count-${reel.reelId}">${reel.likes || 0}</span>
                        </div>
                        <div class="action-btn" onclick="openComments('${reel.reelId}')">
                            <i class="fas fa-comment"></i>
                            <span>${reel.commentsCount || 0}</span>
                        </div>
                    </div>

                    <div class="reel-info">
                        <div class="user-details">
                            <img src="${reel.user.profile_picture_url}" alt="">
                            <h4>@${reel.user.username}</h4>
                        </div>
                        <p class="reel-content">${reel.content || ''}</p>
                    </div>
                </div>
            `).join('');
            
            // تشغيل أول فيديو تلقائياً
            const firstVideo = document.querySelector('video');
            if(firstVideo) firstVideo.play();
        }
    }

    function togglePlay(video) {
        if (video.paused) video.play();
        else video.pause();
    }

    async function handleLike(reelId, element) {
        const heart = element.querySelector('.heart-overlay');
        heart.classList.add('animate');
        setTimeout(() => heart.classList.remove('animate'), 800);

        const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
            const likeBtn = document.getElementById(`like-btn-${reelId}`);
            const likeCount = document.getElementById(`like-count-${reelId}`);
            data.action === 'liked' ? likeBtn.classList.add('liked') : likeBtn.classList.remove('liked');
            likeCount.innerText = data.newLikes;
        }
    }

    async function openComments(reelId) {
        currentReelId = reelId;
        document.getElementById('commentsSheet').classList.add('active');
        const res = await fetch(`/api/reels/${reelId}/comments`);
        const data = await res.json();
        const list = document.getElementById('commentsList');
        list.innerHTML = data.comments.map(c => `
            <div class="comment-item">
                <img src="${c.user.profile_picture_url}">
                <div class="comment-text">
                    <h5>${c.user.username}</h5>
                    <p>${c.content}</p>
                </div>
            </div>
        `).join('');
    }

    function toggleComments() {
        document.getElementById('commentsSheet').classList.remove('active');
    }

    async function postComment() {
        const input = document.getElementById('commentInput');
        if (!input.value.trim()) return;

        const res = await fetch(`/api/reels/${currentReelId}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: input.value })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            openComments(currentReelId); // تحديث القائمة
        }
    }

    window.onload = loadReels;
</script>
</body>
</html>
