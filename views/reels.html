<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; overflow: hidden; margin: 0; }
        .reels-container { height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }
        .reel-item { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { height: 100%; width: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 80px; left: 15px; right: 15px; pointer-events: none; z-index: 10; }
        .actions { position: absolute; bottom: 100px; right: 15px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 20; }
        .action-btn { background: none; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .action-label { font-size: 12px; margin-top: 4px; }
        
        /* تأثير القلب عند الضغط مرتين */
        .heart-animation { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; color: white; opacity: 0; pointer-events: none; transition: all 0.5s ease; z-index: 50; }
        .heart-animation.active { animation: popHeart 0.8s ease-out; }
        @keyframes popHeart { 0% { opacity: 0; scale: 0; } 50% { opacity: 0.9; scale: 1.2; } 100% { opacity: 0; scale: 1.5; } }

        /* نافذة التعليقات السفلية */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; height: 70vh; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(20px); border-radius: 20px 20px 0 0; z-index: 100; transition: bottom 0.3s ease; border-top: 1px solid rgba(255,255,255,0.1); }
        .bottom-sheet.open { bottom: 0; }
    </style>
</head>
<body>

    <div id="reelsContainer" class="reels-container">
        </div>

    <div id="commentSheet" class="bottom-sheet flex flex-col p-4">
        <div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-4 cursor-pointer" onclick="closeComments()"></div>
        <h3 class="text-lg font-bold mb-4 text-center">التعليقات</h3>
        <div id="commentsList" class="flex-grow overflow-y-auto space-y-4 mb-4 p-2"></div>
        <div class="flex items-center gap-2 border-t border-gray-800 pt-3">
            <input type="text" id="commentInput" placeholder="أضف تعليقاً..." class="flex-grow bg-white/10 rounded-full py-2 px-4 focus:outline-none">
            <button onclick="postComment()" class="text-blue-500 font-bold px-2">نشر</button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 z-50 bg-black/60 backdrop-blur-lg border-t border-white/10 h-16 flex justify-around items-center">
        <a href="/chat_list" class="text-gray-400"><i class="fas fa-home text-xl"></i></a>
        <a href="/users_list" class="text-gray-400"><i class="fas fa-comment-dots text-xl"></i></a>
        <a href="/reels" class="text-blue-400"><i class="fas fa-clapperboard text-xl"></i></a>
        <a href="/create-reel" class="text-gray-400"><i class="fas fa-plus-square text-xl"></i></a>
    </div>

    <script>
        let currentReelId = null;
        const container = document.getElementById('reelsContainer');

        async function fetchReels() {
            const res = await fetch('/api/reels');
            const data = await res.json();
            if (data.ok) {
                data.reels.forEach(reel => renderReel(reel));
                observeVideos();
            }
        }

        function renderReel(reel) {
            const reelEl = document.createElement('div');
            reelEl.className = 'reel-item';
            reelEl.innerHTML = `
                <video src="${reel.videoUrl}" loop id="video-${reel.id}" onclick="togglePlay(this)" ondblclick="handleDoubleLike('${reel.id}', event)"></video>
                <i class="fas fa-heart heart-animation" id="heart-${reel.id}"></i>
                <div class="overlay">
                    <p class="font-bold text-lg">@${reel.username}</p>
                    <p class="text-sm text-gray-200 mt-1">${reel.caption || ''}</p>
                </div>
                <div class="actions">
                    <button class="action-btn" onclick="likeReel('${reel.id}')">
                        <i class="fas fa-heart ${reel.isLiked ? 'text-red-500' : ''}" id="likeIcon-${reel.id}"></i>
                        <span class="action-label" id="likeCount-${reel.id}">${reel.likesCount || 0}</span>
                    </button>
                    <button class="action-btn" onclick="openComments('${reel.id}')">
                        <i class="fas fa-comment"></i>
                        <span class="action-label">${reel.commentsCount || 0}</span>
                    </button>
                    <button class="action-btn"><i class="fas fa-share"></i></button>
                </div>
            `;
            container.appendChild(reelEl);
        }

        // تشغيل الفيديو عند ظهوره في الشاشة
        function observeVideos() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play();
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.8 });
            document.querySelectorAll('video').forEach(v => observer.observe(v));
        }

        // إعجاب بضغطتين
        function handleDoubleLike(reelId, event) {
            const heart = document.getElementById(`heart-${reelId}`);
            heart.classList.add('active');
            setTimeout(() => heart.classList.remove('active'), 800);
            likeReel(reelId);
        }

        async function likeReel(reelId) {
            const res = await fetch(`/api/reels/${reelId}/like`, { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                const icon = document.getElementById(`likeIcon-${reelId}`);
                icon.classList.toggle('text-red-500', data.isLiked);
                document.getElementById(`likeCount-${reelId}`).innerText = data.newLikes;
            }
        }

        function togglePlay(video) {
            video.paused ? video.play() : video.pause();
        }

        function openComments(reelId) {
            currentReelId = reelId;
            document.getElementById('commentSheet').classList.add('open');
            loadComments(reelId);
        }

        function closeComments() {
            document.getElementById('commentSheet').classList.remove('open');
        }

        async function loadComments(reelId) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-gray-500">جاري تحميل التعليقات...</p>';
            const res = await fetch(`/api/reels/${reelId}/comments`);
            const data = await res.json();
            list.innerHTML = '';
            data.comments.forEach(c => {
                list.innerHTML += `
                    <div class="flex gap-3">
                        <img src="${c.profile_picture_url}" class="w-8 h-8 rounded-full">
                        <div>
                            <p class="text-sm font-bold">@${c.username}</p>
                            <p class="text-sm text-gray-300">${c.content}</p>
                        </div>
                    </div>`;
            });
        }

        fetchReels();
    </script>
</body>
</html>
