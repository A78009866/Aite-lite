<! DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء ريل جديد - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #e4e6eb;
            font-family:  'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .drag-over {
            background-color: rgba(59, 130, 246, 0.2) !important;
            border-color: #3b82f6 !important;
        }

        .upload-progress-container {
            background: linear-gradient(90deg, #1f2937 0%, #111827 100%);
            border:  1px solid rgba(59, 130, 246, 0.3);
        }

        .progress-bar-animated {
            background:  linear-gradient(90deg, #3b82f6, #1d4ed8);
            animation: progress-animation 1. 5s ease-in-out infinite;
        }

        @keyframes progress-animation {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .video-preview-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .glass-effect {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border:  1px solid rgba(255, 255, 255, 0.1);
        }

        .glow-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0);
        }

        .glow-button:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .custom-scroll: :-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #3b82f6;
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background-color: #1f2937;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        . fade-in-scale {
            animation: fadeInScale 0.3s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-3xl">
        
        <!-- Header -->
        <header class="mb-8 fade-in-scale">
            <div class="flex items-center justify-between mb-6">
                <a href="/reels" class="text-gray-400 hover:text-blue-500 transition duration-300 p-2 rounded-full hover:bg-white/5" title="العودة للريلز">
                    <i class="fas fa-arrow-right text-2xl"></i>
                </a>
                <h1 class="text-3xl sm:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 flex-grow text-center">
                    <i class="fas fa-video text-blue-400 ml-2"></i>إنشاء ريل جديد
                </h1>
                <div class="w-10"></div>
            </div>
            <p class="text-center text-gray-400 text-sm">شارك لحظاتك المميزة مع الجميع</p>
        </header>

        <!-- Main Container -->
        <div class="glass-effect rounded-2xl p-6 sm:p-8 shadow-2xl">
            
            <form id="createReelForm" action="/api/reels/create" method="POST" enctype="multipart/form-data">
                
                <!-- Media Upload Section -->
                <div class="mb-8">
                    <label class="block text-sm font-semibold text-gray-300 mb-4">
                        <i class="fas fa-film ml-2 text-blue-400"></i>الفيديو أو الصورة
                    </label>

                    <div id="dropZone" 
                         class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer transition-all duration-300 hover: border-blue-400 hover: bg-blue-500/5"
                         onclick="document.getElementById('mediaFile').click()">
                        
                        <i class="fas fa-cloud-upload-alt text-5xl text-gray-500 mb-4 block"></i>
                        <h3 class="text-lg font-semibold text-white mb-2">اسحب ملفك هنا أو انقر للاختيار</h3>
                        <p class="text-sm text-gray-400">نسق مدعومة:  MP4, WebM, MOV (الحد الأقصى 500 ميجابايت)</p>
                        
                        <input type="file" id="mediaFile" name="media" accept="video/*,image/*" class="hidden">
                    </div>

                    <!-- File Info -->
                    <div id="fileInfo" class="mt-4 hidden bg-gray-800 rounded-lg p-4 flex items-center justify-between">
                        <div class="flex items-center">
                            <i class="fas fa-check-circle text-green-500 text-2xl ml-3"></i>
                            <div class="text-right">
                                <p id="fileName" class="text-white font-semibold"></p>
                                <p id="fileSize" class="text-gray-400 text-sm"></p>
                            </div>
                        </div>
                        <button type="button" id="removeFileBtn" class="text-red-500 hover:text-red-400 transition">
                            <i class="fas fa-times-circle text-2xl"></i>
                        </button>
                    </div>

                    <!-- Video Preview -->
                    <div id="videoPreviewContainer" class="hidden mt-4">
                        <p class="text-gray-400 text-sm mb-2">معاينة: </p>
                        <div class="video-preview-container w-full aspect-video bg-black">
                            <video id="previewVideo" class="preview-video" controls></video>
                        </div>
                    </div>

                    <!-- Upload Progress -->
                    <div id="uploadProgress" class="hidden mt-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-400 text-sm">جاري التحميل...</span>
                            <span id="progressPercent" class="text-blue-400 font-semibold">0%</span>
                        </div>
                        <div class="upload-progress-container rounded-full h-2 overflow-hidden">
                            <div id="progressBar" class="progress-bar-animated h-full w-0 transition-all duration-300"></div>
                        </div>
                    </div>
                </div>

                <!-- Caption Section -->
                <div class="mb-8">
                    <label class="block text-sm font-semibold text-gray-300 mb-4">
                        <i class="fas fa-pen-fancy ml-2 text-purple-400"></i>الوصف
                    </label>
                    <textarea id="reelCaption" 
                              name="content" 
                              rows="3" 
                              placeholder="أضف وصفاً للريل (اختياري)..."
                              class="custom-scroll w-full p-4 bg-gray-800 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-500 resize-none transition-all duration-300 hover: border-gray-600"></textarea>
                    <p id="charCount" class="text-gray-500 text-xs mt-2">0 / 500 حرف</p>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4 flex-col sm:flex-row-reverse">
                    <button type="submit" id="submitBtn" class="glow-button flex-1 p-3 px-6 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 rounded-xl text-white font-bold transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
                        <i id="submitIcon" class="fas fa-rocket"></i>
                        <span id="submitText">نشر الريل</span>
                    </button>

                    <button type="button" id="cancelBtn" class="flex-1 p-3 px-6 bg-gray-700 hover:bg-gray-600 rounded-xl text-white font-semibold transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fas fa-times"></i>
                        إلغاء
                    </button>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/50 rounded-lg text-red-400 text-sm flex items-center gap-3">
                    <i class="fas fa-exclamation-circle text-lg flex-shrink-0"></i>
                    <span id="errorText"></span>
                </div>

                <!-- Success Message -->
                <div id="successMessage" class="hidden mt-6 p-4 bg-green-500/10 border border-green-500/50 rounded-lg text-green-400 text-sm flex items-center gap-3">
                    <i class="fas fa-check-circle text-lg flex-shrink-0"></i>
                    <span>تم نشر الريل بنجاح!  إعادة التوجيه... </span>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==================== DOM Elements ====================
        const form = document.getElementById('createReelForm');
        const mediaFile = document.getElementById('mediaFile');
        const dropZone = document.getElementById('dropZone');
        const fileInfo = document. getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const videoPreviewContainer = document.getElementById('videoPreviewContainer');
        const previewVideo = document.getElementById('previewVideo');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const reelCaption = document.getElementById('reelCaption');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitIcon = document.getElementById('submitIcon');
        const cancelBtn = document.getElementById('cancelBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');

        // ==================== Drag & Drop ====================
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone. addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone. addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                mediaFile.files = files;
                handleFileSelect();
            }
        });

        // ==================== File Selection ====================
        mediaFile.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            errorMessage.classList.add('hidden');
            
            if (mediaFile.files.length === 0) {
                resetUI();
                return;
            }

            const file = mediaFile.files[0];
            const maxSize = 500 * 1024 * 1024; // 500MB

            // Validation
            if (!file. type.startsWith('video/') && !file.type.startsWith('image/')) {
                showError('الرجاء اختيار فيديو أو صورة');
                mediaFile.value = '';
                return;
            }

            if (file.size > maxSize) {
                showError('حجم الملف يجب أن يكون أقل من 500 ميجابايت');
                mediaFile.value = '';
                return;
            }

            // Display file info
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.remove('hidden');

            // Preview
            const reader = new FileReader();
            reader.onload = (e) => {
                if (file.type.startsWith('video/')) {
                    previewVideo.src = e.target.result;
                    videoPreviewContainer.classList.remove('hidden');
                } else {
                    previewVideo.src = e.target.result;
                    videoPreviewContainer.classList.remove('hidden');
                }
            };
            reader.readAsDataURL(file);

            checkFormValidity();
        }

        removeFileBtn.addEventListener('click', () => {
            mediaFile.value = '';
            resetUI();
        });

        function resetUI() {
            fileInfo.classList.add('hidden');
            videoPreviewContainer.classList.add('hidden');
            uploadProgress.classList.add('hidden');
            previewVideo.src = '';
            checkFormValidity();
        }

        // ==================== Caption Counter ====================
        reelCaption.addEventListener('input', () => {
            const length = reelCaption.value. length;
            charCount.textContent = `${length} / 500 حرف`;
            
            if (length > 500) {
                reelCaption.value = reelCaption. value.substring(0, 500);
            }

            checkFormValidity();
        });

        // ==================== Form Validation ====================
        function checkFormValidity() {
            const hasMedia = mediaFile.files.length > 0;
            submitBtn.disabled = !hasMedia;
        }

        // ==================== Form Submission ====================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (mediaFile.files.length === 0) {
                showError('الرجاء اختيار فيديو أو صورة');
                return;
            }

            submitBtn.disabled = true;
            submitText.textContent = 'جاري النشر...';
            submitIcon.classList.add('fa-spinner', 'fa-spin');
            errorMessage.classList.add('hidden');
            uploadProgress.classList.remove('hidden');

            const formData = new FormData();
            formData.append('media', mediaFile. files[0]);
            formData.append('content', reelCaption.value. trim());

            try {
                const xhr = new XMLHttpRequest();

                // Progress event
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percentComplete + '%';
                        progressPercent.textContent = percentComplete + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const result = JSON.parse(xhr.responseText);
                        if (result.ok) {
                            successMessage.classList.remove('hidden');
                            setTimeout(() => {
                                window.location.href = '/reels';
                            }, 1500);
                        } else {
                            showError(result.error || 'حدث خطأ في النشر');
                            resetButtonState();
                        }
                    } else {
                        showError('فشل في إرسال الريل');
                        resetButtonState();
                    }
                });

                xhr.addEventListener('error', () => {
                    showError('خطأ في الاتصال بالخادم');
                    resetButtonState();
                });

                xhr. open('POST', form.action);
                xhr.send(formData);

            } catch (error) {
                showError('حدث خطأ:  ' + error.message);
                resetButtonState();
            }
        });

        function resetButtonState() {
            submitBtn.disabled = false;
            submitText. textContent = 'نشر الريل';
            submitIcon.classList.remove('fa-spinner', 'fa-spin');
            uploadProgress.classList.add('hidden');
            progressBar.style.width = '0%';
            progressPercent. textContent = '0%';
        }

        // ==================== Cancel Button ====================
        cancelBtn. addEventListener('click', () => {
            if (mediaFile.files.length > 0 && !confirm('هل تريد إلغاء إنشاء الريل؟')) {
                return;
            }
            window.location.href = '/reels';
        });

        // ==================== Utility Functions ====================
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ==================== Initialize ====================
        document.addEventListener('DOMContentLoaded', () => {
            checkFormValidity();
        });
    </script>

</body>
</html>
