<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>نشر ريل جديد — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --glass-bg: rgba(20, 20, 20, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* تأثير الزجاج */
    .glass-header {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
    }

    /* منطقة الرفع */
    .upload-container {
      position: relative;
      width: 100%;
      aspect-ratio: 9/16; /* أبعاد الريلز القياسية */
      max-height: 60vh;
      background: #0a0a0a;
      border: 2px dashed #333;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .upload-container.has-file {
      border: none;
      background: #000;
    }
    
    .upload-container:hover {
      border-color: #555;
    }

    /* أيقونة الرفع */
    .placeholder-content {
      text-align: center;
      color: #666;
      transition: opacity 0.3s;
    }
    .placeholder-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #333;
    }

    /* معاينة الفيديو */
    #previewVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* زر الحذف */
    .remove-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      width: 35px; height: 35px;
      border-radius: 50%;
      display: none;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    /* حقل الوصف */
    .input-group {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 15px;
      margin-top: 20px;
      transition: 0.3s;
    }
    .input-group:focus-within {
      border-color: var(--primary);
      background: #0a0a0a;
    }
    .modern-textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      resize: none;
      font-size: 14px;
      min-height: 60px;
    }

    /* زر النشر */
    .publish-btn {
      margin-top: auto;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s, opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .publish-btn:active { transform: scale(0.98); }
    .publish-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  </style>
</head>
<body>

  <header class="glass-header sticky top-0 z-50 px-5 py-4 flex items-center justify-between">
    <a href="/reels" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white active:scale-95 transition">
      <i class="fas fa-arrow-right"></i>
    </a>
    <h1 class="font-bold text-lg">ريل جديد</h1>
    <div class="w-10"></div> </header>

  <main class="flex-1 p-5 max-w-lg mx-auto w-full flex flex-col">
    
    <div class="upload-container" id="dropZone" onclick="document.getElementById('fileInput').click()">
      
      <div class="placeholder-content" id="placeholder">
        <i class="fas fa-cloud-upload-alt placeholder-icon"></i>
        <p class="font-bold text-gray-300 text-lg">اختر فيديو</p>
        <p class="text-xs text-gray-500 mt-1">MP4, MOV حتى 60 ثانية</p>
      </div>

      <video id="previewVideo" autoplay loop muted playsinline></video>
      
      <button class="remove-btn" id="removeBtn" onclick="event.stopPropagation(); removeFile();">
        <i class="fas fa-times"></i>
      </button>

      <input type="file" id="fileInput" accept="video/*" class="hidden">
    </div>

    <div class="input-group">
      <label class="block text-xs text-gray-500 mb-1 font-bold">الوصف (اختياري)</label>
      <textarea id="descriptionInput" class="modern-textarea" placeholder="اكتب تعليقاً مثيراً للفيديو..."></textarea>
    </div>

    <button id="publishBtn" class="publish-btn">
      <span>نشر الريل</span>
      <i class="fas fa-paper-plane"></i>
    </button>

  </main>

<script>
  // العناصر
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const placeholder = document.getElementById('placeholder');
  const previewVideo = document.getElementById('previewVideo');
  const removeBtn = document.getElementById('removeBtn');
  const publishBtn = document.getElementById('publishBtn');
  const descInput = document.getElementById('descriptionInput');

  let selectedFile = null;

  // 1. عند اختيار ملف
  fileInput.addEventListener('change', handleFileSelect);

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    // التحقق من النوع (فيديو فقط)
    if (!file.type.startsWith('video/')) {
      alert('الرجاء اختيار ملف فيديو صالح');
      return;
    }

    selectedFile = file;
    const fileUrl = URL.createObjectURL(file);

    // تحديث الواجهة
    previewVideo.src = fileUrl;
    previewVideo.style.display = 'block';
    placeholder.style.display = 'none';
    removeBtn.style.display = 'flex';
    dropZone.classList.add('has-file');
  }

  // 2. دالة حذف الملف المختار
  function removeFile() {
    selectedFile = null;
    fileInput.value = ''; // تصفير الحقل
    previewVideo.src = '';
    previewVideo.style.display = 'none';
    placeholder.style.display = 'block';
    removeBtn.style.display = 'none';
    dropZone.classList.remove('has-file');
  }

  // 3. عند الضغط على نشر
  publishBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      alert('يرجى اختيار فيديو أولاً!');
      return;
    }

    // تفعيل وضع التحميل
    setLoading(true);

    const formData = new FormData();
    formData.append('media', selectedFile);
    formData.append('description', descInput.value);

    try {
      const response = await fetch('/api/reels/create', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (response.ok) {
        // نجاح! توجيه لصفحة الريلز
        // نستخدم timestamp لضمان عدم تحميل نسخة قديمة من الكاش
        window.location.href = '/reels?refresh=' + Date.now();
      } else {
        alert(data.error || 'حدث خطأ أثناء الرفع');
        setLoading(false);
      }
    } catch (error) {
      console.error(error);
      alert('خطأ في الاتصال بالسيرفر');
      setLoading(false);
    }
  });

  function setLoading(isLoading) {
    if (isLoading) {
      publishBtn.disabled = true;
      publishBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الرفع...';
    } else {
      publishBtn.disabled = false;
      publishBtn.innerHTML = '<span>نشر الريل</span> <i class="fas fa-paper-plane"></i>';
    }
  }
</script>
</body>
</html>
