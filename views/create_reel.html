<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء ريلز جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px; width: 90%; max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        .preview-box {
            width: 100%; height: 350px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px; border: 2px dashed rgba(255,255,255,0.2);
            margin-bottom: 20px; position: relative;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .upload-placeholder { cursor: pointer; }
        textarea {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 10px; color: white;
            resize: none; margin-bottom: 20px; box-sizing: border-box;
        }
        .btn-post {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border: none; padding: 12px 30px; border-radius: 25px;
            color: white; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s;
        }
        .btn-post:disabled { opacity: 0.5; cursor: not-allowed; }
        #loading { display: none; margin-top: 15px; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #dc2743; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="glass-container">
    <h2><i class="fas fa-video"></i> إنشاء ريلز</h2>
    
    <div class="preview-box" onclick="document.getElementById('videoInput').click()">
        <video id="videoPreview" controls></video>
        <div class="upload-placeholder" id="placeholder">
            <i class="fas fa-cloud-upload-alt fa-3x"></i>
            <p>اضغط لاختيار فيديو</p>
        </div>
    </div>

    <input type="file" id="videoInput" accept="video/*" hidden>
    <textarea id="reelContent" rows="3" placeholder="اكتب وصفاً للريلز..."></textarea>
    
    <button class="btn-post" id="postBtn" onclick="uploadReel()">نشر الآن</button>

    <div id="loading">
        <div class="spinner"></div>
        <p>جاري رفع الريلز... يرجى الانتظار</p>
    </div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const videoPreview = document.getElementById('videoPreview');
    const placeholder = document.getElementById('placeholder');

    videoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            videoPreview.src = url;
            videoPreview.style.display = 'block';
            placeholder.style.display = 'none';
        }
    });

    async function uploadReel() {
        const content = document.getElementById('reelContent').value;
        const file = videoInput.files[0];

        if (!file && !content) return alert("يرجى اختيار فيديو أو كتابة وصف");

        const formData = new FormData();
        formData.append('content', content);
        if (file) formData.append('media', file);

        document.getElementById('postBtn').disabled = true;
        document.getElementById('loading').style.display = 'block';

        try {
            const res = await fetch('/api/reels/create', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.ok) {
                window.location.href = '/reels';
            } else {
                alert("خطأ: " + data.error);
            }
        } catch (e) {
            alert("حدث خطأ أثناء الاتصال بالخادم");
        } finally {
            document.getElementById('postBtn').disabled = false;
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>

</body>
</html>
