<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - إنشاء ريل جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background-color: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; }

        /* حاوية معاينة الريل (نسبة 9:16) */
        .reel-preview-container {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9 / 16;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        .video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-placeholder:hover { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-4xl mx-auto">
            <a href="/chat_list" class="text-white hover:text-gray-300 transition text-xl">
                <i class="fas fa-arrow-right"></i>
            </a>
            <div class="app-logo text-2xl tracking-widest text-white">Aite</div>
            <div class="w-8"></div> </nav>
    </header>

    <main class="max-w-4xl mx-auto p-4 flex flex-col md:flex-row gap-6 mt-6">
        
        <div class="flex-1 flex justify-center items-start">
            <div class="reel-preview-container shadow-2xl" id="dropZone">
                <input type="file" id="reelInput" accept="video/*" class="hidden">
                <div id="placeholder" class="upload-placeholder" onclick="document.getElementById('reelInput').click()">
                    <i class="fas fa-clapperboard text-4xl text-purple-500 mb-3"></i>
                    <p class="text-sm text-gray-400">اختر فيديو الريل</p>
                    <span class="text-xs text-gray-500 mt-2">MP4, WebM (9:16 مستحسن)</span>
                </div>
                <video id="previewVideo" class="video-preview" controls></video>
                
                <button id="changeVideoBtn" class="hidden absolute top-2 left-2 bg-black/60 p-2 rounded-full text-white text-xs hover:bg-black" onclick="document.getElementById('reelInput').click()">
                    <i class="fas fa-sync-alt ml-1"></i> تغيير
                </button>
            </div>
        </div>

        <div class="flex-[1.5] space-y-4">
            <div class="glass-card p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-pen-nib ml-2 text-blue-400"></i> تفاصيل الريل
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">وصف الريل</label>
                        <textarea id="reelDescription" rows="5" 
                            class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"
                            placeholder="اكتب وصفاً جذاباً هنا... #ريلز #Aite"></textarea>
                    </div>

                    <div class="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20">
                        <p class="text-xs text-blue-300 leading-relaxed">
                            <i class="fas fa-info-circle ml-1"></i>
                            نصيحة: الفيديوهات التي تبلغ مدتها أقل من 60 ثانية وبأبعاد عمودية تحقق انتشاراً أفضل.
                        </p>
                    </div>

                    <button id="publishBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition duration-300 transform active:scale-95 flex items-center justify-center">
                        <i class="fas fa-paper-plane ml-2"></i> نشر الريل الآن
                    </button>
                </div>
            </div>
            
            <div id="statusMessage" class="hidden p-3 rounded-lg text-center text-sm"></div>
        </div>

    </main>

    <script>
        const reelInput = document.getElementById('reelInput');
        const previewVideo = document.getElementById('previewVideo');
        const placeholder = document.getElementById('placeholder');
        const changeVideoBtn = document.getElementById('changeVideoBtn');
        const publishBtn = document.getElementById('publishBtn');
        const statusMessage = document.getElementById('statusMessage');

        // معاينة الفيديو عند الاختيار
        reelInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                if (file.type.startsWith('video/')) {
                    const url = URL.createObjectURL(file);
                    previewVideo.src = url;
                    previewVideo.style.display = 'block';
                    placeholder.style.display = 'none';
                    changeVideoBtn.classList.remove('hidden');
                    
                    // تحذير إذا كان الفيديو طويلاً جداً (اختياري)
                    previewVideo.onloadedmetadata = function() {
                        if (previewVideo.duration > 90) {
                            alert("تنبيه: الفيديو طويل جداً، يفضل أن يكون الريل أقل من 90 ثانية.");
                        }
                    };
                } else {
                    alert("يرجى اختيار ملف فيديو صالح.");
                }
            }
        });

        // وظيفة النشر
        publishBtn.addEventListener('click', async () => {
            const description = document.getElementById('reelDescription').value;
            const videoFile = reelInput.files[0];

            if (!videoFile) {
                showMessage("يرجى اختيار فيديو أولاً", "bg-red-500/20 text-red-400");
                return;
            }

            const formData = new FormData();
            formData.append('video', videoFile);
            formData.append('description', description);

            publishBtn.disabled = true;
            publishBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري النشر...';

            try {
                // استبدل هذا الرابط بمسار API الفعلي لديك
                const response = await fetch('/api/reels/create', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage("تم نشر الريل بنجاح!", "bg-green-500/20 text-green-400");
                    setTimeout(() => window.location.href = '/reels', 1500);
                } else {
                    showMessage(result.error || "حدث خطأ أثناء النشر", "bg-red-500/20 text-red-400");
                    publishBtn.disabled = false;
                    publishBtn.innerHTML = '<i class="fas fa-paper-plane ml-2"></i> نشر الريل الآن';
                }
            } catch (error) {
                showMessage("فشل الاتصال بالخادم", "bg-red-500/20 text-red-400");
                publishBtn.disabled = false;
                publishBtn.innerHTML = '<i class="fas fa-paper-plane ml-2"></i> نشر الريل الآن';
            }
        });

        function showMessage(text, classes) {
            statusMessage.textContent = text;
            statusMessage.className = `p-3 rounded-lg text-center text-sm ${classes}`;
            statusMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
