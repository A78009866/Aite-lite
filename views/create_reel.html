<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - إنشاء ريل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md glass-card rounded-[2.5rem] p-8 shadow-2xl">
        <div class="flex items-center mb-8">
            <a href="/chat_list" class="text-gray-400 hover:text-white"><i class="fas fa-arrow-right text-xl"></i></a>
            <h1 class="flex-1 text-center text-xl font-bold">إنشاء ريل جديد</h1>
        </div>

        <div id="dropZone" onclick="document.getElementById('videoInput').click()" class="relative border-2 border-dashed border-white/20 rounded-3xl aspect-[9/16] flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 transition-all overflow-hidden">
            <input type="file" id="videoInput" accept="video/*" class="hidden">
            <video id="preview" class="hidden w-full h-full object-cover"></video>
            <div id="placeholder" class="text-center">
                <i class="fas fa-cloud-upload-alt text-4xl text-blue-500 mb-2"></i>
                <p class="text-gray-400 text-sm">اضغط لرفع فيديو</p>
            </div>
        </div>

        <textarea id="description" class="w-full mt-6 bg-white/5 border border-white/10 rounded-2xl p-4 outline-none focus:border-blue-500 transition-all h-24" placeholder="اكتب وصفاً للريل..."></textarea>

        <div id="progressContainer" class="hidden mt-4">
            <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all"></div>
            </div>
            <p id="progressText" class="text-center text-xs text-gray-400 mt-2">0% جاري الرفع</p>
        </div>

        <button id="uploadBtn" onclick="handleUpload()" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-blue-400 py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/20 active:scale-95 transition-transform">
            نشر الريل
        </button>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('placeholder');

        videoInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                preview.src = URL.createObjectURL(file);
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                preview.play();
            }
        };

        function handleUpload() {
            const file = videoInput.files[0];
            if(!file) return alert('يرجى اختيار فيديو');

            const formData = new FormData();
            formData.append('video', file);
            formData.append('description', document.getElementById('description').value);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/reels/create');

            xhr.upload.onprogress = (e) => {
                if(e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressContainer').classList.remove('hidden');
                    document.getElementById('progressBar').style.width = percent + '%';
                    document.getElementById('progressText').innerText = percent + '% جاري الرفع';
                }
            };

            xhr.onload = () => {
                const res = JSON.parse(xhr.responseText);
                if(res.ok) window.location.href = '/reels';
                else alert('خطأ في الرفع: ' + res.error);
            };

            xhr.send(formData);
        }
    </script>
</body>
</html>
