<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>إنشاء ريل — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #000000 0%, #070707 100%); color: #e6eef8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass-card { background: rgba(10,10,12,0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
    .glass-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #e6eef8; }
    .hidden-file { display:none; }
    .preview-video { max-height: 60vh; width:100%; border-radius: 12px; background: #000; object-fit: contain; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-3xl w-full glass-card rounded-3xl p-6 shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold app-logo">إنشاء ريل</h1>
      <a href="/reels" class="text-sm text-gray-300 hover:text-white">العودة إلى الريلز</a>
    </div>

    <form id="createReelForm" class="space-y-4" enctype="multipart/form-data">
      <div>
        <label class="block text-sm text-gray-300 mb-2">اختر ملف الفيديو</label>
        <div class="flex items-center gap-3">
          <button type="button" id="chooseBtn" class="px-4 py-2 rounded-full glass-input hover:bg-white/5 transition">
            <i class="fas fa-upload ml-2"></i> اختر ملف
          </button>
          <span id="fileName" class="text-sm text-gray-400"></span>
        </div>
        <input id="mediaInput" name="media" accept="video/*,image/*,audio/*" type="file" class="hidden-file" />
      </div>

      <div id="previewArea" class="hidden">
        <label class="block text-sm text-gray-300 mb-2">معاينة</label>
        <video id="previewVideo" class="preview-video rounded-lg" controls></video>
      </div>

      <div>
        <label class="block text-sm text-gray-300 mb-2">وصف الريل (اختياري)</label>
        <textarea id="description" name="description" rows="4" class="w-full rounded-xl p-3 glass-input resize-none" placeholder="أضف وصفاً جذاباً للريل..."></textarea>
      </div>

      <div class="flex items-center justify-between">
        <div class="text-sm text-gray-400">يمكنك إضافة فيديو، صورة أو صوت. يدعم Cloudinary التحويل التلقائي.</div>
        <div class="flex items-center gap-3">
          <button type="button" id="cancelBtn" class="px-4 py-2 rounded-full bg-gray-700 hover:bg-gray-600">إلغاء</button>
          <button type="submit" id="uploadBtn" class="px-6 py-2 rounded-full bg-blue-500 hover:bg-blue-600 font-semibold">
            <i class="fas fa-cloud-upload-alt ml-2"></i> نشر الريل
          </button>
        </div>
      </div>

      <div id="statusMessage" class="text-center text-sm mt-2 hidden"></div>
    </form>
  </div>

<script>
  const mediaInput = document.getElementById('mediaInput');
  const chooseBtn = document.getElementById('chooseBtn');
  const fileName = document.getElementById('fileName');
  const previewArea = document.getElementById('previewArea');
  const previewVideo = document.getElementById('previewVideo');
  const createReelForm = document.getElementById('createReelForm');
  const uploadBtn = document.getElementById('uploadBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const statusMessage = document.getElementById('statusMessage');

  chooseBtn.addEventListener('click', () => mediaInput.click());
  mediaInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    fileName.textContent = file.name;
    const url = URL.createObjectURL(file);
    previewVideo.src = url;
    previewArea.classList.remove('hidden');
  });

  cancelBtn.addEventListener('click', () => {
    window.location.href = '/reels';
  });

  createReelForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = mediaInput.files[0];
    if (!file) {
      statusMessage.textContent = 'الرجاء اختيار ملف قبل النشر.';
      statusMessage.classList.remove('hidden');
      statusMessage.classList.remove('text-green-500'); statusMessage.classList.add('text-red-400');
      return;
    }

    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري النشر';

    const formData = new FormData();
    formData.append('media', file);
    formData.append('description', document.getElementById('description').value || '');

    try {
      const res = await fetch('/api/reels/create', {
        method: 'POST',
        body: formData
      });
      const json = await res.json();
      if (res.ok && json.ok) {
        statusMessage.textContent = 'تم النشر بنجاح';
        statusMessage.classList.remove('hidden');
        statusMessage.classList.remove('text-red-400'); statusMessage.classList.add('text-green-400');
        setTimeout(() => { window.location.href = '/reels'; }, 900);
      } else {
        statusMessage.textContent = json.error || 'فشل في نشر الريل.';
        statusMessage.classList.remove('hidden');
        statusMessage.classList.remove('text-green-500'); statusMessage.classList.add('text-red-400');
      }
    } catch (err) {
      statusMessage.textContent = 'فشل الاتصال بالخادم.';
      statusMessage.classList.remove('hidden');
      statusMessage.classList.remove('text-green-500'); statusMessage.classList.add('text-red-400');
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt ml-2"></i> نشر الريل';
    }
  });
</script>

</body>
</html>
