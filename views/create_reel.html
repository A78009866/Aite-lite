<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aite - إنشاء ريلز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background:#000; color:#fff; font-family:Inter, system-ui, sans-serif; padding-bottom:60px; }
    .glass-card { background: rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.06); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="min-h-screen">

  <header class="p-4 glass-card sticky top-0 z-40">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="/reels" class="text-white"><i class="fas fa-arrow-right"></i></a>
      <h1 class="text-xl font-bold">إنشاء ريلز</h1>
      <div></div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4">
    <div class="glass-card p-4 rounded-xl shadow-lg">
      <form id="createReelForm" action="/api/posts/create" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="block text-gray-300 mb-1">وصف الريلز</label>
          <textarea name="content" rows="3" class="w-full p-3 rounded-lg bg-gray-900 text-white border border-gray-700" placeholder="أضف وصفًا أو هاشتاق..."></textarea>
        </div>

        <div class="mb-3">
          <label class="block text-gray-300 mb-1">ملف الوسائط (فيديو/صوت/صورة)</label>
          <input type="file" name="media" accept="video/*,audio/*,image/*" class="w-full text-sm text-gray-300" />
          <p class="text-xs text-gray-500 mt-1">أحجام كبيرة قد تستغرق وقتًا. (سيتم استخدام نفس endpoint المنشور حالياً)</p>
        </div>

        <div class="flex justify-between items-center mt-4">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full">نشر الريلز</button>
          <a href="/reels" class="text-gray-300">إلغاء</a>
        </div>
      </form>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-[#0b1220] p-3 text-center">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <a href="/chat_list" class="text-gray-400 hover:text-white"><i class="fas fa-home"></i></a>
      <a href="/users_list" class="text-gray-400 hover:text-white"><i class="fas fa-comment-dots"></i></a>
      <a href="/reels" class="text-white bg-blue-600 px-4 py-2 rounded-full">العودة للريلز</a>
    </div>
  </div>

</body>
</html>
