<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء ريلز جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-black text-white min-h-screen flex flex-col">

    <header class="p-4 border-b border-gray-800 flex items-center justify-between sticky top-0 bg-black z-10">
        <button onclick="history.back()" class="text-gray-400"><i class="fas fa-arrow-right text-xl"></i></button>
        <h1 class="text-lg font-bold">ريلز جديد</h1>
        <button id="submitBtn" form="reelForm" class="text-blue-500 font-bold disabled:opacity-50" disabled>نشر</button>
    </header>

    <main class="flex-1 p-4 max-w-2xl mx-auto w-full">
        <form id="reelForm" action="/api/reels/create" method="POST" enctype="multipart/form-data">
            
            <div class="mb-6">
                <div id="videoContainer" class="relative w-full aspect-[9/16] max-h-[500px] bg-[#18191a] rounded-2xl border-2 border-dashed border-gray-700 flex flex-col items-center justify-center overflow-hidden">
                    <video id="preview" class="hidden w-full h-full object-cover"></video>
                    
                    <div id="uploadUI" class="text-center">
                        <i class="fas fa-film text-5xl text-gray-600 mb-3"></i>
                        <p class="text-gray-400">اختر فيديو للبدء</p>
                        <button type="button" onclick="document.getElementById('videoFile').click()" class="mt-4 bg-white text-black px-6 py-2 rounded-full font-bold">اختيار ملف</button>
                    </div>
                    
                    <div id="uploadOverlay" class="absolute inset-0 bg-black/60 hidden flex flex-col items-center justify-center">
                        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p id="uploadStatus">جاري النشر...</p>
                    </div>
                </div>
                <input type="file" id="videoFile" name="video" accept="video/*" class="hidden" required>
            </div>

            <div class="mb-4">
                <textarea name="description" placeholder="اكتب وصفاً للريلز..." class="w-full bg-transparent border-none text-lg focus:ring-0 resize-none" rows="3"></textarea>
            </div>

        </form>
    </main>

    <script>
        const videoFile = document.getElementById('videoFile');
        const preview = document.getElementById('preview');
        const uploadUI = document.getElementById('uploadUI');
        const submitBtn = document.getElementById('submitBtn');
        const reelForm = document.getElementById('reelForm');

        videoFile.onchange = function() {
            const file = this.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                preview.src = url;
                preview.classList.remove('hidden');
                preview.play();
                uploadUI.classList.add('hidden');
                submitBtn.disabled = false;
            }
        };

        reelForm.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(reelForm);
            
            // إظهار مؤشر النشر
            document.getElementById('uploadOverlay').classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/reels/create', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/chat_list'; // العودة للرئيسية
                } else {
                    alert('خطأ في النشر: ' + data.error);
                }
            } catch (err) {
                alert('فشل الاتصال بالخادم');
            } finally {
                document.getElementById('uploadOverlay').classList.add('hidden');
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
