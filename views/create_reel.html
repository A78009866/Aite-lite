<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Aite - إنشاء ريلز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{ margin:0; min-height:100vh; font-family:Inter, system-ui, sans-serif; background:#000; color:#fff; padding-bottom:76px; }
    .glass { background: rgba(10,12,16,0.75); border:1px solid rgba(255,255,255,0.04); backdrop-filter: blur(8px); border-radius:12px; }
    .muted{ color:#94a3b8; }
    header{ position:sticky; top:0; z-index:20; padding:12px; background:linear-gradient(180deg, rgba(5,7,10,0.8), rgba(5,7,10,0.6)); border-bottom:1px solid rgba(255,255,255,0.03); }
    main{ max-width:640px; margin:0 auto; padding:14px; }
    .preview{ width:100%; border-radius:10px; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center; min-height:210px; }
    .small-muted{ font-size:13px; color:#9aa6bd; }
  </style>
</head>
<body>

  <header class="flex items-center justify-between">
    <a href="/reels" class="text-gray-300"><i class="fas fa-arrow-right"></i></a>
    <h1 class="font-bold">إنشاء ريلز</h1>
    <div></div>
  </header>

  <main>
    <form id="createForm" class="glass p-4 space-y-4" enctype="multipart/form-data">
      <div>
        <label class="block text-sm muted mb-2">ملف الوسائط (فيديو مفضلًا)</label>
        <div class="preview" id="mediaPreview">
          <div class="muted small-muted">لم يتم اختيار ملف</div>
        </div>
        <input id="mediaInput" name="media" type="file" accept="video/*,image/*,audio/*" class="mt-3 block w-full text-sm text-gray-300" required />
        <div class="text-xs muted mt-1">نوصي بفيديو قصير (MP4). التحميل يتم إلى Cloudinary.</div>
      </div>

      <div>
        <label class="block text-sm muted mb-2">الوصف</label>
        <textarea name="content" id="content" rows="4" class="w-full p-3 bg-gray-900 rounded-lg text-white" placeholder="اكتب وصفًا أو هاشتاق..."></textarea>
      </div>

      <div class="flex items-center justify-between gap-4">
        <button id="submitBtn" type="submit" class="bg-blue-600 px-4 py-2 rounded-full">نشر الريلز</button>
        <a href="/reels" class="muted">إلغاء</a>
      </div>

      <div id="formMsg" class="text-sm muted"></div>
    </form>
  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-3 z-10">
    <div class="max-w-3xl mx-auto flex justify-between items-center px-2">
      <a href="/chat_list" class="text-gray-300"><i class="fas fa-home"></i></a>
      <a href="/users_list" class="text-gray-300"><i class="fas fa-comment-dots"></i></a>
      <a href="/reels" class="bg-blue-600 px-4 py-2 rounded-full text-white">العودة للريلز</a>
    </div>
  </div>

  <script>
    const mediaInput = document.getElementById('mediaInput');
    const mediaPreview = document.getElementById('mediaPreview');
    const form = document.getElementById('createForm');
    const submitBtn = document.getElementById('submitBtn');
    const formMsg = document.getElementById('formMsg');

    function clearPreview(){
      mediaPreview.innerHTML = '<div class="muted small-muted">لم يتم اختيار ملف</div>';
    }

    mediaInput.addEventListener('change', (e)=>{
      const f = e.target.files && e.target.files[0];
      if (!f) { clearPreview(); return; }
      const type = f.type || '';
      mediaPreview.innerHTML = '';
      if (type.startsWith('video/')) {
        const v = document.createElement('video');
        v.controls = true;
        v.className = 'w-full';
        v.src = URL.createObjectURL(f);
        mediaPreview.appendChild(v);
      } else if (type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        img.className = 'w-full object-cover';
        mediaPreview.appendChild(img);
      } else if (type.startsWith('audio/')) {
        const a = document.createElement('audio');
        a.controls = true;
        a.src = URL.createObjectURL(f);
        mediaPreview.appendChild(a);
      } else {
        mediaPreview.innerHTML = '<div class="muted small-muted">نوع الملف غير مدعوم للعرض</div>';
      }
    });

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const file = mediaInput.files && mediaInput.files[0];
      if (!file) { formMsg.textContent = 'اختر ملف وسائط لنشر الريلز.'; return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الرفع...';
      formMsg.textContent = '';

      const fd = new FormData();
      fd.append('media', file);
      fd.append('content', document.getElementById('content').value || '');

      try {
        const res = await fetch('/api/reels/create', { method:'POST', body: fd });
        const data = await res.json();
        if (res.ok && data.ok) {
          formMsg.textContent = 'تم النشر، إعادة التوجيه إلى الريلز...';
          setTimeout(()=> window.location.href = '/reels', 900);
        } else {
          formMsg.textContent = data.error || 'فشل في إنشاء الريلز.';
        }
      } catch (err) {
        console.error(err);
        formMsg.textContent = 'خطأ في الاتصال بالخادم.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'نشر الريلز';
      }
    });

    // mobile UX: prevent body scroll while interacting with preview
    mediaPreview.addEventListener('touchstart', ()=>{ document.body.style.touchAction='pan-y'; });

    function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  </script>
</body>
</html>
