<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء ريلز جديد - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #videoPreview { max-height: 400px; width: 100%; border-radius: 12px; display: none; object-fit: cover; }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md glass-card p-6 rounded-2xl shadow-2xl">
        <div class="flex items-center mb-6">
            <a href="/reels" class="text-gray-400 hover:text-white ml-4"><i class="fas fa-arrow-right text-xl"></i></a>
            <h1 class="text-xl font-bold">إنشاء ريلز</h1>
        </div>

        <form id="reelForm" action="/api/reels/create" method="POST" enctype="multipart/form-data">
            <div id="dropZone" class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 transition mb-4">
                <input type="file" id="videoInput" name="media" accept="video/*" class="hidden" required>
                <div id="uploadPlaceholder">
                    <i class="fas fa-video text-4xl text-blue-500 mb-2"></i>
                    <p class="text-gray-400">اضغط هنا أو اسحب الفيديو لرفعه</p>
                </div>
                <video id="videoPreview" controls></video>
            </div>

            <textarea name="caption" placeholder="اكتب وصفاً للريل..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 focus:outline-none focus:border-blue-500 mb-4 h-24 resize-none"></textarea>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-300 disabled:opacity-50">
                <span id="btnText">نشر الريلز</span>
            </button>
        </form>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const dropZone = document.getElementById('dropZone');

        dropZone.onclick = () => videoInput.click();

        videoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
            }
        };

        document.getElementById('reelForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النشر...';

            const formData = new FormData(e.target);
            try {
                const res = await fetch(e.target.action, { method: 'POST', body: formData });
                if (res.ok) window.location.href = '/reels';
                else alert('حدث خطأ أثناء النشر');
            } catch (err) { alert('فشل الاتصال'); }
            finally { btn.disabled = false; btnText.textContent = 'نشر الريلز'; }
        };
    </script>
</body>
</html>
