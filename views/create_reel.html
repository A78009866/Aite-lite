<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء ريل جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 18px; }
        
        .upload-container { background: #111; border: 2px dashed #333; border-radius: 15px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .upload-container video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .upload-container i { font-size: 40px; color: #888; margin-bottom: 10px; }

        textarea { width: 100%; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; padding: 15px; margin-top: 20px; box-sizing: border-box; resize: none; font-size: 15px; }
        
        .publish-btn { background: #ff3b5c; color: #fff; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .publish-btn:disabled { opacity: 0.5; }

        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="header">
    <a href="/reels" style="color: #fff;"><i class="fas fa-arrow-right"></i></a>
    <h2>إنشاء ريل</h2>
    <div></div>
</div>

<div class="upload-container" onclick="document.getElementById('fileInput').click()">
    <i class="fas fa-video" id="uploadIcon"></i>
    <span id="uploadText">اختر فيديو للبدء</span>
    <video id="previewVideo" muted></video>
</div>

<input type="file" id="fileInput" accept="video/*" onchange="previewFile()">

<textarea id="caption" rows="4" placeholder="اكتب وصفاً للريل..."></textarea>

<button class="publish-btn" id="submitBtn" onclick="uploadReel()">نشر الريل</button>

<script>
    function previewFile() {
        const file = document.getElementById('fileInput').files[0];
        const video = document.getElementById('previewVideo');
        const icon = document.getElementById('uploadIcon');
        const text = document.getElementById('uploadText');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                video.src = e.target.result;
                video.style.display = 'block';
                video.play();
                icon.style.display = 'none';
                text.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function uploadReel() {
        const file = document.getElementById('fileInput').files[0];
        const content = document.getElementById('caption').value;
        const btn = document.getElementById('submitBtn');

        if (!file) return alert('يرجى اختيار فيديو أولاً');

        const formData = new FormData();
        formData.append('media', file);
        formData.append('content', content);

        btn.disabled = true;
        btn.innerText = 'جاري النشر...';

        try {
            const res = await fetch('/api/reels/create', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.ok) {
                window.location.href = '/reels';
            } else {
                alert('خطأ أثناء النشر: ' + data.error);
                btn.disabled = false;
                btn.innerText = 'نشر الريل';
            }
        } catch (e) {
            alert('فشل الاتصال بالسيرفر');
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
