    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; color: #e6eefb;
            min-height: 100vh;

        /* Glass Navbar */

            background: rgba(10, 10, 10, 0.85);

        html[data-theme="light"] .glass-navbar {

        }

        /* Desktop Sidebar */
        .desktop-sidebar { display: none; }

            .desktop-sidebar {
                display: flex; position: fixed; top: 0; right: 0;

            }
            .desktop-sidebar .sidebar-logo {

            }
            html[data-theme="light"] .desktop-sidebar .sidebar-logo { color: #1a1a2e; }
            .desktop-sidebar .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
            .desktop-sidebar .sidebar-link {
                display: flex; align-items: center; gap: 14px;
                padding: 12px 14px; border-radius: 12px;

            html[data-theme="light"] .desktop-sidebar .sidebar-link.active { background: rgba(37,99,235,0.1); color: #2563eb; }

        }

        /* Glass Card */
        .glass-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        html[data-theme="light"] .glass-card {

            border: 1px solid rgba(0,0,0,0.08);
        }
        html[data-theme="light"] .glass-card:hover {

        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }
        @media (min-width: 640px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 16px; }
        }
        @media (min-width: 1024px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* Product Card */
        .product-card { cursor: pointer; }
        .product-card .product-image-wrapper {
            position: relative; width: 100%; padding-top: 100%;
            overflow: hidden; border-radius: 16px 16px 0 0;
            background: rgba(255,255,255,0.02);
        }
        .product-card .product-image-wrapper img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;

        .product-card:hover .product-image-wrapper img { transform: scale(1.05); }
        .product-card .product-info { padding: 12px; }
        .product-card .product-price {

            color: #3b82f6;

        }
        html[data-theme="light"] .product-card .product-price { color: #2563eb; }
        .product-card .product-title {

            color: #e6eefb;
            line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis;

        .product-card .product-seller {

        .product-image-count {
            position: absolute; bottom: 8px; left: 8px;

        .no-image-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;

            background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(99,102,241,0.1));

        /* Sell Button */
        .sell-fab {

            text-align: center; border: 1px solid rgba(255,255,255,0.1);

        .confirm-box h3 { font-size: 18px; font-weight: 700; color: #fff; margin: 0 0 10px; }

        .confirm-actions { display: flex; gap: 10px; }

        .confirm-delete-btn { background: #ef4444; color: #fff; }

        /* Toast */
        .toast {

            backdrop-filter: blur(8px);
        }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(239,68,68,0.95); }
    </style>
</head>

<script>
// ============ Marketplace Logic ============

let allProducts = [];
let currentUserId = null;
let currentTab = 'all';
let deleteOrderId = null;

// Load on page load
document.addEventListener('DOMContentLoaded', async function() {
    try {
        const meRes = await fetch('/api/me');
        const meData = await meRes.json();
        currentUserId = meData.userId || meData.id || null;
    } catch(e) {}
    loadProducts();
});

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
    if (tab === 'all') { document.getElementById('tabAll').classList.add('active'); loadProducts(); }
    else if (tab === 'mine') { document.getElementById('tabMine').classList.add('active'); loadMyProducts(); }
    else if (tab === 'orders') { document.getElementById('tabOrders').classList.add('active'); loadOrders(); }
}

async function loadProducts() {
    showLoading();
    try {
        const res = await fetch('/api/marketplace/products');
        const data = await res.json();
        if (data.ok) {
            allProducts = data.products;
            renderProducts(allProducts);
        } else {
            showEmptyState('حدث خطأ أثناء تحميل المنتجات');
        }
    } catch (err) {
        console.error(err);
        showEmptyState('تعذر الاتصال بالسيرفر');
    }
}

async function loadMyProducts() {
    showLoading();
    try {
        const res = await fetch('/api/marketplace/products');
        const data = await res.json();
        if (data.ok) {
            const myProducts = data.products.filter(p => p.sellerId === currentUserId);
            if (myProducts.length === 0) {
                showEmptyStateCustom('fas fa-box-open', 'لا توجد منتجات لك بعد', 'أضف منتج جديد للبيع من زر +');
            } else {
                renderProducts(myProducts);
            }
        } else {
            showEmptyState('حدث خطأ أثناء تحميل المنتجات');
        }
    } catch (err) {
        showEmptyState('تعذر الاتصال بالسيرفر');
    }
}

async function loadOrders() {
    showLoading();
    try {
        const res = await fetch('/api/orders/on-my-products');
        const data = await res.json();
        if (data.ok) {
            if (data.orders.length === 0) {
                showEmptyStateCustom('fas fa-clipboard-list', 'لا توجد طلبات بعد', 'ستظهر هنا الطلبات على منتجاتك');
            } else {
                renderOrders(data.orders);
            }
        } else {
            showEmptyState('حدث خطأ أثناء تحميل الطلبات');
        }
    } catch (err) {
        showEmptyState('تعذر الاتصال بالسيرفر');
    }
}

function renderProducts(products) {
    const container = document.getElementById('productsContainer');
    if (!products || products.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-store"></i>
                <h3>لا توجد منتجات بعد</h3>
                <p>كن أول من يضيف منتج للبيع!</p>
            </div>
        `;
        return;
    }

    let html = '<div class="products-grid">';
    products.forEach(product => {
        const hasImages = product.images && product.images.length > 0;
        const firstImage = hasImages ? product.images[0] : '';
        const imageCount = hasImages ? product.images.length : 0;
        const priceFormatted = formatPrice(product.price);

        html += `
            <div class="glass-card product-card" onclick="window.location.href='/product/${product.id}'">
                <div class="product-image-wrapper">
                    ${hasImages
                        ? `<img src="${escapeAttr(firstImage)}" alt="${escapeAttr(product.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="no-image-placeholder" style="display:none"><i class="fas fa-image"></i></div>`
                        : `<div class="no-image-placeholder"><i class="fas fa-image"></i></div>`
                    }
                    ${imageCount > 1 ? `<span class="product-image-count"><i class="fas fa-images" style="margin-left:4px;"></i> ${imageCount}</span>` : ''}
                </div>
                <div class="product-info">
                    <div class="product-price">${priceFormatted} د.ج</div>
                    <div class="product-title">${escapeHtml(product.title)}</div>
                    <div class="product-seller">
                        <img src="${escapeAttr(product.sellerProfilePic || 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png')}" alt="" onerror="this.src='https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png'">
                        <span>${escapeHtml(product.sellerUsername)}${product.sellerVerified ? ' <img src="https://res.cloudinary.com/duixjs8az/image/upload/v1768036959/post_media/1768036959482-badge.png" style="width:14px;height:14px;vertical-align:middle;">' : ''}</span>
                    </div>
                </div>
            </div>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
}

function renderOrders(orders) {
    const container = document.getElementById('productsContainer');
    let html = '<div class="orders-list">';
    orders.forEach(order => {
        const timeAgo = getTimeAgo(order.createdAt);
        html += `
            <div class="order-card">
                ${order.productImage ? `<img src="${escapeAttr(order.productImage)}" class="order-card-img" alt="" onerror="this.style.display='none'">` : ''}
                <div class="order-card-info">
                    <div class="order-card-title">${escapeHtml(order.productTitle)}</div>
                    <div class="order-card-price">${formatPrice(order.productPrice)} د.ج</div>
                    <div class="order-card-detail"><i class="fas fa-user"></i> ${escapeHtml(order.fullName)}</div>
                    <div class="order-card-detail"><i class="fas fa-phone"></i> <span dir="ltr">${escapeHtml(order.phone)}</span></div>
                    <div class="order-card-detail"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(order.wilaya)} - ${escapeHtml(order.commune)}</div>
                    <div class="order-card-detail"><i class="fas fa-clock"></i> ${timeAgo}</div>
                    <div class="order-card-detail"><i class="fas fa-user-circle"></i> ${escapeHtml(order.buyerUsername || 'مستخدم')}</div>
                </div>
                <button class="order-delete-btn" onclick="showOrderConfirm('${order.id}')" title="حذف الطلب">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
}

function showLoading() {
    document.getElementById('productsContainer').innerHTML = `
        <div class="empty-state">
            <div class="spinner" style="width:40px;height:40px;border-width:3px;"></div>
            <p style="margin-top:16px;">جاري التحميل...</p>
        </div>
    `;
}

// ===== Order Delete =====
function showOrderConfirm(orderId) {
    deleteOrderId = orderId;
    document.getElementById('confirmOrderOverlay').classList.add('show');
}
function hideOrderConfirm() {
    deleteOrderId = null;
    document.getElementById('confirmOrderOverlay').classList.remove('show');
}
async function confirmDeleteOrder() {
    if (!deleteOrderId) return;
    const oid = deleteOrderId;
    hideOrderConfirm();
    try {
        const res = await fetch('/api/orders/' + oid, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) {
            showToast('تم حذف الطلب');
            loadOrders();
        } else {
            showToast(data.error || 'حدث خطأ', 'error');
        }
    } catch (err) {
        showToast('تعذر حذف الطلب', 'error');
    }
}

function formatPrice(price) {
    if (!price) return '0';
    return Number(price).toLocaleString('ar-DZ');
}

function getTimeAgo(timestamp) {
    if (!timestamp) return '';
    const diff = Date.now() - timestamp;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'الآن';
    if (mins < 60) return 'منذ ' + mins + ' دقيقة';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return 'منذ ' + hours + ' ساعة';
    const days = Math.floor(hours / 24);
    if (days < 30) return 'منذ ' + days + ' يوم';
    const months = Math.floor(days / 30);
    return 'منذ ' + months + ' شهر';
}

// ============ Utilities ============

function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeAttr(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showEmptyState(message) {
    document.getElementById('productsContainer').innerHTML = `
        <div class="empty-state">
            <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
            <h3>${message}</h3>
        </div>
    `;
}

function showEmptyStateCustom(icon, title, desc) {
    document.getElementById('productsContainer').innerHTML = `
        <div class="empty-state">
            <i class="${icon}"></i>
            <h3>${title}</h3>
            <p>${desc}</p>
        </div>
    `;
}

function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show' + (type === 'error' ? ' error' : '');
    setTimeout(() => { toast.className = 'toast'; }, 3000);
}

// Highlight active sidebar
document.querySelectorAll('.sidebar-link').forEach(link => {
    if (link.getAttribute('data-page') === '/marketplace') {
        link.classList.add('active');
    } else {
        link.classList.remove('active');
    }
});
