<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* خلفية الصفحة مع تدرج خفيف لتعزيز تأثير الزجاج */
        body { 
            background: radial-gradient(circle at top, #1a1a1a, #000000); 
            color: #e4e6eb; 
            font-family: 'Segoe UI', sans-serif; 
        }

        /* تأثير الزجاج الأسود (Black Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.4) !important;
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-6 px-4 pb-20">

    <div class="w-full max-w-md flex items-center justify-between mb-8">
        <a href="/chat_list" class="text-gray-400 hover:text-white text-xl transition-transform hover:-translate-x-1">
            <i class="fas fa-arrow-right"></i>
        </a>
        <h1 class="text-2xl font-bold tracking-wide">الإعدادات</h1>
        <div class="w-5"></div> 
    </div>

    <div class="w-full max-w-md space-y-6">
        
        <div class="glass-panel p-5 rounded-2xl">
            <h2 class="text-sm font-bold mb-4 text-gray-400 uppercase tracking-widest">الحساب</h2>
            <a href="/edit_profile" class="flex items-center justify-between w-full p-4 glass-button rounded-xl">
                <span class="flex items-center">
                    <i class="fas fa-user-edit ml-3 text-gray-300"></i> تعديل الملف الشخصي
                </span>
                <i class="fas fa-chevron-left text-gray-500 text-xs"></i>
            </a>
        </div>

        <div class="glass-panel p-5 rounded-2xl">
            <h2 class="text-sm font-bold mb-4 text-gray-400 uppercase tracking-widest">الأمان</h2>
            <form id="changePasswordForm" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2 mr-1">كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required 
                        class="glass-input w-full rounded-xl p-3 text-white focus:outline-none" 
                        placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-2 mr-1">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required 
                        class="glass-input w-full rounded-xl p-3 text-white focus:outline-none" 
                        placeholder="••••••••">
                </div>
                <button type="submit" class="w-full glass-button text-white font-bold py-3 px-4 rounded-xl mt-2 active:scale-95 transition-transform">
                    تحديث كلمة المرور
                </button>
            </form>
            <p id="msg" class="text-center text-sm mt-4 hidden"></p>
        </div>

        <div class="pt-6">
            <button onclick="logout()" class="w-full border border-red-900/50 bg-red-950/10 text-red-500 hover:bg-red-600 hover:text-white font-bold py-4 px-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>

    </div>

    <script>
        // دالة تغيير كلمة المرور (نفس المنطق البرمجي السابق مع تحسين المظهر)
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass.length < 6) {
                showMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'red');
                return;
            }
            if (newPass !== confirmPass) {
                showMsg('كلمات المرور غير متطابقة', 'red');
                return;
            }

            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword: newPass })
                });
                const data = await res.json();
                
                if (data.ok) {
                    showMsg('تم تحديث كلمة المرور بنجاح', 'green');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    showMsg(data.error || 'حدث خطأ ما', 'red');
                }
            } catch (err) {
                showMsg('فشل الاتصال بالخادم', 'red');
            }
        });

        function showMsg(text, color) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = `text-center text-sm mt-4 block text-${color}-400 font-medium`;
        }

        function logout() {
            if(confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                window.location.href = '/logout';
            }
        }
    </script>
</body>
</html>
