    <script>
        const STORAGE_KEY = 'aite_accounts_secure_v2';
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';

        function loadAccounts() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
        }

        function saveAccounts(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function removeAccount(e, username) {
            e.stopPropagation(); 
            e.preventDefault();
            if(confirm('هل أنت متأكد من إزالة @' + username + ' من الجهاز؟')) {
                let accounts = loadAccounts();
                accounts = accounts.filter(acc => acc.username !== username);
                saveAccounts(accounts);
                renderAccounts();
            }
        }

        async function handleAccountClick(username) {
            const accounts = loadAccounts();
            const account = accounts.find(a => a.username === username);

            if (account && account.remember_token) {
                // Use secure remember token for auto-login
                try {
                    document.body.style.opacity = '0.5';
                    document.body.style.cursor = 'wait';

                    const resp = await fetch('/api/auth/login-with-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username: username, remember_token: account.remember_token })
                    });

                    const data = await resp.json().catch(() => ({ ok: false }));

                    if (data.ok) {
                        // Rotate token: update stored token with the new one from server
                        if (data.remember_token) {
                            let updatedAccounts = loadAccounts();
                            const idx = updatedAccounts.findIndex(a => a.username === username);
                            if (idx !== -1) {
                                updatedAccounts[idx].remember_token = data.remember_token;
                                saveAccounts(updatedAccounts);
                            }
                        }
                        window.location.href = data.redirect || '/chat_list';
                        return;
                    }

                    // Token invalid/expired - remove it and redirect to login
                    let updatedAccounts = loadAccounts();
                    const idx = updatedAccounts.findIndex(a => a.username === username);
                    if (idx !== -1) {
                        delete updatedAccounts[idx].remember_token;
                        saveAccounts(updatedAccounts);
                    }
                    document.body.style.opacity = '1';
                    document.body.style.cursor = '';
                    window.location.href = `/login?username=${encodeURIComponent(username)}`;
                } catch (e) {
                    console.error('Auto-login error:', e);
                    document.body.style.opacity = '1';
                    document.body.style.cursor = '';
                    window.location.href = `/login?username=${encodeURIComponent(username)}`;
                }
            } else {
                // No remember token - redirect to login with username pre-filled
                window.location.href = `/login?username=${encodeURIComponent(username)}`;
            }
        }

        function renderAccounts() {
            const container = document.getElementById('accountsListWrapper');
            const accounts = loadAccounts();
            container.innerHTML = '';

            if (accounts.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-4">لا توجد حسابات محفوظة</p>';
                return;
            }

            accounts.forEach((acc, index) => {
                const imgUrl = acc.profile_picture_url || DEFAULT_AVATAR;
                const delayStyle = `animation-delay: ${index * 100}ms`;

                const cardHtml = `
                    <div class="account-card flex items-center p-4 gap-4 animate-fade-in group relative" 
                         style="${delayStyle}"
                         onclick="handleAccountClick('${acc.username}')">
                        
                        <img src="${imgUrl}" class="w-14 h-14 rounded-full object-cover border-2 border-transparent group-hover:border-blue-500 transition-colors bg-gray-800" 
                             alt="${acc.username}" onerror="this.src='${DEFAULT_AVATAR}'">

                        <div class="flex-grow text-right overflow-hidden">
                            <h3 class="text-white font-bold text-lg leading-tight truncate">${acc.full_name || acc.username}</h3>
                            <p class="text-gray-400 text-sm font-mono truncate">@${acc.username}</p>
                        </div>

                        <button class="remove-btn absolute top-3 left-3 w-8 h-8 rounded-full flex items-center justify-center" 
                                onclick="removeAccount(event, '${acc.username}')">
                            <i class="fas fa-times"></i>
                        </button>
                        
                        <div class="text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity absolute bottom-4 left-4">
                             <i class="fas fa-arrow-left"></i>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        document.addEventListener('DOMContentLoaded', renderAccounts);

        // Global Function لاستقبال التوكن من الأندرويد
window.receiveAndroidToken = function(token) {
    console.log("Received FCM Token from Android:", token);
    
    // إرسال التوكن إلى السيرفر لحفظه في قاعدة البيانات للمستخدم الحالي
    fetch('/api/save-fcm-token', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token: token })
    }).catch(err => console.error("Error saving token", err));
};
    </script>

<script>

(function(){
  var sk = document.getElementById('skeletonLoader');
  if (!sk) return;
  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>

    <div class="pwa-bar-text">
      <div class="pwa-bar-title">Aite</div>
      <div class="pwa-bar-desc" id="pwaBarDesc">تثبيت التطبيق على جهازك</div>
    </div>
    <button class="pwa-bar-btn" id="pwaBarInstallBtn" onclick="pwaInstallApp()">تثبيت</button>
    <button class="pwa-bar-close" onclick="pwaDismiss()">&times;</button>
  </div>
</div>

<script>
(function(){
  // ===== PWA Full App Install =====
  var DISMISS_KEY = 'aite_install_dismiss_v2';
  var bar = document.getElementById('pwaInstallBar');
  var desc = document.getElementById('pwaBarDesc');
  var btn = document.getElementById('pwaBarInstallBtn');
  var _prompt = null;

  // Is app already running in standalone (installed)?
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {
    setTimeout(function(){
      if (desc) desc.textContent = 'أضف Aite إلى الشاشة الرئيسية';
      if (btn) btn.textContent = 'إضافة';
      bar.style.display = 'block';
    }, 2500);
  }

  // Install button click
  window.pwaInstallApp = function() {
    if (_prompt) {
      // Native browser install prompt (Android/Chrome/Edge/Desktop)
      _prompt.prompt();
      _prompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          bar.style.display = 'none';
          try { localStorage.removeItem(DISMISS_KEY); } catch(e){}
        }
        _prompt = null;
      });
    } else if (isIOS) {
      // Show iOS step-by-step instructions
      var ov = document.createElement('div');
      ov.id = 'iosInstallOverlay';
      ov.innerHTML = '<div class="ios-install-box">'
        + '<img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin:0 auto 14px;display:block;">'
        + '<h3 style="color:#fff;font-size:19px;font-weight:700;margin:0 0 6px;">تثبيت Aite</h3>'
        + '<p style="color:#9ca3af;font-size:13px;margin:0 0 18px;">اتبع الخطوات التالية لتثبيت التطبيق:</p>'
        + '<div class="ios-step">1. اضغط على أيقونة المشاركة <span style="font-size:17px;">⬆️</span> في شريط Safari</div>'
        + '<div class="ios-step">2. اختر <b style="color:#fff;">"إضافة إلى الشاشة الرئيسية"</b> <span style="font-size:15px;">📱</span></div>'
        + '<div class="ios-step">3. اضغط <b style="color:#fff;">"إضافة"</b> في الأعلى</div>'
        + '<button onclick="this.closest('#iosInstallOverlay').remove()" style="margin-top:18px;background:#3b82f6;color:#fff;border:none;padding:11px 34px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">فهمت</button>'
        + '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target===ov) ov.remove(); });
    }
  };

  // Dismiss for 12 hours
  window.pwaDismiss = function() {
    bar.style.display = 'none';
    try { localStorage.setItem(DISMISS_KEY, Date.now().toString()); } catch(e){}
  };

  // Auto-hide on successful install
  window.addEventListener('appinstalled', function() {
    bar.style.display = 'none';
    _prompt = null;
  });
})();
</script>
