<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساباتك — Aite</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/46/1000084215-removebg-preview.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(57, 130, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(120, 50, 220, 0.1) 0%, transparent 30%);
            color: #e4e6eb;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        p, span, div, h1, h2, h3, h4, h5, h6, li, td, th, label, a {
            overflow-wrap: break-word; word-wrap: break-word; word-break: break-word;
        }

        .account-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .account-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(57, 130, 247, 0.4);
            transform: translateY(-3px);
        }

        .remove-btn {
            background: rgba(255, 0, 0, 0.1);
            color: #ff5555;
            opacity: 0;
            transition: all 0.2s;
        }
        .account-card:hover .remove-btn { opacity: 1; }
        .remove-btn:hover { background: #ff5555; color: white; transform: scale(1.1); }
        
        .add-account-btn {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #9ca3af;
        }
        .add-account-btn:hover { border-color: #3982f7; color: #fff; background: rgba(57, 130, 247, 0.05); }
        .btn-google {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            transition: all 0.3s ease;
        }
        .btn-google:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
        .btn-google img { width: 20px; height: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    /* ===== DESKTOP RESPONSIVE ===== */
    @media (min-width: 768px) {
        body {
            background-size: cover;
        }
        .glass-card {
            max-width: 480px;
        }
    }

    @media (min-width: 1024px) {
        .glass-card {
            max-width: 520px;
            padding: 2.5rem 3rem !important;
        }
    }


/* ========== SKELETON / SHIMMER LOADING ========== */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skeleton-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow-y: auto;
  overflow-x: hidden;
  transition: opacity 0.35s ease;
}
.skeleton-loader.hidden {
  opacity: 0;
  pointer-events: none;
}
.skeleton-bone {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: 8px;
}
html[data-theme="light"] .skeleton-bone {
  background: linear-gradient(90deg, rgba(0,0,0,0.06) 25%, rgba(0,0,0,0.10) 50%, rgba(0,0,0,0.06) 75%);
  background-size: 800px 100%;
}
.skeleton-loader .sk-bg {
  background: #000;
}
html[data-theme="light"] .skeleton-loader .sk-bg {
  background: #f0f2f5;
}
.skeleton-circle {
  border-radius: 50%;
}

</style>
</head>
<body class="flex flex-col items-center justify-center py-10">

<div id="skeletonLoader" class="skeleton-loader">
  <div class="sk-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div style="width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div class="skeleton-bone" style="width:140px;height:28px;border-radius:6px;"></div>
      
      <div style="width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.06);">
        <div class="skeleton-bone skeleton-circle" style="width:50px;height:50px;"></div>
        <div style="flex:1;">
          <div class="skeleton-bone" style="width:100px;height:14px;margin-bottom:6px;border-radius:4px;"></div>
          <div class="skeleton-bone" style="width:60px;height:10px;border-radius:4px;"></div>
        </div>
      </div>
      <div style="width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.06);">
        <div class="skeleton-bone skeleton-circle" style="width:50px;height:50px;"></div>
        <div style="flex:1;">
          <div class="skeleton-bone" style="width:100px;height:14px;margin-bottom:6px;border-radius:4px;"></div>
          <div class="skeleton-bone" style="width:60px;height:10px;border-radius:4px;"></div>
        </div>
      </div>
      <div style="width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.06);">
        <div class="skeleton-bone skeleton-circle" style="width:50px;height:50px;"></div>
        <div style="flex:1;">
          <div class="skeleton-bone" style="width:100px;height:14px;margin-bottom:6px;border-radius:4px;"></div>
          <div class="skeleton-bone" style="width:60px;height:10px;border-radius:4px;"></div>
        </div>
      </div>
      <div class="skeleton-bone" style="width:100%;height:48px;border-radius:14px;margin-top:8px;"></div>
    </div>
  </div>
</div>


    <div class="text-center mb-10 animate-fade-in">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" 
             class="w-20 h-20 rounded-2xl object-cover mx-auto mb-4 border border-white/10 shadow-lg shadow-blue-500/20" 
             alt="Aite Logo">
        <h1 class="text-4xl font-bold tracking-wider text-white">Aite</h1>
        <p class="text-gray-400 text-sm mt-2">اختر حساباً للمتابعة</p>
    </div>

    <div class="w-full max-w-[400px] px-4 space-y-4" id="accountsListWrapper"></div>

    <div class="w-full max-w-[400px] px-4 mt-2">
        <a href="/login" class="add-account-btn w-full p-4 rounded-xl flex items-center justify-center gap-3 font-semibold group cursor-pointer no-underline block transition-all">
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                <i class="fas fa-plus text-sm"></i>
            </div>
            <span>تسجيل الدخول بحساب آخر</span>
        </a>
        
        <div class="flex items-center gap-4 text-gray-600 my-4">
            <div class="h-px flex-1 bg-gray-800"></div>
            <span class="text-xs uppercase tracking-wider font-semibold text-gray-500">أو</span>
            <div class="h-px flex-1 bg-gray-800"></div>
        </div>

        <button type="button" id="googleSignInBtn" class="btn-google w-full py-3.5 rounded-xl text-white font-medium flex items-center justify-center gap-3">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            <span>تسجيل الدخول بـ Google</span>
        </button>

        <div class="text-center mt-8">
            <a href="/register" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'aite_accounts_secure_v2';
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';

        function loadAccounts() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
        }

        function saveAccounts(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function removeAccount(e, username) {
            e.stopPropagation(); 
            e.preventDefault();
            if(confirm('هل أنت متأكد من إزالة @' + username + ' من الجهاز؟')) {
                let accounts = loadAccounts();
                accounts = accounts.filter(acc => acc.username !== username);
                saveAccounts(accounts);
                renderAccounts();
            }
        }

        async function handleAccountClick(username) {
            const accounts = loadAccounts();
            const account = accounts.find(a => a.username === username);

            if (account && account.remember_token) {
                // Use secure remember token for auto-login
                try {
                    document.body.style.opacity = '0.5';
                    document.body.style.cursor = 'wait';

                    const resp = await fetch('/api/auth/login-with-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username: username, remember_token: account.remember_token })
                    });

                    const data = await resp.json().catch(() => ({ ok: false }));

                    if (data.ok) {
                        // Rotate token: update stored token with the new one from server
                        if (data.remember_token) {
                            let updatedAccounts = loadAccounts();
                            const idx = updatedAccounts.findIndex(a => a.username === username);
                            if (idx !== -1) {
                                updatedAccounts[idx].remember_token = data.remember_token;
                                saveAccounts(updatedAccounts);
                            }
                        }
                        window.location.href = data.redirect || '/chat_list';
                        return;
                    }

                    // Token invalid/expired - remove it and redirect to login
                    let updatedAccounts = loadAccounts();
                    const idx = updatedAccounts.findIndex(a => a.username === username);
                    if (idx !== -1) {
                        delete updatedAccounts[idx].remember_token;
                        saveAccounts(updatedAccounts);
                    }
                    document.body.style.opacity = '1';
                    document.body.style.cursor = '';
                    window.location.href = `/login?username=${encodeURIComponent(username)}`;
                } catch (e) {
                    console.error('Auto-login error:', e);
                    document.body.style.opacity = '1';
                    document.body.style.cursor = '';
                    window.location.href = `/login?username=${encodeURIComponent(username)}`;
                }
            } else {
                // No remember token - redirect to login with username pre-filled
                window.location.href = `/login?username=${encodeURIComponent(username)}`;
            }
        }

        function renderAccounts() {
            const container = document.getElementById('accountsListWrapper');
            const accounts = loadAccounts();
            container.innerHTML = '';

            if (accounts.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-4">لا توجد حسابات محفوظة</p>';
                return;
            }

            accounts.forEach((acc, index) => {
                const imgUrl = acc.profile_picture_url || DEFAULT_AVATAR;
                const delayStyle = `animation-delay: ${index * 100}ms`;

                const cardHtml = `
                    <div class="account-card flex items-center p-4 gap-4 animate-fade-in group relative" 
                         style="${delayStyle}"
                         onclick="handleAccountClick('${acc.username}')">
                        
                        <img src="${imgUrl}" class="w-14 h-14 rounded-full object-cover border-2 border-transparent group-hover:border-blue-500 transition-colors bg-gray-800" 
                             alt="${acc.username}" onerror="this.src='${DEFAULT_AVATAR}'">

                        <div class="flex-grow text-right overflow-hidden">
                            <h3 class="text-white font-bold text-lg leading-tight truncate">${acc.full_name || acc.username}</h3>
                            <p class="text-gray-400 text-sm font-mono truncate">@${acc.username}</p>
                        </div>

                        <button class="remove-btn absolute top-3 left-3 w-8 h-8 rounded-full flex items-center justify-center" 
                                onclick="removeAccount(event, '${acc.username}')">
                            <i class="fas fa-times"></i>
                        </button>
                        
                        <div class="text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity absolute bottom-4 left-4">
                             <i class="fas fa-arrow-left"></i>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        document.addEventListener('DOMContentLoaded', renderAccounts);

        // === Google Sign-In ===
        document.getElementById('googleSignInBtn').addEventListener('click', function() {
            try {
                if (typeof google !== 'undefined' && google.accounts) {
                    google.accounts.id.initialize({
                        client_id: window.__GOOGLE_CLIENT_ID || '',
                        callback: handleGoogleResponse,
                        auto_select: false
                    });
                    google.accounts.id.prompt();
                } else { alert('خدمة Google غير متاحة حالياً.'); }
            } catch (err) { alert('فشل في فتح تسجيل Google.'); }
        });

        async function handleGoogleResponse(response) {
            if (!response || !response.credential) return;
            document.body.style.opacity = '0.5'; document.body.style.cursor = 'wait';
            try {
                const resp = await fetch('/api/auth/google', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                    body: JSON.stringify({ id_token: response.credential })
                });
                const data = await resp.json();
                if (!data.ok) { alert(data.error || 'فشل.'); document.body.style.opacity = '1'; document.body.style.cursor = ''; return; }
                if (data.is_new_user) {
                    const params = new URLSearchParams();
                    if (data.google_name) params.set('name', data.google_name);
                    if (data.google_picture) params.set('picture', data.google_picture);
                    window.location.href = '/google-complete-profile?' + params.toString();
                } else {
                    let accounts = loadAccounts().filter(a => a.username !== data.username);
                    accounts.unshift({ username: data.username, full_name: data.full_name || '', profile_picture_url: data.profile_picture_url || DEFAULT_AVATAR, remember_token: data.remember_token || '' });
                    saveAccounts(accounts.slice(0, 8));
                    window.location.href = '/chat_list';
                }
            } catch (err) { alert('فشل في الاتصال بالخادم.'); document.body.style.opacity = '1'; document.body.style.cursor = ''; }
        }

        (function() {
            fetch('/api/google-client-id').then(r => r.json()).then(d => {
                if (d.ok && d.client_id) {
                    window.__GOOGLE_CLIENT_ID = d.client_id;
                    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; document.head.appendChild(s);
                }
            }).catch(() => {});
        })();

        // Global Function لاستقبال التوكن من الأندرويد
window.receiveAndroidToken = function(token) {
    console.log("Received FCM Token from Android:", token);
    
    // إرسال التوكن إلى السيرفر لحفظه في قاعدة البيانات للمستخدم الحالي
    fetch('/api/save-fcm-token', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token: token })
    }).catch(err => console.error("Error saving token", err));
};
    </script>

<script>

(function(){
  var sk = document.getElementById('skeletonLoader');
  if (!sk) return;
  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>
</body>
</html>
