<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساباتك — Aite</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/46/1000084215-removebg-preview.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(57, 130, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(120, 50, 220, 0.1) 0%, transparent 30%);
            color: #e4e6eb;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .logo-container img {
            filter: drop-shadow(0 0 15px rgba(57, 130, 247, 0.4));
        }

        .accounts-container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .account-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            user-select: none; /* منع تحديد النص عند النقر */
        }

        .account-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(57, 130, 247, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }

        .account-avatar {
            border: 2px solid rgba(57, 130, 247, 0.3);
            transition: border-color 0.3s;
        }
        .account-card:hover .account-avatar {
            border-color: #3982f7;
        }

        /* زر الحذف (X) */
        .remove-btn {
            position: absolute;
            top: 10px;
            left: 10px; /* في اليسار لأن الصفحة RTL */
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.1);
            color: #ff5555;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; /* مخفي افتراضياً */
            transition: all 0.2s;
            z-index: 20; /* لضمان أنه فوق الكارت */
            border: 1px solid transparent;
        }
        
        /* إظهار الزر عند تحويم الفأرة على الكارت */
        .account-card:hover .remove-btn {
            opacity: 1;
        }

        .remove-btn:hover {
            background: #ff5555;
            color: white;
            transform: scale(1.1);
            border-color: #ff8888;
        }

        .add-account-btn {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #9ca3af;
            transition: all 0.3s;
        }
        .add-account-btn:hover {
            border-color: #3982f7;
            color: #fff;
            background: rgba(57, 130, 247, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center py-10">

    <div class="text-center mb-10 logo-container animate-fade-in">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" 
             class="w-20 h-20 rounded-2xl object-cover mx-auto mb-4 border border-white/10" 
             alt="Aite Logo">
        <h1 class="text-4xl font-bold tracking-wider text-white">Aite</h1>
        <p class="text-gray-400 text-sm mt-2">اختر حساباً للمتابعة</p>
    </div>

    <div class="accounts-container space-y-4" id="accountsListWrapper">
        </div>

    <div class="accounts-container mt-2">
        <a href="/login" class="add-account-btn w-full p-4 rounded-xl flex items-center justify-center gap-3 font-semibold group cursor-pointer no-underline block">
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                <i class="fas fa-plus text-sm"></i>
            </div>
            <span>تسجيل الدخول بحساب آخر</span>
        </a>
        
        <div class="text-center mt-8">
            <a href="/register" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">إنشاء حساب جديد في Aite</a>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'trimer_accounts_v1';
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';

        function loadAccounts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveAccounts(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        // دالة الحذف
        function removeAccount(e, username) {
            // منع انتشار الحدث حتى لا يتم تفعيل النقر على الكارت (تسجيل الدخول)
            e.stopPropagation(); 
            e.preventDefault();
            
            if(confirm('هل تريد إزالة الحساب @' + username + ' من هذه القائمة؟')) {
                let accounts = loadAccounts();
                accounts = accounts.filter(acc => acc.username !== username);
                saveAccounts(accounts);
                
                // إعادة رسم القائمة
                renderAccounts();
            }
        }

        // دالة الدخول المباشر
        function handleAccountClick(username) {
            // توجيه مباشر لصفحة الدخول مع تمرير الاسم
            // سيقوم المتصفح بإكمال كلمة المرور إذا كانت محفوظة
            window.location.href = `/login?username=${encodeURIComponent(username)}`;
        }

        function renderAccounts() {
            const container = document.getElementById('accountsListWrapper');
            const accounts = loadAccounts();

            container.innerHTML = '';

            if (accounts.length === 0) {
                // إذا لم توجد حسابات، نذهب لصفحة الدخول العادية
                // window.location.href = '/login'; 
                container.innerHTML = '<p class="text-center text-gray-500">لا توجد حسابات محفوظة</p>';
                return;
            }

            accounts.forEach((acc, index) => {
                const imgUrl = acc.profile_picture_url || DEFAULT_AVATAR;
                const delayStyle = `animation-delay: ${index * 100}ms`;

                const cardHtml = `
                    <div class="account-card flex items-center p-4 gap-4 animate-fade-in group" 
                         style="${delayStyle}"
                         onclick="handleAccountClick('${acc.username}')">
                        
                        <div class="relative">
                            <img src="${imgUrl}" 
                                 class="w-14 h-14 rounded-full object-cover account-avatar bg-gray-800" 
                                 alt="${acc.username}"
                                 onerror="this.src='${DEFAULT_AVATAR}'">
                        </div>

                        <div class="flex-grow text-right">
                            <h3 class="text-white font-bold text-lg leading-tight truncate">${acc.full_name || acc.username}</h3>
                            <p class="text-gray-400 text-sm font-mono truncate">@${acc.username}</p>
                        </div>

                        <button class="remove-btn" onclick="removeAccount(event, '${acc.username}')" title="إزالة الحساب">
                            <i class="fas fa-times"></i>
                        </button>
                        
                        <div class="text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity mr-2">
                             <i class="fas fa-chevron-left"></i>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderAccounts);
    </script>
</body>
</html>
