<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="/https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        :root{
          --preview-height: 40vh; /* ارتفاع عرض المنشور داخل المودال */
          --input-height: 64px;   /* ارتفاع شريط إضافة التعليق */
          --header-height: 56px;  /* ارتفاع رأس المودال */
        }

        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            /* إضافة مساحة سفلية لمنع الشريط السفلي من حجب المحتوى */
            padding-bottom: 80px; 
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* نمط الشعار الجديد */
        .app-logo {
            font-family: 'Montserrat', sans-serif; /* خط مودرن للشعار */
            font-weight: 800;
        }

        /* نمط نافذة الملف الشخصي الزجاجية */
        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000; /* للتأكد من أنها فوق كل شيء */
        }

        .glass-comment-modal-content {
            background: linear-gradient(180deg, rgba(8,10,12,0.6), rgba(6,8,10,0.75));
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 12px 40px rgba(2,6,23,0.7);
            color: #e6eefb;
        }

        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .media-container {
            max-height: 80vh; 
            width: auto;
        }

        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3); /* خلفية سوداء شفافة */
            backdrop-filter: blur(10px); /* تأثير زجاجي */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06); /* حدود بيضاء خفيفة */
        }

        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .waveform-post {
            height: 60px; 
            background-color: #0f172a; 
            border-radius: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-animate-in { animation: modalFadeIn 0.28s ease-out; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .create-option-card { background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); transition: all .3s; }
        .create-option-card:hover { transform: translateY(-5px); }

        /* badges */
        #notifBadge, #msgBadge, #friendReqBadge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444;
          color: #fff;
          font-size: 12px;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

        .avatar-with-dot { position: relative; display: inline-flex; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border:2px solid #000; border-radius:999px; box-shadow:0 0 6px rgba(34,197,94,0.6); z-index:10; }
        .online-dot-small { width:10px; height:10px; bottom:1px; right:1px; border-width:1.5px; }
        .verified-badge-img { width:16px; height:16px; border-radius:999px; margin-left:6px; object-fit:cover; box-shadow:0 2px 8px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.06); vertical-align:middle; }

        /* ---------------------- Comments fullscreen modal layout (new) ---------------------- */
        /* Make the modal take the full screen and split area: top = preview (fixed), bottom = comments (scrollable + snap) */
        #commentModal {
          z-index: 60;
        }

        #commentModal .glass-comment-modal-content {
          width: 100%;
          max-width: 100%;
          height: 100vh;         /* full viewport */
          max-height: 100vh;
          border-radius: 0;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        #commentModal .modal-header {
          height: var(--header-height);
          min-height: var(--header-height);
          padding: 10px 14px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 1px solid rgba(255,255,255,0.04);
          flex: 0 0 auto;
        }

        /* preview area: fixed height (media stays visible and static) */
        #commentModal .comment-post-preview {
          height: var(--preview-height);
          min-height: var(--preview-height);
          max-height: var(--preview-height);
          overflow: hidden;
          padding: 14px;
          border-bottom: 1px solid rgba(255,255,255,0.04);
          background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.15));
          flex: 0 0 auto; /* fixed area */
        }

        /* comments area: fills remaining height between preview and input */
        #commentModal .comment-list {
          flex: 1 1 auto;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
          scroll-snap-type: y mandatory;   /* snap so one comment fits viewport */
          display: block;
          padding: 12px;
          gap: 12px;
        }

        /* each comment will snap to the top of the comments area and we force its height equal to the comments viewport height
           so only one comment is visible at a time. We'll set this height dynamically in JS for exact fit. */
        .comment-item {
          scroll-snap-align: start;
          box-sizing: border-box;
          width: 100%;
        }

        /* input area pinned to bottom of modal */
        #commentModal .modal-input {
          flex: 0 0 auto;
          height: var(--input-height);
          min-height: var(--input-height);
          display:flex;
          gap:8px;
          align-items:center;
          padding: 10px 14px;
          border-top: 1px solid rgba(255,255,255,0.04);
          background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        }

        #commentModal .modal-input input[type="text"] {
          flex:1;
          background: transparent;
          border: 1px solid rgba(255,255,255,0.04);
          padding:10px 12px;
          border-radius: 999px;
          color:#fff;
          outline:none;
        }
        #commentModal .modal-input button {
          background:#0ea5a3;
          color:#022;
          padding:10px 12px;
          border-radius:999px;
          border:none;
          font-weight:700;
          cursor:pointer;
        }

        /* ensure preview media fills preview area nicely */
        .preview-media img, .preview-media video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 8px;
        }

        /* smaller screens tweak */
        @media (max-width:640px) {
          :root { --preview-height: 50vh; --input-height: 64px; --header-height: 52px; }
          .comment-item img { width:40px; height:40px; }
          .verified-badge-img { width:14px; height:14px; }
        }
    </style>
</head>

    <script>
        let currentPostIdToDelete = null;
        let currentUserId = null; 
        let activeWaveSurfer = null;
        let activeVideo = null;

        const postsFeed = document.getElementById('postsFeed');
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteMessage = document.getElementById('deleteMessage');
        const postMenu = document.getElementById('postMenu');
        const deleteOptionBtn = document.getElementById('deleteOptionBtn');
        const mediaViewerModal = document.getElementById('mediaViewerModal');
        const mediaViewerContent = document.getElementById('mediaViewerContent');
        const profileDropdown = document.getElementById('profileDropdown'); 
        const profileMenuButton = document.getElementById('profileMenuButton'); 

        const commentModal = document.getElementById('commentModal');
        const closeCommentModalBtn = document.getElementById('closeCommentModalBtn');
        const commentsList = document.getElementById('commentsList');
        const newCommentInput = document.getElementById('newCommentInput');
        const postCommentBtn = document.getElementById('postCommentBtn');
        const commentError = document.getElementById('commentError');
        const commentPostPreview = document.getElementById('commentPostPreview');
        let currentPostIdForComments = null;

        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

        function toggleProfileDropdown(event) {
            event.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        }

        function closeProfileDropdownOnClickOutside(event) {
            if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        }

        document.addEventListener('click', closeProfileDropdownOnClickOutside);

        const createModalEl = document.getElementById('createModal');
        function toggleCreateModal() {
            createModalEl.classList.toggle('hidden');
            if (!createModalEl.classList.contains('hidden')) document.body.style.overflow = 'hidden';
            else document.body.style.overflow = 'auto';
        }
        createModalEl.addEventListener('click', (e) => { if (e.target === createModalEl) toggleCreateModal(); });

        function openMediaViewer(url, type, event) {
            event.stopPropagation();
            if (type === 'audio' || type === 'video') return;
            let mediaElement;
            mediaViewerContent.innerHTML = '';
            if (type === 'image') mediaElement = `<img src="${url}" alt="Media Viewer" class="max-w-full max-h-full object-contain rounded-lg">`;
            else return;
            mediaViewerContent.innerHTML = mediaElement;
            mediaViewerModal.classList.remove('hidden');
        }

        function closeMediaViewer(event) {
            if (event.target.id === 'mediaViewerModal' || event.target.closest('.fa-times')) {
                const activeMedia = mediaViewerContent.querySelector('video, audio');
                if (activeMedia) activeMedia.pause();
                mediaViewerModal.classList.add('hidden');
                mediaViewerContent.innerHTML = '';
            }
        }

        function openDeleteModal(postId, event) {
            event.stopPropagation();
            currentPostIdToDelete = postId;
            deleteMessage.classList.add('hidden');
            deleteModal.classList.remove('hidden');
            postMenu.classList.add('hidden');
        }

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            currentPostIdToDelete = null;
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentPostIdToDelete) return;
            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحذف';
            deleteMessage.classList.add('hidden');
            try {
                const response = await fetch(`/api/posts/${currentPostIdToDelete}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }});
                const result = await response.json();
                if (response.ok && result.ok) {
                    const el = document.querySelector(`div[data-post-id="${currentPostIdToDelete}"]`);
                    if (el) el.remove();
                    deleteModal.classList.add('hidden');
                } else {
                    deleteMessage.textContent = result.error || 'فشل الحذف.';
                    deleteMessage.classList.remove('hidden');
                }
            } catch (error) {
                deleteMessage.textContent = 'حدث خطأ في الاتصال بالخادم.';
                deleteMessage.classList.remove('hidden');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.innerHTML = 'تأكيد الحذف';
                currentPostIdToDelete = null;
            }
        });

        function togglePostMenu(postId, userId, event, menuButton) {
            event.stopPropagation();
            if (!postMenu.classList.contains('hidden') && postMenu.dataset.postId === postId) { postMenu.classList.add('hidden'); return; }
            const rect = menuButton.getBoundingClientRect();
            postMenu.style.top = `${rect.bottom + 5}px`;
            postMenu.style.left = `${rect.left}px`;
            postMenu.dataset.postId = postId;
            if (userId === currentUserId) {
                deleteOptionBtn.style.display = 'flex';
                deleteOptionBtn.onclick = (e) => openDeleteModal(postId, e);
            } else deleteOptionBtn.style.display = 'none';
            postMenu.classList.remove('hidden');
        }

        document.addEventListener('click', (event) => {
            if (!postMenu.contains(event.target) && !event.target.closest('.post-menu-button')) {
                postMenu.classList.add('hidden');
                deleteModal.classList.add('hidden');
            }
        });

        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if (!container) return;
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4b5563',
                progressColor: '#3b82f6',
                cursorColor: '#10b981',
                barWidth: 3, barRadius: 3, barGap: 1, height: 60, responsive: true, mediaControls: false,
            });
            ws.load(url);
            const playButton = container.closest('.glass-post-card').querySelector('.audio-play-button');
            if (playButton) {
                playButton.onclick = () => {
                    if (activeWaveSurfer && activeWaveSurfer !== ws) {
                        activeWaveSurfer.pause();
                        const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                        if (otherPostCard) {
                            const pb = otherPostCard.querySelector('.audio-play-button i');
                            if (pb) { pb.classList.remove('fa-pause'); pb.classList.add('fa-play'); }
                        }
                    }
                    if (activeVideo) {
                        const activePostId = activeVideo.id.split('-')[1];
                        const controlIcon = document.getElementById(`control-icon-${activePostId}`);
                        const playOverlay = document.getElementById(`play-overlay-${activePostId}`);
                        activeVideo.pause();
                        if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
                        if (playOverlay) playOverlay.classList.remove('hidden');
                        activeVideo = null;
                    }
                    if (ws.isPlaying()) {
                        ws.pause();
                        playButton.querySelector('i').classList.remove('fa-pause');
                        playButton.querySelector('i').classList.add('fa-play');
                    } else {
                        ws.play();
                        playButton.querySelector('i').classList.remove('fa-play');
                        playButton.querySelector('i').classList.add('fa-pause');
                        activeWaveSurfer = ws;
                    }
                };
                ws.on('finish', () => {
                    playButton.querySelector('i').classList.remove('fa-pause');
                    playButton.querySelector('i').classList.add('fa-play');
                    activeWaveSurfer = null;
                });
            }
        }

        function toggleVideoPlay(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            const controlsBar = document.getElementById(`controls-bar-${postId}`);
            if (!video) return;
            if (activeVideo && activeVideo !== video) {
                const activePostId = activeVideo.id.split('-')[1];
                const activeControlIcon = document.getElementById(`control-icon-${activePostId}`);
                const activePlayOverlay = document.getElementById(`play-overlay-${activePostId}`);
                activeVideo.pause();
                if (activeControlIcon) { activeControlIcon.classList.remove('fa-pause'); activeControlIcon.classList.add('fa-play'); }
                if (activePlayOverlay) activePlayOverlay.classList.remove('hidden');
                activeVideo.removeEventListener('timeupdate', updateVideoProgress);
                activeVideo.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
                activeVideo.removeEventListener('ended', handleVideoEnd);
            }
            if (activeWaveSurfer) {
                activeWaveSurfer.pause();
                const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                if (otherPostCard) {
                    const apb = otherPostCard.querySelector('.audio-play-button i');
                    if (apb) { apb.classList.remove('fa-pause'); apb.classList.add('fa-play'); }
                }
                activeWaveSurfer = null;
            }

            if (video.paused) {
                video.play();
                if (playOverlay) playOverlay.classList.add('hidden');
                if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
                if (controlsBar) controlsBar.classList.remove('opacity-0');
                activeVideo = video;
                video.addEventListener('timeupdate', updateVideoProgress);
                video.addEventListener('loadedmetadata', updateVideoTimeDisplay);
                video.addEventListener('ended', handleVideoEnd);
            } else {
                video.pause();
                if (playOverlay) playOverlay.classList.remove('hidden');
                if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
                activeVideo = null;
            }
        }

        function updateVideoProgress(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const progressBar = document.getElementById(`progress-bar-${postId}`);
            const timeDisplay = document.getElementById(`time-display-${postId}`);
            if (!video.duration || !progressBar || !timeDisplay) return;
            const percent = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        }

        function updateVideoTimeDisplay(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const timeDisplay = document.getElementById(`time-display-${postId}`);
            if (timeDisplay && video.duration) timeDisplay.textContent = `0:00 / ${formatVideoTime(video.duration)}`;
        }

        function handleVideoEnd(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            video.currentTime = 0;
            if (playOverlay) playOverlay.classList.remove('hidden');
            if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
            activeVideo = null;
            video.removeEventListener('timeupdate', updateVideoProgress);
            video.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
            video.removeEventListener('ended', handleVideoEnd);
        }

        function formatVideoTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function seekVideo(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const progressContainer = event.currentTarget;
            if (!video || !video.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            video.currentTime = video.duration * percentage;
            if (video.paused) toggleVideoPlay(postId, event);
        }

        function toggleFullscreen(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            if (video) {
                if (video.requestFullscreen) video.requestFullscreen();
                else if (video.mozRequestFullScreen) video.mozRequestFullScreen();
                else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
                else if (video.msRequestFullscreen) video.msRequestFullscreen();
            }
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);
            if (diffInHours < 24) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            else if (diffInHours < 7 * 24) return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            else return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        async function fetchAndDisplayPosts() {
            postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();
                postsFeed.innerHTML = '';
                if (response.ok && result.ok) {
                    if (result.posts.length === 0) {
                        postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات لعرضها بعد.</div>';
                        return;
                    }
                    const audioPostsToInit = [];
                    result.posts.forEach(post => {
                        postsFeed.innerHTML += createPostCard(post);
                        if (post.media && post.media.type === 'audio') audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                    });
                    setTimeout(() => {
                        audioPostsToInit.forEach(ap => initializePostWaveSurfer(ap.postId, ap.url));
                        updateVerifiedBadges();
                    }, 150);
                }
            } catch (error) {
                console.error('Error:', error);
                postsFeed.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في جلب المنشورات.</div>';
            }
        }

        async function handleLike(postId, buttonElement) {
            const likeIcon = buttonElement.querySelector('.like-icon');
            buttonElement.disabled = true;
            try {
                const response = await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' }});
                const result = await response.json();
                if (response.ok && result.ok) {
                    const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
                    if (postCard) {
                        const likesSpan = postCard.querySelector('.flex.justify-between span:first-child');
                        if (likesSpan) likesSpan.innerHTML = `<i class="fas fa-heart ml-1"></i> ${result.newLikes} إعجاب`;
                    }
                    if (result.action === 'liked') {
                        likeIcon.classList.remove('far', 'text-gray-400');
                        likeIcon.classList.add('fas', 'text-red-500');
                        buttonElement.classList.remove('text-gray-400');
                        buttonElement.classList.add('text-red-500');
                        buttonElement.dataset.isLiked = 'true';
                    } else {
                        likeIcon.classList.remove('fas', 'text-red-500');
                        likeIcon.classList.add('far', 'text-gray-400');
                        buttonElement.classList.remove('text-red-500');
                        buttonElement.classList.add('text-gray-400');
                        buttonElement.dataset.isLiked = 'false';
                    }
                } else {
                    console.error('Like failed:', result.error);
                }
            } catch (error) {
                console.error('Error during like operation:', error);
            } finally {
                buttonElement.disabled = false;
            }
        }

        // ------------------ Comments: show full-screen preview + comment stack beneath (snap: one visible) ------------------
        async function handleComment(postId) { 
            currentPostIdForComments = postId;

            // build a safe preview from the existing post card
            const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
            commentPostPreview.innerHTML = '';
            if (postCard) {
                const clone = postCard.cloneNode(true);

                // remove interactive controls inside the preview
                clone.querySelectorAll('.post-menu-button, .post-like-button, .audio-play-button, .post-menu-button, [id^="controls-bar-"], [id^="play-overlay-"]').forEach(n => n.remove());

                // For video: change id, enable native controls and pause it to keep preview static
                const video = clone.querySelector('video');
                if (video) {
                    if (video.id) video.id = 'preview-' + video.id;
                    video.controls = true;
                    video.removeAttribute('onclick');
                    try { video.pause(); } catch(e){}
                    // ensure video fits preview area
                    video.classList.add('preview-media');
                }

                // remove any waveform placeholders
                clone.querySelectorAll('[id^="waveform-"]').forEach(n => n.remove());

                // Clean inline onclick attributes to avoid conflicts
                clone.querySelectorAll('[onclick]').forEach(el => el.removeAttribute('onclick'));

                // add class to ensure it fits nicely
                clone.classList.add('shadow-none', 'bg-transparent');
                commentPostPreview.appendChild(clone);
            }

            // fetch comments and render
            await fetchAndDisplayComments(postId);

            // open modal (full screen). prevent body scroll while modal open.
            commentModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            // adjust each comment's height to match the comments viewport so only one is visible at a time.
            setTimeout(adjustCommentItemsHeight, 50);
        }

        function closeCommentModal() {
            commentModal.classList.add('hidden');
            currentPostIdForComments = null;
            newCommentInput.value = '';
            commentsList.innerHTML = '';
            commentPostPreview.innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        closeCommentModalBtn.addEventListener('click', closeCommentModal);

        function createCommentHtml(comment) {
            const commentDate = new Date(comment.timestamp).toLocaleString('ar-EG', {

        async function fetchAndDisplayComments(postId) {
            commentsList.innerHTML = '<div class="text-center text-gray-500 p-4">جاري تحميل التعليقات...</div>';
            commentError.classList.add('hidden');
            try {
                const response = await fetch(`/api/posts/${postId}/comments`);
                const result = await response.json();
                if (response.ok && result.ok) {
                    commentsList.innerHTML = '';
                    if (!result.comments || result.comments.length === 0) {
                        commentsList.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد تعليقات حتى الآن.</div>';
                    } else {
                        // render comments
                        result.comments.forEach(comment => {
                            commentsList.innerHTML += createCommentHtml(comment);
                        });

                        // after rendering, update verified badges and sizing
                        updateVerifiedBadges();

                        // ensure each .comment-item takes the height of the comments viewport (so only one visible at a time)
                        setTimeout(adjustCommentItemsHeight, 40);

                        // scroll to the last comment
                        commentsList.scrollTop = commentsList.scrollHeight;
                    }
                } else {
                    commentError.textContent = result.error || 'فشل في جلب التعليقات.';
                    commentError.classList.remove('hidden');
                    commentsList.innerHTML = '';
                }
            } catch (error) {
                commentError.textContent = 'حدث خطأ في الاتصال بالخادم.';
                commentError.classList.remove('hidden');
                commentsList.innerHTML = '';
            }
        }

        // Set each comment-item height to the available height of the comments viewport so only one comment is visible.
        function adjustCommentItemsHeight() {
            const commentsViewportHeight = commentsList.clientHeight;
            const items = Array.from(commentsList.querySelectorAll('.comment-item'));
            if (items.length === 0) return;
            items.forEach(it => {
                it.style.minHeight = commentsViewportHeight + 'px';
                it.style.maxHeight = commentsViewportHeight + 'px';
                it.style.padding = '18px';
                it.style.display = 'flex';
                it.style.alignItems = 'center';
            });
        }

        async function postComment() {
            const content = newCommentInput.value.trim();
            if (!content || !currentPostIdForComments) return;
            postCommentBtn.disabled = true;
            postCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            commentError.classList.add('hidden');
            try {
                const response = await fetch(`/api/posts/${currentPostIdForComments}/comment`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: content })
                });
                const result = await response.json();
                if (response.ok && result.ok) {
                    // append the new comment and re-adjust heights
                    commentsList.innerHTML += createCommentHtml(result.comment);
                    newCommentInput.value = '';
                    updateVerifiedBadges();
                    setTimeout(() => { adjustCommentItemsHeight(); commentsList.scrollTop = commentsList.scrollHeight; }, 80);

                    // update counts in original post card and in preview
                    const postCard = document.querySelector(`div[data-post-id="${currentPostIdForComments}"]`);
                    if (postCard) {
                        const commentsSpan = postCard.querySelector('.flex.justify-between span:last-child');
                        if (commentsSpan) commentsSpan.innerHTML = `<i class="fas fa-comments ml-1"></i> ${result.newComments} تعليق`;
                    }
                    const preview = commentPostPreview.querySelector(`div[data-post-id="${currentPostIdForComments}"]`);
                    if (preview) {
                        const commentsSpanPreview = preview.querySelector('.flex.justify-between span:last-child');
                        if (commentsSpanPreview) commentsSpanPreview.innerHTML = `<i class="fas fa-comments ml-1"></i> ${result.newComments} تعليق`;
                    }
                } else {
                    commentError.textContent = result.error || 'فشل في إضافة التعليق.';
                    commentError.classList.remove('hidden');
                }
            } catch (error) {
                commentError.textContent = 'فشل الاتصال بالخادم.';
                commentError.classList.remove('hidden');
            } finally {
                postCommentBtn.disabled = false;
                postCommentBtn.innerHTML = 'نشر';
            }
        }

        postCommentBtn.addEventListener('click', postComment);
        newCommentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); postComment(); } });

        async function updateVerifiedBadges() {
            const placeholders = Array.from(document.querySelectorAll('.verified-placeholder'));
            if (placeholders.length === 0) return;
            const ids = [...new Set(placeholders.map(p => p.dataset.userId).filter(Boolean))];
            await Promise.all(ids.map(async uid => {
                try {
                    const res = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`);
                    if (!res.ok) {
                        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
                        return;
                    }
                    const data = await res.json();
                    if (data && data.is_verified) {
                        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => {
                            const img = document.createElement('img');
                            img.src = VERIFIED_IMG_URL;
                            img.alt = 'موثق';
                            img.title = 'موثق';
                            img.className = 'verified-badge-img';
                            ph.replaceWith(img);
                        });
                    } else {
                        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
                    }
                } catch (e) {
                    document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
                }
            }));
        }

        function escapeHtml(str) {
            if (!str && str !== 0) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile').then(response => response.ok ? response.json() : null).then(data => {
                const profilePicElement = document.getElementById('userProfilePic');
                const meDot = document.getElementById('meOnlineDot');
                if (data && data.profile_picture_url) {
                    profilePicElement.src = data.profile_picture_url;
                    profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                    currentUserId = data.id;
                    if (data.is_online) meDot.style.display = 'inline-block';
                    else meDot.style.display = 'none';
                }
            }).catch(console.error);
            fetchAndDisplayPosts();
        });

        (function setupNotifSSE() {
          if (!window.EventSource) return;
          const es = new EventSource('/api/notifications/stream', { withCredentials: true });
          es.addEventListener('notifications', (e) => {
            try {
              const payload = JSON.parse(e.data);
              const unread = payload.unread_count || 0;
              const unreadMessages = payload.unread_messages_count || 0;
              const pendingFR = payload.pending_friend_requests_count || 0;
              const notifBadgeEl = document.getElementById('notifBadge');
              if (unread > 0) { notifBadgeEl.style.display = 'inline-flex'; notifBadgeEl.textContent = unread > 99 ? '99+' : String(unread); } else notifBadgeEl.style.display = 'none';
              const msgBadgeEl = document.getElementById('msgBadge');
              if (unreadMessages > 0) { msgBadgeEl.style.display = 'inline-flex'; msgBadgeEl.textContent = unreadMessages > 99 ? '99+' : String(unreadMessages); } else msgBadgeEl.style.display = 'none';
              const frBadgeEl = document.getElementById('friendReqBadge');
              if (pendingFR > 0) { frBadgeEl.style.display = 'inline-flex'; frBadgeEl.textContent = pendingFR > 99 ? '99+' : String(pendingFR); } else frBadgeEl.style.display = 'none';
            } catch (err) { console.error('Failed to parse notifications SSE data', err); }
          });
          es.addEventListener('error', (err) => { console.warn('Notifications SSE error', err); });
        })();

        (function initUnreadCounts() {
          fetch('/api/notifications/unread_count', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.ok) { const badge = document.getElementById('notifBadge'); if (d.unread_count > 0) { badge.style.display = 'inline-flex'; badge.textContent = d.unread_count > 99 ? '99+' : String(d.unread_count); } } }).catch(()=>{});
          fetch('/api/chats', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.ok && Array.isArray(d.chats)) { const totalUnread = d.chats.reduce((acc, c) => acc + (c.unread_count || 0), 0); const msgBadge = document.getElementById('msgBadge'); if (totalUnread > 0) { msgBadge.style.display = 'inline-flex'; msgBadge.textContent = totalUnread > 99 ? '99+' : String(totalUnread); } } }).catch(()=>{});
          fetch('/api/friends/requests_count', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.ok) { const fr = document.getElementById('friendReqBadge'); if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); } } }).catch(()=>{});
        })();

        function sendHeartbeat() { fetch('/api/status/heartbeat', { method: 'POST' }).then(r => r.json()).catch(err => console.error('Heartbeat failed', err)); }
        sendHeartbeat();
        setInterval(sendHeartbeat, 60000);

        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updateVerifiedBadges(); });

    </script>
</body>
</html>
