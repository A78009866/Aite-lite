<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* نمط الشعار الجديد */
        .app-logo {
            font-family: 'Montserrat', sans-serif; /* خط مودرن للشعار */
            font-weight: 800;
            /* يمكن تجربة خط Vibes إذا كان متاحاً ومتناسباً: font-family: 'Vibes', cursive; */
        }

        /* نمط نافذة الملف الشخصي الزجاجية */
        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000; /* للتأكد من أنها فوق كل شيء */
        }

        /* نمط نافذة التعليقات الزجاجية الجديدة */
        .glass-comment-modal-content {
            background-color: rgba(0, 0, 0, 0.7); /* خلفية سوداء شفافة */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .media-container {
            max-height: 80vh; 
            width: auto;
        }
        
        /* نمط بطاقة المنشور الزجاجية الجديدة */
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3); /* خلفية سوداء شفافة */
            backdrop-filter: blur(10px); /* تأثير زجاجي */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); /* حدود بيضاء خفيفة */
        }

        /* نمط WaveSurfer لمنشورات الهوم */
        .waveform-post {
            height: 60px; 
            background-color: #0f172a; 
            border-radius: 6px;
        }

        /* شريط التمرير مخصص للتعليقات */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
            
            <div class="flex items-center">
                <button id="profileMenuButton" class="relative block" onclick="toggleProfileDropdown(event)">
                    <img id="userProfilePic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300 cursor-pointer">
                </button>
            </div>
            
            <div class="flex-grow flex justify-center">
                <a href="/chat_list" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300 app-logo">

            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="/create-post" class="bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center border border-gray-700">
                    <i class="fas fa-plus ml-2"></i>

                <a href="/profile" class="flex items-center px-4 py-3 text-white hover:bg-white/10 rounded-t-lg transition duration-200">
                    <i class="fas fa-user-circle text-xl ml-3"></i>
                    الملف الشخصي
                </a>
                <a href="/logout" class="flex items-center px-4 py-3 text-red-400 hover:bg-white/10 rounded-b-lg transition duration-200 border-t border-gray-700">
                    <i class="fas fa-sign-out-alt text-xl ml-3"></i>

    </header>

    <main class="max-w-6xl mx-auto p-4">
        
        <div id="postsFeed" class="max-w-xl mx-auto mt-4 space-y-4">
            </div>

    </main>
    
    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg">
        <div class="bg-[#1f2937] p-6 rounded-xl shadow-2xl max-w-sm w-full border border-gray-700 text-center" onclick="event.stopPropagation()">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-gray-400 mb-6">هل أنت متأكد أنك تريد حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء.</p>

                <button id="confirmDeleteBtn" class="p-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-300">تأكيد الحذف</button>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="media-container flex items-center justify-center" onclick="event.stopPropagation()">
        </div>
    </div>
    
    <div id="commentModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg">
        <div class="glass-comment-modal-content p-6 rounded-xl shadow-2xl max-w-lg w-full h-[90vh] flex flex-col" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center pb-4 border-b border-gray-700">
                <h3 class="text-2xl font-bold text-white">التعليقات</h3>
                <button id="closeCommentModalBtn" class="text-gray-400 hover:text-white transition duration-300 text-3xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div id="commentsList" class="flex-grow overflow-y-auto py-4 space-y-4 custom-scrollbar">
                </div>

            <div class="pt-4 border-t border-gray-700 flex items-center">
                <input type="text" id="newCommentInput" placeholder="أضف تعليقًا..." class="flex-grow p-3 bg-gray-800 text-white rounded-r-full focus:outline-none focus:ring-2 focus:ring-blue-500 border border-gray-700" dir="rtl">
                <button id="postCommentBtn" class="p-3 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-l-full transition duration-300 flex-shrink-0">
                    <i class="fas fa-paper-plane text-lg"></i>
                </button>
            </div>

    <div id="postMenu" class="absolute z-40 bg-[#242526] rounded-lg shadow-xl border border-gray-700 hidden w-40">
        <button id="deleteOptionBtn" class="flex items-center w-full p-3 text-red-400 hover:bg-[#343536] rounded-lg transition duration-300">
            <i class="fas fa-trash ml-3"></i>
            حذف المنشور
        </button>
    </div>
<script>
    // متغيرات عامة
    let currentUserId = null;
    let currentChatRoomId = null;

    // ----------------- Video Control Functions -----------------
    /**
     * تشغيل/إيقاف الفيديو والتبديل بين أيقونة التشغيل/الإيقاف
     * @param {HTMLVideoElement} videoElement 
     * @param {HTMLElement} iconElement 
     */
    function togglePlay(videoElement, iconElement) {
        // لتحديد أيقونة التشغيل/الإيقاف بشكل صحيح
        const isPlaying = !videoElement.paused && !videoElement.ended;
        
        if (isPlaying) {
            videoElement.pause();
            // تحديث الأيقونات في كلا الزرين (المركزي والسفلي)
            const wrapper = videoElement.closest('.video-wrapper');
            if (wrapper) {
                wrapper.querySelector('.play-pause-btn-center i').className = 'fas fa-play';
                wrapper.querySelector('.play-pause-btn-bottom i').className = 'fas fa-play';
            }
        } else {
            videoElement.play();
            // تحديث الأيقونات
            const wrapper = videoElement.closest('.video-wrapper');
            if (wrapper) {
                wrapper.querySelector('.play-pause-btn-center i').className = 'fas fa-pause';
                wrapper.querySelector('.play-pause-btn-bottom i').className = 'fas fa-pause';
            }
        }
    }

    /**
     * تفعيل أو إلغاء وضع ملء الشاشة (التكبير)
     * @param {HTMLElement} element 
     */
    function toggleFullScreen(element) {
        if (!document.fullscreenElement) {
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) { /* Safari */
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) { /* IE11 */
                element.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
        }
    }

    /**
     * تحويل الثواني إلى تنسيق M:SS
     * @param {number} seconds 
     */
    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ----------------- Post Rendering -----------------

    /**
     * إنشاء عنصر واجهة المستخدم (UI) لمنشور واحد.
     * تم تعديل هذه الدالة لتحسين عرض الفيديو.
     * @param {object} post - بيانات المنشور
     * @returns {HTMLElement}
     */
    function createPostElement(post) {
        const postElement = document.createElement('div');
        postElement.className = 'bg-gray-900 p-4 mb-4 rounded-xl shadow-lg border border-gray-800';
        
        // 1. Post Header
        const header = `
            <div class="flex items-center mb-3">
                <img src="${post.user.profile_picture_url}" alt="صورة ${post.user.username}" class="w-10 h-10 rounded-full object-cover ml-3 border border-blue-500">
                <div class="flex-grow">
                    <p class="font-bold text-white">${post.user.username}</p>
                    <p class="text-xs text-gray-400">${new Date(post.timestamp).toLocaleString('ar-EG')}</p>
                </div>
            </div>
            <p class="text-gray-300 mb-3 whitespace-pre-wrap">${post.content}</p>
        `;
        postElement.innerHTML = header;
        
        // 2. Media Content
        if (post.media && post.media.url) {
            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'mt-3 mb-4';

            if (post.media.type === 'image') {
                mediaContainer.innerHTML = `<img src="${post.media.url}" alt="صورة المنشور" class="w-full rounded-lg object-contain max-h-96">`;
            } else if (post.media.type === 'video') {
                // ------------------ Video Enhancement Start ------------------
                const videoWrapper = document.createElement('div');
                videoWrapper.className = 'video-wrapper relative rounded-lg overflow-hidden w-full bg-black/50';
                videoWrapper.id = `video-wrapper-${post.postId}`;
                
                // ملاحظة: إضافة poster لإظهار صورة ثابتة قبل التحميل
                videoWrapper.innerHTML = `
                    <video id="video-${post.postId}" class="post-video w-full" src="${post.media.url}" preload="metadata" style="max-height: 500px;"></video>
                    
                    <div id="overlay-${post.postId}" class="controls-overlay absolute inset-0 flex flex-col justify-between items-center opacity-100 transition-opacity duration-300 bg-black/30 cursor-pointer">
                        
                        <div class="flex-grow flex items-center justify-center w-full h-full">
                            <button class="play-pause-btn-center text-white text-6xl hover:scale-110 transition-transform p-4 rounded-full bg-black/60 shadow-xl">
                                <i class="fas fa-play"></i>
                            </button>
                        </div>

                        <div class="bottom-bar w-full p-3 bg-black/80 flex justify-between items-center text-white text-sm">
                            <div class="flex items-center space-x-2 space-x-reverse">
                                <button class="play-pause-btn-bottom text-xl hover:text-blue-400">
                                    <i class="fas fa-play"></i>
                                </button>
                                <span class="video-current-time">0:00</span>
                                <span class="text-gray-400">/</span>
                                <span class="video-duration">0:00</span>
                            </div>
                            
                            <button class="zoom-btn text-xl hover:text-blue-400">
                                <i class="fas fa-expand"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                mediaContainer.appendChild(videoWrapper);
                postElement.appendChild(mediaContainer);

                // Add Event Listeners AFTER mounting the HTML elements
                setTimeout(() => {
                    const video = document.getElementById(`video-${post.postId}`);
                    const overlay = document.getElementById(`overlay-${post.postId}`);
                    const wrapper = document.getElementById(`video-wrapper-${post.postId}`);
                    const centerBtn = wrapper.querySelector('.play-pause-btn-center');
                    const bottomBtn = wrapper.querySelector('.play-pause-btn-bottom');
                    const zoomBtn = wrapper.querySelector('.zoom-btn');
                    const currentTimeSpan = wrapper.querySelector('.video-current-time');
                    const durationSpan = wrapper.querySelector('.video-duration');

                    // Play/Pause Logic (Clicking the center button or the video itself)
                    centerBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        togglePlay(video);
                    });
                    
                    bottomBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        togglePlay(video);
                    });
                    
                    // Click on the video itself also toggles play/pause
                    video.addEventListener('click', () => {
                        togglePlay(video);
                    });

                    // Hide/Show overlay on play/pause
                    video.addEventListener('play', () => {
                        overlay.style.opacity = '0';
                        // إخفاء الـ overlay بعد ثوانٍ قليلة عند التشغيل
                        wrapper.dataset.hideTimeout = setTimeout(() => {
                            overlay.style.opacity = '0';
                        }, 500);
                    });
                    
                    video.addEventListener('pause', () => {
                        clearTimeout(wrapper.dataset.hideTimeout);
                        overlay.style.opacity = '1';
                    });
                    
                    // Show controls on mouse hover
                    wrapper.addEventListener('mouseover', () => {
                         overlay.style.opacity = '1';
                    });
                    
                    wrapper.addEventListener('mouseleave', () => {
                        if (!video.paused) {
                            overlay.style.opacity = '0';
                        }
                    });


                    // Initial duration setup
                    video.addEventListener('loadedmetadata', () => {
                        durationSpan.textContent = formatTime(video.duration);
                    });

                    // Time update
                    video.addEventListener('timeupdate', () => {
                        currentTimeSpan.textContent = formatTime(video.currentTime);
                    });

                    // Full Screen Logic
                    zoomBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFullScreen(wrapper);
                    });
                    
                    // Re-show overlay on end
                    video.addEventListener('ended', () => {
                        overlay.style.opacity = '1';
                        centerBtn.querySelector('i').className = 'fas fa-play';
                        bottomBtn.querySelector('i').className = 'fas fa-play';
                        video.currentTime = 0; // إرجاع الفيديو للبداية
                    });

                }, 0); // استخدم setTimeout لتأكيد إضافة العناصر إلى DOM
                
                // ------------------ Video Enhancement End ------------------

            } else if (post.media.type === 'audio') {
                // Audio Player Logic 
                // ... (Existing Wavesurfer/HTML logic here)
                mediaContainer.innerHTML = `<audio controls src="${post.media.url}" class="w-full h-10 bg-gray-800 rounded-lg p-1"></audio>`;
            }
            
            if (post.media.type !== 'video') {
                postElement.appendChild(mediaContainer);
            }
        }
        
        // 3. Post Footer (Likes/Comments)
        // ... (Existing logic for footer)
        const footer = `
            <div class="flex justify-between items-center text-gray-400 mt-2">
                <button class="like-btn flex items-center space-x-1 space-x-reverse ${post.is_liked ? 'text-red-500' : 'hover:text-red-500'}" data-post-id="${post.postId}">
                    <i class="${post.is_liked ? 'fas' : 'far'} fa-heart"></i>
                    <span class="likes-count">${post.likes || 0}</span>
                </button>
                <button class="comment-btn flex items-center hover:text-blue-500" data-post-id="${post.postId}">
                    <i class="far fa-comment-alt ml-1"></i>
                    <span>${post.commentsCount || 0}</span>
                </button>
            </div>
            
            <div id="comments-section-${post.postId}" class="comments-section mt-3 hidden">
                <div class="comment-list space-y-3 mb-3"></div>
                <div class="flex">
                    <input type="text" placeholder="اكتب تعليقك..." id="new-comment-input-${post.postId}" class="flex-grow bg-gray-700 text-white rounded-full px-4 py-2 text-sm border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" dir="rtl">
                    <button id="post-comment-btn-${post.postId}" class="post-comment-btn text-blue-500 p-2 ml-2 rounded-full hover:bg-gray-800 transition duration-150">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>
        `;
        postElement.innerHTML += footer;

        // Attach listeners for likes and comments after creating element
        postElement.querySelector('.like-btn').addEventListener('click', () => toggleLike(post.postId, postElement.querySelector('.like-btn')));
        postElement.querySelector('.comment-btn').addEventListener('click', () => toggleCommentsSection(post.postId, postElement));
        postElement.querySelector(`#post-comment-btn-${post.postId}`).addEventListener('click', () => postComment(post.postId, postElement));
        postElement.querySelector(`#new-comment-input-${post.postId}`).addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                postComment(post.postId, postElement);
            }
        });


        return postElement;
    }
    
    // ----------------- Data Fetching and Initialization -----------------

    /**
     * جلب وعرض المنشورات
     */
    async function fetchAndDisplayPosts() {
        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = '<div class="text-center text-gray-400 py-10"><i class="fas fa-spinner fa-spin text-2xl"></i> جاري تحميل المنشورات...</div>';
        
        try {
            const response = await fetch('/api/posts');
            const result = await response.json();

            postsContainer.innerHTML = ''; 

            if (result.ok && result.posts.length > 0) {
                result.posts.forEach(post => {
                    postsContainer.appendChild(createPostElement(post));
                });
            } else if (result.posts.length === 0) {
                postsContainer.innerHTML = '<p class="text-center text-gray-500 py-10">لا توجد منشورات لعرضها حالياً.</p>';
            } else {
                postsContainer.innerHTML = '<p class="text-center text-red-400 py-10">فشل في جلب المنشورات.</p>';
            }

        } catch (error) {
            console.error('Fetch posts error:', error);
            postsContainer.innerHTML = '<p class="text-center text-red-400 py-10">فشل الاتصال بالخادم لجلب المنشورات.</p>';
        }
    }
    
    // ----------------- Comment Logic -----------------
    
    function createCommentElement(comment) {
        const commentDiv = document.createElement('div');
        commentDiv.className = 'flex items-start text-sm bg-gray-800 p-2 rounded-lg';
        commentDiv.innerHTML = `
            <img src="${comment.user.profile_picture_url}" alt="صورة ${comment.user.username}" class="w-6 h-6 rounded-full object-cover ml-2">
            <div>
                <span class="font-semibold text-blue-400">${comment.user.username}:</span> 
                <span class="text-gray-300 whitespace-pre-wrap">${comment.content}</span>
                <p class="text-xs text-gray-500">${new Date(comment.timestamp).toLocaleTimeString('ar-EG')}</p>
            </div>
        `;
        return commentDiv;
    }

    async function fetchAndDisplayComments(postId, commentListElement) {
        commentListElement.innerHTML = '<div class="text-center text-gray-500"><i class="fas fa-spinner fa-spin text-sm"></i> جاري تحميل التعليقات...</div>';
        
        try {
            const response = await fetch(`/api/posts/${postId}/comments`);
            const result = await response.json();
            
            commentListElement.innerHTML = '';
            
            if (result.ok && result.comments.length > 0) {
                result.comments.forEach(comment => {
                    commentListElement.appendChild(createCommentElement(comment));
                });
            } else {
                commentListElement.innerHTML = '<p class="text-center text-gray-500 text-sm">كن أول من يعلق.</p>';
            }
        } catch (error) {
            commentListElement.innerHTML = '<p class="text-center text-red-400 text-sm">فشل في جلب التعليقات.</p>';
        }
    }

    function toggleCommentsSection(postId, postElement) {
        const commentsSection = postElement.querySelector(`#comments-section-${postId}`);
        const commentListElement = commentsSection.querySelector('.comment-list');
        
        const isHidden = commentsSection.classList.contains('hidden');
        
        if (isHidden) {
            commentsSection.classList.remove('hidden');
            fetchAndDisplayComments(postId, commentListElement);
        } else {
            commentsSection.classList.add('hidden');
        }
    }
    
    async function postComment(postId, postElement) {
        const newCommentInput = postElement.querySelector(`#new-comment-input-${postId}`);
        const postCommentBtn = postElement.querySelector(`#post-comment-btn-${postId}`);
        const commentListElement = postElement.querySelector('.comment-list');
        const commentContent = newCommentInput.value.trim();

        if (commentContent.length === 0) return;

        postCommentBtn.disabled = true;
        postCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; 

        try {
            const response = await fetch(`/api/posts/${postId}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: commentContent })
            });
            
            const result = await response.json();
            
            if (response.ok && result.ok) {
                // إضافة التعليق الجديد إلى القائمة دون إعادة تحميل الكل
                commentListElement.appendChild(createCommentElement(result.comment));
                newCommentInput.value = '';
                // تحديث عداد التعليقات (اختياري)
                const commentCountSpan = postElement.querySelector('.comment-btn span');
                commentCountSpan.textContent = result.newComments;
                
                // التأكد من إزالة رسالة "كن أول من يعلق" إذا كانت موجودة
                if (commentListElement.querySelector('.text-center.text-gray-500')) {
                    commentListElement.innerHTML = '';
                    commentListElement.appendChild(createCommentElement(result.comment));
                }

            } else {
                alert(result.error || 'فشل في إضافة التعليق.');
            }

        } catch (error) {
            alert('فشل الاتصال بالخادم.');
        } finally {
            postCommentBtn.disabled = false;
            postCommentBtn.innerHTML = '<i class="fas fa-paper-plane text-lg"></i>';
        }
    }

    // ----------------- Like Logic -----------------
    async function toggleLike(postId, likeBtnElement) {
        try {
            const response = await fetch(`/api/posts/${postId}/like`, {
                method: 'POST'
            });
            
            const result = await response.json();

            if (response.ok && result.ok) {
                const isLiked = result.action === 'liked';
                const icon = likeBtnElement.querySelector('i');
                const countSpan = likeBtnElement.querySelector('.likes-count');

                // تحديث الرمز
                icon.className = isLiked ? 'fas fa-heart' : 'far fa-heart';
                // تحديث اللون
                likeBtnElement.classList.toggle('text-red-500', isLiked);
                likeBtnElement.classList.toggle('hover:text-red-500', !isLiked);
                
                // تحديث العدد
                countSpan.textContent = result.newLikes;

            } else {
                alert(result.error || 'فشل في معالجة الإعجاب.');
            }
        } catch (error) {
            console.error('Like error:', error);
            alert('فشل الاتصال بالخادم.');
        }
    }
    
    // ----------------- Initialization -----------------
    
    document.addEventListener('DOMContentLoaded', () => {
        // جلب صورة الملف الشخصي وحفظ الـ ID للمستخدم الحالي
        fetch('/api/profile')
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                const profilePicElement = document.getElementById('userProfilePic');
                if (data && data.profile_picture_url) {
                    profilePicElement.src = data.profile_picture_url;
                    profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                    currentUserId = data.id; // حفظ معرف المستخدم الحالي
                }
            }).catch(console.error);
            
        fetchAndDisplayPosts();
    });
</script>
