<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="/https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            /* إضافة مساحة سفلية لمنع الشريط السفلي من حجب المحتوى */
            padding-bottom: 80px; 
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* نمط الشعار الجديد */
        .app-logo {
            font-family: 'Montserrat', sans-serif; /* خط مودرن للشعار */
            font-weight: 800;
        }

        /* نمط نافذة الملف الشخصي الزجاجية */
        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000; /* للتأكد من أنها فوق كل شيء */
        }

        /* نمط نافذة التعليقات الزجاجية الجديدة */
        .glass-comment-modal-content {
            background: linear-gradient(180deg, rgba(8,10,12,0.6), rgba(6,8,10,0.75));
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 12px 40px rgba(2,6,23,0.7);
            color: #e6eefb;
        }
        
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .media-container {
            max-height: 80vh; 
            width: auto;
        }
        
        /* نمط بطاقة المنشور الزجاجية الجديدة */
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3); /* خلفية سوداء شفافة */
            backdrop-filter: blur(10px); /* تأثير زجاجي */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06); /* حدود بيضاء خفيفة */
        }
        
        /* ************************************** */
        /* نمط الشريط السفلي الزجاجي الجديد */
        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* ************************************** */


        /* نمط WaveSurfer لمنشورات الهوم */
        .waveform-post {
            height: 60px; 
            background-color: #0f172a; 
            border-radius: 6px;
        }

        /* شريط التمرير مخصص للتعليقات */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        /* تأثير ظهور النافذة */
        .modal-animate-in {
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* نمط أزرار الخيارات داخل النافذة */
        .create-option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .create-option-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* notification badge */
        #notifBadge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444;
          color: #fff;
          font-size: 12px;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

        /* message badge (new) */
        #msgBadge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444; /* تم تغيير اللون من السماوي إلى الأحمر */
          color: #ffffff;      /* تم تغيير لون النص للأبيض لضمان الوضوح */
          font-weight: 700;
          font-size: 12px;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

        /* friend request badge on users icon */
        #friendReqBadge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444; /* احمر موحد */
          color: #fff;
          font-size: 12px;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

/* Online green dot - التعديل الجديد */
.avatar-with-dot { 
  position: relative; 
  display: inline-flex; /* لضمان أن الحاوية تأخذ حجم الصورة فقط */
}

.online-dot {
  position: absolute;
  bottom: 2px;    /* بدلاً من top، نستخدم bottom لجعلها في الأسفل */
  right: 2px;     /* بدلاً من left، نستخدم right لتظهر في الزاوية اليمنى */
  width: 12px;
  height: 12px;
  background: #22c55e;
  border: 2px solid #000;
  border-radius: 999px;
  box-shadow: 0 0 6px rgba(34,197,94,0.6);
  z-index: 10;    /* لضمان ظهورها فوق الصورة */
}

/* التعديل لنسخة النقطة الصغيرة */
.online-dot-small {
  width: 10px;
  height: 10px;
  bottom: 1px;
  right: 1px;
  border-width: 1.5px;
}

/* VERIFIED BADGE IMAGE */
.verified-badge-img {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 999px;
  margin-left: 6px;
  object-fit: cover;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.06);
  vertical-align: middle;
}

/* Comments modal customizations for cleaner glassy black look */
#commentModal .glass-comment-modal-content {
  max-width: 720px;
  width: 100%;
  max-height: 88vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0;
}
#commentModal .modal-header {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
#commentModal .modal-header h3 { margin:0; font-size:18px; color:#fff; }
#commentModal .comment-post-preview {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  max-height: 36vh;
  overflow: auto;
}
#commentModal .comment-list {
  overflow-y: auto;
  padding: 12px 16px;
  gap:12px;
  display:flex;
  flex-direction:column;
}
.comment-item {
  display:flex;
  gap:10px;
  align-items:flex-start;
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.03);
}
.comment-item img {
  width:44px;
  height:44px;
  border-radius:10px;
  object-fit:cover;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,0.04);
}
.comment-body {
  flex:1;
}
.comment-meta {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.comment-username {
  font-weight:700;
  color:#fff;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:6px;
}
.comment-time {
  font-size:12px;
  color:#9aa6b3;
}
.comment-text { color:#dbeafe; font-size:14px; line-height:1.4; }

#commentModal .modal-input {
  padding: 12px;
  border-top: 1px solid rgba(255,255,255,0.04);
  display:flex;
  gap:8px;
  align-items:center;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
}
#commentModal .modal-input input[type="text"] {
  flex:1;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.04);
  padding:10px 12px;
  border-radius: 999px;
  color:#fff;
  outline:none;
}
#commentModal .modal-input button {
  background:#0ea5a3;
  color:#022;
  padding:10px 12px;
  border-radius:999px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

/* small screens */
@media (max-width:640px) {
  #commentModal .glass-comment-modal-content { margin: 12px; border-radius: 16px; }
  .comment-item img { width:40px; height:40px; }
  .verified-badge-img { width:14px; height:14px; }
}
    </style>
</head>

    <script>
        let currentPostIdToDelete = null;
        let currentUserId = null; 
        let activeWaveSurfer = null; // لتتبع مشغل WaveSurfer النشط
        let activeVideo = null; // لتتبع الفيديو النشط وإيقاف الآخر (جديد)

        const postsFeed = document.getElementById('postsFeed');
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteMessage = document.getElementById('deleteMessage');
        const postMenu = document.getElementById('postMenu');
        const deleteOptionBtn = document.getElementById('deleteOptionBtn');
        const mediaViewerModal = document.getElementById('mediaViewerModal');
        const mediaViewerContent = document.getElementById('mediaViewerContent');
        const profileDropdown = document.getElementById('profileDropdown'); 
        const profileMenuButton = document.getElementById('profileMenuButton'); 
        
        // عناصر قائمة الإنشاء
        const createMenu = document.getElementById('createMenu');
        const createBtn = document.getElementById('createBtn');

        // المتغيرات الجديدة للتعليقات
        const commentModal = document.getElementById('commentModal');
        const closeCommentModalBtn = document.getElementById('closeCommentModalBtn');
        const commentsList = document.getElementById('commentsList');
        const newCommentInput = document.getElementById('newCommentInput');
        const postCommentBtn = document.getElementById('postCommentBtn');
        const commentError = document.getElementById('commentError');
        const commentPostPreview = document.getElementById('commentPostPreview');
        let currentPostIdForComments = null; // لتتبع المنشور الحالي للتعليقات
        
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

        // ******************** وظائف النافذة الزجاجية للملف الشخصي ********************
        function toggleProfileDropdown(event) {
            event.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        }

        function closeProfileDropdownOnClickOutside(event) {
            if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        }

        document.addEventListener('click', closeProfileDropdownOnClickOutside);

        // وظائف قائمة الإنشاء
      const createModalEl = document.getElementById('createModal');

function toggleCreateModal() {
    createModalEl.classList.toggle('hidden');
    // منع التمرير في الخلفية عند فتح النافذة
    if (!createModalEl.classList.contains('hidden')) {
        document.body.style.overflow = 'hidden';
    } else {
        document.body.style.overflow = 'auto';
    }
}

// إغلاق النافذة عند النقر على الخلفية السوداء
createModalEl.addEventListener('click', (e) => {
    if (e.target === createModalEl) {
        toggleCreateModal();
    }
});
        
        // ******************** 1. وظائف عرض الوسائط (Media Viewer) ********************
        function openMediaViewer(url, type, event) {
            event.stopPropagation();
            
            // مشغل الصوت والفيديو سيتعامل معه WaveSurfer أو المشغل المخصص في المنشور نفسه
            if (type === 'audio' || type === 'video') { 
                return;
            }

            let mediaElement;
            mediaViewerContent.innerHTML = '';
            
            if (type === 'image') {
                mediaElement = `<img src="${url}" alt="Media Viewer" class="max-w-full max-h-full object-contain rounded-lg">`;
            } else {
                return;
            }

            mediaViewerContent.innerHTML = mediaElement;
            mediaViewerModal.classList.remove('hidden');
        }

        function closeMediaViewer(event) {
            if (event.target.id === 'mediaViewerModal' || event.target.closest('.fa-times')) {
                const activeMedia = mediaViewerContent.querySelector('video, audio');
                if (activeMedia) {
                    activeMedia.pause();
                }
                mediaViewerModal.classList.add('hidden');
                mediaViewerContent.innerHTML = '';
            }
        }

        // ******************** 2. وظائف حذف المنشور ********************

        function openDeleteModal(postId, event) {
            event.stopPropagation();
            currentPostIdToDelete = postId;
            deleteMessage.classList.add('hidden');
            deleteModal.classList.remove('hidden');
            // إغلاق قائمة الخيارات إذا كانت مفتوحة
            postMenu.classList.add('hidden');
        }

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            currentPostIdToDelete = null;
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentPostIdToDelete) return;

            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحذف';
            deleteMessage.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdToDelete}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    // حذف بطاقة المنشور من الواجهة
                    const el = document.querySelector(`div[data-post-id="${currentPostIdToDelete}"]`);
                    if (el) el.remove();
                    deleteModal.classList.add('hidden');
                } else {
                    deleteMessage.textContent = result.error || 'فشل الحذف.';
                    deleteMessage.classList.remove('hidden');
                }
            } catch (error) {
                deleteMessage.textContent = 'حدث خطأ في الاتصال بالخادم.';
                deleteMessage.classList.remove('hidden');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.innerHTML = 'تأكيد الحذف';
                currentPostIdToDelete = null;
            }
        });

        // ******************** 3. وظائف قائمة خيارات المنشور ********************

        function togglePostMenu(postId, userId, event, menuButton) {
            event.stopPropagation();
            
            // إغلاق أي قوائم مفتوحة أخرى
            if (!postMenu.classList.contains('hidden') && postMenu.dataset.postId === postId) {
                postMenu.classList.add('hidden');
                return;
            }
            
            // تحديد موقع القائمة بالنسبة للزر الذي تم الضغط عليه
            const rect = menuButton.getBoundingClientRect();
            postMenu.style.top = `${rect.bottom + 5}px`;
            // نستخدم rect.left هنا لتثبيت القائمة على يسار الزر (افتراضياً)
            postMenu.style.left = `${rect.left}px`;
            
            // تخزين مُعرّف المنشور لزر الحذف
            postMenu.dataset.postId = postId;

            // إظهار/إخفاء خيار الحذف بناءً على مالك المنشور
            if (userId === currentUserId) {
                deleteOptionBtn.style.display = 'flex';
                // تحديث وظيفة زر الحذف داخل القائمة
                deleteOptionBtn.onclick = (e) => openDeleteModal(postId, e);
            } else {
                deleteOptionBtn.style.display = 'none';
            }

            postMenu.classList.remove('hidden');
        }

        document.addEventListener('click', (event) => {
            if (!postMenu.contains(event.target) && !event.target.closest('.post-menu-button')) {
                postMenu.classList.add('hidden');
                deleteModal.classList.add('hidden'); // للتأكد من إغلاق الحذف أيضاً
            }
        });

        // ******************** 4. وظائف WaveSurfer للصوت ********************
        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if (!container) return;

            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4b5563',
                progressColor: '#3b82f6',
                cursorColor: '#10b981',
                barWidth: 3,
                barRadius: 3,
                barGap: 1,
                height: 60,
                responsive: true,
                mediaControls: false,
            });

            ws.load(url);

            const playButton = container.closest('.glass-post-card').querySelector('.audio-play-button');
            if (playButton) {
                playButton.onclick = () => {
                    // إيقاف تشغيل أي مشغل صوتي أو فيديو آخر
                    if (activeWaveSurfer && activeWaveSurfer !== ws) {
                        activeWaveSurfer.pause();
                        const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                        if (otherPostCard) {
                            const pb = otherPostCard.querySelector('.audio-play-button i');
                            if (pb) { pb.classList.remove('fa-pause'); pb.classList.add('fa-play'); }
                        }
                    }
                    if (activeVideo) {
                        const activePostId = activeVideo.id.split('-')[1];
                        const controlIcon = document.getElementById(`control-icon-${activePostId}`);
                        const playOverlay = document.getElementById(`play-overlay-${activePostId}`);
                        activeVideo.pause();
                        if (controlIcon) {
                            controlIcon.classList.remove('fa-pause');
                            controlIcon.classList.add('fa-play');
                        }
                        if (playOverlay) playOverlay.classList.remove('hidden');
                        activeVideo = null;
                    }
                    
                    if (ws.isPlaying()) {
                        ws.pause();
                        playButton.querySelector('i').classList.remove('fa-pause');
                        playButton.querySelector('i').classList.add('fa-play');
                    } else {
                        ws.play();
                        playButton.querySelector('i').classList.remove('fa-play');
                        playButton.querySelector('i').classList.add('fa-pause');
                        activeWaveSurfer = ws;
                    }
                };

                ws.on('finish', () => {
                    playButton.querySelector('i').classList.remove('fa-pause');
                    playButton.querySelector('i').classList.add('fa-play');
                    activeWaveSurfer = null;
                });
            }
        }
        
        // ******************** 4.1. وظائف تحكم الفيديو المخصصة (جديد) ********************
        
        function toggleVideoPlay(postId, event) {
            event.stopPropagation();
            
            const video = document.getElementById(`video-${postId}`);
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            const controlsBar = document.getElementById(`controls-bar-${postId}`);

            if (!video) return;

            // 1. إيقاف تشغيل أي فيديو أو صوت آخر
            if (activeVideo && activeVideo !== video) {
                const activePostId = activeVideo.id.split('-')[1];
                const activeControlIcon = document.getElementById(`control-icon-${activePostId}`);
                const activePlayOverlay = document.getElementById(`play-overlay-${activePostId}`);
                activeVideo.pause();
                if (activeControlIcon) {
                    activeControlIcon.classList.remove('fa-pause');
                    activeControlIcon.classList.add('fa-play');
                }
                if (activePlayOverlay) activePlayOverlay.classList.remove('hidden');
                
                // إزالة مستمعي الأحداث للفيديو السابق
                activeVideo.removeEventListener('timeupdate', updateVideoProgress);
                activeVideo.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
                activeVideo.removeEventListener('ended', handleVideoEnd);
            }
            if (activeWaveSurfer) {
                activeWaveSurfer.pause();
                const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                if (otherPostCard) {
                    const apb = otherPostCard.querySelector('.audio-play-button i');
                    if (apb) { apb.classList.remove('fa-pause'); apb.classList.add('fa-play'); }
                }
                activeWaveSurfer = null;
            }
            
            // 2. تبديل حالة التشغيل
            if (video.paused) {
                video.play();
                playOverlay.classList.add('hidden'); // إخفاء زر التشغيل المركزي
                if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
                if (controlsBar) controlsBar.classList.remove('opacity-0'); // إظهار شريط التحكم
                activeVideo = video;
                
                // ربط مستمعي الأحداث
                video.addEventListener('timeupdate', updateVideoProgress);
                video.addEventListener('loadedmetadata', updateVideoTimeDisplay);
                video.addEventListener('ended', handleVideoEnd);

            } else {
                video.pause();
                playOverlay.classList.remove('hidden'); // إظهار زر التشغيل المركزي
                if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
                activeVideo = null;
            }
        }

        function updateVideoProgress(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const progressBar = document.getElementById(`progress-bar-${postId}`);
            const timeDisplay = document.getElementById(`time-display-${postId}`);

            if (!video.duration || !progressBar || !timeDisplay) return;

            const percent = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        }

        function updateVideoTimeDisplay(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const timeDisplay = document.getElementById(`time-display-${postId}`);

            if (timeDisplay && video.duration) {
                timeDisplay.textContent = `0:00 / ${formatVideoTime(video.duration)}`;
            }
        }
        
        function handleVideoEnd(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            
            video.currentTime = 0;
            if (playOverlay) playOverlay.classList.remove('hidden'); 
            if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
            activeVideo = null;
            
            video.removeEventListener('timeupdate', updateVideoProgress);
            video.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
            video.removeEventListener('ended', handleVideoEnd);
        }

        function formatVideoTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function seekVideo(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const progressContainer = event.currentTarget;
            
            if (!video || !video.duration) return;

            const rect = progressContainer.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            video.currentTime = video.duration * percentage;
            if (video.paused) {
                toggleVideoPlay(postId, event);
            }
        }

        function toggleFullscreen(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            if (video) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.mozRequestFullScreen) {
                    video.mozRequestFullScreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            }
        }

        // ******************** 5. وظائف عرض المنشورات ********************

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);

            if (diffInHours < 24) {
                return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 7 * 24) {
                return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
            }
        }

        async function fetchAndDisplayPosts() {
            postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';
            
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();
                
                postsFeed.innerHTML = '';
                
                if (response.ok && result.ok) {
                    if (result.posts.length === 0) {
                        postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات لعرضها بعد.</div>';
                        return;
                    }
                    
                    const audioPostsToInit = [];

                    result.posts.forEach(post => {
                        postsFeed.innerHTML += createPostCard(post);
                        
                        // جمع منشورات الصوت لتهيئة WaveSurfer
                        if (post.media && post.media.type === 'audio') {
                            audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                        }
                    });
                    
                    // تأخير تهيئة WaveSurfer للسماح للـ DOM بالتحميل
                    setTimeout(() => {
                        audioPostsToInit.forEach(ap => {
                            initializePostWaveSurfer(ap.postId, ap.url);
                        });
                        // بعد العرض، حدّث شعارات التوثيق (لأسماء المنشورات)
                        updateVerifiedBadges();
                    }, 150); 

                }
            } catch (error) {
                console.error('Error:', error);
                postsFeed.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في جلب المنشورات.</div>';
            }
        }
        
        // ******************** 6. وظائف التفاعل (الإعجاب والتعليق) ********************
        
        async function handleLike(postId, buttonElement) {
            console.log(`محاولة الإعجاب/إلغاء الإعجاب للمنشور: ${postId}`); 
            
            const likeIcon = buttonElement.querySelector('.like-icon');
            
            // تعطيل الزر مؤقتاً لمنع النقر المتعدد
            buttonElement.disabled = true;

            try {
                const response = await fetch(`/api/posts/${postId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
                    // تحديث عرض الإعجابات الموجود إن وُجد
                    if (postCard) {
                        const likesSpan = postCard.querySelector('.flex.justify-between span:first-child');
                        if (likesSpan) likesSpan.innerHTML = `<i class="fas fa-heart ml-1"></i> ${result.newLikes} إعجاب`;
                    }

                    if (result.action === 'liked') {
                        likeIcon.classList.remove('far', 'text-gray-400');
                        likeIcon.classList.add('fas', 'text-red-500');
                        buttonElement.classList.remove('text-gray-400');
                        buttonElement.classList.add('text-red-500');
                        buttonElement.dataset.isLiked = 'true';
                    } else {
                        likeIcon.classList.remove('fas', 'text-red-500');
                        likeIcon.classList.add('far', 'text-gray-400');
                        buttonElement.classList.remove('text-red-500');
                        buttonElement.classList.add('text-gray-400');
                        buttonElement.dataset.isLiked = 'false';
                    }
                    
                } else {
                    console.error('Like failed:', result.error);
                }

            } catch (error) {
                console.error('Error during like operation:', error);
            } finally {
                buttonElement.disabled = false;
            }
        }

        // ******************** 7. وظائف التعليقات ********************

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"'`=\/]/g, function (s) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;", "/":"&#x2F;", "`":"&#x60;", "=":"&#x3D;"}[s]);
            });
        }

        function createCommentHtml(comment) {
            const commentDate = new Date(comment.timestamp).toLocaleString('ar-EG', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            // verified placeholder next to username (uses comment.userId)
            const verifiedPlaceholder = `<span class="verified-placeholder" data-user-id="${comment.userId || comment.user?.id || ''}"></span>`;

            return `
                <div class="comment-item" data-comment-id="${comment.commentId || comment.id || ''}">

                              ${verifiedPlaceholder}
                            </div>
                            <div class="comment-time">${commentDate}</div>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.content)}</div>
                    </div>
                </div>
            `;
        }

            commentsList.innerHTML = '<div class="text-center text-gray-500 p-4">جاري تحميل التعليقات...</div>';

            try {

                    } else {
                        result.comments.forEach(comment => {
                            commentsList.innerHTML += createCommentHtml(comment);
                        });
                        commentsList.scrollTop = commentsList.scrollHeight;
                        // Update verified badges for commenters
                        updateVerifiedBadges();
                    }
                } else {
                    commentError.textContent = result.error || 'فشل في جلب التعليقات.';
                    commentError.classList.remove('hidden');
                    commentsList.innerHTML = '';
                }

            } catch (error) {
                commentError.textContent = 'حدث خطأ في الاتصال بالخادم.';
                commentError.classList.remove('hidden');
                commentsList.innerHTML = '';
            }
        }
        
        async function postComment() {
            const content = newCommentInput.value.trim();
            if (!content || !currentPostIdForComments) return;

            postCommentBtn.disabled = true;
            postCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            commentError.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdForComments}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    if (commentsList.querySelector('.text-center.text-gray-500')) {
                        commentsList.innerHTML = '';
                    }
                    // append and then refresh verified badges
                    commentsList.innerHTML += createCommentHtml(result.comment);
                    newCommentInput.value = '';
                    updateVerifiedBadges();

                    const postCard = document.querySelector(`div[data-post-id="${currentPostIdForComments}"]`);
                    if (postCard) {
                        const commentsSpan = postCard.querySelector('.flex.justify-between span:last-child');
                        if (commentsSpan) commentsSpan.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${result.newComments} تعليق`;
                    }
                    
                    commentsList.scrollTop = commentsList.scrollHeight;

                } else {
                    commentError.textContent = result.error || 'فشل في إضافة التعليق.';
                    commentError.classList.remove('hidden');
                }

            } catch (error) {
                commentError.textContent = 'فشل الاتصال بالخادم.';
                commentError.classList.remove('hidden');
            } finally {
                postCommentBtn.disabled = false;
                postCommentBtn.innerHTML = 'نشر';
            }
        }
        
        postCommentBtn.addEventListener('click', postComment);
        newCommentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                postComment();
            }
        });
        
        // ---------------- VERIFIED BADGES HELPERS ----------------
        // Replace .verified-placeholder[data-user-id] with the badge image when profile.is_verified === true
        async function updateVerifiedBadges() {
            const placeholders = Array.from(document.querySelectorAll('.verified-placeholder'));
            if (placeholders.length === 0) return;
            // dedupe
            const ids = [...new Set(placeholders.map(p => p.dataset.userId).filter(Boolean))];
            await Promise.all(ids.map(async uid => {
                try {
                    const res = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`);
                    if (!res.ok) {
                        // remove placeholders if can't fetch
                        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
                        return;
                    }
                    const data = await res.json();
                    if (data && data.is_verified) {
                        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => {
                            const img = document.createElement('img');
                            img.src = VERIFIED_IMG_URL;
                            img.alt = 'موثق';
                            img.title = 'موثق';
                            img.className = 'verified-badge-img';
                            ph.replaceWith(img);
                        });
                    } else {
                        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
                    }
                } catch (e) {
                    document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
                }
            }));
        }

        // Populate a simplified preview of the post inside the comment modal
        function populatePostPreviewForComments(postId) {
            const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
            if (!postCard) {
                commentPostPreview.innerHTML = '<div class="text-center text-gray-500 p-4">لا يمكن عرض معاينة المنشور.</div>';
                return;
            }

            // clone to avoid manipulating the original
            const clone = postCard.cloneNode(true);

            // remove interactive elements that may conflict (ids, buttons, audio/video controls)
            // remove post menu button
            clone.querySelectorAll('.post-menu-button').forEach(n => n.remove());
            // remove like/comment buttons area at bottom (optional)
            clone.querySelectorAll('.post-like-button').forEach(n => n.remove());
            clone.querySelectorAll('button[onclick^="handleComment"]').forEach(n => n.remove());
            // remove audio play buttons & waveform to avoid conflicting players
            clone.querySelectorAll('.audio-play-button, .waveform-post').forEach(n => n.remove());

            // For any <video> elements, replace with their poster image (so it doesn't auto-play)
            clone.querySelectorAll('video').forEach(v => {
                const poster = v.getAttribute('poster') || '';
                const src = v.getAttribute('src') || '';
                // try to use poster if available, otherwise show a placeholder with a click to open media viewer
                if (poster) {
                    const img = document.createElement('img');
                    img.src = poster;
                    img.alt = 'video preview';
                    img.className = 'w-full max-h-64 object-cover rounded-lg cursor-pointer';
                    img.onclick = (e) => openMediaViewer(src, 'video', e);
                    v.replaceWith(img);
                } else {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'w-full max-h-64 bg-black rounded-lg flex items-center justify-center';
                    wrapper.innerHTML = `<i class="fas fa-video text-4xl text-white"></i>`;
                    v.replaceWith(wrapper);
                }
            });

            // Remove any element ids to avoid duplicates in DOM
            clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));

            commentPostPreview.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'p-0';
            container.appendChild(clone);
            commentPostPreview.appendChild(container);

            // Trigger verified badge update for post owner inside preview
            updateVerifiedBadges();
        }

        // ******************** Initialization ********************
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile')
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    const profilePicElement = document.getElementById('userProfilePic');
                    const meDot = document.getElementById('meOnlineDot');
                    if (data && data.profile_picture_url) {
                        profilePicElement.src = data.profile_picture_url;
                        profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                        currentUserId = data.id;
                        if (data.is_online) meDot.style.display = 'inline-block';
                        else meDot.style.display = 'none';
                    }
                }).catch(console.error);
                
            fetchAndDisplayPosts();
        });

        // Make profile links (username/avatar) clickable open profile (handled via hrefs already)
        // ---------------- Notifications + Messages: SSE badge (فوري) ----------------

        (function setupNotifSSE() {
          if (!window.EventSource) return;
          // Create EventSource to SSE endpoint
          const es = new EventSource('/api/notifications/stream', { withCredentials: true });

          es.addEventListener('notifications', (e) => {
            try {
              const payload = JSON.parse(e.data);
              const unread = payload.unread_count || 0;
              const unreadMessages = payload.unread_messages_count || 0;
              const pendingFR = payload.pending_friend_requests_count || 0;

              const notifBadgeEl = document.getElementById('notifBadge');
              if (unread > 0) {
                notifBadgeEl.style.display = 'inline-flex';
                notifBadgeEl.textContent = unread > 99 ? '99+' : String(unread);
              } else {
                notifBadgeEl.style.display = 'none';
              }

              const msgBadgeEl = document.getElementById('msgBadge');
              if (unreadMessages > 0) {
                msgBadgeEl.style.display = 'inline-flex';
                msgBadgeEl.textContent = unreadMessages > 99 ? '99+' : String(unreadMessages);
              } else {
                msgBadgeEl.style.display = 'none';
              }

              const frBadgeEl = document.getElementById('friendReqBadge');
              if (pendingFR > 0) {
                frBadgeEl.style.display = 'inline-flex';
                frBadgeEl.textContent = pendingFR > 99 ? '99+' : String(pendingFR);
              } else {
                frBadgeEl.style.display = 'none';
              }

            } catch (err) {
              console.error('Failed to parse notifications SSE data', err);
            }
          });

          es.addEventListener('error', (err) => {
            console.warn('Notifications SSE error', err);
            // EventSource will auto-reconnect; nothing else needed here
          });
        })();

        // Fallback initial unread counts (in case SSE connects slowly)
        (function initUnreadCounts() {
          // notifications unread
          fetch('/api/notifications/unread_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const badge = document.getElementById('notifBadge');
                if (d.unread_count > 0) {
                  badge.style.display = 'inline-flex';
                  badge.textContent = d.unread_count > 99 ? '99+' : String(d.unread_count);
                }
              }
            }).catch(()=>{});

          // chats unread total
          fetch('/api/chats', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok && Array.isArray(d.chats)) {
                const totalUnread = d.chats.reduce((acc, c) => acc + (c.unread_count || 0), 0);
                const msgBadge = document.getElementById('msgBadge');
                if (totalUnread > 0) {
                  msgBadge.style.display = 'inline-flex';
                  msgBadge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
                }
              }
            }).catch(()=>{});

          // friend requests count
          fetch('/api/friends/requests_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const fr = document.getElementById('friendReqBadge');
                if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); }
              }
            }).catch(()=>{});
        })();

        // ---------------- Active Status Heartbeat (NEW) ----------------
        function sendHeartbeat() {
            fetch('/api/status/heartbeat', { method: 'POST' })
                .then(r => r.json())
                .catch(err => console.error('Heartbeat failed', err));
        }

        // تشغيل النبض عند تحميل الصفحة
        sendHeartbeat();

        // تكرار النبض كل دقيقة (60000 ميلي ثانية) للحفاظ على الحالة "متصل"
        setInterval(sendHeartbeat, 60000);

        // تفعيل تحديث شارات التوثيق عند ظهور الصفحة
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                updateVerifiedBadges();
            }
        });

    </script>
</body>
