<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        /* Family section */
        .families-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .families-row::-webkit-scrollbar { height: 8px; }
        .families-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 8px; }

        .create-family-card {
            min-width: 220px;
            max-width: 220px;
            height: 110px;
            border-radius: 14px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .create-family-card .overlay {
            position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.5));
        }
        .create-family-card .label {
            position: relative; z-index: 2; text-align: center;
        }

        .family-card {
            min-width: 160px;
            max-width: 160px;
            height: 110px;
            border-radius: 12px;
            background: rgba(20,20,20,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 10px;
            padding: 10px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .family-card img {
            width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
        }
        .family-card .meta {
            flex: 1; overflow: hidden;
        }
        .family-card .meta .name {
            font-weight: 700; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
        }
        .family-card .meta .count {
            font-size: 12px; color: #9ca3af; margin-top: 6px;
        }

        /* --- Reels Tray CSS (NEW) --- */
        .reels-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 0;
            margin: 10px 0;
            -webkit-overflow-scrolling: touch;
        }
        .reels-scroll-container::-webkit-scrollbar { display: none; } /* Hide scrollbar for cleaner look */
        
        .reel-card-item {
            min-width: 110px;
            max-width: 110px;
            height: 190px;
            border-radius: 12px;
            background: #111;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        .reel-card-item:active { transform: scale(0.97); }
        .reel-card-item video {
            width: 100%; height: 100%; object-fit: cover;
            pointer-events: none; /* Prevent controls */
        }
        .reel-card-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 50%;
        }
        .reel-user-avatar {
            position: absolute; top: 8px; left: 8px;
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 1px solid white;
            z-index: 10;
        }
        /* --------------------------- */

        /* تنسيقات نافذة التعليقات (Bottom Sheet) */
        .glass-comment-modal-content {
            background-color: #18191a;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            top: auto; 
            height: 75vh;
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
        }

        .glass-comment-modal-content.open {
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .glass-comment-modal-content {
                position: relative;
                height: 80vh;
                max-width: 500px;
                margin: 0 auto;
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                transform: scale(0.95);
                opacity: 0;
                transition: all 0.2s ease-out;
            }
            .glass-comment-modal-content.open {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin: 12px auto 8px auto;
        }
        
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .close-btn-circle {
            background: rgba(255,255,255,0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            cursor: pointer;
        }
        .close-btn-circle:hover {
            background: rgba(255,255,255,0.2);
        }

        .media-container {
            max-height: 80vh; 
            width: auto;
        }
        
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Waveform: make fully black background and initial strip white.
           On play we switch the unplayed wave to gray and keep the white progress moving. */
        .waveform-post {
            height: 60px; 
            background: #000000; /* fully black */
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.04);
            overflow: hidden;
        }

        /* Ensure audio play button doesn't turn blue on hover */
        .audio-play-button:hover {
            color: #e5e7eb !important; /* muted light color */
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .modal-animate-in {
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .create-option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .create-option-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* Badges */
        #notifBadge, #msgBadge, #friendReqBadge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444;
          color: #fff;
          font-size: 12px;
          font-weight: 700;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

        .avatar-with-dot { 
          position: relative; 
          display: inline-flex; 
        }

        .online-dot {
          position: absolute;
          bottom: 2px;
          right: 2px;
          width: 12px;
          height: 12px;
          background: #22c55e;
          border: 2px solid #000;
          border-radius: 999px;
          box-shadow: 0 0 6px rgba(34,197,94,0.6);
          z-index: 10;
        }

        .online-dot-small {
          width: 10px;
          height: 10px;
          bottom: 1px;
          right: 1px;
          border-width: 1.5px;
        }

        /* VERIFIED BADGE */
        .verified-badge-img {
          display: inline-block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          margin-right: 4px;
          margin-left: 2px;
          object-fit: cover;
          vertical-align: middle;
        }

        /* Comments UI tweaks */
        .comment-item { padding: 8px; border-radius: 12px; background: #131313; border: 1px solid #222; }
        .comment-actions button { font-size: 12px; }
        .reply-item { margin-right: 40px; margin-top: 6px; background: #0f1416; padding: 6px; border-radius: 10px; border: 1px solid #222; }
        .small-avatar { width: 28px; height: 28px; border-radius: 999px; }
        .like-count { font-weight: 700; color: #9ca3af; font-size: 12px; }
        /* شارة التحقق داخل التعليقات في الهوم */
        .badge-container .verified-badge-img,
        .comment-item .verified-badge-img {
          width: 12px;
          height: 12px;
          margin-left: 6px;
          vertical-align: middle;
        }

        /* Post options bottom sheet */
        #postOptionsModal .sheet {
          background: #0b0b0c;
          border-radius: 14px 14px 0 0;
          padding: 12px;
          border: 1px solid rgba(255,255,255,0.06);
        }
        .option-btn {
          display:flex;
          align-items:center;
          justify-content:center;
          gap:10px;
          padding:12px;
          border-radius:10px;
          width:100%;
          background: rgba(255,255,255,0.02);
          color:#e6eefb;
          border:1px solid rgba(255,255,255,0.03);
          cursor:pointer;
        }
        .option-btn.danger { background: linear-gradient(90deg,#7f1d1d, #ef4444); color:white; border:none; }
        .option-btn:active { transform: translateY(1px); }
        .option-row { display:flex; gap:10px; margin-bottom:10px; }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
            <div class="flex items-center">
                <button id="profileMenuButton" class="relative block" onclick="toggleProfileDropdown(event)">
                    <span class="avatar-with-dot">
                      <img id="userProfilePic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300 cursor-pointer">
                      <span id="meOnlineDot" class="online-dot" style="display:none;"></span>
                    </span>
                </button>
            </div>
            
            <div class="flex-grow flex justify-center">
                <a href="/chat_list" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300 app-logo">
                    Aite
                </a>
            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="relative">
                    <button id="createBtn" class="bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center border border-gray-700" onclick="toggleCreateModal()">
                        <i class="fas fa-plus ml-2"></i>
                        إنشاء
                    </button>
                </div>
            </div>

            <div id="profileDropdown" class="absolute top-14 right-0 mt-2 w-48 rounded-lg shadow-xl glass-dropdown hidden">
                <a href="/profile" class="flex items-center px-4 py-3 text-white hover:bg-white/10 rounded-t-lg transition duration-200">
                    <i class="fas fa-user-circle text-xl ml-3"></i>
                    الملف الشخصي
                </a>
                <a href="/logout" class="flex items-center px-4 py-3 text-red-400 hover:bg-white/10 rounded-b-lg transition duration-200 border-t border-gray-700">
                    <i class="fas fa-sign-out-alt text-xl ml-3"></i>
                    تسجيل الخروج
                </a>
            </div>

        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="familiesWrapper" class="max-w-xl mx-auto mt-4">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-white font-bold">العائلات</h2>
                <a href="/create-family" class="text-sm text-gray-400 hover:text-white">إنشاء عائلة جديدة</a>
            </div>
            <div id="familiesRow" class="families-row">
                </div>
        </div>

        <div id="postsFeed" class="max-w-xl mx-auto mt-6 space-y-4">
        </div>
    </main>
    
    <div class="fixed bottom-0 left-0 right-0 z-50 glass-bottom-navbar">
        <nav class="flex justify-around items-center max-w-lg mx-auto h-14 relative">
            <a href="/chat_list" class="flex flex-col items-center justify-center p-2 text-blue-400">
                <i class="fas fa-home text-xl"></i>
            </a>
            <a id="messagesBtn" href="/users_list" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
                <i class="fas fa-comment-dots text-xl"></i>
                <span id="msgBadge" style="display:none">0</span>
            </a>
            <a href="/reels" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-clapperboard text-xl"></i>
            </a>
            <a id="notifBtn" href="/notifications" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
                <i class="fas fa-bell text-xl"></i>
                <span id="notifBadge" style="display:none">0</span>
            </a>
            <a id="usersBtn" href="/all_users" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
                <i class="fas fa-users text-xl"></i>
                <span id="friendReqBadge" style="display:none">0</span>
            </a>
        </nav>
    </div>

    <div id="familyJoinModal" class="hidden fixed inset-0 z-60 flex items-center justify-center p-4 glass-modal-bg" onclick="closeJoinModal(event)">
      <div class="bg-[#0f1724] max-w-md w-full rounded-xl p-6 border border-gray-700" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-white">الانضمام إلى العائلة</h3>
          <button class="text-gray-400 hover:text-white" onclick="closeJoinModal(event)"><i class="fas fa-times"></i></button>
        </div>
        <p id="familyJoinIntro" class="text-sm text-gray-300 mb-3">أدخل رمز العائلة للانضمام.</p>
        <input id="familyJoinInput" class="w-full p-3 rounded-lg bg-[#081019] border border-gray-700 text-white mb-3" placeholder="رمز العائلة" />
        <div id="familyJoinError" class="text-red-400 text-sm mb-2 hidden"></div>
        <div class="flex gap-3">
          <button id="familyJoinConfirmBtn" class="flex-1 p-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-white" onclick="confirmJoinFamily()">انضم الآن</button>
          <button class="flex-1 p-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-white" onclick="closeJoinModal(event)">إلغاء</button>
        </div>
      </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg">
        <div class="bg-[#1f2937] p-6 rounded-xl shadow-2xl max-w-sm w-full border border-gray-700 text-center" onclick="event.stopPropagation()">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-gray-400 mb-6">هل أنت متأكد أنك تريد حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء.</p>
            <div class="flex justify-around space-x-4 space-x-reverse">
                <button id="cancelDeleteBtn" class="p-2 w-full bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition duration-300">إلغاء</button>
                <button id="confirmDeleteBtn" class="p-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-300">تأكيد الحذف</button>
            </div>
            <div id="deleteMessage" class="text-red-500 mt-3 hidden"></div>
        </div>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="media-container flex items-center justify-center" onclick="event.stopPropagation()">
        </div>
    </div>
    
    <div id="commentModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center glass-modal-bg transition-opacity duration-300">
        <div id="commentModalContent" class="glass-comment-modal-content w-full md:w-auto" onclick="event.stopPropagation()">
            
            <div class="md:hidden w-full flex justify-center" onclick="closeCommentModal()">
                <div class="modal-handle"></div>
            </div>

            <div class="flex justify-between items-center px-4 pb-2 pt-2 border-b border-gray-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    التعليقات 
                    <span id="commentCountBadge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full text-gray-300">0</span>
                </h3>
                <button id="closeCommentModalBtn" class="close-btn-circle text-gray-300 hover:text-white" onclick="closeCommentModal()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            
            <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar bg-[#18191a] min-h-0">
                </div>

            <div class="p-3 border-t border-gray-800 bg-[#18191a]">
                <div id="commentError" class="text-red-500 text-xs text-center mb-2 hidden"></div>
                <div class="flex items-center gap-2 bg-[#242526] p-1.5 rounded-3xl border border-gray-700">
                    <img id="myCurrentAvatar" src="" class="w-8 h-8 rounded-full object-cover border border-gray-600 ml-1">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." 
                           class="flex-grow bg-transparent text-white text-sm px-2 focus:outline-none" 
                           dir="rtl" autocomplete="off">
                    <button id="postCommentBtn" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition w-9 h-9 flex items-center justify-center flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-arrow-up text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="postOptionsModal" class="hidden fixed inset-0 z-[80] flex items-end justify-center glass-modal-bg" onclick="closePostOptionsModal()">
      <div class="sheet w-full md:max-w-md" onclick="event.stopPropagation()">
        <div class="modal-handle" style="margin-bottom:8px;"></div>
        <div class="p-3">
          <div id="postOptionsMessage" class="text-sm text-gray-300 mb-2 hidden"></div>
          <div class="option-row">
            <button id="postOptionsDeleteBtn" class="option-btn danger" onclick="confirmDeleteFromOptions(event)">
              <i class="fas fa-trash"></i>
              <span>حذف المنشور</span>
            </button>
          </div>
          <div class="option-row">
            <button id="postOptionsAddFriendBtn" class="option-btn" onclick="addFriendFromOptions(event)">
              <i class="fas fa-user-plus"></i>
              <span>إضافة صديق</span>
            </button>
          </div>
          <div class="option-row">
            <button id="postOptionsCloseBtn" class="option-btn" onclick="closePostOptionsModal()">
              <i class="fas fa-times"></i>
              <span>إلغاء</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div id="postMenu" class="absolute z-40 bg-[#242526] rounded-lg shadow-xl border border-gray-700 hidden w-40">
        <button id="deleteOptionBtn" class="flex items-center w-full p-3 text-red-400 hover:bg-[#343536] rounded-lg transition duration-300">
            <i class="fas fa-trash ml-3"></i>
            حذف المنشور
        </button>
    </div>

    <div id="createModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 glass-modal-bg">
        <div class="glass-comment-modal-content p-8 rounded-3xl shadow-2xl max-w-sm w-full modal-animate-in border border-white/20" style="position: relative; height: auto; transform: none; background-color: rgba(30,30,30,0.9);" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-bold text-white">ماذا تريد أن تنشر؟</h3>
                <button onclick="toggleCreateModal()" class="text-gray-400 hover:text-white transition text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <a href="/create-post" class="create-option-card flex items-center p-5 rounded-2xl group">
                    <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center ml-4 group-hover:bg-blue-500/40 transition">

    <script>
        let currentPostIdToDelete = null;
        let currentUserId = null; 
        let activeWaveSurfer = null; 
        let activeVideo = null; 
        let currentPostIdForComments = null;

        // For options bottom sheet
        let currentOptionsPostId = null;
        let currentOptionsUserId = null;

        // For family join
        let joiningFamilyId = null;

        // For comments SSE (التعليقات الفورية)
        let commentsEventSource = null;

        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';
        const CREATE_FAMILY_BG = 'https://plus.unsplash.com/premium_vector-1682298522309-88e4dc1ccc4d?q=80&w=1125&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D';

        const postsFeed = document.getElementById('postsFeed');
        const familiesRow = document.getElementById('familiesRow');
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteMessage = document.getElementById('deleteMessage');
        const postMenu = document.getElementById('postMenu');
        const deleteOptionBtn = document.getElementById('deleteOptionBtn');

        const postOptionsModal = document.getElementById('postOptionsModal');
        const postOptionsDeleteBtn = document.getElementById('postOptionsDeleteBtn');
        const postOptionsAddFriendBtn = document.getElementById('postOptionsAddFriendBtn');
        const postOptionsCloseBtn = document.getElementById('postOptionsCloseBtn');
        const postOptionsMessage = document.getElementById('postOptionsMessage');

        // family elements
        const familyJoinModal = document.getElementById('familyJoinModal');
        const familyJoinInput = document.getElementById('familyJoinInput');
        const familyJoinError = document.getElementById('familyJoinError');
        const familyJoinConfirmBtn = document.getElementById('familyJoinConfirmBtn');
        const familyJoinIntro = document.getElementById('familyJoinIntro');

        function toggleProfileDropdown(event) {
            event.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        }

        function closeProfileDropdownOnClickOutside(event) {
            if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        }

        document.addEventListener('click', closeProfileDropdownOnClickOutside);

        const createModalEl = document.getElementById('createModal');

        function toggleCreateModal() {
            createModalEl.classList.toggle('hidden');
            if (!createModalEl.classList.contains('hidden')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        createModalEl.addEventListener('click', (e) => {
            if (e.target === createModalEl) {
                toggleCreateModal();
            }
        });
        
        function openMediaViewer(url, type, event) {
            event.stopPropagation();
            if (type === 'audio' || type === 'video') return;

            let mediaElement;
            mediaViewerContent.innerHTML = '';
            
            if (type === 'image') {
                mediaElement = `<img src="${url}" alt="Media Viewer" class="max-w-full max-h-full object-contain rounded-lg">`;
            } else {
                return;
            }

            mediaViewerContent.innerHTML = mediaElement;
            mediaViewerModal.classList.remove('hidden');
        }

        function closeMediaViewer(event) {
            if (event.target.id === 'mediaViewerModal' || event.target.closest('.fa-times')) {
                const activeMedia = mediaViewerContent.querySelector('video, audio');
                if (activeMedia) {
                    activeMedia.pause();
                }
                mediaViewerModal.classList.add('hidden');
                mediaViewerContent.innerHTML = '';
            }
        }

        function openDeleteModal(postId, event) {
            event.stopPropagation();
            currentPostIdToDelete = postId;
            deleteMessage.classList.add('hidden');
            deleteModal.classList.remove('hidden');
            postMenu.classList.add('hidden');
        }

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            currentPostIdToDelete = null;
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentPostIdToDelete) return;

            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحذف';
            deleteMessage.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdToDelete}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    const el = document.querySelector(`div[data-post-id="${currentPostIdToDelete}"]`);
                    if (el) el.remove();
                    deleteModal.classList.add('hidden');
                } else {
                    deleteMessage.textContent = result.error || 'فشل الحذف.';
                    deleteMessage.classList.remove('hidden');
                }
            } catch (error) {
                deleteMessage.textContent = 'حدث خطأ في الاتصال بالخادم.';
                deleteMessage.classList.remove('hidden');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.innerHTML = 'تأكيد الحذف';
                currentPostIdToDelete = null;
            }
        });

        // Replaced togglePostMenu with bottom sheet opener
        function togglePostMenu(postId, userId, event, menuButton) {
            event.stopPropagation();
            openPostOptionsModal(postId, userId);
        }

        // Open bottom sheet with appropriate options
        function openPostOptionsModal(postId, userId) {
            currentOptionsPostId = postId;
            currentOptionsUserId = userId;
            postOptionsMessage.classList.add('hidden');
            // If owner -> show delete, hide add-friend
            if (currentUserId && userId === currentUserId) {
                postOptionsDeleteBtn.style.display = 'flex';
                postOptionsAddFriendBtn.style.display = 'none';
            } else {
                postOptionsDeleteBtn.style.display = 'none';
                postOptionsAddFriendBtn.style.display = 'flex';
            }

            postOptionsModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePostOptionsModal() {
            postOptionsModal.classList.add('hidden');
            postOptionsMessage.classList.add('hidden');
            document.body.style.overflow = 'auto';
            currentOptionsPostId = null;
            currentOptionsUserId = null;
        }

        // Called when user taps delete inside bottom sheet
        function confirmDeleteFromOptions(e) {
            e.stopPropagation();
            if (!currentOptionsPostId) return;
            // reuse existing delete modal logic
            openDeleteModal(currentOptionsPostId, e);
            closePostOptionsModal();
        }

        // Add friend from bottom sheet
        async function addFriendFromOptions(e) {
            e.stopPropagation();
            if (!currentOptionsUserId) return;
            postOptionsAddFriendBtn.disabled = true;
            postOptionsMessage.classList.add('hidden');

            try {
                const res = await fetch('/api/friends/request', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to_id: currentOptionsUserId })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    postOptionsMessage.textContent = 'تم إرسال طلب الصداقة.';
                    postOptionsMessage.classList.remove('hidden');
                    // update friend requests badge by re-fetching count
                    fetch('/api/friends/requests_count', { credentials: 'same-origin' })
                      .then(r => r.ok ? r.json() : null)
                      .then(d => {
                        if (d && d.ok) {
                          const fr = document.getElementById('friendReqBadge');
                          if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); }
                        }
                      }).catch(()=>{});
                    // Optionally hide add button or give visual feedback
                    postOptionsAddFriendBtn.style.display = 'none';
                } else {
                    const err = data && data.error ? data.error : 'فشل إرسال الطلب';
                    postOptionsMessage.textContent = err;
                    postOptionsMessage.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                postOptionsMessage.textContent = 'خطأ في الاتصال.';
                postOptionsMessage.classList.remove('hidden');
            } finally {
                postOptionsAddFriendBtn.disabled = false;
            }
        }

        document.addEventListener('click', (event) => {
            if (!postMenu.contains(event.target) && !event.target.closest('.post-menu-button')) {
                postMenu.classList.add('hidden');
                deleteModal.classList.add('hidden'); 
            }
        });

        function setWSColors(ws, waveColor, progressColor) {
            try {
                if (typeof ws.setWaveColor === 'function') ws.setWaveColor(waveColor);
                else if (ws.drawer && typeof ws.drawer.setWaveColor === 'function') ws.drawer.setWaveColor(waveColor);
            } catch (e) {}
            try {
                if (typeof ws.setProgressColor === 'function') ws.setProgressColor(progressColor);
                else if (ws.drawer && typeof ws.drawer.setProgressColor === 'function') ws.drawer.setProgressColor(progressColor);
            } catch (e) {}
        }

        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if (!container) return;

            // default: show a white strip on black background (idle state)
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#ffffff',      // initial strip: white (idle)
                progressColor: '#ffffff',  // progress will also be white (we'll update colors on play)
                cursorColor: 'transparent',
                barWidth: 3,
                barRadius: 3,
                barGap: 1,
                height: 60,
                responsive: true,
                mediaControls: false,
            });

            ws.load(url);

            const playButton = container.closest('.glass-post-card').querySelector('.audio-play-button');
            if (playButton) {
                playButton.onclick = () => {
                    // ensure only one audio/wave is active
                    if (activeWaveSurfer && activeWaveSurfer !== ws) {
                        try { activeWaveSurfer.pause(); } catch(e){}
                        const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                        if (otherPostCard) {
                            const pb = otherPostCard.querySelector('.audio-play-button i');
                            if (pb) { pb.classList.remove('fa-pause'); pb.classList.add('fa-play'); }
                        }
                    }
                    if (activeVideo) {
                        const activePostId = activeVideo.id.split('-')[1];
                        const controlIcon = document.getElementById(`control-icon-${activePostId}`);
                        const playOverlay = document.getElementById(`play-overlay-${activePostId}`);
                        activeVideo.pause();
                        if (controlIcon) {
                            controlIcon.classList.remove('fa-pause');
                            controlIcon.classList.add('fa-play');
                        }
                        if (playOverlay) playOverlay.classList.remove('hidden');
                        activeVideo = null;
                    }
                    
                    if (ws.isPlaying()) {
                        ws.pause();
                        playButton.querySelector('i').classList.remove('fa-pause');
                        playButton.querySelector('i').classList.add('fa-play');
                    } else {
                        ws.play();
                        playButton.querySelector('i').classList.remove('fa-play');
                        playButton.querySelector('i').classList.add('fa-pause');
                        activeWaveSurfer = ws;
                    }
                };

                // when play starts -> change unplayed wave to gray so white progress is visible
                ws.on('play', () => {
                    setWSColors(ws, '#6b7280' /* gray for unplayed */, '#ffffff' /* white progress */);
                });

                // when paused or finished -> revert to white strip idle style
                const revertToIdle = () => {
                    setWSColors(ws, '#ffffff', '#ffffff');
                    if (playButton) {
                        playButton.querySelector('i').classList.remove('fa-pause');
                        playButton.querySelector('i').classList.add('fa-play');
                    }
                    if (activeWaveSurfer === ws) activeWaveSurfer = null;
                };
                ws.on('pause', revertToIdle);
                ws.on('finish', () => {
                    revertToIdle();
                    try { ws.seekTo(0); } catch(e) {}
                });
            }
        }
        
        function toggleVideoPlay(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            const controlsBar = document.getElementById(`controls-bar-${postId}`);

            if (!video) return;

            if (activeVideo && activeVideo !== video) {
                const activePostId = activeVideo.id.split('-')[1];
                const activeControlIcon = document.getElementById(`control-icon-${activePostId}`);
                const activePlayOverlay = document.getElementById(`play-overlay-${activePostId}`);
                activeVideo.pause();
                if (activeControlIcon) {
                    activeControlIcon.classList.remove('fa-pause');
                    activeControlIcon.classList.add('fa-play');
                }
                if (activePlayOverlay) activePlayOverlay.classList.remove('hidden');
                
                activeVideo.removeEventListener('timeupdate', updateVideoProgress);
                activeVideo.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
                activeVideo.removeEventListener('ended', handleVideoEnd);
            }
            if (activeWaveSurfer) {
                activeWaveSurfer.pause();
                const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                if (otherPostCard) {
                    const apb = otherPostCard.querySelector('.audio-play-button i');
                    if (apb) { apb.classList.remove('fa-pause'); apb.classList.add('fa-play'); }
                }
                activeWaveSurfer = null;
            }
            
            if (video.paused) {
                video.play();
                playOverlay.classList.add('hidden'); 
                if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
                if (controlsBar) controlsBar.classList.remove('opacity-0'); 
                activeVideo = video;
                
                video.addEventListener('timeupdate', updateVideoProgress);
                video.addEventListener('loadedmetadata', updateVideoTimeDisplay);
                video.addEventListener('ended', handleVideoEnd);

            } else {
                video.pause();
                playOverlay.classList.remove('hidden'); 
                if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
                activeVideo = null;
            }
        }

        function updateVideoProgress(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const progressBar = document.getElementById(`progress-bar-${postId}`);
            const timeDisplay = document.getElementById(`time-display-${postId}`);

            if (!video.duration || !progressBar || !timeDisplay) return;

            const percent = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        }

        function updateVideoTimeDisplay(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const timeDisplay = document.getElementById(`time-display-${postId}`);

            if (timeDisplay && video.duration) {
                timeDisplay.textContent = `0:00 / ${formatVideoTime(video.duration)}`;
            }
        }
        
        function handleVideoEnd(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            
            video.currentTime = 0;
            if (playOverlay) playOverlay.classList.remove('hidden'); 
            if (controlIcon) controlIcon.classList.remove('fa-pause'), controlIcon.classList.add('fa-play');
            activeVideo = null;
            
            video.removeEventListener('timeupdate', updateVideoProgress);
            video.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
            video.removeEventListener('ended', handleVideoEnd);
        }

        function formatVideoTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function createPostCard(post) {
            let mediaContent = '';
            
            if (post.media) {
                if (post.media.type === 'image') {
                    mediaContent = `

                    `;
                } else if (post.media.type === 'video') {
                     mediaContent = `
                        <div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group">
                            <video id="video-${post.postId}" src="${post.media.url}" 
                                   class="w-full h-full object-contain" 
                                   poster="https://via.placeholder.com/600x400?text=Video+Loading" 
                                   preload="metadata"
                                   onclick="toggleVideoPlay('${post.postId}', event)">
                            </video>
                            
                            <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 transition-opacity duration-300 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)">
                                <i class="fas fa-play text-white text-5xl opacity-80 transition-transform duration-300 transform scale-100 group-hover:scale-110"></i>
                            </div>

                            <div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center space-x-3 space-x-reverse opacity-0 transition-opacity duration-300 group-hover:opacity-100">
                                
                                <button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                                    <i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i>
                                </button>
                                
                                <div class="flex-grow h-1 bg-gray-500 rounded-full cursor-pointer relative" onclick="seekVideo('${post.postId}', event)">
                                    <div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div>
                                </div>
                                
                                <span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span>
                                
                                <button onclick="toggleFullscreen('${post.postId}', event)" class="text-white hover:text-blue-400 transition">

                        </div>
                    `;
                } else if (post.media.type === 'audio') {
                    mediaContent = `

                                <i class="fas fa-play"></i>
                            </button>
                            <div id="waveform-${post.postId}" class="waveform-post flex-grow"></div>
                        </div>
                    `;
                }
            }

            const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
            const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';
            const onlineDotHtml = post.user && post.user.is_online ? `<span class="online-dot online_dot_small" title="متصل الآن"></span>` : '';
            const verifiedBadgeHtml = post.user && post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="موثق" title="موثق">` : '';

            // Show post-menu (three dots) only for click target - always render button but it will open bottom sheet
            const menuButtonHtml = `
                <button class="text-gray-400 hover:text-white transition duration-300 post-menu-button" 
                        onclick="togglePostMenu('${post.postId}', '${post.userId}', event, this)">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            `;

            return `
                <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center">
                            <a href="/profile?userId=${post.userId}" class="avatar-with-dot">
                                <img src="${post.user.profile_picture_url}" alt="${post.user.username}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600 hover:ring-2 hover:ring-blue-400 transition duration-300">
                                ${onlineDotHtml}
                            </a>
                            <div>
                                 <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">${post.user.username} ${verifiedBadgeHtml}</a>
                                <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
                            </div>
                        </div>
                        ${menuButtonHtml}
                    </div>

                    <p class="text-gray-200 whitespace-pre-wrap">${post.content}</p>

                    ${mediaContent}

                    <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                        <span><i class="fas fa-heart ml-1"></i> ${post.likes} إعجاب</span>
                        <span class="cursor-pointer hover:text-blue-400 comment-count-display" onclick="handleComment('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                    </div>

                    <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
                        <button class="flex items-center ${likeButtonClass} hover:text-red-500 transition duration-300 w-full justify-center post-like-button gap-2" 
                                data-is-liked="${post.is_liked}" 
                                onclick="handleLike('${post.postId}', this)">
                            <i class="${likeIconClass} ml-2 like-icon text-lg"></i>
                            <span class="text-sm font-medium">إعجاب</span>
                        </button>
                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center gap-2" onclick="handleComment('${post.postId}')">
                            <i class="fas fa-comment-dots text-lg"></i>
                            <span class="text-sm font-medium">تعليق</span>

        // Helper to update comment count shown on post card and in modal badge
        function updatePostCommentCount(postId, count) {
            // update count in post card (feed)
            const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
            if (postCard) {
                const commentSpan = postCard.querySelector('.comment-count-display');
                if (commentSpan) {
                    commentSpan.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${count} تعليق`;
                }
            }
            // update modal badge if open for this post
            const badgeEl = document.getElementById('commentCountBadge');
            if (badgeEl && currentPostIdForComments === postId) {
                badgeEl.innerText = count;
            }
        }

        // Format timestamp helper
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);

            if (diffInHours < 24) {
                return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 7 * 24) {
                return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
            }
        }

        // Create comment HTML (uses enriched comment object returned by server)
function createCommentHtml(comment, postId) {
    const verifiedHtml = ''; // لا نستخدم مباشرة صورة هنا، سنحجز مكاناً ليتم تعبئته لاحقاً
    const likedClass = comment.is_liked ? 'text-red-400' : 'text-gray-400';
    const likeIcon = comment.is_liked ? 'fas' : 'far';

        // Toggle like on a comment (frontend)
        async function toggleCommentLike(postId, commentId, btnEl) {
            btnEl.disabled = true;
            try {
                const res = await fetch(`/api/posts/${postId}/comments/${commentId}/like`, { method: 'POST', credentials: 'same-origin' });
                const data = await res.json();
                if (res.ok && data.ok) {
                    const countEl = document.getElementById(`comment-like-count-${commentId}`);
                    if (countEl) countEl.textContent = data.likes;
                    if (data.is_liked) {
                        btnEl.classList.remove('text-gray-400');
                        btnEl.classList.add('text-red-400');
                        const i = btnEl.querySelector('i');
                        if (i) { i.classList.remove('far'); i.classList.add('fas'); }
                    } else {
                        btnEl.classList.remove('text-red-400');
                        btnEl.classList.add('text-gray-400');
                        const i = btnEl.querySelector('i');
                        if (i) { i.classList.remove('fas'); i.classList.add('far'); }
                    }
                } else {
                    console.warn('Like comment failed', data);
                }
            } catch (e) {
                console.error(e);
            } finally {
                btnEl.disabled = false;
            }
        }

        // Normalize a raw comment (legacy fallback) - kept for safety
        function normalizeComment(raw) {
            const commentId = raw.commentId || raw.id || raw.key || '';
            const content = raw.content || raw.commentContent || raw.text || '';
            const timestamp = raw.timestamp || raw.time || Date.now();

            let user = {};
            if (raw.user && typeof raw.user === 'object' && Object.keys(raw.user).length > 0) {
                user.userId = raw.user.userId || raw.user.id || raw.user.uid || '';
                user.username = raw.user.username || raw.user.displayName || raw.user.name || '';
                user.profile_picture_url = raw.user.profile_picture_url || raw.user.photoURL || DEFAULT_AVATAR;
            } else {
                user.userId = raw.userId || raw.userID || raw.from_user_id || '';
                user.username = raw.username || raw.from_username || raw.user_name || '';
                user.profile_picture_url = raw.profile_picture_url || raw.profilePicture || DEFAULT_AVATAR;
            }

            user.userId = user.userId || '';
            user.username = user.username || 'مستخدم';
            user.profile_picture_url = user.profile_picture_url || DEFAULT_AVATAR;

            return {
                commentId,
                content,
                timestamp,
                user
            };
        }

                                                            .then(r => r.ok ? r.json() : null)

        // Setup SSE subscription for a post's comments (Real-time comments)
        function setupCommentsSSE(postId) {
            // close existing before opening new
            closeCommentsSSE();

            try {
                // Same-origin EventSource will include cookies for session auth
                commentsEventSource = new EventSource(`/api/posts/${postId}/comments/stream`);
            } catch (err) {
                console.warn('Failed to create EventSource', err);
                commentsEventSource = null;
                return;
            }

            commentsEventSource.addEventListener('comments_snapshot', (e) => {
                try {
                    const items = JSON.parse(e.data || '[]');
                    const commentsListEl = document.getElementById('commentsList');
                    if (!commentsListEl) return;

                    // Render full snapshot (replace)
                    if (Array.isArray(items)) {
                        if (items.length === 0) {
                            commentsListEl.innerHTML = `
                              <div class="flex flex-col items-center justify-center py-10 text-gray-500 opacity-70">
                                  <i class="far fa-comments text-4xl mb-3"></i>
                                  <p class="text-sm">لا توجد تعليقات بعد.</p>
                                  <p class="text-xs">كن أول من يعلق!</p>
                              </div>`;
                        } else {
                            commentsListEl.innerHTML = items.map(c => createCommentHtml(c, postId)).join('');
                            // show "عرض كل الردود" buttons appropriately
                            items.forEach(c => {
                                try {
                                    const btn = document.querySelector(`#comment-${c.commentId} .comment-actions button:nth-child(3)`);
                                    if (btn) {
                                        if ((c.repliesCount || 0) > (c.recentReplies ? c.recentReplies.length : 0)) btn.classList.remove('hidden');
                                        else btn.classList.add('hidden');
                                    }
                                } catch(e){}
                            });
                            // update verification badges
                            updateCommentsVerification(items);
                        }

                        // update counts
                        const badgeEl = document.getElementById('commentCountBadge');
                        if (badgeEl) badgeEl.innerText = items.length;
                        updatePostCommentCount(postId, items.length);

                        // scroll to bottom
                        setTimeout(() => {
                            const el = document.getElementById('commentsList');
                            if (el) el.scrollTop = el.scrollHeight;
                        }, 80);
                    }
                } catch (err) {
                    console.error('comments_snapshot handler error', err);
                }
            });

            commentsEventSource.addEventListener('comment_added', (e) => {
                try {
                    const comment = JSON.parse(e.data || '{}');
                    if (!comment || !comment.commentId) return;
                    const commentsListEl = document.getElementById('commentsList');
                    if (!commentsListEl) return;

                    // prevent duplicate: if exists, ignore or replace
                    const existing = document.getElementById(`comment-${comment.commentId}`);
                    if (existing) {
                        // already exists -> update it
                        existing.outerHTML = createCommentHtml(comment, postId);
                    } else {
                        // append new comment
                        commentsListEl.insertAdjacentHTML('beforeend', createCommentHtml(comment, postId));
                    }

                    // update counts/badge
                    const badgeEl = document.getElementById('commentCountBadge');
                    let current = badgeEl ? Number(badgeEl.innerText || 0) : 0;
                    current = isNaN(current) ? 1 : current + 1;
                    if (badgeEl) badgeEl.innerText = current;
                    updatePostCommentCount(postId, current);

                    // ensure verification is updated for this user
                    updateCommentsVerification([comment]);

                    // scroll to bottom
                    setTimeout(() => {
                        const el = document.getElementById('commentsList');
                        if (el) el.scrollTop = el.scrollHeight;
                    }, 60);
                } catch (err) {
                    console.error('comment_added handler error', err);
                }
            });

            commentsEventSource.addEventListener('comment_changed', (e) => {
                try {
                    const comment = JSON.parse(e.data || '{}');
                    if (!comment || !comment.commentId) return;
                    const existing = document.getElementById(`comment-${comment.commentId}`);
                    if (existing) {
                        existing.outerHTML = createCommentHtml(comment, postId);
                        updateCommentsVerification([comment]);
                    }
                } catch (err) {
                    console.error('comment_changed handler error', err);
                }
            });

            commentsEventSource.addEventListener('comment_removed', (e) => {
                try {
                    const payload = JSON.parse(e.data || '{}');
                    const commentId = payload.commentId || payload.id || payload.key;
                    if (!commentId) return;
                    const el = document.getElementById(`comment-${commentId}`);
                    if (el) el.remove();

                    // update counts/badge
                    const badgeEl = document.getElementById('commentCountBadge');
                    let current = badgeEl ? Number(badgeEl.innerText || 0) : NaN;
                    if (!isNaN(current)) {
                        current = Math.max(0, current - 1);
                        badgeEl.innerText = current;
                        updatePostCommentCount(postId, current);
                    }
                } catch (err) {
                    console.error('comment_removed handler error', err);
                }
            });

            commentsEventSource.onerror = (err) => {
                // EventSource will attempt reconnect; log for debug
                console.warn('Comments SSE error or disconnected', err);
            };
        }

        function closeCommentsSSE() {
            if (commentsEventSource) {
                try {
                    commentsEventSource.close();
                } catch (e) {}
                commentsEventSource = null;
            }
        }

        // Handle opening comments modal and start SSE
        function handleComment(postId) { 
            currentPostIdForComments = postId;
            
            const myPic = document.getElementById('userProfilePic').src;
            const inputAvatar = document.getElementById('myCurrentAvatar');
            if(inputAvatar) inputAvatar.src = myPic;

            const modal = document.getElementById('commentModal');
            const content = document.getElementById('commentModalContent');
            
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                content.classList.add('open');
            }, 10);

            // fetch initial snapshot via REST (works even if SSE delayed) and subscribe to SSE for live updates
            fetchAndDisplayComments(postId);
            setupCommentsSSE(postId);
        }

        function closeCommentModal() {
            const modal = document.getElementById('commentModal');
            const content = document.getElementById('commentModalContent');
            
            content.classList.remove('open');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                currentPostIdForComments = null;
                if(document.getElementById('newCommentInput')) document.getElementById('newCommentInput').value = '';
                if(document.getElementById('commentsList')) document.getElementById('commentsList').innerHTML = '';
                if(document.getElementById('commentCountBadge')) document.getElementById('commentCountBadge').innerText = '0';
                // close realtime subscription when modal closed
                closeCommentsSSE();
            }, 300);
        }

        // Fetch comments (uses new enriched endpoint)
        async function fetchAndDisplayComments(postId) {
            const commentsListEl = document.getElementById('commentsList');
            const badgeEl = document.getElementById('commentCountBadge');
            
            commentsListEl.innerHTML = '<div class="flex justify-center py-8"><i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i></div>';
            
            try {
                const response = await fetch(`/api/posts/${postId}/comments`, { credentials: 'same-origin' });
                const result = await response.json();

                if (response.ok && result.ok) {
                    commentsListEl.innerHTML = '';
                    const comments = result.comments || [];
                    
                    if(badgeEl) badgeEl.innerText = comments.length;

                    // synchronize post card's comment count with actual comments length
                    updatePostCommentCount(postId, comments.length);

                    if (comments.length === 0) {
                        commentsListEl.innerHTML = `
                            <div class="flex flex-col items-center justify-center py-10 text-gray-500 opacity-70">
                                <i class="far fa-comments text-4xl mb-3"></i>
                                <p class="text-sm">لا توجد تعليقات بعد.</p>
                                <p class="text-xs">كن أول من يعلق!</p>
                            </div>`;
                    } else {
                        // render comments using createCommentHtml
                        const htmlBuffer = comments.map(c => createCommentHtml(c, postId)).join('');
                        commentsListEl.innerHTML = htmlBuffer;

                        // After rendering, ensure "عرض كل الردود" buttons are visible when repliesCount > recentReplies.length
                        comments.forEach(c => {
                            try {
                                const btn = document.querySelector(`#comment-${c.commentId} .comment-actions button:nth-child(3)`);
                                if (btn) {
                                    if ((c.repliesCount || 0) > (c.recentReplies ? c.recentReplies.length : 0)) btn.classList.remove('hidden');
                                    else btn.classList.add('hidden');
                                }
                            } catch(e){}
                        });

                        setTimeout(() => {
                            if(commentsListEl.lastElementChild) {
                                commentsListEl.scrollTop = commentsListEl.scrollHeight;
                            }
                        }, 100);

                        updateCommentsVerification(comments);
                    }
                } else {
                    commentsListEl.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">فشل تحميل التعليقات.</div>';
                }
            } catch (error) {
                console.error(error);
                commentsListEl.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">خطأ في الاتصال.</div>';
            }
        }
        
        async function updateCommentsVerification(comments) {
             const userIds = [...new Set(comments.map(c => (c.user && c.user.userId) ? c.user.userId : ''))].filter(Boolean);
             if(userIds.length === 0) return;

             try {
                const promises = userIds.map(uid => fetch(`/api/profile?userId=${uid}`).then(r => r.ok ? r.json() : null).catch(()=>null));
                const profiles = await Promise.all(promises);
                
                profiles.forEach(p => {
                    if(p && p.id && p.is_verified) {
                        const containers = document.querySelectorAll(`.badge-container[data-badge-user-id="${p.id}"]`);
                        containers.forEach(cont => {
                            if(cont.innerHTML.trim() === '') {
                                cont.innerHTML = `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="Verified">`;
                            }
                        });
                    }
                });
             } catch(e) { console.warn('Background verification check failed', e); }
        }

        async function postComment() {
            const input = document.getElementById('newCommentInput');
            const btn = document.getElementById('postCommentBtn');
            const errorEl = document.getElementById('commentError');
            
            const content = input.value.trim();
            if (!content || !currentPostIdForComments) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            errorEl.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdForComments}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ content: content })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    // After successful post, re-fetch the entire comments list to avoid shape/count divergence
                    await fetchAndDisplayComments(currentPostIdForComments);

                    // If server returned a newComments count, ensure post card is updated (fallback kept)
                    if (typeof result.newComments !== 'undefined' && result.newComments !== null) {
                        updatePostCommentCount(currentPostIdForComments, Number(result.newComments));
                    }

                    input.value = '';
                    input.focus();
                } else {
                    errorEl.textContent = result.error || 'فشل الإرسال';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'حدث خطأ';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-up text-sm"></i>';
            }
        }
        
        document.getElementById('postCommentBtn').addEventListener('click', postComment);
        document.getElementById('newCommentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                postComment();
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile')
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    const profilePicElement = document.getElementById('userProfilePic');
                    const meDot = document.getElementById('meOnlineDot');
                    if (data && data.profile_picture_url) {
                        profilePicElement.src = data.profile_picture_url;
                        profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                        currentUserId = data.id;
                        if (data.is_online) meDot.style.display = 'inline-block';
                        else meDot.style.display = 'none';
                    }
                }).catch(console.error);
                
            // load families first so they appear before posts
            fetchAndDisplayFamilies().then(() => {
                fetchAndDisplayPosts();
            });
        });

        (function setupNotifSSE() {
          if (!window.EventSource) return;
          const es = new EventSource('/api/notifications/stream', { withCredentials: true });

          es.addEventListener('notifications', (e) => {
            try {
              const payload = JSON.parse(e.data);
              const unread = payload.unread_count || 0;
              const unreadMessages = payload.unread_messages_count || 0;
              const pendingFR = payload.pending_friend_requests_count || 0;

              const notifBadgeEl = document.getElementById('notifBadge');
              if (unread > 0) {
                notifBadgeEl.style.display = 'inline-flex';
                notifBadgeEl.textContent = unread > 99 ? '99+' : String(unread);
              } else {
                notifBadgeEl.style.display = 'none';
              }

              const msgBadgeEl = document.getElementById('msgBadge');
              if (unreadMessages > 0) {
                msgBadgeEl.style.display = 'inline-flex';
                msgBadgeEl.textContent = unreadMessages > 99 ? '99+' : String(unreadMessages);
              } else {
                msgBadgeEl.style.display = 'none';
              }

              const frBadgeEl = document.getElementById('friendReqBadge');
              if (pendingFR > 0) {
                frBadgeEl.style.display = 'inline-flex';
                frBadgeEl.textContent = pendingFR > 99 ? '99+' : String(pendingFR);
              } else {
                frBadgeEl.style.display = 'none';
              }

            } catch (err) {
              console.error('Failed to parse notifications SSE data', err);
            }
          });

          es.addEventListener('error', (err) => {
            console.warn('Notifications SSE error', err);
          });
        })();

        (function initUnreadCounts() {
          fetch('/api/notifications/unread_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const badge = document.getElementById('notifBadge');
                if (d.unread_count > 0) {
                  badge.style.display = 'inline-flex';
                  badge.textContent = d.unread_count > 99 ? '99+' : String(d.unread_count);
                }
              }
            }).catch(()=>{});

          fetch('/api/chats', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok && Array.isArray(d.chats)) {
                const totalUnread = d.chats.reduce((acc, c) => acc + (c.unread_count || 0), 0);
                const msgBadge = document.getElementById('msgBadge');
                if (totalUnread > 0) {
                  msgBadge.style.display = 'inline-flex';
                  msgBadge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
                }
              }
            }).catch(()=>{});

          fetch('/api/friends/requests_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const fr = document.getElementById('friendReqBadge');
                if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); }
              }
            }).catch(()=>{});
        })();

        function sendHeartbeat() {
            fetch('/api/status/heartbeat', { method: 'POST' })
                .then(r => r.json())
                .catch(err => console.error('Heartbeat failed', err));
        }

        sendHeartbeat();
        setInterval(sendHeartbeat, 60000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                sendHeartbeat();
            }
        });

        // small helpers
        function escapeHtml(s) {
            if (!s && s !== 0) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function escapeAttr(s) {
            if (!s && s !== 0) return '';
            return String(s).replace(/"/g, '&quot;');
        }

    </script>
</body>
