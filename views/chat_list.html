<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        /* تنسيقات نافذة التعليقات (Bottom Sheet) */
        .glass-comment-modal-content {
            background-color: #18191a;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            top: auto; 
            height: 75vh;
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
        }

        .glass-comment-modal-content.open {
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .glass-comment-modal-content {
                position: relative;
                height: 80vh;
                max-width: 500px;
                margin: 0 auto;
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                top: auto;
                bottom: auto;
                transform: scale(0.95);
                opacity: 0;
                transition: all 0.2s ease-out;
            }
            .glass-comment-modal-content.open {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin: 12px auto 8px auto;
        }
        
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .close-btn-circle {
            background: rgba(255,255,255,0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            cursor: pointer;
        }
        .close-btn-circle:hover {
            background: rgba(255,255,255,0.2);
        }

        .media-container {
            max-height: 80vh; 
            width: auto;
        }
        
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .waveform-post {
            height: 60px; 
            background-color: #0f172a; 
            border-radius: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .modal-animate-in {
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .create-option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .create-option-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* Badges */
        #notifBadge, #msgBadge, #friendReqBadge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444;
          color: #fff;
          font-size: 12px;
          font-weight: 700;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

        .avatar-with-dot { 
          position: relative; 
          display: inline-flex; 
        }

        .online-dot {
          position: absolute;
          bottom: 2px;
          right: 2px;
          width: 12px;
          height: 12px;
          background: #22c55e;
          border: 2px solid #000;
          border-radius: 999px;
          box-shadow: 0 0 6px rgba(34,197,94,0.6);
          z-index: 10;
        }

        .online-dot-small {
          width: 10px;
          height: 10px;
          bottom: 1px;
          right: 1px;
          border-width: 1.5px;
        }

        /* VERIFIED BADGE */
        .verified-badge-img {
          display: inline-block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          margin-right: 4px;
          margin-left: 2px;
          object-fit: cover;
          vertical-align: middle;
        }
    </style>
</head>
<body class="min-h-screen">

                      <span id="meOnlineDot" class="online-dot" style="display:none;"></span>
                    </span>

            <div class="flex-grow flex justify-center">

            <div class="flex items-center space-x-4 space-x-reverse">

    <main class="max-w-6xl mx-auto p-4">
        <div id="postsFeed" class="max-w-xl mx-auto mt-4 space-y-4">
            </div>

    <div class="fixed bottom-0 left-0 right-0 z-50 glass-bottom-navbar">

            </a>

    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg">
        <div class="bg-[#1f2937] p-6 rounded-xl shadow-2xl max-w-sm w-full border border-gray-700 text-center" onclick="event.stopPropagation()">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-gray-400 mb-6">هل أنت متأكد أنك تريد حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء.</p>
            <div class="flex justify-around space-x-4 space-x-reverse">
                <button id="cancelDeleteBtn" class="p-2 w-full bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition duration-300">إلغاء</button>
                <button id="confirmDeleteBtn" class="p-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-300">تأكيد الحذف</button>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="media-container flex items-center justify-center" onclick="event.stopPropagation()">
        </div>
    </div>
    
    <div id="commentModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center glass-modal-bg transition-opacity duration-300">
        <div id="commentModalContent" class="glass-comment-modal-content w-full md:w-auto" onclick="event.stopPropagation()">
            
            <div class="md:hidden w-full flex justify-center" onclick="closeCommentModal()">

            </div>

            <div class="flex justify-between items-center px-4 pb-2 pt-2 border-b border-gray-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">

                    <span id="commentCountBadge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full text-gray-300">0</span>

                <button id="closeCommentModalBtn" class="close-btn-circle text-gray-300 hover:text-white" onclick="closeCommentModal()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            
            <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar bg-[#18191a] min-h-0">
                </div>

            <div class="p-3 border-t border-gray-800 bg-[#18191a]">
                <div id="commentError" class="text-red-500 text-xs text-center mb-2 hidden"></div>
                <div class="flex items-center gap-2 bg-[#242526] p-1.5 rounded-3xl border border-gray-700">
                    <img id="myCurrentAvatar" src="" class="w-8 h-8 rounded-full object-cover border border-gray-600 ml-1">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." 
                           class="flex-grow bg-transparent text-white text-sm px-2 focus:outline-none" 
                           dir="rtl" autocomplete="off">
                    <button id="postCommentBtn" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition w-9 h-9 flex items-center justify-center flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">

    <div id="postMenu" class="absolute z-40 bg-[#242526] rounded-lg shadow-xl border border-gray-700 hidden w-40">
        <button id="deleteOptionBtn" class="flex items-center w-full p-3 text-red-400 hover:bg-[#343536] rounded-lg transition duration-300">
            <i class="fas fa-trash ml-3"></i>
            حذف المنشور
        </button>
    </div>

    <div id="createModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 glass-modal-bg">

            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-bold text-white">ماذا تريد أن تنشر؟</h3>

                    <i class="fas fa-times"></i>
                </button>

            <div class="grid grid-cols-1 gap-4">
                <a href="/create-post" class="create-option-card flex items-center p-5 rounded-2xl group">
                    <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center ml-4 group-hover:bg-blue-500/40 transition">
                        <i class="fas fa-file-alt text-blue-400 text-xl"></i>
                    </div>
                    <div class="text-right">
                        <span class="block text-white font-bold text-lg">منشور جديد</span>

                    </div>

                <a href="/create-reel" class="create-option-card flex items-center p-5 rounded-2xl group">

                    </div>
                    <div class="text-right">

                        <span class="block text-gray-400 text-sm">فيديو قصير ممتع</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentPostIdToDelete = null;
        let currentUserId = null; 
        let activeWaveSurfer = null; 
        let activeVideo = null; 
        let currentPostIdForComments = null;

        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

        const postsFeed = document.getElementById('postsFeed');
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteMessage = document.getElementById('deleteMessage');
        const postMenu = document.getElementById('postMenu');
        const deleteOptionBtn = document.getElementById('deleteOptionBtn');
        const mediaViewerModal = document.getElementById('mediaViewerModal');
        const mediaViewerContent = document.getElementById('mediaViewerContent');
        const profileDropdown = document.getElementById('profileDropdown'); 
        const profileMenuButton = document.getElementById('profileMenuButton'); 
        
        function toggleProfileDropdown(event) {
            event.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        }

        function closeProfileDropdownOnClickOutside(event) {
            if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        }

        document.addEventListener('click', closeProfileDropdownOnClickOutside);

        const createModalEl = document.getElementById('createModal');

        function toggleCreateModal() {
            createModalEl.classList.toggle('hidden');
            if (!createModalEl.classList.contains('hidden')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        createModalEl.addEventListener('click', (e) => {
            if (e.target === createModalEl) {
                toggleCreateModal();
            }
        });
        
        function openMediaViewer(url, type, event) {
            event.stopPropagation();
            if (type === 'audio' || type === 'video') return;

            let mediaElement;
            mediaViewerContent.innerHTML = '';
            
            if (type === 'image') {
                mediaElement = `<img src="${url}" alt="Media Viewer" class="max-w-full max-h-full object-contain rounded-lg">`;
            } else {
                return;
            }

            mediaViewerContent.innerHTML = mediaElement;
            mediaViewerModal.classList.remove('hidden');
        }

        function closeMediaViewer(event) {
            if (event.target.id === 'mediaViewerModal' || event.target.closest('.fa-times')) {
                const activeMedia = mediaViewerContent.querySelector('video, audio');
                if (activeMedia) {
                    activeMedia.pause();
                }
                mediaViewerModal.classList.add('hidden');
                mediaViewerContent.innerHTML = '';
            }
        }

        function openDeleteModal(postId, event) {
            event.stopPropagation();
            currentPostIdToDelete = postId;
            deleteMessage.classList.add('hidden');
            deleteModal.classList.remove('hidden');
            postMenu.classList.add('hidden');
        }

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            currentPostIdToDelete = null;
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentPostIdToDelete) return;

            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحذف';
            deleteMessage.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdToDelete}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    const el = document.querySelector(`div[data-post-id="${currentPostIdToDelete}"]`);
                    if (el) el.remove();
                    deleteModal.classList.add('hidden');
                } else {
                    deleteMessage.textContent = result.error || 'فشل الحذف.';
                    deleteMessage.classList.remove('hidden');
                }
            } catch (error) {
                deleteMessage.textContent = 'حدث خطأ في الاتصال بالخادم.';
                deleteMessage.classList.remove('hidden');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.innerHTML = 'تأكيد الحذف';
                currentPostIdToDelete = null;
            }
        });

        function togglePostMenu(postId, userId, event, menuButton) {
            event.stopPropagation();
            
            if (!postMenu.classList.contains('hidden') && postMenu.dataset.postId === postId) {
                postMenu.classList.add('hidden');
                return;
            }
            
            const rect = menuButton.getBoundingClientRect();
            postMenu.style.top = `${rect.bottom + 5}px`;
            postMenu.style.left = `${rect.left}px`;
            
            postMenu.dataset.postId = postId;

            if (userId === currentUserId) {
                deleteOptionBtn.style.display = 'flex';
                deleteOptionBtn.onclick = (e) => openDeleteModal(postId, e);
            } else {
                deleteOptionBtn.style.display = 'none';
            }

            postMenu.classList.remove('hidden');
        }

        document.addEventListener('click', (event) => {
            if (!postMenu.contains(event.target) && !event.target.closest('.post-menu-button')) {
                postMenu.classList.add('hidden');
                deleteModal.classList.add('hidden'); 
            }
        });

        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if (!container) return;

            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4b5563',
                progressColor: '#3b82f6',
                cursorColor: '#10b981',
                barWidth: 3,
                barRadius: 3,
                barGap: 1,
                height: 60,
                responsive: true,
                mediaControls: false,
            });

            ws.load(url);

            const playButton = container.closest('.glass-post-card').querySelector('.audio-play-button');
            if (playButton) {
                playButton.onclick = () => {
                    if (activeWaveSurfer && activeWaveSurfer !== ws) {
                        activeWaveSurfer.pause();
                        const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                        if (otherPostCard) {
                            const pb = otherPostCard.querySelector('.audio-play-button i');
                            if (pb) { pb.classList.remove('fa-pause'); pb.classList.add('fa-play'); }
                        }
                    }
                    if (activeVideo) {
                        const activePostId = activeVideo.id.split('-')[1];
                        const controlIcon = document.getElementById(`control-icon-${activePostId}`);
                        const playOverlay = document.getElementById(`play-overlay-${activePostId}`);
                        activeVideo.pause();
                        if (controlIcon) {
                            controlIcon.classList.remove('fa-pause');
                            controlIcon.classList.add('fa-play');
                        }
                        if (playOverlay) playOverlay.classList.remove('hidden');
                        activeVideo = null;
                    }
                    
                    if (ws.isPlaying()) {
                        ws.pause();
                        playButton.querySelector('i').classList.remove('fa-pause');
                        playButton.querySelector('i').classList.add('fa-play');
                    } else {
                        ws.play();
                        playButton.querySelector('i').classList.remove('fa-play');
                        playButton.querySelector('i').classList.add('fa-pause');
                        activeWaveSurfer = ws;
                    }
                };

                ws.on('finish', () => {
                    playButton.querySelector('i').classList.remove('fa-pause');
                    playButton.querySelector('i').classList.add('fa-play');
                    activeWaveSurfer = null;
                });
            }
        }
        
        function toggleVideoPlay(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            const controlsBar = document.getElementById(`controls-bar-${postId}`);

            if (!video) return;

            if (activeVideo && activeVideo !== video) {
                const activePostId = activeVideo.id.split('-')[1];
                const activeControlIcon = document.getElementById(`control-icon-${activePostId}`);
                const activePlayOverlay = document.getElementById(`play-overlay-${activePostId}`);
                activeVideo.pause();
                if (activeControlIcon) {
                    activeControlIcon.classList.remove('fa-pause');
                    activeControlIcon.classList.add('fa-play');
                }
                if (activePlayOverlay) activePlayOverlay.classList.remove('hidden');
                
                activeVideo.removeEventListener('timeupdate', updateVideoProgress);
                activeVideo.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
                activeVideo.removeEventListener('ended', handleVideoEnd);
            }
            if (activeWaveSurfer) {
                activeWaveSurfer.pause();
                const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                if (otherPostCard) {
                    const apb = otherPostCard.querySelector('.audio-play-button i');
                    if (apb) { apb.classList.remove('fa-pause'); apb.classList.add('fa-play'); }
                }
                activeWaveSurfer = null;
            }
            
            if (video.paused) {
                video.play();
                playOverlay.classList.add('hidden'); 
                if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
                if (controlsBar) controlsBar.classList.remove('opacity-0'); 
                activeVideo = video;
                
                video.addEventListener('timeupdate', updateVideoProgress);
                video.addEventListener('loadedmetadata', updateVideoTimeDisplay);
                video.addEventListener('ended', handleVideoEnd);

            } else {
                video.pause();
                playOverlay.classList.remove('hidden'); 
                if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
                activeVideo = null;
            }
        }

        function updateVideoProgress(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const progressBar = document.getElementById(`progress-bar-${postId}`);
            const timeDisplay = document.getElementById(`time-display-${postId}`);

            if (!video.duration || !progressBar || !timeDisplay) return;

            const percent = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        }

        function updateVideoTimeDisplay(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const timeDisplay = document.getElementById(`time-display-${postId}`);

            if (timeDisplay && video.duration) {
                timeDisplay.textContent = `0:00 / ${formatVideoTime(video.duration)}`;
            }
        }
        
        function handleVideoEnd(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            
            video.currentTime = 0;
            if (playOverlay) playOverlay.classList.remove('hidden'); 
            if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
            activeVideo = null;
            
            video.removeEventListener('timeupdate', updateVideoProgress);
            video.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
            video.removeEventListener('ended', handleVideoEnd);
        }

        function formatVideoTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function seekVideo(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const progressContainer = event.currentTarget;
            
            if (!video || !video.duration) return;

            const rect = progressContainer.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            video.currentTime = video.duration * percentage;
            if (video.paused) {
                toggleVideoPlay(postId, event);
            }
        }

        function toggleFullscreen(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            if (video) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.mozRequestFullScreen) {
                    video.mozRequestFullScreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            }
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);

            if (diffInHours < 24) {
                return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 7 * 24) {
                return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
            }
        }

        async function fetchAndDisplayPosts() {
            postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';
            
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();
                
                postsFeed.innerHTML = '';
                
                if (response.ok && result.ok) {
                    if (result.posts.length === 0) {
                        postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات لعرضها بعد.</div>';
                        return;
                    }
                    
                    const posts = result.posts;
                    const userIds = [...new Set(posts.map(p => p.userId))];

                    const profileMap = {};
                    try {
                        const profilePromises = userIds.map(uid => fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' })
                                                            .then(r => r.ok ? r.json() : null)
                                                            .catch(() => null));
                        const profileResults = await Promise.all(profilePromises);
                        profileResults.forEach(pr => {
                            if (pr && pr.ok) {
                                profileMap[pr.id] = pr; 
                            }
                        });
                    } catch (e) {
                        console.warn('Failed to fetch profiles for verification status', e);
                    }

                    const audioPostsToInit = [];

                    posts.forEach(post => {
                        const prof = profileMap[post.userId];
                        if (prof) {
                            post.user = post.user || {};
                            post.user.is_verified = !!prof.is_verified;
                        } else {
                            post.user = post.user || {};
                            post.user.is_verified = !!post.user.is_verified;
                        }

                        postsFeed.innerHTML += createPostCard(post);
                        
                        if (post.media && post.media.type === 'audio') {
                            audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                        }
                    });
                    
                    setTimeout(() => {
                        audioPostsToInit.forEach(ap => {
                            initializePostWaveSurfer(ap.postId, ap.url);
                        });
                    }, 100); 

                }
            } catch (error) {
                console.error('Error:', error);
                postsFeed.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في جلب المنشورات.</div>';
            }
        }
        
        async function handleLike(postId, buttonElement) {
            const likeIcon = buttonElement.querySelector('.like-icon');
            buttonElement.disabled = true;

            try {
                const response = await fetch(`/api/posts/${postId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
                    if (postCard) {
                        const likesSpan = postCard.querySelector('.flex.justify-between span:first-child');
                        if (likesSpan) likesSpan.innerHTML = `<i class="fas fa-heart ml-1"></i> ${result.newLikes} إعجاب`;
                    }

                    if (result.action === 'liked') {
                        likeIcon.classList.remove('far', 'text-gray-400');
                        likeIcon.classList.add('fas', 'text-red-500');
                        buttonElement.classList.remove('text-gray-400');
                        buttonElement.classList.add('text-red-500');
                        buttonElement.dataset.isLiked = 'true';
                    } else {
                        likeIcon.classList.remove('fas', 'text-red-500');
                        likeIcon.classList.add('far', 'text-gray-400');
                        buttonElement.classList.remove('text-red-500');
                        buttonElement.classList.add('text-gray-400');
                        buttonElement.dataset.isLiked = 'false';
                    }
                    
                } else {
                    console.error('Like failed:', result.error);
                }

            } catch (error) {
                console.error('Error during like operation:', error);
            } finally {
                buttonElement.disabled = false;
            }
        }

        async function fetchAndDisplayComments(postId) {
            const commentsListEl = document.getElementById('commentsList');
            const badgeEl = document.getElementById('commentCountBadge');
            
            commentsListEl.innerHTML = '<div class="flex justify-center py-8"><i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i></div>';
            
            try {
                const response = await fetch(`/api/posts/${postId}/comments`);
                const result = await response.json();

                if (response.ok && result.ok) {
                    commentsListEl.innerHTML = '';
                    const comments = result.comments || [];
                    
                    if(badgeEl) badgeEl.innerText = comments.length;

                    if (comments.length === 0) {
                        commentsListEl.innerHTML = `
                            <div class="flex flex-col items-center justify-center py-10 text-gray-500 opacity-70">
                                <i class="far fa-comments text-4xl mb-3"></i>
                                <p class="text-sm">لا توجد تعليقات بعد.</p>
                                <p class="text-xs">كن أول من يعلق!</p>
                            </div>`;
                    } else {
                        // استخدام map بدلاً من forEach لضمان إنشاء سلسلة نصية واحدة صحيحة
                        const htmlBuffer = comments.map(comment => {
                             // حماية ضد البيانات الناقصة
                             if (!comment.user) {
                                 comment.user = { username: 'مستخدم', profile_picture_url: 'https://via.placeholder.com/40' };
                             }
                             const isVerified = comment.user.is_verified || false;
                             return createCommentHtml(comment, isVerified);
                        }).join('');
                        
                        commentsListEl.innerHTML = htmlBuffer;
                        
                        setTimeout(() => {
                            if(commentsListEl.lastElementChild) {
                                commentsListEl.scrollTop = commentsListEl.scrollHeight;
                            }
                        }, 100);

                        updateCommentsVerification(comments);
                    }
                } else {
                    commentsListEl.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">فشل تحميل التعليقات.</div>';
                }
            } catch (error) {
                console.error(error);
                commentsListEl.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">خطأ في الاتصال.</div>';
            }
        }
        
        async function updateCommentsVerification(comments) {
             const userIds = [...new Set(comments.map(c => c.userId))];
             if(userIds.length === 0) return;

             try {
                const promises = userIds.map(uid => fetch(`/api/profile?userId=${uid}`).then(r => r.ok ? r.json() : null).catch(()=>null));
                const profiles = await Promise.all(promises);
                
                profiles.forEach(p => {
                    if(p && p.id && p.is_verified) {
                        const containers = document.querySelectorAll(`.badge-container[data-badge-user-id="${p.id}"]`);
                        containers.forEach(cont => {
                            if(cont.innerHTML.trim() === '') {
                                cont.innerHTML = `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="Verified">`;
                            }
                        });
                    }
                });
             } catch(e) { console.warn('Background verification check failed', e); }
        }

        async function postComment() {
            const input = document.getElementById('newCommentInput');
            const btn = document.getElementById('postCommentBtn');
            const errorEl = document.getElementById('commentError');
            
            const content = input.value.trim();
            if (!content || !currentPostIdForComments) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            errorEl.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdForComments}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    const commentsListEl = document.getElementById('commentsList');
                    
                    if (commentsListEl.querySelector('.fa-comments')) {
                        commentsListEl.innerHTML = '';
                    }

                    const amIVerified = false; 
                    
                    commentsListEl.innerHTML += createCommentHtml(result.comment, amIVerified);
                    
                    input.value = '';
                    commentsListEl.scrollTop = commentsListEl.scrollHeight;
                    
                    const badgeEl = document.getElementById('commentCountBadge');
                    if(badgeEl) badgeEl.innerText = parseInt(badgeEl.innerText || 0) + 1;

                    updateCommentsVerification([result.comment]);

                } else {
                    errorEl.textContent = result.error || 'فشل الإرسال';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'حدث خطأ';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-up text-sm"></i>';
                input.focus();
            }
        }
        
        document.getElementById('postCommentBtn').addEventListener('click', postComment);
        document.getElementById('newCommentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                postComment();
            }
        });

        (function setupNotifSSE() {
          if (!window.EventSource) return;
          const es = new EventSource('/api/notifications/stream', { withCredentials: true });

          es.addEventListener('notifications', (e) => {
            try {
              const payload = JSON.parse(e.data);
              const unread = payload.unread_count || 0;
              const unreadMessages = payload.unread_messages_count || 0;
              const pendingFR = payload.pending_friend_requests_count || 0;

              const notifBadgeEl = document.getElementById('notifBadge');
              if (unread > 0) {
                notifBadgeEl.style.display = 'inline-flex';
                notifBadgeEl.textContent = unread > 99 ? '99+' : String(unread);
              } else {
                notifBadgeEl.style.display = 'none';
              }

              const msgBadgeEl = document.getElementById('msgBadge');
              if (unreadMessages > 0) {
                msgBadgeEl.style.display = 'inline-flex';
                msgBadgeEl.textContent = unreadMessages > 99 ? '99+' : String(unreadMessages);
              } else {
                msgBadgeEl.style.display = 'none';
              }

              const frBadgeEl = document.getElementById('friendReqBadge');
              if (pendingFR > 0) {
                frBadgeEl.style.display = 'inline-flex';
                frBadgeEl.textContent = pendingFR > 99 ? '99+' : String(pendingFR);
              } else {
                frBadgeEl.style.display = 'none';
              }

            } catch (err) {
              console.error('Failed to parse notifications SSE data', err);
            }
          });

          es.addEventListener('error', (err) => {
            console.warn('Notifications SSE error', err);
          });
        })();

        (function initUnreadCounts() {
          fetch('/api/notifications/unread_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const badge = document.getElementById('notifBadge');
                if (d.unread_count > 0) {
                  badge.style.display = 'inline-flex';
                  badge.textContent = d.unread_count > 99 ? '99+' : String(d.unread_count);
                }
              }
            }).catch(()=>{});

          fetch('/api/chats', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok && Array.isArray(d.chats)) {
                const totalUnread = d.chats.reduce((acc, c) => acc + (c.unread_count || 0), 0);
                const msgBadge = document.getElementById('msgBadge');
                if (totalUnread > 0) {
                  msgBadge.style.display = 'inline-flex';
                  msgBadge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
                }
              }
            }).catch(()=>{});

          fetch('/api/friends/requests_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const fr = document.getElementById('friendReqBadge');
                if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); }
              }
            }).catch(()=>{});
        })();

        function sendHeartbeat() {
            fetch('/api/status/heartbeat', { method: 'POST' })
                .then(r => r.json())
                .catch(err => console.error('Heartbeat failed', err));
        }

        sendHeartbeat();
        setInterval(sendHeartbeat, 60000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                sendHeartbeat();
            }
        });

    </script>
</body>
</html>
