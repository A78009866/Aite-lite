<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .media-container {
            max-height: 80vh; 
            width: auto;
        }
        
        /* نمط بطاقة المنشور الزجاجية الجديدة */
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3); /* خلفية سوداء شفافة */
            backdrop-filter: blur(10px); /* تأثير زجاجي */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); /* حدود بيضاء خفيفة */
        }

        /* نمط WaveSurfer لمنشورات الهوم */
        .waveform-post {
            height: 60px; 
            background-color: #0f172a; 
            border-radius: 6px;
        }
        
        /* شريط التمرير مخصص للتعليقات */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #3b82f6; 
            border-radius: 3px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background-color: #1f2937;
        }

    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="/create-post" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center">
                    <i class="fas fa-plus ml-2"></i>
                    إنشاء منشور
                </a>
            </div>
            
            <div class="flex-grow flex justify-center">
                <a href="#" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300">
                    Aite
                </a>
            </div>
            
            <div class="flex items-center">
                <a href="/profile" class="relative">
                    <img id="userProfilePic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300">
                </a>
            </div>

        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        
        <div id="postsFeed" class="max-w-xl mx-auto mt-4 space-y-4">
            </div>

    </main>
    
    <div id="commentsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg" onclick="closeCommentsModal(event)">
        <div class="glass-post-card p-4 rounded-xl shadow-2xl w-full max-w-lg h-[90vh] flex flex-col" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center pb-3 border-b border-gray-700 mb-4">
                <h3 class="text-xl font-bold text-white">التعليقات</h3>
                <button class="text-gray-400 hover:text-white transition" onclick="closeCommentsModal()">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <div id="commentsList" class="flex-grow overflow-y-auto space-y-4 custom-scroll mb-4">
                <div class="text-center text-gray-500" id="commentsLoading">جاري تحميل التعليقات...</div>
                </div>

            <div class="pt-4 border-t border-gray-700">
                <form id="commentForm" class="flex items-center space-x-2 space-x-reverse">
                    <img id="modalUserPic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full object-cover flex-shrink-0">
                    <input type="text" id="commentInput" placeholder="أضف تعليقك..." required
                           class="w-full p-2 bg-[#242526] border border-gray-700 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-500 transition duration-300">
                    <button type="submit" id="commentSubmitBtn" class="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex-shrink-0 transition duration-300 disabled:opacity-50">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>

            <div id="commentError" class="text-red-500 text-center mt-2 hidden"></div>
        </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg">
        <div class="bg-[#1f2937] p-6 rounded-xl shadow-2xl max-w-sm w-full border border-gray-700 text-center" onclick="event.stopPropagation()">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-gray-400 mb-6">هل أنت متأكد أنك تريد حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء.</p>
            <div class="flex justify-around space-x-4 space-x-reverse">
                <button id="cancelDeleteBtn" class="p-2 w-full bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition duration-300">إلغاء</button>
                <button id="confirmDeleteBtn" class="p-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-300">تأكيد الحذف</button>
            </div>
            <div id="deleteMessage" class="text-red-500 mt-3 hidden"></div>
        </div>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="media-container flex items-center justify-center" onclick="event.stopPropagation()">
        </div>
    </div>


    <div id="postMenu" class="absolute z-40 bg-[#242526] rounded-lg shadow-xl border border-gray-700 hidden w-40">
        <button id="deleteOptionBtn" class="flex items-center w-full p-3 text-red-400 hover:bg-[#343536] rounded-lg transition duration-300">
            <i class="fas fa-trash ml-3"></i>
            حذف المنشور
        </button>
    </div>


    <script>
        let currentPostIdToDelete = null;
        let currentPostIdForComments = null; // لتتبع المنشور النشط للتعليقات
        let currentUserId = null; 
        let activeWaveSurfer = null; 
        let currentUserProfilePic = 'https://via.placeholder.com/40/3182CE/FFFFFF?text=P';

        const postsFeed = document.getElementById('postsFeed');
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteMessage = document.getElementById('deleteMessage');
        const postMenu = document.getElementById('postMenu');
        const deleteOptionBtn = document.getElementById('deleteOptionBtn');
        const mediaViewerModal = document.getElementById('mediaViewerModal');
        const mediaViewerContent = document.getElementById('mediaViewerContent');
        
        // عناصر نافذة التعليقات
        const commentsModal = document.getElementById('commentsModal');
        const commentsList = document.getElementById('commentsList');
        const commentsLoading = document.getElementById('commentsLoading');
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');
        const commentSubmitBtn = document.getElementById('commentSubmitBtn');
        const commentError = document.getElementById('commentError');
        const modalUserPic = document.getElementById('modalUserPic'); // صورة المستخدم الحالي في نموذج التعليق
        

        // ******************** 1. وظائف عرض الوسائط (Media Viewer) ********************
        function openMediaViewer(url, type, event) {
            // ... (الكود كما هو)
            event.stopPropagation();
            if (type === 'audio') { 
                return;
            } 
            
            let mediaElement;
            mediaViewerContent.innerHTML = '';
            
            if (type === 'image') {
                mediaElement = `<img src="${url}" alt="Media Viewer" class="max-w-full max-h-full object-contain rounded-lg">`;
            } else if (type === 'video') {
                mediaElement = `<video src="${url}" controls autoplay class="max-w-full max-h-full object-contain rounded-lg"></video>`;
            } else {
                return;
            }

            mediaViewerContent.innerHTML = mediaElement;
            mediaViewerModal.classList.remove('hidden');
        }

        function closeMediaViewer(event) {
            // ... (الكود كما هو)
            if (event.target.id === 'mediaViewerModal' || event.target.closest('.fa-times')) {
                const activeMedia = mediaViewerContent.querySelector('video, audio');
                if (activeMedia) {
                    activeMedia.pause();
                }
                mediaViewerModal.classList.add('hidden');
                mediaViewerContent.innerHTML = '';
            }
        }
        
        // ******************** 2. وظيفة تهيئة WaveSurfer للمنشور ********************
        function initializePostWaveSurfer(postId, audioUrl) {
            // ... (الكود كما هو)
            const containerId = `waveform-${postId}`;
            const playPauseBtn = document.getElementById(`play-pause-btn-${postId}`);
            
            if (!document.getElementById(containerId)) return;

            if (activeWaveSurfer && activeWaveSurfer.isPlaying()) {
                activeWaveSurfer.pause();
            }
            
            const wavesurfer = WaveSurfer.create({
                container: `#${containerId}`,
                waveColor: '#4f46e5', // Indigo-600
                progressColor: '#3b82f6', // Blue-500
                cursorColor: '#ef4444', // Red-500
                barWidth: 3,
                barRadius: 2,
                responsive: true,
                height: 60,
                rtl: true,
            });

            wavesurfer.load(audioUrl);
            
            playPauseBtn.onclick = () => {
                if (activeWaveSurfer && activeWaveSurfer !== wavesurfer && activeWaveSurfer.isPlaying()) {
                    activeWaveSurfer.pause();
                }
                wavesurfer.playPause();
                activeWaveSurfer = wavesurfer;
            };

            wavesurfer.on('play', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                activeWaveSurfer = wavesurfer;
            });
            wavesurfer.on('pause', () => {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            });
            wavesurfer.on('finish', () => {
                 playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            });
        }


        // ******************** 3. وظائف قائمة الحذف (Delete Menu) ********************
        function openPostMenu(postId, postUserId, event) {
            // ... (الكود كما هو)
            event.stopPropagation();
            postMenu.classList.add('hidden');
            
            if (currentUserId !== postUserId) {
                return;
            }

            const menuButton = event.target.closest('button');
            const rect = menuButton.getBoundingClientRect();

            postMenu.style.top = `${rect.bottom + window.scrollY + 5}px`;
            postMenu.style.left = `${rect.left}px`; 
            
            deleteOptionBtn.onclick = () => {
                postMenu.classList.add('hidden');
                openDeleteModal(postId); 
            };

            postMenu.classList.remove('hidden');

            function hideMenuOnOutsideClick(event) {
                if (!postMenu.contains(event.target) && !menuButton.contains(event.target)) {
                    postMenu.classList.add('hidden');
                    document.removeEventListener('click', hideMenuOnOutsideClick);
                }
            }
            setTimeout(() => { 
                document.addEventListener('click', hideMenuOnOutsideClick);
            }, 10);
        }

        function openDeleteModal(postId) {
            // ... (الكود كما هو)
            currentPostIdToDelete = postId;
            deleteMessage.classList.add('hidden');
            deleteModal.classList.remove('hidden');
        }

        function closeDeleteModal() {
            // ... (الكود كما هو)
            deleteModal.classList.add('hidden');
            currentPostIdToDelete = null;
        }

        async function deletePost() {
            // ... (الكود كما هو)
            if (!currentPostIdToDelete) return;

            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.textContent = 'جاري الحذف...';
            deleteMessage.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdToDelete}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    closeDeleteModal();
                    fetchAndDisplayPosts(); 
                } else {
                    deleteMessage.textContent = result.error || 'فشل في حذف المنشور.';
                    deleteMessage.classList.remove('hidden');
                }

            } catch (error) {
                deleteMessage.textContent = 'فشل الاتصال بالخادم.';
                deleteMessage.classList.remove('hidden');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.textContent = 'تأكيد الحذف';
            }
        }

        cancelDeleteBtn.addEventListener('click', closeDeleteModal);
        confirmDeleteBtn.addEventListener('click', deletePost);

        // ******************** 4. وظيفة الإعجاب (Like Functionality) ********************
        async function handleLike(postId, button) { 
            button.disabled = true;
            
            try {
                const response = await fetch(`/api/posts/${postId}/like`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error('فشل في معالجة الإعجاب.');
                }

                const result = await response.json();
                const postCard = button.closest('.glass-post-card');
                const likesCountElement = postCard.querySelector(`#likes-count-${postId}`);
                const likesButtonIcon = button.querySelector('i');

                // تحديث واجهة المستخدم فوراً
                let currentLikes = parseInt(likesCountElement.textContent.trim().split(' ')[0]) || 0;
                
                if (result.liked) {
                    // تم الإعجاب
                    likesButtonIcon.classList.remove('text-gray-400');
                    likesButtonIcon.classList.add('text-red-500');
                    likesCountElement.textContent = `${currentLikes + 1} إعجاب`;
                    button.classList.add('text-red-500', 'hover:text-red-400');
                    button.classList.remove('text-gray-400', 'hover:text-red-500');
                } else {
                    // تم إلغاء الإعجاب
                    likesButtonIcon.classList.add('text-gray-400');
                    likesButtonIcon.classList.remove('text-red-500');
                    likesCountElement.textContent = `${Math.max(0, currentLikes - 1)} إعجاب`;
                    button.classList.remove('text-red-500', 'hover:text-red-400');
                    button.classList.add('text-gray-400', 'hover:text-red-500');
                }

            } catch (error) {
                console.error('Error liking post:', error);
                alert('حدث خطأ أثناء معالجة الإعجاب.');
            } finally {
                button.disabled = false;
            }
        }
        
        // ******************** 5. وظائف التعليقات (Comments Functionality) ********************

        function createCommentElement(comment) {
            const date = new Date(comment.timestamp).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
            return `
                <div class="flex items-start p-3 bg-gray-800 rounded-lg">
                    <img src="${comment.user.profile_picture_url}" alt="${comment.user.username}" class="w-8 h-8 rounded-full object-cover border border-blue-500 flex-shrink-0 ml-3">
                    <div class="flex flex-col">
                        <div class="flex items-baseline">
                            <span class="text-sm font-semibold text-white mr-2">${comment.user.username}</span>
                            <span class="text-xs text-gray-500">${date}</span>
                        </div>
                        <p class="text-gray-200 mt-0.5 whitespace-pre-wrap">${comment.content}</p>
                    </div>
                </div>
            `;
        }

        async function fetchComments(postId) {
            commentsList.innerHTML = '';
            commentsLoading.classList.remove('hidden');

            try {
                const response = await fetch(`/api/posts/${postId}/comments`);
                if (!response.ok) {
                    throw new Error('فشل في جلب التعليقات.');
                }
                const result = await response.json();

                commentsLoading.classList.add('hidden');
                
                if (result.comments && result.comments.length > 0) {
                    commentsList.innerHTML = result.comments.map(createCommentElement).join('');
                } else {
                    commentsList.innerHTML = '<div class="text-center text-gray-500 p-4">كن أول من يعلق!</div>';
                }
            } catch (error) {
                commentsLoading.classList.add('hidden');
                commentsList.innerHTML = `<div class="text-center text-red-500 p-4">حدث خطأ في جلب التعليقات: ${error.message}</div>`;
                console.error('Fetch comments error:', error);
            }
        }
        
        async function submitComment(e) {
            e.preventDefault();
            const content = commentInput.value.trim();
            const postId = currentPostIdForComments;

            if (!content) {
                commentError.textContent = 'التعليق لا يمكن أن يكون فارغاً.';
                commentError.classList.remove('hidden');
                return;
            }

            commentSubmitBtn.disabled = true;
            commentError.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    // إعادة جلب وعرض التعليقات وتحديث عداد المنشور
                    fetchComments(postId);
                    commentInput.value = '';
                    
                    // تحديث عداد التعليقات في بطاقة المنشور
                    const postCard = document.querySelector(`[data-post-id="${postId}"]`);
                    const commentsCountElement = postCard.querySelector(`#comments-count-${postId}`);
                    if (commentsCountElement) {
                         commentsCountElement.textContent = `${result.newCount || 0} تعليق`;
                    }
                } else {
                    commentError.textContent = result.error || 'فشل في إضافة التعليق.';
                    commentError.classList.remove('hidden');
                }

            } catch (error) {
                commentError.textContent = 'فشل الاتصال بالخادم.';
                commentError.classList.remove('hidden');
            } finally {
                commentSubmitBtn.disabled = false;
            }
        }

        function handleComment(postId) { 
            currentPostIdForComments = postId;
            modalUserPic.src = currentUserProfilePic; // تعيين صورة المستخدم الحالي
            commentsModal.classList.remove('hidden');
            commentInput.value = '';
            commentError.classList.add('hidden');
            fetchComments(postId);
        }
        
        function closeCommentsModal() {
            commentsModal.classList.add('hidden');
            currentPostIdForComments = null;
        }
        
        commentForm.addEventListener('submit', submitComment);


        // ******************** 6. وظيفة إنشاء بطاقة المنشور ********************

        function createPostCard(post, isOwner, userHasLiked) { 
            let mediaHtml = '';
            const postId = post.postId; 
            
            // ... (باقي كود mediaHtml كما هو)
            if (post.media) {
                const url = post.media.url;
                const type = post.media.type;
                
                if (type === 'image') {
                    mediaHtml = `<img src="${url}" alt="Post Media" class="rounded-lg mt-3 w-full object-cover max-h-80 cursor-pointer" onclick="openMediaViewer('${url}', 'image', event)">`;
                } else if (type === 'video') {
                    mediaHtml = `<video src="${url}" controls class="rounded-lg mt-3 w-full max-h-80 cursor-pointer" onclick="openMediaViewer('${url}', 'video', event)"></video>`;
                } else if (type === 'audio') {
                    mediaHtml = `
                        <div class="mt-3 flex items-center bg-[#0f172a] rounded-lg p-2">
                            <button id="play-pause-btn-${postId}" class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition duration-300 flex-shrink-0 w-12 h-12 flex items-center justify-center" title="تشغيل/إيقاف الصوت">
                                <i class="fas fa-play"></i>
                            </button>
                            <div id="waveform-${postId}" class="waveform-post flex-grow mr-2">
                                </div>
                        </div>
                    `;
                } else if (type === 'raw') {
                    mediaHtml = `<div class="bg-gray-800 p-3 rounded-lg mt-3 flex items-center"><i class="fas fa-file-alt ml-2 text-blue-400"></i> ملف مرفق: <a href="${url}" target="_blank" class="text-blue-400 hover:underline mr-1">تحميل</a></div>`;
                }
            }


            const postDate = new Date(post.timestamp).toLocaleString('ar-EG', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            
            const optionsButtonHtml = isOwner ? `
                <div class="absolute top-4 left-4"> 
                    <button class="text-gray-400 hover:text-white p-1 rounded-full transition duration-300" onclick="openPostMenu('${post.postId}', '${post.userId}', event)">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            ` : '';
            
            // تحديد حالة زر الإعجاب
            const likeButtonClass = userHasLiked ? 'text-red-500 hover:text-red-400' : 'text-gray-400 hover:text-red-500';
            const likeIconClass = userHasLiked ? 'fas' : 'far'; // fas for solid (liked), far for regular (unliked)

            const postCard = `
                <div class="glass-post-card p-4 rounded-xl shadow-2xl relative" data-post-id="${post.postId}">
                    
                    ${optionsButtonHtml} 

                    <div class="flex items-center mb-3">
                        <img src="${post.user.profile_picture_url}" alt="${post.user.username}" class="w-10 h-10 rounded-full object-cover border-2 border-blue-500 ml-3">
                        <div>
                            <a href="/profile?user_id=${post.userId}" class="text-white font-semibold hover:text-blue-400">${post.user.username}</a>
                            <p class="text-gray-400 text-xs">${postDate}</p>
                        </div>
                    </div>

                    ${post.content.trim().length > 0 ? `<p class="text-gray-200 whitespace-pre-wrap mb-3">${post.content}</p>` : ''}
                    
                    ${mediaHtml}

                    <div class="flex justify-between items-center text-sm text-gray-400 mt-3 border-t border-gray-700 pt-3">
                        <span id="likes-count-${post.postId}"><i class="fas fa-heart text-red-500 ml-1"></i> ${post.likes || 0} إعجاب</span>
                        <span id="comments-count-${post.postId}"><i class="fas fa-comment ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                    </div>

                    <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
                        <button class="flex items-center ${likeButtonClass} transition duration-300 w-full justify-center" onclick="handleLike('${post.postId}', this)">
                            <i class="${likeIconClass} fa-thumbs-up ml-2"></i> إعجاب
                        </button>
                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center" onclick="handleComment('${post.postId}')">
                            <i class="fas fa-comment-dots ml-2"></i> تعليق
                        </button>
                    </div>
                </div>
            `;
            return postCard;
        }

        // ******************** 7. وظيفة جلب وعرض المنشورات ********************
        
        async function fetchAndDisplayPosts() {
            const loadingMessageHtml = '<div class="text-center text-gray-500 p-4">يتم تحميل المنشورات...</div>';
            postsFeed.innerHTML = loadingMessageHtml; 

            try {
                // 1. جلب بيانات البروفايل لتحديد الإعجابات
                const profileResponse = await fetch('/api/profile');
                if (profileResponse.ok) {
                    const profileData = await profileResponse.json();
                    currentUserId = profileData.id; 
                    currentUserProfilePic = profileData.profile_picture_url || currentUserProfilePic;
                }

                // 2. جلب المنشورات
                const postsResponse = await fetch('/api/posts');
                if (!postsResponse.ok) {
                    throw new Error('فشل جلب المنشورات من الخادم.');
                }
                const result = await postsResponse.json();

                if (result.posts.length === 0) {
                    postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات حتى الآن. كن أول من ينشر!</div>';
                } else {
                    postsFeed.innerHTML = '';
                    const audioPostsToInit = []; 

                    // 3. جلب حالة الإعجاب لكل منشور
                    const postsWithLikeStatusPromises = result.posts.map(async post => {
                        const isOwner = post.userId === currentUserId;
                        // تحقق من الإعجاب: نستخدم API منفصلة أو نفترض أن بيانات الإعجاب جزء من الـ post object.
                        // بما أن API جلب المنشورات لا ترجع حالة الإعجاب، يجب عمل طلب إضافي أو تعديل API /api/posts.
                        // في هذا الحل، سأفترض أننا سنقوم بجلب حالة الإعجاب لاحقاً
                        
                        // NOTE: سنعتمد على أن زر الإعجاب سيقوم بتحديث حالته عند الضغط عليه، ولتوفير الوقت سنترك حالة الإعجاب الأولية دائماً "لم يعجب"
                        // الأسلوب الأفضل: تعديل API /api/posts لترجع قائمة الـ Likes (أو Boolean is_liked)

                        // للتبسيط حالياً: نعتمد على زر الإعجاب الذي سيعمل على التبديل. ولجعل الأيقونة صحيحة عند التحميل، سأقوم بإنشاء API مساعدة.
                        
                        const likeStatusResponse = await fetch(`/api/posts/${post.postId}/likes/${currentUserId}`);
                        const likeStatusResult = likeStatusResponse.ok; // نفترض أن 200 تعني أنه معجب
                        
                        return { post, isOwner, userHasLiked: likeStatusResult };
                    });
                    
                    const postsWithLikeStatus = await Promise.all(postsWithLikeStatusPromises);


                    postsWithLikeStatus.forEach(({ post, isOwner, userHasLiked }) => {
                        postsFeed.innerHTML += createPostCard(post, isOwner, userHasLiked);
                        
                        if (post.media && post.media.type === 'audio') {
                            audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                        }
                    });
                    
                    audioPostsToInit.forEach(ap => {
                        initializePostWaveSurfer(ap.postId, ap.url);
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                postsFeed.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في جلب المنشورات.</div>';
            }
        }
        
        
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile')
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    const profilePicElement = document.getElementById('userProfilePic');
                    if (data && data.profile_picture_url) {
                        profilePicElement.src = data.profile_picture_url;
                        profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                        currentUserProfilePic = data.profile_picture_url; // حفظ الصورة للاستخدام في نافذة التعليق
                    }
                }).catch(console.error);
                
            fetchAndDisplayPosts();
        });
        
    </script>
</body>
</html>
