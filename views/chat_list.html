<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Aite">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <meta name="theme-color" content="#000000">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            /* إضافة مساحة سفلية لمنع الشريط السفلي من حجب المحتوى */
            padding-bottom: 60px; 
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .aite-title {
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800;
            letter-spacing: 0.1em; 
            color: #1DA1F2; /* لون شبيه بتويتر */
            text-shadow: 0 0 5px rgba(29, 161, 242, 0.5);
        }
        .text-blue-400 { color: #60a5fa; } 
        .bg-gray-800 { background-color: #242526; }
        .border-gray-700 { border-color: #3a3b3c; }

        /* الأنماط الخاصة بعرض الصوت (Wavesurfer) */
        .wavesurfer-container {
            width: 100%;
            height: 60px;
            cursor: pointer;
        }
    </style>
</head>
<body class="p-0 m-0">
    <header class="fixed top-0 left-0 right-0 z-10 glass-navbar shadow-lg">
        <div class="max-w-xl mx-auto flex justify-between items-center h-14 px-4">
            <h1 class="text-2xl aite-title">AITE</h1>
            <button class="text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-search text-xl"></i>
            </button>
        </div>
    </header>

    <div class="max-w-xl mx-auto pt-16 pb-16">
        <div class="bg-gray-800 p-4 border-b border-gray-700 mb-4">
            <div class="flex items-start space-x-3">
                <img id="userProfilePic" src="https://res.cloudinary.com/duixjs8az/image/upload/v1765009560/post_media/1765009560909-default_profile.png" alt="صورة المستخدم" class="w-10 h-10 rounded-full object-cover">
                <div class="flex-grow">
                    <textarea id="postContentInput" placeholder="ماذا يدور في ذهنك؟" rows="2" class="w-full bg-transparent text-white border-none focus:outline-none resize-none placeholder-gray-500 text-lg"></textarea>
                    
                    <div id="mediaPreview" class="mt-2 relative hidden">
                        <button id="removeMediaBtn" class="absolute top-1 right-1 bg-red-600 rounded-full p-1 text-white hover:bg-red-700 z-10">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                        <img id="imagePreview" class="max-h-60 w-full object-cover rounded-lg" src="" alt="معاينة المرفق" style="display: none;">
                        <video id="videoPreview" class="max-h-60 w-full object-cover rounded-lg" src="" controls style="display: none;"></video>
                        <div id="audioPreviewContainer" class="p-2 bg-gray-700 rounded-lg" style="display: none;">
                            <p class="text-sm text-gray-400">ملف صوتي جاهز للتحميل</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mt-3 border-t border-gray-700 pt-3">
                        <div class="flex space-x-3 text-blue-400">
                            <label for="mediaFileInput" class="cursor-pointer hover:text-blue-300 transition-colors">
                                <i class="fas fa-image text-xl"></i>
                            </label>
                            <input type="file" id="mediaFileInput" class="hidden" accept="image/*,video/*,audio/*">
                            
                            </div>
                        
                        <button id="postSubmitBtn" class="bg-blue-600 text-white font-bold py-1 px-4 rounded-full hover:bg-blue-700 disabled:opacity-50 transition-colors" disabled>
                            نشر
                        </button>
                    </div>
                    <div id="postError" class="text-red-500 text-sm mt-2 hidden"></div>
                </div>
            </div>
        </div>

        <div id="postsContainer" class="space-y-4">
            </div>
        
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-10 glass-navbar border-t border-gray-700 shadow-xl">
        <div class="max-w-xl mx-auto flex justify-around items-center h-14">
            <a href="#" class="text-blue-400 flex flex-col items-center hover:text-white transition-colors">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="#" class="text-gray-400 flex flex-col items-center hover:text-white transition-colors">
                <i class="fas fa-bell text-xl"></i>
                <span class="text-xs">الإشعارات</span>
            </a>
            <a href="#" class="text-gray-400 flex flex-col items-center hover:text-white transition-colors">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs">الملف</span>
            </a>
        </div>
    </nav>
    
    <div id="commentsModal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex justify-center items-center overflow-y-auto">
        <div class="bg-gray-900 w-full max-w-lg rounded-xl shadow-2xl m-4 md:m-8 max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-gray-900 z-10">
                <h2 class="text-xl font-bold">التعليقات</h2>
                <button id="closeCommentsModalBtn" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            
            <div id="modalPostContent" class="p-4 overflow-y-auto flex-grow">
                <div id="originalPostContainer"></div> 

                <div class="mt-4 border-t border-gray-800 pt-4">
                    <h3 class="text-lg font-semibold mb-3 text-gray-300">التعليقات (<span id="commentsCountDisplay">0</span>)</h3>
                    <div id="commentsList" class="space-y-3">
                        </div>
                </div>
            </div>

            <div class="p-3 border-t border-gray-700 sticky bottom-0 bg-gray-900">
                <div class="flex items-center space-x-2">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." class="flex-grow bg-gray-700 text-white rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="postCommentBtn" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-blue-700 disabled:opacity-50 transition-colors">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
                <div id="commentError" class="text-red-500 text-xs mt-1 hidden"></div>
            </div>
        </div>
    </div>


    <script>
        // ************************************
        //       المتغيرات والعناصر الأساسية
        // ************************************
        const postsContainer = document.getElementById('postsContainer');
        const commentsModal = document.getElementById('commentsModal');
        const closeCommentsModalBtn = document.getElementById('closeCommentsModalBtn');
        const modalPostContent = document.getElementById('modalPostContent');
        const originalPostContainer = document.getElementById('originalPostContainer');
        const commentsList = document.getElementById('commentsList');
        const newCommentInput = document.getElementById('newCommentInput');
        const postCommentBtn = document.getElementById('postCommentBtn');
        const commentsCountDisplay = document.getElementById('commentsCountDisplay');
        const commentError = document.getElementById('commentError');

        // عناصر إنشاء المنشور الجديد
        const postContentInput = document.getElementById('postContentInput');
        const mediaFileInput = document.getElementById('mediaFileInput');
        const postSubmitBtn = document.getElementById('postSubmitBtn');
        const mediaPreview = document.getElementById('mediaPreview');
        const removeMediaBtn = document.getElementById('removeMediaBtn');
        const imagePreview = document.getElementById('imagePreview');
        const videoPreview = document.getElementById('videoPreview');
        const audioPreviewContainer = document.getElementById('audioPreviewContainer');
        const postError = document.getElementById('postError');

        let currentUserId = null;
        let activePostId = null; // المعرف للمنشور المفتوح حالياً في الـ Modal

        // ************************************
        //       تعديل PWA: تسجيل عامل الخدمة
        // ************************************
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed: ', error);
                    });
            });
        }
        // ************************************

        // ************************************
        //            دوال مساعدة
        // ************************************

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            if (diffInSeconds < 60) return `${diffInSeconds} ثواني مضت`;
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} دقيقة مضت`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} ساعة مضت`;
            if (diffInSeconds < 2592000) return `${Math.floor(diffInSeconds / 86400)} يوم مضى`;
            
            // صيغة التاريخ والوقت إذا كانت أقدم من شهر
            return date.toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderMedia(mediaUrl, mediaType, postId) {
            let html = '';
            const isVideo = mediaType.startsWith('video');
            const isAudio = mediaType.startsWith('audio');
            
            if (isVideo) {
                html = `<video src="${mediaUrl}" controls class="w-full max-h-96 object-contain rounded-lg mt-3" preload="metadata"></video>`;
            } else if (isAudio) {
                // استخدام Wavesurfer.js لتشغيل الصوت
                html = `
                    <div class="wavesurfer-container mt-3 p-2 bg-gray-700 rounded-lg">
                        <div id="waveform-${postId}" class="w-full h-10"></div>
                        <button class="play-audio-btn mt-1 text-blue-400 hover:text-blue-300" data-post-id="${postId}" data-audio-url="${mediaUrl}">
                            <i class="fas fa-play"></i> تشغيل
                        </button>
                    </div>
                `;
            } else if (mediaType.startsWith('image')) {
                html = `<img src="${mediaUrl}" alt="صورة المرفق" class="w-full max-h-96 object-cover rounded-lg mt-3 cursor-pointer" onclick="openMediaModal('${mediaUrl}', '${mediaType}')">`;
            }

            return html;
        }

        // ************************************
        //            دوال المنشورات
        // ************************************

        function renderPost(post) {
            const isLiked = post.isLiked || false;
            const likeIconClass = isLiked ? 'fas text-red-500' : 'far text-gray-400';
            
            const postElement = document.createElement('div');
            postElement.className = 'bg-gray-800 p-4 rounded-lg shadow-md border border-gray-700';
            postElement.setAttribute('data-post-id', post.id);

            const mediaHtml = post.mediaUrl ? renderMedia(post.mediaUrl, post.mediaType, post.id) : '';

            postElement.innerHTML = `
                <div class="flex items-start space-x-3">
                    <img src="${post.profile_picture_url || 'DEFAULT_PROFILE_PIC_URL'}" alt="صورة بروفايل" class="w-10 h-10 rounded-full object-cover">
                    <div class="flex-grow">
                        <div class="flex justify-between items-start">
                            <p class="font-bold text-white">${post.username}</p>
                            <p class="text-sm text-gray-500">${formatTimestamp(post.timestamp)}</p>
                        </div>
                        <p class="text-gray-400 text-sm">@${post.username}</p>
                    </div>
                </div>
                
                <div class="mt-3">
                    <p class="text-white whitespace-pre-wrap">${post.content}</p>
                    ${mediaHtml}
                </div>
                
                <div class="flex justify-around items-center mt-4 border-t border-gray-700 pt-3 text-gray-400">
                    
                    <button class="flex items-center space-x-1 hover:text-blue-400 transition-colors comment-btn" data-post-id="${post.id}">
                        <i class="far fa-comment text-lg"></i>
                        <span class="text-sm">${post.commentsCount || 0}</span>
                    </button>

                    <button class="flex items-center space-x-1 hover:text-red-500 transition-colors like-btn" data-post-id="${post.id}" data-is-liked="${isLiked}">
                        <i class="${likeIconClass} fa-heart text-lg"></i>
                        <span class="text-sm like-count">${post.likesCount || 0}</span>
                    </button>
                    
                    <button class="flex items-center space-x-1 hover:text-green-500 transition-colors">
                        <i class="fas fa-share text-lg"></i>
                        <span class="text-sm">مشاركة</span>
                    </button>
                </div>
            `;
            
            // إعداد Wavesurfer إذا كان هناك صوت
            if (post.mediaType && post.mediaType.startsWith('audio')) {
                // يتم إعداد Wavesurfer بعد إضافة العنصر إلى DOM
                setTimeout(() => {
                    const waveformEl = document.getElementById(`waveform-${post.id}`);
                    if (waveformEl) {
                        const wavesurfer = Wavesurfer.create({
                            container: `#waveform-${post.id}`,
                            waveColor: '#A0A0A0',
                            progressColor: '#1DA1F2',
                            cursorColor: '#FFFFFF',
                            barWidth: 3,
                            barRadius: 3,
                            barGap: 1,
                            height: 40,
                            backend: 'MediaElement',
                            responsive: true
                        });
                        
                        wavesurfer.load(post.mediaUrl);

                        const playBtn = postElement.querySelector(`.play-audio-btn`);
                        
                        playBtn.addEventListener('click', () => {
                            wavesurfer.playPause();
                            playBtn.querySelector('i').className = wavesurfer.isPlaying() ? 'fas fa-pause' : 'fas fa-play';
                        });

                        wavesurfer.on('finish', () => {
                            playBtn.querySelector('i').className = 'fas fa-play';
                        });
                    }
                }, 0);
            }

            return postElement;
        }

        async function fetchAndDisplayPosts() {
            postsContainer.innerHTML = '<div class="text-center text-gray-500 p-4">جاري تحميل المنشورات...</div>';
            try {
                const response = await fetch('/api/posts');
                if (!response.ok) throw new Error('Failed to fetch posts');
                
                const data = await response.json();
                
                postsContainer.innerHTML = '';
                if (data.posts && data.posts.length > 0) {
                    data.posts.forEach(post => {
                        postsContainer.appendChild(renderPost(post));
                    });
                    attachPostEventListeners();
                } else {
                    postsContainer.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات حتى الآن.</div>';
                }

            } catch (error) {
                console.error('Error fetching posts:', error);
                postsContainer.innerHTML = '<div class="text-center text-red-500 p-4">فشل في تحميل المنشورات.</div>';
            }
        }
        
        async function handleLike(event) {
            const button = event.currentTarget;
            const postId = button.getAttribute('data-post-id');
            const isLiked = button.getAttribute('data-is-liked') === 'true';
            const likeCountSpan = button.querySelector('.like-count');
            const icon = button.querySelector('i');
            
            try {
                const response = await fetch(`/api/posts/${postId}/like`);

                if (response.ok) {
                    const data = await response.json();
                    let currentCount = parseInt(likeCountSpan.textContent) || 0;
                    
                    if (data.action === 'liked') {
                        likeCountSpan.textContent = currentCount + 1;
                        icon.className = 'fas fa-heart text-lg text-red-500';
                        button.setAttribute('data-is-liked', 'true');
                    } else if (data.action === 'unliked') {
                        likeCountSpan.textContent = currentCount > 0 ? currentCount - 1 : 0;
                        icon.className = 'far fa-heart text-lg text-gray-400';
                        button.setAttribute('data-is-liked', 'false');
                    }
                } else {
                    alert('فشل في تسجيل الإعجاب. يرجى تسجيل الدخول.');
                }
            } catch (error) {
                console.error('Like error:', error);
            }
        }

        function attachPostEventListeners() {
            document.querySelectorAll('.like-btn').forEach(button => {
                button.removeEventListener('click', handleLike);
                button.addEventListener('click', handleLike);
            });
            
            document.querySelectorAll('.comment-btn').forEach(button => {
                button.removeEventListener('click', openCommentsModal);
                button.addEventListener('click', openCommentsModal);
            });
        }

        // ************************************
        //           دوال التعليقات (Modal)
        // ************************************
        
        async function openCommentsModal(event) {
            const postId = event.currentTarget.getAttribute('data-post-id');
            activePostId = postId;
            
            // تنظيف محتوى الـ Modal
            originalPostContainer.innerHTML = '';
            commentsList.innerHTML = '<div class="text-center text-gray-500">جاري تحميل المنشور...</div>';
            commentsCountDisplay.textContent = '0';
            newCommentInput.value = '';
            commentError.classList.add('hidden');

            commentsModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // منع تمرير الخلفية

            await fetchPostAndComments(postId);
        }

        function closeCommentsModal() {
            commentsModal.classList.add('hidden');
            document.body.style.overflow = 'auto'; // إعادة تفعيل تمرير الخلفية
            activePostId = null;
        }

        async function fetchPostAndComments(postId) {
            try {
                // جلب بيانات المنشور
                const postResponse = await fetch(`/api/posts/${postId}`);
                if (!postResponse.ok) throw new Error('فشل جلب المنشور.');
                const postData = await postResponse.json();
                
                // جلب التعليقات
                const commentsResponse = await fetch(`/api/posts/${postId}/comments`);
                if (!commentsResponse.ok) throw new Error('فشل جلب التعليقات.');
                const commentsData = await commentsResponse.json();
                
                // عرض المنشور الأصلي في الـ Modal (يتم عرضه بدون الأزرار التفاعلية هنا)
                originalPostContainer.innerHTML = renderPostForModal(postData.post);
                
                // عرض التعليقات
                displayComments(commentsData.comments);

                // تحديث عداد التعليقات في الـ Modal
                commentsCountDisplay.textContent = commentsData.comments.length;

            } catch (error) {
                console.error('Error in fetching post/comments:', error);
                commentsList.innerHTML = '<div class="text-center text-red-500">حدث خطأ أثناء تحميل المنشور أو التعليقات.</div>';
            }
        }
        
        function renderPostForModal(post) {
            // نسخة مبسطة لعرض المنشور في الـ Modal
             const mediaHtml = post.mediaUrl ? renderMedia(post.mediaUrl, post.mediaType, post.id + '-modal') : '';

            return `
                <div class="p-3 bg-gray-800 rounded-xl mb-4 border border-gray-700">
                    <div class="flex items-start space-x-3">
                        <img src="${post.profile_picture_url || 'DEFAULT_PROFILE_PIC_URL'}" alt="صورة بروفايل" class="w-8 h-8 rounded-full object-cover">
                        <div class="flex-grow">
                            <p class="font-bold text-white text-sm">${post.username}</p>
                            <p class="text-xs text-gray-500">@${post.username} • ${formatTimestamp(post.timestamp)}</p>
                        </div>
                    </div>
                    <p class="mt-2 text-white whitespace-pre-wrap">${post.content}</p>
                    ${mediaHtml}
                </div>
            `;
        }

        function displayComments(comments) {
            commentsList.innerHTML = '';
            if (comments.length === 0) {
                commentsList.innerHTML = '<div class="text-center text-gray-500 pt-4">كن أول من يعلق!</div>';
                return;
            }

            comments.forEach(comment => {
                const commentEl = document.createElement('div');
                commentEl.className = 'p-3 bg-gray-800 rounded-lg border border-gray-700';
                commentEl.innerHTML = `
                    <div class="flex items-start space-x-2">
                        <img src="${comment.profile_picture_url || 'DEFAULT_PROFILE_PIC_URL'}" alt="صورة بروفايل" class="w-8 h-8 rounded-full object-cover">
                        <div class="flex-grow">
                            <div class="flex justify-between items-start">
                                <p class="font-bold text-white text-sm">${comment.username}</p>
                                <p class="text-xs text-gray-500">${formatTimestamp(comment.timestamp)}</p>
                            </div>
                            <p class="text-gray-400 text-sm whitespace-pre-wrap">${comment.content}</p>
                        </div>
                    </div>
                `;
                commentsList.appendChild(commentEl);
            });
        }
        
        async function postComment() {
            if (!activePostId) return;
            const content = newCommentInput.value.trim();
            if (content.length === 0) {
                commentError.textContent = 'التعليق لا يمكن أن يكون فارغاً.';
                commentError.classList.remove('hidden');
                return;
            }

            commentError.classList.add('hidden');
            postCommentBtn.disabled = true;
            postCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i>'; // أيقونة التحميل

            try {
                const response = await fetch(`/api/posts/${activePostId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                if (response.ok) {
                    newCommentInput.value = '';
                    await fetchPostAndComments(activePostId); // إعادة تحميل التعليقات
                    
                    // تحديث عداد التعليقات في الصفحة الرئيسية (تحميل جميع المنشورات مرة أخرى)
                    fetchAndDisplayPosts();
                } else if (response.status === 401) {
                    commentError.textContent = 'يرجى تسجيل الدخول أولاً للتعليق.';
                    commentError.classList.remove('hidden');
                } else {
                    commentError.textContent = 'فشل في إضافة التعليق.';
                    commentError.classList.remove('hidden');
                }

            } catch (error) {
                commentError.textContent = 'فشل الاتصال بالخادم.';
                commentError.classList.remove('hidden');
            } finally {
                postCommentBtn.disabled = false;
                postCommentBtn.innerHTML = '<i class="fas fa-paper-plane text-lg"></i>'; 
            }
        }
        
        // ************************************
        //            دوال إنشاء المنشور
        // ************************************

        function validatePostInput() {
            const content = postContentInput.value.trim();
            const mediaFile = mediaFileInput.files[0];
            postSubmitBtn.disabled = (content.length === 0 && !mediaFile);
        }

        function handleMediaChange() {
            const file = mediaFileInput.files[0];
            imagePreview.style.display = 'none';
            videoPreview.style.display = 'none';
            audioPreviewContainer.style.display = 'none';
            mediaPreview.classList.add('hidden');
            postError.classList.add('hidden');

            if (file) {
                const fileURL = URL.createObjectURL(file);
                mediaPreview.classList.remove('hidden');
                
                if (file.type.startsWith('image/')) {
                    imagePreview.src = fileURL;
                    imagePreview.style.display = 'block';
                } else if (file.type.startsWith('video/')) {
                    videoPreview.src = fileURL;
                    videoPreview.style.display = 'block';
                } else if (file.type.startsWith('audio/')) {
                    audioPreviewContainer.style.display = 'block';
                } else {
                    postError.textContent = 'نوع الملف غير مدعوم.';
                    postError.classList.remove('hidden');
                    // إزالة الملف غير المدعوم
                    mediaFileInput.value = '';
                    mediaPreview.classList.add('hidden');
                }
            }
            validatePostInput();
        }

        async function createPost() {
            const content = postContentInput.value.trim();
            const mediaFile = mediaFileInput.files[0];
            
            if (content.length === 0 && !mediaFile) return;

            postSubmitBtn.disabled = true;
            postSubmitBtn.textContent = 'نشر...';
            postError.classList.add('hidden');

            const formData = new FormData();
            formData.append('content', content);
            if (mediaFile) {
                formData.append('media', mediaFile);
            }

            try {
                const response = await fetch('/api/posts', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    // مسح الحقول وإعادة تعيين المعاينة
                    postContentInput.value = '';
                    mediaFileInput.value = '';
                    handleMediaChange(); 
                    
                    // إعادة تحميل المنشورات
                    await fetchAndDisplayPosts();
                } else if (response.status === 401) {
                    postError.textContent = 'يرجى تسجيل الدخول للنشر.';
                    postError.classList.remove('hidden');
                } else {
                    const errorData = await response.json();
                    postError.textContent = errorData.error || 'فشل في إنشاء المنشور.';
                    postError.classList.remove('hidden');
                }
            } catch (error) {
                postError.textContent = 'فشل الاتصال بالخادم.';
                postError.classList.remove('hidden');
                console.error('Post creation error:', error);
            } finally {
                postSubmitBtn.textContent = 'نشر';
                validatePostInput(); // قد يعيد تفعيل الزر إذا كان هناك محتوى
            }
        }
        
        // ************************************
        //           المستمعات (Listeners)
        // ************************************

        // Comment Modal Listeners
        closeCommentsModalBtn.addEventListener('click', closeCommentsModal);
        commentsModal.addEventListener('click', (e) => {
            if (e.target === commentsModal) closeCommentsModal();
        });
        postCommentBtn.addEventListener('click', postComment);
        newCommentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                postComment();
            }
        });

        // New Post Listeners
        postContentInput.addEventListener('input', validatePostInput);
        mediaFileInput.addEventListener('change', handleMediaChange);
        removeMediaBtn.addEventListener('click', (e) => {
            e.preventDefault();
            mediaFileInput.value = '';
            handleMediaChange();
        });
        postSubmitBtn.addEventListener('click', createPost);


        // عند تحميل محتوى الصفحة بالكامل
        document.addEventListener('DOMContentLoaded', () => {
            // جلب بيانات المستخدم وعرض صورة البروفايل
            fetch('/api/profile')
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    const profilePicElement = document.getElementById('userProfilePic');
                    if (data && data.profile_picture_url) {
                        profilePicElement.src = data.profile_picture_url;
                        profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                        currentUserId = data.id; // حفظ معرف المستخدم الحالي
                    }
                }).catch(console.error);
                
            fetchAndDisplayPosts();
        });
        
    </script>
</body>
</html>
