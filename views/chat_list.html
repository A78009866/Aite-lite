<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        /* تنسيقات شريط الريلز المقترح */
        .reels-suggestion-container {
            margin: 15px 0;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: #050505;
        }

        .reels-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 10px 16px;
        }

        .reels-scroll-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 16px;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }
        .reels-scroll-row::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .mini-reel-card {
            min-width: 110px;
            max-width: 110px;
            height: 190px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .mini-reel-card:active {
            transform: scale(0.97);
        }

        .mini-reel-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mini-reel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 8px;
            pointer-events: none;
        }

        .mini-reel-user {
            font-size: 11px;
            color: white;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
            margin-bottom: 2px;
        }

        .mini-reel-views {
            font-size: 10px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* نهاية تنسيقات الريلز */

        /* Header & Nav */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .nav-item {
            color: #b0b3b8;
            transition: color 0.2s;
            text-align: center;
            font-size: 1.2rem; 
        }
        .nav-item:hover, .nav-item.active {
            color: #1b74e4; 
        }
        .nav-item.active i {
             color: #1b74e4; 
        }

        /* Post Card */
        .post-card {
            background-color: #000000;
            border-radius: 0; 
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 16px; 
        }
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: 10px;
            border: 1px solid #333;
        }
        .post-content {
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.5;
            padding: 0 16px; 
            white-space: pre-wrap; 
            color: #fff;
        }
        .post-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0; 
            object-fit: cover;
            max-height: 600px;
            background-color: #111;
        }
        .post-video {
            width: 100%;
            max-height: 600px;
            background-color: #000;
        }
        .post-actions {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #222; 
            padding-top: 10px;
            margin: 0 16px; 
        }
        .action-btn {
            color: #b0b3b8;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        .action-btn:hover {
            color: #e4e6eb;
        }
        .action-btn.liked {
            color: #e41e3f; 
        }
        .verified-badge {
            width: 14px;
            height: 14px;
            margin-right: 4px;
            vertical-align: middle;
        }

        /* Audio Player custom style */
        .audio-container {
            background: #18191a;
            border-radius: 10px;
            padding: 10px;
            margin: 0 16px 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .play-pause-btn {
            background: #2d88ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .waveform {
            flex-grow: 1;
        }

        /* Mobile bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #000000; 
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }
        .bottom-nav a {
            color: #b0b3b8;
            font-size: 1.4rem;
            position: relative;
        }
        .bottom-nav a.active {
            color: #1b74e4;
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #e41e3f;
            color: white;
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 50%;
            display: none; 
        }
        
        /* Create Post Area */
        .create-post-container {
            background-color: #000;
            border-bottom: 8px solid #111; 
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .create-post-input {
            flex-grow: 1;
            background-color: #18191a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 10px 15px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .create-post-input:hover {
            background-color: #242526;
        }

        /* Sidebar (Desktop) */
        .sidebar {
            display: none; 
            position: fixed;
            top: 60px;
            right: 0;
            width: 280px;
            height: calc(100vh - 60px);
            padding: 20px;
            border-left: 1px solid #333;
            overflow-y: auto;
        }
        @media (min-width: 1024px) {
            .sidebar { display: block; }
            main { margin-right: 280px; } 
        }

    </style>
</head>
<body>

    <header class="flex justify-between items-center px-4 py-3 shadow-md">
       <div class="flex items-center gap-3">
          <img src="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-gray-600">
          <h1 class="text-xl font-bold tracking-wider" style="font-family: 'Montserrat', sans-serif;">Trimer</h1>
       </div>
       <div class="flex items-center gap-4">
           <a href="/search" class="text-gray-300 hover:text-white text-lg"><i class="fas fa-search"></i></a>
           <a href="/notifications" class="text-gray-300 hover:text-white text-lg relative">
               <i class="fas fa-bell"></i>
               <span id="notifBadge" class="badge"></span>
           </a>
           <a href="/chat_list_messages" class="text-gray-300 hover:text-white text-lg relative">
               <i class="fas fa-comment-dots"></i>
               <span id="msgBadge" class="badge"></span>
           </a>
       </div>
    </header>

    <div class="sidebar">
        <div class="flex items-center gap-3 mb-6 cursor-pointer hover:bg-white/5 p-2 rounded transition" onclick="location.href='/profile'">
            <img id="sidebarAvatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover">
            <span id="sidebarName" class="font-bold text-sm">...</span>
        </div>
        <div class="space-y-2">
            <a href="/friends" class="flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2 rounded transition">
                <i class="fas fa-user-friends text-blue-400 w-6"></i> الأصدقاء
                <span id="friendReqBadge" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden"></span>
            </a>
            <a href="/saved" class="flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2 rounded transition">
                <i class="fas fa-bookmark text-purple-400 w-6"></i> المحفوظات
            </a>
            <a href="/reels" class="flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2 rounded transition">
                <i class="fas fa-clapperboard text-pink-500 w-6"></i> ريلز
            </a>
            <a href="/families" class="flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2 rounded transition">
                <i class="fas fa-users text-green-400 w-6"></i> العائلات
            </a>
            <a href="/settings" class="flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2 rounded transition">
                <i class="fas fa-cog text-gray-400 w-6"></i> الإعدادات
            </a>
        </div>
        <div class="mt-8 border-t border-gray-700 pt-4 text-xs text-gray-500">
            &copy; 2025 Trimer
        </div>
    </div>

    <main class="max-w-2xl mx-auto pt-2">
        
        <div class="create-post-container" onclick="window.location.href='/create_post'">
             <img id="createPostAvatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover border border-gray-700">
             <div class="create-post-input">بم تفكر؟</div>
             <div class="text-green-500 text-xl"><i class="fas fa-image"></i></div>
        </div>

        <div id="postsFeed" class="pb-16">
            <div class="text-center text-gray-500 mt-10"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
        </div>

    </main>

    <nav class="bottom-nav lg:hidden">
        <a href="/chat_list" class="active"><i class="fas fa-home"></i></a>
        <a href="/reels"><i class="fas fa-clapperboard"></i></a>
        <a href="/create_post" class="text-blue-500"><i class="fas fa-plus-circle text-3xl -mt-1"></i></a>
        <a href="/families"><i class="fas fa-users"></i></a>
        <a href="/profile"><i class="fas fa-user"></i></a>
    </nav>

    <script>
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        const postsFeed = document.getElementById('postsFeed');
        let currentUser = null;

        // دالة لخلط المصفوفة عشوائياً (للريلز)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // دالة إنشاء HTML لشريط الريلز المقترح
        function createSuggestedReelsHtml(reels) {
            if (!reels || reels.length === 0) return '';
            
            // نأخذ 5 ريلز عشوائية
            const randomReels = shuffleArray([...reels]).slice(0, 5);
            
            let cardsHtml = randomReels.map(reel => `
                <div class="mini-reel-card" onclick="window.location.href='/reels?id=${reel.reelId}'">
                    <video src="${reel.videoUrl}" preload="metadata" muted loop onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0;"></video>
                    <div class="mini-reel-overlay">
                        <div class="mini-reel-user">@${escapeHtml(reel.user.username)}</div>
                        <div class="mini-reel-views"><i class="fas fa-play"></i> ريلز</div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="reels-suggestion-container">
                    <div class="reels-header">
                        <h3 class="text-white font-bold text-sm"><i class="fas fa-clapperboard text-pink-500 ml-2"></i> ريلز مقترحة</h3>
                        <a href="/reels" class="text-xs text-blue-400">عرض الكل</a>
                    </div>
                    <div class="reels-scroll-row">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        // الدالة الرئيسية لجلب البيانات
        async function fetchAndDisplayPosts() {
            try {
                // جلب المنشورات + الريلز في وقت واحد
                const [postsRes, reelsRes] = await Promise.all([
                    fetch('/api/posts'),
                    fetch('/api/reels/feed')
                ]);

                const postsResult = await postsRes.json();
                const reelsResult = await reelsRes.json(); // قد يفشل إذا لم يكن مسجلاً ولكن نحن في الرئيسية

                postsFeed.innerHTML = '';

                if (postsRes.ok && postsResult.ok) {
                    const posts = postsResult.posts;
                    currentUser = postsResult.currentUser; // Assuming endpoint returns this

                    // تحديث صور المستخدم الحالي في الواجهة
                    if (currentUser) {
                        const avatarUrl = currentUser.profile_picture_url || 'https://via.placeholder.com/40';
                        document.getElementById('createPostAvatar').src = avatarUrl;
                        document.getElementById('sidebarAvatar').src = avatarUrl;
                        document.getElementById('sidebarName').textContent = currentUser.username;
                    }

                    // التحقق من التوثيق للمستخدمين أصحاب المنشورات
                    const userIds = [...new Set(posts.map(p => p.userId))];
                    const profileMap = {};
                    // نحاول جلب بروفايلات لتحديد التوثيق (يمكن تحسين هذا في الباك اند لاحقاً)
                    try {
                        const profilePromises = userIds.map(uid => fetch(`/api/profile?userId=${encodeURIComponent(uid)}`).then(r => r.ok ? r.json() : null).catch(() => null));
                        const profileResults = await Promise.all(profilePromises);
                        profileResults.forEach(pr => { if (pr && pr.ok) profileMap[pr.id] = pr; });
                    } catch (e) {}

                    const audioPostsToInit = [];
                    const reelsList = (reelsRes.ok && reelsResult.ok) ? reelsResult.reels : [];
                    const suggestedReelsHtml = createSuggestedReelsHtml(reelsList);
                    let reelsInserted = false;

                    if (posts.length === 0) {
                        postsFeed.innerHTML = '<div class="text-center text-gray-500 p-10">لا توجد منشورات. تابع أصدقاء جدد!</div>';
                        if(reelsList.length > 0) postsFeed.innerHTML += suggestedReelsHtml;
                        return;
                    }

                    posts.forEach((post, index) => {
                        const prof = profileMap[post.userId];
                        if (prof) { 
                            post.user = post.user || {}; 
                            post.user.is_verified = !!prof.is_verified; 
                        }

                        // إضافة المنشور
                        postsFeed.innerHTML += createPostCard(post);

                        // تجميع ملفات الصوت للتشغيل لاحقاً
                        if (post.media && post.media.type === 'audio') {
                            audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                        }

                        // حقن الريلز بعد المنشور رقم 3 (index 2)
                        if (index === 2 && reelsList.length > 0 && !reelsInserted) {
                            postsFeed.innerHTML += suggestedReelsHtml;
                            reelsInserted = true;
                        }
                    });

                    // إذا كانت المنشورات قليلة ولم يتم إدراج الريلز
                    if (!reelsInserted && reelsList.length > 0) {
                        postsFeed.innerHTML += suggestedReelsHtml;
                    }

                    // تهيئة مشغلات الصوت
                    setTimeout(() => {
                        audioPostsToInit.forEach(ap => {
                            initializePostWaveSurfer(ap.postId, ap.url);
                        });
                    }, 100);

                } else {
                    postsFeed.innerHTML = '<div class="text-center text-red-500 mt-10">فشل تحميل المنشورات</div>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                postsFeed.innerHTML = '<div class="text-center text-red-500 mt-10">حدث خطأ في الاتصال</div>';
            }
        }

        function createPostCard(post) {
            const isLiked = post.is_liked ? 'liked' : '';
            const heartIcon = post.is_liked ? 'fas fa-heart' : 'far fa-heart';
            const likeCount = post.likes || 0;
            const commentCount = post.commentsCount || 0;
            const userPic = post.user.profile_picture_url || 'https://via.placeholder.com/40';
            const username = escapeHtml(post.user.username);
            
            let verifiedBadge = '';
            if (post.user.is_verified) {
                verifiedBadge = `<img src="${VERIFIED_IMG_URL}" class="verified-badge" alt="Verified">`;
            }

            let mediaHtml = '';
            if (post.media) {
                if (post.media.type === 'image') {
                    mediaHtml = `<img src="${post.media.url}" class="post-image" loading="lazy" onclick="window.location.href='/post_details?postId=${post.postId}'">`;
                } else if (post.media.type === 'video') {
                    mediaHtml = `<video src="${post.media.url}" class="post-video" controls preload="metadata"></video>`;
                } else if (post.media.type === 'audio') {
                    mediaHtml = `
                        <div class="audio-container">
                             <button class="play-pause-btn" id="playBtn-${post.postId}" onclick="togglePostAudio('${post.postId}')">
                                <i class="fas fa-play"></i>
                             </button>
                             <div id="waveform-${post.postId}" class="waveform"></div>
                        </div>
                    `;
                }
            }

            // تحويل التاريخ
            const date = new Date(post.timestamp);
            const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
            const dateString = date.toLocaleDateString();

            return `
            <div class="post-card">
                <div class="post-header">
                    <img src="${userPic}" class="post-avatar" onclick="window.location.href='/profile?userId=${post.userId}'">
                    <div class="mr-3">
                        <div class="font-bold text-sm text-white flex items-center">
                            ${username} ${verifiedBadge}
                        </div>
                        <div class="text-xs text-gray-500">${dateString} ${timeString}</div>
                    </div>
                </div>
                <div class="post-content dir-auto">${escapeHtml(post.content)}</div>
                ${mediaHtml}
                <div class="post-actions">
                    <button class="action-btn ${isLiked}" onclick="toggleLike('${post.postId}', this)">
                        <i class="${heartIcon}"></i> <span class="like-count">${likeCount}</span>
                    </button>
                    <button class="action-btn" onclick="window.location.href='/post_details?postId=${post.postId}'">
                        <i class="far fa-comment"></i> <span>${commentCount}</span>
                    </button>
                    <button class="action-btn" onclick="sharePost('${post.postId}')">
                        <i class="fas fa-share"></i>
                    </button>
                </div>
            </div>
            `;
        }

        // --- دوال التفاعل (Like, Audio, Heartbeat) ---

        async function toggleLike(postId, btn) {
            const icon = btn.querySelector('i');
            const span = btn.querySelector('.like-count');
            let current = parseInt(span.textContent);
            
            if (btn.classList.contains('liked')) {
                // Unlike
                btn.classList.remove('liked');
                icon.classList.remove('fas', 'text-red-500'); // removed specific color class if used in CSS
                icon.classList.add('far');
                span.textContent = Math.max(0, current - 1);
            } else {
                // Like
                btn.classList.add('liked');
                icon.classList.remove('far');
                icon.classList.add('fas');
                span.textContent = current + 1;
            }

            try {
                await fetch(`/api/posts/${postId}/like`, { method: 'POST' });
            } catch (e) { console.error(e); }
        }

        // WaveSurfer Logic
        const wavesurfers = {};
        function initializePostWaveSurfer(postId, url) {
            if (wavesurfers[postId]) return;
            const container = document.querySelector(`#waveform-${postId}`);
            if(!container) return;

            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4b5563',
                progressColor: '#3b82f6',
                cursorColor: 'transparent',
                barWidth: 3,
                barRadius: 3,
                responsive: true,
                height: 40,
            });
            ws.load(url);
            ws.on('finish', () => {
                const btn = document.getElementById(`playBtn-${postId}`);
                if(btn) btn.innerHTML = '<i class="fas fa-play"></i>';
            });
            wavesurfers[postId] = ws;
        }

        function togglePostAudio(postId) {
            const ws = wavesurfers[postId];
            if (!ws) return;
            const btn = document.getElementById(`playBtn-${postId}`);
            
            // Pause others
            Object.keys(wavesurfers).forEach(id => {
                if(id !== postId) {
                    wavesurfers[id].pause();
                    const otherBtn = document.getElementById(`playBtn-${id}`);
                    if(otherBtn) otherBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            });

            ws.playPause();
            if (ws.isPlaying()) {
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function sharePost(postId) {
            const url = window.location.origin + '/post_details?postId=' + postId;
            if (navigator.share) {
                navigator.share({ title: 'Trimer Post', url: url }).catch(()=>{});
            } else {
                navigator.clipboard.writeText(url);
                alert('تم نسخ الرابط');
            }
        }

        // Auto Run
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndDisplayPosts();
        });

        // Notifications & Badges
        (function() {
          fetch('/api/notifications/unread_count', { credentials: 'include' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const nb = document.getElementById('notifBadge');
                if (d.count > 0) { 
                  nb.style.display = 'inline-flex'; 
                  nb.textContent = d.count > 99 ? '99+' : String(d.count); 
                }
              }
            }).catch(()=>{});

          fetch('/api/messages/unread_total', { credentials: 'include' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const totalUnread = d.totalUnread || 0;
                const msgBadge = document.getElementById('msgBadge');
                if (totalUnread > 0) {
                  msgBadge.style.display = 'inline-flex';
                  msgBadge.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
                }
              }
            }).catch(()=>{});

          fetch('/api/friends/requests_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const fr = document.getElementById('friendReqBadge');
                if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); }
              }
            }).catch(()=>{});
        })();

        // Heartbeat
        function sendHeartbeat() {
            fetch('/api/status/heartbeat', { method: 'POST' })
                .then(r => r.json())
                .catch(err => console.error('Heartbeat failed', err));
        }
        sendHeartbeat();
        setInterval(sendHeartbeat, 60000);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                sendHeartbeat();
            }
        });

        // Helpers
        function escapeHtml(s) {
            if (!s && s !== 0) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
