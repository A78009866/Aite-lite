<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* خلفية سوداء بالكامل وخط أساسي داكن */
        body {
            background-color: #000000;
            color: #e4e6eb; /* لون نص فاتح للثيم الداكن */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* تأثير الزجاج (Glassmorphism) للنافبار */
        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5); /* لون داكن مع شفافية */
            backdrop-filter: blur(10px); /* تأثير التمويه الزجاجي */
            -webkit-backdrop-filter: blur(10px); /* دعم متصفحات الويب كيت */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* خط فاصل خفيف */
        }

        /* إخفاء شريط التمرير للصفحة الرئيسية */
        .main-content {
            overflow-y: hidden; 
        }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center">
                    <i class="fas fa-plus ml-2"></i>
                    إنشاء منشور
                </button>
            </div>
            
            <div class="flex-grow flex justify-center">
                <a href="#" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300">
                    Aite
                </a>
            </div>
            
            <div class="flex items-center">
                <a href="/profile" class="relative">
                    <img src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300">
                </a>
            </div>

        </nav>
    </header>

    <main class="main-content max-w-6xl mx-auto p-4 flex flex-col items-center justify-start min-h-[calc(100vh-64px)]">
        
        <div class="text-center mt-20 p-8 rounded-xl max-w-lg">
            <h1 class="text-4xl font-bold mb-4 text-gray-200">مرحباً بك في Aite!</h1>
            <p class="text-gray-400 text-lg">هذا هو الجزء الرئيسي من الصفحة، وسنملؤه بالمحتوى لاحقاً.</p>
            <i class="fas fa-hammer text-6xl text-blue-500 mt-6"></i>
        </div>

    </main>
    
</body>
</html>
