<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="/https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .glass-comment-modal-content {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-modal-bg { background-color: rgba(0,0,0,0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .media-container { max-height: 80vh; width: auto; }

        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .waveform-post { height: 60px; background-color: #0f172a; border-radius: 6px; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-animate-in { animation: modalFadeIn 0.3s ease-out; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .create-option-card { background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); transition:all .3s; }
        .create-option-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); border-color: rgba(59,130,246,0.5); }

        #notifBadge, #msgBadge, #friendReqBadge {
          position: absolute; top: -6px; left: -6px; min-width: 18px; height: 18px; padding: 0 6px; background: #ef4444; color: #fff; font-size: 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; line-height: 1;
        }

        .avatar-with-dot { position: relative; display: inline-flex; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border: 2px solid #000; border-radius: 999px; box-shadow: 0 0 6px rgba(34,197,94,0.6); z-index: 10; }
        .online-dot-small { width: 10px; height: 10px; bottom: 1px; right: 1px; border-width: 1.5px; }

        .verified-badge-img { display:inline-block; width:18px; height:18px; border-radius:999px; margin-left:6px; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.06); vertical-align:middle; }

        /* Comments Bottom Sheet */
        .overlay-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: none; opacity: 1; transition: opacity 0.22s ease; }
        .overlay-backdrop.open { display: block; }

        .comments-sheet {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 60vh;
          max-height: 80vh;
          background: linear-gradient(180deg, rgba(10,10,12,0.95), rgba(16,16,18,0.98));
          border-radius: 16px 16px 0 0;
          transform: translateY(100%);
          transition: transform 0.28s cubic-bezier(.2,.9,.2,1);
          z-index: 50;
          display: flex;
          flex-direction: column;
          box-shadow: 0 -20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
          overflow: hidden;
          will-change: transform;
          touch-action: none;
        }
        .comments-sheet.open { transform: translateY(0%); }
        /* when input opens: expand to full viewport so keyboard doesn't cover footer */
        .comments-sheet.input-open { height: 100vh; max-height: 100vh; bottom: 0; }

        .comments-sheet .sheet-header { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:space-between; }
        .comments-sheet .sheet-drag { width: 44px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.06); margin: 6px auto 0; touch-action: none; cursor: grab; }
        .comments-sheet .sheet-drag.dragging { cursor: grabbing; }

        .comments-sheet .sheet-body { padding: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .comments-sheet .sheet-footer { position: absolute; bottom: env(safe-area-inset-bottom, 10px); left: 0; right: 0; padding: 10px; border-top: 1px solid rgba(255,255,255,0.03); background: linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.4)); }
        .comments-sheet .comment-row { display:flex; gap:12px; align-items:flex-start; }
        .comments-sheet .comment-row img { width:36px;height:36px;border-radius:999px;object-fit:cover; }
        .comments-sheet .comment-bubble { background: rgba(255,255,255,0.03); padding:10px 12px; border-radius:10px; color:#e6e7ea; font-size:14px; max-width: 100%; }
        .comment-input { display:flex; gap:8px; align-items:center; }
        .comment-input input[type="text"] { flex:1; background:#111; color:#fff; border-radius:999px; padding:10px 14px; border:1px solid rgba(255,255,255,0.04); outline:none; font-size:14px; }
        .comment-input button { background: linear-gradient(180deg,#007AFF,#00D4FF); color:#000; padding:8px 12px; font-weight:700; border-radius:999px; border:none; }

        @media (min-width: 900px) {
          .comments-sheet { width: 720px; left: 50%; transform: translate(-50%, 100%); border-radius: 12px 12px 12px 12px; }
          .comments-sheet.open { transform: translate(-50%, 0%); }
          .comments-sheet.input-open { transform: translate(-50%, 0%); height: 80vh; max-height: 80vh; }
        }

        /* small tweaks for icons */
        .post-like-button .like-icon { margin-left: 0.5rem; }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">

            <div class="flex items-center">
                <button id="profileMenuButton" class="relative block" onclick="toggleProfileDropdown(event)">
                    <span class="avatar-with-dot">
                      <img id="userProfilePic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300 cursor-pointer">
                      <span id="meOnlineDot" class="online-dot" style="display:none;"></span>
                    </span>
                </button>
            </div>

            <div class="flex-grow flex justify-center">
                <a href="/chat_list" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300 app-logo">
                    Aite
                </a>
            </div>

            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="relative">
                    <button id="createBtn" class="bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center border border-gray-700" onclick="toggleCreateModal()">
                        <i class="fas fa-plus ml-2"></i>
                        إنشاء
                    </button>
                </div>
            </div>

            <div id="profileDropdown" class="absolute top-14 right-0 mt-2 w-48 rounded-lg shadow-xl glass-dropdown hidden">
                <a href="/profile" class="flex items-center px-4 py-3 text-white hover:bg-white/10 rounded-t-lg transition duration-200">
                    <i class="fas fa-user-circle text-xl ml-3"></i>
                    الملف الشخصي
                </a>
                <a href="/logout" class="flex items-center px-4 py-3 text-red-400 hover:bg-white/10 rounded-b-lg transition duration-200 border-t border-gray-700">
                    <i class="fas fa-sign-out-alt text-xl ml-3"></i>
                    تسجيل الخروج
                </a>
            </div>

        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="postsFeed" class="max-w-xl mx-auto mt-4 space-y-4"></div>
    </main>

<div class="fixed bottom-0 left-0 right-0 z-50 glass-bottom-navbar">
        <nav class="flex justify-around items-center max-w-lg mx-auto h-14 relative">

            <a href="/chat_list" class="flex flex-col items-center justify-center p-2 text-blue-400">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs mt-1"></span>
            </a>

            <a id="messagesBtn" href="/users_list" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
                <i class="fas fa-comment-dots text-xl"></i>
                <span class="text-xs mt-1"></span>
                <span id="msgBadge" style="display:none">0</span>
            </a>

            <a href="/reels" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-clapperboard text-xl"></i>
                <span class="text-xs mt-1"></span>
            </a>

            <a id="notifBtn" href="/notifications" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
                <i class="fas fa-bell text-xl"></i>
                <span class="text-xs mt-1"></span>
                <span id="notifBadge" style="display:none">0</span>
            </a>

            <a id="usersBtn" href="/all_users" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
                <i class="fas fa-users text-xl"></i>
                <span class="text-xs mt-1"></span>
                <span id="friendReqBadge" style="display:none">0</span>
            </a>

        </nav>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="media-container flex items-center justify-center" onclick="event.stopPropagation()"></div>
    </div>

    <!-- Comments Bottom Sheet / Overlay -->
    <div id="commentBackdrop" class="overlay-backdrop"></div>

    <div id="commentsSheet" class="comments-sheet" aria-hidden="true">
      <div id="sheetDrag" class="sheet-drag" aria-hidden="true"></div>
      <div class="sheet-header">
        <h3 class="font-bold text-sm text-white">التعليقات</h3>
        <button id="closeCommentsBtn" class="text-gray-400 p-2"><i class="fas fa-times"></i></button>
      </div>
      <div id="commentsList" class="sheet-body custom-scrollbar"></div>
      <div class="sheet-footer">
        <div class="flex items-center comment-input">
          <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." class="text-sm" dir="rtl" autocomplete="off">
          <button id="postCommentBtn" class="px-3 py-2">نشر</button>
        </div>
        <div id="commentError" class="text-red-500 mt-2 hidden text-center text-sm"></div>
      </div>
    </div>
    <!-- End comments sheet -->

<div id="createModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 glass-modal-bg">
    <div class="glass-comment-modal-content p-8 rounded-3xl shadow-2xl max-w-sm w-full modal-animate-in border border-white/20" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-2xl font-bold text-white">ماذا تريد أن تنشر؟</h3>
            <button onclick="toggleCreateModal()" class="text-gray-400 hover:text-white transition text-2xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="grid grid-cols-1 gap-4">
            <a href="/create-post" class="create-option-card flex items-center p-5 rounded-2xl group">
                <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center ml-4 group-hover:bg-blue-500/40 transition">
                    <i class="fas fa-file-alt text-blue-400 text-xl"></i>
                </div>
                <div class="text-right">
                    <span class="block text-white font-bold text-lg">منشور جديد</span>
                    <span class="block text-gray-400 text-sm">شارك أفكارك وصورك</span>
                </div>
            </a>

            <a href="/create-reel" class="create-option-card flex items-center p-5 rounded-2xl group">
                <div class="w-12 h-12 bg-purple-500/20 rounded-full flex items-center justify-center ml-4 group-hover:bg-purple-500/40 transition">
                    <i class="fas fa-video text-purple-400 text-xl"></i>
                </div>
                <div class="text-right">
                    <span class="block text-white font-bold text-lg">ريلز</span>
                    <span class="block text-gray-400 text-sm">فيديو قصير ممتع</span>
                </div>
            </a>
        </div>
    </div>
</div>

    <script>
        let currentPostIdToDelete = null;
        let currentUserId = null;
        let activeWaveSurfer = null;
        let activeVideo = null;

        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

        const postsFeed = document.getElementById('postsFeed');
        const mediaViewerModal = document.getElementById('mediaViewerModal');
        const mediaViewerContent = document.getElementById('mediaViewerContent');
        const profileDropdown = document.getElementById('profileDropdown');
        const profileMenuButton = document.getElementById('profileMenuButton');

        const commentBackdrop = document.getElementById('commentBackdrop');
        const commentsSheet = document.getElementById('commentsSheet');
        const commentsList = document.getElementById('commentsList');
        const newCommentInput = document.getElementById('newCommentInput');
        const postCommentBtn = document.getElementById('postCommentBtn');
        const closeCommentsBtn = document.getElementById('closeCommentsBtn');
        const commentError = document.getElementById('commentError');
        const sheetDrag = document.getElementById('sheetDrag');
        let currentPostIdForComments = null;

        // Drag-to-dismiss variables
        let isDragging = false;
        let dragStartY = 0;
        let currentDeltaY = 0;

        function toggleProfileDropdown(event) {
            event.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        }
        function closeProfileDropdownOnClickOutside(event) {
            if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        }
        document.addEventListener('click', closeProfileDropdownOnClickOutside);

        const createModalEl = document.getElementById('createModal');
        function toggleCreateModal() {
            createModalEl.classList.toggle('hidden');
            if (!createModalEl.classList.contains('hidden')) document.body.style.overflow = 'hidden'; else document.body.style.overflow = 'auto';
        }
        createModalEl.addEventListener('click', (e) => { if (e.target === createModalEl) toggleCreateModal(); });

        function openMediaViewer(url, type, event) {
            event.stopPropagation();
            if (type === 'audio' || type === 'video') return;
            mediaViewerContent.innerHTML = '';
            if (type === 'image') mediaViewerContent.innerHTML = `<img src="${url}" alt="Media Viewer" class="max-w-full max-h-full object-contain rounded-lg">`;
            else return;
            mediaViewerModal.classList.remove('hidden');
        }
        function closeMediaViewer(event) {
            if (event.target.id === 'mediaViewerModal' || event.target.closest('.fa-times')) {
                const activeMedia = mediaViewerContent.querySelector('video, audio');
                if (activeMedia) activeMedia.pause();
                mediaViewerModal.classList.add('hidden');
                mediaViewerContent.innerHTML = '';
            }
        }

        function openDeleteModal(postId, event) {
            event.stopPropagation();
            currentPostIdToDelete = postId;
            document.getElementById('deleteModal').classList.remove('hidden');
        }
        document.getElementById('cancelDeleteBtn').addEventListener('click', () => { document.getElementById('deleteModal').classList.add('hidden'); currentPostIdToDelete = null; });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!currentPostIdToDelete) return;
            const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحذف';
            try {
                const response = await fetch(`/api/posts/${currentPostIdToDelete}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' });
                const result = await response.json();
                if (response.ok && result.ok) {
                    const el = document.querySelector(`div[data-post-id="${currentPostIdToDelete}"]`);
                    if (el) el.remove();
                    document.getElementById('deleteModal').classList.add('hidden');
                } else {
                    const deleteMessage = document.getElementById('deleteMessage');
                    deleteMessage.textContent = result.error || 'فشل الحذف.';
                    deleteMessage.classList.remove('hidden');
                }
            } catch (error) {
                const deleteMessage = document.getElementById('deleteMessage');
                deleteMessage.textContent = 'حدث خطأ في الاتصال بالخادم.';
                deleteMessage.classList.remove('hidden');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.innerHTML = 'تأكيد الحذف';
                currentPostIdToDelete = null;
            }
        });

        function togglePostMenu(postId, userId, event, menuButton) {
            event.stopPropagation();
            const postMenu = document.getElementById('postMenu');
            if (!postMenu) return;
            if (!postMenu.classList.contains('hidden') && postMenu.dataset.postId === postId) { postMenu.classList.add('hidden'); return; }
            const rect = menuButton.getBoundingClientRect();
            postMenu.style.top = `${rect.bottom + 5}px`;
            postMenu.style.left = `${rect.left}px`;
            postMenu.dataset.postId = postId;
            const deleteOptionBtn = document.getElementById('deleteOptionBtn');
            if (userId === currentUserId) {
                deleteOptionBtn.style.display = 'flex';
                deleteOptionBtn.onclick = (e) => openDeleteModal(postId, e);
            } else deleteOptionBtn.style.display = 'none';
            postMenu.classList.remove('hidden');
        }
        document.addEventListener('click', (event) => {
            const postMenu = document.getElementById('postMenu');
            if (!postMenu.contains(event.target) && !event.target.closest('.post-menu-button')) {
                postMenu.classList.add('hidden');
                document.getElementById('deleteModal').classList.add('hidden');
            }
        });

        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if (!container) return;
            const ws = WaveSurfer.create({ container, waveColor: '#4b5563', progressColor: '#3b82f6', cursorColor: '#10b981', barWidth: 3, barRadius: 3, barGap: 1, height: 60, responsive: true, mediaControls: false });
            ws.load(url);
            const playButton = container.closest('.glass-post-card').querySelector('.audio-play-button');
            if (playButton) {
                playButton.onclick = () => {
                    if (activeWaveSurfer && activeWaveSurfer !== ws) { activeWaveSurfer.pause(); const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card'); if (otherPostCard) { const pb = otherPostCard.querySelector('.audio-play-button i'); if (pb) { pb.classList.remove('fa-pause'); pb.classList.add('fa-play'); } } }
                    if (activeVideo) { const activePostId = activeVideo.id.split('-')[1]; const controlIcon = document.getElementById(`control-icon-${activePostId}`); const playOverlay = document.getElementById(`play-overlay-${activePostId}`); activeVideo.pause(); if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); } if (playOverlay) playOverlay.classList.remove('hidden'); activeVideo = null; }
                    if (ws.isPlaying()) { ws.pause(); playButton.querySelector('i').classList.remove('fa-pause'); playButton.querySelector('i').classList.add('fa-play'); } else { ws.play(); playButton.querySelector('i').classList.remove('fa-play'); playButton.querySelector('i').classList.add('fa-pause'); activeWaveSurfer = ws; }
                };
                ws.on('finish', () => { playButton.querySelector('i').classList.remove('fa-pause'); playButton.querySelector('i').classList.add('fa-play'); activeWaveSurfer = null; });
            }
        }

        function toggleVideoPlay(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            const controlsBar = document.getElementById(`controls-bar-${postId}`);
            if (!video) return;
            if (activeVideo && activeVideo !== video) {
                const activePostId = activeVideo.id.split('-')[1];
                const activeControlIcon = document.getElementById(`control-icon-${activePostId}`);
                const activePlayOverlay = document.getElementById(`play-overlay-${activePostId}`);
                activeVideo.pause();
                if (activeControlIcon) { activeControlIcon.classList.remove('fa-pause'); activeControlIcon.classList.add('fa-play'); }
                if (activePlayOverlay) activePlayOverlay.classList.remove('hidden');
                activeVideo.removeEventListener('timeupdate', updateVideoProgress);
                activeVideo.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
                activeVideo.removeEventListener('ended', handleVideoEnd);
            }
            if (activeWaveSurfer) { activeWaveSurfer.pause(); const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card'); if (otherPostCard) { const apb = otherPostCard.querySelector('.audio-play-button i'); if (apb) { apb.classList.remove('fa-pause'); apb.classList.add('fa-play'); } } activeWaveSurfer = null; }
            if (video.paused) {
                video.play();
                if (playOverlay) playOverlay.classList.add('hidden');
                if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
                if (controlsBar) controlsBar.classList.remove('opacity-0');
                activeVideo = video;
                video.addEventListener('timeupdate', updateVideoProgress);
                video.addEventListener('loadedmetadata', updateVideoTimeDisplay);
                video.addEventListener('ended', handleVideoEnd);
            } else {
                video.pause();
                if (playOverlay) playOverlay.classList.remove('hidden');
                if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
                activeVideo = null;
            }
        }
        function updateVideoProgress(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const progressBar = document.getElementById(`progress-bar-${postId}`);
            const timeDisplay = document.getElementById(`time-display-${postId}`);
            if (!video.duration || !progressBar || !timeDisplay) return;
            const percent = (video.currentTime / video.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        }
        function updateVideoTimeDisplay(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const timeDisplay = document.getElementById(`time-display-${postId}`);
            if (timeDisplay && video.duration) timeDisplay.textContent = `0:00 / ${formatVideoTime(video.duration)}`;
        }
        function handleVideoEnd(event) {
            const video = event.target;
            const postId = video.id.split('-')[1];
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            video.currentTime = 0;
            if (playOverlay) playOverlay.classList.remove('hidden');
            if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
            activeVideo = null;
            video.removeEventListener('timeupdate', updateVideoProgress);
            video.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
            video.removeEventListener('ended', handleVideoEnd);
        }
        function formatVideoTime(seconds) { if (isNaN(seconds)) return '0:00'; const minutes = Math.floor(seconds / 60); const remainingSeconds = Math.floor(seconds % 60); return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`; }
        function seekVideo(postId, event) { event.stopPropagation(); const video = document.getElementById(`video-${postId}`); const rect = event.currentTarget.getBoundingClientRect(); if (!video || !video.duration) return; const clickX = event.clientX - rect.left; const percentage = clickX / rect.width; video.currentTime = video.duration * percentage; if (video.paused) toggleVideoPlay(postId, event); }
        function toggleFullscreen(postId, event) { event.stopPropagation(); const video = document.getElementById(`video-${postId}`); if (video) { if (video.requestFullscreen) video.requestFullscreen(); else if (video.mozRequestFullScreen) video.mozRequestFullScreen(); else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen(); else if (video.msRequestFullscreen) video.msRequestFullscreen(); } }

        function formatTimestamp(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);
            if (diffInHours < 24) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            else if (diffInHours < 7 * 24) return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            else return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function createPostCard(post) {
            let mediaContent = '';
            if (post.media) {
                if (post.media.type === 'image') mediaContent = `<div class="mt-3 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image', event)"><img src="${post.media.url}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg"></div>`;
                else if (post.media.type === 'video') mediaContent = `<div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group"><video id="video-${post.postId}" src="${post.media.url}" class="w-full h-full object-contain" poster="https://via.placeholder.com/600x400?text=Video+Loading" preload="metadata" onclick="toggleVideoPlay('${post.postId}', event)"></video><div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 transition-opacity duration-300 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)"><i class="fas fa-play text-white text-5xl opacity-80 transition-transform duration-300 transform scale-100 group-hover:scale-110"></i></div><div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center space-x-3 space-x-reverse opacity-0 transition-opacity duration-300 group-hover:opacity-100"><button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400 transition"><i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i></button><div class="flex-grow h-1 bg-gray-500 rounded-full cursor-pointer relative" onclick="seekVideo('${post.postId}', event)"><div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div></div><span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span><button onclick="toggleFullscreen('${post.postId}', event)" class="text-white hover:text-blue-400 transition"><i class="fas fa-expand text-lg"></i></button></div></div>`;
                else if (post.media.type === 'audio') mediaContent = `<div class="mt-3 flex items-center space-x-3 space-x-reverse bg-gray-800 p-3 rounded-lg"><button class="audio-play-button text-white text-xl hover:text-blue-400 transition duration-300 flex-shrink-0"><i class="fas fa-play"></i></button><div id="waveform-${post.postId}" class="waveform-post flex-grow"></div></div>`;
            }

            const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
            const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';
            const onlineDotHtml = post.user && post.user.is_online ? `<span class="online-dot online-dot-small" title="متصل الآن"></span>` : '';
            const verifiedBadgeHtml = post.user && post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="موثق" title="موثق">` : '';

            // استخدمت أيقونة أفضل للتعليقات: fas fa-comments
            return `
                <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center">
                            <a href="/profile?userId=${post.userId}" class="avatar-with-dot">
                                <img src="${post.user.profile_picture_url}" alt="${post.user.username}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600 hover:ring-2 hover:ring-blue-400 transition duration-300">
                                ${onlineDotHtml}
                            </a>
                            <div>
                                <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">${post.user.username} ${verifiedBadgeHtml}</a>
                                <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
                            </div>
                        </div>
                        <button class="text-gray-400 hover:text-white transition duration-300 post-menu-button" onclick="togglePostMenu('${post.postId}', '${post.userId}', event, this)"><i class="fas fa-ellipsis-v"></i></button>
                    </div>

                    <p class="text-gray-200 whitespace-pre-wrap">${post.content}</p>

                    ${mediaContent}

                    <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                        <span><i class="fas fa-heart ml-1"></i> ${post.likes || 0} إعجاب</span>
                        <span class="cursor-pointer hover:text-blue-400" onclick="handleComment('${post.postId}')"><i class="fas fa-comments ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                    </div>

                    <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">

                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center" onclick="handleComment('${post.postId}')"><i class="fas fa-comments ml-2"></i> تعليق</button>

        async function fetchAndDisplayPosts() {
            postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';
            try {
                const response = await fetch('/api/posts', { credentials: 'same-origin' });
                const result = await response.json();
                postsFeed.innerHTML = '';
                if (response.ok && result.ok) {
                    if (result.posts.length === 0) { postsFeed.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات لعرضها بعد.</div>'; return; }
                    const posts = result.posts;
                    const userIds = [...new Set(posts.map(p => p.userId))];
                    const profileMap = {};
                    try {
                        const profilePromises = userIds.map(uid => fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).catch(() => null));
                        const profileResults = await Promise.all(profilePromises);
                        profileResults.forEach(pr => { if (pr && pr.ok) profileMap[pr.id] = pr; });
                    } catch (e) { console.warn('Failed to fetch profiles for verification status', e); }
                    const audioPostsToInit = [];
                    posts.forEach(post => {
                        const prof = profileMap[post.userId];
                        if (prof) { post.user = post.user || {}; post.user.is_verified = !!prof.is_verified; post.user.username = prof.username || post.user.username; post.user.profile_picture_url = prof.profile_picture_url || post.user.profile_picture_url; }
                        else { post.user = post.user || {}; post.user.is_verified = !!post.user.is_verified; post.user.username = post.user.username || 'مستخدم'; post.user.profile_picture_url = post.user.profile_picture_url || 'https://via.placeholder.com/40'; }
                        postsFeed.innerHTML += createPostCard(post);
                        if (post.media && post.media.type === 'audio') audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                    });
                    setTimeout(() => { audioPostsToInit.forEach(ap => initializePostWaveSurfer(ap.postId, ap.url)); }, 150);
                } else {
                    postsFeed.innerHTML = '<div class="text-center text-red-500 p-4">فشل في تحميل المنشورات.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                postsFeed.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في جلب المنشورات.</div>';
            }
        }

        async function handleLike(postId, buttonElement) {
            const likeIcon = buttonElement.querySelector('.like-icon');
            buttonElement.disabled = true;
            try {
                const response = await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' });
                const result = await response.json();
                if (response.ok && result.ok) {
                    const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
                    if (postCard) {
                        const likesSpan = postCard.querySelector('.flex.justify-between span:first-child');
                        if (likesSpan) likesSpan.innerHTML = `<i class="fas fa-heart ml-1"></i> ${result.newLikes} إعجاب`;
                    }
                    if (result.action === 'liked') {
                        likeIcon.classList.remove('far', 'text-gray-400'); likeIcon.classList.add('fas', 'text-red-500');
                        buttonElement.classList.remove('text-gray-400'); buttonElement.classList.add('text-red-500'); buttonElement.dataset.isLiked = 'true';
                    } else {
                        likeIcon.classList.remove('fas', 'text-red-500'); likeIcon.classList.add('far', 'text-gray-400');
                        buttonElement.classList.remove('text-red-500'); buttonElement.classList.add('text-gray-400'); buttonElement.dataset.isLiked = 'false';
                    }
                } else console.error('Like failed:', result.error);
            } catch (error) { console.error('Error during like operation:', error); }
            finally { buttonElement.disabled = false; }
        }

        // Open comments bottom sheet
        async function handleComment(postId) {
            currentPostIdForComments = postId;
            openCommentsSheet(postId);
        }

        async function openCommentsSheet(postId) {
            commentBackdrop.classList.add('open');
            commentBackdrop.style.opacity = '1';
            commentsSheet.classList.add('open');
            commentsSheet.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            commentsList.innerHTML = '<div class="text-center mt-5"><i class="fas fa-circle-notch fa-spin text-blue-500"></i></div>';
            commentError.classList.add('hidden');

            try {
                const res = await fetch(`/api/posts/${postId}/comments`, { credentials: 'same-origin' });
                if (!res.ok) throw new Error('Failed to fetch comments: ' + res.status);
                const data = await res.json();

                // Normalize comments to array (server might send object)
                let comments = [];
                if (!data) comments = [];
                else if (Array.isArray(data.comments)) comments = data.comments;
                else if (data.comments && typeof data.comments === 'object') comments = Object.keys(data.comments).map(k => data.comments[k]);
                else if (Array.isArray(data)) comments = data;
                else comments = data.comments || [];

                // ensure comments are sorted by timestamp ascending
                comments = comments.filter(Boolean).sort((a, b) => (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0));

                renderCommentsInSheet(comments);
            } catch (e) {
                console.error('openComments error', e);
                commentsList.innerHTML = '<div class="text-center text-red-500 mt-4">فشل في جلب التعليقات.</div>';
            }
        }

        function closeCommentsSheet() {
            commentBackdrop.classList.remove('open');
            commentBackdrop.style.opacity = '1';
            commentsSheet.classList.remove('open');
            commentsSheet.classList.remove('input-open');
            commentsSheet.style.transition = ''; // allow CSS rule to apply
            commentsSheet.style.transform = '';
            commentsSheet.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = 'auto';
            currentPostIdForComments = null;
            newCommentInput.value = '';
            commentsList.innerHTML = '';
        }

        closeCommentsBtn.addEventListener('click', closeCommentsSheet);
        commentBackdrop.addEventListener('click', closeCommentsSheet);

        function renderCommentsInSheet(comments) {
            commentsList.innerHTML = '';
            if(!comments || comments.length === 0) {
                commentsList.innerHTML = '<div class="text-center text-gray-500 text-sm mt-6">كن أول من يعلق!</div>';
                return;
            }

            comments.forEach(c => {
                const userObj = c.user || (c.userId ? { username: c.username, profile_picture_url: c.profile_picture_url } : null);
                const username = (userObj && (userObj.username || userObj.name)) || c.username || c.userName || 'مستخدم';
                const avatar = (userObj && (userObj.profile_picture_url || userObj.photo)) || c.profile_picture_url || 'https://via.placeholder.com/40';
                const content = c.content || c.comment || c.text || '';
                const ts = Number(c.timestamp) || 0;
                const time = ts ? new Date(ts).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '';
                const html = `
                    <div class="comment-row mb-4">
                      <img src="${escapeHtml(avatar)}" alt="avatar">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-xs">${escapeHtml(username)}</span>
                          <span class="text-[10px] text-gray-500">${time}</span>
                        </div>
                        <div class="comment-bubble mt-1">${escapeHtml(content)}</div>
                      </div>
                    </div>
                `;
                commentsList.innerHTML += html;
            });
            setTimeout(() => { commentsList.scrollTop = commentsList.scrollHeight; }, 80);
        }

        async function postComment() {
            const content = newCommentInput.value.trim();
            if (!content || !currentPostIdForComments) return;
            postCommentBtn.disabled = true;
            postCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            commentError.classList.add('hidden');

            try {
                const response = await fetch(`/api/posts/${currentPostIdForComments}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ content: content })
                });
                const result = await response.json();
                if (response.ok && result.ok) {
                    const c = result.comment;
                    const user = c.user || { username: c.username || '', profile_picture_url: c.profile_picture_url || '' };
                    const time = c.timestamp ? new Date(c.timestamp).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '';
                    const html = `
                        <div class="comment-row mb-4">
                          <img src="${escapeHtml(user.profile_picture_url || 'https://via.placeholder.com/40')}" alt="avatar">
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="font-bold text-xs">${escapeHtml(user.username || '')}</span>
                              <span class="text-[10px] text-gray-500">${time}</span>
                            </div>
                            <div class="comment-bubble mt-1">${escapeHtml(c.content || c.comment || '')}</div>
                          </div>
                        </div>
                    `;
                    const emptyEl = commentsList.querySelector('.text-center.text-gray-500');
                    if (emptyEl) emptyEl.remove();
                    commentsList.innerHTML += html;
                    setTimeout(() => { commentsList.scrollTop = commentsList.scrollHeight; }, 60);
                    newCommentInput.value = '';

                    // update count shown on post card (in case external counter wasn't updated yet)
                    const postCard = document.querySelector(`div[data-post-id="${currentPostIdForComments}"]`);
                    if (postCard) {
                        const commentsSpan = postCard.querySelector('.flex.justify-between span:last-child');
                        if (commentsSpan) {
                            const text = commentsSpan.textContent || '';
                            const m = text.match(/(\d+)/);
                            let n = m ? parseInt(m[1]) : 0;
                            n = n + 1;
                            commentsSpan.innerHTML = `<i class="fas fa-comments ml-1"></i> ${n} تعليق`;
                        }
                    }
                } else {
                    commentError.textContent = result.error || 'فشل في إضافة التعليق.';
                    commentError.classList.remove('hidden');
                }
            } catch (error) {
                commentError.textContent = 'فشل الاتصال بالخادم.';
                commentError.classList.remove('hidden');
            } finally {
                postCommentBtn.disabled = false;
                postCommentBtn.innerHTML = 'نشر';
            }
        }

        // input focus behavior: expand sheet so keyboard doesn't cover footer
        newCommentInput.addEventListener('focus', () => {
            commentsSheet.classList.add('input-open');
            setTimeout(() => { commentsList.scrollTop = commentsList.scrollHeight; }, 120);
        });
        newCommentInput.addEventListener('blur', () => {
            setTimeout(() => { commentsSheet.classList.remove('input-open'); }, 200);
        });

        postCommentBtn.addEventListener('click', postComment);
        newCommentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); postComment(); } });

        // ---------------- Drag-to-dismiss implementation ----------------
        function onDragStart(e) {
            // support pointer and touch events
            isDragging = true;
            dragStartY = (e.touches ? e.touches[0].clientY : e.clientY);
            currentDeltaY = 0;
            commentsSheet.style.transition = 'none';
            sheetDrag.classList.add('dragging');
            // prevent text selection while dragging
            document.body.style.userSelect = 'none';
        }

        function onDragMove(e) {
            if (!isDragging) return;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY);
            const delta = Math.max(0, clientY - dragStartY);
            currentDeltaY = delta;
            // apply transform; respect desktop translate(-50%, ...)
            if (window.innerWidth >= 900) {
                commentsSheet.style.transform = `translate(-50%, ${delta}px)`;
            } else {
                commentsSheet.style.transform = `translateY(${delta}px)`;
            }
            // fade backdrop slightly
            const maxFade = 0.6;
            const opacity = Math.max(0, maxFade - (delta / 600));
            commentBackdrop.style.opacity = String(opacity);
        }

        function onDragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            sheetDrag.classList.remove('dragging');
            document.body.style.userSelect = '';
            const THRESHOLD = 120; // pixels to dismiss
            commentsSheet.style.transition = 'transform 0.22s cubic-bezier(.2,.9,.2,1)';
            if (currentDeltaY > THRESHOLD) {
                // animate out then close
                if (window.innerWidth >= 900) {
                    commentsSheet.style.transform = `translate(-50%, 100%)`;
                } else {
                    commentsSheet.style.transform = `translateY(100%)`;
                }
                commentBackdrop.style.opacity = '0';
                setTimeout(() => {
                    closeCommentsSheet();
                    // restore backdrop opacity css for next open
                    commentBackdrop.style.opacity = '1';
                }, 220);
            } else {
                // return to original
                // remove inline transform after transition to allow CSS transform for open state
                if (window.innerWidth >= 900) {
                    commentsSheet.style.transform = `translate(-50%, 0px)`;
                } else {
                    commentsSheet.style.transform = `translateY(0px)`;
                }
                commentBackdrop.style.opacity = '1';
                setTimeout(() => {
                    commentsSheet.style.transition = '';
                    commentsSheet.style.transform = '';
                }, 230);
            }
            currentDeltaY = 0;
        }

        // attach touch & pointer handlers
        sheetDrag.addEventListener('touchstart', (e) => { onDragStart(e); }, { passive: true });
        sheetDrag.addEventListener('touchmove', (e) => { onDragMove(e); }, { passive: true });
        sheetDrag.addEventListener('touchend', (e) => { onDragEnd(e); });
        sheetDrag.addEventListener('mousedown', (e) => { e.preventDefault(); onDragStart(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) onDragMove(e); });
        window.addEventListener('mouseup', (e) => { if (isDragging) onDragEnd(e); });

        // make header draggable too (larger hit area)
        const sheetHeader = commentsSheet.querySelector('.sheet-header');
        sheetHeader.addEventListener('touchstart', (e) => { onDragStart(e); }, { passive: true });
        sheetHeader.addEventListener('touchmove', (e) => { onDragMove(e); }, { passive: true });
        sheetHeader.addEventListener('touchend', (e) => { onDragEnd(e); });
        sheetHeader.addEventListener('mousedown', (e) => { e.preventDefault(); onDragStart(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) onDragMove(e); });
        window.addEventListener('mouseup', (e) => { if (isDragging) onDragEnd(e); });

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile', { credentials: 'same-origin' })
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    const profilePicElement = document.getElementById('userProfilePic');
                    const meDot = document.getElementById('meOnlineDot');
                    if (data && data.profile_picture_url) {
                        profilePicElement.src = data.profile_picture_url;
                        profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                        currentUserId = data.id;
                        if (data.is_online) meDot.style.display = 'inline-block'; else meDot.style.display = 'none';
                    }
                }).catch(console.error);
            fetchAndDisplayPosts();
        });

        // ---------------- Notifications SSE (unchanged) ----------------
        (function setupNotifSSE() {
          if (!window.EventSource) return;
          const es = new EventSource('/api/notifications/stream', { withCredentials: true });
          es.addEventListener('notifications', (e) => {
            try {
              const payload = JSON.parse(e.data);
              const unread = payload.unread_count || 0;
              const unreadMessages = payload.unread_messages_count || 0;
              const pendingFR = payload.pending_friend_requests_count || 0;
              const notifBadgeEl = document.getElementById('notifBadge');
              if (unread > 0) { notifBadgeEl.style.display = 'inline-flex'; notifBadgeEl.textContent = unread > 99 ? '99+' : String(unread); } else { notifBadgeEl.style.display = 'none'; }
              const msgBadgeEl = document.getElementById('msgBadge');
              if (unreadMessages > 0) { msgBadgeEl.style.display = 'inline-flex'; msgBadgeEl.textContent = unreadMessages > 99 ? '99+' : String(unreadMessages); } else { msgBadgeEl.style.display = 'none'; }
              const frBadgeEl = document.getElementById('friendReqBadge');
              if (pendingFR > 0) { frBadgeEl.style.display = 'inline-flex'; frBadgeEl.textContent = pendingFR > 99 ? '99+' : String(pendingFR); } else { frBadgeEl.style.display = 'none'; }
            } catch (err) { console.error('Failed to parse notifications SSE data', err); }
          });
          es.addEventListener('error', (err) => { console.warn('Notifications SSE error', err); });
        })();

        (function initUnreadCounts() {
          fetch('/api/notifications/unread_count', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.ok) { const badge = document.getElementById('notifBadge'); if (d.unread_count > 0) { badge.style.display = 'inline-flex'; badge.textContent = d.unread_count > 99 ? '99+' : String(d.unread_count); } } }).catch(()=>{});
          fetch('/api/chats', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.ok && Array.isArray(d.chats)) { const totalUnread = d.chats.reduce((acc, c) => acc + (c.unread_count || 0), 0); const msgBadge = document.getElementById('msgBadge'); if (totalUnread > 0) { msgBadge.style.display = 'inline-flex'; msgBadge.textContent = totalUnread > 99 ? '99+' : String(totalUnread); } } }).catch(()=>{});
          fetch('/api/friends/requests_count', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.ok) { const fr = document.getElementById('friendReqBadge'); if (d.count > 0) { fr.style.display = 'inline-flex'; fr.textContent = d.count > 99 ? '99+' : String(d.count); } } }).catch(()=>{});
        })();

        function sendHeartbeat() { fetch('/api/status/heartbeat', { method: 'POST', credentials: 'same-origin' }).then(r => r.json()).catch(err => console.error('Heartbeat failed', err)); }
        sendHeartbeat();
        setInterval(sendHeartbeat, 60000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sendHeartbeat(); });

        function escapeHtml(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    </script>
</body>
</html>
