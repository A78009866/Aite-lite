<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="/https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
        }
        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .app-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; }
        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-comment-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 92vh;
            height: 80vh;
            margin: 0 auto;
            width: 100%;
            max-width: 800px;
            background: linear-gradient(180deg, rgba(10,12,14,0.85), rgba(6,8,10,0.9));
            border-radius: 14px 14px 0 0;
            border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 -20px 50px rgba(0,0,0,0.7);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            transform: translateY(110%);
            transition: transform .28s cubic-bezier(.2,.9,.2,1);
        }
        .glass-comment-sheet.open { transform: translateY(0%); }

        .sheet-handle { height:6px; width:48px; background:rgba(255,255,255,0.06); border-radius:999px; margin:8px auto 4px; }

        .sheet-content { overflow: hidden; display:flex; flex-direction:column; flex:1; }

        .sheet-post-preview {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display:flex;
            gap:12px;
            align-items:flex-start;
        }
        .sheet-post-preview img.post-media {
            max-width: 140px;
            max-height: 120px;
            object-fit:cover;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.04);
        }
        .sheet-post-meta { flex:1; min-width:0; }
        .sheet-username { font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; font-size:15px; }
        .sheet-timestamp { color:#9aa6b3; font-size:12px; margin-top:4px; }
        .sheet-post-text { color:#dbeafe; margin-top:8px; white-space:pre-wrap; line-height:1.4; }

        .sheet-comments { overflow-y:auto; padding: 12px; display:flex; flex-direction:column; gap:12px; background:transparent; flex:1; }
        .comment-row {
            display:flex; gap:10px; align-items:flex-start;
            padding:10px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03);
        }
        .comment-row img { width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid rgba(255,255,255,0.04); }
        .comment-body { flex:1; min-width:0; }
        .comment-head { display:flex; align-items:center; gap:8px; }
        .comment-name { font-weight:700; color:#fff; font-size:14px; display:flex; align-items:center; gap:8px; }
        .comment-time { color:#9aa6b3; font-size:12px; }
        .comment-text { color:#dbeafe; margin-top:6px; font-size:14px; line-height:1.45; }

        .sheet-input-bar {
            display:flex; gap:8px; align-items:center; padding:10px; border-top:1px solid rgba(255,255,255,0.03);
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
        }
        .sheet-input { flex:1; background:transparent; border:1px solid rgba(255,255,255,0.04); padding:10px 12px; border-radius:999px; color:#fff; outline:none; }
        .sheet-send-btn { background:#06b6d4; color:#001; padding:10px 14px; border-radius:999px; border:none; font-weight:700; }
        .verified-badge-img { display:inline-block; width:16px; height:16px; border-radius:999px; margin-left:6px; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.06); vertical-align:middle; }

        /* small devices */
        @media (max-width:640px) {
            .sheet-post-preview img.post-media { max-width:110px; max-height:90px; }
            .comment-row img { width:40px; height:40px; }
        }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
            <div class="flex items-center">
                <button id="profileMenuButton" class="relative block" onclick="toggleProfileDropdown(event)">
                    <span class="avatar-with-dot">
                      <img id="userProfilePic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300 cursor-pointer">
                      <span id="meOnlineDot" class="online-dot" style="display:none;"></span>
                    </span>
                </button>
            </div>
            <div class="flex-grow flex justify-center">
                <a href="/chat_list" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300 app-logo">Aite</a>
            </div>
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="relative">
                    <button id="createBtn" class="bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center border border-gray-700" onclick="toggleCreateModal()">
                        <i class="fas fa-plus ml-2"></i> إنشاء
                    </button>
                </div>
            </div>
            <div id="profileDropdown" class="absolute top-14 right-0 mt-2 w-48 rounded-lg shadow-xl glass-dropdown hidden">
                <a href="/profile" class="flex items-center px-4 py-3 text-white hover:bg-white/10 rounded-t-lg transition duration-200">
                    <i class="fas fa-user-circle text-xl ml-3"></i> الملف الشخصي
                </a>
                <a href="/logout" class="flex items-center px-4 py-3 text-red-400 hover:bg-white/10 rounded-b-lg transition duration-200 border-t border-gray-700">
                    <i class="fas fa-sign-out-alt text-xl ml-3"></i> تسجيل الخروج
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="postsFeed" class="max-w-xl mx-auto mt-4 space-y-4"></div>
    </main>

    <!-- Comment Bottom Sheet (Facebook-like) -->
    <div id="commentSheet" class="glass-comment-sheet" aria-hidden="true" role="dialog" aria-label="نافذة التعليقات">
        <div class="sheet-handle"></div>
        <div class="sheet-content">
            <div id="sheetPostPreview" class="sheet-post-preview">
                <!-- post preview will be injected here -->
            </div>
            <div id="sheetComments" class="sheet-comments">
                <!-- comments injected here -->
            </div>
            <div class="sheet-input-bar">
                <input id="sheetCommentInput" class="sheet-input" type="text" placeholder="أضف تعليقًا..." />
                <button id="sheetSendBtn" class="sheet-send-btn">نشر</button>
            </div>
        </div>
    </div>

<script>
const POSTS_FEED = document.getElementById('postsFeed');
const COMMENT_SHEET = document.getElementById('commentSheet');
const SHEET_POST_PREVIEW = document.getElementById('sheetPostPreview');
const SHEET_COMMENTS = document.getElementById('sheetComments');
const SHEET_INPUT = document.getElementById('sheetCommentInput');
const SHEET_SEND = document.getElementById('sheetSendBtn');
const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

let currentSheetPostId = null;
let currentUserId = null;

// Utility to escape HTML
function escapeHtml(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build a compact post preview for the sheet, cloning minimal data from rendered post card
function buildPostPreviewFromCard(postId) {
  const card = document.querySelector(`div[data-post-id="${postId}"]`);
  if (!card) return '';
  // extract elements
  const usernameEl = card.querySelector('a[href^="/profile?userId"]');
  const username = usernameEl ? usernameEl.textContent.trim() : 'مستخدم';
  const profileLink = usernameEl ? usernameEl.getAttribute('href') : '#';
  const profileImg = card.querySelector('img') ? card.querySelector('img').src : '';
  const timestampEl = card.querySelector('.text-gray-400.text-xs') || card.querySelector('p.text-gray-400');
  const timestamp = timestampEl ? timestampEl.textContent.trim() : '';
  const contentText = card.querySelector('p.text-gray-200') ? card.querySelector('p.text-gray-200').textContent : '';
  const mediaImg = card.querySelector('img[alt="صورة المنشور"]') ? card.querySelector('img[alt="صورة المنشور"]').src : null;
  const videoEl = card.querySelector('video');
  const mediaVideo = videoEl ? videoEl.getAttribute('src') : null;

  // verified placeholder (if present in card)
  const verifiedPlaceholder = card.querySelector('.verified-placeholder') ? `<span class="verified-placeholder" data-user-id="${usernameEl ? (new URLSearchParams(usernameEl.getAttribute('href').split('?')[1]).get('userId')) : ''}"></span>` : '';

  const mediaHtml = mediaImg ? `<img src="${escapeHtml(mediaImg)}" class="post-media" alt="media">`
                    : (mediaVideo ? `<video src="${escapeHtml(mediaVideo)}" class="post-media" controls muted playsinline></video>` : '');

  return `
    <div style="display:flex; gap:12px; align-items:flex-start; width:100%;">
      <a href="${profileLink}" style="text-decoration:none; color:inherit;">
        <img src="${escapeHtml(profileImg)}" alt="${escapeHtml(username)}" style="width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid rgba(255,255,255,0.04);">
      </a>
      <div style="flex:1; min-width:0;">
        <div class="sheet-username"><a href="${profileLink}" style="color:inherit; text-decoration:none;">${escapeHtml(username)}</a> ${verifiedPlaceholder}</div>
        <div class="sheet-timestamp">${escapeHtml(timestamp)}</div>
        <div class="sheet-post-text">${escapeHtml(contentText)}</div>
      </div>
      <div style="margin-left:12px;">${mediaHtml}</div>
    </div>
  `;
}

// Open sheet with post preview and load comments
async function openCommentSheet(postId) {
  currentSheetPostId = postId;
  // build preview from DOM (faster than re-fetching)
  SHEET_POST_PREVIEW.innerHTML = buildPostPreviewFromCard(postId);
  // clear comments area while loading
  SHEET_COMMENTS.innerHTML = `<div style="text-align:center;color:#9aa6b3;padding:18px;"><i class="fas fa-spinner fa-spin"></i> جاري تحميل التعليقات...</div>`;
  // show sheet
  COMMENT_SHEET.classList.add('open');
  COMMENT_SHEET.setAttribute('aria-hidden','false');
  // scroll sheet comments to top
  SHEET_COMMENTS.scrollTop = 0;
  // fetch comments
  await loadCommentsForPost(postId);
  // after loading, update verified badges in sheet (for usernames)
  await updateVerifiedBadges();
  // focus input on small delay
  setTimeout(()=> SHEET_INPUT.focus(), 350);
}

// Close sheet
function closeCommentSheet() {
  COMMENT_SHEET.classList.remove('open');
  COMMENT_SHEET.setAttribute('aria-hidden','true');
  currentSheetPostId = null;
  SHEET_POST_PREVIEW.innerHTML = '';
  SHEET_COMMENTS.innerHTML = '';
  SHEET_INPUT.value = '';
}

// Fetch and render comments
async function loadCommentsForPost(postId) {
  try {
    const res = await fetch(`/api/posts/${postId}/comments`, { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      SHEET_COMMENTS.innerHTML = `<div style="text-align:center;color:#ef4444;padding:18px;">فشل في جلب التعليقات. حاول لاحقًا.</div>`;
      return;
    }
    const comments = data.comments || [];
    if (comments.length === 0) {
      SHEET_COMMENTS.innerHTML = `<div style="text-align:center;color:#9aa6b3;padding:18px;">لا توجد تعليقات بعد — كن أول من يعلق.</div>`;
      return;
    }
    // render comments
    SHEET_COMMENTS.innerHTML = comments.map(c => renderCommentRow(c)).join('');
  } catch (e) {
    console.error('comments load error', e);
    SHEET_COMMENTS.innerHTML = `<div style="text-align:center;color:#ef4444;padding:18px;">حدث خطأ في الاتصال بالخادم.</div>`;
  }
}

// Build comment row HTML
function renderCommentRow(comment) {
  // comment.user may be present by server implementation; fallback to properties
  const user = comment.user || { username: comment.username || 'مستخدم', profile_picture_url: (comment.profile_picture_url || comment.user?.profile_picture_url || '') };
  const userId = comment.userId || comment.user?.id || comment.user?.uid || '';
  const time = comment.timestamp ? new Date(comment.timestamp).toLocaleString('ar-EG', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  const verifiedPlaceholder = `<span class="verified-placeholder" data-user-id="${userId}"></span>`;
  return `
    <div class="comment-row" data-comment-id="${escapeHtml(comment.commentId || comment.id || '')}">
      <img src="${escapeHtml(user.profile_picture_url || '/assets/default_profile_pic.png')}" alt="${escapeHtml(user.username)}">
      <div class="comment-body">
        <div class="comment-head">
          <div class="comment-name"><a href="/profile?userId=${encodeURIComponent(userId)}" style="color:inherit;text-decoration:none">${escapeHtml(user.username)}</a> ${verifiedPlaceholder}</div>
          <div class="comment-time">${escapeHtml(time)}</div>
        </div>
        <div class="comment-text">${escapeHtml(comment.content || comment.commentContent || '')}</div>
      </div>
    </div>
  `;
}

// Post a comment from sheet
async function postSheetComment() {
  const content = SHEET_INPUT.value.trim();
  if (!content || !currentSheetPostId) return;
  SHEET_SEND.disabled = true;
  SHEET_SEND.textContent = 'جاري النشر...';
  try {
    const res = await fetch(`/api/posts/${currentSheetPostId}/comment`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ content })
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      // append the new comment at bottom
      const appended = renderCommentRow(data.comment);
      SHEET_COMMENTS.insertAdjacentHTML('beforeend', appended);
      // clear input
      SHEET_INPUT.value = '';
      // scroll to bottom
      SHEET_COMMENTS.scrollTop = SHEET_COMMENTS.scrollHeight;
      // update post comments count in feed if present
      const postCard = document.querySelector(`div[data-post-id="${currentSheetPostId}"]`);
      if (postCard) {
        const commentsSpan = postCard.querySelector('.flex.justify-between span:last-child');
        if (commentsSpan && data.newComments !== undefined) commentsSpan.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${data.newComments} تعليق`;
      }
      // update verified badges for the new comment
      await updateVerifiedBadges();
    } else {
      alert((data && data.error) || 'فشل في إضافة التعليق.');
    }
  } catch (e) {
    console.error('post comment error', e);
    alert('فشل الاتصال بالخادم.');
  } finally {
    SHEET_SEND.disabled = false;
    SHEET_SEND.textContent = 'نشر';
  }
}

// Replace verified placeholders with badge images when profile.is_verified === true
async function updateVerifiedBadges() {
  const placeholders = Array.from(document.querySelectorAll('.verified-placeholder'));
  if (placeholders.length === 0) return;
  const ids = [...new Set(placeholders.map(p => p.dataset.userId).filter(Boolean))];
  await Promise.all(ids.map(async uid => {
    try {
      const res = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' });
      if (!res.ok) {
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
        return;
      }
      const data = await res.json();
      if (data && data.is_verified) {
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => {
          const img = document.createElement('img');
          img.src = VERIFIED_IMG_URL;
          img.alt = 'موثق';
          img.title = 'موثق';
          img.className = 'verified-badge-img';
          ph.replaceWith(img);
        });
      } else {
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
      }
    } catch (e) {
      document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
    }
  }));
}

// Wire sheet events
SHEET_SEND.addEventListener('click', postSheetComment);
SHEET_INPUT.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); postSheetComment(); } });

// Close sheet by dragging/escape (simple handling)
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCommentSheet(); });

// Public function used by post card "تعليق" button
async function handleComment(postId) {
  openCommentSheet(postId);
}

// When user clicks on username/avatar in posts they navigate to profile via href - already present in cards

// Fetch & render posts (same as before but using createPostCard)
function createPostCard(post) {
    let mediaContent = '';
    if (post.media) {
        if (post.media.type === 'image') {
            mediaContent = `<div class="mt-3 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image', event)"><img src="${post.media.url}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg"></div>`;
        } else if (post.media.type === 'video') {
            mediaContent = `
                <div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group">
                    <video id="video-${post.postId}" src="${post.media.url}" class="w-full h-full object-contain" poster="https://via.placeholder.com/600x400?text=Video+Loading" preload="metadata" onclick="toggleVideoPlay('${post.postId}', event)"></video>
                    <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 transition-opacity duration-300 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)"><i class="fas fa-play text-white text-5xl opacity-80"></i></div>
                    <div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center space-x-3 space-x-reverse opacity-0 group-hover:opacity-100">
                        <button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400 transition"><i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i></button>
                        <div class="flex-grow h-1 bg-gray-500 rounded-full cursor-pointer" onclick="seekVideo('${post.postId}', event)"><div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div></div>
                        <span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span>
                        <button onclick="toggleFullscreen('${post.postId}', event)" class="text-white hover:text-blue-400 transition"><i class="fas fa-expand text-lg"></i></button>
                    </div>
                </div>`;
        } else if (post.media.type === 'audio') {
            mediaContent = `<div class="mt-3 flex items-center space-x-3 space-x-reverse bg-gray-800 p-3 rounded-lg"><button class="audio-play-button text-white text-xl hover:text-blue-400 transition duration-300 flex-shrink-0"><i class="fas fa-play"></i></button><div id="waveform-${post.postId}" class="waveform-post flex-grow"></div></div>`;
        }
    }

    // verified placeholder for later replacement
    const verifiedPlaceholder = `<span class="verified-placeholder" data-user-id="${post.userId}"></span>`;

    return `
    <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
      <div class="flex items-start justify-between mb-3">
        <div class="flex items-center">
          <a href="/profile?userId=${post.userId}" class="avatar-with-dot">
            <img src="${post.user.profile_picture_url}" alt="${post.user.username}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600 hover:ring-2 hover:ring-blue-400 transition duration-300">
            ${post.user.is_online ? `<span class="online-dot online-dot-small"></span>` : ''}
          </a>
          <div>
            <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">${post.user.username} ${verifiedPlaceholder}</a>
            <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
          </div>
        </div>
        <button class="text-gray-400 hover:text-white transition duration-300 post-menu-button" onclick="togglePostMenu('${post.postId}', '${post.userId}', event, this)"><i class="fas fa-ellipsis-v"></i></button>
      </div>
      <p class="text-gray-200 whitespace-pre-wrap">${post.content}</p>
      ${mediaContent}
      <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
        <span><i class="fas fa-heart ml-1"></i> ${post.likes} إعجاب</span>
        <span class="cursor-pointer hover:text-blue-400" onclick="handleComment('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount} تعليق</span>
      </div>
      <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
        <button class="flex items-center text-gray-400 hover:text-red-500 transition duration-300 w-full justify-center post-like-button" data-is-liked="${post.is_liked}" onclick="handleLike('${post.postId}', this)"><i class="${post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400'} ml-2 like-icon"></i> إعجاب</button>
        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center" onclick="handleComment('${post.postId}')"><i class="far fa-comment-alt ml-2"></i> تعليق</button>
      </div>
    </div>` ;
}

// fetch posts and render
async function fetchAndDisplayPosts() {
  POSTS_FEED.innerHTML = '<div class="text-center text-gray-500 p-4"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المنشورات...</div>';
  try {
    const res = await fetch('/api/posts', { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      POSTS_FEED.innerHTML = '<div class="text-center text-red-500 p-4">فشل في جلب المنشورات.</div>';
      return;
    }
    if (data.posts.length === 0) {
      POSTS_FEED.innerHTML = '<div class="text-center text-gray-500 p-4">لا توجد منشورات لعرضها بعد.</div>';
      return;
    }
    POSTS_FEED.innerHTML = data.posts.map(p => createPostCard(p)).join('');
    // init wave surfers for audio after small delay
    setTimeout(() => {
      data.posts.forEach(p => {
        if (p.media && p.media.type === 'audio') initializePostWaveSurfer(p.postId, p.media.url);
      });
      updateVerifiedBadges();
    }, 120);
  } catch (e) {
    console.error(e);
    POSTS_FEED.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في جلب المنشورات.</div>';
  }
}

// simple verified badge updater reused
async function updateVerifiedBadges() {
  const placeholders = Array.from(document.querySelectorAll('.verified-placeholder'));
  if (!placeholders.length) return;
  const ids = [...new Set(placeholders.map(p => p.dataset.userId).filter(Boolean))];
  await Promise.all(ids.map(async uid => {
    try {
      const r = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' });
      if (!r.ok) {
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
        return;
      }
      const d = await r.json();
      if (d && d.is_verified) {
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => {
          const img = document.createElement('img');
          img.src = VERIFIED_IMG_URL;
          img.alt = 'موثق';
          img.title = 'موثق';
          img.className = 'verified-badge-img';
          ph.replaceWith(img);
        });
      } else {
        document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
      }
    } catch (e) {
      document.querySelectorAll(`.verified-placeholder[data-user-id="${uid}"]`).forEach(ph => ph.remove());
    }
  }));
}

// initialize
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const prof = await fetch('/api/profile', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null);
    if (prof) {
      currentUserId = prof.id;
      const el = document.getElementById('userProfilePic');
      if (prof.profile_picture_url) el.src = prof.profile_picture_url;
      if (prof.is_online) document.getElementById('meOnlineDot').style.display = 'inline-block';
    }
  } catch (e) { console.error(e); }
  await fetchAndDisplayPosts();
});
