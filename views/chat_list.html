<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .active-link {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
        
        .main-content {
            padding-bottom: 70px; /* لترك مساحة كافية لشريط التنقل السفلي */
        }
    </style>
</head>
<body>

    <header class="fixed top-0 left-0 w-full z-20 p-4 glass-navbar">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <h1 class="text-xl font-bold text-white">Aite</h1>
            <a href="/profile" class="flex items-center">
                <img id="userProfilePic" src="https://via.placeholder.com/40" alt="صورة بروفايل" class="w-10 h-10 rounded-full object-cover border-2 border-gray-600">
            </a>
        </div>
    </header>

    <main class="main-content max-w-lg mx-auto pt-20 p-4">
        <div id="postsContainer">
            <p class="text-center text-blue-400 py-10"><i class="fas fa-spinner fa-spin ml-2"></i> جارٍ تحميل المنشورات...</p>
        </div>
    </main>
    
    <a href="/create-post" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700 transition duration-300 z-30">
        <i class="fas fa-plus"></i>
    </a>

    <nav class="fixed bottom-0 left-0 w-full glass-navbar z-20">
        <div class="flex justify-around items-center h-14 max-w-lg mx-auto">
            <a href="/chat_list" class="flex flex-col items-center text-sm active-link p-1">
                <i class="fas fa-home text-lg"></i>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="/users_list" class="flex flex-col items-center text-gray-400 hover:text-white p-1">
                <i class="fas fa-users text-lg"></i>
                <span class="text-xs">المستخدمون</span>
            </a>
            <a href="/chat_list" class="flex flex-col items-center text-gray-400 hover:text-white p-1">
                <i class="fas fa-envelope text-lg"></i>
                <span class="text-xs">الرسائل</span>
            </a>
            <a href="/profile" class="flex flex-col items-center text-gray-400 hover:text-white p-1">
                <i class="fas fa-user text-lg"></i>
                <span class="text-xs">حسابي</span>
            </a>
        </div>
    </nav>
    
    <div id="commentModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden flex justify-center items-center">
        <div class="bg-gray-900 rounded-lg w-full max-w-md max-h-4/5 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">التعليقات</h3>
                <button id="closeCommentModal" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div id="commentsList" class="flex-grow p-4 overflow-y-auto custom-scroll">
                </div>
            
            <div class="p-4 border-t border-gray-700">
                <div id="commentError" class="text-red-400 text-sm mb-2 hidden"></div>
                <div class="flex items-center">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." class="flex-grow bg-gray-800 text-white rounded-full py-2 px-4 ml-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="postCommentBtn" class="bg-blue-600 text-white rounded-full p-2 w-10 h-10 flex items-center justify-center hover:bg-blue-700 transition duration-200" title="نشر">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // **خريطة أنواع التفاعلات**
        // تم إضافة خاصية 'none' لتمثل حالة عدم التفاعل
        const REACTIONS_MAP = {
            'love': { icon: 'fa-heart', color: 'text-red-500', arabic: 'أحببته' },
            'support': { icon: 'fa-hands-clapping', color: 'text-green-500', arabic: 'أدعم' },
            'boring': { icon: 'fa-face-rolling-eyes', color: 'text-yellow-500', arabic: 'ممل' },
            'wise': { icon: 'fa-lightbulb', color: 'text-indigo-500', arabic: 'حكيم' },
            'none': { icon: 'fa-thumbs-up', color: 'text-gray-400', arabic: 'تفاعل' }, // التفاعل الافتراضي
        };

        let currentUserId = null;
        let postsContainer = document.getElementById('postsContainer');
        
        // ----------------------------------------------------------------------
        // دالة تحديث واجهة التفاعل بعد عملية ناجحة
        // ----------------------------------------------------------------------
        function updateReactionUI(postId, newReactionType, newReactionsCount, allReactionCounts) {
            const postElement = document.getElementById(`post-${postId}`);
            if (!postElement) return;

            // 1. تحديث الأيقونة الرئيسية للزر 
            const reactButton = postElement.querySelector('.react-btn');
            
            // استخدم 'none' إذا كان نوع التفاعل الجديد هو null
            const finalReactionType = newReactionType || 'none';
            const newReactionData = REACTIONS_MAP[finalReactionType];
            
            // تحديث حالة الزر (اللون والأيقونة)
            reactButton.innerHTML = `<i class="${newReactionData.icon} ${newReactionData.color} ml-1"></i>
                                     <span class="text-gray-300">${newReactionData.arabic}</span>`;
            reactButton.dataset.currentReaction = finalReactionType; 
            
            // 2. تحديث قائمة التفاعلات (V3)
            const reactionsList = postElement.querySelector('.v3-reactions-list');
            reactionsList.innerHTML = ''; // تفريغ القائمة القديمة
            
            if (newReactionsCount > 0) {
                // إضافة العدد الإجمالي أولاً
                reactionsList.innerHTML += `<li class="flex items-center text-xs ml-3 text-gray-400">
                    <span class="reactions-total-count">${newReactionsCount}</span>
                    <i class="fas fa-hand-point-up mr-1 text-sm"></i>
                </li>`;

                // عرض أول 3 أنواع تفاعل
                const sortedReactions = Object.entries(allReactionCounts)
                    .filter(([type, count]) => count > 0)
                    .sort((a, b) => b[1] - a[1]) 
                    .slice(0, 3); 
                
                sortedReactions.forEach(([type, count]) => {
                    const reactionInfo = REACTIONS_MAP[type];
                    if (reactionInfo) {
                        const li = document.createElement('li');
                        li.className = 'flex items-center text-xs ml-2';
                        li.innerHTML = `
                            <i class="${reactionInfo.icon} ${reactionInfo.color} text-sm"></i>
                            <span class="mr-1">${count}</span>
                        `;
                        reactionsList.appendChild(li);
                    }
                });
            }
            
            // **إخفاء/إظهار قسم التفاعلات v3 بالكامل بناءً على العدد**
            const v3Section = postElement.querySelector('.v3-reactions-section');
            if (v3Section) {
                v3Section.classList.toggle('hidden', newReactionsCount === 0);
            }

        }

        // ----------------------------------------------------------------------
        // دالة التعامل مع التفاعل
        // ----------------------------------------------------------------------
        async function reactToPost(event) {
            // هنا نستخدم dataset من عنصر الـ button الذي تم الضغط عليه
            const postId = event.currentTarget.dataset.postId;
            const requestedReactionType = event.currentTarget.dataset.reactionType;
            // يتم جلب currentReaction من الزر الرئيسي ليعكس الحالة الفعلية للمنشور
            const postElement = document.getElementById(`post-${postId}`);
            const reactButton = postElement.querySelector('.react-btn');
            const currentReaction = reactButton.dataset.currentReaction;
            
            let newReactionType = requestedReactionType; 

            // **منطق نزع التفاعل:** إذا ضغط المستخدم على زر التفاعل الحالي (سواء كان من القائمة المنبثقة أو الزر الرئيسي)، يتم إلغاء التفاعل (إرسال null).
            if (requestedReactionType === currentReaction) {
                newReactionType = null; // لإلغاء التفاعل
            }

            try {
                const response = await fetch(`/api/posts/${postId}/react`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reactionType: newReactionType })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    // تحديث الواجهة الأمامية بالبيانات الجديدة
                    updateReactionUI(
                        postId, 
                        result.reaction, // قد تكون null للإلغاء
                        result.newReactionsCount, 
                        result.allReactionCounts
                    );
                } else {
                    alert(`فشل التفاعل: ${result.error || 'خطأ غير معروف'}`);
                }

            } catch (error) {
                console.error('Reaction error:', error);
                alert('فشل الاتصال بالخادم لإتمام التفاعل.');
            }
        }

        // ----------------------------------------------------------------------
        // دالة إنشاء عنصر المنشور (تم تحديثها لقبول بيانات التفاعل)
        // ----------------------------------------------------------------------
        function createPostElement(post) {
            const postElement = document.createElement('div');
            postElement.id = `post-${post.postId}`;
            postElement.className = 'bg-gray-900 p-4 mb-4 rounded-lg shadow-xl';

            // بيانات التفاعل المحملة من الخادم
            const userReactionType = post.userReaction || 'none';
            const totalReactions = post.reactionsCount || 0;
            const allReactionCounts = post.allReactionCounts || {}; 
            
            // الأيقونة الرئيسية وزر التفاعل بناءً على تفاعل المستخدم الحالي
            const mainReactionData = REACTIONS_MAP[userReactionType] || REACTIONS_MAP['none'];
                
            // إضافة وسم الوسائط إذا كان موجوداً
            let mediaHtml = '';
            if (post.media) {
                const mediaUrl = post.media.url;
                const mediaType = post.media.type;
                if (mediaType === 'image') {
                    mediaHtml = `<img src="${mediaUrl}" alt="Post Image" class="w-full rounded-lg mt-3 max-h-96 object-cover">`;
                } else if (mediaType === 'video') {
                    mediaHtml = `<video src="${mediaUrl}" controls class="w-full rounded-lg mt-3 max-h-96"></video>`;
                } else if (mediaType === 'audio') {
                    mediaHtml = `
                        <div class="mt-3 bg-gray-800 p-3 rounded-lg flex items-center">
                            <i class="fas fa-volume-up text-blue-400 ml-3"></i>
                            <audio src="${mediaUrl}" controls class="w-full"></audio>
                        </div>
                    `;
                }
            }

            // إنشاء الـ HTML للمنشور
            postElement.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex items-start">
                        <img src="${post.user.profile_picture_url}" alt="Profile Pic" class="w-10 h-10 rounded-full object-cover ml-3">
                        <div>
                            <p class="font-bold text-white">${post.user.username}</p>
                            <p class="text-xs text-gray-500">${new Date(post.timestamp).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' })}</p>
                        </div>
                    </div>
                    ${post.userId === currentUserId ? `
                    <div class="relative">
                        <button class="text-gray-400 hover:text-white menu-btn" data-post-id="${post.postId}">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                        <div class="absolute left-0 mt-2 w-48 bg-gray-700 rounded-md shadow-lg py-1 z-10 hidden post-menu">
                            <button class="block w-full text-right px-4 py-2 text-sm text-red-300 hover:bg-gray-600 delete-post-btn" data-post-id="${post.postId}">
                                <i class="fas fa-trash ml-2"></i> حذف المنشور
                            </button>
                        </div>
                    </div>` : ''}
                </div>

                <p class="text-white mt-3">${post.content}</p>
                ${mediaHtml}

                <div class="v3-reactions-section flex justify-between items-center mt-3 pt-2 border-t border-gray-800 text-gray-400">
                    <ul class="flex items-center v3-reactions-list">
                        </ul>
                    <p class="text-xs">${post.commentsCount || 0} تعليق</p>
                </div>

                <div class="flex justify-around items-center mt-3 pt-2 border-t border-gray-800">
                    <div class="relative group">
                        <button class="flex items-center text-sm font-semibold react-btn" data-post-id="${post.postId}" data-current-reaction="${userReactionType}">
                            <i class="${mainReactionData.icon} ${mainReactionData.color} ml-1"></i>
                            <span class="text-gray-300">${mainReactionData.arabic}</span>
                        </button>
                        <div class="absolute right-1/2 translate-x-1/2 bottom-full mb-2 p-2 bg-gray-700 rounded-full shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition duration-150 flex space-x-2">
                            <button class="reaction-icon-btn text-2xl" data-post-id="${post.postId}" data-reaction-type="love" title="أحببته">❤️</button>
                            <button class="reaction-icon-btn text-2xl" data-post-id="${post.postId}" data-reaction-type="support" title="أدعم">👏</button>
                            <button class="reaction-icon-btn text-2xl" data-post-id="${post.postId}" data-reaction-type="boring" title="ممل">🙄</button>
                            <button class="reaction-icon-btn text-2xl" data-post-id="${post.postId}" data-reaction-type="wise" title="حكيم">💡</button>
                        </div>
                    </div>

                    <button class="flex items-center text-gray-400 hover:text-blue-400 text-sm font-semibold comment-btn" data-post-id="${post.postId}">
                        <i class="fas fa-comment ml-1"></i>
                        <span>تعليق</span>
                    </button>
                </div>
            `;
            
            // ربط أحداث التفاعل (يجب أن يتم بعد إنشاء العنصر)
            postElement.querySelectorAll('.reaction-icon-btn').forEach(btn => {
                btn.addEventListener('click', reactToPost);
            });
            
            // ربط زر التفاعل الرئيسي (لإلغاء التفاعل)
            postElement.querySelector('.react-btn').addEventListener('click', (e) => {
                // عند الضغط على الزر الرئيسي، يتم إلغاء التفاعل الحالي
                const currentReaction = e.currentTarget.dataset.currentReaction;
                const postId = e.currentTarget.dataset.postId;

                // نقوم بمحاكاة الضغط على زر التفاعل الحالي لإلغائه
                const tempEvent = {
                    currentTarget: {
                        dataset: {
                            postId: postId,
                            reactionType: currentReaction, // نوع التفاعل المطلوب (الحالي)
                        }
                    }
                };
                reactToPost(tempEvent);
            });
            
            // ربط زر الحذف
            postElement.querySelector('.delete-post-btn')?.addEventListener('click', deletePost);
            
            // ربط زر عرض التعليقات
            postElement.querySelector('.comment-btn').addEventListener('click', () => showCommentModal(post.postId));
            
            // ربط زر القائمة 
            const menuBtn = postElement.querySelector('.menu-btn');
            const postMenu = postElement.querySelector('.post-menu');
            if (menuBtn && postMenu) {
                menuBtn.addEventListener('click', () => {
                    postMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', (event) => {
                    if (!menuBtn.contains(event.target) && !postMenu.contains(event.target)) {
                        postMenu.classList.add('hidden');
                    }
                });
            }


            // **ملاحظة: تحديث عرض العداد بعد إنشاء العنصر**
            // هذا يضمن ظهور العدد بجانب الأيقونة بشكل صحيح
            updateReactionUI(post.postId, userReactionType, totalReactions, allReactionCounts);

            return postElement;
        }

        // ----------------------------------------------------------------------
        // دالة حذف منشور
        // ----------------------------------------------------------------------
        async function deletePost(event) {
            const postId = event.currentTarget.dataset.postId;
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا المنشور؟')) {
                return;
            }

            try {
                const response = await fetch(`/api/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    document.getElementById(`post-${postId}`).remove();
                } else {
                    const result = await response.json();
                    alert(`فشل الحذف: ${result.error || 'خطأ غير معروف'}`);
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('فشل الاتصال بالخادم لحذف المنشور.');
            }
        }


        // ----------------------------------------------------------------------
        // دالة جلب وعرض المنشورات
        // ----------------------------------------------------------------------
        async function fetchAndDisplayPosts() {
            postsContainer.innerHTML = '<p class="text-center text-blue-400 py-10"><i class="fas fa-spinner fa-spin ml-2"></i> جارٍ تحميل المنشورات...</p>';
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();

                postsContainer.innerHTML = ''; 
                
                if (result.ok && result.posts.length > 0) {
                    result.posts.forEach(post => {
                        postsContainer.appendChild(createPostElement(post));
                    });
                } else if (result.posts && result.posts.length === 0) {
                    postsContainer.innerHTML = '<p class="text-center text-gray-500 py-10">لا توجد منشورات لعرضها حالياً.</p>';
                } else {
                    postsContainer.innerHTML = `<p class="text-center text-red-400 py-10">فشل في جلب المنشورات. ${result.error || ''}</p>`;
                }

            } catch (error) {
                console.error('Fetch posts error:', error);
                postsContainer.innerHTML = '<p class="text-center text-red-400 py-10">فشل الاتصال بالخادم لجلب المنشورات.</p>';
            }
        }


        // ----------------------------------------------------------------------
        // منطق الـ Modal والتعليقات
        // ----------------------------------------------------------------------
        const commentModal = document.getElementById('commentModal');
        const closeCommentModalBtn = document.getElementById('closeCommentModal');
        const commentsList = document.getElementById('commentsList');
        const postCommentBtn = document.getElementById('postCommentBtn');
        const newCommentInput = document.getElementById('newCommentInput');
        const commentError = document.getElementById('commentError');
        let currentPostIdForComments = null;

        closeCommentModalBtn.addEventListener('click', () => {
            commentModal.classList.add('hidden');
        });

        // إغلاق المودال عند النقر خارجها
        commentModal.addEventListener('click', (e) => {
            if (e.target === commentModal) {
                commentModal.classList.add('hidden');
            }
        });

        async function fetchComments(postId) {
            commentsList.innerHTML = '<p class="text-center text-gray-500">جارٍ تحميل التعليقات...</p>';
            try {
                const response = await fetch(`/api/posts/${postId}/comments`);
                const result = await response.json();

                commentsList.innerHTML = '';
                if (response.ok && result.comments.length > 0) {
                    result.comments.forEach(comment => {
                        const commentElement = document.createElement('div');
                        commentElement.className = 'flex items-start mb-4 p-3 bg-gray-800 rounded-lg';
                        commentElement.innerHTML = `
                            <img src="${comment.user.profile_picture_url}" alt="Profile" class="w-8 h-8 rounded-full object-cover ml-3">
                            <div>
                                <p class="font-semibold text-white text-sm">${comment.user.username}</p>
                                <p class="text-gray-300 text-sm">${comment.content}</p>
                            </div>
                        `;
                        commentsList.appendChild(commentElement);
                    });
                } else {
                    commentsList.innerHTML = '<p class="text-center text-gray-500">لا توجد تعليقات بعد.</p>';
                }
            } catch (error) {
                console.error('Error fetching comments:', error);
                commentsList.innerHTML = '<p class="text-center text-red-400">فشل في جلب التعليقات.</p>';
            }
        }

        function showCommentModal(postId) {
            currentPostIdForComments = postId;
            newCommentInput.value = '';
            commentError.classList.add('hidden');
            fetchComments(postId);
            commentModal.classList.remove('hidden');
        }
        
        // دالة إضافة تعليق
        async function postComment() {
            const content = newCommentInput.value.trim();
            if (content === '') {
                commentError.textContent = 'التعليق فارغ.';
                commentError.classList.remove('hidden');
                return;
            }

            const postId = currentPostIdForComments;
            postCommentBtn.disabled = true;
            postCommentBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i>';

            try {
                const response = await fetch(`/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    // تحديث قائمة التعليقات مباشرةً
                    fetchComments(postId); 
                    newCommentInput.value = '';
                    commentError.classList.add('hidden');
                    
                } else {
                    commentError.textContent = result.error || 'فشل في إضافة التعليق.';
                    commentError.classList.remove('hidden');
                }

            } catch (error) {
                commentError.textContent = 'فشل الاتصال بالخادم.';
                commentError.classList.remove('hidden');
            } finally {
                postCommentBtn.disabled = false;
                postCommentBtn.innerHTML = '<i class="fas fa-paper-plane text-lg"></i>'; 
            }
        }
        
        postCommentBtn.addEventListener('click', postComment);
        newCommentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                postComment();
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile')
                .then(response => response.ok ? response.json() : null)
                .then(data => {
                    const profilePicElement = document.getElementById('userProfilePic');
                    if (data && data.profile_picture_url) {
                        profilePicElement.src = data.profile_picture_url;
                        profilePicElement.alt = `صورة بروفايل ${data.username || 'المستخدم'}`;
                        currentUserId = data.id; // حفظ معرف المستخدم الحالي
                    }
                }).catch(console.error);
                
            fetchAndDisplayPosts();
        });
        
    </script>
</body>
</html>
