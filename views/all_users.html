  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #000; color: #e4e6eb; font-family: Inter, system-ui, sans-serif; overflow-x: hidden; overflow-wrap: break-word; word-wrap: break-word; }
    p, span, div, h1, h2, h3, h4, h5, h6, li, td, th, label, a { overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; }
    .glass-navbar { background-color: rgba(30,30,30,0.5); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .user-card { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); border-radius: 12px; padding:10px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .user-info { display:flex; gap:10px; align-items:center; min-width:0; text-decoration: none; color: inherit; transition: opacity 0.2s; }
    .user-info:hover { opacity: 0.8; }
    .user-name { font-weight:700; color:#e6eefb; }
    .user-sub { color:#9fb3c8; font-size:13px; }
    .action-btn { padding:8px 10px; border-radius:10px; border:1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); color:#e6eefb; cursor:pointer; }
    .action-btn.message { background: #10b981; color: #fff; border: none; padding: 6px 10px; border-radius: 12px; font-size: 13px; box-shadow: 0 2px 6px rgba(16,185,129,0.12); text-decoration: none; }
    .tab { padding:8px 12px; cursor:pointer; border-radius:999px; }
    .tab.active { background:#111827; border:1px solid rgba(255,255,255,0.04); }
    .friend-req-badge { position: absolute; top: -6px; left: -6px; min-width: 18px; height: 18px; padding: 0 6px; background: #ef4444; color:#fff; font-size:12px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; }
    .mobile-safe { padding-bottom:84px; }
    .btn-accept {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      box-shadow: 0 4px 14px rgba(22,163,74,0.2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .btn-accept:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(22,163,74,0.3);
      background: linear-gradient(135deg, #16a34a, #15803d);
    }
    .btn-accept:active { transform: translateY(0); }
    .btn-reject {
      background: linear-gradient(135deg, #f87171, #ef4444);
      color: #fff;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      box-shadow: 0 4px 14px rgba(239,68,68,0.2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .btn-reject:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239,68,68,0.3);
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    .btn-reject:active { transform: translateY(0); }
    @media (max-width:480px) {
      .action-btn.message, .btn-accept, .btn-reject { padding:6px 12px; font-size:12px; border-radius:12px; }
    }

    /* VERIFIED BADGE IMAGE */
    .verified-badge-img {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      margin-left: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.06);
      vertical-align: middle;
    }

    /* ------------------ Toasts (black glassy) ------------------ */
    #toastContainer {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1100;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        pointer-events: none;
    }
    .toast {
        min-width: 220px;
        max-width: 90vw;
        color: #ffffff;
        background: rgba(7,7,8,0.6);
        border: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 10px 14px;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: auto;
        font-size: 14px;
    }
    .toast.success { border-left: 4px solid #16a34a; }
    .toast.error   { border-left: 4px solid #ef4444; }
    .toast.info    { border-left: 4px solid #3b82f6; }
    .toast i { width: 18px; text-align: center; }
    .toast .msg { flex: 1; word-break: break-word; text-align: right; }
    .toast .close-btn { margin-left: 8px; background: transparent; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 14px; }

      <i class="fas fa-search" style="color:#9ca3af;font-size:15px;"></i>
      <input type="text" id="userSearchInput" placeholder="ابحث عن مستخدم..." oninput="filterUsers(this.value)" style="background:transparent;border:none;outline:none;color:#fff;width:100%;font-size:15px;" autocomplete="off">
    </div>

    <div class="flex gap-3 mb-4">
      <div id="tabAll" class="tab active">كل المستخدمين</div>
      <div id="tabRequests" class="tab">طلبات الصداقة</div>
    </div>

    <div id="allUsersContainer" class="space-y-3">
      <div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المستخدمين...</div>
    </div>

    <div id="requestsContainer" class="space-y-3 hidden">
      <div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل طلبات الصداقة...</div>
    </div>
  </main>

  <!-- Toast container -->
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<script>
  const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1768036959/post_media/1768036959482-badge.png";
  const tabAll = document.getElementById('tabAll');
  const tabRequests = document.getElementById('tabRequests');
  const allUsersContainer = document.getElementById('allUsersContainer');
  const requestsContainer = document.getElementById('requestsContainer');
  const friendReqTopBadge = document.getElementById('friendReqTopBadge');

  tabAll.addEventListener('click', () => { tabAll.classList.add('active'); tabRequests.classList.remove('active'); allUsersContainer.classList.remove('hidden'); requestsContainer.classList.add('hidden'); });
  tabRequests.addEventListener('click', () => { tabRequests.classList.add('active'); tabAll.classList.remove('active'); requestsContainer.classList.remove('hidden'); allUsersContainer.classList.add('hidden'); loadRequests(); });

  /* ---------------- Toast helper (black glassy) ---------------- */
  function showToast(message, opts = {}) {
    const { type = 'info', duration = 3500 } = opts;
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.setAttribute('role', 'status');
    toast.innerHTML = `
      <i class="${type === 'success' ? 'fas fa-check-circle' : (type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-info-circle')}"></i>
      <div class="msg">${escapeHtml(message)}</div>
      <button class="close-btn" aria-label="close">&times;</button>
    `;

    const closeBtn = toast.querySelector('.close-btn');
    const removeToast = () => {
      toast.style.transition = 'transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s';
      toast.style.transform = 'translateY(-10px)';
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 200);
    };
    closeBtn.addEventListener('click', removeToast);

    container.appendChild(toast);

    // entrance animation
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    requestAnimationFrame(() => {
      toast.style.transition = 'transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s';
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
    });

    const t = setTimeout(() => {
      removeToast();
    }, duration);

    // pause on hover
    toast.addEventListener('mouseenter', () => clearTimeout(t));
  }

  async function loadAllUsers() {
    allUsersContainer.innerHTML = '<div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المستخدمين...</div>';
    try {
      const res = await fetch('/api/users/all', { credentials: 'include' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error('failed');

      if (data.users.length === 0) {
        allUsersContainer.innerHTML = '<div class="text-center text-gray-500 p-6">لا يوجد مستخدمون آخرون.</div>';
        return;
      }

      allUsersContainer.innerHTML = data.users.map(u => {
        let btnHtml = '';
        if (u.is_friend) {
          btnHtml = `<a href="/chat?contactId=${u.id}" class="action-btn message">مراسلة</a>`;
        } else if (u.request_received) {
          btnHtml = `<button class="btn-accept" data-id="${u.id}" data-action="accept"><i class="fas fa-user-check" style="margin-left:4px"></i>قبول</button> <button class="btn-reject" data-id="${u.id}" data-action="reject"><i class="fas fa-times" style="margin-left:4px"></i>رفض</button>`;
        } else if (u.request_sent) {
          btnHtml = `<button class="action-btn" data-id="${u.id}" data-action="cancel">إلغاء الطلب</button>`;
        } else {
          btnHtml = `<button class="action-btn" data-id="${u.id}" data-action="send">إضافة صديق</button>`;
        }

        // placeholder for verified badge; will be updated later
        const verifiedPlaceholder = `<span class="verified-placeholder" data-user-id="${u.id}"></span>`;

        return `<div class="user-card">
          <a href="/profile?userId=${u.id}" class="user-info">
            <img src="${escapeHtml(u.profile_picture_url || '/assets/default_profile_pic.png')}" class="w-12 h-12 rounded-full object-cover">
            <div style="min-width:0">
              <div class="user-name">@${escapeHtml(u.username)} ${verifiedPlaceholder}</div>
              <div class="user-sub">${escapeHtml(u.full_name || '')}</div>
            </div>
          </a>
          <div>${btnHtml}</div>
        </div>`;
      }).join('');

      // bind actions
      document.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const action = e.currentTarget.getAttribute('data-action');
          if (action === 'send') {
            e.currentTarget.disabled = true;
            e.currentTarget.textContent = 'جاري الإرسال...';
            try {
              const r = await fetch('/api/friends/request', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ to_id: id })});
              const j = await r.json();
              if (r.ok && j.ok) { loadAllUsers(); updateFriendReqBadge(); showToast('تم إرسال طلب الصداقة.', { type: 'success' }); }
              else { showToast(j.error || 'فشل إرسال الطلب', { type: 'error' }); e.currentTarget.disabled = false; loadAllUsers(); }
            } catch (err) { showToast('خطأ في الشبكة', { type: 'error' }); e.currentTarget.disabled = false; loadAllUsers(); }
          } else if (action === 'cancel') {
            e.currentTarget.disabled = true;
            e.currentTarget.textContent = 'جاري الإلغاء...';
            try {
              const r = await fetch('/api/friends/cancel', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ to_id: id })});
              const j = await r.json();
              if (r.ok && j.ok) { loadAllUsers(); updateFriendReqBadge(); showToast('تم إلغاء الطلب.', { type: 'success' }); }
              else { showToast('فشل الإلغاء', { type: 'error' }); loadAllUsers(); }
            } catch (err) { showToast('خطأ', { type: 'error' }); loadAllUsers(); }
          } else if (action === 'accept') {
            e.currentTarget.disabled = true;
            try {
              const r = await fetch('/api/friends/accept', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ from_id: id })});
              const j = await r.json();
              if (r.ok && j.ok) { loadAllUsers(); loadRequests(); updateFriendReqBadge(); showToast('تمت الموافقة — أصبح هذا المستخدم صديقك.', { type: 'success' }); }
              else { showToast('فشل في القبول', { type: 'error' }); loadAllUsers(); }
            } catch (err) { showToast('خطأ في الشبكة', { type: 'error' }); loadAllUsers(); }
          } else if (action === 'reject') {
            e.currentTarget.disabled = true;
            try {
              const r = await fetch('/api/friends/reject', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ from_id: id })});
              const j = await r.json();
              if (r.ok && j.ok) { loadAllUsers(); loadRequests(); updateFriendReqBadge(); showToast('تم رفض الطلب.', { type: 'success' }); }
              else { showToast('فشل في الرفض', { type: 'error' }); loadAllUsers(); }
            } catch (err) { showToast('خطأ في الشبكة', { type: 'error' }); loadAllUsers(); }
          }
        });
      });

      // تحديث شارات التوثيق بعد العرض
      updateVerifiedBadges();

      // تطبيق فلتر البحث إن كان هناك نص مكتوب
      const currentQuery = document.getElementById('userSearchInput').value.trim();
      if (currentQuery) filterUsers(currentQuery);

    } catch (e) {
      allUsersContainer.innerHTML = '<div class="text-center text-red-500 p-6">فشل في تحميل المستخدمين.</div>';
    }
  }

  function filterUsers(query) {
    const cards = allUsersContainer.querySelectorAll('.user-card');
    const q = query.trim().toLowerCase();
    let visibleCount = 0;
    cards.forEach(card => {
      const name = (card.querySelector('.user-name') || {}).textContent || '';
      const sub = (card.querySelector('.user-sub') || {}).textContent || '';
      const match = !q || name.toLowerCase().includes(q) || sub.toLowerCase().includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });
    // إظهار رسالة إن لم يتم العثور على نتائج
    let noResult = allUsersContainer.querySelector('.no-search-result');
    if (visibleCount === 0 && q) {
      if (!noResult) {
        noResult = document.createElement('div');
        noResult.className = 'no-search-result text-center text-gray-500 p-6';
        noResult.innerHTML = '<i class="fas fa-search" style="font-size:28px;opacity:0.4;margin-bottom:8px;"></i><br>لا توجد نتائج لـ "' + escapeHtml(q) + '"';
        allUsersContainer.appendChild(noResult);
      } else {
        noResult.innerHTML = '<i class="fas fa-search" style="font-size:28px;opacity:0.4;margin-bottom:8px;"></i><br>لا توجد نتائج لـ "' + escapeHtml(q) + '"';
        noResult.style.display = '';
      }
    } else if (noResult) {
      noResult.style.display = 'none';
    }
  }

  async function loadRequests() {
    requestsContainer.innerHTML = '<div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الطلبات...</div>';
    try {
      const res = await fetch('/api/friends/requests', { credentials: 'include' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error('failed');

      if (!data.requests || data.requests.length === 0) {
        requestsContainer.innerHTML = '<div class="text-center text-gray-500 p-6">لا توجد طلبات صداقة واردة.</div>';
        updateFriendReqBadge();
        return;
      }

      requestsContainer.innerHTML = data.requests.map(r => {
        // placeholder for verified badge in requests list (profile might include is_verified)
        const verifiedPlaceholder = `<span class="verified-placeholder" data-user-id="${r.from}"></span>`;
        return `<div class="user-card">
          <a href="/profile?userId=${r.from}" class="user-info">
            <img src="${escapeHtml(r.profile_picture_url || '/assets/default_profile_pic.png')}" class="w-12 h-12 rounded-full object-cover">
            <div style="min-width:0">
              <div class="user-name">@${escapeHtml(r.username)} ${verifiedPlaceholder}</div>
            </div>
          </a>
          <div>
            <button class="btn-accept" data-action="accept" data-id="${r.from}">قبول</button>
            <button class="btn-reject" data-action="reject" data-id="${r.from}">رفض</button>
          </div>
        </div>`;
      }).join('');

      document.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const action = e.currentTarget.getAttribute('data-action');
          if (action === 'accept') {
            e.currentTarget.disabled = true;
            try {
              const r = await fetch('/api/friends/accept', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ from_id: id })});
              const j = await r.json();
              if (r.ok && j.ok) { loadRequests(); updateFriendReqBadge(); showToast('تمت الموافقة — أصبح هذا المستخدم صديقك.', { type: 'success' }); }
              else { showToast('فشل في القبول', { type: 'error' }); loadRequests(); }
            } catch (err) { showToast('خطأ', { type: 'error' }); loadRequests(); }
          } else if (action === 'reject') {
            e.currentTarget.disabled = true;
            try {
              const r = await fetch('/api/friends/reject', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ from_id: id })});
              const j = await r.json();
              if (r.ok && j.ok) { loadRequests(); updateFriendReqBadge(); showToast('تم رفض الطلب.', { type: 'success' }); }
              else { showToast('فشل', { type: 'error' }); loadRequests(); }
            } catch (err) { showToast('خطأ', { type: 'error' }); loadRequests(); }
          }
        });
      });

      // update badges for request users too
      updateVerifiedBadges();

      updateFriendReqBadge();

    } catch (e) {
      requestsContainer.innerHTML = '<div class="text-center text-red-500 p-6">فشل في تحميل الطلبات.</div>';
    }
  }

  async function updateFriendReqBadge() {
    try {
      const r = await fetch('/api/friends/requests_count', { credentials: 'same-origin' });
      const j = await r.json();
      if (r.ok && j.ok) {
        if (j.count > 0) { friendReqTopBadge.style.display = 'inline-flex'; friendReqTopBadge.textContent = j.count > 99 ? '99+' : String(j.count); }
        else friendReqTopBadge.style.display = 'none';
      }
    } catch (e) { /* ignore */ }
  }

  function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // SSE to update friend requests badge live
  (function setupSSE() {
    if (!window.EventSource) return;
    const es = new EventSource('/api/notifications/stream', { withCredentials: true });
    let _lastUnreadAll = -1;
    es.addEventListener('notifications', e => {
      try {
        const p = JSON.parse(e.data);
        const pending = p.pending_friend_requests_count || 0;
        const unread = p.unread_count || 0;
        if (_lastUnreadAll >= 0 && unread > _lastUnreadAll) {
          document.dispatchEvent(new CustomEvent('aite-new-notification'));
        }
        _lastUnreadAll = unread;
        if (pending > 0) { friendReqTopBadge.style.display = 'inline-flex'; friendReqTopBadge.textContent = pending > 99 ? '99+' : String(pending); }
        else friendReqTopBadge.style.display = 'none';
      } catch (err) {}
    });
    es.addEventListener('error', (err) => { /* ignore */ });
  })();

  // ----------------- VERIFIED BADGES HELPERS -----------------
  async function updateVerifiedBadges() {
    const placeholders = Array.from(document.querySelectorAll('.verified-placeholder'));
    if (placeholders.length === 0) return;
    await Promise.all(placeholders.map(async ph => {
      const uid = ph.dataset.userId;
      if (!uid) return;
      try {
        const res = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' });
        if (!res.ok) { ph.remove(); return; }
        const data = await res.json();
        if (data && data.ok && data.is_verified) {
          const img = document.createElement('img');
          img.src = VERIFIED_IMG_URL;
          img.alt = 'موثق';
          img.title = 'موثق';
          img.className = 'verified-badge-img';
          ph.replaceWith(img);
        } else {
          ph.remove();
        }
      } catch (e) {
        ph.remove();
      }
    }));
  }

  // initial load
  document.addEventListener('DOMContentLoaded', () => {
    loadAllUsers();
    updateFriendReqBadge();
  });
</script>

  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>

<script>
(function(){
  // ===== PWA Full App Install =====
  var DISMISS_KEY = 'aite_install_dismiss_v2';
  var bar = document.getElementById('pwaInstallBar');
  var desc = document.getElementById('pwaBarDesc');
  var btn = document.getElementById('pwaBarInstallBtn');
  var _prompt = null;

  // Is app already running in standalone (installed)?
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {
    setTimeout(function(){
      if (desc) desc.textContent = 'أضف Aite إلى الشاشة الرئيسية';
      if (btn) btn.textContent = 'إضافة';
      bar.style.display = 'block';
    }, 2500);
  }

  // Install button click
  window.pwaInstallApp = function() {
    if (_prompt) {
      // Native browser install prompt (Android/Chrome/Edge/Desktop)
      _prompt.prompt();
      _prompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          bar.style.display = 'none';
          try { localStorage.removeItem(DISMISS_KEY); } catch(e){}
        }
        _prompt = null;
      });
    } else if (isIOS) {
      // Show iOS step-by-step instructions
      var ov = document.createElement('div');
      ov.id = 'iosInstallOverlay';
      ov.innerHTML = '<div class="ios-install-box">'
        + '<img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin:0 auto 14px;display:block;">'
        + '<h3 style="color:#fff;font-size:19px;font-weight:700;margin:0 0 6px;">تثبيت Aite</h3>'
        + '<p style="color:#9ca3af;font-size:13px;margin:0 0 18px;">اتبع الخطوات التالية لتثبيت التطبيق:</p>'
        + '<div class="ios-step">1. اضغط على أيقونة المشاركة <span style="font-size:17px;">⬆️</span> في شريط Safari</div>'
        + '<div class="ios-step">2. اختر <b style="color:#fff;">"إضافة إلى الشاشة الرئيسية"</b> <span style="font-size:15px;">📱</span></div>'
        + '<div class="ios-step">3. اضغط <b style="color:#fff;">"إضافة"</b> في الأعلى</div>'
        + '<button onclick="this.closest('#iosInstallOverlay').remove()" style="margin-top:18px;background:#3b82f6;color:#fff;border:none;padding:11px 34px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">فهمت</button>'
        + '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target===ov) ov.remove(); });
    }
  };

  // Dismiss for 12 hours
  window.pwaDismiss = function() {
    bar.style.display = 'none';
    try { localStorage.setItem(DISMISS_KEY, Date.now().toString()); } catch(e){}
  };

  // Auto-hide on successful install
  window.addEventListener('appinstalled', function() {
    bar.style.display = 'none';
    _prompt = null;
  });
})();
</script>

<!-- Aite PWA Native App Features -->
<div id="aite-progress-bar"></div>
<div id="aite-offline-overlay">
  <img src="/icon-192.png" alt="Aite" class="aite-offline-logo">
  <div class="aite-offline-title">Aite</div>
  <div class="aite-offline-msg">no internet connection</div>
  <button class="aite-offline-btn" onclick="location.reload()">Try Again</button>
</div>
<script>
(function(){
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;

  var bar = document.getElementById('aite-progress-bar');
  var currentProgress = 0;
  var progressTimer = null;
  var isNavigating = false;

  function setProgress(value) {
    currentProgress = Math.min(value, 100);
    if (bar) bar.style.width = currentProgress + '%';
  }

  function startProgress() {
    if (isNavigating) return;
    isNavigating = true;
    currentProgress = 0;
    if (bar) {
      bar.style.transition = 'none';
      bar.style.width = '0';
      bar.style.opacity = '0';
      void bar.offsetWidth;
      bar.classList.add('active');
      bar.style.opacity = '1';
      bar.style.transition = 'width 150ms ease-out';
    }
    setProgress(15);
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(function() {
      if (currentProgress < 50) setProgress(currentProgress + 3);
      else if (currentProgress < 75) setProgress(currentProgress + 1.5);
      else if (currentProgress < 90) setProgress(currentProgress + 0.5);
      if (currentProgress >= 92) { clearInterval(progressTimer); progressTimer = null; }
    }, 150);
  }

  function completeProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (!bar) return;
    bar.style.transition = 'width 100ms ease-out';
    setProgress(100);
    setTimeout(function() {
      bar.style.transition = 'opacity 200ms ease';
      bar.style.opacity = '0';
      setTimeout(function() {
        bar.classList.remove('active');
        bar.style.width = '0';
        bar.style.transition = 'width 150ms ease-out';
        bar.style.opacity = '';
        currentProgress = 0;
        isNavigating = false;
      }, 200);
    }, 150);
  }

  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startProgress();
  });

  window.addEventListener('beforeunload', function() { startProgress(); });
  window.addEventListener('pageshow', function() { completeProgress(); });
  if (document.readyState === 'complete') completeProgress();
  else window.addEventListener('load', function() { completeProgress(); });

  document.addEventListener('contextmenu', function(e) {
    var tag = e.target.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !e.target.isContentEditable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('dragstart', function(e) { e.preventDefault(); }, { passive: false });

  var offlineOverlay = document.getElementById('aite-offline-overlay');
  function checkOnline() {
    if (!navigator.onLine && offlineOverlay) offlineOverlay.classList.add('show');
    else if (offlineOverlay) offlineOverlay.classList.remove('show');
  }
  window.addEventListener('online', checkOnline);
  window.addEventListener('offline', checkOnline);

  var notifSound = null;
  try { notifSound = new Audio('/notification.mp3'); notifSound.volume = 1.0; notifSound.preload = 'auto'; } catch(e) {}
  window.aitePlayNotificationSound = function() {
    try {
      if (notifSound) { notifSound.currentTime = 0; notifSound.play().catch(function(){}); }
      if (navigator.vibrate) navigator.vibrate([0, 300, 200, 300]);
    } catch(e) {}
  };
  document.addEventListener('aite-new-notification', function() { window.aitePlayNotificationSound(); });
})();
</script>

<!-- Aite Web Push Subscription -->
<script>
(function(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  async function subscribeWebPush() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) return; // already subscribed

      const resp = await fetch('/api/vapid-public-key');
      const data = await resp.json();
      if (!data.ok || !data.publicKey) return;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;

      const applicationServerKey = urlBase64ToUint8Array(data.publicKey);
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey
      });

      await fetch('/api/web-push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });
    } catch (e) {
      console.warn('Web Push subscription failed:', e);
    }
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Subscribe after page loads (with small delay to not block rendering)
  if (document.readyState === 'complete') {
    setTimeout(subscribeWebPush, 2000);
  } else {
    window.addEventListener('load', function() {
      setTimeout(subscribeWebPush, 2000);
    });
  }
})();
</script>
