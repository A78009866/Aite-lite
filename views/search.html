<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>بحث — Aite</title>

  <!-- Tailwind CDN (used for quick layout utilities) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#060607;
      --panel: rgba(18,18,20,0.55);
      --panel-border: rgba(255,255,255,0.04);
      --muted: #9aa0a6;
      --text: #e6eefb;
      --glass-blur: 8px;
    }
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg) 0%, #050506 100%);
      color:var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:22px;
    }

    .container{
      max-width:1100px;
      margin:0 auto;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }

    header.search-bar {
      display:flex;
      gap:12px;
      align-items:center;
      padding:14px;
    }

    .search-input {
      flex:1;
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:12px 14px;
      border-radius:10px;
      color:var(--text);
      outline:none;
    }

    .search-btn {
      padding:10px 14px;
      border-radius:10px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      color:var(--text);
      cursor:pointer;
      font-weight:700;
    }

    .sections {
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:18px;
      margin-top:18px;
    }

    .results {
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .result-group {
      padding:12px;
    }

    .group-title {
      font-weight:700;
      margin-bottom:10px;
      color:var(--text);
    }

    .grid-items {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
      gap:12px;
    }

    .card {
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
      padding:10px;
      border-radius:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }

    .card img, .card video {
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:8px;
      background:#0b0b0b;
    }

    .muted { color:var(--muted); font-size:0.92rem; }

    /* sidebar */
    .sidebar {
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .pill {
      background: rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
      padding:10px;
      border-radius:999px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      color:var(--muted);
      cursor:pointer;
    }

    .empty {
      text-align:center;
      padding:40px 12px;
      color:var(--muted);
    }

    /* minimal mobile tweaks */
    @media (max-width:900px){
      .sections { grid-template-columns: 1fr; }
      .sidebar { order: -1; }
      .card img, .card video { height:160px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass header search-bar">
      <button onclick="goBack()" class="pill" title="عودة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <input id="q" class="search-input" placeholder="ابحث عن أشخاص، منشورات، ريلز..." aria-label="بحث">

      <button id="searchBtn" class="search-btn" onclick="doSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:8px"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/></svg>
        بحث
      </button>
    </div>

    <div class="sections">
      <main class="results">
        <section id="reelsSection" class="glass result-group">
          <div class="group-title">ريلز</div>
          <div id="reelsList" class="grid-items"></div>
        </section>

        <section id="postsSection" class="glass result-group">
          <div class="group-title">منشورات</div>
          <div id="postsList" class="grid-items"></div>
        </section>

        <section id="peopleSection" class="glass result-group">
          <div class="group-title">أشخاص</div>
          <div id="peopleList" class="grid-items"></div>
        </section>
      </main>

      <aside class="glass sidebar">
        <div style="font-weight:700">بحث سريع</div>
        <div class="muted">ابحث بأسماء المستخدمين أو النص داخل المنشورات أو وصف الريلز.</div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="pill" onclick="quick('ترفيه')">ترفيه</button>
          <button class="pill" onclick="quick('طبخ')">طبخ</button>
          <button class="pill" onclick="quick('مسلسلات')">مسلسلات</button>
          <button class="pill" onclick="quick('موسيقى')">موسيقى</button>
        </div>

        <div style="margin-top:8px">
          <div class="muted">نصائح</div>
          <div class="muted" style="font-size:13px">اضغط على عنصر لعرضه. استخدم اسم المستخدم لفتح البروفايل.</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const qInput = document.getElementById('q');
    const reelsList = document.getElementById('reelsList');
    const postsList = document.getElementById('postsList');
    const peopleList = document.getElementById('peopleList');
    const searchBtn = document.getElementById('searchBtn');

    function goBack(){ if(document.referrer) history.back(); else window.location.href = '/chat_list'; }
    function quick(s){ qInput.value = s; doSearch(); }

    function escapeHtml(s){ if(!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function renderReel(r){
      const thumb = r.thumbnailUrl || r.videoUrl || '';
      return `
        <div class="card" onclick="openReel('${encodeURIComponent(r.reelId)}')">
          ${ thumb ? `<video muted playsinline preload="metadata" loop src="${escapeHtml(thumb)}"></video>` : `<div style="height:120px;background:#0b0b0b;border-radius:8px"></div>` }
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-weight:700">${escapeHtml(r.user?.username||'مستخدم')}</div>
              <div class="muted" style="font-size:13px">${escapeHtml((r.description||'').slice(0,120))}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPost(p){
      const media = (p.media && p.media.url) ? p.media.url : '';
      return `
        <div class="card" onclick="openPost('${encodeURIComponent(p.postId)}')">
          ${ media ? `<img src="${escapeHtml(media)}" alt="media">` : '' }
          <div><div style="font-weight:700">${escapeHtml(p.user?.username||'مستخدم')}</div></div>
          <div class="muted">${escapeHtml((p.content||'').slice(0,140))}</div>
        </div>
      `;
    }

    function renderPerson(u){
      const img = u.profile_picture_url || '';
      return `
        <div class="card" onclick="openProfile('${encodeURIComponent(u.id)}')">
          ${ img ? `<img src="${escapeHtml(img)}" alt="avatar">` : `<div style="height:120px;background:#0b0b0b;border-radius:8px"></div>` }
          <div><div style="font-weight:700">${escapeHtml(u.username||u.full_name||'مستخدم')}</div></div>
          <div class="muted">${escapeHtml(u.full_name||'')}</div>
        </div>
      `;
    }

    function openReel(id){ window.location.href = `/reels?id=${id}`; }
    function openPost(id){ window.location.href = `/post.html?id=${id}`; } // post.html provided separately
    function openProfile(id){ window.location.href = `/profile/${id}`; }

    async function doSearch(){
      const q = (qInput.value||'').trim();
      if(!q){ reelsList.innerHTML = '<div class="empty">أدخل كلمة للبحث</div>'; postsList.innerHTML=''; peopleList.innerHTML=''; return; }

      reelsList.innerHTML = '<div class="empty">جاري البحث...</div>';
      postsList.innerHTML = '<div class="empty">جاري البحث...</div>';
      peopleList.innerHTML = '<div class="empty">جاري البحث...</div>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { credentials: 'same-origin' });
        const data = await res.json();
        if(!res.ok || !data.ok){
          reelsList.innerHTML = '<div class="empty">فشل في البحث</div>';
          postsList.innerHTML = '<div class="empty">فشل في البحث</div>';
          peopleList.innerHTML = '<div class="empty">فشل في البحث</div>';
          return;
        }

        // reels
        if(data.reels && data.reels.length){
          reelsList.innerHTML = data.reels.map(renderReel).join('');
        } else reelsList.innerHTML = '<div class="empty">لا توجد نتائج في الريلز.</div>';

        // posts
        if(data.posts && data.posts.length){
          postsList.innerHTML = data.posts.map(renderPost).join('');
        } else postsList.innerHTML = '<div class="empty">لا توجد نتائج في المنشورات.</div>';

        // people
        if(data.people && data.people.length){
          peopleList.innerHTML = data.people.map(renderPerson).join('');
        } else peopleList.innerHTML = '<div class="empty">لا يوجد أشخاص مطابقون.</div>';

      } catch (e){
        console.error(e);
        reelsList.innerHTML = '<div class="empty">خطأ في الاتصال.</div>';
        postsList.innerHTML = '<div class="empty">خطأ في الاتصال.</div>';
        peopleList.innerHTML = '<div class="empty">خطأ في الاتصال.</div>';
      }
    }

    // run search on Enter
    qInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });

    // load q from query
    (function init(){
      const params = new URLSearchParams(window.location.search);
      if(params.get('q')) { qInput.value = params.get('q'); doSearch(); }
    })();
  </script>
</body>
</html>
