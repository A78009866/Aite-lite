<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        
        .search-navbar { 
            background: rgba(30,30,30,0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            position: sticky; top: 0; z-index: 50; 
            padding: 10px;
        }

        .search-input-wrapper {
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            display: flex; align-items: center;
            padding: 0 15px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }
        .search-input-wrapper:focus-within {
            background: rgba(255,255,255,0.15);
            border-color: #3b82f6;
        }
        .search-input {
            background: transparent; border: none; color: white; width: 100%; outline: none; margin-right: 10px;
        }

        /* Results Styling */
        .section-title { font-weight: 800; font-size: 16px; margin: 20px 0 10px 0; padding: 0 10px; color: #ccc; }
        
        .user-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .user-row:active { background: rgba(255,255,255,0.05); }

        /* Reels Grid */
        .reel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        
        /* Reel Item: Black background ensures black screen before loading */
        .reel-thumb { 
            aspect-ratio: 9/16; 
            background-color: #000000; 
            position: relative; 
            overflow: hidden; 
            cursor: pointer; 
        }
        .reel-thumb video, .reel-thumb img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .reel-icon { position: absolute; bottom: 5px; right: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 12px; z-index: 2; }

        /* Post Result */
        .post-result { background: rgba(20,20,20,0.5); margin: 10px; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .post-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #ddd; font-size: 14px; }
        
        .verified-badge-img {
            width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; display: inline-block;
        }
    </style>
</head>
<body>

    <header class="search-navbar">
        <div class="max-w-xl mx-auto flex items-center gap-3">
            <button onclick="window.history.back()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10">
                <i class="fas fa-arrow-right text-gray-300"></i>
            </button>
            <div class="search-input-wrapper flex-grow">
                <i class="fas fa-search text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="بحث" autocomplete="off" autofocus>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto pb-20">
        
        <div id="loading" class="hidden text-center py-10 text-blue-400">
            <i class="fas fa-circle-notch fa-spin text-2xl"></i>
        </div>

        <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-gray-600">
            <i class="fas fa-search text-4xl mb-4 opacity-30"></i>
            <p class="text-sm">اكتب للبحث عن أشخاص، ريلز، أو منشورات</p>
        </div>

        <div id="resultsContent" class="hidden">
            <div id="peopleSection" class="hidden">
                <h3 class="section-title">الأشخاص</h3>
                <div id="peopleList"></div>
            </div>

            <div id="reelsSection" class="hidden">
                <h3 class="section-title">ريلز</h3>
                <div id="reelsList" class="reel-grid"></div>
            </div>

            <div id="postsSection" class="hidden">
                <h3 class="section-title">منشورات</h3>
                <div id="postsList"></div>
            </div>
        </div>

    </main>

    <script>
        const input = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const resultsContent = document.getElementById('resultsContent');
        const emptyState = document.getElementById('emptyState');
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        
        let debounceTimeout;

        input.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            clearTimeout(debounceTimeout);
            
            if (!val) {
                emptyState.classList.remove('hidden');
                resultsContent.classList.add('hidden');
                loading.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            loading.classList.remove('hidden');
            resultsContent.classList.add('hidden');

            debounceTimeout = setTimeout(() => doSearch(val), 600);
        });

        async function doSearch(query) {
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                loading.classList.add('hidden');
                resultsContent.classList.remove('hidden');
                
                renderResults(data);
            } catch (e) {
                console.error(e);
                loading.classList.add('hidden');
            }
        }

        function renderResults(data) {
            const peopleSec = document.getElementById('peopleSection');
            const reelsSec = document.getElementById('reelsSection');
            const postsSec = document.getElementById('postsSection');

            // 1. Render People
            if (data.people && data.people.length > 0) {
                peopleSec.classList.remove('hidden');
                document.getElementById('peopleList').innerHTML = data.people.map(u => {
                    // Check if verified (backend should return verified status, or we assume based on user object)
                    // Assuming u.is_verified or similar exists, otherwise logic needs fetching profile.
                    // For search results, usually basic info is returned. Let's try to show badge if data exists.
                    // If your search API doesn't return verified status, you might need to fetch profile or update backend.
                    // Here we will check u.is_verified if available.
                    
                    // Mock verification check (if API doesn't send it, you'll need to update API)
                    // For now, let's display it if the property exists
                    const verifiedBadge = u.is_verified 
                        ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="Verified">` 
                        : '';

                    return `
                    <div class="user-row" onclick="window.location.href='/profile?userId=${u.id}'">
                        <div class="flex items-center gap-3">
                            <img src="${u.profile_picture_url || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover">
                            <div>
                                <div class="font-bold text-sm text-white flex items-center">
                                    ${u.username} ${verifiedBadge}
                                </div>
                                <div class="text-xs text-gray-500">${u.full_name || ''}</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-left text-gray-600 text-xs"></i>
                    </div>
                    `;
                }).join('');
            } else {
                peopleSec.classList.add('hidden');
            }

            // 2. Render Reels
            if (data.reels && data.reels.length > 0) {
                reelsSec.classList.remove('hidden');
                document.getElementById('reelsList').innerHTML = data.reels.map(r => `
                    <div class="reel-thumb" onclick="window.location.href='/reels?id=${r.reelId}'">
                        <video src="${r.videoUrl}" muted playsinline></video>
                        <div class="reel-icon text-white"><i class="fas fa-play"></i></div>
                    </div>
                `).join('');
            } else {
                reelsSec.classList.add('hidden');
            }

            // 3. Render Posts
            if (data.posts && data.posts.length > 0) {
                postsSec.classList.remove('hidden');
                document.getElementById('postsList').innerHTML = data.posts.map(p => `
                    <div class="post-result" onclick="window.location.href='/post.html?id=${p.postId}'">
                        <div class="flex items-center gap-2 mb-2">
                            <img src="${p.user.profile_picture_url}" class="w-6 h-6 rounded-full">
                            <span class="text-xs font-bold text-gray-300">${p.user.username}</span>
                            <span class="text-[10px] text-gray-600">${new Date(p.timestamp).toLocaleDateString()}</span>
                        </div>
                        <div class="post-text">${p.content}</div>
                        ${p.media ? '<div class="mt-2 text-xs text-blue-400"><i class="fas fa-paperclip"></i> مرفق وسائط</div>' : ''}
                    </div>
                `).join('');
            } else {
                postsSec.classList.add('hidden');
            }

            if ((!data.people || !data.people.length) && (!data.reels || !data.reels.length) && (!data.posts || !data.posts.length)) {
                resultsContent.innerHTML = '<div class="text-center py-10 text-gray-500">لا توجد نتائج مطابقة.</div>';
                resultsContent.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
