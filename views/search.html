<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بحث — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background: linear-gradient(180deg,#020202 0%, #070707 100%); color:#e6eefb; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; margin:0; min-height:100vh;}
    .container { max-width:980px; margin:28px auto; padding:18px; background: rgba(8,8,10,0.6); border:1px solid rgba(255,255,255,0.06); border-radius:12px; backdrop-filter: blur(8px); }
    .search-row { display:flex; gap:10px; align-items:center; }
    .search-input { flex:1; padding:12px 14px; border-radius:10px; background:#0b1220; border:1px solid rgba(255,255,255,0.06); color:#e6eefb; }
    .search-btn { padding:10px 14px; border-radius:10px; background: #0ea5a4; color:#051018; border:none; cursor:pointer; font-weight:700; }
    .section { margin-top:18px; }
    .section h3 { font-weight:800; margin-bottom:8px; }
    .items-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
    .item { background: rgba(15,15,18,0.6); padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); cursor:pointer; }
    .item img { width:100%; height:120px; object-fit:cover; border-radius:8px; }
    .meta { margin-top:8px; }
    .muted { color:#9ca3af; font-size:0.9rem; }
    .back-btn { float:left; background:transparent; border:1px solid rgba(255,255,255,0.06); padding:8px 10px; border-radius:8px; color:#cbd5e1; cursor:pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-right"></i> العودة</button>
        <h2 style="display:inline-block; margin-right:10px; font-size:1.2rem; font-weight:900;">بحث</h2>
      </div>
    </div>

    <div class="search-row" style="margin-top:12px;">
      <input id="qInput" class="search-input" placeholder="ابحث عن أشخاص، منشورات، ريلز..." />
      <button id="doSearchBtn" class="search-btn"><i class="fas fa-search"></i> بحث</button>
    </div>

    <div id="results" class="mt-6">
      <div id="reelsSection" class="section">
        <h3>ريلز</h3>
        <div id="reelsList" class="items-grid"></div>
      </div>

      <div id="postsSection" class="section">
        <h3>منشورات</h3>
        <div id="postsList" class="items-grid"></div>
      </div>

      <div id="peopleSection" class="section">
        <h3>أشخاص</h3>
        <div id="peopleList" class="items-grid"></div>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      if (document.referrer && document.referrer.includes('/chat_list')) window.history.back();
      else window.location.href = '/chat_list';
    }

    const qInput = document.getElementById('qInput');
    const doSearchBtn = document.getElementById('doSearchBtn');
    const reelsList = document.getElementById('reelsList');
    const postsList = document.getElementById('postsList');
    const peopleList = document.getElementById('peopleList');

    function renderReel(r) {
      const thumb = r.thumbnailUrl || r.videoUrl || '';
      return `<div class="item" onclick="openReel('${encodeURIComponent(r.reelId)}')">
                <img src="${escapeHtml(thumb)}" alt="">
                <div class="meta"><div style="font-weight:700;">${escapeHtml(r.user?.username || 'مستخدم')}</div><div class="muted">${escapeHtml(r.description || '')}</div></div>
              </div>`;
    }
    function renderPost(p) {
      const media = (p.media && p.media.url) ? p.media.url : '';
      const text = p.content || '';
      return `<div class="item" onclick="openPost('${encodeURIComponent(p.postId)}')">
                ${media ? `<img src="${escapeHtml(media)}" alt="">` : ''}
                <div class="meta"><div style="font-weight:700;">${escapeHtml(p.user?.username || 'مستخدم')}</div><div class="muted">${escapeHtml(truncate(text,120))}</div></div>
              </div>`;
    }
    function renderPerson(u) {
      return `<div class="item" onclick="openProfile('${encodeURIComponent(u.id)}')">
                <img src="${escapeHtml(u.profile_picture_url || '')}" alt="">
                <div class="meta"><div style="font-weight:700;">${escapeHtml(u.username || u.full_name || 'مستخدم')}</div><div class="muted">${escapeHtml(u.full_name || '')}</div></div>
              </div>`;
    }

    function truncate(s, n){ if(!s) return ''; return s.length>n? s.slice(0,n-1)+'…': s; }
    function escapeHtml(s){ if(!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function openReel(id){ window.location.href = `/reels?id=${id}`; }
    function openPost(id){ window.location.href = `/post.html?id=${id}`; /* adjust if your post view route differs */ }
    function openProfile(id){ window.location.href = `/profile/${id}`; }

    async function doSearch(q) {
      if (!q || q.trim().length === 0) {
        reelsList.innerHTML = ''; postsList.innerHTML = ''; peopleList.innerHTML = '';
        return;
      }
      reelsList.innerHTML = '<div class="muted">جاري البحث...</div>';
      postsList.innerHTML = '<div class="muted">جاري البحث...</div>';
      peopleList.innerHTML = '<div class="muted">جاري البحث...</div>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { credentials: 'same-origin' });
        const data = await res.json();
        if (res.ok && data.ok) {
          // reels
          reelsList.innerHTML = (data.reels && data.reels.length>0) ? data.reels.map(renderReel).join('') : '<div class="muted">لا توجد نتائج في الريلز.</div>';
          // posts
          postsList.innerHTML = (data.posts && data.posts.length>0) ? data.posts.map(renderPost).join('') : '<div class="muted">لا توجد نتائج في المنشورات.</div>';
          // people
          peopleList.innerHTML = (data.people && data.people.length>0) ? data.people.map(renderPerson).join('') : '<div class="muted">لا يوجد أشخاص مطابقون.</div>';
        } else {
          reelsList.innerHTML = '<div class="muted">حدث خطأ أثناء البحث.</div>';
          postsList.innerHTML = '<div class="muted">حدث خطأ أثناء البحث.</div>';
          peopleList.innerHTML = '<div class="muted">حدث خطأ أثناء البحث.</div>';
        }
      } catch (e) {
        reelsList.innerHTML = '<div class="muted">خطأ في الاتصال.</div>';
        postsList.innerHTML = '<div class="muted">خطأ في الاتصال.</div>';
        peopleList.innerHTML = '<div class="muted">خطأ في الاتصال.</div>';
      }
    }

    doSearchBtn.addEventListener('click', () => doSearch(qInput.value));
    qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(qInput.value); });

    // optional: if user arrives with ?q=xxx
    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) { qInput.value = params.get('q'); doSearch(qInput.value); }
  </script>
</body>
</html>
