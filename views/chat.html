<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* إعدادات الألوان الأساسية */
:root {
  --bg: #0f172a; /* خلفية داكنة */
  --header-bg: rgba(30, 41, 59, 0.8);
  --msg-incoming: #334155;
  --msg-outgoing: #0ea5e9;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --accent: #38bdf8;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* الرأس */
header {
  display: flex;
  align-items: center;
  padding: 10px 15px;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  z-index: 10;
  height: 60px;
  box-sizing: border-box;
}

.back-btn {
  color: var(--text-primary);
  font-size: 1.2rem;
  margin-left: 15px;
  text-decoration: none;
}

.user-info {
  display: flex;
  align-items: center;
  flex-grow: 1;
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  margin-left: 10px;
  border: 2px solid var(--accent);
}

.user-name {
  font-weight: 600;
  font-size: 1rem;
}

/* منطقة الرسائل */
#messages-container {
  flex-grow: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.message-wrapper {
  display: flex;
  width: 100%;
  margin-bottom: 5px;
}

.message-wrapper.me {
  justify-content: flex-start; /* لأن الاتجاه RTL، البداية هي اليمين */
}

.message-wrapper.other {
  justify-content: flex-end; /* النهاية هي اليسار */
  flex-direction: row-reverse;
}

.message-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 16px;
  position: relative;
  font-size: 0.95rem;
  line-height: 1.5;
  word-wrap: break-word;
}

.message-wrapper.me .message-bubble {
  background-color: var(--msg-outgoing);
  color: white;
  border-bottom-right-radius: 4px;
}

.message-wrapper.other .message-bubble {
  background-color: var(--msg-incoming);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
}

/* تنسيق الصور والفيديو */
.media-content {
  max-width: 100%;
  border-radius: 10px;
  margin-top: 5px;
  display: block;
}

/* =========================================
   تنسيق مشغل الصوت المخصص (الحل للمؤشر)
   ========================================= */
.custom-audio-player {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0, 0, 0, 0.2);
  padding: 8px 12px;
  border-radius: 20px;
  width: 220px;
  direction: ltr; /* لضمان عمل الشريط بشكل صحيح */
}

.play-btn {
  background: none;
  border: none;
  color: white;
  font-size: 1.2rem;
  cursor: pointer;
  width: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* شريط التمرير الأبيض الواضح */
.audio-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

/* مقبض الشريط (الدوائر) لمتصفحات كروم وسفاري */
.audio-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff; /* أبيض ناصع */
  cursor: pointer;
  box-shadow: 0 0 5px rgba(0,0,0,0.5);
  transition: transform 0.1s;
}
.audio-slider::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

/* مقبض الشريط لمتصفحات فايرفوكس */
.audio-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 5px rgba(0,0,0,0.5);
}

.audio-time {
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.9);
  min-width: 35px;
  text-align: center;
}

/* منطقة الإدخال */
footer {
  padding: 10px;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  gap: 10px;
}

#message-input {
  flex-grow: 1;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  padding: 12px 15px;
  border-radius: 25px;
  color: white;
  font-size: 1rem;
  outline: none;
}

.action-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.1);
  color: var(--accent);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.action-btn:active {
  background: rgba(255, 255, 255, 0.2);
}

.send-btn {
  background: var(--accent);
  color: white;
}

/* تسجيل الصوت */
#recording-ui {
  display: none;
  flex-grow: 1;
  align-items: center;
  color: #ef4444;
  font-weight: bold;
  padding: 0 15px;
}

.recording-dot {
  width: 10px;
  height: 10px;
  background: #ef4444;
  border-radius: 50%;
  margin-right: 10px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <a href="/" class="back-btn"><i class="fas fa-arrow-right"></i></a>
  <div class="user-info">
    <img src="" id="header-avatar" class="user-avatar" alt="Avatar">
    <span id="header-name" class="user-name">جاري التحميل...</span>
  </div>
  <button class="action-btn" style="background:transparent;"><i class="fas fa-phone"></i></button>
</header>

<div id="messages-container">
  </div>

<footer>
  <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(this)">
  <button class="action-btn" onclick="document.getElementById('file-input').click()">
    <i class="fas fa-paperclip"></i>
  </button>

  <input type="text" id="message-input" placeholder="اكتب رسالة..." autocomplete="off">
  
  <div id="recording-ui">
    <div class="recording-dot"></div>
    <span id="record-timer">00:00</span>
  </div>

  <button class="action-btn" id="mic-btn">
    <i class="fas fa-microphone"></i>
  </button>
  <button class="action-btn send-btn hidden" id="send-btn">
    <i class="fas fa-paper-plane"></i>
  </button>
</footer>

<script src="/socket.io/socket.io.js"></script>

<script>
  // استخراج معرف المحادثة والمستخدم من الرابط أو الجلسة
  // نفترض أن الخادم يمرر userId في قالب أو نجلبه من API
  // هنا سنعتمد على استخراج chatId من الـ URL (مثال: /chat/123_456)
  const pathParts = window.location.pathname.split('/');
  const chatId = pathParts[pathParts.length - 1]; // أو استخرجه حسب طريقة التوجيه لديك
  
  let myId = null; 
  let currentAudio = null;
  let currentPlayBtn = null;
  const socket = io();

  const messagesContainer = document.getElementById('messages-container');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');
  const recordingUi = document.getElementById('recording-ui');
  const recordTimer = document.getElementById('record-timer');

  // ==========================================
  // 1. التهيئة وجلب الرسائل
  // ==========================================
  async function initChat() {
    try {
      // طلب الرسائل من الـ API الجديد الذي أنشأناه في server.js
      const res = await fetch(`/api/messages/${chatId}`);
      if(!res.ok) throw new Error('Failed to load');
      const data = await res.json();
      
      myId = data.currentUserId;
      
      // تحديث الرأس
      document.getElementById('header-name').textContent = data.otherUser.username;
      document.getElementById('header-avatar').src = data.otherUser.avatar;

      // بناء الرسائل
      messagesContainer.innerHTML = '';
      data.messages.forEach(msg => {
        appendMessage(msg, false); // false = لا تقم بالتمرير للأسفل مع كل رسالة أثناء التحميل الأولي
      });

      // تمرير لآخر رسالة
      scrollToBottom();

      // إعداد اتصال Socket
      socket.emit('joinChat', chatId);

    } catch (err) {
      console.error(err);
      messagesContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">حدث خطأ في تحميل المحادثة</div>';
    }
  }

  // ==========================================
  // 2. دالة بناء الرسالة (بدون إعادة تحميل الصفحة)
  // ==========================================
  function appendMessage(msg, shouldScroll = true) {
    const isMe = msg.senderId === myId;
    const dirClass = isMe ? 'me' : 'other';
    
    // تحديد المحتوى (نص، صورة، صوت)
    let contentHtml = '';
    
    if (msg.type === 'text' || !msg.media) {
      contentHtml = `<div class="text-content">${escapeHtml(msg.content)}</div>`;
    } 
    else if (msg.media.type.startsWith('image')) {
      contentHtml = `<img src="${msg.media.url}" class="media-content" onclick="window.open(this.src)">`;
      if(msg.content) contentHtml += `<div class="mt-2">${escapeHtml(msg.content)}</div>`;
    }
    else if (msg.media.type.startsWith('video')) {
      contentHtml = `<video src="${msg.media.url}" controls class="media-content"></video>`;
    }
    else if (msg.media.type.startsWith('audio') || msg.media.url.endsWith('.webm') || msg.media.url.endsWith('.mp3')) {
      // هنا نستخدم المشغل المخصص لحل مشكلة اللون الأبيض
      const uniqueId = 'audio-' + msg.messageId;
      contentHtml = `
        <div class="custom-audio-player">
          <button class="play-btn" onclick="toggleAudio('${uniqueId}', '${msg.media.url}')">
            <i class="fas fa-play"></i>
          </button>
          <input type="range" class="audio-slider" id="${uniqueId}-slider" value="0" min="0" step="0.1" oninput="seekAudio('${uniqueId}', this.value)">
          <span class="audio-time" id="${uniqueId}-time">0:00</span>
          <audio id="${uniqueId}" src="${msg.media.url}" preload="metadata" ontimeupdate="updateSlider('${uniqueId}')" onended="resetPlayer('${uniqueId}')"></audio>
        </div>
      `;
    }

    const html = `
      <div class="message-wrapper ${dirClass}" id="msg-${msg.messageId}">
        <div class="message-bubble">
          ${contentHtml}
          <div style="font-size:0.7rem; color:rgba(255,255,255,0.5); text-align:left; margin-top:4px;">
            ${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
          </div>
        </div>
      </div>
    `;

    // إضافة الرسالة دون المساس بالعناصر الأخرى (الحفاظ على الصوت شغالاً)
    messagesContainer.insertAdjacentHTML('beforeend', html);

    if (shouldScroll) scrollToBottom();
  }

  // ==========================================
  // 3. منطق مشغل الصوت المخصص (إصلاح المؤشر)
  // ==========================================
  function toggleAudio(id, url) {
    const audio = document.getElementById(id);
    const btnIcon = document.querySelector(`button[onclick="toggleAudio('${id}', '${url}')"] i`);

    // إيقاف الصوت السابق إذا كان مختلفاً
    if (currentAudio && currentAudio !== audio) {
      currentAudio.pause();
      if(currentPlayBtn) currentPlayBtn.className = 'fas fa-play';
    }

    if (audio.paused) {
      audio.play();
      btnIcon.className = 'fas fa-pause';
      currentAudio = audio;
      currentPlayBtn = btnIcon;
    } else {
      audio.pause();
      btnIcon.className = 'fas fa-play';
    }
  }

  function updateSlider(id) {
    const audio = document.getElementById(id);
    const slider = document.getElementById(id + '-slider');
    const timeDisplay = document.getElementById(id + '-time');
    
    if (!isNaN(audio.duration)) {
      slider.max = audio.duration;
      slider.value = audio.currentTime;
      timeDisplay.textContent = formatTime(audio.currentTime);
    }
  }

  function seekAudio(id, value) {
    const audio = document.getElementById(id);
    audio.currentTime = value;
  }

  function resetPlayer(id) {
    const btnIcon = document.querySelector(`button[onclick*="'${id}'"] i`);
    if(btnIcon) btnIcon.className = 'fas fa-play';
    document.getElementById(id + '-slider').value = 0;
    document.getElementById(id + '-time').textContent = "0:00";
  }

  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
  }

  // ==========================================
  // 4. معالجة الأحداث وال Socket (إصلاح التوقف)
  // ==========================================
  
  // استقبال رسالة جديدة
  socket.on('receiveMessage', (msg) => {
    // التحقق مما إذا كانت الرسالة لهذه المحادثة
    // (يمكن تحسين ذلك بالتحقق من chatId في الرسالة إذا كان الخادم يرسله)
    appendMessage(msg, true);
    // ملاحظة: لم نقم باستدعاء initChat()، لذلك لن يتوقف الصوت
  });

  // التمرير للأسفل
  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // الهروب من HTML (حماية)
  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;")
               .replace(/'/g, "&#039;");
  }

  // ==========================================
  // 5. إرسال الرسائل والتسجيل (مبسط)
  // ==========================================
  
  // تبديل الأزرار عند الكتابة
  messageInput.addEventListener('input', () => {
    if (messageInput.value.trim().length > 0) {
      micBtn.classList.add('hidden');
      sendBtn.classList.remove('hidden');
    } else {
      micBtn.classList.remove('hidden');
      sendBtn.classList.add('hidden');
    }
  });

  // إرسال رسالة نصية
  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  async function sendMessage() {
    const content = messageInput.value.trim();
    if (!content) return;

    try {
      const response = await fetch('/chat/send', { // تأكد من المسار في server.js
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chatId, content, type: 'text' })
      });
      
      if(response.ok) {
        messageInput.value = '';
        micBtn.classList.remove('hidden');
        sendBtn.classList.add('hidden');
      }
    } catch (e) {
      console.error(e);
    }
  }

  // منطق التسجيل الصوتي (JavaScript)
  let mediaRecorder;
  let audioChunks = [];
  let startTime;
  let timerInterval;

  micBtn.addEventListener('click', async () => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
      startRecording();
    } else {
      stopRecording();
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      
      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        uploadFile(audioBlob, 'audio');
        resetRecordingUI();
      };

      mediaRecorder.start();
      
      // UI Updates
      messageInput.classList.add('hidden');
      micBtn.innerHTML = '<i class="fas fa-stop"></i>';
      recordingUi.style.display = 'flex';
      
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const diff = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(diff / 60);
        const s = diff % 60;
        recordTimer.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      }, 1000);

    } catch (err) {
      console.error('Mic access error', err);
      alert('لا يمكن الوصول للميكروفون');
    }
  }

  function stopRecording() {
    if (mediaRecorder) mediaRecorder.stop();
  }

  function resetRecordingUI() {
    clearInterval(timerInterval);
    recordingUi.style.display = 'none';
    messageInput.classList.remove('hidden');
    micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
    recordTimer.textContent = "00:00";
    // إيقاف المسار
    if(mediaRecorder && mediaRecorder.stream) {
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }
  }

  // رفع الملفات (صوت أو صور)
  async function uploadFile(file, type) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('chatId', chatId);
    formData.append('type', type);

    // إضافة رسالة وهمية فورية للسرعة (اختياري)
    
    try {
      await fetch('/chat/upload', { // تأكد من المسار في server.js
        method: 'POST',
        body: formData
      });
    } catch (e) {
      console.error(e);
      alert('فشل الرفع');
    }
  }

  function handleFileUpload(input) {
    if(input.files && input.files[0]) {
      const file = input.files[0];
      const type = file.type.startsWith('image') ? 'image' : (file.type.startsWith('video') ? 'video' : 'file');
      uploadFile(file, type);
    }
  }

  // تشغيل عند التحميل
  initChat();

</script>
</body>
</html>
