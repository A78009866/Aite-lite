<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #000;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --accent: #7dd3fc;
  --muted: #cbd5e1;
  --reply-bg: rgba(255, 255, 255, 0.08);
  --reply-border: rgba(255, 255, 255, 0.15);
  
  /* ألوان الرسائل */
  --msg-incoming-bg: rgba(255, 255, 255, 0.08);
  --msg-outgoing-bg: rgba(14, 165, 233, 0.25);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  background-color: var(--bg);
  color: #fff;
  font-family: 'Inter', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--glass-border);
  z-index: 50;
  position: relative;
}
.back-btn {
  color: #fff;
  font-size: 1.2rem;
  margin-left: 15px;
  cursor: pointer;
}
.user-info {
  display: flex;
  align-items: center;
  flex: 1;
}
.user-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--glass-border);
  margin-left: 10px;
}
.user-details h3 {
  margin: 0; font-size: 1rem; font-weight: 600;
}
.user-status {
  font-size: 0.75rem; color: #10b981; /* green for online */
}

/* Chat Area */
#chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  scroll-behavior: smooth; 
}
/* إزالة الـ smooth scroll برمجياً عند تحميل الرسائل القديمة لمنع القفز */
.no-smooth { scroll-behavior: auto !important; }

.message-group {
  display: flex;
  flex-direction: column;
  max-width: 80%;
  position: relative;
}
.message-group.me {
  align-self: flex-end;
  align-items: flex-end;
}
.message-group.other {
  align-self: flex-start;
  align-items: flex-start;
}

.message-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  position: relative;
  word-wrap: break-word;
  font-size: 0.95rem;
  line-height: 1.5;
  color: #fff;
  transition: transform 0.2s;
  min-width: 80px;
}
.me .message-bubble {
  background: var(--msg-outgoing-bg);
  border-bottom-left-radius: 4px;
}
.other .message-bubble {
  background: var(--msg-incoming-bg);
  border-bottom-right-radius: 4px;
}

/* Reply Context Inside Bubble */
.reply-preview {
  background: rgba(0,0,0,0.2);
  border-left: 3px solid var(--accent);
  padding: 6px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  display: flex; 
  flex-direction: column;
}
.reply-sender { font-weight: bold; color: var(--accent); margin-bottom: 2px;}
.reply-text { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Media */
.msg-img, .msg-video {
  max-width: 100%;
  border-radius: 12px;
  margin-top: 5px;
  display: block;
}

/* Audio Player Styles - FIXED */
.audio-player {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.2);
  padding: 8px 12px;
  border-radius: 25px;
  width: 240px;
  margin-top: 5px;
}
.play-btn {
  background: none; border: none; color: #fff;
  cursor: pointer; font-size: 1.2rem;
  width: 30px; display: flex; justify-content: center;
}
/* المؤشر الأبيض */
.audio-slider {
  flex: 1;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.2);
  height: 4px;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}
.audio-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  background: #ffffff; /* أبيض ناصع */
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 5px rgba(0,0,0,0.3);
  margin-top: -4px; /* توسيط النقطة */
}
.audio-slider::-moz-range-thumb {
  width: 12px; height: 12px;
  background: #ffffff;
  border: none;
  border-radius: 50%;
  cursor: pointer;
}
.audio-time {
  font-size: 0.7rem; color: #ddd;
  min-width: 35px; text-align: center;
}

/* Footer (Input) */
footer {
  padding: 10px;
  background: rgba(0,0,0,0.9);
  border-top: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 50;
}
/* Reply UI above input */
#reply-bar {
  display: none;
  background: var(--reply-bg);
  border: 1px solid var(--reply-border);
  border-radius: 12px;
  padding: 8px 12px;
  position: relative;
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.close-reply {
  position: absolute; top: 5px; left: 10px;
  color: #aaa; cursor: pointer;
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.attach-btn {
  color: var(--accent);
  padding: 10px;
  cursor: pointer;
}
#msg-input {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  color: #fff;
  font-size: 1rem;
  max-height: 100px;
  overflow-y: auto;
  resize: none;
}
#msg-input:focus { outline: none; background: rgba(255,255,255,0.15); }
.send-btn {
  background: var(--accent);
  color: #000;
  border: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.send-btn:active { transform: scale(0.9); }

/* Swipe Interaction */
.swipe-overlay {
  position: absolute;
  top: 0; bottom: 0; right: -50px;
  width: 50px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
}

/* Spinner for loading old messages */
#loading-spinner {
  text-align: center; padding: 10px; color: var(--muted); font-size: 0.8rem; display: none;
}

</style>
</head>
<body>

<header>
  <i class="fas fa-arrow-right back-btn" onclick="history.back()"></i>
  <div class="user-info" id="header-info">
    <img src="" id="header-avatar" class="user-avatar" style="display:none">
    <div class="user-details" style="margin-right:10px;">
      <h3 id="header-name">جاري التحميل...</h3>
      <span class="user-status" id="header-status"></span>
    </div>
  </div>
</header>

<div id="loading-spinner"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المحادثة...</div>
<div id="chat-container">
  </div>

<footer>
  <div id="reply-bar">
    <div style="border-left:3px solid var(--accent); padding-left:8px;">
      <div style="color:var(--accent); font-weight:bold; font-size:0.8rem;" id="reply-to-name"></div>
      <div style="color:#ccc; font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="reply-to-text"></div>
    </div>
    <i class="fas fa-times close-reply" onclick="cancelReply()"></i>
  </div>

  <div class="input-row">
    <label class="attach-btn">
      <i class="fas fa-paperclip"></i>
      <input type="file" id="file-input" hidden multiple onchange="handleFileUpload(this)">
    </label>
    <textarea id="msg-input" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
  </div>
</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
// --- تهيئة المتغيرات ---
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get('chatId'); 
const otherUserId = urlParams.get('userId'); // لو كنا نبدأ محادثة جديدة
const myId = document.cookie.replace(/(?:(?:^|.*;\s*)userId\s*\=\s*([^;]*).*$)|^.*$/, "$1");

let messagesContainer = document.getElementById('chat-container');
let replyData = null;
let currentPlayingAudio = null; // لتتبع الصوت المشغل حالياً
let isLoadingHistory = false;
let allMessagesLoaded = false;
let oldestMessageId = null; // لأجل الـ Pagination

// --- تشغيل الصفحة ---
document.addEventListener('DOMContentLoaded', () => {
  initChat();
  
  // إرسال الرسالة
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  
  // Scroll Listener for History
  messagesContainer.addEventListener('scroll', () => {
    if (messagesContainer.scrollTop === 0 && !isLoadingHistory && !allMessagesLoaded) {
      loadMoreMessages();
    }
  });
});

// --- دوال الاتصال والبيانات ---
function initChat() {
  // طلب معلومات المستخدم الآخر
  fetch(`/api/chat/info?chatId=${chatId}&userId=${otherUserId}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('header-name').textContent = data.name;
      const avatar = document.getElementById('header-avatar');
      avatar.src = data.avatar || '/default-avatar.png';
      avatar.style.display = 'block';
      if(data.isOnline) document.getElementById('header-status').textContent = 'متصل الآن';
      
      // الانضمام للغرفة
      socket.emit('join chat', { chatId: data.chatId });
      loadInitialMessages(data.chatId);
    });
}

// تحميل الرسائل الأولية
function loadInitialMessages(cId) {
  fetch(`/api/messages?chatId=${cId}&limit=50`)
    .then(r => r.json())
    .then(msgs => {
      // msgs يجب أن تأتي مرتبة زمنياً من الأقدم للأحدث من السيرفر، أو نقوم بقلبها
      // سنفترض أن السيرفر يرسل الأحدث أولاً، لذا نقلب المصفوفة للعرض
      const sortedMsgs = msgs.reverse(); 
      
      if (sortedMsgs.length > 0) {
        oldestMessageId = sortedMsgs[0]._id || sortedMsgs[0].id;
        sortedMsgs.forEach(msg => appendMessage(msg, false)); // false = append at bottom
        scrollToBottom();
      }
    });
}

// تحميل الرسائل القديمة (History)
function loadMoreMessages() {
  if(!oldestMessageId) return;
  isLoadingHistory = true;
  document.getElementById('loading-spinner').style.display = 'block';
  
  // حفظ موقع السكرول الحالي
  const scrollHeightBefore = messagesContainer.scrollHeight;

  fetch(`/api/messages?chatId=${chatId}&beforeId=${oldestMessageId}&limit=30`)
    .then(r => r.json())
    .then(msgs => {
      document.getElementById('loading-spinner').style.display = 'none';
      if(msgs.length === 0) {
        allMessagesLoaded = true;
        return;
      }
      
      // msgs تأتي الأحدث أولاً (قبل oldestMessageId)
      // نحتاج لقلبها لترتيبها زمنياً ثم إضافتها للأعلى
      const sortedMsgs = msgs.reverse(); 
      oldestMessageId = sortedMsgs[0]._id || sortedMsgs[0].id;

      sortedMsgs.reverse().forEach(msg => { 
        // نعكس اللوب لنضيفهم للأعلى بالترتيب الصحيح (الأحدث مما جلبنا يكون في الأسفل بالنسبة للمجموعة الجديدة)
        // لكن appendMessage مع prepend=true يضيف في قمة القائمة
        // لذا نمرر الرسالة الأحدث زمنياً في المجموعة أولاً لتكون أسفل المجموعة الجديدة
        // انتظر: prepend يضيف كـ First Child. 
        // الحل الأسهل: نجهز HTML كامل ونضعه مرة واحدة أو نستخدم insertAdjacentHTML
      });

      // تصحيح منطق prepend:
      // المصفوفة sortedMsgs: [الأقدم ..... الأحدث]
      // نريد وضع الأحدث في أسفل المنطقة العلوية.
      // لذا نبدأ من آخر عنصر في المصفوفة ونعمل prepend
      for (let i = sortedMsgs.length - 1; i >= 0; i--) {
        appendMessage(sortedMsgs[i], true);
      }

      // استعادة موقع السكرول
      const scrollHeightAfter = messagesContainer.scrollHeight;
      messagesContainer.scrollTop = scrollHeightAfter - scrollHeightBefore;
      isLoadingHistory = false;
    });
}

// --- التعامل مع الصوتيات (Audio Logic) ---
// تم إصلاح المشكلة: استخدام متغير global لتخزين الصوت المشغل
function playAudio(btn, url) {
  const container = btn.closest('.audio-player');
  const slider = container.querySelector('.audio-slider');
  const timeDisplay = container.querySelector('.audio-time');
  const icon = btn.querySelector('i');

  // إذا كان هناك صوت آخر يعمل، أوقفه
  if (currentPlayingAudio && currentPlayingAudio.url !== url) {
    currentPlayingAudio.audio.pause();
    const oldBtn = currentPlayingAudio.btn;
    if(oldBtn) oldBtn.querySelector('i').className = 'fas fa-play';
    currentPlayingAudio = null;
  }

  // إذا كان هذا الصوت يعمل حالياً، أوقفه مؤقتاً
  if (currentPlayingAudio && currentPlayingAudio.url === url) {
    if (currentPlayingAudio.audio.paused) {
        currentPlayingAudio.audio.play();
        icon.className = 'fas fa-pause';
    } else {
        currentPlayingAudio.audio.pause();
        icon.className = 'fas fa-play';
    }
    return;
  }

  // إنشاء كائن صوت جديد
  const audio = new Audio(url);
  currentPlayingAudio = { audio, url, btn };
  
  audio.addEventListener('loadedmetadata', () => {
    slider.max = Math.floor(audio.duration);
    timeDisplay.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    slider.value = Math.floor(audio.currentTime);
    timeDisplay.textContent = formatTime(audio.currentTime);
    // تحديث بصري للمتصفحات القديمة إذا لزم الأمر، لكن الـ slider thumb الأبيض كافي
    // (اختياري) تلوين الجزء المقطوع:
    const percent = (audio.currentTime / audio.duration) * 100;
    slider.style.background = `linear-gradient(to right, #fff ${percent}%, rgba(255,255,255,0.2) ${percent}%)`;
  });

  audio.addEventListener('ended', () => {
    icon.className = 'fas fa-play';
    slider.value = 0;
    slider.style.background = 'rgba(255,255,255,0.2)';
    currentPlayingAudio = null;
  });

  // السحب على الشريط
  slider.addEventListener('input', () => {
    audio.currentTime = slider.value;
  });

  audio.play().then(() => {
    icon.className = 'fas fa-pause';
  }).catch(e => console.error("Audio play error", e));
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0'+s : s}`;
}


// --- عرض الرسائل ---
function appendMessage(msg, prepend = false) {
  const isMe = (msg.senderId === myId);
  const alignClass = isMe ? 'me' : 'other';
  
  // بناء محتوى الرد (Reply)
  let replyHTML = '';
  if (msg.replyTo) {
    replyHTML = `
      <div class="reply-preview" onclick="scrollToMessage('${msg.replyTo.id}')">
        <div class="reply-sender">${msg.replyTo.sender}</div>
        <div class="reply-text">${msg.replyTo.content || (msg.replyTo.type === 'audio' ? 'تسجيل صوتي' : 'ملف')}</div>
      </div>
    `;
  }

  // بناء محتوى الرسالة حسب النوع
  let contentHTML = '';
  if (msg.type === 'text') {
    contentHTML = `<div class="text-content">${msg.content}</div>`;
  } else if (msg.type === 'image') {
    contentHTML = `<img src="${msg.mediaUrl}" class="msg-img" onclick="viewMedia('${msg.mediaUrl}')">`;
    if(msg.content) contentHTML += `<div class="caption">${msg.content}</div>`;
  } else if (msg.type === 'video') {
    contentHTML = `<video src="${msg.mediaUrl}" class="msg-video" controls></video>`;
  } else if (msg.type === 'audio') {
    // هنا المؤشر الأبيض المهيأ
    contentHTML = `
      <div class="audio-player">
        <button class="play-btn" onclick="playAudio(this, '${msg.mediaUrl}')">
          <i class="fas fa-play"></i>
        </button>
        <input type="range" class="audio-slider" min="0" value="0" step="0.1">
        <span class="audio-time">0:00</span>
      </div>
    `;
  }

  const msgHTML = `
    <div class="message-group ${alignClass}" id="msg-${msg.messageId || msg._id}" data-id="${msg.messageId || msg._id}">
      <div class="message-bubble">
        ${replyHTML}
        ${contentHTML}
        <div style="font-size:0.65rem; color:rgba(255,255,255,0.5); text-align:left; margin-top:4px;">
          ${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
        </div>
      </div>
      <div class="swipe-overlay"><i class="fas fa-reply"></i></div>
    </div>
  `;

  // الحل الجذري لمشكلة توقف الصوت: استخدام insertAdjacentHTML بدلاً من innerHTML
  if (prepend) {
    messagesContainer.insertAdjacentHTML('afterbegin', msgHTML);
  } else {
    messagesContainer.insertAdjacentHTML('beforeend', msgHTML);
    // تفعيل خاصية السحب للرد (Swipe to reply) للعنصر الجديد
    const newMsgEl = document.getElementById(`msg-${msg.messageId || msg._id}`);
    enableSwipeToReply(newMsgEl, msg);
  }
}

// Socket: استقبال رسالة جديدة
socket.on('chat message', (msg) => {
  // إذا كنت أنا المرسل، لا تضفها مرة أخرى إذا كنت قد أضفتها وهمياً (Optimistic UI)
  // لكن هنا سنفترض البساطة: نضيفها عند وصولها من السيرفر
  appendMessage(msg);
  scrollToBottom();
  // ملاحظة: بما أننا استخدمنا insertAdjacentHTML، لن يتوقف الصوت المشغل في رسالة سابقة
});


// --- إرسال الرسالة ---
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  
  if (!text) return; // Add file logic separate

  const msgData = {
    chatId: chatId,
    senderId: myId,
    content: text,
    type: 'text',
    timestamp: new Date().toISOString(),
    replyTo: replyData
  };

  socket.emit('chat message', msgData);
  input.value = '';
  cancelReply();
}

// --- أدوات مساعدة ---
function scrollToBottom() {
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function cancelReply() {
  replyData = null;
  document.getElementById('reply-bar').style.display = 'none';
}

function enableSwipeToReply(el, msgData) {
  // كود السحب (تم اختصاره للتركيز على طلبك الأساسي، يمكنك نسخه من ملفك الأصلي)
  // الفكرة: عند touchend وإزاحة > 50px، قم بتعيين replyData واظهر الشريط
  let startX = 0;
  el.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  el.addEventListener('touchmove', e => {
     let diff = e.touches[0].clientX - startX;
     if(Math.abs(diff) > 50) {
        // Trigger visual feedback
     }
  });
  el.addEventListener('touchend', e => {
     let diff = e.changedTouches[0].clientX - startX;
     if(Math.abs(diff) > 80) { // Swipe threshold
         triggerReply(msgData);
     }
  });
}

function triggerReply(msg) {
    replyData = { id: msg.messageId || msg._id, sender: msg.senderId === myId ? 'أنت' : document.getElementById('header-name').textContent, content: msg.content || 'ملف وسائط' };
    document.getElementById('reply-to-name').textContent = replyData.sender;
    document.getElementById('reply-to-text').textContent = replyData.content;
    document.getElementById('reply-bar').style.display = 'block';
    document.getElementById('msg-input').focus();
}

function scrollToMessage(id) {
    const el = document.getElementById('msg-' + id);
    if(el) {
        el.scrollIntoView({behavior: 'smooth', block: 'center'});
        el.style.animation = 'highlight 1s';
    } else {
        // يمكن إضافة منطق لتحميل الرسالة إذا لم تكن موجودة
        alert('الرسالة غير موجودة في العرض الحالي');
    }
}
</script>
</body>
</html>
