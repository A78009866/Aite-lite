<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
--bg: #000;
--glass-bg: rgba(255, 255, 255, 0.05);
--glass-border: rgba(255, 255, 255, 0.1);
--accent: #7dd3fc;
--muted: #cbd5e1;
--reply-bg: rgba(255, 255, 255, 0.08);
--reply-border: rgba(255, 255, 255, 0.15);
--reply-block-bg: rgba(255, 255, 255, 0.08);
--reply-block-border: rgba(255, 255, 255, 0.15);
}
html, body {
height: 100%;
margin: 0;
font-family: 'Inter', system-ui;
background-color: var(--bg);
color: var(--muted);
-webkit-font-smoothing: antialiased;
direction: rtl;
touch-action: pan-x pan-y;
}
.wrap {
height: 100dvh;
display: flex;
flex-direction: column;
max-width: 980px;
margin: 0 auto;
padding: 0;
position: relative;
}
.top {
display: flex;
align-items: center;
gap: 6px;
justify-content: space-between;
padding: 6px 10px;
background: var(--bg);
z-index: 200;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
flex-shrink: 0;
height: 50px; 
}
.user-row {
display: flex;
align-items: center;
gap: 6px;
flex: 1;
min-width: 0;
}
.avatar {
width: 36px;
height: 36px;
border-radius: 8px;
overflow: hidden;
border: 1px solid rgba(255, 255, 255, 0.06);
background: linear-gradient(135deg, #0b3146, #063048);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
position: relative;
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.meta {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
}
.meta .name {
font-weight: 700;
color: #e6f0fb;
font-size: 13px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display:flex;
align-items:center;
gap:6px;
}
.meta .sub {
font-size: 10px;
color: #8aa5bd;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.glass {
flex: 1;
display: flex;
flex-direction: column;
background: transparent;
border: none;
overflow: hidden;
position: relative;
}
.messages {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
padding: 12px;
padding-bottom: 120px;
scroll-behavior: smooth;
}
.msg {
max-width: 80%;
padding: 8px 10px;
border-radius: 10px;
font-size: 13px;
line-height: 1.3;
word-break: break-word;
cursor: pointer;
touch-action: pan-y;
transition: transform 200ms ease, box-shadow 200ms ease;
will-change: transform;
position: relative;
}
.msg.incoming { box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset; }
.msg:active { transform: translateY(1px); }

.incoming {
align-self: flex-start;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
color: var(--muted);
}
.outgoing {
align-self: flex-end;
background: rgba(10, 100, 150, 0.3);
color: #e6f7ff;
border: 1px solid rgba(255, 255, 255, 0.03);
}

.msg-image, .msg-video {
max-width: 100%;
height: auto;
display: block;
border-radius: 6px;
margin-top: 6px;
}
.msg-audio-player {
display: flex;
align-items: center;
gap: 8px;
width: 220px;
background: rgba(255, 255, 255, 0.1);
border-radius: 10px;
padding: 6px;
margin-top: 4px;
}
.incoming .msg-audio-player {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.audio-play-btn {
background: #e6f7ff;
color: #0369a1;
border: none;
border-radius: 50%;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
}
.incoming .audio-play-btn {
background: var(--muted);
color: var(--bg);
}
.audio-waveform-container {
flex: 1;
min-height: 40px;
}
.audio-time {
font-size: 11px;
color: #e6f7ffcc;
}
.incoming .audio-time {
color: #cbd5e1cc;
}
.meta-time {
font-size: 10px;
color: #9fb3c8;
margin-top: 4px;
text-align: left;
display: flex;
align-items: center;
justify-content: flex-end;
gap: 4px;
}
.composer {
display: flex;
flex-direction: column;
gap: 8px;
padding: 6px 10px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
position: fixed;
bottom: 0;
left: 0;
right: 0;
background-color: var(--bg);
z-index: 100;
box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
}
.composer-input-row {
display: flex;
gap: 6px;
align-items: flex-end;
}
.composer textarea {
flex: 1;
min-height: 32px;
max-height: 100px;
resize: none;
padding: 8px 12px;
border-radius: 18px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: transparent;
color: var(--muted);
transition: all 0.2s ease;
direction: rtl;
font-size: 16px;
}
.composer textarea:focus {
outline: none;
border-color: var(--accent);
}
.composer-btn {
width: 32px;
height: 32px;
background: linear-gradient(180deg, #06b6d4, #0891b2);
color: #012;
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.composer-btn:disabled {
background: #444;
cursor: not-allowed;
}
.file-input-btn, .voice-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
color: var(--muted);
padding: 6px;
border-radius: 50%;
cursor: pointer;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
#file-preview {
display: flex;
align-items: center;
gap: 6px;
padding: 6px;
background: rgba(255, 255, 255, 0.05);
border-radius: 6px;
border: 1px solid rgba(255, 255, 255, 0.1);
font-size: 12px;
}
.small { font-size: 11px; color: #8aa5bd; }
.recording-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 18px;
    background: rgba(185, 28, 28, 0.4); 
    font-size: 12px;
    color: #fca5a5;
    flex: 1;
}
.recording-dot {
width: 8px;
height: 8px;
background-color: #ff6b6b;
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn { padding: 6px; font-size: 12px; }
#reply-container {
display: none;
align-items: center;
gap: 8px;
padding: 8px;
border-radius: 12px;
background: var(--reply-bg);
border: 1px solid var(--reply-border);
margin-top: -4px;
box-shadow: 0 6px 18px rgba(0,0,0,0.6);
transition: transform 180ms ease, opacity 180ms ease;
}
.reply-block {
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--reply-block-bg);
  border-right: 3px solid var(--accent);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.incoming .reply-block {
  background: rgba(255, 255, 255, 0.05);
  border-right: 3px solid #cbd5e1;
}
.reply-block-sender {
  font-weight: 600;
  color: var(--accent);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.incoming .reply-block-sender { color: #cbd5e1; }
.reply-block-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* New/Modified styles for Voice Preview */
#audio-preview-container {
    display: none;
    flex: 1;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.08);
}
#audio-waveform-input {
    flex: 1;
    min-height: 30px;
    margin: 5px 0;
}
.audio-preview-time {
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
}
.audio-preview-cancel-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 20px;
    flex-shrink: 0;
}

/* --- تعديل نقطة النشاط (Online Dot) --- */
.avatar-with-dot { position: relative; display: inline-block; }
.online-dot {
  position: absolute;
  bottom: -2px;   /* في الأسفل */
  left: -2px;     /* في الزاوية اليسرى */
  width: 12px;
  height: 12px;
  background: #22c55e;
  border: 2px solid #000; /* حدود بنفس لون الهيدر لتبدو بارزة */
  border-radius: 999px;
  display: inline-block;
  z-index: 10;
}

/* small online next to name */
.online-text {
  color: #22c55e;
  font-weight: 700;
  font-size: 11px;
  margin-left: 6px;
}

/* VERIFIED BADGE IMAGE */
.verified-badge-img {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  margin-left: 6px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.06);
  vertical-align: middle;
}

/* Reactions popup */
.reactions-popup {
  position: absolute;
  z-index: 400;
  display: flex;
  gap: 8px;
  padding: 8px;
  border-radius: 24px;
  background: rgba(20,20,20,0.95);
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  transform: translateY(-8px);
  opacity: 0;
  transition: opacity 140ms ease, transform 160ms ease;
  pointer-events: auto;
}
.reactions-popup.show { opacity: 1; transform: translateY(0); }
.reaction-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  border: 1px solid rgba(255,255,255,0.06);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
}
.reaction-btn:hover { transform: translateY(-4px); transition: transform 120ms ease; }

/* Reaction badge on message */
.msg-reaction-badge {
  position: absolute;
  bottom: -8px;
  left: -8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 14px;
  padding: 4px 6px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 6px 18px rgba(0,0,0,0.6);
}

/* Nice cancel X on reply */
#cancel-reply-btn {
  background: transparent;
  border: none;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
  transition: background 120ms ease, transform 120ms ease;
}
#cancel-reply-btn:hover { background: rgba(255,255,255,0.03); transform: rotate(10deg); color: #fff; }

/* Message swipe hint */
.msg.swipe-active { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

/* small helper for reply label */
.reply-label {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}

/* responsive tweaks */
@media (max-width: 480px) {
  .msg-audio-player { width: 180px; }
  .reactions-popup { gap: 6px; padding: 6px; }
  .reaction-btn { width: 36px; height: 36px; font-size: 16px; }
}
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>

<div>
</div>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="12" height="12">

<script>
function getQuery(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const otherId = getQuery('contactId');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const fileUpload = document.getElementById('media-upload');
const filePreview = document.getElementById('file-preview');
const removeFileBtn = document.getElementById('remove-file-btn');
const sendForm = document.getElementById('sendForm');
const voiceBtn = document.getElementById('voiceBtn');
const voiceIcon = document.getElementById('voiceIcon');
const attachFileBtn = document.getElementById('attachFileBtn');
const recordingIndicator = document.getElementById('recording-indicator');
const recordingTimeEl = recordingIndicator.querySelector('span');
const replyContainer = document.getElementById('reply-container');
const cancelReplyBtn = document.getElementById('cancel-reply-btn');

const audioPreviewContainer = document.getElementById('audio-preview-container');
const audioWaveformInput = document.getElementById('audio-waveform-input');
const audioPreviewTime = document.getElementById('audio-preview-time');
const audioPreviewCancelBtn = audioPreviewContainer.querySelector('.audio-preview-cancel-btn');

const reactionsPopup = document.getElementById('reactionsPopup');

let uploadedFile = null;
let myId = null;
let lastMessages = null;
let replyToMessage = null;
let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;
let recordingTimer = null;
let recordingSeconds = 0;
let inputWaveSurfer = null;
let audioWaveSurfers = {}; // { src: wavesurferInstance }
let preservedAudioStates = {}; // preserve play/time across updates

const RECORDING_STATE = {
    IDLE: 'idle',
    RECORDING: 'recording',
    READY_TO_SEND: 'ready'
};
let recordingState = RECORDING_STATE.IDLE;

const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
let verifiedMap = {}; // { userId: true/false }

// reactions persistence (localStorage)
const REACTIONS_KEY = 'chat_msg_reactions_v1'; // bump version if format changes
function loadReactions() {
    try {
        return JSON.parse(localStorage.getItem(REACTIONS_KEY) || '{}');
    } catch (e) { return {}; }
}
function saveReactions(map) {
    try { localStorage.setItem(REACTIONS_KEY, JSON.stringify(map)); } catch (e) {}
}
let reactionsMap = loadReactions(); // messageId -> emoji

// Helpers
function formatTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    if (date.toDateString() === now.toDateString()) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    return date.toLocaleDateString('ar-EG', { month: 'numeric', day: 'numeric' });
}
function formatAudioTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}
function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/"/g, '&quot;');
}

// map media types to Arabic short label for reply preview
function mediaTypeLabel(media) {
    if (!media) return 'ملف مرفق';
    const t = (media.type || '').toLowerCase();
    const url = (media.url || '').toLowerCase();
    if (t.startsWith('image') || url.match(/\.(jpg|jpeg|png|gif|webp)$/)) return 'صورة';
    if (t.startsWith('video') || url.match(/\.(mp4|webm|mov|mkv)$/)) return 'فيديو';
    if (t.startsWith('audio') || url.endsWith('.webm') || url.endsWith('.mp3') || url.endsWith('.ogg')) return 'صوت';
    return 'ملف مرفق';
}

function createReactionBadge(emoji) {
    const el = document.createElement('div');
    el.className = 'msg-reaction-badge';
    el.textContent = emoji;
    return el;
}

function createAudioPlayer(src, isIncoming) {
    return `
        <div class="msg-audio-player" onclick="event.stopPropagation()">
            <button class="audio-play-btn" type="button" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}" data-player>
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="audio-waveform-container" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}"></div>
            <span class="audio-time">0:00</span>
        </div>
    `;
}

// Create message element with added swipe & long-press handlers
function createMessageElement(msg, myId) {
    const isIncoming = (msg.senderId !== myId);
    const el = document.createElement('div');
    el.className = 'msg ' + (isIncoming ? 'incoming' : 'outgoing');
    el.dataset.messageId = msg.messageId;
    el.title = 'انقر للرد';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');

    let contentHtml = '';

    if (msg.replied_to_id) {
        const repliedSender = msg.replied_to_sender || 'مستخدم';
        const repliedContent = msg.replied_to_content || 'رسالة محذوفة';
        contentHtml += `
            <div class="reply-block">
                <span class="reply-block-sender">${escapeHtml(repliedSender)}</span>
                <span class="reply-block-text">${escapeHtml(repliedContent)}</span>
            </div>
        `;
    }

    if (msg.media && msg.media.url) {
        const mediaUrl = msg.media.url;
        const mediaType = msg.media.type || 'raw';

        if (mediaType.startsWith('image')) {
            contentHtml += `<img src="${escapeAttr(mediaUrl)}" class="msg-image" alt="صورة" onload="scrollToBottom()">`;
        } else if (mediaType.startsWith('audio') || mediaUrl.endsWith('.webm') || mediaUrl.endsWith('.mp3')) {
            contentHtml += createAudioPlayer(mediaUrl, isIncoming);
        } else if (mediaType.startsWith('video')) {
            contentHtml += `<video src="${escapeAttr(mediaUrl)}" controls class="msg-video" onload="scrollToBottom()"></video>`;
        } else {
            contentHtml += `<div style="padding:4px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;margin-top:5px;"><a href="${escapeAttr(mediaUrl)}" target="_blank" style="color:var(--accent);text-decoration:none;">📎 ملف مرفق</a></div>`;
        }
    }

    if (msg.content) {
        contentHtml += `<p style="margin:${msg.media ? '6px 0 0 0' : '0'}">${escapeHtml(msg.content)}</p>`;
    }

    const readStatus = !isIncoming && msg.is_read ? '<span style="color:#4ade80">✓✓</span>' : (!isIncoming ? '<span>✓</span>' : '');
    contentHtml += `<div class="meta-time">${formatTime(msg.timestamp)}${readStatus}</div>`;

    el.innerHTML = contentHtml;

    // If reaction exists for that message - render it
    const reaction = reactionsMap[msg.messageId];
    if (reaction) {
        const badge = createReactionBadge(reaction);
        el.appendChild(badge);
    }

    // swipe handling (touch) - RTL-aware: we'll accept left swipe (deltaX < -threshold) as reply gesture
    let startX = 0, startY = 0, moved = false;
    const threshold = 60;
    let active = false;

    function onPointerDown(e) {
        const p = (e.touches && e.touches[0]) || e;
        startX = p.clientX;
        startY = p.clientY;
        moved = false;
        active = true;
        el.classList.add('swipe-active');
    }
    function onPointerMove(e) {
        if (!active) return;
        const p = (e.touches && e.touches[0]) || e;
        const dx = p.clientX - startX;
        const dy = p.clientY - startY;
        if (Math.abs(dy) > 30 && Math.abs(dx) < Math.abs(dy)) {
            // vertical scroll - cancel swipe
            return;
        }
        moved = true;
        // apply transform (small resistance)
        const translate = Math.max(Math.min(dx, 150), -150);
        el.style.transform = `translateX(${translate}px)`;
    }
    function onPointerUp(e) {
        if (!active) return;
        active = false;
        el.classList.remove('swipe-active');
        el.style.transition = 'transform 180ms ease';
        const p = (e.changedTouches && e.changedTouches[0]) || e;
        const dx = p.clientX - startX;
        // RTL: left swipe (dx negative) -> treat as reply
        if (dx < -threshold) {
            // trigger reply preview briefly and then animate back
            // find the original message object (we have msg closure)
            setReplyTo(msg);
        }
        // animate back to 0
        requestAnimationFrame(()=> el.style.transform = 'translateX(0)');
        setTimeout(()=> el.style.transition = '', 200);
    }

    // long-press for reactions (touch & mouse)
    let longPressTimer = null;
    function startLongPress(e) {
        // prevent text selection
        e.preventDefault && e.preventDefault();
        longPressTimer = setTimeout(() => {
            showReactionsForMessage(el, msg);
        }, 600);
    }
    function cancelLongPress() {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }

    // attach touch + mouse handlers
    el.addEventListener('touchstart', (ev) => { onPointerDown(ev); startLongPress(ev); }, { passive: false });
    el.addEventListener('touchmove', (ev) => { onPointerMove(ev); cancelLongPress(); }, { passive: true });
    el.addEventListener('touchend', (ev) => { onPointerUp(ev); cancelLongPress(); }, { passive: true });
    el.addEventListener('mousedown', (ev) => { onPointerDown(ev); startLongPress(ev); });
    el.addEventListener('mousemove', (ev) => { onPointerMove(ev); cancelLongPress(); });
    el.addEventListener('mouseup', (ev) => { onPointerUp(ev); cancelLongPress(); });
    el.addEventListener('mouseleave', (ev) => { onPointerUp(ev); cancelLongPress(); });

    // regular click to quick-reply (desktop)
    el.addEventListener('click', (ev) => {
        // ignore clicks that were part of swipe/longpress
        if (moved) { moved = false; return; }
        setReplyTo(msg);
    });

    return el;
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    });
}

function setReplyTo(msg) {
    if (msg.messageId === replyToMessage?.id) {
        clearReplyTo();
        return;
    }
    
    const isIncoming = (msg.senderId !== myId);
    replyToMessage = {
        id: msg.messageId,
        // build Arabic preview: prefix with label if media or "نص الرسالة"
        content: msg.content ? `نص الرسالة: ${msg.content}` : (msg.media ? `${mediaTypeLabel(msg.media)}` : 'ملف مرفق'),
        senderName: isIncoming ? document.getElementById('other-name').textContent : 'أنت',
        senderId: msg.senderId
    };

    document.getElementById('reply-sender').textContent = replyToMessage.senderName;
    document.getElementById('reply-text').textContent = replyToMessage.content;
    replyContainer.style.display = 'flex';
    replyContainer.style.opacity = '1';
    replyContainer.style.transform = 'translateY(0)';
}

function clearReplyTo() {
    replyToMessage = null;
    replyContainer.style.display = 'none';
}

// ---------------- Voice Recording Logic ----------------
function startRecording() {
    if (recordingState !== RECORDING_STATE.IDLE) return;
    
    audioChunks = [];
    recordingSeconds = 0;
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            audioStream = stream;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm; codecs=opus' });
            mediaRecorder.start();
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            
            recordingState = RECORDING_STATE.RECORDING;
            updateComposerUI();

            recordingTimer = setInterval(() => {
                recordingSeconds++;
                recordingTimeEl.textContent = `جاري التسجيل... ${formatAudioTime(recordingSeconds)}`;
            }, 1000);
            
            mediaRecorder.onstop = stopRecording;

        }).catch(err => { 
            alert('تعذر الوصول إلى الميكروفون. تأكد من منح الإذن.'); 
            recordingState = RECORDING_STATE.IDLE;
            updateComposerUI();
        });
}

function stopRecording() {
    clearInterval(recordingTimer);
    recordingTimeEl.textContent = `جاري التسجيل... 0:00`;
    
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
    
    if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
    }
    
    if (audioChunks.length > 0) {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        uploadedFile = new File([audioBlob], 'voice_message.webm', { type: 'audio/webm' });
        
        const audioURL = URL.createObjectURL(audioBlob);
        
        if (inputWaveSurfer) inputWaveSurfer.destroy();
        inputWaveSurfer = WaveSurfer.create({
            container: audioWaveformInput,
            waveColor: '#7dd3fc',
            progressColor: '#06b6d4',
            cursorColor: 'transparent',
            barWidth: 2, height: 30, barGap: 2, barRadius: 2,
        });
        
        inputWaveSurfer.load(audioURL);
        inputWaveSurfer.on('ready', () => {
             audioPreviewTime.textContent = formatAudioTime(inputWaveSurfer.getDuration());
        });
        
        inputWaveSurfer.on('click', () => {
             inputWaveSurfer.playPause();
        });

        recordingState = RECORDING_STATE.READY_TO_SEND;
    } else {
        recordingState = RECORDING_STATE.IDLE;
    }
    
    updateComposerUI();
}

function handleVoiceButton() {
    if (recordingState === RECORDING_STATE.IDLE) {
        startRecording();
    } else if (recordingState === RECORDING_STATE.RECORDING) {
        stopRecording();
    }
}

function removeFile() {
    if (inputWaveSurfer) {
        inputWaveSurfer.destroy();
        inputWaveSurfer = null;
    }
    uploadedFile = null; 
    audioChunks = [];
    recordingState = RECORDING_STATE.IDLE;
    fileUpload.value = '';
    filePreview.innerHTML = '';
    updateComposerUI();
}

// ---------------- Audio players init with preserve/resume support ----------------
function initializeAudioPlayers(preserveStates = {}) {
    // preserveStates: { src: { time: number, playing: bool } }
    Object.values(audioWaveSurfers).forEach(ws => {
        try { ws.destroy(); } catch (e) {}
    });
    audioWaveSurfers = {};

    document.querySelectorAll('.audio-waveform-container').forEach(container => {
        const src = container.dataset.src;
        if (!src) return;
        const isIncoming = container.dataset.isIncoming === 'true';
        
        if (!audioWaveSurfers[src]) { 
            const wavesurfer = WaveSurfer.create({
                container: container,
                waveColor: isIncoming ? '#94a3b8' : '#7dd3fc', 
                progressColor: isIncoming ? '#475569' : '#0891b2',
                cursorColor: 'transparent',
                barWidth: 2, height: 30, barGap: 2, barRadius: 2,
            });
            audioWaveSurfers[src] = wavesurfer;
            wavesurfer.load(src);

            const playerBtn = document.querySelector(`.audio-play-btn[data-src="${escapeAttr(src)}"]`);
            const timeEl = playerBtn ? playerBtn.closest('.msg-audio-player').querySelector('.audio-time') : null;
            
            wavesurfer.on('ready', () => {
                if (timeEl) timeEl.textContent = formatAudioTime(wavesurfer.getDuration());
                // resume previous state if present
                const st = preserveStates && preserveStates[src];
                if (st) {
                    try {
                        if (st.time) wavesurfer.setTime(st.time);
                        if (st.playing) wavesurfer.play();
                    } catch(e){}
                }
            });
            
            if (playerBtn) {
              playerBtn.onclick = (e) => {
                  e.stopPropagation();
                  // stop other playing waves before toggling this one (so only one plays)
                  Object.keys(audioWaveSurfers).forEach(k => {
                      if (k !== src && audioWaveSurfers[k].isPlaying()) audioWaveSurfers[k].pause();
                  });
                  wavesurfer.playPause();
              };
            }
            
            wavesurfer.on('play', () => {
                if (playerBtn) playerBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; 
            });
            wavesurfer.on('pause', () => {
                if (playerBtn) playerBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>`; 
            });
            wavesurfer.on('audioprocess', (time) => {
                if (timeEl) timeEl.textContent = formatAudioTime(time);
            });
            wavesurfer.on('finish', () => {
                wavesurfer.setTime(0);
                if (timeEl) timeEl.textContent = formatAudioTime(0);
            });
        }
    });
}

// ---------------- Reactions UI ----------------
function showReactionsForMessage(msgEl, msg) {
    // position popup above the message element
    const rect = msgEl.getBoundingClientRect();
    const popup = reactionsPopup;
    popup.style.display = 'flex';
    popup.classList.add('show');
    popup.style.pointerEvents = 'auto';
    // calculate center x of message and position popup to its left (rtl)
    const popupWidth =  (popup.offsetWidth || 220);
    const top = window.scrollY + rect.top - (popup.offsetHeight || 48) - 10;
    const left = window.scrollX + rect.left + (rect.width/2) - (popupWidth/2);
    popup.style.top = `${top}px`;
    popup.style.left = `${left}px`;

    // attach handlers for each reaction button
    const buttons = popup.querySelectorAll('.reaction-btn');
    buttons.forEach(b => {
        b.onclick = (ev) => {
            ev.stopPropagation();
            const emoji = b.dataset.reaction || b.textContent;
            // Save reaction locally (persist)
            reactionsMap[msg.messageId] = emoji;
            saveReactions(reactionsMap);
            // Attach badge to message element (remove previous if any)
            // Find current element by messageId (it may have been re-rendered)
            const messageEl = document.querySelector(`.msg[data-message-id="${msg.messageId}"]`);
            if (messageEl) {
                const existing = messageEl.querySelector('.msg-reaction-badge');
                if (existing) existing.remove();
                const badge = createReactionBadge(emoji);
                messageEl.appendChild(badge);
            }
            hideReactionsPopup();
        };
    });

    // clicking outside or scroll hides it
    setTimeout(() => {
        window.addEventListener('scroll', hideReactionsPopupOnce, { passive: true });
        document.addEventListener('click', hideReactionsPopupOnce);
        document.addEventListener('touchstart', hideReactionsPopupOnce, { passive: true });
    }, 50);
}

function hideReactionsPopup() {
    const popup = reactionsPopup;
    popup.classList.remove('show');
    popup.style.display = 'none';
    popup.style.pointerEvents = 'none';
    window.removeEventListener('scroll', hideReactionsPopupOnce);
    document.removeEventListener('click', hideReactionsPopupOnce);
    document.removeEventListener('touchstart', hideReactionsPopupOnce);
}
function hideReactionsPopupOnce(e) {
    hideReactionsPopup();
}

async function fetchOtherProfile() {
    try {
        const res = await fetch(`/api/profile/${otherId}`, { credentials: 'same-origin' });
        const profile = await res.json();
        
        const myProfileRes = await fetch('/api/profile', { credentials: 'same-origin' });
        const myProfile = await myProfileRes.json();
        myId = myProfile.id; 
        
        if (res.ok && profile) {
            renderHeaderName(profile.full_name || profile.username, !!profile.is_verified);
            let usernameText = `@${profile.username || ''}`;
            if (profile.is_online) usernameText += ' · متصل الآن';
            document.getElementById('other-username').textContent = usernameText;
            document.getElementById('other-avatar').src = profile.profile_picture_url;
            document.getElementById('other-profile-link').href = `/profile?userId=${otherId}`;
            
            const dot = document.getElementById('other-online-dot');

            verifiedMap[otherId] = !!profile.is_verified;
        }
    } catch (error) {

        document.getElementById('other-name').textContent = 'خطأ في التحميل';
    }
}

async function markRead() {
    if (!myId || !otherId) return;
    try {
        await fetch('/api/mark_read', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ other_id: otherId })
        });
    } catch (error) {
        console.warn('Could not mark messages as read:', error);
    }
}

let isFetchingMessages = false;
async function fetchMessages() {
    if (isFetchingMessages) return; 
    isFetchingMessages = true;

    try {
        // preserve playing states for audio players before we refresh DOM
        preservedAudioStates = {};
        Object.keys(audioWaveSurfers).forEach(src => {
            try {
                preservedAudioStates[src] = { time: audioWaveSurfers[src].getCurrentTime ? audioWaveSurfers[src].getCurrentTime() : 0, playing: audioWaveSurfers[src].isPlaying ? audioWaveSurfers[src].isPlaying() : false };
            } catch (e) { preservedAudioStates[src] = { time: 0, playing: false }; }
        });

        const res = await fetch(`/api/messages/${otherId}`, { credentials: 'same-origin' });
        const result = await res.json();

        if (res.ok && result.ok && JSON.stringify(result.messages) !== JSON.stringify(lastMessages)) {
            lastMessages = result.messages;
            messagesEl.innerHTML = ''; 
            
            if (result.messages.length === 0) {
                 messagesEl.innerHTML = '<div class="small" style="text-align:center">ابدأ محادثة بإرسال أول رسالة!</div>';
            } else {
                const senderIds = [...new Set(result.messages.map(m => m.senderId).filter(Boolean))];
                const toFetch = senderIds.filter(id => typeof verifiedMap[id] === 'undefined');
                if (toFetch.length > 0) {
                    await Promise.all(toFetch.map(async uid => {
                        try {
                            const r = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' });
                            if (!r.ok) { verifiedMap[uid] = false; return; }
                            const d = await r.json();
                            verifiedMap[uid] = !!d.is_verified;
                        } catch (e) {
                            verifiedMap[uid] = false;
                        }
                    }));
                }

                for (const msg of result.messages) {
                    const el = createMessageElement(msg, myId);
                    messagesEl.appendChild(el);
                }
            }

            // initialize audio players, resuming any that were playing
            initializeAudioPlayers(preservedAudioStates);
            scrollToBottom();
            
            await markRead(); 
        }
    } catch (error) {
        console.error('Error fetching messages:', error);
        if (messagesEl.children.length < 2) {
             messagesEl.innerHTML = '<div class="small" style="text-align:center; color: #ef4444;">حدث خطأ في الاتصال. حاول تحديث الصفحة.</div>';
        }
    } finally {
        isFetchingMessages = false;
    }
}

// send message (no change)
async function sendMessage() {
    let content = msgInput.value.trim();
    if (!content && !uploadedFile) return;
    
    sendBtn.disabled = true;
    const originalIcon = sendBtn.innerHTML;
    sendBtn.innerHTML = '<div class="spin" style="width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></div>';

    const formData = new FormData();
    formData.append('other_id', otherId); 
    if (content) formData.append('content', content);
    
    if (uploadedFile) {
        formData.append('media', uploadedFile, uploadedFile.name);
    }
    
    if (replyToMessage) {
        formData.append('replied_to_id', replyToMessage.id);
        formData.append('replied_to_content', replyToMessage.content);
        formData.append('replied_to_sender', replyToMessage.senderName);
    }
    
    try {
        const res = await fetch('/api/messages/send', {
            method: 'POST', credentials: 'same-origin', body: formData
        });
        const result = await res.json();
        
        if (res.ok && result.ok && result.messageData) { 
            const el = createMessageElement(result.messageData, myId);
            messagesEl.appendChild(el); 

            msgInput.value = '';
            removeFile(); 
            clearReplyTo();
            scrollToBottom();
            lastMessages = null; 
            await fetchMessages(); 
        } else {
            alert('فشل الإرسال: ' + (result.error || 'خطأ غير معروف'));
        }
    } catch (err) {
        alert('خطأ في الاتصال بالخادم. تأكد من أن الخادم يعمل.');
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalIcon;
        updateComposerUI();
    }
}

fileUpload.addEventListener('change', (e) => {

    if (file) {
        removeFile(); 
        uploadedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            let previewElement;

            else if (file.type.startsWith('video/')) { previewElement = document.createElement('video'); previewElement.src = e.target.result; previewElement.controls = true; previewElement.style.maxHeight = '40px'; previewElement.style.borderRadius = '4px'; }
            else if (file.type.startsWith('audio/')) { previewElement = document.createElement('audio'); previewElement.src = e.target.result; previewElement.controls = true; }
            else { previewElement = document.createElement('span'); previewElement.textContent = file.name; }
            
            filePreview.innerHTML = '';

            const removeBtn = document.createElement('button');
            removeBtn.className = 'composer-btn btn';
            removeBtn.style.cssText = 'width:24px;height:24px;background:#ef4444;margin-right:auto;';

            removeBtn.onclick = () => { removeFile(); updateComposerUI(); };

            updateComposerUI();

        };
        reader.readAsDataURL(file);
    } else {
        removeFileBtn.onclick();
    }
});

/* Notifications SSE badge */
(function setupNotifSSEChat(){
  if(!window.EventSource) return;
  const es = new EventSource('/api/notifications/stream', { withCredentials: true });
  es.addEventListener('notifications',(e)=>{
    try{
      const payload = JSON.parse(e.data);
      const unread = payload.unread_count||0;
      const badge = document.getElementById('notifBadgeChat');
      if(badge){
        if(unread>0){ badge.style.display='inline-flex'; badge.textContent = unread>99 ? '99+' : String(unread); }
        else badge.style.display='none';
      }
    } catch(err){ console.error('SSE parse error', err); }
  });
  es.addEventListener('error', (err)=>{ console.warn('Notifications SSE error', err); });
})();
(function initUnreadChat(){ fetch('/api/notifications/unread_count', { credentials: 'same-origin' }).then(r=>r.ok? r.json():null).then(d=>{ if(d&&d.ok){ const b=document.getElementById('notifBadgeChat'); if(b){ if(d.unread_count>0){ b.style.display='inline-flex'; b.textContent=d.unread_count>99?'99+':String(d.unread_count); }}}}).catch(()=>{}); })();
</script>
</body>
