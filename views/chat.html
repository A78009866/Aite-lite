<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #000;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --accent: #7dd3fc;
  --muted: #cbd5e1;
  --reply-bg: rgba(30, 41, 59, 0.95);
  --reply-border: rgba(56, 189, 248, 0.3);
  --msg-incoming: rgba(255, 255, 255, 0.08);
  --msg-outgoing: #0ea5e9;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--muted);
  overflow: hidden; /* لمنع التمرير العام */
  touch-action: pan-y;
}

.wrap {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 600px; /* تحسين للعرض */
  margin: 0 auto;
  position: relative;
  background: #0f172a;
}

/* --- Header --- */
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(10px);
  z-index: 50;
  border-bottom: 1px solid var(--glass-border);
  height: 60px;
  flex-shrink: 0;
}

.user-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  overflow: hidden;
}

.avatar-container {
  position: relative;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(255,255,255,0.1);
}

.online-dot {
  position: absolute;
  bottom: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  background: #22c55e;
  border: 2px solid #0f172a;
  border-radius: 50%;
}

.meta {
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

.meta .name {
  font-weight: 600;
  color: #f1f5f9;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 4px;
}

.meta .sub {
  font-size: 12px;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.back-btn {
  color: #fff;
  font-size: 18px;
  padding: 8px;
  margin-right: -8px;
  cursor: pointer;
  text-decoration: none;
}

/* --- Messages Area --- */
.glass {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  padding-bottom: 90px; /* مساحة للمدخل */
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* إخفاء الشات مبدئياً لمنع القفزة */
  opacity: 0; 
  transition: opacity 0.2s ease;
  /* Scroll behavior controlled via JS for initial load */
}

/* --- Message Bubbles --- */
.msg-container {
  display: flex;
  width: 100%;
  position: relative;
  margin-bottom: 2px;
  /* للسحب */
  touch-action: pan-y; 
}

.msg-wrapper {
  position: relative;
  max-width: 80%;
  z-index: 2;
  transition: transform 0.1s linear; /* حركة سلسة جداً أثناء السحب */
  will-change: transform;
}

.msg {
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
  position: relative;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

/* Incoming */
.incoming-container { justify-content: flex-start; }
.incoming-container .msg {
  background: var(--msg-incoming);
  color: #f1f5f9;
  border-bottom-right-radius: 4px;
}

/* Outgoing */
.outgoing-container { justify-content: flex-end; }
.outgoing-container .msg {
  background: var(--msg-outgoing);
  color: #fff;
  border-bottom-left-radius: 4px;
}

/* Reply Indicator Icon (Hidden by default) */
.reply-indicator-icon {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 30px;
  height: 30px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 1;
}

/* Media Styles */
.msg-image, .msg-video {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin-top: 4px;
  display: block;
}

/* Audio Player */
.msg-audio-player {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 200px;
  padding: 4px 0;
}
.audio-play-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
}
.audio-waveform-container { flex: 1; height: 24px; }
.audio-time { font-size: 10px; opacity: 0.8; min-width: 25px; }

/* Reply Context Inside Message */
.reply-context {
  background: rgba(0,0,0,0.2);
  border-right: 3px solid rgba(255,255,255,0.5);
  border-radius: 6px;
  padding: 6px 8px;
  margin-bottom: 6px;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.reply-context-sender { font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.reply-context-text { opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Metadata */
.msg-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 4px;
  font-size: 10px;
  opacity: 0.7;
}

/* --- Composer Area --- */
.composer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f172a;
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 8px 10px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Reply Preview Panel */
#reply-container {
  display: none; /* Flex when active */
  align-items: center;
  justify-content: space-between;
  background: var(--reply-bg);
  padding: 8px 12px;
  border-radius: 12px;
  margin-bottom: 8px;
  border-right: 4px solid var(--accent);
  border-top: 1px solid rgba(255,255,255,0.1);
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.reply-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex: 1;
}
.reply-to-label { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
.reply-preview-text { font-size: 12px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sexy Close Button */
.close-reply-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  cursor: pointer;
  margin-right: 10px;
  transition: all 0.2s;
}
.close-reply-btn:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

/* Input Row */
.input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.action-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s;
}
.action-btn:active { background: rgba(255,255,255,0.1); }

textarea {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 10px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  resize: none;
  min-height: 40px;
  max-height: 120px;
  outline: none;
  line-height: 1.3;
}
textarea::placeholder { color: #64748b; }

.send-btn {
  background: var(--accent);
  color: #0f172a;
}
.send-btn:disabled { background: #334155; color: #64748b; }

.recording-active { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

/* Recording UI */
#recording-ui {
  display: none;
  flex: 1;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 0 15px;
  height: 40px;
}
.rec-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
.rec-time { font-size: 13px; color: #fff; flex: 1; }
.cancel-rec { color: #ef4444; cursor: pointer; font-size: 13px; font-weight: 600; }

/* File Preview */
#file-preview-area {
  display: none;
  padding: 8px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  margin-bottom: 8px;
  align-items: center;
  gap: 8px;
}
.file-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a href="/chat_list" class="back-btn"><i class="fas fa-arrow-right"></i></a>
    <div class="user-row" onclick="window.location.href=`/profile?userId=${otherId}`">
      <div class="avatar-container">
        <img id="header-avatar" src="https://via.placeholder.com/40" class="avatar">
        <div id="header-online" class="online-dot" style="display:none"></div>
      </div>
      <div class="meta">
        <div id="header-name" class="name">...</div>
        <div id="header-status" class="sub"></div>
      </div>
    </div>
  </div>

  <div class="glass">
    <div id="messages" class="messages">
      </div>
  </div>

  <form id="composer" class="composer" onsubmit="return false;">
    
    <div id="reply-container">
      <div class="reply-info">
        <div class="reply-to-label">الرد على <span id="reply-to-name"></span></div>
        <div id="reply-to-text" class="reply-preview-text"></div>
      </div>
      <button type="button" class="close-reply-btn" id="cancel-reply">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div id="file-preview-area">
      <div id="file-preview-content" style="flex:1; display:flex; align-items:center; gap:8px;"></div>
      <button type="button" class="close-reply-btn" id="cancel-file" style="width:20px;height:20px;margin:0;">
        <i class="fas fa-times" style="font-size:12px"></i>
      </button>
    </div>

    <div class="input-row">
      <input type="file" id="media-input" style="display:none" accept="image/*,video/*,audio/*">
      <button type="button" class="action-btn" id="attach-btn">
        <i class="fas fa-paperclip"></i>
      </button>

      <div id="recording-ui">
        <div class="rec-dot"></div>
        <div class="rec-time" id="rec-timer">0:00</div>
        <div class="cancel-rec" id="cancel-rec-btn">إلغاء</div>
      </div>

      <textarea id="msg-input" placeholder="اكتب رسالة..." rows="1"></textarea>
      
      <button type="button" class="action-btn" id="mic-btn">
        <i class="fas fa-microphone"></i>
      </button>

      <button type="submit" class="action-btn send-btn" id="send-btn" style="display:none">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </form>
</div>

<script>
// --- Configuration & State ---
const urlParams = new URLSearchParams(window.location.search);
const otherId = urlParams.get('contactId');
let myId = null;
let lastMessagesHash = ''; // بسيط للتحقق من التغيير
let replyData = null; // { id, sender, content, type }
let uploadedFile = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let recTimerInterval = null;
let audioWaveSurfers = {};

// DOM Elements
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const attachBtn = document.getElementById('attach-btn');
const mediaInput = document.getElementById('media-input');
const replyContainer = document.getElementById('reply-container');
const recordingUi = document.getElementById('recording-ui');
const filePreviewArea = document.getElementById('file-preview-area');

// Verified Badge Icon
const VERIFIED_ICON = `<img src="https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png" style="width:14px;height:14px;margin-right:4px;vertical-align:middle;">`;

// --- Initialization ---
async function init() {
  if (!otherId) return window.location.href = '/chat_list';
  
  // 1. Fetch My Profile (for ID)
  try {
    const myRes = await fetch('/api/profile');
    const myData = await myRes.json();
    myId = myData.id;
  } catch(e) { console.error(e); }

  // 2. Fetch Other Profile (Header)
  fetchProfile();

  // 3. Initial Messages Load
  await loadMessages(true); // true = force scroll to bottom without animation

  // 4. Poll for new messages
  setInterval(() => loadMessages(false), 3000);
  
  // 5. Setup Input resizing
  msgInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
    toggleSendButton();
  });
}

// --- Fetch Profile Info ---
async function fetchProfile() {
  try {
    const res = await fetch(`/api/profile/${otherId}`);
    const data = await res.json();
    if(data) {
      document.getElementById('header-name').innerHTML = escapeHtml(data.full_name || data.username) + (data.is_verified ? VERIFIED_ICON : '');
      document.getElementById('header-avatar').src = data.profile_picture_url || 'https://via.placeholder.com/40';
      if(data.is_online) {
        document.getElementById('header-online').style.display = 'block';
        document.getElementById('header-status').textContent = 'متصل الآن';
        document.getElementById('header-status').style.color = '#22c55e';
      } else {
         document.getElementById('header-status').textContent = 'غير متصل'; // او اخر ظهور
      }
    }
  } catch(e) {}
}

// --- Messages Logic ---
async function loadMessages(initial = false) {
  try {
    const res = await fetch(`/api/messages/${otherId}?limit=50`);
    const data = await res.json();
    if(!data.ok) return;

    const newHash = JSON.stringify(data.messages.map(m => m.messageId));
    if (newHash === lastMessagesHash) return; // No changes
    lastMessagesHash = newHash;

    // Save current scroll position relative to bottom if not initial
    const isAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 50;

    messagesEl.innerHTML = ''; // Re-render (inefficient but safe for synced deletion/edits)
    
    data.messages.forEach(msg => {
      messagesEl.appendChild(createMsgElement(msg));
    });

    if (initial) {
      // Instant scroll to bottom, then fade in
      messagesEl.scrollTop = messagesEl.scrollHeight;
      requestAnimationFrame(() => {
        messagesEl.style.opacity = '1';
      });
      markRead();
    } else if (isAtBottom) {
      scrollToBottom();
      markRead();
    }
  } catch(e) { console.error(e); }
}

function scrollToBottom() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

async function markRead() {
  await fetch('/api/mark_read', {
    method: 'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({other_id: otherId})
  });
}

// --- Message Element Creator ---
function createMsgElement(msg) {
  const isMe = msg.senderId === myId;
  const wrapper = document.createElement('div');
  wrapper.className = `msg-container ${isMe ? 'outgoing-container' : 'incoming-container'}`;

  // Reply Indicator Icon (depends on direction)
  // If Incoming (Left aligned), pull Right -> Icon on Left
  // If Outgoing (Right aligned), pull Left -> Icon on Right
  const icon = document.createElement('div');
  icon.className = 'reply-indicator-icon';
  icon.innerHTML = '<i class="fas fa-reply"></i>';
  // Position icon based on direction
  if (isMe) icon.style.left = '10px'; 
  else icon.style.right = '10px';
  wrapper.appendChild(icon);

  const inner = document.createElement('div');
  inner.className = 'msg-wrapper';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg';
  
  // Reply Context (if exists)
  if (msg.replied_to_id) {
    const ctx = document.createElement('div');
    ctx.className = 'reply-context';
    ctx.innerHTML = `
      <div class="reply-context-sender">${escapeHtml(msg.replied_to_sender || 'مستخدم')}</div>
      <div class="reply-context-text">${getLocalizedType(msg.replied_to_content)}</div>
    `;
    ctx.onclick = (e) => {
        // Optional: Scroll to original message
        e.stopPropagation();
        const original = document.querySelector(`[data-msg-id="${msg.replied_to_id}"]`);
        if(original) original.scrollIntoView({behavior:'smooth', block:'center'});
    };
    bubble.appendChild(ctx);
  }

  // Content
  let contentHtml = '';
  if (msg.media) {
    const url = msg.media.url;
    const type = msg.media.type || '';
    if (type.startsWith('image')) contentHtml += `<img src="${url}" class="msg-image" onload="scrollToBottom()">`;
    else if (type.startsWith('video')) contentHtml += `<video src="${url}" controls class="msg-video"></video>`;
    else if (type.startsWith('audio') || url.endsWith('.webm') || url.endsWith('.mp3')) {
       // Audio Player ID
       const audioId = 'audio-' + msg.messageId;
       contentHtml += `
         <div class="msg-audio-player">
           <button class="audio-play-btn" onclick="playAudio('${url}', '${audioId}', this)">
             <i class="fas fa-play" style="font-size:12px"></i>
           </button>
           <div id="${audioId}" class="audio-waveform-container"></div>
           <div class="audio-time">...</div>
         </div>
       `;
       // Initialize waveform lazily or now
       setTimeout(() => initWaveform(audioId, url, isMe), 100);
    }
  }
  if (msg.content) {
    contentHtml += `<div style="margin-top:${msg.media?'4px':'0'}">${escapeHtml(msg.content)}</div>`;
  }
  
  // Meta (Time + Check)
  const time = new Date(msg.timestamp).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  const check = isMe ? (msg.is_read ? '<i class="fas fa-check-double" style="color:#6ee7b7"></i>' : '<i class="fas fa-check"></i>') : '';
  contentHtml += `<div class="msg-meta">${time} ${check}</div>`;

  bubble.innerHTML += contentHtml;
  inner.appendChild(bubble);
  wrapper.appendChild(inner);

  // --- SWIPE TO REPLY LOGIC ---
  enableSwipeToReply(wrapper, inner, icon, msg);

  // Set ID for jumping
  wrapper.setAttribute('data-msg-id', msg.messageId);

  return wrapper;
}

// --- Swipe Logic ---
function enableSwipeToReply(container, contentEl, iconEl, msg) {
  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  const threshold = 60; // Distance to trigger reply

  contentEl.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isDragging = true;
    contentEl.style.transition = 'none'; // Remove transition for 1:1 movement
  }, {passive: true});

  contentEl.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const x = e.touches[0].clientX;
    const diff = x - startX;

    // RTL Logic:
    // If msg is Incoming (Right aligned in RTL? No, Incoming is usually Right in visual, Left in DOM if LTR. Wait.)
    // In dir="rtl":
    // Incoming (Left side visual) -> Pull Right (Positive X) to reply.
    // Outgoing (Right side visual) -> Pull Left (Negative X) to reply.
    
    // Let's simplify: Allow pulling "inwards" towards center usually.
    // Actually standard behavior: Pull towards the center of screen.
    
    // Determine allowed direction based on message type
    const isMe = msg.senderId === myId;
    let allowed = false;
    
    // In RTL:
    // Incoming is on Right? No, standard chat: Incoming Left, Outgoing Right.
    // CSS says: Incoming flex-start (Right in RTL), Outgoing flex-end (Left in RTL).
    // Wait, createMsgElement: incoming-container { justify-content: flex-start } -> In RTL this is RIGHT side.
    // outgoing-container { justify-content: flex-end } -> In RTL this is LEFT side.
    
    // So Incoming (Right): Pull Left (Negative)
    // Outgoing (Left): Pull Right (Positive)
    
    if (!isMe && diff < 0) allowed = true; // Incoming (Right), Pull Left
    if (isMe && diff > 0) allowed = true;  // Outgoing (Left), Pull Right

    // Limit drag
    if (allowed && Math.abs(diff) < 150) {
      currentX = diff;
      contentEl.style.transform = `translateX(${diff}px)`;
      
      // Icon Scale Animation
      const progress = Math.min(Math.abs(diff) / threshold, 1);
      iconEl.style.transform = `translateY(-50%) scale(${progress})`;
      iconEl.style.opacity = progress;
    }
  }, {passive: true});

  contentEl.addEventListener('touchend', () => {
    isDragging = false;
    contentEl.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    contentEl.style.transform = 'translateX(0)';
    
    // Reset Icon
    iconEl.style.transform = 'translateY(-50%) scale(0)';
    
    if (Math.abs(currentX) > threshold) {
      triggerReply(msg);
      // Haptic feedback
      if(navigator.vibrate) navigator.vibrate(10);
    }
    currentX = 0;
  });
}

// --- Reply Functions ---
function triggerReply(msg) {
  const isMe = msg.senderId === myId;
  const senderName = isMe ? 'أنت' : document.getElementById('header-name').textContent;
  
  // Determine Content Type for Preview
  let previewText = msg.content;
  if (!previewText && msg.media) {
    if (msg.media.type.startsWith('image')) previewText = '📷 صورة';
    else if (msg.media.type.startsWith('video')) previewText = '🎥 فيديو';
    else if (msg.media.type.startsWith('audio') || msg.media.url.endsWith('.webm')) previewText = '🎤 تسجيل صوتي';
    else previewText = '📎 ملف مرفق';
  }

  replyData = {
    id: msg.messageId,
    sender: senderName,
    content: previewText
  };

  document.getElementById('reply-to-name').textContent = senderName;
  document.getElementById('reply-to-text').textContent = previewText;
  
  replyContainer.style.display = 'flex';
  msgInput.focus();
}

document.getElementById('cancel-reply').onclick = () => {
  replyData = null;
  replyContainer.style.display = 'none';
};

// --- Helper: Localized Text ---
function getLocalizedType(content) {
  if (!content) return '';
  if (content === '📷 صورة' || content === '🎥 فيديو' || content === '🎤 تسجيل صوتي') return content;
  // If it's a raw URL or old data, try to detect (simplified)
  if (content.match(/cloudinary.*image/)) return '📷 صورة';
  return content;
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// --- Audio Waveform ---
function initWaveform(containerId, url, isMe) {
  const container = document.getElementById(containerId);
  if (!container) return;
  // If exists destroy
  if (audioWaveSurfers[containerId]) return;

  const ws = WaveSurfer.create({
    container: container,
    waveColor: isMe ? '#ffffff80' : '#7dd3fc',
    progressColor: isMe ? '#ffffff' : '#0ea5e9',
    cursorColor: 'transparent',
    barWidth: 2, barRadius: 2, height: 24,
    responsive: true,
    url: url
  });
  
  ws.on('ready', () => {
    const parent = container.parentElement;
    const timeEl = parent.querySelector('.audio-time');
    const dur = ws.getDuration();
    timeEl.textContent = fmtTime(dur);
  });
  
  audioWaveSurfers[containerId] = ws;
}

function playAudio(url, id, btn) {
  const ws = audioWaveSurfers[id];
  if(!ws) return;
  ws.playPause();
  ws.on('play', () => btn.innerHTML = '<i class="fas fa-pause" style="font-size:12px"></i>');
  ws.on('pause', () => btn.innerHTML = '<i class="fas fa-play" style="font-size:12px"></i>');
  ws.on('finish', () => btn.innerHTML = '<i class="fas fa-play" style="font-size:12px"></i>');
}

function fmtTime(s) {
  const m = Math.floor(s/60);
  const sc = Math.floor(s%60);
  return `${m}:${sc<10?'0':''}${sc}`;
}

// --- Attachment & Recording Logic ---
attachBtn.onclick = () => mediaInput.click();
mediaInput.onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    uploadedFile = file;
    // Show Preview
    let html = '';
    if(file.type.startsWith('image')) html = `<img src="${URL.createObjectURL(file)}" class="file-thumb">`;
    else if(file.type.startsWith('video')) html = `<i class="fas fa-video fa-lg text-blue-400"></i>`;
    else html = `<i class="fas fa-file fa-lg text-gray-400"></i>`;
    
    html += `<span style="font-size:12px;color:#fff">${file.name}</span>`;
    document.getElementById('file-preview-content').innerHTML = html;
    filePreviewArea.style.display = 'flex';
    toggleSendButton();
  }
};
document.getElementById('cancel-file').onclick = () => {
  uploadedFile = null;
  mediaInput.value = '';
  filePreviewArea.style.display = 'none';
  toggleSendButton();
};

// Mic Logic
micBtn.onclick = () => {
  if (isRecording) stopRecording(); else startRecording();
};
document.getElementById('cancel-rec-btn').onclick = cancelRecording;

function startRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.start();
    isRecording = true;
    
    msgInput.style.display = 'none';
    micBtn.style.display = 'none'; // Hide mic, show cancel inside UI
    attachBtn.style.display = 'none';
    recordingUi.style.display = 'flex';
    
    let sec = 0;
    recTimerInterval = setInterval(() => {
      sec++;
      document.getElementById('rec-timer').textContent = fmtTime(sec);
    }, 1000);

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
       // Create File
       const blob = new Blob(audioChunks, { type: 'audio/webm' });
       uploadedFile = new File([blob], "voice.webm", { type: 'audio/webm' });
       // Show in file preview as audio
       document.getElementById('file-preview-content').innerHTML = 
         `<i class="fas fa-microphone fa-lg text-red-400"></i> <span style="font-size:12px;color:#fff">تسجيل صوتي (${document.getElementById('rec-timer').textContent})</span>`;
       filePreviewArea.style.display = 'flex';
       resetRecordingUI();
       toggleSendButton();
    };
  }).catch(e => alert('Mic error'));
}

function stopRecording() {
  if(mediaRecorder) mediaRecorder.stop();
}

function cancelRecording() {
  if(mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    uploadedFile = null; // discard
    audioChunks = [];
  }
  resetRecordingUI();
}

function resetRecordingUI() {
  clearInterval(recTimerInterval);
  isRecording = false;
  document.getElementById('rec-timer').textContent = '0:00';
  recordingUi.style.display = 'none';
  msgInput.style.display = 'block';
  micBtn.style.display = 'flex';
  attachBtn.style.display = 'flex';
}

function toggleSendButton() {
  const hasText = msgInput.value.trim().length > 0;
  const hasFile = !!uploadedFile;
  
  if (hasText || hasFile) {
    sendBtn.style.display = 'flex';
    micBtn.style.display = 'none';
  } else {
    sendBtn.style.display = 'none';
    micBtn.style.display = 'flex';
  }
}

// --- Sending ---
sendBtn.onclick = async () => {
  if(sendBtn.disabled) return;
  const content = msgInput.value.trim();
  if(!content && !uploadedFile) return;

  sendBtn.disabled = true;
  
  const fd = new FormData();
  fd.append('other_id', otherId);
  if(content) fd.append('content', content);
  if(uploadedFile) fd.append('media', uploadedFile);
  if(replyData) {
    fd.append('replied_to_id', replyData.id);
    fd.append('replied_to_sender', replyData.sender);
    fd.append('replied_to_content', replyData.content);
  }

  try {
    const res = await fetch('/api/messages/send', { method:'POST', body:fd });
    const d = await res.json();
    if(d.ok) {
      // Add local optimistic update or wait for poll
      messagesEl.appendChild(createMsgElement(d.messageData));
      scrollToBottom();
      
      // Reset
      msgInput.value = '';
      msgInput.style.height = 'auto';
      uploadedFile = null;
      filePreviewArea.style.display = 'none';
      replyData = null;
      replyContainer.style.display = 'none';
      toggleSendButton();
    }
  } catch(e) { alert('Error sending'); }
  sendBtn.disabled = false;
};

// --- Init ---
init();

</script>
