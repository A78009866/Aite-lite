<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
--bg: #000;
--glass-bg: rgba(255, 255, 255, 0.05);
--glass-border: rgba(255, 255, 255, 0.1);
--accent: #7dd3fc;
--muted: #cbd5e1;
--reply-bg: rgba(255, 255, 255, 0.08);
--reply-border: rgba(255, 255, 255, 0.15);
--reply-block-bg: rgba(255, 255, 255, 0.08);
--reply-block-border: rgba(255, 255, 255, 0.15);
}
html, body {
height: 100%;
margin: 0;
font-family: 'Inter', system-ui;
background-color: var(--bg);
color: var(--muted);
-webkit-font-smoothing: antialiased;
direction: rtl;
touch-action: pan-x pan-y;
}
.wrap {
height: 100dvh;
display: flex;
flex-direction: column;
max-width: 980px;
margin: 0 auto;
padding: 0;
position: relative;
}
.top {
display: flex;
align-items: center;
gap: 6px;
justify-content: space-between;
padding: 6px 10px;
background: var(--bg);
z-index: 200;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
flex-shrink: 0;
height: 50px; 
}
.user-row {
display: flex;
align-items: center;
gap: 6px;
flex: 1;
min-width: 0;
}
.avatar {
width: 36px;
height: 36px;
border-radius: 8px;
overflow: hidden;
border: 1px solid rgba(255, 255, 255, 0.06);
background: linear-gradient(135deg, #0b3146, #063048);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
position: relative;
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.meta {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
}
.meta .name {
font-weight: 700;
color: #e6f0fb;
font-size: 13px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display:flex;
align-items:center;
gap:6px;
}
.meta .sub {
font-size: 10px;
color: #8aa5bd;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.glass {
flex: 1;
display: flex;
flex-direction: column;
background: transparent;
border: none;
overflow: hidden;
position: relative;
}
.messages {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
padding: 12px;
padding-bottom: 80px;
scroll-behavior: smooth;
}
.msg {
max-width: 80%;
padding: 8px 10px;
border-radius: 10px;
font-size: 13px;
line-height: 1.3;
word-break: break-word;
position: relative;
transition: transform 0.3s ease;
user-select: none;
}
.msg.swiping {
transform: translateX(-60px); /* سحب إلى اليسار للرد */
}
.incoming {
align-self: flex-start;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
color: var(--muted);
}
.outgoing {
align-self: flex-end;
background: rgba(10, 100, 150, 0.3);
color: #e6f7ff;
border: 1px solid rgba(255, 255, 255, 0.03);
}
.msg-image, .msg-video {
max-width: 100%;
height: auto;
display: block;
border-radius: 6px;
margin-top: 6px;
}
.msg-audio-player {
display: flex;
align-items: center;
gap: 8px;
width: 220px;
background: rgba(255, 255, 255, 0.1);
border-radius: 10px;
padding: 6px;
margin-top: 4px;
}
.incoming .msg-audio-player {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.audio-play-btn {
background: #e6f7ff;
color: #0369a1;
border: none;
border-radius: 50%;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
}
.incoming .audio-play-btn {
background: var(--muted);
color: var(--bg);
}
.audio-waveform-container {
flex: 1;
min-height: 40px;
}
.audio-time {
font-size: 11px;
color: #e6f7ffcc;
}
.incoming .audio-time {
color: #cbd5e1cc;
}
.meta-time {
font-size: 10px;
color: #9fb3c8;
margin-top: 4px;
text-align: left;
display: flex;
align-items: center;
justify-content: flex-end;
gap: 4px;
}
.composer {
display: flex;
flex-direction: column;
gap: 8px;
padding: 6px 10px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
position: fixed;
bottom: 0;
left: 0;
right: 0;
background-color: var(--bg);
z-index: 100;
box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
}
.composer-input-row {
display: flex;
gap: 6px;
align-items: flex-end;
}
.composer textarea {
flex: 1;
min-height: 32px;
max-height: 100px;
resize: none;
padding: 8px 12px;
border-radius: 18px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: transparent;
color: var(--muted);
transition: all 0.2s ease;
direction: rtl;
font-size: 16px;
}
.composer textarea:focus {
outline: none;
border-color: var(--accent);
}
.composer-btn {
width: 32px;
height: 32px;
background: linear-gradient(180deg, #06b6d4, #0891b2);
color: #012;
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.composer-btn:disabled {
background: #444;
cursor: not-allowed;
}
.file-input-btn, .voice-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
color: var(--muted);
padding: 6px;
border-radius: 50%;
cursor: pointer;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
#file-preview {
display: flex;
align-items: center;
gap: 6px;
padding: 6px;
background: rgba(255, 255, 255, 0.05);
border-radius: 6px;
border: 1px solid rgba(255, 255, 255, 0.1);
font-size: 12px;
}
.small { font-size: 11px; color: #8aa5bd; }
.recording-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 18px;
    background: rgba(185, 28, 28, 0.4); 
    font-size: 12px;
    color: #fca5a5;
    flex: 1;
}
.recording-dot {
width: 8px;
height: 8px;
background-color: #ff6b6b;
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn { padding: 6px; font-size: 12px; }
#reply-container {
display: none;
align-items: center;
gap: 8px;
padding: 6px 12px;
border-radius: 12px;
background: var(--reply-bg);
border: 1px solid var(--reply-border);
margin-top: -4px;
}
#cancel-reply-btn {
background: rgba(239, 68, 68, 0.3);
border: none;
border-radius: 50%;
width: 24px;
height: 24px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
color: #ef4444;
transition: background 0.2s;
}
#cancel-reply-btn:hover {
background: rgba(239, 68, 68, 0.5);
}
.reply-block {
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--reply-block-bg);
  border-right: 3px solid var(--accent);
  display: flex;
  flex-direction: column;
}
.incoming .reply-block {
  background: rgba(255, 255, 255, 0.05);
  border-right: 3px solid #cbd5e1;
}
.reply-block-sender {
  font-weight: 600;
  color: var(--accent);
  font-size: 11px;
}
.incoming .reply-block-sender { color: #cbd5e1; }
.reply-block-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Voice Preview */
#audio-preview-container {
    display: none;
    flex: 1;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.08);
}
#audio-waveform-input {
    flex: 1;
    min-height: 30px;
    margin: 5px 0;
}
.audio-preview-time {
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
}
.audio-preview-cancel-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 20px;
    flex-shrink: 0;
}

/* Online Dot */
.avatar-with-dot { position: relative; display: inline-block; }
.online-dot {
  position: absolute;
  bottom: -2px;
  left: -2px;
  width: 12px;
  height: 12px;
  background: #22c55e;
  border: 2px solid #000;
  border-radius: 999px;
  display: inline-block;
  z-index: 10;
}

/* Verified Badge */
.verified-badge-img {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  margin-left: 6px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.06);
  vertical-align: middle;
}

/* Reactions Popup */
.reactions-popup {
  position: absolute;
  display: none;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 8px;
  z-index: 300;
  backdrop-filter: blur(10px);
  flex-wrap: wrap;
  gap: 8px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.reaction-btn {
  font-size: 24px;
  cursor: pointer;
  transition: transform 0.2s;
}
.reaction-btn:hover {
  transform: scale(1.2);
}
.reactions-display {
  display: flex;
  gap: 4px;
  font-size: 16px;
  margin-top: 4px;
}
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="user-row">
<a class="btn" href="/users_list" style="text-decoration:none;color:var(--muted);">◀</a>

<a id="other-profile-link" href="#" class="avatar avatar-with-dot" style="display:inline-flex;align-items:center;justify-content:center; overflow: visible;">
  <img id="other-avatar" src="" alt="avatar" style="border-radius: 8px;">
  <span id="other-online-dot" class="online-dot" style="display:none;"></span>
</a>

<div class="meta">
<div id="other-name" class="name">جارٍ التحميل...</div>
<div id="other-username" class="sub small"></div>
</div>
</div>
</div>
<div class="glass">
<div id="messages" class="messages">
<div class="small" style="text-align:center">جاري تحميل الرسائل...</div>
</div>
</div>
<form id="sendForm" class="composer" onsubmit="return false;">
<div id="reply-container">
<div id="reply-content">
<span id="reply-sender"></span>
<span id="reply-text"></span>
</div>
<button id="cancel-reply-btn" type="button" title="إلغاء الرد">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>
</div>

<div id="file-preview" style="display:none;">
    <span class="small" style="flex:1;">تم اختيار ملف</span>
    <button type="button" class="composer-btn btn" id="remove-file-btn" style="width:24px;height:24px;background:red;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
    </button>
</div>

<div class="composer-input-row">

<label for="media-upload" class="file-input-btn" id="attachFileBtn" title="إرفاق ملف">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7v-2h4V7h2v4h4v2h-4v4h-2z"/>
</svg>
</label>
<input type="file" id="media-upload" style="display:none;" accept="image/*,video/*,audio/*">

<textarea id="msgInput" placeholder="اكتب رسالة..." aria-label="اكتب رسالة"></textarea>

<div id="recording-indicator" class="recording-indicator">
    <div class="recording-dot"></div>
    <span>جاري التسجيل... 0:00</span>
</div>

<div id="audio-preview-container">
    <div id="audio-waveform-input"></div>
    <span id="audio-preview-time" class="audio-preview-time">0:00</span>
    <button type="button" class="audio-preview-cancel-btn" title="إلغاء التسجيل">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
</div>


<button id="voiceBtn" class="voice-btn" type="button" title="تسجيل صوت">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path id="voiceIcon" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>
</svg>
</button>

<button id="sendBtn" class="composer-btn" type="submit" title="إرسال" style="display:none;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
</svg>
</button>
</div>
</form>
</div>
<script>
function getQuery(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const otherId = getQuery('contactId');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const fileUpload = document.getElementById('media-upload');
const filePreview = document.getElementById('file-preview');
const removeFileBtn = document.getElementById('remove-file-btn');
const sendForm = document.getElementById('sendForm');
const voiceBtn = document.getElementById('voiceBtn');
const voiceIcon = document.getElementById('voiceIcon');
const attachFileBtn = document.getElementById('attachFileBtn');
const recordingIndicator = document.getElementById('recording-indicator');
const recordingTimeEl = recordingIndicator.querySelector('span');
const replyContainer = document.getElementById('reply-container');
const cancelReplyBtn = document.getElementById('cancel-reply-btn');

const audioPreviewContainer = document.getElementById('audio-preview-container');
const audioWaveformInput = document.getElementById('audio-waveform-input');
const audioPreviewTime = document.getElementById('audio-preview-time');
const audioPreviewCancelBtn = audioPreviewContainer.querySelector('.audio-preview-cancel-btn');

// State Variables
let uploadedFile = null;
let myId = null;
let lastMessages = null;
let replyToMessage = null;
let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;
let recordingTimer = null;
let recordingSeconds = 0;
let inputWaveSurfer = null;
let audioWaveSurfers = {}; 
let playingAudioStates = {};

const RECORDING_STATE = {
    IDLE: 'idle',
    RECORDING: 'recording',
    READY_TO_SEND: 'ready'
};
let recordingState = RECORDING_STATE.IDLE;

// Reactions (محليًا فقط لأن الخادم لا يدعمها حاليًا)
const reactions = ['❤️', '😢', '😡', '😂', '👍'];
let reactionsMap = {}; // {messageId: emoji}

// Verified badge
const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
let verifiedMap = {};

// Helper Functions
function formatTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    if (date.toDateString() === now.toDateString()) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    return date.toLocaleDateString('ar-EG', { month: 'numeric', day: 'numeric' });
}
function formatAudioTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}
function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/"/g, '&quot;');
}
function createAudioPlayer(src, isIncoming) {
    return `
        <div class="msg-audio-player" onclick="event.stopPropagation()">
            <button class="audio-play-btn" type="button" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}" data-player>
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="audio-waveform-container" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}"></div>
            <span class="audio-time">0:00</span>
        </div>
    `;
}
function createMessageElement(msg, myId) {
    const isIncoming = (msg.senderId !== myId);
    const el = document.createElement('div');
    el.className = 'msg ' + (isIncoming ? 'incoming' : 'outgoing');
    el.dataset.messageId = msg.messageId;

    let contentHtml = '';
    
    if (msg.replied_to_id) {
        const repliedSender = msg.replied_to_sender || 'مستخدم';
        const repliedContent = msg.replied_to_content || 'رسالة محذوفة';
        contentHtml += `
            <div class="reply-block">
                <span class="reply-block-sender">${escapeHtml(repliedSender)}</span>
                <span class="reply-block-text">${escapeHtml(repliedContent)}</span>
            </div>
        `;
    }

    if (msg.media && msg.media.url) {
        const mediaUrl = msg.media.url;
        const mediaType = msg.media.type || 'raw';

        if (mediaType.startsWith('image')) {
            contentHtml += `<img src="${escapeAttr(mediaUrl)}" class="msg-image" alt="صورة" onload="scrollToBottom()">`;
        } else if (mediaType.startsWith('audio') || mediaUrl.endsWith('.webm') || mediaUrl.endsWith('.mp3')) {
            contentHtml += createAudioPlayer(mediaUrl, isIncoming);
        } else if (mediaType.startsWith('video')) {
            contentHtml += `<video src="${escapeAttr(mediaUrl)}" controls class="msg-video" onload="scrollToBottom()"></video>`;
        } else {
            contentHtml += `<div style="padding:4px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;margin-top:5px;"><a href="${escapeAttr(mediaUrl)}" target="_blank" style="color:var(--accent);text-decoration:none;">📎 ملف مرفق</a></div>`;
        }
    }

    if (msg.content) {
        contentHtml += `<p style="margin:${msg.media ? '6px 0 0 0' : '0'}">${escapeHtml(msg.content)}</p>`;
    }

    const readStatus = !isIncoming && msg.is_read ? '<span style="color:#4ade80">✓✓</span>' : (!isIncoming ? '<span>✓</span>' : '');
    contentHtml += `<div class="meta-time">${formatTime(msg.timestamp)}${readStatus}</div>`;

    // عرض التفاعل المحلي
    if (reactionsMap[msg.messageId]) {
        contentHtml += `<div class="reactions-display">${reactionsMap[msg.messageId]}</div>`;
    }

    el.innerHTML = contentHtml;

    // إعداد السحب للرد فقط (إزالة الضغط العادي)
    setupSwipeToReply(el, msg);
    setupLongPress(el, msg);

    return el;
}
function scrollToBottom() {
    requestAnimationFrame(() => {
        messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    });
}
function getMessageType(msg) {
    if (msg.media && msg.media.type) {
        if (msg.media.type.startsWith('image')) return 'صورة';
        if (msg.media.type.startsWith('video')) return 'فيديو';
        if (msg.media.type.startsWith('audio')) return 'صوت';
    }
    return 'نص الرسالة';
}
function setReplyTo(msg) {
    if (msg.messageId === replyToMessage?.id) {
        clearReplyTo();
        return;
    }
    
    const isIncoming = (msg.senderId !== myId);
    
    replyToMessage = {
        id: msg.messageId,
        content: msg.content || `[${getMessageType(msg)}]`,
        senderName: isIncoming ? document.getElementById('other-name').textContent : 'أنت',
        senderId: msg.senderId
    };

    document.getElementById('reply-sender').textContent = replyToMessage.senderName + ': ';
    document.getElementById('reply-text').textContent = replyToMessage.content;
    replyContainer.style.display = 'flex';
}
function clearReplyTo() {
    replyToMessage = null;
    replyContainer.style.display = 'none';
}
cancelReplyBtn.onclick = clearReplyTo;

// السحب للرد فقط
function setupSwipeToReply(el, msg) {
    let startX = 0;
    let isSwiping = false;

    el.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isSwiping = true;
    });

    el.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;
        const currentX = e.touches[0].clientX;
        const diff = startX - currentX;
        if (diff > 30) {
            el.classList.add('swiping');
        }
    });

    el.addEventListener('touchend', () => {
        if (!isSwiping) return;
        isSwiping = false;
        const diff = startX - (event.changedTouches[0].clientX || startX);
        if (diff > 60) { // عتبة السحب
            setReplyTo(msg);
        }
        el.classList.remove('swiping');
    });
}

// الضغط المطول للتفاعلات
let longPressTimer;
function setupLongPress(el, msg) {
    el.addEventListener('touchstart', (e) => {
        e.preventDefault(); // منع السحب أثناء الضغط المطول
        longPressTimer = setTimeout(() => showReactionsPopup(el, msg), 600);
    });
    el.addEventListener('touchend', () => clearTimeout(longPressTimer));
    el.addEventListener('touchmove', () => clearTimeout(longPressTimer));
}

function showReactionsPopup(el, msg) {
    let popup = document.querySelector('.reactions-popup');
    if (popup) popup.remove();

    popup = document.createElement('div');
    popup.className = 'reactions-popup';
    reactions.forEach(emoji => {
        const btn = document.createElement('span');
        btn.className = 'reaction-btn';
        btn.textContent = emoji;
        btn.onclick = (e) => {
            e.stopPropagation();
            addLocalReaction(msg.messageId, emoji);
            popup.remove();
        };
        popup.appendChild(btn);
    });

    const rect = el.getBoundingClientRect();
    popup.style.position = 'fixed';
    popup.style.top = `${rect.top - 60}px`;
    popup.style.left = `${rect.left + rect.width / 2 - 100}px`;
    popup.style.transform = 'translateX(-50%)';
    document.body.appendChild(popup);
    popup.style.display = 'flex';

    setTimeout(() => popup.remove(), 6000);
}

// التفاعل محليًا فقط (لأن الخادم لا يدعم الـ endpoint)
function addLocalReaction(messageId, emoji) {
    reactionsMap[messageId] = emoji;
    saveReactions();
    fetchMessages(); // إعادة رسم الرسائل لعرض التفاعل
}

function loadReactions() {
    const saved = localStorage.getItem(`chat_reactions_${otherId}`);
    if (saved) reactionsMap = JSON.parse(saved);
}
function saveReactions() {
    localStorage.setItem(`chat_reactions_${otherId}`, JSON.stringify(reactionsMap));
}

// باقي الدوال كما هي (UI، تسجيل صوتي، إرسال، إلخ)
function updateComposerUI() {
    msgInput.style.display = 'none';
    recordingIndicator.style.display = 'none';
    audioPreviewContainer.style.display = 'none';
    attachFileBtn.style.display = 'none';
    voiceBtn.style.display = 'flex';
    sendBtn.style.display = 'none';
    
    if (uploadedFile && recordingState !== RECORDING_STATE.READY_TO_SEND) {
        msgInput.style.display = 'block';
        filePreview.style.display = 'flex';
        voiceBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        attachFileBtn.style.display = 'flex';
        return;
    }
    
    filePreview.style.display = 'none';

    if (msgInput.value.trim().length > 0 && recordingState === RECORDING_STATE.IDLE) {
        msgInput.style.display = 'block';
        attachFileBtn.style.display = 'flex';
        voiceBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        return;
    }

    switch (recordingState) {
        case RECORDING_STATE.IDLE:
            msgInput.style.display = 'block';
            attachFileBtn.style.display = 'flex';
            voiceIcon.innerHTML = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>`;
            voiceBtn.classList.remove('recording-active');
            break;
        case RECORDING_STATE.RECORDING:
            recordingIndicator.style.display = 'flex';
            voiceIcon.innerHTML = `<path d="M6 19h12v-6H6v6z"/>`;
            voiceBtn.classList.add('recording-active');
            attachFileBtn.style.display = 'none';
            break;
        case RECORDING_STATE.READY_TO_SEND:
            audioPreviewContainer.style.display = 'flex';
            voiceBtn.style.display = 'none';
            sendBtn.style.display = 'flex';
            attachFileBtn.style.display = 'flex';
            break;
    }
}
msgInput.addEventListener('input', updateComposerUI);

async function fetchOtherProfile() { /* نفس الكود مع إصلاح src الصورة الافتراضية إلى فارغ */ 
    try {
        const res = await fetch(`/api/profile/${otherId}`, { credentials: 'same-origin' });
        const profile = await res.json();
        const myProfileRes = await fetch('/api/profile', { credentials: 'same-origin' });
        const myProfile = await myProfileRes.json();
        myId = myProfile.id;

        if (res.ok && profile) {
            renderHeaderName(profile.full_name || profile.username, !!profile.is_verified);
            let usernameText = `@${profile.username || ''}`;
            if (profile.is_online) usernameText += ' · متصل الآن';
            document.getElementById('other-username').textContent = usernameText;
            document.getElementById('other-avatar').src = profile.profile_picture_url || '';
            document.getElementById('other-profile-link').href = `/profile?userId=${otherId}`;
            document.getElementById('other-online-dot').style.display = profile.is_online ? 'inline-block' : 'none';
            verifiedMap[otherId] = !!profile.is_verified;
        }
    } catch (error) {
        console.error('Error fetching profile:', error);
        document.getElementById('other-name').textContent = 'خطأ في التحميل';
    }
}

function renderHeaderName(name, isVerified) {
    const nameEl = document.getElementById('other-name');
    const escaped = escapeHtml(name);
    if (isVerified) {
        nameEl.innerHTML = `${escaped} <img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="موثق" title="موثق">`;
    } else {
        nameEl.textContent = escaped;
    }
}

/* باقي Event Handlers (إرسال، رفع ملفات، إلخ) نفسها */

(async function init() {
    if(!otherId) { window.location.href = '/chat_list'; return; }
    await fetchOtherProfile();
    loadReactions();
    await fetchMessages();
    setTimeout(scrollToBottom, 100);
    updateComposerUI();

    setInterval(async () => { if (document.visibilityState === 'visible') await fetchMessages(); }, 3000);
    window.addEventListener('focus', fetchMessages);
    window.addEventListener('focus', markRead);
    window.addEventListener('beforeunload', saveReactions);
})();
