<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--bg: #000;
--glass-bg: rgba(255, 255, 255, 0.05);
--glass-border: rgba(255, 255, 255, 0.1);
--accent: #7dd3fc;
--muted: #cbd5e1;
--reply-bg: rgba(255, 255, 255, 0.08);
--reply-border: rgba(255, 255, 255, 0.15);
--reply-block-bg: rgba(255, 255, 255, 0.08);
--reply-block-border: rgba(255, 255, 255, 0.15);
}
html, body {
height: 100%;
margin: 0;
font-family: 'Inter', system-ui;
background-color: var(--bg);
color: var(--muted);
-webkit-font-smoothing: antialiased;
direction: rtl;
touch-action: pan-x pan-y;
overflow: hidden; /* منع التمرير العام */
}
.wrap {
height: 100dvh;
display: flex;
flex-direction: column;
max-width: 980px;
margin: 0 auto;
padding: 0;
position: relative;
}
.top {
display: flex;
align-items: center;
gap: 6px;
justify-content: space-between;
padding: 6px 10px;
background: var(--bg);
z-index: 200;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
flex-shrink: 0;
height: 50px; 
}
.user-row {
display: flex;
align-items: center;
gap: 6px;
flex: 1;
min-width: 0;
}
.avatar {
width: 36px;
height: 36px;
border-radius: 8px;
overflow: hidden;
border: 1px solid rgba(255, 255, 255, 0.06);
background: linear-gradient(135deg, #0b3146, #063048);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
position: relative;
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.meta {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
}
.meta .name {
font-weight: 700;
color: #e6f0fb;
font-size: 13px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display:flex;
align-items:center;
gap:6px;
}
.meta .sub {
font-size: 10px;
color: #8aa5bd;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.glass {
flex: 1;
display: flex;
flex-direction: column;
background: transparent;
border: none;
overflow: hidden;
position: relative;
}
.messages {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
padding: 12px;
padding-bottom: 80px;
scroll-behavior: auto; /* نلغي التمرير السلس افتراضياً للتحكم به يدوياً */
opacity: 0; /* نخفي الرسائل حتى يتم تحميلها وتمريرها للأسفل */
transition: opacity 0.3s ease-in;
}
/* Message Container for Swipe */
.msg-container {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    /* مساحة للأيقونة */
    overflow: visible; 
}
.msg-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); /* حركة عودة سلسة */
    will-change: transform;
    z-index: 2;
}

/* Reply Icon behind the message */
.swipe-reply-icon {
    position: absolute;
    top: 50%;
    transform: translateY(-50%) scale(0.5);
    right: -35px; /* تظهر من اليمين عند سحب الرسالة لليسار */
    color: var(--accent);
    font-size: 18px;
    opacity: 0;
    transition: all 0.2s;
    z-index: 1;
}
.incoming .swipe-reply-icon {
    /* للرسائل الواردة، السحب قد يكون في الاتجاه المعاكس أو نفسه حسب التصميم */
    right: auto;
    left: -35px;
}

.msg {
    max-width: 80%;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.3;
    word-break: break-word;
    position: relative;
    user-select: none; /* منع تحديد النص أثناء السحب */
}

.incoming .msg {
align-self: flex-start;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
color: var(--muted);
margin-left: 0;
margin-right: auto;
}
.outgoing .msg {
align-self: flex-end;
background: rgba(10, 100, 150, 0.3);
color: #e6f7ff;
border: 1px solid rgba(255, 255, 255, 0.03);
margin-right: 0;
margin-left: auto;
}

/* Wrapper alignment classes */
.msg-container.incoming { align-items: flex-start; }
.msg-container.outgoing { align-items: flex-end; }

.msg-image, .msg-video {
max-width: 100%;
height: auto;
display: block;
border-radius: 6px;
margin-top: 6px;
pointer-events: none; /* منع النقر على الصورة لتعارض السحب */
}
.msg-audio-player {
display: flex;
align-items: center;
gap: 8px;
width: 220px;
background: rgba(255, 255, 255, 0.1);
border-radius: 10px;
padding: 6px;
margin-top: 4px;
}
.incoming .msg-audio-player {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.audio-play-btn {
background: #e6f7ff;
color: #0369a1;
border: none;
border-radius: 50%;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
z-index: 5; /* لضمان عمل الزر فوق السحب */
}
.incoming .audio-play-btn {
background: var(--muted);
color: var(--bg);
}
.audio-waveform-container {
flex: 1;
min-height: 40px;
}
.audio-time {
font-size: 11px;
color: #e6f7ffcc;
}
.incoming .audio-time {
color: #cbd5e1cc;
}
.meta-time {
font-size: 10px;
color: #9fb3c8;
margin-top: 4px;
text-align: left;
display: flex;
align-items: center;
justify-content: flex-end;
gap: 4px;
}
.composer {
display: flex;
flex-direction: column;
gap: 8px;
padding: 6px 10px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
position: fixed;
bottom: 0;
left: 0;
right: 0;
background-color: var(--bg);
z-index: 100;
box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
}
.composer-input-row {
display: flex;
gap: 6px;
align-items: flex-end;
}
.composer textarea {
flex: 1;
min-height: 32px;
max-height: 100px;
resize: none;
padding: 8px 12px;
border-radius: 18px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: transparent;
color: var(--muted);
transition: all 0.2s ease;
direction: rtl;
font-size: 16px;
}
.composer textarea:focus {
outline: none;
border-color: var(--accent);
}
.composer-btn {
width: 32px;
height: 32px;
background: linear-gradient(180deg, #06b6d4, #0891b2);
color: #012;
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.composer-btn:disabled {
background: #444;
cursor: not-allowed;
}
.file-input-btn, .voice-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
color: var(--muted);
padding: 6px;
border-radius: 50%;
cursor: pointer;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
#file-preview {
display: flex;
align-items: center;
gap: 6px;
padding: 6px;
background: rgba(255, 255, 255, 0.05);
border-radius: 6px;
border: 1px solid rgba(255, 255, 255, 0.1);
font-size: 12px;
}
.small { font-size: 11px; color: #8aa5bd; }
.recording-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 18px;
    background: rgba(185, 28, 28, 0.4); 
    font-size: 12px;
    color: #fca5a5;
    flex: 1;
}
.recording-dot {
width: 8px;
height: 8px;
background-color: #ff6b6b;
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn { padding: 6px; font-size: 12px; }
#reply-container {
display: none;
align-items: center;
gap: 8px;
padding: 6px 12px;
border-radius: 12px;
background: var(--reply-bg);
border: 1px solid var(--reply-border);
margin-top: -4px;
}
.reply-block {
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--reply-block-bg);
  border-right: 3px solid var(--accent);
  display: flex;
  flex-direction: column;
}
.incoming .reply-block {
  background: rgba(255, 255, 255, 0.05);
  border-right: 3px solid #cbd5e1;
}
.reply-block-sender {
  font-weight: 600;
  color: var(--accent);
  font-size: 11px;
}
.incoming .reply-block-sender { color: #cbd5e1; }
.reply-block-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* New/Modified styles for Voice Preview */
#audio-preview-container {
    display: none;
    flex: 1;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.08);
}
#audio-waveform-input {
    flex: 1;
    min-height: 30px;
    margin: 5px 0;
}
.audio-preview-time {
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
}
.audio-preview-cancel-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 20px;
    flex-shrink: 0;
}

/* --- تعديل نقطة النشاط (Online Dot) --- */
.avatar-with-dot { position: relative; display: inline-block; }
.online-dot {
  position: absolute;
  bottom: -2px;   /* في الأسفل */
  left: -2px;     /* في الزاوية اليسرى */
  width: 12px;
  height: 12px;
  background: #22c55e;
  border: 2px solid #000; /* حدود بنفس لون الهيدر لتبدو بارزة */
  border-radius: 999px;
  display: inline-block;
  z-index: 10;
}

/* small online next to name */
.online-text {
  color: #22c55e;
  font-weight: 700;
  font-size: 11px;
  margin-left: 6px;
}

/* VERIFIED BADGE IMAGE */
.verified-badge-img {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  margin-left: 6px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.06);
  vertical-align: middle;
}
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>

<script>
function getQuery(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const otherId = getQuery('contactId');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const fileUpload = document.getElementById('media-upload');
const filePreview = document.getElementById('file-preview');
const removeFileBtn = document.getElementById('remove-file-btn');
const sendForm = document.getElementById('sendForm');
const voiceBtn = document.getElementById('voiceBtn');
const voiceIcon = document.getElementById('voiceIcon');
const attachFileBtn = document.getElementById('attachFileBtn');
const recordingIndicator = document.getElementById('recording-indicator');
const recordingTimeEl = recordingIndicator.querySelector('span');
const replyContainer = document.getElementById('reply-container');
const cancelReplyBtn = document.getElementById('cancel-reply-btn');


const audioPreviewContainer = document.getElementById('audio-preview-container');
const audioWaveformInput = document.getElementById('audio-waveform-input');
const audioPreviewTime = document.getElementById('audio-preview-time');
const audioPreviewCancelBtn = audioPreviewContainer.querySelector('.audio-preview-cancel-btn');


// State Variables
let uploadedFile = null;
let myId = null;
let lastMessages = null;
let replyToMessage = null;
let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;
let recordingTimer = null;
let recordingSeconds = 0;
let inputWaveSurfer = null;
let audioWaveSurfers = {}; 

const RECORDING_STATE = {
    IDLE: 'idle',
    RECORDING: 'recording',
    READY_TO_SEND: 'ready'
};
let recordingState = RECORDING_STATE.IDLE;

// Verified badge assets & map
const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
let verifiedMap = {}; // { userId: true/false }

// Helper Functions
function formatTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    if (date.toDateString() === now.toDateString()) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    return date.toLocaleDateString('ar-EG', { month: 'numeric', day: 'numeric' });
}
function formatAudioTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}
function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/"/g, '&quot;');
}
function createAudioPlayer(src, isIncoming) {
    return `
        <div class="msg-audio-player" onclick="event.stopPropagation()">
            <button class="audio-play-btn" type="button" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}" data-player>
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="audio-waveform-container" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}"></div>
            <span class="audio-time">0:00</span>
        </div>
    `;
}

// دالة إنشاء الرسالة مع دعم السحب
function createMessageElement(msg, myId) {
    const isIncoming = (msg.senderId !== myId);
    
    // الحاوية الخارجية
    const container = document.createElement('div');
    container.className = 'msg-container ' + (isIncoming ? 'incoming' : 'outgoing');
    container.dataset.messageId = msg.messageId;

    // الغلاف القابل للسحب (Wrapper)
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper';
    
    // محتوى الرسالة (Bubble)
    const bubble = document.createElement('div');
    bubble.className = 'msg';
    
    // أيقونة الرد الخلفية (تظهر عند السحب)
    const replyIcon = document.createElement('i');
    replyIcon.className = 'fas fa-reply swipe-reply-icon';
    // تحديد مكان الأيقونة بناء على المرسل (في RTL قد نحتاج لضبط الاتجاه)
    if(isIncoming) {
       // الرسالة على اليمين، السحب لليسار
       replyIcon.style.left = '-35px';
       replyIcon.style.right = 'auto';
    } else {
       // الرسالة على اليسار، السحب لليمين
       replyIcon.style.right = '-35px';
       replyIcon.style.left = 'auto';
    }
    
    // إضافة منطق السحب (Touch Logic)
    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    const threshold = 60; // المسافة المطلوبة لتفعيل الرد

    wrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isDragging = true;
        wrapper.style.transition = 'none'; // إلغاء الحركة السلسة لتتبع الإصبع
    }, {passive: true});

    wrapper.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const x = e.touches[0].clientX;
        const diff = x - startX;
        
        // في RTL: السحب لليسار يعني قيم سالبة، ولليمين موجبة.
        // نريد السماح بالسحب "للداخل" من اتجاه الرسالة.
        // إذا كانت واردة (يمين الشاشة): نسحبها لليسار (سالب)
        // إذا كانت صادرة (يسار الشاشة): نسحبها لليمين (موجب)
        
        let validDrag = false;
        if(isIncoming && diff < 0 && diff > -100) validDrag = true; // سحب لليسار
        if(!isIncoming && diff > 0 && diff < 100) validDrag = true; // سحب لليمين

        if (validDrag) {
            currentX = diff;
            wrapper.style.transform = `translateX(${diff}px)`;
            
            // إظهار/تكبير الأيقونة
            const progress = Math.min(Math.abs(diff) / threshold, 1);
            replyIcon.style.opacity = progress;
            replyIcon.style.transform = `translateY(-50%) scale(${0.5 + (0.5 * progress)})`;
        }
    }, {passive: true});

    wrapper.addEventListener('touchend', (e) => {
        isDragging = false;
        wrapper.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        wrapper.style.transform = 'translateX(0)';
        
        // إعادة الأيقونة
        replyIcon.style.opacity = '0';
        replyIcon.style.transform = 'translateY(-50%) scale(0.5)';

        if (Math.abs(currentX) > threshold) {
            // تفعيل الرد
            if(navigator.vibrate) navigator.vibrate(50);
            setReplyTo(msg);
        }
        currentX = 0;
    }, {passive: true});


    // بناء محتوى الرسالة الداخلي
    let contentHtml = '';
    
    if (msg.replied_to_id) {
        const repliedSender = msg.replied_to_sender || 'مستخدم';
        const repliedContent = msg.replied_to_content || 'رسالة محذوفة';
        contentHtml += `
            <div class="reply-block">
                <span class="reply-block-sender">${escapeHtml(repliedSender)}</span>
                <span class="reply-block-text">${escapeHtml(repliedContent)}</span>
            </div>
        `;
    }

    if (msg.media && msg.media.url) {
        const mediaUrl = msg.media.url;
        const mediaType = msg.media.type || 'raw';

        if (mediaType.startsWith('image')) {
            contentHtml += `<img src="${escapeAttr(mediaUrl)}" class="msg-image" alt="صورة" onload="scrollToBottom(false)">`;
        } else if (mediaType.startsWith('audio') || mediaUrl.endsWith('.webm') || mediaUrl.endsWith('.mp3')) {
            contentHtml += createAudioPlayer(mediaUrl, isIncoming);
        } else if (mediaType.startsWith('video')) {
            contentHtml += `<video src="${escapeAttr(mediaUrl)}" controls class="msg-video" onload="scrollToBottom(false)"></video>`;
        } else {
            contentHtml += `<div style="padding:4px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;margin-top:5px;"><a href="${escapeAttr(mediaUrl)}" target="_blank" style="color:var(--accent);text-decoration:none;">📎 ملف مرفق</a></div>`;
        }
    }

    if (msg.content) {
        contentHtml += `<p style="margin:${msg.media ? '6px 0 0 0' : '0'}">${escapeHtml(msg.content)}</p>`;
    }

    const readStatus = !isIncoming && msg.is_read ? '<span style="color:#4ade80">✓✓</span>' : (!isIncoming ? '<span>✓</span>' : '');
    contentHtml += `<div class="meta-time">${formatTime(msg.timestamp)}${readStatus}</div>`;

    bubble.innerHTML = contentHtml;
    
    // تجميع العناصر: Bubble + Icon داخل Wrapper داخل Container
    wrapper.appendChild(bubble);
    wrapper.appendChild(replyIcon); // الأيقونة توضع داخل الغلاف المتحرك أو خارجه حسب الرغبة، هنا داخل الغلاف ولكن بـ absolute ستتحرك معه، الأفضل وضعها داخل الـ wrapper ليتم تغطيتها أو جعلها خلف الـ bubble
    
    container.appendChild(wrapper);
    return container;
}

// تعديل دالة التمرير لتدعم الوضع "الفوري"
function scrollToBottom(instant = false) {
    requestAnimationFrame(() => {
        if(instant) {
            messagesEl.style.scrollBehavior = 'auto';
            messagesEl.scrollTop = messagesEl.scrollHeight;
            messagesEl.style.opacity = 1; // إظهار الرسائل بعد القفز
        } else {
            messagesEl.style.scrollBehavior = 'smooth';
            messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
        }
    });
}

function setReplyTo(msg) {
    if (msg.messageId === replyToMessage?.id) {
        clearReplyTo();
        return;
    }
    
    const isIncoming = (msg.senderId !== myId);
    
    // تعريب نوع المحتوى في الرد
    let previewContent = msg.content;
    if (!previewContent && msg.media) {
        const type = msg.media.type || 'file';
        if (type.startsWith('image')) previewContent = '📷 صورة';
        else if (type.startsWith('video')) previewContent = '🎥 فيديو';
        else if (type.startsWith('audio')) previewContent = '🎤 تسجيل صوتي';
        else previewContent = '📎 ملف مرفق';
    }

    replyToMessage = {
        id: msg.messageId,
        content: previewContent, // النص المعرب
        rawContent: previewContent, // لتخزينه كما هو
        senderName: isIncoming ? document.getElementById('other-name').textContent : 'أنت',
        senderId: msg.senderId
    };

    document.getElementById('reply-sender').textContent = replyToMessage.senderName + ': ';
    document.getElementById('reply-text').textContent = replyToMessage.content;
    replyContainer.style.display = 'flex';
    msgInput.focus();
}

function clearReplyTo() {
    replyToMessage = null;
    replyContainer.style.display = 'none';
}
cancelReplyBtn.onclick = clearReplyTo;

// ---------------- UI/Composer Logic ----------------
function updateComposerUI() {
    // إخفاء الكل
    msgInput.style.display = 'none';
    recordingIndicator.style.display = 'none';
    audioPreviewContainer.style.display = 'none';
    attachFileBtn.style.display = 'none';
    voiceBtn.style.display = 'flex';
    sendBtn.style.display = 'none';
    
    // إظهار المطلوب حسب الحالة
    if (uploadedFile && recordingState !== RECORDING_STATE.READY_TO_SEND) {
        // حالة ملف عادي مرفق (صورة/فيديو)
        msgInput.style.display = 'block';
        filePreview.style.display = 'flex';
        voiceBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        attachFileBtn.style.display = 'flex';
        return;
    }
    
    filePreview.style.display = 'none';

    if (msgInput.value.trim().length > 0 && recordingState === RECORDING_STATE.IDLE) {
        // حالة كتابة نص
        msgInput.style.display = 'block';
        attachFileBtn.style.display = 'flex';
        voiceBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        return;
    }

    switch (recordingState) {
        case RECORDING_STATE.IDLE:
            msgInput.style.display = 'block';
            attachFileBtn.style.display = 'flex';
            voiceIcon.innerHTML = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>`;
            voiceBtn.classList.remove('recording-active');
            break;
            
        case RECORDING_STATE.RECORDING:
            recordingIndicator.style.display = 'flex';
            voiceIcon.innerHTML = `<path d="M6 19h12v-6H6v6z"/>`; // Stop icon
            voiceBtn.classList.add('recording-active');
            attachFileBtn.style.display = 'none';
            break;
            
        case RECORDING_STATE.READY_TO_SEND:
            audioPreviewContainer.style.display = 'flex';
            voiceBtn.style.display = 'none'; // نخفي زر التسجيل/الإيقاف
            sendBtn.style.display = 'flex'; // نظهر زر الإرسال
            attachFileBtn.style.display = 'flex';
            break;
    }
}
msgInput.addEventListener('input', updateComposerUI);

// ---------------- Voice Recording Logic ----------------
function startRecording() {
    if (recordingState !== RECORDING_STATE.IDLE) return;
    
    audioChunks = [];
    recordingSeconds = 0;
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            audioStream = stream;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm; codecs=opus' });
            mediaRecorder.start();
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            
            recordingState = RECORDING_STATE.RECORDING;
            updateComposerUI();

            recordingTimer = setInterval(() => {
                recordingSeconds++;
                recordingTimeEl.textContent = `جاري التسجيل... ${formatAudioTime(recordingSeconds)}`;
            }, 1000);
            
            mediaRecorder.onstop = stopRecording;

        }).catch(err => { 
            alert('تعذر الوصول إلى الميكروفون. تأكد من منح الإذن.'); 
            recordingState = RECORDING_STATE.IDLE;
            updateComposerUI();
        });
}

function stopRecording() {
    clearInterval(recordingTimer);
    recordingTimeEl.textContent = `جاري التسجيل... 0:00`;
    
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
    
    if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
    }
    
    if (audioChunks.length > 0) {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        uploadedFile = new File([audioBlob], 'voice_message.webm', { type: 'audio/webm' });
        
        const audioURL = URL.createObjectURL(audioBlob);
        
        if (inputWaveSurfer) inputWaveSurfer.destroy();
        inputWaveSurfer = WaveSurfer.create({
            container: audioWaveformInput,
            waveColor: '#7dd3fc',
            progressColor: '#06b6d4',
            cursorColor: 'transparent',
            barWidth: 2, height: 30, barGap: 2, barRadius: 2,
        });
        
        inputWaveSurfer.load(audioURL);
        inputWaveSurfer.on('ready', () => {
             audioPreviewTime.textContent = formatAudioTime(inputWaveSurfer.getDuration());
        });
        
        inputWaveSurfer.on('click', () => {
             inputWaveSurfer.playPause();
        });

        recordingState = RECORDING_STATE.READY_TO_SEND;
    } else {
        recordingState = RECORDING_STATE.IDLE;
    }
    
    updateComposerUI();
}

function handleVoiceButton() {
    if (recordingState === RECORDING_STATE.IDLE) {
        startRecording();
    } else if (recordingState === RECORDING_STATE.RECORDING) {
        stopRecording();
    }
}

function removeFile() {
    if (inputWaveSurfer) {
        inputWaveSurfer.destroy();
        inputWaveSurfer = null;
    }
    uploadedFile = null; 
    audioChunks = [];
    recordingState = RECORDING_STATE.IDLE;
    fileUpload.value = ''; 
    filePreview.innerHTML = '';
    updateComposerUI();
}


// ---------------- Main Logic Functions ----------------

let otherProfileUsername = null; 

function renderHeaderName(name, isVerified) {
    const nameEl = document.getElementById('other-name');
    const escaped = escapeHtml(name);
    if (isVerified) {
        nameEl.innerHTML = `${escaped} <img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="موثق" title="موثق">`;
    } else {
        nameEl.textContent = escaped;
    }
}

async function fetchOtherProfile() {
    try {
        const res = await fetch(`/api/profile/${otherId}`, { credentials: 'same-origin' });
        const profile = await res.json();
        
        const myProfileRes = await fetch('/api/profile', { credentials: 'same-origin' });
        const myProfile = await myProfileRes.json();
        myId = myProfile.id; 
        
        if (res.ok && profile) {
            renderHeaderName(profile.full_name || profile.username, !!profile.is_verified);

            let usernameText = `@${profile.username || ''}`;
            if (profile.is_online) usernameText += ' · متصل الآن';
            document.getElementById('other-username').textContent = usernameText;
            document.getElementById('other-avatar').src = profile.profile_picture_url;
            document.getElementById('other-profile-link').href = `/profile?userId=${otherId}`;
            
            const dot = document.getElementById('other-online-dot');
            if (dot) dot.style.display = profile.is_online ? 'inline-block' : 'none';

            otherProfileUsername = profile.username || null;
            verifiedMap[otherId] = !!profile.is_verified;
        }
    } catch (error) {
        console.error('Error fetching other profile:', error);
        document.getElementById('other-name').textContent = 'خطأ في التحميل';
    }
}

async function markRead() {
    if (!myId || !otherId) return;
    try {
        await fetch('/api/mark_read', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ other_id: otherId })
        });
    } catch (error) {
        console.warn('Could not mark messages as read:', error);
    }
}

let isFetchingMessages = false;
let isFirstLoad = true; // متغير للتحقق من أول تحميل

async function fetchMessages() {
    if (isFetchingMessages) return; 
    isFetchingMessages = true;

    try {
        const res = await fetch(`/api/messages/${otherId}`, { credentials: 'same-origin' });
        const result = await res.json();

        if (res.ok && result.ok && JSON.stringify(result.messages) !== JSON.stringify(lastMessages)) {
            lastMessages = result.messages;
            messagesEl.innerHTML = ''; 
            
            if (result.messages.length === 0) {
                 messagesEl.innerHTML = '<div class="small" style="text-align:center">ابدأ محادثة بإرسال أول رسالة!</div>';
                 messagesEl.style.opacity = 1; // إظهار الحاوية إذا كانت فارغة
            } else {
                const senderIds = [...new Set(result.messages.map(m => m.senderId).filter(Boolean))];
                const toFetch = senderIds.filter(id => typeof verifiedMap[id] === 'undefined');
                if (toFetch.length > 0) {
                    await Promise.all(toFetch.map(async uid => {
                        try {
                            const r = await fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' });
                            if (!r.ok) { verifiedMap[uid] = false; return; }
                            const d = await r.json();
                            verifiedMap[uid] = !!d.is_verified;
                        } catch (e) {
                            verifiedMap[uid] = false;
                        }
                    }));
                }

                for (const msg of result.messages) {
                    const el = createMessageElement(msg, myId);
                    messagesEl.appendChild(el);
                }
            }

            initializeAudioPlayers();
            
            // إذا كان أول تحميل، ننتقل للأسفل فوراً بدون أنيميشن
            if (isFirstLoad) {
                scrollToBottom(true); // true = instant
                isFirstLoad = false;
            } else {
                scrollToBottom(false); // false = smooth for updates
            }
            
            await markRead(); 
        }
    } catch (error) {
        console.error('Error fetching messages:', error);
        if (messagesEl.children.length < 2) { 
             messagesEl.innerHTML = '<div class="small" style="text-align:center; color: #ef4444;">حدث خطأ في الاتصال. حاول تحديث الصفحة.</div>';
             messagesEl.style.opacity = 1;
        }
    } finally {
        isFetchingMessages = false;
    }
}

function initializeAudioPlayers() {
    Object.values(audioWaveSurfers).forEach(ws => ws.destroy());
    audioWaveSurfers = {};

    document.querySelectorAll('.audio-waveform-container').forEach(container => {
        const src = container.dataset.src;
        const isIncoming = container.dataset.isIncoming === 'true';
        
        if (!audioWaveSurfers[src]) { 
            const wavesurfer = WaveSurfer.create({
                container: container,
                waveColor: isIncoming ? '#94a3b8' : '#7dd3fc', 
                progressColor: isIncoming ? '#475569' : '#0891b2',
                cursorColor: 'transparent',
                barWidth: 2, height: 30, barGap: 2, barRadius: 2,
            });
            audioWaveSurfers[src] = wavesurfer;
            wavesurfer.load(src);

            const playerBtn = document.querySelector(`.audio-play-btn[data-src="${escapeAttr(src)}"]`);
            const timeEl = playerBtn.closest('.msg-audio-player').querySelector('.audio-time');
            
            wavesurfer.on('ready', () => {
                timeEl.textContent = formatAudioTime(wavesurfer.getDuration());
            });
            
            playerBtn.onclick = (e) => {
                e.stopPropagation();
                wavesurfer.playPause();
            };
            
            wavesurfer.on('play', () => {
                playerBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; 
            });
            wavesurfer.on('pause', () => {
                playerBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>`; 
            });
            wavesurfer.on('audioprocess', (time) => {
                timeEl.textContent = formatAudioTime(time);
            });
            wavesurfer.on('finish', () => {
                wavesurfer.setTime(0); 
            });
        }
    });
}

// ---------------- Event Handlers ----------------

audioPreviewCancelBtn.onclick = removeFile;
voiceBtn.addEventListener('click', handleVoiceButton);


async function sendMessage() {
    let content = msgInput.value.trim();
    
    if (!content && !uploadedFile) return;
    
    sendBtn.disabled = true;
    const originalIcon = sendBtn.innerHTML;
    sendBtn.innerHTML = '<div class="spin" style="width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></div>';

    const formData = new FormData();
    formData.append('other_id', otherId); 
    if (content) formData.append('content', content);
    
    if (uploadedFile) {
        formData.append('media', uploadedFile, uploadedFile.name);
    }
    
    if (replyToMessage) {
        formData.append('replied_to_id', replyToMessage.id);
        // نرسل النص المعرب أو الأصلي
        formData.append('replied_to_content', replyToMessage.rawContent || replyToMessage.content); 
        formData.append('replied_to_sender', replyToMessage.senderName);
    }
    
    try {
        const res = await fetch('/api/messages/send', {
            method: 'POST', credentials: 'same-origin', body: formData
        });
        const result = await res.json();
        
        if (res.ok && result.ok && result.messageData) { 
            const el = createMessageElement(result.messageData, myId);
            messagesEl.appendChild(el); 

            msgInput.value = '';
            
            removeFile(); 
            clearReplyTo();
            
            scrollToBottom(false); // نمرر بسلاسة عند الإرسال
            lastMessages = null; 
            await fetchMessages(); 
        } else {
            alert('فشل الإرسال: ' + (result.error || 'خطأ غير معروف'));
        }
    } catch (err) {
        alert('خطأ في الاتصال بالخادم.');
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalIcon;
        updateComposerUI();
    }
}

removeFileBtn.addEventListener('click', () => {
    uploadedFile = null;
    fileUpload.value = '';
    updateComposerUI();
});

fileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        removeFile(); 
        
        uploadedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            let previewElement;
            if (file.type.startsWith('image/')) { previewElement = document.createElement('img'); previewElement.src = e.target.result; previewElement.style.maxHeight = '40px'; previewElement.style.borderRadius = '4px'; }
            else if (file.type.startsWith('video/')) { previewElement = document.createElement('video'); previewElement.src = e.target.result; previewElement.controls = true; previewElement.style.maxHeight = '40px'; previewElement.style.borderRadius = '4px'; }
            else if (file.type.startsWith('audio/')) { previewElement = document.createElement('audio'); previewElement.src = e.target.result; previewElement.controls = true; }
            else { previewElement = document.createElement('span'); previewElement.textContent = file.name; }
            
            filePreview.innerHTML = ''; 
            filePreview.appendChild(previewElement);
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'composer-btn btn';
            removeBtn.style.cssText = 'width:24px;height:24px;background:#ef4444;margin-right:auto;';
            removeBtn.innerHTML = '×';
            removeBtn.onclick = removeFileBtn.onclick;
            filePreview.appendChild(removeBtn);
            
            updateComposerUI();

        };
        reader.readAsDataURL(file);
    } else {
        removeFileBtn.onclick();
    }
});

sendForm.addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });


(async function init() {
    if(!otherId) { window.location.href = '/chat_list'; return; }
    
    await fetchOtherProfile();
    await fetchMessages(); 
    
    updateComposerUI(); 
    
    setInterval(async () => { if (document.visibilityState === 'visible') await fetchMessages(); }, 3000); 
    window.addEventListener('focus', fetchMessages);
    window.addEventListener('focus', markRead);
})();
