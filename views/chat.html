<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
--bg: #000;
--glass-bg: rgba(255, 255, 255, 0.05);
--glass-border: rgba(255, 255, 255, 0.1);
--accent: #7dd3fc;
--muted: #cbd5e1;
--reply-bg: rgba(255, 255, 255, 0.08);
--reply-border: rgba(255, 255, 255, 0.15);
--reply-block-bg: rgba(255, 255, 255, 0.08);
--reply-block-border: rgba(255, 255, 255, 0.15);
}
html, body {
height: 100%;
margin: 0;
font-family: 'Inter', system-ui;
background-color: var(--bg);
color: var(--muted);
-webkit-font-smoothing: antialiased;
direction: rtl;
touch-action: pan-x pan-y;
}
.wrap {
height: 100dvh;
display: flex;
flex-direction: column;
max-width: 980px;
margin: 0 auto;
padding: 0;
position: relative;
}
.top {
display: flex;
align-items: center;
gap: 6px;
justify-content: space-between;
padding: 6px 10px;
background: var(--bg);
z-index: 200;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
flex-shrink: 0;
height: 50px; 
}
.user-row {
display: flex;
align-items: center;
gap: 6px;
flex: 1;
min-width: 0;
}
.avatar {
width: 36px;
height: 36px;
border-radius: 8px;
overflow: hidden;
border: 1px solid rgba(255, 255, 255, 0.06);
background: linear-gradient(135deg, #0b3146, #063048);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
position: relative;
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.meta {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
}
.meta .name {
font-weight: 700;
color: #e6f0fb;
font-size: 13px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display:flex;
align-items:center;
gap:6px;
}
.meta .sub {
font-size: 10px;
color: #8aa5bd;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.glass {
flex: 1;
display: flex;
flex-direction: column;
background: transparent;
border: none;
overflow: hidden;
position: relative;
}
.messages {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
padding: 12px;
padding-bottom: 120px;
scroll-behavior: smooth;
}
.msg {
max-width: 80%;
padding: 8px 10px;
border-radius: 10px;
font-size: 13px;
line-height: 1.3;
word-break: break-word;
cursor: pointer;
touch-action: pan-y;
transition: transform 200ms ease, box-shadow 200ms ease;
will-change: transform;
position: relative;
}
.msg.incoming { box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset; }
.msg:active { transform: translateY(1px); }

.incoming {
align-self: flex-start;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
color: var(--muted);
}
.outgoing {
align-self: flex-end;
background: rgba(10, 100, 150, 0.3);
color: #e6f7ff;
border: 1px solid rgba(255, 255, 255, 0.03);
}

.msg-image, .msg-video {
max-width: 100%;
height: auto;
display: block;
border-radius: 6px;
margin-top: 6px;
}
.msg-audio-player {
display: flex;
align-items: center;
gap: 8px;
width: 220px;
background: rgba(255, 255, 255, 0.1);
border-radius: 10px;
padding: 6px;
margin-top: 4px;
}
.incoming .msg-audio-player {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.audio-play-btn {
background: #e6f7ff;
color: #0369a1;
border: none;
border-radius: 50%;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
}
.incoming .audio-play-btn {
background: var(--muted);
color: var(--bg);
}
.audio-waveform-container {
flex: 1;
min-height: 40px;
}
.audio-time {
font-size: 11px;
color: #e6f7ffcc;
}
.incoming .audio-time {
color: #cbd5e1cc;
}
.meta-time {
font-size: 10px;
color: #9fb3c8;
margin-top: 4px;
text-align: left;
display: flex;
align-items: center;
justify-content: flex-end;
gap: 4px;
}
.composer {
display: flex;
flex-direction: column;
gap: 8px;
padding: 6px 10px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
position: fixed;
bottom: 0;
left: 0;
right: 0;
background-color: var(--bg);
z-index: 100;
box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
}
.composer-input-row {
display: flex;
gap: 6px;
align-items: flex-end;
}
.composer textarea {
flex: 1;
min-height: 32px;
max-height: 100px;
resize: none;
padding: 8px 12px;
border-radius: 18px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: transparent;
color: var(--muted);
transition: all 0.2s ease;
direction: rtl;
font-size: 16px;
}
.composer textarea:focus {
outline: none;
border-color: var(--accent);
}
.composer-btn {
width: 32px;
height: 32px;
background: linear-gradient(180deg, #06b6d4, #0891b2);
color: #012;
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.composer-btn:disabled {
background: #444;
cursor: not-allowed;
}
.file-input-btn, .voice-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
color: var(--muted);
padding: 6px;
border-radius: 50%;
cursor: pointer;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
#file-preview {
display: flex;
align-items: center;
gap: 6px;
padding: 6px;
background: rgba(255, 255, 255, 0.05);
border-radius: 6px;
border: 1px solid rgba(255, 255, 255, 0.1);
font-size: 12px;
}
.small { font-size: 11px; color: #8aa5bd; }
.recording-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 18px;
    background: rgba(185, 28, 28, 0.4); 
    font-size: 12px;
    color: #fca5a5;
    flex: 1;
}
.recording-dot {
width: 8px;
height: 8px;
background-color: #ff6b6b;
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn { padding: 6px; font-size: 12px; }
#reply-container {
display: none;
align-items: center;
gap: 8px;
padding: 8px;
border-radius: 12px;
background: var(--reply-bg);
border: 1px solid var(--reply-border);
margin-top: -4px;
box-shadow: 0 6px 18px rgba(0,0,0,0.6);
transition: transform 180ms ease, opacity 180ms ease;
}
.reply-block {
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--reply-block-bg);
  border-right: 3px solid var(--accent);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.incoming .reply-block {
  background: rgba(255, 255, 255, 0.05);
  border-right: 3px solid #cbd5e1;
}
.reply-block-sender {
  font-weight: 600;
  color: var(--accent);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.incoming .reply-block-sender { color: #cbd5e1; }
.reply-block-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* New/Modified styles for Voice Preview */
#audio-preview-container {
    display: none;
    flex: 1;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.08);
}
#audio-waveform-input {
    flex: 1;
    min-height: 30px;
    margin: 5px 0;
}
.audio-preview-time {
    font-size: 12px;
    color: var(--accent);
    flex-shrink: 0;
}
.audio-preview-cancel-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 20px;
    flex-shrink: 0;
}

/* --- تعديل نقطة النشاط (Online Dot) --- */
.avatar-with-dot { position: relative; display: inline-block; }
.online-dot {
  position: absolute;
  bottom: -2px;   /* في الأسفل */
  left: -2px;     /* في الزاوية اليسرى */
  width: 12px;
  height: 12px;
  background: #22c55e;
  border: 2px solid #000; /* حدود بنفس لون الهيدر لتبدو بارزة */
  border-radius: 999px;
  display: inline-block;
  z-index: 10;
}

/* small online next to name */
.online-text {
  color: #22c55e;
  font-weight: 700;
  font-size: 11px;
  margin-left: 6px;
}

/* VERIFIED BADGE IMAGE */
.verified-badge-img {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  margin-left: 6px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.06);
  vertical-align: middle;
}

/* Reactions popup */
.reactions-popup {
  position: absolute;
  z-index: 400;
  display: flex;
  gap: 8px;
  padding: 8px;
  border-radius: 24px;
  background: rgba(20,20,20,0.95);
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  transform: translateY(-8px);
  opacity: 0;
  transition: opacity 140ms ease, transform 160ms ease;
  pointer-events: auto;
}
.reactions-popup.show { opacity: 1; transform: translateY(0); }
.reaction-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  border: 1px solid rgba(255,255,255,0.06);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
}
.reaction-btn:hover { transform: translateY(-4px); transition: transform 120ms ease; }

/* Reaction badge on message */
.msg-reaction-badge {
  position: absolute;
  bottom: -8px;
  left: -8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 14px;
  padding: 4px 6px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 6px 18px rgba(0,0,0,0.6);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Nice cancel X on reply */
#cancel-reply-btn {
  background: transparent;
  border: none;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
  transition: background 120ms ease, transform 120ms ease;
}
#cancel-reply-btn:hover { background: rgba(255,255,255,0.03); transform: rotate(10deg); color: #fff; }

/* Message swipe hint */
.msg.swipe-active { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

/* small helper for reply label */
.reply-label {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}

/* responsive tweaks */
@media (max-width: 480px) {
  .msg-audio-player { width: 180px; }
  .reactions-popup { gap: 6px; padding: 6px; }
  .reaction-btn { width: 36px; height: 36px; font-size: 16px; }
}
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="user-row">
<a class="btn" href="/users_list" style="text-decoration:none;color:var(--muted);">◀</a>

<a id="other-profile-link" href="#" class="avatar avatar-with-dot" style="display:inline-flex;align-items:center;justify-content:center; overflow: visible;">
  <img id="other-avatar" src="https://via.placeholder.com/40/000000/FFFFFF?text=U" alt="avatar" style="border-radius: 8px;">
  <span id="other-online-dot" class="online-dot" style="display:none;"></span>
</a>

<div class="meta">
<div id="other-name" class="name">جارٍ التحميل...</div>
<div id="other-username" class="sub small"></div>
</div>
</div>
<div>
</div>
</div>
<div class="glass">
<div id="messages" class="messages">
<div class="small" style="text-align:center">جاري تحميل الرسائل...</div>
</div>
</div>
<form id="sendForm" class="composer" onsubmit="return false;">
<div id="reply-container">
<div id="reply-content" style="display:flex;align-items:center;gap:8px;">
  <div class="reply-block" style="min-width:0;">
    <div id="reply-sender" class="reply-block-sender">...</div>
    <div id="reply-text" class="reply-block-text reply-label">...</div>
  </div>
  <button id="cancel-reply-btn" type="button" title="إلغاء الرد" aria-label="إلغاء الرد">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
  </button>
</div>
</div>

<div id="file-preview" style="display:none;">
    <span class="small" style="flex:1;">تم اختيار ملف</span>
    <button type="button" class="composer-btn btn" id="remove-file-btn" style="width:24px;height:24px;background:red;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
    </button>
</div>

<div class="composer-input-row">

<label for="media-upload" class="file-input-btn" id="attachFileBtn" title="إرفاق ملف">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7v-2h4V7h2v4h4v2h-4v4h-2z"/>
</svg>
</label>
<input type="file" id="media-upload" style="display:none;" accept="image/*,video/*,audio/*">

<textarea id="msgInput" placeholder="اكتب رسالة..." aria-label="اكتب رسالة"></textarea>

<div id="recording-indicator" class="recording-indicator">
    <div class="recording-dot"></div>
    <span>جاري التسجيل... 0:00</span>
</div>

<div id="audio-preview-container">
    <div id="audio-waveform-input"></div>
    <span id="audio-preview-time" class="audio-preview-time">0:00</span>
    <button type="button" class="audio-preview-cancel-btn" title="إلغاء التسجيل">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
</div>


<button id="voiceBtn" class="voice-btn" type="button" title="تسجيل صوت">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path id="voiceIcon" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>
</svg>
</button>

<button id="sendBtn" class="composer-btn" type="submit" title="إرسال" style="display:none;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">

</svg>
</button>
</div>
</form>

<!-- reactions popup element (single shared) -->
<div id="reactionsPopup" class="reactions-popup" style="display:none; position:absolute; pointer-events:none;">
  <button class="reaction-btn" data-reaction="❤" title="قلب">❤</button>
  <button class="reaction-btn" data-reaction="😢" title="حزن">😢</button>
  <button class="reaction-btn" data-reaction="😡" title="غضب">😡</button>
  <button class="reaction-btn" data-reaction="😂" title="ضحك">😂</button>
  <button class="reaction-btn" data-reaction="👍" title="لايك">👍</button>
</div>

</div>
<script>
/*
  Enhanced chat client:
  - Uses SSE for real-time messages & reactions (/api/messages/stream/:contactId)
  - Per-message reactions (counts, my_reaction)
  - Toggle reaction (POST to set, DELETE to remove)
  - Mobile & desktop friendly: touch gestures, long-press reactions, swipe-to-reply
  - Audio playback isolated per message; playing one pauses others; arrival of new messages doesn't stop current audio
*/

function getQuery(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const otherId = getQuery('contactId');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const fileUpload = document.getElementById('media-upload');
const filePreview = document.getElementById('file-preview');
const removeFileBtn = document.getElementById('remove-file-btn');
const sendForm = document.getElementById('sendForm');
const voiceBtn = document.getElementById('voiceBtn');
const voiceIcon = document.getElementById('voiceIcon');
const attachFileBtn = document.getElementById('attachFileBtn');
const recordingIndicator = document.getElementById('recording-indicator');
const recordingTimeEl = recordingIndicator.querySelector('span');
const replyContainer = document.getElementById('reply-container');
const cancelReplyBtn = document.getElementById('cancel-reply-btn');

const audioPreviewContainer = document.getElementById('audio-preview-container');
const audioWaveformInput = document.getElementById('audio-waveform-input');
const audioPreviewTime = document.getElementById('audio-preview-time');
const audioPreviewCancelBtn = audioPreviewContainer.querySelector('.audio-preview-cancel-btn');

const reactionsPopup = document.getElementById('reactionsPopup');

let uploadedFile = null;
let myId = null;
let lastMessages = null;
let replyToMessage = null;
let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;
let recordingTimer = null;
let recordingSeconds = 0;
let inputWaveSurfer = null;
// audioWaveSurfers keyed by source URL (string) => wavesurfer instance
let audioWaveSurfers = {};
// mapping messageId -> audio src (for quick lookup)
let messageAudioSrc = {};

const RECORDING_STATE = { IDLE: 'idle', RECORDING: 'recording', READY_TO_SEND: 'ready' };
let recordingState = RECORDING_STATE.IDLE;

const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

// local fallback storage for reactions when offline
const LOCAL_REACTIONS_KEY = 'chat_local_reactions_v1';
function loadLocalReactions(){ try{ return JSON.parse(localStorage.getItem(LOCAL_REACTIONS_KEY)||'{}'); }catch(e){ return {}; } }
function saveLocalReactions(m){ try{ localStorage.setItem(LOCAL_REACTIONS_KEY, JSON.stringify(m)); }catch(e){} }
let localReactions = loadLocalReactions();

// SSE connection reference
let messagesEventSource = null;

// Helpers
function formatTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    if (date.toDateString() === now.toDateString()) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    return date.toLocaleDateString('ar-EG', { month: 'numeric', day: 'numeric' });
}
function formatAudioTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}
function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/"/g, '&quot;');
}

function mediaTypeLabel(media) {
    if (!media) return 'ملف مرفق';
    const t = (media.type || '').toLowerCase();
    const url = (media.url || '').toLowerCase();
    if (t.includes('audio') || url.match(/\.(webm|mp3|ogg|wav|m4a)$/i)) return 'صوت';
    if (t.includes('image') || url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) return 'صورة';
    if (t.includes('video') || url.match(/\.(mp4|webm|mov|mkv)$/i)) return 'فيديو';
    return 'ملف مرفق';
}

function createReactionBadge(emoji, count) {
    const el = document.createElement('div');
    el.className = 'msg-reaction-badge';
    el.innerHTML = `<span class="emoji">${escapeHtml(emoji)}</span>${count && count>1 ? `<span class="cnt" style="margin-inline-start:6px;font-size:12px;opacity:0.9">${count}</span>` : ''}`;
    return el;
}

function createAudioPlayerHtml(src, isIncoming) {
    return `
        <div class="msg-audio-player" onclick="event.stopPropagation()">
            <button class="audio-play-btn" type="button" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}" data-player>
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="audio-waveform-container" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}"></div>
            <span class="audio-time">0:00</span>
        </div>
    `;
}

// Initialize wavesurfer for a single container element (avoid destroying other players)
function initWaveSurferForContainer(containerEl, src, isIncoming, resumeState) {
    if (!src || audioWaveSurfers[src]) return audioWaveSurfers[src];
    try {
        const ws = WaveSurfer.create({
            container: containerEl,
            waveColor: isIncoming ? '#94a3b8' : '#7dd3fc',
            progressColor: isIncoming ? '#475569' : '#0891b2',
            cursorColor: 'transparent',
            barWidth: 2, height: 30, barGap: 2, barRadius: 2,
        });
        audioWaveSurfers[src] = ws;
        ws.load(src);

        const parent = containerEl.closest('.msg-audio-player');
        const playerBtn = parent ? parent.querySelector('.audio-play-btn') : null;
        const timeEl = parent ? parent.querySelector('.audio-time') : null;

        ws.on('ready', () => {
            if (timeEl) timeEl.textContent = formatAudioTime(ws.getDuration());
            if (resumeState) {
                try { if (resumeState.time) ws.setTime(resumeState.time); if (resumeState.playing) ws.play(); } catch(e){}
            }
        });
        if (playerBtn) {
            playerBtn.onclick = (e) => {
                e.stopPropagation();
                // pause any other playing waves
                Object.keys(audioWaveSurfers).forEach(k => {
                    if (k !== src && audioWaveSurfers[k] && typeof audioWaveSurfers[k].isPlaying==='function' && audioWaveSurfers[k].isPlaying()) {
                        audioWaveSurfers[k].pause();
                    }
                });
                ws.playPause();
            };
        }
        ws.on('play', () => { if (playerBtn) playerBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; });
        ws.on('pause', () => { if (playerBtn) playerBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>`; });
        ws.on('audioprocess', (time) => { if (timeEl) timeEl.textContent = formatAudioTime(time); });
        ws.on('finish', () => { ws.setTime(0); if (timeEl) timeEl.textContent = formatAudioTime(0); });

        return ws;
    } catch (e) {
        console.error('WaveSurfer create error', e);
        return null;
    }
}

// Create message element (returns DOM element). message must include optional fields:
// message.reactions (map userId->emoji), message.reaction_counts (map emoji->count), message.my_reaction
function createMessageElement(msg, myId) {
    const isIncoming = (msg.senderId !== myId);
    const el = document.createElement('div');
    el.className = 'msg ' + (isIncoming ? 'incoming' : 'outgoing');
    el.dataset.messageId = msg.messageId;
    el.dataset.myReaction = msg.my_reaction || '';
    el.title = 'انقر للرد';
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');

    let contentHtml = '';

    if (msg.replied_to_id) {
        const repliedSender = msg.replied_to_sender || 'مستخدم';
        const repliedContent = msg.replied_to_content || 'رسالة محذوفة';
        contentHtml += `
            <div class="reply-block">
                <span class="reply-block-sender">${escapeHtml(repliedSender)}</span>
                <span class="reply-block-text">${escapeHtml(repliedContent)}</span>
            </div>
        `;
    }

    if (msg.media && msg.media.url) {
        const mediaUrl = msg.media.url;
        const mediaType = msg.media.type || 'raw';
        if (mediaType.startsWith('image') || mediaUrl.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
            contentHtml += `<img src="${escapeAttr(mediaUrl)}" class="msg-image" alt="صورة" onload="scrollToBottom()">`;
        } else if (mediaType.startsWith('audio') || mediaUrl.match(/\.(webm|mp3|ogg|wav|m4a)$/i)) {
            contentHtml += createAudioPlayerHtml(mediaUrl, isIncoming);
            // map messageId -> audio src
            messageAudioSrc[msg.messageId] = mediaUrl;
        } else if (mediaType.startsWith('video') || mediaUrl.match(/\.(mp4|webm|mov|mkv)$/i)) {
            contentHtml += `<video src="${escapeAttr(mediaUrl)}" controls class="msg-video" onloadeddata="scrollToBottom()"></video>`;
        } else {
            contentHtml += `<div style="padding:4px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;margin-top:5px;"><a href="${escapeAttr(mediaUrl)}" target="_blank" style="color:var(--accent);text-decoration:none;">📎 ملف مرفق</a></div>`;
        }
    }

    if (msg.content) {
        contentHtml += `<p style="margin:${msg.media ? '6px 0 0 0' : '0'}">${escapeHtml(msg.content)}</p>`;
    }

    const readStatus = !isIncoming && msg.is_read ? '<span style="color:#4ade80">✓✓</span>' : (!isIncoming ? '<span>✓</span>' : '');
    contentHtml += `<div class="meta-time">${formatTime(msg.timestamp)}${readStatus}</div>`;

    el.innerHTML = contentHtml;

    // render reaction badge if present (prefer server counts)
    const reactionCounts = msg.reaction_counts || null;
    const topEmoji = msg.my_reaction || (reactionCounts ? Object.keys(reactionCounts).sort((a,b)=>reactionCounts[b]-reactionCounts[a])[0] : null);
    const topCount = topEmoji && reactionCounts ? reactionCounts[topEmoji] : (msg.my_reaction ? 1 : 0);
    if (topEmoji) {
        const badge = createReactionBadge(topEmoji, topCount);
        el.appendChild(badge);
    }

    // Attach handlers: swipe-to-reply, long-press for reactions, click to reply
    let startX=0, startY=0, moved=false, active=false;
    const threshold = 60;
    function onPointerDown(e){ const p=(e.touches&&e.touches[0])||e; startX=p.clientX; startY=p.clientY; moved=false; active=true; el.classList.add('swipe-active'); }
    function onPointerMove(e){ if(!active) return; const p=(e.touches&&e.touches[0])||e; const dx=p.clientX-startX; const dy=p.clientY-startY; if(Math.abs(dy)>30 && Math.abs(dx)<Math.abs(dy)) return; moved=true; const translate = Math.max(Math.min(dx,150),-150); el.style.transform = `translateX(${translate}px)`; }
    function onPointerUp(e){ if(!active) return; active=false; el.classList.remove('swipe-active'); el.style.transition='transform 180ms ease'; const p=(e.changedTouches&&e.changedTouches[0])||e; const dx=p.clientX-startX; if(dx< -threshold) setReplyTo(msg); requestAnimationFrame(()=> el.style.transform='translateX(0)'); setTimeout(()=> el.style.transition='',200); }

    // long press for reactions
    let longPressTimer=null;
    function startLongPress(ev){ ev.preventDefault && ev.preventDefault(); longPressTimer = setTimeout(()=> showReactionsForMessage(el, msg), 600); }
    function cancelLongPress(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; } }

    el.addEventListener('touchstart', (ev)=>{ onPointerDown(ev); startLongPress(ev); }, { passive:false });
    el.addEventListener('touchmove', (ev)=>{ onPointerMove(ev); cancelLongPress(); }, { passive:true });
    el.addEventListener('touchend', (ev)=>{ onPointerUp(ev); cancelLongPress(); }, { passive:true });
    el.addEventListener('mousedown', (ev)=>{ onPointerDown(ev); startLongPress(ev); });
    el.addEventListener('mousemove', (ev)=>{ onPointerMove(ev); cancelLongPress(); });
    el.addEventListener('mouseup', (ev)=>{ onPointerUp(ev); cancelLongPress(); });
    el.addEventListener('mouseleave', (ev)=>{ onPointerUp(ev); cancelLongPress(); });

    el.addEventListener('click', (ev)=>{ if(moved){ moved=false; return; } setReplyTo(msg); });

    return el;
}

// Voice recording
function startRecording(){
    if (recordingState !== RECORDING_STATE.IDLE) return;
    audioChunks = []; recordingSeconds = 0;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream=>{
        audioStream = stream;
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm; codecs=opus' });
        mediaRecorder.start();
        mediaRecorder.ondataavailable = (e)=> audioChunks.push(e.data);
        recordingState = RECORDING_STATE.RECORDING; updateComposerUI();
        recordingTimer = setInterval(()=>{ recordingSeconds++; recordingTimeEl.textContent = `جاري التسجيل... ${formatAudioTime(recordingSeconds)}`; },1000);
        mediaRecorder.onstop = stopRecording;
    }).catch(err=>{
        alert('تعذر الوصول إلى الميكروفون. تأكد من منح الإذن.');
        recordingState = RECORDING_STATE.IDLE; updateComposerUI();
    });
}
function stopRecording(){
    clearInterval(recordingTimer);
    recordingTimeEl.textContent = `جاري التسجيل... 0:00`;
    if (mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    if (audioStream) { audioStream.getTracks().forEach(t=>t.stop()); audioStream=null; }
    if (audioChunks.length>0){
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        uploadedFile = new File([audioBlob], 'voice_message.webm', { type: 'audio/webm' });
        const audioURL = URL.createObjectURL(audioBlob);
        if (inputWaveSurfer) { try{ inputWaveSurfer.destroy(); }catch(e){} inputWaveSurfer=null; }
        inputWaveSurfer = WaveSurfer.create({ container: audioWaveformInput, waveColor:'#7dd3fc', progressColor:'#06b6d4', cursorColor:'transparent', barWidth:2, height:30, barGap:2, barRadius:2 });
        inputWaveSurfer.load(audioURL);
        inputWaveSurfer.on('ready', ()=> audioPreviewTime.textContent = formatAudioTime(inputWaveSurfer.getDuration()));
        inputWaveSurfer.on('click', ()=> inputWaveSurfer.playPause());
        recordingState = RECORDING_STATE.READY_TO_SEND;
    } else recordingState = RECORDING_STATE.IDLE;
    updateComposerUI();
}

function removeFile(){ if (inputWaveSurfer){ try{ inputWaveSurfer.destroy(); }catch(e){} inputWaveSurfer=null; } uploadedFile=null; audioChunks=[]; recordingState=RECORDING_STATE.IDLE; fileUpload.value=''; filePreview.innerHTML=''; updateComposerUI(); }

// initialize audio player for message (uses initWaveSurferForContainer)
function initializeAudioForMessageElement(msgEl, resumeStates){
    const container = msgEl.querySelector('.audio-waveform-container');
    if (!container) return;
    const src = container.dataset.src;
    const isIncoming = container.dataset.isIncoming === 'true';
    // only create wavesurfer for this src if not already existing
    if (audioWaveSurfers[src]) {
        // if existing instance was created targeting another container we might need to re-attach — WaveSurfer supports a single container, so skip re-creation.
        return;
    }
    initWaveSurferForContainer(container, src, isIncoming, resumeStates && resumeStates[src]);
}

// SSE handling: connect, handle snapshot and incremental events
function connectMessagesSSE(){
    if(!otherId) return;
    if (messagesEventSource) { try{ messagesEventSource.close(); }catch(e){} messagesEventSource=null; }

    const url = `/api/messages/stream/${encodeURIComponent(otherId)}`;
    messagesEventSource = new EventSource(url);

    messagesEventSource.addEventListener('messages_snapshot', (e)=>{
        try {
            const payload = JSON.parse(e.data); // array of messages
            // preserve current playing states
            const preserve = {};
            Object.keys(audioWaveSurfers).forEach(src=>{
                try { preserve[src] = { time: audioWaveSurfers[src].getCurrentTime?audioWaveSurfers[src].getCurrentTime():0, playing: audioWaveSurfers[src].isPlaying?audioWaveSurfers[src].isPlaying():false }; } catch(e){ preserve[src] = { time:0, playing:false }; }
            });
            messagesEl.innerHTML = '';
            for (const m of payload) {
                const el = createMessageElement(m, myId);
                messagesEl.appendChild(el);
            }
            // initialize audio only for each message individually and resume states
            document.querySelectorAll('.audio-waveform-container').forEach(container => {
                const src = container.dataset.src;
                initializeAudioForMessageElement(container.closest('.msg'), preserve);
            });
            scrollToBottom();
        } catch (err) { console.error('messages_snapshot parse', err); }
    });

    messagesEventSource.addEventListener('message_added', (e)=>{
        try {
            const m = JSON.parse(e.data);
            // append only if not already present
            if (document.querySelector(`.msg[data-message-id="${m.messageId}"]`)) return;
            const el = createMessageElement(m, myId);
            messagesEl.appendChild(el);
            // init audio for this element only
            initializeAudioForMessageElement(el);
            scrollToBottom();
        } catch (err) { console.error('message_added parse', err); }
    });

    messagesEventSource.addEventListener('message_changed', (e)=>{
        try {
            const m = JSON.parse(e.data);
            const existing = document.querySelector(`.msg[data-message-id="${m.messageId}"]`);
            if (existing) {
                // preserve scroll position approx & audio state for this message
                const audioContainer = existing.querySelector('.audio-waveform-container');
                const src = audioContainer ? audioContainer.dataset.src : null;
                const resume = {};
                if (src && audioWaveSurfers[src]) {
                    try { resume[src] = { time: audioWaveSurfers[src].getCurrentTime?audioWaveSurfers[src].getCurrentTime():0, playing: audioWaveSurfers[src].isPlaying?audioWaveSurfers[src].isPlaying():false }; } catch(e){}
                    // destroy previous wavesurfer for this src to re-create with new container if needed
                    try { audioWaveSurfers[src].destroy(); delete audioWaveSurfers[src]; } catch(e){}
                }
                const newEl = createMessageElement(m, myId);
                existing.replaceWith(newEl);
                initializeAudioForMessageElement(newEl, resume);
            } else {
                // if not present, append
                const el = createMessageElement(m, myId);
                messagesEl.appendChild(el);
                initializeAudioForMessageElement(el);
            }
        } catch (err) { console.error('message_changed parse', err); }
    });

    messagesEventSource.addEventListener('message_removed', (e)=>{
        try {
            const payload = JSON.parse(e.data); // { messageId }
            const existing = document.querySelector(`.msg[data-message-id="${payload.messageId}"]`);
            if (existing) existing.remove();
        } catch (err) { console.error('message_removed parse', err); }
    });

    // reaction updates
    messagesEventSource.addEventListener('reaction_updated', (e)=>{
        try {
            const payload = JSON.parse(e.data); // { messageId, reactions (map), reaction_counts (map), my_reaction }
            const existing = document.querySelector(`.msg[data-message-id="${payload.messageId}"]`);
            if (!existing) return;
            existing.dataset.myReaction = payload.my_reaction || '';
            const prevBadge = existing.querySelector('.msg-reaction-badge');
            if (payload.reaction_counts && Object.keys(payload.reaction_counts).length>0) {
                // show top reaction and its count
                const topEmoji = Object.keys(payload.reaction_counts).sort((a,b)=>payload.reaction_counts[b]-payload.reaction_counts[a])[0];
                const topCount = payload.reaction_counts[topEmoji];
                if (prevBadge) prevBadge.remove();
                existing.appendChild(createReactionBadge(topEmoji, topCount));
            } else {
                if (prevBadge) prevBadge.remove();
            }
        } catch (err) { console.error('reaction_updated parse', err); }
    });

    messagesEventSource.addEventListener('error', (err)=>{
        console.warn('Messages SSE error', err);
        // attempt reconnect with exponential backoff handled by browser automatically in EventSource
    });
}

// show reactions popup and handle toggle/post/delete
function showReactionsForMessage(msgEl, msg) {
    // position popup
    const rect = msgEl.getBoundingClientRect();
    const popup = reactionsPopup;
    popup.style.display='flex';
    popup.classList.add('show');
    popup.style.pointerEvents='auto';
    const popupWidth = (popup.offsetWidth || 220);
    const top = window.scrollY + rect.top - (popup.offsetHeight || 48) - 10;
    const left = window.scrollX + rect.left + (rect.width/2) - (popupWidth/2);
    popup.style.top = `${top}px`;
    popup.style.left = `${left}px`;

    const buttons = popup.querySelectorAll('.reaction-btn');
    const currentMyReaction = msgEl.dataset.myReaction || '';

    buttons.forEach(b=>{
        b.onclick = async (ev)=>{
            ev.stopPropagation();
            const emoji = b.dataset.reaction || b.textContent;
            // Toggle: if currentMyReaction === emoji => DELETE, else POST
            const wasSame = currentMyReaction === emoji;
            try {
                if (wasSame) {
                    await fetch(`/api/messages/${encodeURIComponent(msg.messageId)}/reaction`, {
                        method: 'DELETE',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contactId: otherId })
                    });
                    // optimistic UI removal
                    msgEl.dataset.myReaction = '';
                    const prev = msgEl.querySelector('.msg-reaction-badge'); if (prev) prev.remove();
                } else {
                    await fetch(`/api/messages/${encodeURIComponent(msg.messageId)}/reaction`, {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contactId: otherId, reaction: emoji })
                    });
                    // optimistic UI add
                    msgEl.dataset.myReaction = emoji;
                    const prev = msgEl.querySelector('.msg-reaction-badge'); if (prev) prev.remove();
                    msgEl.appendChild(createReactionBadge(emoji, 1));
                }
            } catch (err) {
                // fallback to local storage
                if (wasSame) { delete localReactions[msg.messageId]; saveLocalReactions(localReactions); const prev = msgEl.querySelector('.msg-reaction-badge'); if (prev) prev.remove(); }
                else { localReactions[msg.messageId] = emoji; saveLocalReactions(localReactions); const prev = msgEl.querySelector('.msg-reaction-badge'); if (prev) prev.remove(); msgEl.appendChild(createReactionBadge(emoji,1)); }
            } finally {
                hideReactionsPopup();
            }
        };
    });

    setTimeout(()=> {
        window.addEventListener('scroll', hideReactionsPopupOnce, { passive:true });
        document.addEventListener('click', hideReactionsPopupOnce);
        document.addEventListener('touchstart', hideReactionsPopupOnce, { passive:true });
    },50);
}
function hideReactionsPopup(){ const popup = reactionsPopup; popup.classList.remove('show'); popup.style.display='none'; popup.style.pointerEvents='none'; window.removeEventListener('scroll', hideReactionsPopupOnce); document.removeEventListener('click', hideReactionsPopupOnce); document.removeEventListener('touchstart', hideReactionsPopupOnce); }
function hideReactionsPopupOnce(){ hideReactionsPopup(); }

// sendMessage implementation
async function sendMessage(){
    let content = msgInput.value.trim();
    if (!content && !uploadedFile) return;
    sendBtn.disabled = true;
    const orig = sendBtn.innerHTML;
    sendBtn.innerHTML = '<div class="spin" style="width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></div>';

    const form = new FormData();
    form.append('other_id', otherId);
    if (content) form.append('content', content);
    if (uploadedFile) form.append('media', uploadedFile, uploadedFile.name);
    if (replyToMessage) {
        form.append('replied_to_id', replyToMessage.id);
        form.append('replied_to_content', replyToMessage.content);
        form.append('replied_to_sender', replyToMessage.senderName);
    }

    try {
        const res = await fetch('/api/messages/send', { method:'POST', credentials:'same-origin', body: form });
        const data = await res.json();
        if (res.ok && data.ok && data.messageData) {
            // The message will be delivered via SSE 'message_added' event; but we can optimistically append
            const el = createMessageElement(data.messageData, myId);
            messagesEl.appendChild(el);
            initializeAudioForMessageElement(el);
            msgInput.value=''; removeFile(); clearReplyTo(); scrollToBottom();
        } else {
            alert('فشل الإرسال: ' + (data.error || 'خطأ غير معروف'));
        }
    } catch (err) {
        alert('خطأ في الاتصال بالخادم. تأكد من أن الخادم يعمل.');
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = orig;
        updateComposerUI();
    }
}

// File attach handlers
removeFileBtn.addEventListener('click', ()=>{ uploadedFile=null; fileUpload.value=''; updateComposerUI(); });
fileUpload.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if (file) {
        removeFile();
        uploadedFile = file;
        const reader = new FileReader();
        reader.onload = (e)=>{
            let preview;
            if (file.type.startsWith('image/')) { preview = document.createElement('img'); preview.src = e.target.result; preview.style.maxHeight='40px'; preview.style.borderRadius='4px'; }
            else if (file.type.startsWith('video/')) { preview = document.createElement('video'); preview.src = e.target.result; preview.controls=true; preview.style.maxHeight='40px'; preview.style.borderRadius='4px'; }
            else if (file.type.startsWith('audio/')) { preview = document.createElement('audio'); preview.src = e.target.result; preview.controls=true; }
            else { preview = document.createElement('span'); preview.textContent = file.name; }
            filePreview.innerHTML=''; filePreview.appendChild(preview);
            const rm = document.createElement('button'); rm.className='composer-btn btn'; rm.style.cssText='width:24px;height:24px;background:#ef4444;margin-right:auto;'; rm.innerHTML='×'; rm.onclick=()=>{ removeFile(); updateComposerUI(); }; filePreview.appendChild(rm);
            updateComposerUI();
        };
        reader.readAsDataURL(file);
    } else removeFileBtn.onclick();
});

sendForm.addEventListener('submit', (e)=>{ e.preventDefault(); sendMessage(); });
msgInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });

// Initialize: fetch profile, connect SSE
(async function init(){
    if (!otherId) { window.location.href = '/chat_list'; return; }
    await fetchOtherProfile();
    connectMessagesSSE();
    updateComposerUI();
    // mark read on focus/visibility
    setInterval(()=>{ if (document.visibilityState === 'visible') markRead(); }, 3000);
    window.addEventListener('focus', markRead);
})();

/* Notifications SSE badge (kept as previously) */
(function setupNotifSSEChat(){
  if(!window.EventSource) return;
  try {
    const es = new EventSource('/api/notifications/stream', { withCredentials: true });
    es.addEventListener('notifications',(e)=>{
      try{
        const payload = JSON.parse(e.data);
        const unread = payload.unread_count||0;
        const badge = document.getElementById('notifBadgeChat');
        if(badge){
          if(unread>0){ badge.style.display='inline-flex'; badge.textContent = unread>99 ? '99+' : String(unread); }
          else badge.style.display='none';
        }
      } catch(err){ console.error('SSE parse error', err); }
    });
    es.addEventListener('error', (err)=>{ console.warn('Notifications SSE error', err); });
  } catch(e){}
})();
(function initUnreadChat(){ fetch('/api/notifications/unread_count', { credentials: 'same-origin' }).then(r=>r.ok? r.json():null).then(d=>{ if(d&&d.ok){ const b=document.getElementById('notifBadgeChat'); if(b){ if(d.unread_count>0){ b.style.display='inline-flex'; b.textContent=d.unread_count>99?'99+':String(d.unread_count); }}}}).catch(()=>{}); })();
</script>
