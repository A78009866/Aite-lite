<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  /* ألوانك الأصلية */
  --bg: #000;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --accent: #7dd3fc;
  --muted: #cbd5e1;
  --reply-bg: rgba(255, 255, 255, 0.08);
  --reply-border: rgba(255, 255, 255, 0.15);
  
  /* ألوان الرسائل الأصلية */
  --msg-incoming-bg: rgba(255, 255, 255, 0.05);
  --msg-incoming-border: rgba(255, 255, 255, 0.08);
  --msg-outgoing-bg: rgba(10, 100, 150, 0.3);
  --msg-outgoing-border: rgba(255, 255, 255, 0.03);
  --msg-outgoing-text: #e6f7ff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--muted);
  overflow: hidden; 
  touch-action: pan-y;
}

.wrap {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 980px; /* العودة للحجم الأصلي */
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

/* --- Header (بنفس ستايلك القديم) --- */
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  background: var(--bg);
  z-index: 50;
  border-bottom: 1px solid var(--glass-border);
  height: 50px;
  flex-shrink: 0;
}

.user-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}

.avatar-with-dot {
  position: relative;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 8px; /* حواف مربعة قليلاً كما في تصميمك */
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: linear-gradient(135deg, #0b3146, #063048);
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 8px;
  object-fit: cover;
  display: block;
}

.online-dot {
  position: absolute;
  bottom: -2px;
  left: -2px;
  width: 10px;
  height: 10px;
  background: #22c55e;
  border: 2px solid #000;
  border-radius: 50%;
}

.meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  justify-content: center;
  overflow: hidden;
}

.meta .name {
  font-weight: 700;
  color: #e6f0fb;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 4px;
}

.meta .sub {
  font-size: 10px;
  color: #8aa5bd;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.back-btn {
  color: var(--muted);
  font-size: 16px;
  padding: 8px;
  cursor: pointer;
  text-decoration: none;
}

/* --- Messages Area --- */
.glass {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  padding-bottom: 90px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0; 
  transition: opacity 0.2s ease;
}

/* --- Message Bubbles (ستايلك الأصلي) --- */
.msg-container {
  display: flex;
  width: 100%;
  position: relative;
  margin-bottom: 2px;
  touch-action: pan-y; 
}

.msg-wrapper {
  position: relative;
  max-width: 80%;
  z-index: 2;
  transition: transform 0.1s linear; 
  will-change: transform;
}

.msg {
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.3;
  word-break: break-word;
  position: relative;
}

/* Incoming Styles (Original) */
.incoming-container { justify-content: flex-start; }
.incoming-container .msg {
  background: var(--msg-incoming-bg);
  border: 1px solid var(--msg-incoming-border);
  color: var(--muted);
}

/* Outgoing Styles (Original) */
.outgoing-container { justify-content: flex-end; }
.outgoing-container .msg {
  background: var(--msg-outgoing-bg);
  border: 1px solid var(--msg-outgoing-border);
  color: var(--msg-outgoing-text);
}

/* Reply Indicator Icon */
.reply-indicator-icon {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 30px;
  height: 30px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 1;
}

/* Media Styles */
.msg-image, .msg-video {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  margin-top: 6px;
  display: block;
}

/* Audio Player (Original Style) */
.msg-audio-player {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 220px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 6px;
  margin-top: 4px;
}
.incoming-container .msg-audio-player {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.audio-play-btn {
  background: #e6f7ff;
  color: #0369a1;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.incoming-container .audio-play-btn {
  background: var(--muted);
  color: var(--bg);
}

.audio-waveform-container { flex: 1; height: 30px; }
.audio-time { font-size: 11px; color: rgba(255,255,255,0.7); min-width: 25px; }

/* Reply Context Inside Message */
.reply-context {
  background: rgba(255, 255, 255, 0.08);
  border-right: 3px solid var(--accent);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 6px;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.incoming-container .reply-context {
  border-right-color: #cbd5e1;
}

.reply-context-sender { font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.incoming-container .reply-context-sender { color: #cbd5e1; }
.reply-context-text { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Metadata */
.msg-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 4px;
  font-size: 10px;
  color: #9fb3c8;
}

/* --- Composer Area (Original Style) --- */
.composer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: var(--bg);
  border-top: 1px solid var(--glass-border);
  padding: 6px 10px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 0;
  box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
}

/* Reply Preview Panel */
#reply-container {
  display: none;
  align-items: center;
  justify-content: space-between;
  background: var(--reply-bg);
  border: 1px solid var(--reply-border);
  padding: 6px 12px;
  border-radius: 12px;
  margin-bottom: 8px;
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.reply-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex: 1;
}
.reply-to-label { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
.reply-preview-text { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* زر الإغلاق */
.close-reply-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  cursor: pointer;
  margin-right: 10px;
  transition: all 0.2s;
}
.close-reply-btn:hover { background: rgba(239, 68, 68, 0.4); color: #fff; border-color: transparent; }

/* Input Row */
.input-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}

.action-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  cursor: pointer;
  flex-shrink: 0;
}
.action-btn:active { background: rgba(255,255,255,0.1); }

textarea {
  flex: 1;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  padding: 8px 12px;
  color: var(--muted);
  font-family: inherit;
  font-size: 16px;
  resize: none;
  min-height: 36px;
  max-height: 100px;
  outline: none;
  line-height: 1.3;
}
textarea:focus { border-color: var(--accent); }

.send-btn {
  background: linear-gradient(180deg, #06b6d4, #0891b2);
  color: #012;
  border: none;
}
.send-btn:disabled { background: #444; color: #888; }

.recording-active { 
  background: rgba(185, 28, 28, 0.4); 
  border-color: rgba(239, 68, 68, 0.5); 
  color: #fca5a5; 
  animation: pulse 1.5s infinite; 
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

/* Recording UI */
#recording-ui {
  display: none;
  flex: 1;
  align-items: center;
  gap: 10px;
  background: rgba(185, 28, 28, 0.2);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 18px;
  padding: 0 15px;
  height: 36px;
}
.rec-dot { width: 8px; height: 8px; background: #ff6b6b; border-radius: 50%; animation: pulse 1s infinite; }
.rec-time { font-size: 12px; color: #fca5a5; flex: 1; }
.cancel-rec { color: #fca5a5; cursor: pointer; font-size: 12px; font-weight: 600; }

/* File Preview */
#file-preview-area {
  display: none;
  padding: 6px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  margin-bottom: 8px;
  align-items: center;
  gap: 8px;
}
.file-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a href="/chat_list" class="back-btn"><i class="fas fa-chevron-right"></i></a>
    <a id="profile-link" href="#" class="user-row">
      <div class="avatar-with-dot">
        <img id="header-avatar" src="https://via.placeholder.com/40" class="avatar">
        <div id="header-online" class="online-dot" style="display:none"></div>
      </div>
      <div class="meta">
        <div id="header-name" class="name">...</div>
        <div id="header-status" class="sub"></div>
      </div>
    </a>
  </div>

  <div class="glass">
    <div id="messages" class="messages">
      </div>
  </div>

  <form id="composer" class="composer" onsubmit="return false;">
    
    <div id="reply-container">
      <div class="reply-info">
        <div class="reply-to-label">الرد على <span id="reply-to-name"></span></div>
        <div id="reply-to-text" class="reply-preview-text"></div>
      </div>
      <button type="button" class="close-reply-btn" id="cancel-reply">
        <i class="fas fa-times" style="font-size:12px"></i>
      </button>
    </div>

    <div id="file-preview-area">
      <div id="file-preview-content" style="flex:1; display:flex; align-items:center; gap:8px; font-size:12px; color:#fff;"></div>
      <button type="button" class="close-reply-btn" id="cancel-file" style="width:20px;height:20px;margin:0;background:#ef4444;border:none;color:#fff;">
        <i class="fas fa-times" style="font-size:10px"></i>
      </button>
    </div>

    <div class="input-row">
      <input type="file" id="media-input" style="display:none" accept="image/*,video/*,audio/*">
      
      <button type="button" class="action-btn" id="attach-btn">
        <i class="fas fa-paperclip" style="font-size:14px"></i>
      </button>

      <div id="recording-ui">
        <div class="rec-dot"></div>
        <div class="rec-time" id="rec-timer">0:00</div>
        <div class="cancel-rec" id="cancel-rec-btn">إلغاء</div>
      </div>

      <textarea id="msg-input" placeholder="اكتب رسالة..." rows="1"></textarea>
      
      <button type="button" class="action-btn" id="mic-btn">
        <i class="fas fa-microphone" style="font-size:14px"></i>
      </button>

      <button type="submit" class="action-btn send-btn" id="send-btn" style="display:none">
        <i class="fas fa-paper-plane" style="font-size:14px"></i>
      </button>
    </div>
  </form>
</div>

<script>
// --- Configuration & State ---
const urlParams = new URLSearchParams(window.location.search);
const otherId = urlParams.get('contactId');
let myId = null;
let lastMessagesHash = ''; 
let replyData = null; // { id, sender, content }
let uploadedFile = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let recTimerInterval = null;
let audioWaveSurfers = {};

// DOM Elements
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const attachBtn = document.getElementById('attach-btn');
const mediaInput = document.getElementById('media-input');
const replyContainer = document.getElementById('reply-container');
const recordingUi = document.getElementById('recording-ui');
const filePreviewArea = document.getElementById('file-preview-area');

// Verified Badge Icon
const VERIFIED_ICON = `<img src="https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png" style="width:14px;height:14px;margin-right:4px;vertical-align:middle;">`;

// --- Initialization ---
async function init() {
  if (!otherId) return window.location.href = '/chat_list';
  
  // 1. Fetch My Profile
  try {
    const myRes = await fetch('/api/profile');
    const myData = await myRes.json();
    myId = myData.id;
  } catch(e) { console.error(e); }

  // 2. Fetch Other Profile
  fetchProfile();

  // 3. Initial Messages Load
  await loadMessages(true); 

  // 4. Poll
  setInterval(() => loadMessages(false), 3000);
  
  // 5. Input Auto-Resize
  msgInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    toggleSendButton();
  });
}

// --- Fetch Profile Info ---
async function fetchProfile() {
  try {
    const res = await fetch(`/api/profile/${otherId}`);
    const data = await res.json();
    if(data) {
      document.getElementById('header-name').innerHTML = escapeHtml(data.full_name || data.username) + (data.is_verified ? VERIFIED_ICON : '');
      document.getElementById('header-avatar').src = data.profile_picture_url || 'https://via.placeholder.com/40';
      document.getElementById('profile-link').href = `/profile?userId=${otherId}`;
      
      const statusEl = document.getElementById('header-status');
      if(data.is_online) {
        document.getElementById('header-online').style.display = 'block';
        statusEl.textContent = 'متصل الآن';
        statusEl.style.color = '#22c55e';
      } else {
         statusEl.textContent = 'غير متصل';
         statusEl.style.color = '#8aa5bd';
      }
    }
  } catch(e) {}
}

// --- Messages Logic ---
async function loadMessages(initial = false) {
  try {
    const res = await fetch(`/api/messages/${otherId}?limit=50`);
    const data = await res.json();
    if(!data.ok) return;

    const newHash = JSON.stringify(data.messages.map(m => m.messageId));
    if (newHash === lastMessagesHash) return; 
    lastMessagesHash = newHash;

    const isAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 50;

    messagesEl.innerHTML = ''; 
    
    data.messages.forEach(msg => {
      messagesEl.appendChild(createMsgElement(msg));
    });

    if (initial) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      requestAnimationFrame(() => { messagesEl.style.opacity = '1'; });
      markRead();
    } else if (isAtBottom) {
      scrollToBottom();
      markRead();
    }
  } catch(e) { console.error(e); }
}

function scrollToBottom() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

async function markRead() {
  await fetch('/api/mark_read', {
    method: 'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({other_id: otherId})
  });
}

// --- Message Element Creator ---
function createMsgElement(msg) {
  const isMe = msg.senderId === myId;
  const wrapper = document.createElement('div');
  wrapper.className = `msg-container ${isMe ? 'outgoing-container' : 'incoming-container'}`;

  // Reply Indicator Icon
  const icon = document.createElement('div');
  icon.className = 'reply-indicator-icon';
  icon.innerHTML = '<i class="fas fa-reply"></i>';
  if (isMe) icon.style.left = '10px'; else icon.style.right = '10px';
  wrapper.appendChild(icon);

  const inner = document.createElement('div');
  inner.className = 'msg-wrapper';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg';
  
  // Reply Context
  if (msg.replied_to_id) {
    const ctx = document.createElement('div');
    ctx.className = 'reply-context';
    ctx.innerHTML = `
      <div class="reply-context-sender">${escapeHtml(msg.replied_to_sender || 'مستخدم')}</div>
      <div class="reply-context-text">${getLocalizedType(msg.replied_to_content)}</div>
    `;
    ctx.onclick = (e) => {
        e.stopPropagation();
        const original = document.querySelector(`[data-msg-id="${msg.replied_to_id}"]`);
        if(original) original.scrollIntoView({behavior:'smooth', block:'center'});
    };
    bubble.appendChild(ctx);
  }

  // Content
  let contentHtml = '';
  if (msg.media) {
    const url = msg.media.url;
    const type = msg.media.type || '';
    if (type.startsWith('image')) contentHtml += `<img src="${url}" class="msg-image" onload="scrollToBottom()">`;
    else if (type.startsWith('video')) contentHtml += `<video src="${url}" controls class="msg-video"></video>`;
    else if (type.startsWith('audio') || url.endsWith('.webm') || url.endsWith('.mp3')) {
       const audioId = 'audio-' + msg.messageId;
       contentHtml += `
         <div class="msg-audio-player">
           <button class="audio-play-btn" onclick="playAudio('${url}', '${audioId}', this)">
             <i class="fas fa-play" style="font-size:12px"></i>
           </button>
           <div id="${audioId}" class="audio-waveform-container"></div>
           <div class="audio-time">...</div>
         </div>
       `;
       setTimeout(() => initWaveform(audioId, url, isMe), 100);
    }
  }
  if (msg.content) {
    contentHtml += `<div style="margin-top:${msg.media?'6px':'0'}">${escapeHtml(msg.content)}</div>`;
  }
  
  // Meta
  const time = new Date(msg.timestamp).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  const check = isMe ? (msg.is_read ? '<i class="fas fa-check-double" style="color:#6ee7b7"></i>' : '<i class="fas fa-check"></i>') : '';
  contentHtml += `<div class="msg-meta">${time} ${check}</div>`;

  bubble.innerHTML += contentHtml;
  inner.appendChild(bubble);
  wrapper.appendChild(inner);

  // --- SWIPE TO REPLY ---
  enableSwipeToReply(wrapper, inner, icon, msg);

  wrapper.setAttribute('data-msg-id', msg.messageId);
  return wrapper;
}

// --- Swipe Logic ---
function enableSwipeToReply(container, contentEl, iconEl, msg) {
  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  const threshold = 60; 

  contentEl.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isDragging = true;
    contentEl.style.transition = 'none';
  }, {passive: true});

  contentEl.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const x = e.touches[0].clientX;
    const diff = x - startX;
    const isMe = msg.senderId === myId;
    let allowed = false;
    
    // سحب للرد (اتجاه معاكس لمكان الرسالة)
    if (!isMe && diff < 0) allowed = true; // واردة (يمين) -> اسحب يسار
    if (isMe && diff > 0) allowed = true;  // صادرة (يسار) -> اسحب يمين

    if (allowed && Math.abs(diff) < 150) {
      currentX = diff;
      contentEl.style.transform = `translateX(${diff}px)`;
      const progress = Math.min(Math.abs(diff) / threshold, 1);
      iconEl.style.transform = `translateY(-50%) scale(${progress})`;
      iconEl.style.opacity = progress;
    }
  }, {passive: true});

  contentEl.addEventListener('touchend', () => {
    isDragging = false;
    contentEl.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    contentEl.style.transform = 'translateX(0)';
    iconEl.style.transform = 'translateY(-50%) scale(0)';
    
    if (Math.abs(currentX) > threshold) {
      triggerReply(msg);
      if(navigator.vibrate) navigator.vibrate(10);
    }
    currentX = 0;
  });
}

function triggerReply(msg) {
  const isMe = msg.senderId === myId;
  const senderName = isMe ? 'أنت' : document.getElementById('header-name').textContent;
  
  let previewText = msg.content;
  if (!previewText && msg.media) {
    if (msg.media.type.startsWith('image')) previewText = '📷 صورة';
    else if (msg.media.type.startsWith('video')) previewText = '🎥 فيديو';
    else if (msg.media.type.startsWith('audio') || msg.media.url.endsWith('.webm')) previewText = '🎤 تسجيل صوتي';
    else previewText = '📎 ملف مرفق';
  }

  replyData = {
    id: msg.messageId,
    sender: senderName,
    content: previewText
  };

  document.getElementById('reply-to-name').textContent = senderName;
  document.getElementById('reply-to-text').textContent = previewText;
  replyContainer.style.display = 'flex';
  msgInput.focus();
}

document.getElementById('cancel-reply').onclick = () => {
  replyData = null;
  replyContainer.style.display = 'none';
};

// --- Helper Functions ---
function getLocalizedType(content) {
  if (!content) return '';
  if (['📷 صورة', '🎥 فيديو', '🎤 تسجيل صوتي'].includes(content)) return content;
  if (content.match(/cloudinary.*image/)) return '📷 صورة';
  return content;
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function initWaveform(containerId, url, isMe) {
  const container = document.getElementById(containerId);
  if (!container || audioWaveSurfers[containerId]) return;

  const ws = WaveSurfer.create({
    container: container,
    waveColor: isMe ? '#ffffff80' : '#7dd3fc',
    progressColor: isMe ? '#ffffff' : '#0ea5e9',
    cursorColor: 'transparent',
    barWidth: 2, barRadius: 2, height: 24,
    responsive: true,
    url: url
  });
  
  ws.on('ready', () => {
    const timeEl = container.parentElement.querySelector('.audio-time');
    timeEl.textContent = fmtTime(ws.getDuration());
  });
  audioWaveSurfers[containerId] = ws;
}

function playAudio(url, id, btn) {
  const ws = audioWaveSurfers[id];
  if(!ws) return;
  ws.playPause();
  ws.on('play', () => btn.innerHTML = '<i class="fas fa-pause" style="font-size:12px"></i>');
  ws.on('pause', () => btn.innerHTML = '<i class="fas fa-play" style="font-size:12px"></i>');
  ws.on('finish', () => btn.innerHTML = '<i class="fas fa-play" style="font-size:12px"></i>');
}

function fmtTime(s) {
  const m = Math.floor(s/60);
  const sc = Math.floor(s%60);
  return `${m}:${sc<10?'0':''}${sc}`;
}

// --- Inputs & Recording ---
attachBtn.onclick = () => mediaInput.click();
mediaInput.onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    uploadedFile = file;
    let html = '';
    if(file.type.startsWith('image')) html = `<img src="${URL.createObjectURL(file)}" class="file-thumb">`;
    else html = `<i class="fas fa-file fa-lg text-gray-400"></i>`;
    html += `<span>${file.name}</span>`;
    document.getElementById('file-preview-content').innerHTML = html;
    filePreviewArea.style.display = 'flex';
    toggleSendButton();
  }
};
document.getElementById('cancel-file').onclick = () => {
  uploadedFile = null;
  mediaInput.value = '';
  filePreviewArea.style.display = 'none';
  toggleSendButton();
};

micBtn.onclick = () => { if (isRecording) stopRecording(); else startRecording(); };
document.getElementById('cancel-rec-btn').onclick = cancelRecording;

function startRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.start();
    isRecording = true;
    
    msgInput.style.display = 'none';
    micBtn.style.display = 'none';
    attachBtn.style.display = 'none';
    recordingUi.style.display = 'flex';
    
    let sec = 0;
    recTimerInterval = setInterval(() => {
      sec++;
      document.getElementById('rec-timer').textContent = fmtTime(sec);
    }, 1000);

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
       const blob = new Blob(audioChunks, { type: 'audio/webm' });
       uploadedFile = new File([blob], "voice.webm", { type: 'audio/webm' });
       document.getElementById('file-preview-content').innerHTML = 
         `<i class="fas fa-microphone fa-lg" style="color:#fca5a5"></i> <span>تسجيل صوتي (${document.getElementById('rec-timer').textContent})</span>`;
       filePreviewArea.style.display = 'flex';
       resetRecordingUI();
       toggleSendButton();
    };
  }).catch(e => alert('Mic error'));
}

function stopRecording() { if(mediaRecorder) mediaRecorder.stop(); }
function cancelRecording() {
  if(mediaRecorder) { mediaRecorder.stop(); uploadedFile = null; audioChunks = []; }
  resetRecordingUI();
}
function resetRecordingUI() {
  clearInterval(recTimerInterval);
  isRecording = false;
  document.getElementById('rec-timer').textContent = '0:00';
  recordingUi.style.display = 'none';
  msgInput.style.display = 'block';
  micBtn.style.display = 'flex';
  attachBtn.style.display = 'flex';
}

function toggleSendButton() {
  const hasContent = msgInput.value.trim().length > 0 || uploadedFile;
  sendBtn.style.display = hasContent ? 'flex' : 'none';
  micBtn.style.display = hasContent ? 'none' : 'flex';
}

// --- Sending ---
sendBtn.onclick = async () => {
  if(sendBtn.disabled) return;
  const content = msgInput.value.trim();
  if(!content && !uploadedFile) return;

  sendBtn.disabled = true;
  const fd = new FormData();
  fd.append('other_id', otherId);
  if(content) fd.append('content', content);
  if(uploadedFile) fd.append('media', uploadedFile);
  if(replyData) {
    fd.append('replied_to_id', replyData.id);
    fd.append('replied_to_sender', replyData.sender);
    fd.append('replied_to_content', replyData.content);
  }

  try {
    const res = await fetch('/api/messages/send', { method:'POST', body:fd });
    const d = await res.json();
    if(d.ok) {
      messagesEl.appendChild(createMsgElement(d.messageData));
      scrollToBottom();
      msgInput.value = '';
      msgInput.style.height = '36px';
      uploadedFile = null;
      filePreviewArea.style.display = 'none';
      replyData = null;
      replyContainer.style.display = 'none';
      toggleSendButton();
    }
  } catch(e) { alert('Error sending'); }
  sendBtn.disabled = false;
};

init();
</script>
