<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المحادثة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
--bg: #000;
--glass-bg: rgba(255, 255, 255, 0.05);
--glass-border: rgba(255, 255, 255, 0.1);
--accent: #7dd3fc;
--muted: #cbd5e1;
--reply-bg: rgba(255, 255, 255, 0.08);
--reply-border: rgba(255, 255, 255, 0.15);
--reply-block-bg: rgba(255, 255, 255, 0.08);
--reply-block-border: rgba(255, 255, 255, 0.15);
}
html, body {
height: 100%;
margin: 0;
font-family: 'Inter', system-ui;
background-color: var(--bg);
color: var(--muted);
-webkit-font-smoothing: antialiased;
direction: rtl;
/* منع الزوم بالسحب */
touch-action: pan-x pan-y;
}
.wrap {
/* استخدام 100dvh لضمان التوافق مع متصفحات الموبايل */
height: 100dvh;
display: flex;
flex-direction: column;
max-width: 980px;
margin: 0 auto;
padding: 0;
position: relative;
}
.top {
display: flex;
align-items: center;
gap: 6px;
justify-content: space-between;
padding: 6px 10px;
background: var(--bg);
z-index: 200;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
flex-shrink: 0;
height: 50px; 
}
.user-row {
display: flex;
align-items: center;
gap: 6px;
flex: 1;
min-width: 0;
}
.avatar {
width: 36px;
height: 36px;
border-radius: 8px;
overflow: hidden;
border: 1px solid rgba(255, 255, 255, 0.06);
background: linear-gradient(135deg, #0b3146, #063048);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.meta {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
}
.meta .name {
font-weight: 700;
color: #e6f0fb;
font-size: 13px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.meta .sub {
font-size: 10px;
color: #8aa5bd;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.glass {
flex: 1;
display: flex;
flex-direction: column;
background: transparent;
border: none;
overflow: hidden; /* لمنع تمدد الحاوية */
position: relative;
}
.messages {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
padding: 12px;
/* مساحة إضافية في الأسفل لتجنب تغطية مربع النص */
padding-bottom: 80px;
scroll-behavior: smooth;
}
.msg {
max-width: 80%;
padding: 8px 10px;
border-radius: 10px;
font-size: 13px;
line-height: 1.3;
word-break: break-word;
cursor: pointer;
}
.incoming {
align-self: flex-start;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
color: var(--muted);
}
.outgoing {
align-self: flex-end;
background: rgba(10, 100, 150, 0.3);
color: #e6f7ff;
border: 1px solid rgba(255, 255, 255, 0.03);
}
.msg-image, .msg-video {
max-width: 100%;
height: auto;
display: block;
border-radius: 6px;
margin-top: 6px;
}
.msg-audio-player {
display: flex;
align-items: center;
gap: 8px;
width: 220px;
background: rgba(255, 255, 255, 0.1);
border-radius: 10px;
padding: 6px;
margin-top: 4px;
}
.incoming .msg-audio-player {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.audio-play-btn {
background: #e6f7ff;
color: #0369a1;
border: none;
border-radius: 50%;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
}
.incoming .audio-play-btn {
background: var(--muted);
color: var(--bg);
}
.audio-waveform-container {
flex: 1;
min-height: 40px;
}
.audio-time {
font-size: 11px;
color: #e6f7ffcc;
}
.incoming .audio-time {
color: #cbd5e1cc;
}
.meta-time {
font-size: 10px;
color: #9fb3c8;
margin-top: 4px;
text-align: left;
display: flex;
align-items: center;
justify-content: flex-end;
gap: 4px;
}
.composer {
display: flex;
flex-direction: column;
gap: 8px;
padding: 6px 10px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
position: fixed;
bottom: 0;
left: 0;
right: 0;
background-color: var(--bg);
z-index: 100;
box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
}
.composer-input-row {
display: flex;
gap: 6px;
align-items: flex-end;
}
.composer textarea {
flex: 1;
min-height: 32px;
max-height: 100px;
resize: none;
padding: 8px 12px;
border-radius: 18px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: transparent;
color: var(--muted);
transition: all 0.2s ease;
direction: rtl;
/* ✅ تم التعديل: حجم الخط 16px يمنع الزوم التلقائي في الآيفون */
font-size: 16px;
}
.composer textarea:focus {
outline: none;
border-color: var(--accent);
}
.composer-btn {
width: 32px;
height: 32px;
background: linear-gradient(180deg, #06b6d4, #0891b2);
color: #012;
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.composer-btn:disabled {
background: #444;
cursor: not-allowed;
}
.file-input-btn, .voice-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
color: var(--muted);
padding: 6px;
border-radius: 50%;
cursor: pointer;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
#file-preview {
display: flex;
align-items: center;
gap: 6px;
padding: 6px;
background: rgba(255, 255, 255, 0.05);
border-radius: 6px;
border: 1px solid rgba(255, 255, 255, 0.1);
font-size: 12px;
}
#file-preview img, #file-preview video, #file-preview audio {
max-height: 40px;
border-radius: 4px;
}
.small { font-size: 11px; color: #8aa5bd; }
.recording-indicator {
display: none;
align-items: center;
gap: 6px;
padding: 6px 10px;
background: rgba(255, 0, 0, 0.2);
border-radius: 18px;
font-size: 12px;
color: #ff6b6b;
}
.recording-dot {
width: 8px;
height: 8px;
background-color: #ff6b6b;
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn { padding: 6px; font-size: 12px; }
#reply-container {
display: none;
align-items: center;
gap: 8px;
padding: 6px 12px;
border-radius: 12px;
background: var(--reply-bg);
border: 1px solid var(--reply-border);
margin-top: -4px;
}
#reply-content {
flex: 1;
display: flex;
flex-direction: column;
min-width: 0;
font-size: 12px;
line-height: 1.3;
}
#reply-sender {
font-weight: 600;
color: var(--accent);
font-size: 11px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
#reply-text {
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
color: var(--muted);
}
#cancel-reply-btn {
background: none;
border: none;
color: var(--muted);
cursor: pointer;
font-size: 14px;
padding: 4px;
}
.reply-block {
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--reply-block-bg);
  border-right: 3px solid var(--accent);
  display: flex;
  flex-direction: column;
}
.incoming .reply-block {
  background: rgba(255, 255, 255, 0.05);
  border-right: 3px solid #cbd5e1;
}
.reply-block-sender {
  font-weight: 600;
  color: var(--accent);
  font-size: 11px;
}
.incoming .reply-block-sender { color: #cbd5e1; }
.reply-block-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
<script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="user-row">
<a class="btn" href="/users_list" style="text-decoration:none;color:var(--muted);">◀</a>
<a id="other-profile-link" href="#" class="avatar"><img id="other-avatar" src="https://via.placeholder.com/40/000000/FFFFFF?text=U" alt="avatar"></a>
<div class="meta">
<div id="other-name" class="name">جارٍ التحميل...</div>
<div id="other-username" class="sub small"></div>
</div>
</div>
<div>
<a href="/logout" style="text-decoration:none;color:var(--muted);font-size:12px;">تسجيل خروج</a>
</div>
</div>
<div class="glass">
<div id="messages" class="messages">
<div class="small" style="text-align:center">جاري تحميل الرسائل...</div>
</div>
</div>
<form id="sendForm" class="composer" onsubmit="return false;">
<div id="reply-container">
<div id="reply-content">
<span id="reply-sender"></span>
<span id="reply-text"></span>
</div>
<button id="cancel-reply-btn" type="button" title="إلغاء الرد">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>
</div>
<div id="file-preview" style="display:none;">
    <span class="small" style="flex:1;">تم اختيار ملف</span>
    <button type="button" class="composer-btn btn" id="remove-file-btn" style="width:24px;height:24px;background:red;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
    </button>
</div>
<div class="composer-input-row">
<label for="media-upload" class="file-input-btn" title="إرفاق ملف">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7v-2h4V7h2v4h4v2h-4v4h-2z"/>
</svg>
</label>
<input type="file" id="media-upload" style="display:none;" accept="image/*,video/*,audio/*">
<textarea id="msgInput" placeholder="اكتب رسالة..." aria-label="اكتب رسالة"></textarea>
<button id="voiceBtn" class="voice-btn" type="button" title="تسجيل صوت">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>
</svg>
</button>
<button id="sendBtn" class="composer-btn" type="submit" title="إرسال">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
</svg>
</button>
</div>
<div id="recording-indicator" class="recording-indicator">
    <div class="recording-dot"></div>
    <span>جاري التسجيل...</span>
</div>
</form>
</div>
<script>
function getQuery(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const otherId = getQuery('contactId');
const otherAvatar = document.getElementById('other-avatar');
const otherName = document.getElementById('other-name');
const otherUsername = document.getElementById('other-username');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const fileUpload = document.getElementById('media-upload');
const filePreview = document.getElementById('file-preview');
const removeFileBtn = document.getElementById('remove-file-btn');
const sendForm = document.getElementById('sendForm');
const voiceBtn = document.getElementById('voiceBtn');
const recordingIndicator = document.getElementById('recording-indicator');
const replyContainer = document.getElementById('reply-container');
const replySenderEl = document.getElementById('reply-sender');
const replyTextEl = document.getElementById('reply-text');
const cancelReplyBtn = document.getElementById('cancel-reply-btn');

let uploadedFile = null;
let myId = null;
let lastMessages = null;
let replyToMessage = null;

let mediaRecorder;
let audioChunks = [];
let activeAudioPlayer = null;

function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeAttr(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/"/g, '&quot;');
}

// ✅ تعديل: دالة التمرير لأسفل لتكون أكثر فعالية
function scrollToBottom() {
    requestAnimationFrame(() => {
        messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    });
}

function createAudioPlayer(src, isIncoming) {
    return `
        <div class="msg-audio-player" onclick="event.stopPropagation()">
            <button class="audio-play-btn" type="button" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}" data-player>
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="audio-waveform-container" data-src="${escapeAttr(src)}" data-is-incoming="${isIncoming}"></div>
            <span class="audio-time">0:00</span>
        </div>
    `;
}

function createMessageElement(msg, myId) {
    const isIncoming = (msg.senderId !== myId);
    const el = document.createElement('div');
    el.className = 'msg ' + (isIncoming ? 'incoming' : 'outgoing');
    el.dataset.messageId = msg.messageId;
    el.title = 'انقر للرد';
    
    el.addEventListener('click', () => { setReplyTo(msg); });

    let contentHtml = '';

    if (msg.replied_to_id) {
        const repliedSender = msg.replied_to_sender || 'مستخدم';
        const repliedContent = msg.replied_to_content || 'رسالة محذوفة';
        contentHtml += `
            <div class="reply-block">
                <span class="reply-block-sender">${escapeHtml(repliedSender)}</span>
                <span class="reply-block-text">${escapeHtml(repliedContent)}</span>
            </div>
        `;
    }

    if (msg.media && msg.media.url) {
        const mediaUrl = msg.media.url;
        const mediaType = msg.media.type || 'raw';

        if (mediaType.startsWith('image')) {
            // ✅ إضافة onload لضمان نزول الشاشة عند تحميل الصورة
            contentHtml += `<img src="${escapeAttr(mediaUrl)}" class="msg-image" alt="صورة" onload="scrollToBottom()">`;
        } else if (mediaType.startsWith('audio') || mediaUrl.endsWith('.webm') || mediaUrl.endsWith('.mp3')) {
            contentHtml += createAudioPlayer(mediaUrl, isIncoming);
        } else if (mediaType.startsWith('video')) {
            contentHtml += `<video src="${escapeAttr(mediaUrl)}" controls class="msg-video"></video>`;
        } else {
            contentHtml += `<div style="padding:4px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;margin-top:5px;"><a href="${escapeAttr(mediaUrl)}" target="_blank" style="color:var(--accent);text-decoration:none;">📎 ملف مرفق</a></div>`;
        }
    }

    if (msg.content) {
        contentHtml += `<p style="margin:${msg.media ? '6px 0 0 0' : '0'}">${escapeHtml(msg.content)}</p>`;
    }

    const readStatus = !isIncoming && msg.is_read ? '<span style="color:#4ade80">✓✓</span>' : (!isIncoming ? '<span>✓</span>' : '');
    contentHtml += `<div class="meta-time">${formatTime(msg.timestamp)}${readStatus}</div>`;

    el.innerHTML = contentHtml;
    return el;
}

function setReplyTo(msg) {
    replyToMessage = {
        id: msg.messageId,
        content: msg.content || (msg.media ? 'رسالة وسائط' : 'رسالة'),
        senderName: (msg.senderId === myId) ? 'أنت' : otherName.textContent
    };
    replySenderEl.textContent = replyToMessage.senderName;
    replyTextEl.textContent = replyToMessage.content;
    replyContainer.style.display = 'flex';
    msgInput.focus();
}

cancelReplyBtn.onclick = () => {
    replyToMessage = null;
    replyContainer.style.display = 'none';
};

async function fetchOtherProfile() {
    try {
        const res = await fetch(`/api/profile/${otherId}`, { credentials: 'same-origin' });
        if (res.status === 401) return window.location.href = '/login';
        
        const defaultAvatarUrl = 'https://via.placeholder.com/40/000000/FFFFFF?text=U'; 
        if (!res.ok) {
            otherName.textContent = 'مستخدم';
            otherUsername.textContent = '';
            otherAvatar.src = defaultAvatarUrl;
            return;
        }

        const other = await res.json(); 
        otherAvatar.src = other.profile_picture_url || defaultAvatarUrl; 
        otherName.textContent = other.full_name || other.username || 'مستخدم';
        otherUsername.textContent = other.username ? ('@' + other.username) : '';
        document.getElementById('other-profile-link').href = `/profile?userId=${otherId}`;
    } catch (err) {
        otherName.textContent = 'خطأ';
    }
}

async function fetchMessages() {
    try {
        const res = await fetch(`/api/messages/${encodeURIComponent(otherId)}`, { credentials: 'same-origin' });
        if (res.status === 401) return window.location.href = '/login';
        
        const data = await res.json();
        if (!data.ok || !Array.isArray(data.messages)) return;

        const msgs = data.messages;
        // مقارنة بسيطة لتجنب إعادة الرسم إذا لم تتغير الرسائل
        const jsonKey = JSON.stringify(msgs.map(m => m.messageId)); 
        if (lastMessages && JSON.stringify(lastMessages.map(m => m.messageId)) === jsonKey) return;
        
        lastMessages = msgs;
        
        // التحقق مما إذا كان المستخدم في أسفل الصفحة قبل التحديث
        const isScrolledToBottom = (messagesEl.scrollHeight - messagesEl.scrollTop) <= (messagesEl.clientHeight + 100);

        messagesEl.innerHTML = '';
        
        if (msgs.length === 0) {
            messagesEl.innerHTML = '<div class="small" style="text-align:center;padding:20px;">لا توجد رسائل بعد.</div>';
            return;
        }

        if (!myId) {
            const profileRes = await fetch('/api/profile');
            if (profileRes.ok) {
                const user = await profileRes.json();
                myId = user.id;
            }
        }
        
        // عرض الرسائل (ستأتي الأقدم أولاً وتضاف للأسفل)
        msgs.forEach(msg => {
            const el = createMessageElement(msg, myId);
            messagesEl.appendChild(el);
        });

        // إذا كان المستخدم في الأسفل أو هذه أول مرة، ننزله للأسفل
        if (isScrolledToBottom || !lastMessages) {
            scrollToBottom();
        }
        
        // تفعيل التمرير الإجباري مرة واحدة عند التحميل الأولي
        if(msgs.length > 0 && !window.loadedOnce) {
             scrollToBottom();
             window.loadedOnce = true;
        }

        initializeAudioPlayers();

    } catch (err) {
        console.error('fetchMessages error', err);
    }
}

async function sendMessage() {
    let content = msgInput.value.trim();
    if (!content && !uploadedFile && audioChunks.length === 0) return;
    
    sendBtn.disabled = true;
    const originalIcon = sendBtn.innerHTML;
    sendBtn.innerHTML = '<div class="spin" style="width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></div>';

    const formData = new FormData();
    formData.append('other_id', otherId); 
    if (content) formData.append('content', content);
    if (uploadedFile) formData.append('media', uploadedFile);
    if (audioChunks.length > 0) {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        formData.append('media', audioBlob, 'voice_message.webm');
    }
    
    if (replyToMessage) {
        formData.append('replied_to_id', replyToMessage.id);
        formData.append('replied_to_content', replyToMessage.content);
        formData.append('replied_to_sender', replyToMessage.senderName);
    }
    
    try {
        const res = await fetch('/api/messages/send', {
            method: 'POST', credentials: 'same-origin', body: formData
        });
        const result = await res.json();
        
        if (res.ok && result.ok && result.messageData) { 
            const el = createMessageElement(result.messageData, myId);
            messagesEl.appendChild(el); 

            msgInput.value = '';
            uploadedFile = null;
            audioChunks = []; 
            filePreview.style.display = 'none';
            filePreview.innerHTML = '';
            replyToMessage = null; 
            replyContainer.style.display = 'none';
            
            // ✅ تمرير فوري للأسفل عند الإرسال
            scrollToBottom();
            lastMessages = null; 
        } else {
            alert('فشل الإرسال.');
        }
    } catch (err) {
        alert('خطأ في الاتصال.');
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalIcon;
    }
}

async function markRead() {
    if (!otherId) return;
    try {
        await fetch('/api/mark_read', { 
            method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ other_id: otherId }) 
        });
    } catch (err) { console.error(err); }
}

function startRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    msgInput.style.display = 'none';
    fileUpload.style.display = 'none';
    document.querySelector('.file-input-btn').style.display = 'none';
    
    audioChunks = [];
    recordingIndicator.style.display = 'flex';
    voiceBtn.style.background = 'rgba(255,0,0,0.5)';
    voiceBtn.style.borderColor = 'red';
    
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                stream.getTracks().forEach(track => track.stop());
                if (audioChunks.length > 0) {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    uploadedFile = new File([audioBlob], 'voice.webm', { type: 'audio/webm' });
                    const audioURL = URL.createObjectURL(audioBlob);
                    const previewElement = document.createElement('audio');
                    previewElement.src = audioURL; previewElement.controls = true;
                    filePreview.innerHTML = '';
                    filePreview.appendChild(previewElement);
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'composer-btn btn';
                    removeBtn.style.cssText = 'width:24px;height:24px;background:#ef4444;margin-right:auto;';
                    removeBtn.innerHTML = '×';
                    removeBtn.onclick = removeFile;
                    filePreview.appendChild(removeBtn);
                    filePreview.style.display = 'flex';
                }
            };
        }).catch(err => { alert('الميكروفون غير متاح.'); stopRecordingUI(); });
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    stopRecordingUI();
}
function stopRecordingUI() {
    recordingIndicator.style.display = 'none';
    msgInput.style.display = 'block';
    document.querySelector('.file-input-btn').style.display = 'flex';
    voiceBtn.style.background = ''; voiceBtn.style.borderColor = '';
}
function removeFile() {
    uploadedFile = null; audioChunks = [];
    filePreview.style.display = 'none'; filePreview.innerHTML = '';
}

function initializeAudioPlayers() {
    if (activeAudioPlayer) activeAudioPlayer = null;
    document.querySelectorAll('.msg-audio-player').forEach(player => {
        const playBtn = player.querySelector('[data-player]');
        const waveformContainer = player.querySelector('.audio-waveform-container');
        const timeDisplay = player.querySelector('.audio-time');
        if (waveformContainer.dataset.wavesurfer) return;
        const src = waveformContainer.dataset.src;
        const isIncoming = waveformContainer.dataset.isIncoming === 'true';

        try {
            const wavesurfer = WaveSurfer.create({
                container: waveformContainer,
                waveColor: isIncoming ? '#cbd5e1' : '#e6f7ff',
                progressColor: isIncoming ? '#8aa5bd' : '#7dd3fc',
                cursorColor: 'transparent',
                barWidth: 2, height: 30, barGap: 2, barRadius: 2,
            });
            waveformContainer.dataset.wavesurfer = true;
            wavesurfer.load(src);
            playBtn.onclick = (e) => {
                e.stopPropagation();
                if (activeAudioPlayer && activeAudioPlayer !== wavesurfer) activeAudioPlayer.pause();
                activeAudioPlayer = wavesurfer;
                wavesurfer.playPause();
            };
            wavesurfer.on('play', () => playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>');
            wavesurfer.on('pause', () => playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>');
            wavesurfer.on('ready', () => timeDisplay.textContent = formatAudioTime(wavesurfer.getDuration()));
            wavesurfer.on('audioprocess', () => timeDisplay.textContent = formatAudioTime(wavesurfer.getCurrentTime()));
            wavesurfer.on('finish', () => { playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>'; activeAudioPlayer = null; });
        } catch(e) {}
    });
}

function formatAudioTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function formatTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const now = new Date();
    if (date.toDateString() === now.toDateString()) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    return date.toLocaleDateString('ar-EG', { month: 'numeric', day: 'numeric' });
}

removeFileBtn.addEventListener('click', removeFile);
fileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        uploadedFile = file; audioChunks = []; filePreview.innerHTML = '';
        const reader = new FileReader();
        reader.onload = (e) => {
            let previewElement;
            if (file.type.startsWith('image/')) { previewElement = document.createElement('img'); previewElement.src = e.target.result; }
            else if (file.type.startsWith('video/')) { previewElement = document.createElement('video'); previewElement.src = e.target.result; }
            else if (file.type.startsWith('audio/')) { previewElement = document.createElement('audio'); previewElement.src = e.target.result; previewElement.controls = true; }
            else { previewElement = document.createElement('span'); previewElement.textContent = file.name; }
            filePreview.appendChild(previewElement);
            const removeBtn = document.createElement('button');
            removeBtn.className = 'composer-btn btn';
            removeBtn.style.cssText = 'width:24px;height:24px;background:#ef4444;margin-right:auto;';
            removeBtn.innerHTML = '×';
            removeBtn.onclick = removeFile;
            filePreview.appendChild(removeBtn);
            filePreview.style.display = 'flex';
        };
        reader.readAsDataURL(file);
    }
});

sendForm.addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
voiceBtn.addEventListener('mousedown', startRecording);
voiceBtn.addEventListener('mouseup', stopRecording);
voiceBtn.addEventListener('mouseleave', stopRecording);
voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
voiceBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

(async function init() {
    if(!otherId) { window.location.href = '/chat_list'; return; }
    await fetchOtherProfile();
    await markRead();
    await fetchMessages();
    setTimeout(scrollToBottom, 100); // تأكيد التمرير بعد التحميل الأولي
    
    setInterval(async () => { if (document.visibilityState === 'visible') await fetchMessages(); }, 3000); 
    window.addEventListener('focus', markRead);
    setInterval(() => { if (document.visibilityState === 'visible') markRead(); }, 10000);
})();
</script>
