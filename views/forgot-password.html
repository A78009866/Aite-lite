<body class="flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-3xl p-8 md:p-10">
        <div class="text-center mb-6">
            <img src="/icon-192.png" 
                 class="h-14 w-14 rounded-xl mx-auto mb-4 object-cover shadow-lg shadow-blue-500/20" alt="Aite">
            <h1 class="text-2xl font-bold mb-2 text-white">نسيت كلمة المرور</h1>
            <p class="text-gray-400 text-sm">أدخل اسم المستخدم أو بريد الاستعادة لإرسال رابط إعادة التعيين</p>
        </div>

        <div id="errorBox" class="error-box"></div>
        <div id="successBox" class="success-box"></div>

        <form id="forgotForm" class="space-y-4">
            <div class="input-group space-y-2">
                <label for="identifier" class="text-sm font-medium text-gray-300 mr-1">اسم المستخدم أو البريد الإلكتروني</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="text" id="identifier" required 
                           class="w-full pr-11 pl-4 py-3.5 rounded-xl text-white placeholder-gray-500 outline-none focus:ring-0" 
                           placeholder="اسم المستخدم أو البريد الإلكتروني">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg mt-2 flex items-center justify-center gap-3">
                <span id="submitBtnText">إرسال رابط إعادة التعيين</span>
                <i id="submitSpinner" class="fas fa-spinner fa-spin hidden"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/login" class="btn-secondary inline-block py-3 px-6 rounded-xl text-sm font-medium text-gray-300">
                <i class="fas fa-arrow-right ml-2"></i> العودة لتسجيل الدخول
            </a>
        </div>
    </div>

    <script>
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');
        const submitSpinner = document.getElementById('submitSpinner');
        const submitBtnText = document.getElementById('submitBtnText');

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const identifier = document.getElementById('identifier').value.trim();
            if (!identifier) { showError('أدخل اسم المستخدم أو البريد الإلكتروني.'); return; }

            submitBtn.disabled = true;
            submitSpinner.classList.remove('hidden');
            submitBtnText.textContent = 'جاري الإرسال...';

            try {
                const resp = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await resp.json();

                if (data.ok) {
                    successBox.textContent = data.message || 'تم إرسال رابط إعادة التعيين للإيميل المرتبط بالحساب.';
                    successBox.style.display = 'block';
                    submitBtnText.textContent = 'تم الإرسال';
                } else {
                    showError(data.error || 'حدث خطأ.');
                    submitBtnText.textContent = 'إرسال رابط إعادة التعيين';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showError('فشل في الاتصال بالخادم.');
                submitBtnText.textContent = 'إرسال رابط إعادة التعيين';
                submitBtn.disabled = false;
            }
            submitSpinner.classList.add('hidden');
        });

        function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
    </script>

<script>
(function(){
  // ===== PWA Full App Install =====
  var DISMISS_KEY = 'aite_install_dismiss_v2';
  var bar = document.getElementById('pwaInstallBar');
  var desc = document.getElementById('pwaBarDesc');
  var btn = document.getElementById('pwaBarInstallBtn');
  var _prompt = null;

  // Is app already running in standalone (installed)?
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {
    setTimeout(function(){
      if (desc) desc.textContent = 'أضف Aite إلى الشاشة الرئيسية';
      if (btn) btn.textContent = 'إضافة';
      bar.style.display = 'block';
    }, 2500);
  }

  // Install button click
  window.pwaInstallApp = function() {
    if (_prompt) {
      // Native browser install prompt (Android/Chrome/Edge/Desktop)
      _prompt.prompt();
      _prompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          bar.style.display = 'none';
          try { localStorage.removeItem(DISMISS_KEY); } catch(e){}
        }
        _prompt = null;
      });
    } else if (isIOS) {
      // Show iOS step-by-step instructions
      var ov = document.createElement('div');
      ov.id = 'iosInstallOverlay';
      ov.innerHTML = '<div class="ios-install-box">'
        + '<img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin:0 auto 14px;display:block;">'
        + '<h3 style="color:#fff;font-size:19px;font-weight:700;margin:0 0 6px;">تثبيت Aite</h3>'
        + '<p style="color:#9ca3af;font-size:13px;margin:0 0 18px;">اتبع الخطوات التالية لتثبيت التطبيق:</p>'
        + '<div class="ios-step">1. اضغط على أيقونة المشاركة <span style="font-size:17px;">⬆️</span> في شريط Safari</div>'
        + '<div class="ios-step">2. اختر <b style="color:#fff;">"إضافة إلى الشاشة الرئيسية"</b> <span style="font-size:15px;">📱</span></div>'
        + '<div class="ios-step">3. اضغط <b style="color:#fff;">"إضافة"</b> في الأعلى</div>'
        + '<button onclick="this.closest('#iosInstallOverlay').remove()" style="margin-top:18px;background:#3b82f6;color:#fff;border:none;padding:11px 34px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">فهمت</button>'
        + '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target===ov) ov.remove(); });
    }
  };

  // Dismiss for 12 hours
  window.pwaDismiss = function() {
    bar.style.display = 'none';
    try { localStorage.setItem(DISMISS_KEY, Date.now().toString()); } catch(e){}
  };

  // Auto-hide on successful install
  window.addEventListener('appinstalled', function() {
    bar.style.display = 'none';
    _prompt = null;
  });
})();
</script>

<script>
(function(){
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;

  var bar = document.getElementById('aite-progress-bar');
  var currentProgress = 0;
  var progressTimer = null;
  var isNavigating = false;

  function setProgress(value) {
    currentProgress = Math.min(value, 100);
    if (bar) bar.style.width = currentProgress + '%';
  }

  function startProgress() {
    if (isNavigating) return;
    isNavigating = true;
    currentProgress = 0;
    if (bar) {
      bar.style.transition = 'none';
      bar.style.width = '0';
      bar.style.opacity = '0';
      void bar.offsetWidth;
      bar.classList.add('active');
      bar.style.opacity = '1';
      bar.style.transition = 'width 150ms ease-out';
    }
    setProgress(15);
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(function() {
      if (currentProgress < 50) setProgress(currentProgress + 3);
      else if (currentProgress < 75) setProgress(currentProgress + 1.5);
      else if (currentProgress < 90) setProgress(currentProgress + 0.5);
      if (currentProgress >= 92) { clearInterval(progressTimer); progressTimer = null; }
    }, 150);
  }

  function completeProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (!bar) return;
    bar.style.transition = 'width 100ms ease-out';
    setProgress(100);
    setTimeout(function() {
      bar.style.transition = 'opacity 200ms ease';
      bar.style.opacity = '0';
      setTimeout(function() {
        bar.classList.remove('active');
        bar.style.width = '0';
        bar.style.transition = 'width 150ms ease-out';
        bar.style.opacity = '';
        currentProgress = 0;
        isNavigating = false;
      }, 200);
    }, 150);
  }

  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startProgress();
  });

  window.addEventListener('beforeunload', function() { startProgress(); });
  window.addEventListener('pageshow', function() { completeProgress(); });
  if (document.readyState === 'complete') completeProgress();
  else window.addEventListener('load', function() { completeProgress(); });

  document.addEventListener('contextmenu', function(e) {
    var tag = e.target.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !e.target.isContentEditable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('dragstart', function(e) { e.preventDefault(); }, { passive: false });

  var offlineOverlay = document.getElementById('aite-offline-overlay');
  function checkOnline() {
    if (!navigator.onLine && offlineOverlay) offlineOverlay.classList.add('show');
    else if (offlineOverlay) offlineOverlay.classList.remove('show');
  }
  window.addEventListener('online', checkOnline);
  window.addEventListener('offline', checkOnline);

  var notifSound = null;
  try { notifSound = new Audio('/notification.mp3'); notifSound.volume = 1.0; notifSound.preload = 'auto'; } catch(e) {}
  window.aitePlayNotificationSound = function() {
    try {
      if (notifSound) { notifSound.currentTime = 0; notifSound.play().catch(function(){}); }
      if (navigator.vibrate) navigator.vibrate([0, 300, 200, 300]);
    } catch(e) {}
  };
  document.addEventListener('aite-new-notification', function() { window.aitePlayNotificationSound(); });
})();
</script>

<!-- Aite Web Push Subscription -->
<script>
(function(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  async function subscribeWebPush() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) return; // already subscribed

      const resp = await fetch('/api/vapid-public-key');
      const data = await resp.json();
      if (!data.ok || !data.publicKey) return;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;

      const applicationServerKey = urlBase64ToUint8Array(data.publicKey);
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey
      });

      await fetch('/api/web-push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });
    } catch (e) {
      console.warn('Web Push subscription failed:', e);
    }
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Subscribe after page loads (with small delay to not block rendering)
  if (document.readyState === 'complete') {
    setTimeout(subscribeWebPush, 2000);
  } else {
    window.addEventListener('load', function() {
      setTimeout(subscribeWebPush, 2000);
    });
  }
})();
</script>

<!-- Pull to Refresh -->
<style>
.ptr-indicator {
  position: fixed;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #1e293b;
  border: 2px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: top 0.2s ease, transform 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.ptr-indicator i {
  color: #6ee7b7;
  font-size: 18px;
  transition: transform 0.2s ease;
}
.ptr-indicator.ptr-loading i {
  animation: ptr-spin 0.8s linear infinite;
}
@keyframes ptr-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
<div class="ptr-indicator" id="ptr-indicator"><i class="fas fa-sync-alt"></i></div>
<script>
(function() {
  var ptrEl = document.getElementById('ptr-indicator');
  if (!ptrEl) return;
  var startY = 0, currentY = 0, pulling = false, threshold = 80;

  function getScrollTop() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }

  document.addEventListener('touchstart', function(e) {
    if (getScrollTop() <= 5) {
      startY = e.touches[0].clientY;
      pulling = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    currentY = e.touches[0].clientY;
    var dist = currentY - startY;
    if (dist > 0 && getScrollTop() <= 5) {
      var progress = Math.min(dist / threshold, 1);
      var top = Math.min(dist * 0.4, 60);
      ptrEl.style.top = (top - 20) + 'px';
      ptrEl.querySelector('i').style.transform = 'rotate(' + (progress * 180) + 'deg)';
      if (dist > 10) { e.preventDefault(); }
    } else {
      pulling = false;
      ptrEl.style.top = '-50px';
    }
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (!pulling) return;
    var dist = currentY - startY;
    if (dist >= threshold && getScrollTop() <= 5) {
      ptrEl.style.top = '10px';
      ptrEl.classList.add('ptr-loading');
      ptrEl.querySelector('i').style.transform = '';
      setTimeout(function() { location.reload(); }, 400);
    } else {
      ptrEl.style.top = '-50px';
    }
    pulling = false;
    startY = 0;
    currentY = 0;
  }, { passive: true });
})();
</script>
