<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور — Aite</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(57, 130, 247, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(120, 50, 220, 0.1) 0%, transparent 20%);
            color: #e4e6eb;
            min-height: 100vh;
            overflow-wrap: break-word;
        }
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .input-group input {
            background: rgba(45, 45, 45, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #3982f7 !important;
            background: rgba(45, 45, 45, 0.8) !important;
            box-shadow: 0 0 0 2px rgba(57, 130, 247, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3982f7 0%, #2b61b8 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(57, 130, 247, 0.3); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .error-box { background: rgba(255,0,0,0.06); border: 1px solid rgba(255,0,0,0.12); padding: 8px; border-radius: 8px; color: #ffdddd; display: none; margin-bottom: 12px;}
        .success-box { background: rgba(0,200,0,0.06); border: 1px solid rgba(0,200,0,0.12); padding: 8px; border-radius: 8px; color: #ddffdd; display: none; margin-bottom: 12px;}
        @media (min-width: 768px) { .glass-card { max-width: 480px; } }
        @media (min-width: 1024px) { .glass-card { max-width: 520px; padding: 2.5rem 3rem !important; } }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-3xl p-8 md:p-10">
        <div class="text-center mb-6">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" 
                 class="h-14 w-14 rounded-xl mx-auto mb-4 object-cover shadow-lg shadow-blue-500/20" alt="Aite">
            <h1 class="text-2xl font-bold mb-2 text-white">نسيت كلمة المرور</h1>
            <p class="text-gray-400 text-sm">أدخل اسم المستخدم أو بريد الاستعادة لإرسال رابط إعادة التعيين</p>
        </div>

        <div id="errorBox" class="error-box"></div>
        <div id="successBox" class="success-box"></div>

        <form id="forgotForm" class="space-y-4">
            <div class="input-group space-y-2">
                <label for="identifier" class="text-sm font-medium text-gray-300 mr-1">اسم المستخدم أو البريد الإلكتروني</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="text" id="identifier" required 
                           class="w-full pr-11 pl-4 py-3.5 rounded-xl text-white placeholder-gray-500 outline-none focus:ring-0" 
                           placeholder="اسم المستخدم أو البريد الإلكتروني">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg mt-2 flex items-center justify-center gap-3">
                <span id="submitBtnText">إرسال رابط إعادة التعيين</span>
                <i id="submitSpinner" class="fas fa-spinner fa-spin hidden"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/login" class="btn-secondary inline-block py-3 px-6 rounded-xl text-sm font-medium text-gray-300">
                <i class="fas fa-arrow-right ml-2"></i> العودة لتسجيل الدخول
            </a>
        </div>
    </div>

    <script>
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');
        const submitSpinner = document.getElementById('submitSpinner');
        const submitBtnText = document.getElementById('submitBtnText');

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const identifier = document.getElementById('identifier').value.trim();
            if (!identifier) { showError('أدخل اسم المستخدم أو البريد الإلكتروني.'); return; }

            submitBtn.disabled = true;
            submitSpinner.classList.remove('hidden');
            submitBtnText.textContent = 'جاري الإرسال...';

            try {
                const resp = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await resp.json();

                if (data.ok) {
                    successBox.textContent = data.message || 'تم إرسال رابط إعادة التعيين للإيميل المرتبط بالحساب.';
                    successBox.style.display = 'block';
                    submitBtnText.textContent = 'تم الإرسال';
                } else {
                    showError(data.error || 'حدث خطأ.');
                    submitBtnText.textContent = 'إرسال رابط إعادة التعيين';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showError('فشل في الاتصال بالخادم.');
                submitBtnText.textContent = 'إرسال رابط إعادة التعيين';
                submitBtn.disabled = false;
            }
            submitSpinner.classList.add('hidden');
        });

        function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
    </script>
</body>
</html>
