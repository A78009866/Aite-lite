<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - تعديل الملف الشخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-form-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            
            <div class="flex items-center">
                <a href="/profile" class="text-gray-400 hover:text-white transition duration-300">
                    <i class="fas fa-arrow-right text-2xl"></i>
                </a>
            </div>
            
            <div class="flex-grow flex justify-center">
                <span class="text-2xl font-bold text-white">تعديل الملف الشخصي</span>
            </div>
            
            <div class="w-10"></div> </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4 flex justify-center">
        
        <div class="w-full max-w-xl">
            
            <form id="editProfileForm" class="glass-form-card rounded-xl shadow-2xl p-6 space-y-6">
                
                <div id="error-message" class="bg-red-900/50 text-red-300 p-3 rounded-lg hidden" role="alert"></div>

                <div class="relative h-40 rounded-lg overflow-hidden border border-gray-700">
                    <img id="coverPhotoPreview" src="/assets/default_cover_photo.jpg" alt="صورة الغلاف" class="w-full h-full object-cover">
                    <label for="coverPhotoInput" class="absolute inset-0 bg-black/50 flex items-center justify-center cursor-pointer hover:bg-black/70 transition duration-300">
                        <i class="fas fa-camera text-white text-3xl ml-3"></i>
                        <span class="text-white font-semibold">تعديل صورة الغلاف</span>
                    </label>
                    <input type="file" id="coverPhotoInput" name="cover_photo" accept="image/*" class="hidden" onchange="handleImagePreview(this, 'coverPhotoPreview')">
                </div>

                <div class="flex flex-col items-center -mt-20 relative z-10">
                    <div class="w-32 h-32 rounded-full border-4 border-black bg-gray-900 shadow-lg relative overflow-hidden">
                        <img id="profilePicPreview" src="/assets/default_profile_pic.png" alt="صورة الملف الشخصي" class="w-full h-full object-cover">
                        <label for="profilePicInput" class="absolute inset-0 bg-black/50 flex items-center justify-center cursor-pointer opacity-0 hover:opacity-100 transition duration-300">
                            <i class="fas fa-camera text-white text-xl"></i>
                        </label>
                    </div>
                    <input type="file" id="profilePicInput" name="profile_picture" accept="image/*" class="hidden" onchange="handleImagePreview(this, 'profilePicPreview')">
                    
                    <button type="button" onclick="document.getElementById('profilePicInput').click()" 
                            class="mt-2 bg-gray-700 hover:bg-gray-600 text-white text-sm font-semibold py-1 px-3 rounded-full transition duration-300">
                        تغيير صورة البروفايل
                    </button>
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-400 mb-1">الاسم الكامل</label>
                    <input type="text" id="fullName" name="full_name" required
                           class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="أدخل اسمك الكامل">
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-400 mb-1">اسم المستخدم (@)</label>
                    <input type="text" id="username" name="username" required
                           class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="أدخل اسم المستخدم">
                </div>

                <div>
                    <label for="bio" class="block text-sm font-medium text-gray-400 mb-1">السيرة الذاتية</label>
                    <textarea id="bio" name="bio" rows="4"
                              class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="اكتب شيئًا عن نفسك..."></textarea>
                </div>

                <button type="submit" id="saveButton"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300 shadow-lg disabled:bg-gray-500">
                    حفظ التغييرات
                </button>
                
            </form>
            
        </div>

    </main>
    
    <script>
        const form = document.getElementById('editProfileForm');
        const saveButton = document.getElementById('saveButton');
        const errorMessage = document.getElementById('error-message');
        
        /**
         * يعرض صورة معاينة للملف المختار
         * @param {HTMLInputElement} input - عنصر الإدخال (input type="file")
         * @param {string} previewImageId - مُعرف عنصر <img> الذي سيعرض المعاينة
         */
        function handleImagePreview(input, previewImageId) {
            const preview = document.getElementById(previewImageId);
            const file = input.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        
        /**
         * جلب بيانات الملف الشخصي الحالية لملء النموذج
         */
        async function fetchAndLoadProfileData() {
            try {
                // يفترض أن هذا المسار يجلب بيانات المستخدم الحالي
                const response = await fetch('/api/profile'); 
                const data = await response.json();
                
                if (response.ok && data.ok) {
                    document.getElementById('fullName').value = data.full_name || '';
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('bio').value = data.bio || '';

                    // عرض الصور الحالية (إذا كانت موجودة)
                    document.getElementById('profilePicPreview').src = data.profile_picture_url || '/assets/default_profile_pic.png';
                    document.getElementById('coverPhotoPreview').src = data.cover_photo_url || '/assets/default_cover_photo.jpg';

                } else {
                    errorMessage.textContent = 'فشل في جلب البيانات الحالية للملف الشخصي.';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error fetching profile data:', error);
                errorMessage.textContent = 'خطأ في الاتصال: تأكد من تشغيل الخادم.';
                errorMessage.classList.remove('hidden');
            }
        }
        
        /**
         * التعامل مع إرسال النموذج (الذي يتضمن ملفات)
         */
        async function handleFormSubmission(event) {
            event.preventDefault();
            
            errorMessage.classList.add('hidden');
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحفظ...';

            // استخدام FormData للتعامل مع تحميل الملفات والحقول النصية معاً
            const formData = new FormData(form);
            
            // تحقق من وجود ملفات، إذا لم توجد، لن يضيفها المتصفح إلى FormData
            
            try {
                // يفترض أن هذا المسار سيتم تنفيذه في server.js للتعامل مع البيانات والملفات
                const response = await fetch('/api/profile/edit', {
                    method: 'PUT', // أو POST، حسب ما تختاره لتحديث البيانات
                    body: formData // يجب أن يقبل الخادم (server.js) هذا النوع من البيانات عبر multer.single/array/fields
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    // النجاح: توجيه المستخدم مرة أخرى إلى صفحة الملف الشخصي
                    window.location.href = '/profile';
                } else {
                    errorMessage.textContent = result.error || 'فشل في حفظ التغييرات. تحقق من اسم المستخدم.';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Form submission error:', error);
                errorMessage.textContent = 'خطأ في الاتصال بالخادم. لم يتم حفظ التغييرات.';
                errorMessage.classList.remove('hidden');
            } finally {
                saveButton.disabled = false;
                saveButton.innerHTML = 'حفظ التغييرات';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAndLoadProfileData);
        form.addEventListener('submit', handleFormSubmission);
    </script>
</body>
</html>
