<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة العائلة - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Glassmorphism Styles */
        .glass-navbar {
            background-color: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 50;
        }

        .glass-card {
            background-color: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(59, 130, 246, 0.5);
            outline: none;
        }

        /* Family Header Styles */
        .family-header {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 0 0 24px 24px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .family-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }
        .family-info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        /* Waveform */
        .waveform-post {
            height: 50px; 
            background-color: rgba(255,255,255,0.05); 
            border-radius: 8px;
            overflow: hidden;
        }

        /* Animation */
        @keyframes pulse-record {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active {
            animation: pulse-record 1.5s infinite;
            background-color: #ef4444 !important;
            border-color: #ef4444 !important;
            color: white !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>

    <header class="fixed top-0 left-0 right-0 glass-navbar px-4 py-3 flex justify-between items-center transition-all duration-300">
        <a href="/chat_list" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition">
            <i class="fas fa-arrow-right text-lg"></i>
        </a>
        
        <h1 class="text-xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
            Aite Family
        </h1>

        <button onclick="openSettingsModal()" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition">
            <i class="fas fa-cog text-lg"></i>
        </button>
    </header>

    <main class="max-w-2xl mx-auto pt-16">
        
        <div id="familyHeaderContainer" class="family-header shadow-2xl mx-auto max-w-2xl relative">
            <img id="familyCoverImg" src="" alt="غلاف العائلة" class="family-cover">
            <div class="family-info-overlay">
                <div>
                    <h2 id="familyName" class="text-2xl font-bold text-white mb-1 shadow-sm"></h2>
                    <p id="membersCount" class="text-sm text-gray-300 flex items-center gap-1">
                        <i class="fas fa-users text-xs"></i> <span>...</span> عضو
                    </p>
                </div>
                </div>
        </div>

        <div class="px-4 mb-6">
            <div onclick="openCreatePostModal()" class="glass-card p-4 flex items-center gap-3 cursor-pointer hover:bg-white/5 transition group">
                <img id="myAvatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full border border-gray-600">
                <div class="flex-grow bg-black/20 h-10 rounded-full flex items-center px-4 text-gray-400 text-sm group-hover:text-gray-200 transition">
                    شارك شيئاً مع العائلة...
                </div>
                <div class="text-blue-400 text-xl px-2">
                    <i class="fas fa-images"></i>
                </div>
            </div>
        </div>

        <div id="familyPostsFeed" class="px-4 space-y-4 pb-20">
            <div class="text-center py-10 text-gray-500">
                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                <p>جاري تحميل المنشورات...</p>
            </div>
        </div>

    </main>

    <div id="settingsModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 glass-modal-bg" onclick="closeSettingsModal()">
        <div class="glass-card w-full max-w-sm p-6 rounded-2xl relative" onclick="event.stopPropagation()">
            <h3 class="text-xl font-bold text-white mb-6 text-center border-b border-gray-700 pb-4">إعدادات العائلة</h3>
            
            <div id="creatorOptions" class="hidden space-y-3">
                <div class="bg-white/5 p-4 rounded-xl border border-white/10 mb-4 text-center">
                    <p class="text-xs text-gray-400 mb-2">رمز دعوة العائلة</p>
                    <div id="familyKeyDisplay" class="text-lg font-mono text-blue-400 font-bold tracking-wider cursor-pointer select-all" onclick="copyFamilyKey()">-------</div>
                    <p id="copyStatus" class="text-[10px] text-green-400 h-4 mt-1"></p>
                </div>

                <button onclick="confirmDeleteFamily()" class="w-full p-3 bg-red-900/30 hover:bg-red-900/50 text-red-400 border border-red-900/50 rounded-xl flex items-center justify-center gap-2 transition">
                    <i class="fas fa-trash-alt"></i> حذف العائلة نهائياً
                </button>
            </div>

            <div id="memberOptions" class="hidden space-y-3">
                <button onclick="confirmLeaveFamily()" class="w-full p-3 bg-yellow-900/30 hover:bg-yellow-900/50 text-yellow-400 border border-yellow-900/50 rounded-xl flex items-center justify-center gap-2 transition">
                    <i class="fas fa-sign-out-alt"></i> مغادرة العائلة
                </button>
            </div>

            <button onclick="closeSettingsModal()" class="w-full mt-4 p-3 text-gray-400 hover:text-white text-sm">إلغاء</button>
        </div>
    </div>

    <div id="createPostModal" class="hidden fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 glass-modal-bg">
        <div class="bg-[#111] sm:glass-card w-full max-w-lg h-[90vh] sm:h-auto sm:rounded-2xl rounded-t-2xl p-5 flex flex-col relative" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h3 class="text-lg font-bold text-white">منشور جديد للعائلة</h3>
                <button onclick="closeCreatePostModal()" class="text-gray-400 hover:text-white w-8 h-8 flex items-center justify-center rounded-full bg-white/5">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <textarea id="postContentInput" class="glass-input w-full p-4 rounded-xl resize-none h-32 mb-4 text-white text-lg" placeholder="اكتب شيئاً للعائلة..."></textarea>

            <div id="postMediaPreview" class="hidden mb-4 relative rounded-xl overflow-hidden bg-black border border-gray-800 max-h-48 flex items-center justify-center">
                <button onclick="clearMedia()" class="absolute top-2 left-2 bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center z-10"><i class="fas fa-times text-xs"></i></button>
                <div id="previewContent" class="w-full h-full flex justify-center"></div>
            </div>

            <div id="audioRecorderUI" class="mb-4 bg-white/5 border border-white/10 rounded-xl p-3 flex flex-col items-center gap-3">
                <div id="waveformPreview" class="w-full hidden"></div>
                <div class="flex items-center gap-4">
                    <button id="recordBtn" onclick="toggleRecording()" class="w-12 h-12 rounded-full border border-gray-600 bg-gray-800 text-white flex items-center justify-center transition hover:border-red-500">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <span id="recordStatus" class="text-xs text-gray-500 font-mono">اضغط للتسجيل</span>
                </div>
            </div>

            <div class="mt-auto flex items-center justify-between pt-3 border-t border-gray-800">
                <div class="flex gap-2">
                    <button onclick="document.getElementById('mediaInput').click()" class="text-blue-400 hover:bg-blue-900/20 p-2 rounded-lg transition">
                        <i class="fas fa-image text-xl"></i>
                    </button>
                    <input type="file" id="mediaInput" class="hidden" accept="image/*,video/*" onchange="handleFileSelect(this)">
                </div>
                <button id="submitPostBtn" onclick="submitPost()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">
                    نشر
                </button>
            </div>
        </div>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-[80] flex items-center justify-center glass-modal-bg" onclick="closeMediaViewer()">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2" onclick="closeMediaViewer()"><i class="fas fa-times"></i></button>
        <div id="mediaViewerContent" class="max-h-[90vh] max-w-[95vw]" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        // --- Constants & Global Vars ---
        const DEFAULT_FAMILY_IMG = 'https://plus.unsplash.com/premium_vector-1682298522309-88e4dc1ccc4d?q=80&w=1125&auto=format&fit=crop';
        const DEFAULT_AVATAR = 'https://via.placeholder.com/40';
        
        // Extract familyId from URL (assuming /family/:id)
        const pathSegments = window.location.pathname.split('/');
        const familyId = pathSegments[pathSegments.length - 1];
        
        let currentUserId = null;
        let isCreator = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;
        let wavesurferRecorder = null;
        let activeWaveSurfers = {}; // For feed posts

        // --- Init ---
        document.addEventListener('DOMContentLoaded', async () => {
            if (!familyId) { alert('Invalid Family ID'); window.location.href='/chat_list'; return; }
            
            await fetchProfile();
            await fetchFamilyInfo();
            fetchPosts();
        });

        async function fetchProfile() {
            try {
                const res = await fetch('/api/profile');
                if(res.ok) {
                    const data = await res.json();
                    currentUserId = data.id;
                    document.getElementById('myAvatar').src = data.profile_picture_url || DEFAULT_AVATAR;
                }
            } catch(e) { console.error(e); }
        }

        async function fetchFamilyInfo() {
            try {
                const res = await fetch(`/api/families/${familyId}/info`);
                const data = await res.json();
                
                if (res.ok && data.ok) {
                    const f = data.family;
                    document.getElementById('familyName').textContent = f.name;
                    document.getElementById('familyCoverImg').src = f.imageUrl || DEFAULT_FAMILY_IMG;
                    document.getElementById('membersCount').innerHTML = `<i class="fas fa-users text-xs"></i> <span>${f.membersCount}</span> عضو`;
                    
                    isCreator = (f.creatorId === currentUserId);
                } else {
                    document.getElementById('familyPostsFeed').innerHTML = `<div class="text-red-500 text-center mt-10">العائلة غير موجودة أو ليس لديك صلاحية الوصول.</div>`;
                }
            } catch (error) {
                console.error('Error fetching family info', error);
            }
        }

        // --- Settings Modal Logic ---
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
            if(isCreator) {
                document.getElementById('creatorOptions').classList.remove('hidden');
                document.getElementById('memberOptions').classList.add('hidden');
                fetchFamilyKey();
            } else {
                document.getElementById('creatorOptions').classList.add('hidden');
                document.getElementById('memberOptions').classList.remove('hidden');
            }
        }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        async function fetchFamilyKey() {
            try {
                const res = await fetch(`/api/families/${familyId}/key`);
                const data = await res.json();
                if(res.ok && data.ok) {
                    document.getElementById('familyKeyDisplay').textContent = data.key;
                }
            } catch(e) {}
        }
        function copyFamilyKey() {
            const txt = document.getElementById('familyKeyDisplay').textContent;
            navigator.clipboard.writeText(txt).then(() => {
                document.getElementById('copyStatus').textContent = 'تم النسخ!';
                setTimeout(() => document.getElementById('copyStatus').textContent = '', 2000);
            });
        }

        async function confirmLeaveFamily() {
            if(!confirm('هل أنت متأكد من مغادرة العائلة؟')) return;
            try {
                const res = await fetch(`/api/families/${familyId}/leave`, { method: 'POST' });
                if(res.ok) window.location.href = '/chat_list';
            } catch(e) { alert('Error leaving family'); }
        }

        async function confirmDeleteFamily() {
            if(!confirm('تحذير: سيتم حذف العائلة وجميع محتوياتها نهائياً. هل أنت متأكد؟')) return;
            try {
                const res = await fetch(`/api/families/${familyId}`, { method: 'DELETE' });
                if(res.ok) window.location.href = '/chat_list';
                else alert('فشل الحذف');
            } catch(e) { alert('خطأ في الاتصال'); }
        }

        // --- Create Post Modal Logic ---
        function openCreatePostModal() {
            document.getElementById('createPostModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            clearForm();
        }
        function closeCreatePostModal() {
            document.getElementById('createPostModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            clearForm();
        }

        function clearForm() {
            document.getElementById('postContentInput').value = '';
            clearMedia();
            if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            audioBlob = null;
            document.getElementById('recordStatus').textContent = 'اضغط للتسجيل';
            document.getElementById('recordBtn').classList.remove('recording-active');
            if(wavesurferRecorder) { wavesurferRecorder.destroy(); wavesurferRecorder = null; }
            document.getElementById('waveformPreview').classList.add('hidden');
        }

        function handleFileSelect(input) {
            const file = input.files[0];
            if(!file) return;
            const container = document.getElementById('postMediaPreview');
            const content = document.getElementById('previewContent');
            container.classList.remove('hidden');
            content.innerHTML = '';
            
            const url = URL.createObjectURL(file);
            if(file.type.startsWith('image/')) {
                content.innerHTML = `<img src="${url}" class="h-full object-contain rounded-lg">`;
            } else if (file.type.startsWith('video/')) {
                content.innerHTML = `<video src="${url}" controls class="h-full object-contain rounded-lg"></video>`;
            }
        }

        function clearMedia() {
            document.getElementById('mediaInput').value = '';
            document.getElementById('postMediaPreview').classList.add('hidden');
            document.getElementById('previewContent').innerHTML = '';
        }

        // --- Audio Recorder ---
        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const status = document.getElementById('recordStatus');

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('recording-active');
                status.textContent = 'تم التسجيل';
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        // Init preview wavesurfer
                        document.getElementById('waveformPreview').classList.remove('hidden');
                        if(wavesurferRecorder) wavesurferRecorder.destroy();
                        wavesurferRecorder = WaveSurfer.create({
                            container: '#waveformPreview',
                            waveColor: '#4b5563',
                            progressColor: '#3b82f6',
                            height: 40,
                            barWidth: 2
                        });
                        wavesurferRecorder.loadBlob(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording-active');
                    status.textContent = 'جاري التسجيل...';
                } catch(e) {
                    alert('الميكروفون غير متاح');
                }
            }
        }

        async function submitPost() {
            const content = document.getElementById('postContentInput').value.trim();
            const fileInput = document.getElementById('mediaInput');
            const hasFile = fileInput.files.length > 0;
            const hasAudio = !!audioBlob;

            if(!content && !hasFile && !hasAudio) return;

            const btn = document.getElementById('submitPostBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const fd = new FormData();
            fd.append('content', content);
            if(hasFile) fd.append('media', fileInput.files[0]);
            if(hasAudio) fd.append('media', audioBlob, 'voice_note.webm');

            try {
                const res = await fetch(`/api/families/${familyId}/posts/create`, {
                    method: 'POST',
                    body: fd
                });
                const data = await res.json();
                if(res.ok && data.ok) {
                    closeCreatePostModal();
                    fetchPosts(); // Reload feed
                } else {
                    alert(data.error || 'فشل النشر');
                }
            } catch(e) {
                console.error(e);
                alert('خطأ في الاتصال');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'نشر';
            }
        }

        // --- Feed Logic ---
        async function fetchPosts() {
            const feed = document.getElementById('familyPostsFeed');
            try {
                const res = await fetch(`/api/families/${familyId}/posts`);
                const data = await res.json();
                
                if(res.ok && data.ok) {
                    const posts = data.posts || [];
                    if(posts.length === 0) {
                        feed.innerHTML = `<div class="text-center text-gray-500 py-10 opacity-70">
                            <i class="fas fa-box-open text-4xl mb-3"></i>
                            <p>لا توجد منشورات في العائلة بعد.</p>
                        </div>`;
                        return;
                    }
                    
                    feed.innerHTML = posts.map(p => renderPost(p)).join('');
                    
                    // Init WaveSurfers for audio posts
                    posts.forEach(p => {
                        if(p.media && p.media.type === 'audio') {
                            setTimeout(() => initPostWaveSurfer(p.postId, p.media.url), 100);
                        }
                    });
                }
            } catch(e) {
                feed.innerHTML = '<div class="text-center text-red-500">فشل تحميل المنشورات</div>';
            }
        }

        function renderPost(post) {
            const timeStr = new Date(post.timestamp).toLocaleString('ar-EG', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
            let mediaHtml = '';
            
            if(post.media) {
                if(post.media.type === 'image') {
                    mediaHtml = `<img src="${post.media.url}" class="w-full mt-3 rounded-lg border border-white/5 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image')">`;
                } else if (post.media.type === 'video') {
                    mediaHtml = `<video src="${post.media.url}" controls class="w-full mt-3 rounded-lg border border-white/5 bg-black max-h-96"></video>`;
                } else if (post.media.type === 'audio') {
                    mediaHtml = `<div class="mt-3 flex items-center gap-3 bg-white/5 p-3 rounded-xl border border-white/5">
                        <button id="playBtn-${post.postId}" onclick="toggleAudio('${post.postId}')" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white hover:bg-blue-500 transition"><i class="fas fa-play"></i></button>
                        <div id="waveform-${post.postId}" class="waveform-post flex-grow"></div>
                    </div>`;
                }
            }

            // Note: Likes/Comments need server endpoints. UI provided for visual completeness.
            return `
            <div class="glass-card p-4 mb-4 relative">
                <div class="flex items-center gap-3 mb-3">
                    <img src="${post.user.profile_picture_url || DEFAULT_AVATAR}" class="w-10 h-10 rounded-full border border-gray-600 object-cover">
                    <div>
                        <div class="font-bold text-white text-sm">${post.user.username}</div>
                        <div class="text-xs text-gray-500">${timeStr}</div>
                    </div>
                    ${(isCreator || post.userId === currentUserId) ? `<button onclick="deletePost('${post.postId}')" class="mr-auto text-gray-500 hover:text-red-400"><i class="fas fa-trash"></i></button>` : ''}
                </div>
                
                <p class="text-gray-200 text-sm whitespace-pre-wrap leading-relaxed">${post.content}</p>
                ${mediaHtml}
                
                <div class="flex items-center justify-between mt-4 pt-3 border-t border-white/5 text-gray-400 text-sm">
                   <div class="flex gap-4">
                        <button class="hover:text-red-400 flex items-center gap-1"><i class="far fa-heart"></i> <span>${post.likes || 0}</span></button>
                        <button class="hover:text-blue-400 flex items-center gap-1"><i class="far fa-comment"></i> <span>${post.commentsCount || 0}</span></button>
                   </div>
                </div>
            </div>`;
        }

        function initPostWaveSurfer(postId, url) {
            const container = document.querySelector(`#waveform-${postId}`);
            if(!container) return;
            
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4b5563',
                progressColor: '#3b82f6',
                barWidth: 2,
                height: 50,
                responsive: true
            });
            ws.load(url);
            ws.on('finish', () => {
                const btn = document.getElementById(`playBtn-${postId}`);
                if(btn) btn.innerHTML = '<i class="fas fa-play"></i>';
            });
            activeWaveSurfers[postId] = ws;
        }

        function toggleAudio(postId) {
            const ws = activeWaveSurfers[postId];
            if(!ws) return;
            const btn = document.getElementById(`playBtn-${postId}`);
            
            if(ws.isPlaying()) {
                ws.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                // pause others
                Object.keys(activeWaveSurfers).forEach(k => {
                    if(k !== postId && activeWaveSurfers[k].isPlaying()) {
                        activeWaveSurfers[k].pause();
                        const otherBtn = document.getElementById(`playBtn-${k}`);
                        if(otherBtn) otherBtn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                });
                ws.play();
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        }

        async function deletePost(postId) {
            if(!confirm('حذف هذا المنشور؟')) return;
            try {
                const res = await fetch(`/api/families/${familyId}/posts/${postId}`, { method: 'DELETE' });
                if(res.ok) fetchPosts();
            } catch(e) { alert('فشل الحذف'); }
        }

        function openMediaViewer(url, type) {
            const modal = document.getElementById('mediaViewerModal');
            const content = document.getElementById('mediaViewerContent');
            content.innerHTML = '';
            
            if(type === 'image') content.innerHTML = `<img src="${url}" class="max-h-[90vh] rounded-lg shadow-2xl">`;
            
            modal.classList.remove('hidden');
        }
        function closeMediaViewer() {
            document.getElementById('mediaViewerModal').classList.add('hidden');
            document.getElementById('mediaViewerContent').innerHTML = '';
        }

    </script>
</body>
</html>
