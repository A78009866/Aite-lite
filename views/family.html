<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>العائلة — Aite</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://unpkg.com/wavesurfer.js"></script>

  <style>
    :root{
      --bg:#000;
      --glass: rgba(10,10,12,0.58);
      --border: rgba(255,255,255,0.04);
      --muted:#aeb6bd;
      --accent:#e6eefb;
      --black-overlay: rgba(0,0,0,0.75);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:Inter,system-ui,Arial,-apple-system}
    a { color: inherit; text-decoration: none; }

    /* Topbar */
    header.topbar{
      position:sticky; top:0; z-index:60;
      background: linear-gradient(180deg, rgba(0,0,0,0.44), rgba(0,0,0,0.6));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .top-inner{
      max-width:1100px; margin:0 auto; padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .top-left, .top-center, .top-right { display:flex; align-items:center; gap:12px; }
    .btn{
      padding:8px 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--glass); color:var(--accent); cursor:pointer; font-weight:700;
      display:inline-flex; gap:8px; align-items:center;
    }
    .brand{font-weight:800; font-size:18px; letter-spacing:1px; }

    /* Hero */
    .family-hero{ width:100%; height:320px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#070707; }
    .family-hero img.cover{ width:100%; height:100%; object-fit:cover; filter:brightness(.6) saturate(.95); transform:scale(1.02); }
    .hero-overlay{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.6)); }
    .hero-center{ position:absolute; left:50%; transform:translateX(-50%); bottom:18%; text-align:center; z-index:22; display:flex; flex-direction:column; align-items:center; gap:10px; width:calc(100% - 32px); max-width:900px; }
    .family-avatar{ width:104px; height:104px; border-radius:999px; overflow:hidden; border:3px solid rgba(0,0,0,0.55); background:var(--glass); box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    .family-avatar img{ width:100%; height:100%; object-fit:cover }
    .family-name{ font-size:22px; font-weight:800; text-shadow:0 6px 20px rgba(0,0,0,0.6); }
    .family-meta{ color:var(--muted); font-size:13px; }

    /* main & posts */
    main.container{ max-width:1000px; margin:20px auto; padding:0 16px; }
    .controls-row{ display:flex; justify-content:flex-end; margin-bottom:12px; gap:8px; }
    .posts-list{ display:flex; flex-direction:column; gap:14px; }
    .family-post{ background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid var(--border); border-radius:12px; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,0.6); }
    .post-head{ display:flex; gap:12px; align-items:flex-start; }
    .post-avatar{ width:44px; height:44px; border-radius:999px; overflow:hidden; object-fit:cover; }
    .post-meta{ flex:1; }
    .post-username{ font-weight:700; }
    .post-time{ color:var(--muted); font-size:12px; margin-top:4px; }
    .post-body{ margin-top:10px; color:#dbe6ef; }
    .post-media img, .post-media video { width:100%; border-radius:10px; display:block; }
    .waveform { height:60px; background:#071028; border-radius:8px; overflow:hidden; }

    /* create modal */
    .modal-back{ position:fixed; inset:0; background:var(--black-overlay); display:none; align-items:center; justify-content:center; z-index:90; }
    .create-card{ width:100%; max-width:760px; border-radius:12px; padding:16px; background: linear-gradient(180deg, rgba(8,8,10,0.65), rgba(8,8,10,0.5)); border:1px solid var(--border); box-shadow: 0 20px 80px rgba(0,0,0,0.7); display:flex; flex-direction:column; gap:12px; }
    .field{ width:100%; padding:12px; border-radius:10px; background:transparent; border:1px solid var(--border); color:var(--accent); min-height:56px; resize:vertical; }
    .media-preview{ width:100%; height:220px; border-radius:10px; overflow:hidden; background:#080808; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .media-preview img, .media-preview video { width:100%; height:100%; object-fit:cover; display:block; }

    /* settings modal */
    .settings-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--black-overlay); z-index:100; }
    .settings-card{ width:100%; max-width:480px; border-radius:12px; padding:16px; background:#050505; border:1px solid var(--border); display:flex; flex-direction:column; gap:12px; }
    .settings-thumb{ width:100%; height:140px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
    .settings-thumb img{ width:100%; height:100%; object-fit:cover; }
    .settings-name{ font-weight:800; font-size:18px; }
    .settings-key{ padding:12px; border-radius:8px; background:#000; border:1px dashed rgba(255,255,255,0.04); color:var(--accent); font-family:monospace; text-align:center; }
    .settings-actions{ display:flex; gap:10px; justify-content:flex-end; }

    @media (max-width:720px){ .family-hero{ height:240px; } .family-avatar{ width:84px; height:84px; } .family-name{ font-size:18px; } .top-inner{ padding:10px; } }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar" role="banner">
    <div class="top-inner" role="navigation" aria-label="Site">
      <div class="top-left">
        <a href="/chat_list" class="btn"><i class="fas fa-arrow-left"></i> الرئيسية</a>
      </div>

      <div class="top-center">
        <div class="brand" aria-hidden="true">Aite</div>
      </div>

      <div class="top-right">
        <button id="openSettingsBtn" class="btn" title="إعدادات العائلة"><i class="fas fa-cog"></i></button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="family-hero" id="familyHero" role="region" aria-label="Cover">
    <img id="familyCoverImg" class="cover" src="https://via.placeholder.com/1400x600?text=Family+Cover" alt="صورة الغلاف">
    <div class="hero-overlay"></div>

    <div class="hero-center" aria-hidden="false">
      <div class="family-avatar" id="familyAvatarWrap"><img id="familyAvatar" src="https://via.placeholder.com/160?text=F" alt="صورة العائلة"></div>
      <div class="family-name" id="familyName">اسم العائلة</div>
      <div class="family-meta" id="familyMeta">0 عضو • خاص</div>
    </div>
  </section>

  <!-- Main -->
  <main class="container" role="main">
    <div class="controls-row" aria-hidden="false">
      <button id="createPostBtn" class="btn" style="display:none;"><i class="fas fa-plus"></i> إنشاء منشور بالعائلة</button>
    </div>

    <div id="postsList" class="posts-list" aria-live="polite">
      <!-- posts -->
    </div>
  </main>

  <!-- Create modal -->
  <div id="createModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" role="document" aria-labelledby="createTitle">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div id="createTitle" style="font-weight:800">منشور داخل العائلة</div>
        <button id="closeCreateModal" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <textarea id="familyPostContent" class="field" placeholder="اكتب محتوى المنشور..."></textarea>
      <div class="media-preview" id="postMediaPreview">لا توجد وسائط مرفوعة</div>

      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:8px">
          <input id="familyPostMedia" type="file" accept="image/*,video/*,audio/*" style="display:none" />
          <button class="btn" id="attachMediaBtn"><i class="fas fa-paperclip"></i> إرفاق</button>
          <div id="selectedMediaLabel" style="color:var(--muted)"></div>
        </div>

        <div style="display:flex;gap:8px">
          <button id="submitFamilyPostBtn" class="btn"><i class="fas fa-paper-plane"></i> نشر</button>
        </div>
      </div>

      <div id="postError" style="color:#ff8b8b; display:none"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="settings-modal" role="dialog" aria-modal="true" style="display:none;">
    <div class="settings-card" role="document" aria-labelledby="settingsTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="settingsTitle" style="font-weight:800">إعدادات العائلة</div>
        <button id="closeSettingsBtn" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <div class="settings-thumb"><img id="settingsImg" src="https://via.placeholder.com/800x400?text=Family" alt="صورة العائلة"></div>
      <div class="settings-name" id="settingsName">اسم العائلة</div>

      <div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">رمز الانضمام</div>
        <div id="settingsKey" class="settings-key">متاح فقط للمنشئ</div>
      </div>

      <div class="settings-actions">
        <button id="leaveBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b">مغادرة العائلة</button>
        <button id="deleteBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b;display:none">حذف العائلة</button>
        <button id="copyKeyBtn" class="btn">نسخ الرمز</button>
      </div>
    </div>
  </div>

  <script>
    const familyId = (window.location.pathname || '').split('/').pop();
    const familyCoverImg = document.getElementById('familyCoverImg');
    const familyAvatar = document.getElementById('familyAvatar');
    const familyName = document.getElementById('familyName');
    const familyMeta = document.getElementById('familyMeta');

    const postsList = document.getElementById('postsList');
    const createPostBtn = document.getElementById('createPostBtn');
    const createModal = document.getElementById('createModal');
    const closeCreateModal = document.getElementById('closeCreateModal');
    const attachMediaBtn = document.getElementById('attachMediaBtn');
    const familyPostMedia = document.getElementById('familyPostMedia');
    const postMediaPreview = document.getElementById('postMediaPreview');
    const submitFamilyPostBtn = document.getElementById('submitFamilyPostBtn');
    const familyPostContent = document.getElementById('familyPostContent');
    const postError = document.getElementById('postError');
    const selectedMediaLabel = document.getElementById('selectedMediaLabel');

    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const settingsImg = document.getElementById('settingsImg');
    const settingsName = document.getElementById('settingsName');
    const settingsKey = document.getElementById('settingsKey');
    const copyKeyBtn = document.getElementById('copyKeyBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    let currentFamily = null;
    let currentUserId = null;

    async function fetchProfile() {
      try {
        const res = await fetch('/api/profile', { credentials: 'same-origin' });
        if (!res.ok) return null;
        const d = await res.json();
        if (d && d.id) return d.id;
      } catch (e) {}
      return null;
    }

    async function fetchFamilyInfo() {
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/info`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          familyName.textContent = 'العائلة غير موجودة';
          familyMeta.textContent = '';
          postsList.innerHTML = `<div style="padding:16px;color:var(--muted)">العائلة غير موجودة.</div>`;
          return;
        }

        currentFamily = data.family || {};
        familyName.textContent = currentFamily.name || '—';
        familyCoverImg.src = currentFamily.imageUrl || familyCoverImg.src;
        familyAvatar.src = currentFamily.imageUrl || familyAvatar.src;

        // membersCount and membership display
        familyMeta.textContent = `${currentFamily.membersCount || 0} عضو${currentFamily.is_member ? '' : ' • خاص'}`;

        // fetch current user id
        currentUserId = await fetchProfile();

        // show create button to members
        if (currentFamily.is_member) {
          createPostBtn.style.display = 'inline-flex';
          loadFamilyPosts();
        } else {
          createPostBtn.style.display = 'none';
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">هذه العائلة خاصة. انضم باستخدام رمز العائلة لعرض المنشورات.</div>`;
        }

      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">خطأ في جلب بيانات العائلة.</div>`;
      }
    }

    async function loadFamilyPosts() {
      postsList.innerHTML = `<div style="padding:18px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">${(data && data.error) ? data.error : 'فشل جلب المنشورات'}</div>`;
          return;
        }

        const posts = data.posts || [];
        if (posts.length === 0) {
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">لا توجد منشورات داخل هذه العائلة بعد.</div>`;
          return;
        }

        postsList.innerHTML = posts.map(p => renderPostHtml(p)).join('');
        posts.forEach(p => { if (p.media && p.media.type === 'audio') initWave(p.postId, p.media.url); });
      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">خطأ في الاتصال</div>`;
      }
    }

    function renderPostHtml(post) {
      let mediaHtml = '';
      if (post.media) {
        if (post.media.type === 'image') mediaHtml = `<div class="post-media" style="margin-top:10px"><img src="${escapeHtml(post.media.url)}" alt="image"></div>`;
        else if (post.media.type === 'video') mediaHtml = `<div class="post-media" style="margin-top:10px"><video src="${escapeHtml(post.media.url)}" controls playsinline style="width:100%;border-radius:10px"></video></div>`;
        else if (post.media.type === 'audio') mediaHtml = `<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button id="audio-btn-${post.postId}" class="btn" style="padding:8px 10px"><i class="fas fa-play"></i></button><div id="wave-${post.postId}" class="waveform" style="flex:1"></div></div>`;
      }

      return `
        <article class="family-post" data-id="${escapeAttr(post.postId)}">
          <div class="post-head">
            <img src="${escapeHtml(post.user.profile_picture_url || 'https://via.placeholder.com/40')}" class="post-avatar" alt="${escapeHtml(post.user.username)}">
            <div class="post-meta">
              <div class="post-username">${escapeHtml(post.user.username || 'مستخدم')}</div>
              <div class="post-time">${new Date(post.timestamp || Date.now()).toLocaleString('ar-EG')}</div>
            </div>
            <div style="color:var(--muted);font-size:13px">${post.likes || 0} إعجاب</div>
          </div>
          <div class="post-body">${escapeHtml(post.content || '')}</div>
          ${mediaHtml}
        </article>
      `;
    }

    // create modal handlers (same as before)
    createPostBtn.addEventListener('click', () => openCreateModal());
    closeCreateModal.addEventListener('click', () => closeCreateModalFn());
    attachMediaBtn.addEventListener('click', () => familyPostMedia.click());
    familyPostMedia.addEventListener('change', handleMediaSelection);
    submitFamilyPostBtn.addEventListener('click', submitFamilyPost);

    function openCreateModal(){ familyPostContent.value=''; familyPostMedia.value=''; postMediaPreview.innerHTML='لا توجد وسائط مرفوعة'; selectedMediaLabel.textContent=''; postError.style.display='none'; createModal.style.display='flex'; document.body.style.overflow='hidden'; }
    function closeCreateModalFn(){ createModal.style.display='none'; document.body.style.overflow='auto'; }

    function handleMediaSelection(){ const f = familyPostMedia.files && familyPostMedia.files[0]; if(!f){ postMediaPreview.innerHTML='لا توجد وسائط مرفوعة'; selectedMediaLabel.textContent=''; return;} selectedMediaLabel.textContent = f.name; if(f.type.startsWith('image/')){ postMediaPreview.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="preview">`; } else if(f.type.startsWith('video/')){ postMediaPreview.innerHTML = `<video src="${URL.createObjectURL(f)}" controls playsinline></video>`; } else { postMediaPreview.innerHTML = `<div style="color:var(--muted)"><i class="fas fa-file-audio"></i> ${f.name}</div>`; } }

    async function submitFamilyPost(){ postError.style.display='none'; submitFamilyPostBtn.disabled=true; submitFamilyPostBtn.textContent='جارٍ النشر...'; const content = familyPostContent.value.trim(); const file = familyPostMedia.files && familyPostMedia.files[0]; if(!content && !file){ postError.textContent='المحتوى أو الوسائط مطلوب.'; postError.style.display='block'; submitFamilyPostBtn.disabled=false; submitFamilyPostBtn.textContent='نشر'; return;} try{ const fd = new FormData(); fd.append('content', content); if(file) fd.append('media', file); const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/create`, { method:'POST', credentials:'same-origin', body: fd }); const data = await res.json(); if(!res.ok || !data.ok){ postError.textContent = data.error || 'فشل في النشر'; postError.style.display='block'; return; } closeCreateModalFn(); await loadFamilyPosts(); } catch(err){ console.error(err); postError.textContent='خطأ في الاتصال'; postError.style.display='block'; } finally{ submitFamilyPostBtn.disabled=false; submitFamilyPostBtn.textContent='نشر'; } }

    // settings modal logic:
    openSettingsBtn.addEventListener('click', async () => {
      settingsImg.src = familyCoverImg.src;
      settingsName.textContent = familyName.textContent || 'العائلة';

      // first, request /api/families/:id/info to get creatorId (already available as currentFamily)
      if (!currentFamily) await fetchFamilyInfo();

      // determine current user id
      let profileId = null;
      try {
        const p = await fetch('/api/profile', { credentials: 'same-origin' });
        if (p.ok) {
          const pj = await p.json();
          profileId = pj.id;
        }
      } catch (e) {}

      // Fetch key endpoint (server should only return key to creator)
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/key`, { credentials: 'same-origin' });
        if (res.ok) {
          const d = await res.json();
          if (d && d.ok && d.key) {
            settingsKey.textContent = d.key;
            copyKeyBtn.style.display = 'inline-flex';
          } else {
            settingsKey.textContent = 'الرمز متاح فقط للمنشئ';
            copyKeyBtn.style.display = 'none';
          }
        } else {
          settingsKey.textContent = 'الرمز متاح فقط للالمنشئ';
          copyKeyBtn.style.display = 'none';
        }
      } catch (e) {
        settingsKey.textContent = 'الرمز متاح فقط للالمنشئ';
        copyKeyBtn.style.display = 'none';
      }

      // Show delete button only to creator
      const isCreator = currentFamily && currentFamily.creatorId && profileId && (currentFamily.creatorId === profileId);
      if (isCreator) {
        deleteBtn.style.display = 'inline-flex';
        leaveBtn.style.display = 'none'; // creator should delete instead of leave (or implement transfer)
      } else {
        deleteBtn.style.display = 'none';
        leaveBtn.style.display = 'inline-flex';
      }

      settingsModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    });

    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', closeSettings);
    function closeSettings(){ settingsModal.style.display = 'none'; document.body.style.overflow = 'auto'; }

    // copy key
    copyKeyBtn.addEventListener('click', async () => {
      const txt = settingsKey.textContent || '';
      if (!txt || txt.includes('متاح')) { alert('الرمز غير متاح'); return; }
      try {
        await navigator.clipboard.writeText(txt);
        copyKeyBtn.textContent = 'تم النسخ';
        setTimeout(()=> copyKeyBtn.textContent = 'نسخ الرمز', 1200);
      } catch (e) {
        alert('فشل النسخ');
      }
    });

    // leave family endpoint
    leaveBtn.addEventListener('click', async () => {
      if (!confirm('هل تريد فعلاً مغادرة هذه العائلة؟')) return;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/leave`, { method: 'POST', credentials: 'same-origin' });
        const d = await res.json().catch(()=>({}));
        if (res.ok && d.ok) {
          alert('تمت المغادرة');
          window.location.href = '/chat_list';
        } else {
          alert(d.error || 'فشل في المغادرة');
        }
      } catch (e) {
        console.error(e);
        alert('خطأ في الاتصال');
      }
    });

    // delete family endpoint (creator only)
    deleteBtn.addEventListener('click', async () => {
      if (!confirm('هل أنت متأكد أنك تريد حذف هذه العائلة نهائياً؟ هذا سيحذف كل المنشورات والبيانات الخاصة بها.')) return;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}`, { method: 'DELETE', credentials: 'same-origin' });
        const d = await res.json().catch(()=>({}));
        if (res.ok && d.ok) {
          alert('تم حذف العائلة');
          window.location.href = '/chat_list';
        } else {
          alert(d.error || 'فشل في حذف العائلة');
        }
      } catch (e) {
        console.error(e);
        alert('خطأ في الاتصال');
      }
    });

    // audio waves
    function initWave(postId, url) {
      const container = document.getElementById(`wave-${postId}`);
      if (!container) return;
      const ws = WaveSurfer.create({ container: container, waveColor: '#2b3b4d', progressColor: '#7c8b99', height:60, responsive:true, barWidth:3 });
      ws.load(url);
      const btn = document.getElementById(`audio-btn-${postId}`);
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (ws.isPlaying()) { ws.pause(); btn.innerHTML = '<i class="fas fa-play"></i>'; }
        else { ws.play(); btn.innerHTML = '<i class="fas fa-pause"></i>'; }
      });
      ws.on('finish', () => { btn.innerHTML = '<i class="fas fa-play"></i>'; });
    }

    function escapeHtml(s){ if(!s && s!==0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function escapeAttr(s){ if(!s && s!==0) return ''; return String(s).replace(/"/g,'&quot;'); }

    document.addEventListener('DOMContentLoaded', () => {
      if (!familyId) { document.body.innerHTML = '<div style="padding:24px;color:var(--muted)">معرف العائلة غير موجود.</div>'; return; }
      fetchFamilyInfo();
    });
  </script>
