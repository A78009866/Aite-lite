<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>العائلة — Aite</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://unpkg.com/wavesurfer.js"></script>

  <style>
    :root{
      --bg:#000;
      --glass: rgba(10,10,12,0.58);
      --border: rgba(255,255,255,0.04);
      --muted:#aeb6bd;
      --accent:#e6eefb;
      --black-overlay: rgba(0,0,0,0.75);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:Inter,system-ui,Arial,-apple-system}
    a { color: inherit; text-decoration: none; }

    /* Topbar */
    header.topbar{
      position:sticky; top:0; z-index:60;
      background: linear-gradient(180deg, rgba(0,0,0,0.44), rgba(0,0,0,0.6));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .top-inner{
      max-width:1100px; margin:0 auto; padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .top-left, .top-center, .top-right { display:flex; align-items:center; gap:12px; }
    .btn{
      padding:8px 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--glass); color:var(--accent); cursor:pointer; font-weight:700;
      display:inline-flex; gap:8px; align-items:center;
    }
    .brand{font-weight:800; font-size:18px; letter-spacing:1px; }

    /* Hero */
    .family-hero{ width:100%; height:320px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#070707; }
    .family-hero img.cover{ width:100%; height:100%; object-fit:cover; filter:brightness(.6) saturate(.95); transform:scale(1.02); }
    .hero-overlay{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.6)); }
    .hero-center{ position:absolute; left:50%; transform:translateX(-50%); bottom:18%; text-align:center; z-index:22; display:flex; flex-direction:column; align-items:center; gap:10px; width:calc(100% - 32px); max-width:900px; }
    .family-avatar{ width:104px; height:104px; border-radius:999px; overflow:hidden; border:3px solid rgba(0,0,0,0.55); background:var(--glass); box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    .family-avatar img{ width:100%; height:100%; object-fit:cover }
    .family-name{ font-size:22px; font-weight:800; text-shadow:0 6px 20px rgba(0,0,0,0.6); }
    .family-meta{ color:var(--muted); font-size:13px; }

    /* main & posts */
    main.container{ max-width:1000px; margin:20px auto; padding:0 16px; }
    .controls-row{ display:flex; justify-content:flex-end; margin-bottom:12px; gap:8px; }
    .posts-list{ display:flex; flex-direction:column; gap:14px; }
    .glass-post-card { background-color: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.06); border-radius:12px; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,0.6); }
    .waveform { height:60px; background:#071028; border-radius:8px; overflow:hidden; }

    /* modals and UI similar to home */
    .modal-back{ position:fixed; inset:0; background:var(--black-overlay); display:none; align-items:center; justify-content:center; z-index:90; }
    .create-card{ width:100%; max-width:760px; border-radius:12px; padding:16px; background: linear-gradient(180deg, rgba(8,8,10,0.65), rgba(8,8,10,0.5)); border:1px solid var(--border); box-shadow: 0 20px 80px rgba(0,0,0,0.7); display:flex; flex-direction:column; gap:12px; }
    .field{ width:100%; padding:12px; border-radius:10px; background:transparent; border:1px solid var(--border); color:var(--accent); min-height:56px; resize:vertical; }
    .media-preview{ width:100%; height:220px; border-radius:10px; overflow:hidden; background:#080808; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .media-preview img, .media-preview video { width:100%; height:100%; object-fit:cover; display:block; }

    .settings-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--black-overlay); z-index:100; }
    .settings-card{ width:100%; max-width:480px; border-radius:12px; padding:16px; background:#050505; border:1px solid var(--border); display:flex; flex-direction:column; gap:12px; }

    .confirm-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.7); z-index:110; }
    .confirm-card { width:100%; max-width:480px; border-radius:12px; padding:16px; background: linear-gradient(180deg, rgba(6,6,8,0.8), rgba(10,10,12,0.6)); border:1px solid rgba(255,255,255,0.04); color:var(--accent); box-shadow:0 20px 60px rgba(0,0,0,0.7); }

    @media (max-width:720px){ .family-hero{ height:240px; } .family-avatar{ width:84px; height:84px; } .family-name{ font-size:18px; } .top-inner{ padding:10px; } }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar" role="banner">
    <div class="top-inner" role="navigation" aria-label="Site">
      <div class="top-left">
        <a href="/chat_list" class="btn"><i class="fas fa-arrow-left"></i> الرئيسية</a>
      </div>

      <div class="top-center">
        <div class="brand" aria-hidden="true">Aite</div>
      </div>

      <div class="top-right">
        <button id="openSettingsBtn" class="btn" title="إعدادات العائلة"><i class="fas fa-cog"></i></button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="family-hero" id="familyHero" role="region" aria-label="Cover">
    <img id="familyCoverImg" class="cover" src="https://via.placeholder.com/1400x600?text=Family+Cover" alt="صورة الغلاف">
    <div class="hero-overlay"></div>

    <div class="hero-center" aria-hidden="false">
      <div class="family-avatar" id="familyAvatarWrap"><img id="familyAvatar" src="https://via.placeholder.com/160?text=F" alt="صورة العائلة"></div>
      <div class="family-name" id="familyName">اسم العائلة</div>
      <div class="family-meta" id="familyMeta">0 عضو • خاص</div>
    </div>
  </section>

  <!-- Main -->
  <main class="container" role="main">
    <div class="controls-row" aria-hidden="false">
      <button id="createPostBtn" class="btn" style="display:none;"><i class="fas fa-plus"></i> إنشاء منشور بالعائلة</button>
    </div>

    <div id="postsList" class="posts-list" aria-live="polite">
      <!-- posts -->
    </div>
  </main>

  <!-- Create modal -->
  <div id="createModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" role="document" aria-labelledby="createTitle">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div id="createTitle" style="font-weight:800">منشور داخل العائلة</div>
        <button id="closeCreateModal" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <textarea id="familyPostContent" class="field" placeholder="اكتب محتوى المنشور..."></textarea>
      <div class="media-preview" id="postMediaPreview">لا توجد وسائط مرفوعة</div>

      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:8px">
          <input id="familyPostMedia" type="file" accept="image/*,video/*,audio/*" style="display:none" />
          <button class="btn" id="attachMediaBtn"><i class="fas fa-paperclip"></i> إرفاق</button>
          <div id="selectedMediaLabel" style="color:var(--muted)"></div>
        </div>

        <div style="display:flex;gap:8px">
          <button id="submitFamilyPostBtn" class="btn"><i class="fas fa-paper-plane"></i> نشر</button>
        </div>
      </div>

      <div id="postError" style="color:#ff8b8b; display:none"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="settings-modal" role="dialog" aria-modal="true" style="display:none;">
    <div class="settings-card" role="document" aria-labelledby="settingsTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="settingsTitle" style="font-weight:800">إعدادات العائلة</div>
        <button id="closeSettingsBtn" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <div class="settings-thumb"><img id="settingsImg" src="https://via.placeholder.com/800x400?text=Family" alt="صورة العائلة"></div>
      <div class="settings-name" id="settingsName">اسم العائلة</div>

      <div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">رمز الانضمام</div>
        <div id="settingsKey" class="settings-key">متاح لأعضاء العائلة</div>
      </div>

      <div class="settings-actions">
        <button id="leaveBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b">مغادرة العائلة</button>
        <button id="deleteBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b;display:none">حذف العائلة</button>
        <button id="copyKeyBtn" class="btn" style="display:none">نسخ الرمز</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal (black glass) -->
  <div id="confirmModal" class="confirm-modal" aria-hidden="true">
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="confirmTitle" style="font-weight:800">تأكيد</div>
        <button id="closeConfirmModal" class="btn"><i class="fas fa-times"></i></button>
      </div>
      <div id="confirmMessage" style="margin-top:12px;color:var(--muted)"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
        <button id="confirmCancelBtn" class="btn" style="background:transparent">إلغاء</button>
        <button id="confirmOkBtn" class="btn" style="background:#111">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- Comment modal (bottom sheet like home) -->
  <div id="commentModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center glass-modal-bg transition-opacity duration-300">
    <div id="commentModalContent" class="glass-comment-modal-content w-full md:w-auto" onclick="event.stopPropagation()">
      <div class="md:hidden w-full flex justify-center" onclick="closeCommentModal()">
        <div class="modal-handle"></div>
      </div>

      <div class="flex justify-between items-center px-4 pb-2 pt-2 border-b border-gray-800">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          التعليقات 
          <span id="commentCountBadge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full text-gray-300">0</span>
        </h3>
        <button id="closeCommentModalBtn" class="close-btn-circle text-gray-300 hover:text-white" onclick="closeCommentModal()">
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>

      <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar bg-[#18191a] min-h-0"></div>

      <div class="p-3 border-t border-gray-800 bg-[#18191a]">
        <div id="commentError" class="text-red-500 text-xs text-center mb-2 hidden"></div>
        <div class="flex items-center gap-2 bg-[#242526] p-1.5 rounded-3xl border border-gray-700">
          <img id="myCurrentAvatar" src="" class="w-8 h-8 rounded-full object-cover border border-gray-600 ml-1">
          <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." 
                 class="flex-grow bg-transparent text-white text-sm px-2 focus:outline-none" 
                 dir="rtl" autocomplete="off">
          <button id="postCommentBtn" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition w-9 h-9 flex items-center justify-center flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fas fa-arrow-up text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_FAMILY_IMAGE = 'https://plus.unsplash.com/premium_vector-1682298522309-88e4dc1ccc4d?q=80&w=1125&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D';
    const DEFAULT_PROFILE_PIC = 'https://res.cloudinary.com/duixjs8az/image/upload/v1765009560/post_media/1765009560909-default_profile.png';
    const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

    const familyId = (window.location.pathname || '').split('/').pop();
    const familyCoverImg = document.getElementById('familyCoverImg');
    const familyAvatar = document.getElementById('familyAvatar');
    const familyName = document.getElementById('familyName');
    const familyMeta = document.getElementById('familyMeta');

    const postsList = document.getElementById('postsList');
    const createPostBtn = document.getElementById('createPostBtn');
    const createModal = document.getElementById('createModal');
    const closeCreateModal = document.getElementById('closeCreateModal');
    const attachMediaBtn = document.getElementById('attachMediaBtn');
    const familyPostMedia = document.getElementById('familyPostMedia');
    const postMediaPreview = document.getElementById('postMediaPreview');
    const submitFamilyPostBtn = document.getElementById('submitFamilyPostBtn');
    const familyPostContent = document.getElementById('familyPostContent');
    const postError = document.getElementById('postError');
    const selectedMediaLabel = document.getElementById('selectedMediaLabel');

    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const settingsImg = document.getElementById('settingsImg');
    const settingsName = document.getElementById('settingsName');
    const settingsKey = document.getElementById('settingsKey');
    const copyKeyBtn = document.getElementById('copyKeyBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    const confirmModal = document.getElementById('confirmModal');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmOkBtn = document.getElementById('confirmOkBtn');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const closeConfirmModal = document.getElementById('closeConfirmModal');

    const commentModal = document.getElementById('commentModal');
    const commentModalContent = document.getElementById('commentModalContent');
    const closeCommentModalBtn = document.getElementById('closeCommentModalBtn');
    const commentsList = document.getElementById('commentsList');
    const newCommentInput = document.getElementById('newCommentInput');
    const postCommentBtn = document.getElementById('postCommentBtn');
    const myCurrentAvatar = document.getElementById('myCurrentAvatar');

    let currentFamily = null;
    let currentUserId = null;
    let viewingPostIdForComments = null;
    let activeWaveSurfer = null;
    let activeVideo = null;

    function escapeHtml(s){ if(!s && s!==0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function escapeAttr(s){ if(!s && s!==0) return ''; return String(s).replace(/"/g,'&quot;'); }

    async function fetchProfileFull() {
      try {
        const res = await fetch('/api/profile', { credentials: 'same-origin' });
        if (!res.ok) return null;
        const json = await res.json();
        if (json && json.ok) return json;
      } catch(e){}
      return null;
    }

    async function fetchFamilyInfo() {
      if (!familyId) return;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/info`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          familyName.textContent = 'العائلة غير موجودة';
          familyMeta.textContent = '';
          postsList.innerHTML = `<div style="padding:16px;color:var(--muted)">العائلة غير موجودة.</div>`;
          return;
        }

        currentFamily = data.family || {};
        familyName.textContent = currentFamily.name || '—';
        const img = currentFamily.imageUrl || DEFAULT_FAMILY_IMAGE;
        familyCoverImg.src = img;
        familyAvatar.src = img;

        const memberText = `${currentFamily.membersCount || 0} عضو`;
        familyMeta.textContent = currentFamily.is_member ? memberText : `${memberText} • خاص`;

        const profile = await fetchProfileFull();
        currentUserId = profile ? profile.id : null;
        if (currentFamily.is_member) {
          createPostBtn.style.display = 'inline-flex';
          loadFamilyPosts();
        } else {
          createPostBtn.style.display = 'none';
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">هذه العائلة خاصة. انضم لاطلاع المنشورات.</div>`;
        }
      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">خطأ في جلب بيانات العائلة.</div>`;
      }
    }

    // create post card identical to home feed (but wired to family endpoints)
    function createFamilyPostCard(post) {
      let mediaContent = '';
      if (post.media) {
        if (post.media.type === 'image') {
          mediaContent = `<div class="mt-3 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image', event)"><img src="${post.media.url}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg"></div>`;
        } else if (post.media.type === 'video') {
          mediaContent = `
            <div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group">
              <video id="video-${post.postId}" src="${post.media.url}" class="w-full h-full object-contain" preload="metadata" onclick="toggleVideoPlay('${post.postId}', event)"></video>
              <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)">
                <i class="fas fa-play text-white text-5xl"></i>
              </div>
              <div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center opacity-0 group-hover:opacity-100">
                <button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400"><i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i></button>
                <div class="flex-grow h-1 bg-gray-500 rounded-full relative" onclick="seekVideo('${post.postId}', event)"><div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div></div>
                <span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span>
              </div>
            </div>
          `;
        } else if (post.media.type === 'audio') {
          mediaContent = `<div class="mt-3 flex items-center space-x-3 bg-gray-800 p-3 rounded-lg"><button class="audio-play-button text-white text-xl"><i class="fas fa-play"></i></button><div id="waveform-${post.postId}" class="waveform flex-grow"></div></div>`;
        }
      }

      const verifiedBadgeHtml = post.user && post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="موثق">` : '';
      const onlineDotHtml = post.user && post.user.is_online ? `<span class="online-dot online-dot-small"></span>` : '';
      const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
      const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';

      const canDelete = (currentUserId && (post.user && post.user.userId === currentUserId)) || (currentFamily && currentFamily.creatorId === currentUserId);

      return `
        <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${escapeAttr(post.postId)}" id="family-post-${escapeAttr(post.postId)}">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center">
              <a href="/profile?userId=${post.user.userId}" class="avatar-with-dot">
                <img src="${escapeAttr(post.user.profile_picture_url || DEFAULT_PROFILE_PIC)}" alt="${escapeHtml(post.user.username)}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600">
                ${onlineDotHtml}
              </a>
              <div>
                <a href="/profile?userId=${post.user.userId}" class="text-white font-semibold hover:text-blue-400">${escapeHtml(post.user.username)} ${verifiedBadgeHtml}</a>
                <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
              </div>
            </div>

            <div style="display:flex;gap:8px;align-items:center">
              <div style="color:var(--muted);font-size:13px">${post.likes || 0} إعجاب</div>
              ${canDelete ? `<button class="btn" style="padding:6px 8px" onclick="confirmDeleteFamilyPost('${escapeAttr(post.postId)}', event)"><i class="fas fa-trash"></i></button>` : ''}
              <button class="text-gray-400 hover:text-white" onclick="openPostOptions('${escapeAttr(post.postId)}','${escapeAttr(post.user.userId)}', event)"><i class="fas fa-ellipsis-v"></i></button>
            </div>
          </div>

          <p class="text-gray-200 whitespace-pre-wrap">${escapeHtml(post.content || '')}</p>

          ${mediaContent}

          <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
            <span><i class="fas fa-heart ml-1"></i> ${post.likes} إعجاب</span>
            <span class="cursor-pointer hover:text-blue-400 comment-count-display" onclick="openFamilyComments('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount || 0} تعليق</span>
          </div>

          <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
            <button class="flex items-center ${likeButtonClass} hover:text-red-500 transition duration-300 w-full justify-center post-like-button gap-2" data-is-liked="${post.is_liked}" onclick="handleFamilyLike('${post.postId}', this)">
              <i class="${likeIconClass} ml-2 like-icon text-lg"></i>
              <span class="text-sm font-medium">إعجاب</span>
            </button>
            <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center gap-2" onclick="openFamilyComments('${post.postId}')">
              <i class="fas fa-comment-dots text-lg"></i>
              <span class="text-sm font-medium">تعليق</span>
            </button>
          </div>
        </div>
      `;
    }

    // load posts for family
    async function loadFamilyPosts() {
      postsList.innerHTML = `<div style="padding:18px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">${(data && data.error) ? data.error : 'فشل جلب المنشورات'}</div>`;
          return;
        }

        const posts = data.posts || [];
        if (posts.length === 0) {
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">لا توجد منشورات داخل هذه العائلة بعد.</div>`;
          return;
        }

        postsList.innerHTML = '';
        const audioInit = [];
        posts.forEach(p => {
          postsList.insertAdjacentHTML('beforeend', createFamilyPostCard(p));
          if (p.media && p.media.type === 'audio') audioInit.push({ postId: p.postId, url: p.media.url });
        });

        setTimeout(() => {
          audioInit.forEach(a => initWave(a.postId, a.url));
        }, 100);
      } catch (e) {
        console.error(e);
        postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">خطأ في الاتصال</div>`;
      }
    }

    // Like family post
    async function handleFamilyLike(postId, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/like`, {
          method: 'POST',
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          const postEl = document.getElementById(`family-post-${postId}`);
          if (postEl) {
            const likesDiv = postEl.querySelector('.post-head > div:last-child > div:first-child') || postEl.querySelector('.flex.items-start > div:last-child');
            // update count display
            const likesText = postEl.querySelector('.post-head') ? postEl.querySelector('.post-head').querySelector('[style*="color:var(--muted)"]') : null;
            // simplest approach: reload posts to reflect updated states
            loadFamilyPosts();
          }
        } else {
          console.warn('like failed', data);
        }
      } catch (e) { console.error(e); }
      finally { btn.disabled = false; }
    }

    // open comments modal for family post
    async function openFamilyComments(postId) {
      viewingPostIdForComments = postId;
      commentsList.innerHTML = `<div style="padding:18px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      commentModal.classList.remove('hidden');
      setTimeout(() => commentModalContent.classList.add('open'), 10);
      const profile = await fetchProfileFull();
      if (profile) { myCurrentAvatar.src = profile.profile_picture_url || DEFAULT_PROFILE_PIC; currentUserId = profile.id; }
      await loadFamilyComments(postId);
    }

    async function loadFamilyComments(postId) {
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/comments`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          commentsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">${(data && data.error) ? data.error : 'فشل جلب التعليقات'}</div>`;
          return;
        }
        const comments = data.comments || [];
        if (comments.length === 0) {
          commentsList.innerHTML = `<div style="padding:18px;color:var(--muted)">لا توجد تعليقات بعد.</div>`;
          document.getElementById('commentCountBadge').innerText = '0';
          updatePostCommentCount(postId, 0);
          return;
        }
        commentsList.innerHTML = comments.map(c => renderCommentHtml(c, postId)).join('');
        document.getElementById('commentCountBadge').innerText = comments.length;
        updatePostCommentCount(postId, comments.length);
      } catch (e) {
        console.error(e);
        commentsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">خطأ في الاتصال</div>`;
      }
    }

    function renderCommentHtml(comment, postId) {
      const likedClass = comment.is_liked ? 'text-red-400' : 'text-gray-400';
      const likeIcon = comment.is_liked ? 'fas' : 'far';
      const repliesPreviewHtml = (comment.recentReplies && comment.recentReplies.length) ? comment.recentReplies.map(r => `
        <div class="reply-item flex items-start gap-2">
          <img src="${escapeAttr(r.profile_picture_url || DEFAULT_PROFILE_PIC)}" class="small-avatar" alt="${escapeHtml(r.username)}">
          <div><div class="text-xs font-bold">${escapeHtml(r.username)}</div><div class="text-sm">${escapeHtml(r.content)}</div></div>
        </div>
      `).join('') : '';

      const canDeleteComment = (currentUserId && currentUserId === (comment.user && comment.user.userId)) || (currentFamily && currentFamily.creatorId === currentUserId);

      return `
        <div class="comment-item" id="comment-${comment.commentId}">
          <div class="flex items-start gap-3">
            <img src="${escapeAttr(comment.user.profile_picture_url || DEFAULT_PROFILE_PIC)}" class="w-8 h-8 rounded-full">
            <div class="flex-1">
              <div style="display:flex;justify-content:space-between">
                <div>
                  <div style="font-weight:800">${escapeHtml(comment.user.username)}</div>
                  <div style="color:var(--muted);font-size:12px">${new Date(comment.timestamp).toLocaleString('ar-EG')}</div>
                </div>
                <div style="display:flex;gap:8px">
                  <button class="${likedClass}" onclick="toggleFamilyCommentLike('${postId}','${comment.commentId}', this)"><i class="${likeIcon} fa-heart"></i> <span id="comment-like-count-${comment.commentId}">${comment.likes||0}</span></button>
                  <button onclick="openReplyBox('${comment.commentId}')"><i class="fas fa-reply"></i></button>
                  ${canDeleteComment ? `<button onclick="confirmDeleteFamilyComment('${postId}','${comment.commentId}')"><i class="fas fa-trash"></i></button>` : ''}
                </div>
              </div>
              <div style="margin-top:8px">${escapeHtml(comment.content)}</div>
              <div id="replies-container-${comment.commentId}">${repliesPreviewHtml}</div>
              <div id="reply-box-${comment.commentId}" style="display:none;margin-top:8px">
                <div style="display:flex;gap:8px;align-items:center">
                  <img src="${myCurrentAvatar.src}" style="width:32px;height:32px;border-radius:999px">
                  <input id="reply-input-${comment.commentId}" placeholder="أكتب رد..." style="flex:1;padding:8px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--accent)">
                  <button class="btn" onclick="postFamilyReply('${postId}','${comment.commentId}')"><i class="fas fa-paper-plane"></i></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function updatePostCommentCount(postId, count) {
      const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
      if (postCard) {
        const commentSpan = postCard.querySelector('.comment-count-display');
        if (commentSpan) commentSpan.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${count} تعليق`;
      }
    }

    async function toggleFamilyCommentLike(postId, commentId, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/comments/${encodeURIComponent(commentId)}/like`, {
          method: 'POST',
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          const countEl = document.getElementById(`comment-like-count-${commentId}`);
          if (countEl) countEl.textContent = data.likes;
          // reload comments to be safe
          await loadFamilyComments(postId);
        }
      } catch (e) { console.error(e); }
      finally { btn.disabled = false; }
    }

    function openReplyBox(commentId) {
      const box = document.getElementById(`reply-box-${commentId}`);
      if (!box) return;
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      const input = document.getElementById(`reply-input-${commentId}`);
      if (input) input.focus();
    }

    async function postFamilyReply(postId, commentId) {
      const input = document.getElementById(`reply-input-${commentId}`);
      if (!input) return;
      const content = input.value.trim();
      if (!content) return;
      input.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/comments/${encodeURIComponent(commentId)}/reply`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          await loadFamilyComments(postId);
        } else {
          alert(data.error || 'فشل في الإرسال');
        }
      } catch (e) { console.error(e); }
      finally { input.disabled = false; }
    }

    async function postFamilyComment() {
      const content = newCommentInput.value.trim();
      if (!content || !viewingPostIdForComments) return;
      postCommentBtn.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(viewingPostIdForComments)}/comment`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          newCommentInput.value = '';
          await loadFamilyComments(viewingPostIdForComments);
          await loadFamilyPosts(); // refresh counts
        } else {
          alert(data.error || 'فشل في الإرسال');
        }
      } catch (e) { console.error(e); }
      finally { postCommentBtn.disabled = false; }
    }

    postCommentBtn.addEventListener('click', postFamilyComment);
    newCommentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); postFamilyComment(); } });

    // delete family post with confirm
    function confirmDeleteFamilyPost(postId, event) {
      event.stopPropagation();
      showConfirm('هل أنت متأكد أنك تريد حذف هذا المنشور؟', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}`, { method: 'DELETE', credentials: 'same-origin' });
          const d = await res.json();
          if (res.ok && d.ok) {
            await loadFamilyPosts();
          } else {
            alert(d.error || 'فشل في الحذف');
          }
        } catch (e) { console.error(e); alert('خطأ في الاتصال'); }
      });
    }

    function confirmDeleteFamilyComment(postId, commentId) {
      // placeholder: server endpoint for deleting family comment not implemented in this UI
      showConfirm('حذف التعليق (إن كان مدعوماً من الخادم).', async () => {
        await loadFamilyComments(postId);
      });
    }

    // settings modal: fetch key and show to all members (server endpoint now allows members)
    openSettingsBtn.addEventListener('click', async () => {
      settingsImg.src = familyCoverImg.src || DEFAULT_FAMILY_IMAGE;
      settingsName.textContent = familyName.textContent || 'العائلة';
      if (!currentFamily) await fetchFamilyInfo();
      const profile = await fetchProfileFull();
      const profileId = profile ? profile.id : null;
      currentUserId = profileId;

      try {
        // request key (server now returns for members)
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/key`, { credentials: 'same-origin' });
        if (res.ok) {
          const d = await res.json();
          if (d && d.ok && d.key) {
            settingsKey.textContent = d.key;
            copyKeyBtn.style.display = 'inline-flex';
          } else {
            settingsKey.textContent = 'الرمز غير متاح';
            copyKeyBtn.style.display = 'none';
          }
        } else {
          settingsKey.textContent = 'الرمز غير متاح';
          copyKeyBtn.style.display = 'none';
        }
      } catch (e) {
        console.error(e);
        settingsKey.textContent = 'الرمز غير متاح';
        copyKeyBtn.style.display = 'none';
      }

      // show delete button only to creator
      const isCreator = currentFamily && currentFamily.creatorId && profileId && (currentFamily.creatorId === profileId);
      if (isCreator) { deleteBtn.style.display = 'inline-flex'; leaveBtn.style.display = 'none'; }
      else { deleteBtn.style.display = 'none'; leaveBtn.style.display = 'inline-flex'; }

      settingsModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    });

    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettings(); });
    function closeSettings(){ settingsModal.style.display = 'none'; document.body.style.overflow = 'auto'; }

    copyKeyBtn.addEventListener('click', async () => {
      const txt = settingsKey.textContent || '';
      if (!txt || txt.includes('غير متاح')) { alert('الرمز غير متاح'); return; }
      try {
        await navigator.clipboard.writeText(txt);
        copyKeyBtn.textContent = 'تم النسخ';
        setTimeout(()=> copyKeyBtn.textContent = 'نسخ الرمز', 1200);
      } catch (e) { alert('فشل النسخ'); }
    });

    leaveBtn.addEventListener('click', () => {
      showConfirm('هل تريد فعلاً مغادرة هذه العائلة؟', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/leave`, { method: 'POST', credentials: 'same-origin' });
          const d = await res.json();
          if (res.ok && d.ok) {
            window.location.href = '/chat_list';
          } else {
            alert(d.error || 'فشل في المغادرة');
          }
        } catch (e) { console.error(e); alert('خطأ في الاتصال'); }
      });
    });

    deleteBtn.addEventListener('click', () => {
      showConfirm('هل أنت متأكد أنك تريد حذف هذه العائلة نهائياً؟', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}`, { method: 'DELETE', credentials: 'same-origin' });
          const d = await res.json();
          if (res.ok && d.ok) {
            window.location.href = '/chat_list';
          } else {
            alert(d.error || 'فشل في الحذف');
          }
        } catch (e) { console.error(e); alert('خطأ في الاتصال'); }
      });
    });

    function showConfirm(message, onOk) {
      confirmMessage.textContent = message;
      confirmModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      function cleanup() { confirmModal.style.display = 'none'; document.body.style.overflow = 'auto'; confirmOkBtn.removeEventListener('click', ok); confirmCancelBtn.removeEventListener('click', cancel); closeConfirmModal.removeEventListener('click', cancel); }
      function ok(){ cleanup(); if (onOk) onOk(); }
      function cancel(){ cleanup(); }
      confirmOkBtn.addEventListener('click', ok);
      confirmCancelBtn.addEventListener('click', cancel);
      closeConfirmModal.addEventListener('click', cancel);
    }

    // comment modal close
    closeCommentModalBtn.addEventListener('click', () => {
      commentModalContent.classList.remove('open');
      setTimeout(() => { commentModal.classList.add('hidden'); document.body.style.overflow = 'auto'; viewingPostIdForComments = null; commentsList.innerHTML=''; newCommentInput.value=''; }, 250);
    });
    commentModal.addEventListener('click', (e) => { if (e.target === commentModal) closeCommentModalBtn.click(); });

    // open post options (bottom sheet) - uses existing postOptionsModal in home if desired; here we simply support add friend / delete via confirm
    function openPostOptions(postId, userId, event) {
      event.stopPropagation();
      // if owner, show delete option, else show add friend
      if (currentUserId && userId === currentUserId) {
        showConfirm('حذف المنشور؟', async () => { await confirmDeleteFamilyPost(postId, event); });
      } else {
        // send friend request
        showConfirm('إرسال طلب صداقة لهذا المستخدم؟', async () => {
          try {
            const res = await fetch('/api/friends/request', { method: 'POST', credentials: 'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ to_id: userId }) });
            const d = await res.json();
            alert((res.ok && d.ok) ? 'تم إرسال الطلب' : (d.error || 'فشل الإرسال'));
          } catch (e) { console.error(e); alert('خطأ في الاتصال'); }
        });
      }
    }

    // audio waveform init
    function initWave(postId, url) {
      const container = document.getElementById(`waveform-${postId}`);
      if (!container) return;
      const ws = WaveSurfer.create({ container: container, waveColor: '#2b3b4d', progressColor: '#7c8b99', height:60, responsive:true, barWidth:3 });
      ws.load(url);
      const btn = document.querySelector(`#family-post-${postId} .audio-play-button`);
      if (btn) {
        btn.addEventListener('click', () => {
          if (ws.isPlaying()) { ws.pause(); btn.innerHTML = '<i class="fas fa-play"></i>'; }
          else { ws.play(); btn.innerHTML = '<i class="fas fa-pause"></i>'; }
        });
        ws.on('finish', () => { btn.innerHTML = '<i class="fas fa-play"></i>'; });
      }
    }

    // video controls (reuse simple toggle functions from home)
    function toggleVideoPlay(postId, event) {
      event.stopPropagation();
      const video = document.getElementById(`video-${postId}`);
      if (!video) return;
      const controlIcon = document.getElementById(`control-icon-${postId}`);
      const playOverlay = document.getElementById(`play-overlay-${postId}`);
      if (video.paused) {
        video.play();
        if (playOverlay) playOverlay.style.display = 'none';
        if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
        activeVideo = video;
      } else {
        video.pause();
        if (playOverlay) playOverlay.style.display = 'flex';
        if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
        activeVideo = null;
      }
    }

    function seekVideo(postId, event) {
      const video = document.getElementById(`video-${postId}`);
      const bar = event.currentTarget;
      const rect = bar.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const pct = x / rect.width;
      if (video && video.duration) video.currentTime = pct * video.duration;
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp || Date.now());
      const now = new Date();
      const diffInHours = (now - date) / (1000 * 60 * 60);
      if (diffInHours < 24) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      if (diffInHours < 7 * 24) return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
      return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // media viewer for images
    function openMediaViewer(url, type, event) {
      event.stopPropagation();
      if (type !== 'image') return;
      const modal = document.getElementById('mediaViewerModal');
      const content = document.getElementById('mediaViewerContent');
      content.innerHTML = `<img src="${url}" alt="media" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px">`;
      modal.classList.remove('hidden');
    }
    function closeMediaViewer(event) {
      const modal = document.getElementById('mediaViewerModal');
      const content = document.getElementById('mediaViewerContent');
      modal.classList.add('hidden');
      content.innerHTML = '';
    }

    // init
    document.addEventListener('DOMContentLoaded', () => {
      if (!familyId) { document.body.innerHTML = '<div style="padding:24px;color:var(--muted)">معرف العائلة غير موجود.</div>'; return; }
      familyCoverImg.src = DEFAULT_FAMILY_IMAGE;
      familyAvatar.src = DEFAULT_FAMILY_IMAGE;
      fetchFamilyInfo();
    });

  </script>
</body>
</html>
