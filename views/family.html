<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>العائلة — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://unpkg.com/wavesurfer.js"></script>
  <style>
    body { background:#000; color:#e6eefb; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .glass { background: rgba(10,10,12,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.05); }
    .field { background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04); color:#e6eefb; }
    .btn-primary { background: linear-gradient(90deg,#2563eb,#7c3aed); }
    .btn-primary:hover { opacity:0.95; }
    .glass-post-card { background-color: rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:12px; }
  </style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-40 glass p-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="/chat_list" class="text-white font-bold">Aite</a>
      <div class="flex items-center gap-3">
        <a href="/chat_list" class="text-gray-300 hover:text-white">الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    <div id="familyHeader" class="glass rounded-xl p-4 flex gap-4 items-center">
      <img id="familyHeaderImg" src="https://via.placeholder.com/240x140?text=Family" class="w-32 h-20 rounded-md object-cover border border-gray-700" alt="family image">
      <div class="flex-1">
        <div class="flex items-center justify-between">
          <div>
            <h2 id="familyName" class="text-2xl font-bold">اسم العائلة</h2>
            <div id="familyMeta" class="text-sm text-gray-300 mt-1">... </div>
          </div>
          <div>
            <button id="createFamilyPostBtn" class="btn-primary text-white px-3 py-2 rounded-lg hidden"><i class="fas fa-plus ml-2"></i> إنشاء منشور بالعائلة</button>
          </div>
        </div>
        <p id="familyDescription" class="text-sm text-gray-400 mt-2 hidden"></p>
      </div>
    </div>

    <div id="notMemberBox" class="mt-4 glass rounded-xl p-4 hidden">
      <h3 class="text-lg font-bold">الانضمام إلى العائلة</h3>
      <p class="text-sm text-gray-300">هذه العائلة خاصة. أدخل رمز العائلة للانضمام وعرض المنشورات.</p>
      <div class="mt-3 flex gap-2">
        <input id="joinKeyInput" class="field flex-1 p-3 rounded" placeholder="رمز العائلة" />
        <button id="joinKeyBtn" class="px-4 py-2 bg-green-600 rounded text-white">انضم الآن</button>
      </div>
      <div id="joinError" class="text-sm text-red-400 mt-2 hidden"></div>
    </div>

    <section id="familyPostsSection" class="mt-6">
      <div id="postsFeed" class="space-y-4">
        <!-- family posts -->
      </div>
    </section>
  </main>

  <!-- Create post modal -->
  <div id="createPostModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
    <div class="max-w-lg w-full glass rounded-xl p-4 border border-gray-700">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-bold">منشور داخل العائلة</h3>
        <button onclick="closeCreatePostModal()" class="text-gray-300 hover:text-white"><i class="fas fa-times"></i></button>
      </div>

      <div class="space-y-3">
        <textarea id="familyPostContent" rows="4" class="field w-full p-3 rounded" placeholder="اكتب ما تريد..."></textarea>
        <div class="flex items-center gap-3">
          <input id="familyPostMedia" type="file" accept="image/*,video/*,audio/*" class="hidden" />
          <button onclick="document.getElementById('familyPostMedia').click()" class="px-3 py-2 border border-gray-700 rounded text-gray-200">إضافة وسائط</button>
          <span id="selectedMediaName" class="text-sm text-gray-300"></span>
        </div>

        <div id="postError" class="text-sm text-red-400 hidden"></div>

        <div class="flex gap-3">
          <button id="submitFamilyPostBtn" class="btn-primary text-white px-4 py-2 rounded">نشر في العائلة</button>
          <button onclick="closeCreatePostModal()" class="px-4 py-2 rounded border border-gray-700 text-gray-300">إلغاء</button>
        </div>
      </div>
    </div>
  </div>

  <!-- media viewer -->
  <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onclick="closeMediaViewer(event)">
    <div id="mediaViewerContent" class="max-w-3xl w-full" onclick="event.stopPropagation()"></div>
  </div>

  <script>
    const familyIdFromPath = (window.location.pathname || '').split('/').pop();
    const familyNameEl = document.getElementById('familyName');
    const familyHeaderImg = document.getElementById('familyHeaderImg');
    const familyMeta = document.getElementById('familyMeta');
    const createFamilyPostBtn = document.getElementById('createFamilyPostBtn');
    const notMemberBox = document.getElementById('notMemberBox');
    const joinKeyInput = document.getElementById('joinKeyInput');
    const joinKeyBtn = document.getElementById('joinKeyBtn');
    const joinError = document.getElementById('joinError');
    const postsFeed = document.getElementById('postsFeed');

    const createPostModal = document.getElementById('createPostModal');
    const familyPostContent = document.getElementById('familyPostContent');
    const familyPostMedia = document.getElementById('familyPostMedia');
    const selectedMediaName = document.getElementById('selectedMediaName');
    const submitFamilyPostBtn = document.getElementById('submitFamilyPostBtn');
    const postError = document.getElementById('postError');

    const mediaViewerModal = document.getElementById('mediaViewerModal');
    const mediaViewerContent = document.getElementById('mediaViewerContent');

    let isMember = false;
    let currentFamily = null;

    async function fetchFamilyInfo() {
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyIdFromPath)}/info`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          familyNameEl.textContent = 'العائلة غير موجودة';
          familyMeta.textContent = '';
          return;
        }

        currentFamily = data.family || {};
        familyNameEl.textContent = currentFamily.name || '—';
        familyHeaderImg.src = currentFamily.imageUrl || 'https://via.placeholder.com/240x140?text=Family';
        familyMeta.textContent = `${currentFamily.membersCount || 0} عضو`;
        isMember = !!currentFamily.is_member;

        if (isMember) {
          notMemberBox.classList.add('hidden');
          createFamilyPostBtn.classList.remove('hidden');
          await loadFamilyPosts();
        } else {
          notMemberBox.classList.remove('hidden');
          createFamilyPostBtn.classList.add('hidden');
          postsFeed.innerHTML = '<div class="text-sm text-gray-400 mt-4">انضم لتشاهد منشورات هذه العائلة.</div>';
        }

      } catch (err) {
        console.error('fetchFamilyInfo', err);
      }
    }

    joinKeyBtn.addEventListener('click', async () => {
      const key = joinKeyInput.value.trim();
      if (!key) {
        joinError.textContent = 'الرجاء إدخال رمز صالح.';
        joinError.classList.remove('hidden');
        return;
      }
      joinError.classList.add('hidden');
      joinKeyBtn.disabled = true;
      joinKeyBtn.textContent = 'جاري...';

      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyIdFromPath)}/join`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          joinError.textContent = data.error || 'فشل في الانضمام.';
          joinError.classList.remove('hidden');
          return;
        }
        // success -> reload page state
        await fetchFamilyInfo();
      } catch (e) {
        console.error(e);
        joinError.textContent = 'خطأ في الاتصال.';
        joinError.classList.remove('hidden');
      } finally {
        joinKeyBtn.disabled = false;
        joinKeyBtn.textContent = 'انضم الآن';
      }
    });

    // create post
    createFamilyPostBtn.addEventListener('click', () => {
      openCreatePostModal();
    });

    function openCreatePostModal() {
      familyPostContent.value = '';
      familyPostMedia.value = '';
      selectedMediaName.textContent = '';
      postError.classList.add('hidden');
      createPostModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeCreatePostModal() {
      createPostModal.classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    familyPostMedia.addEventListener('change', () => {
      const f = familyPostMedia.files && familyPostMedia.files[0];
      selectedMediaName.textContent = f ? f.name : '';
    });

    submitFamilyPostBtn.addEventListener('click', async () => {
      postError.classList.add('hidden');
      submitFamilyPostBtn.disabled = true;
      submitFamilyPostBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ...';

      const content = familyPostContent.value.trim();
      const file = familyPostMedia.files && familyPostMedia.files[0];

      if (!content && !file) {
        postError.textContent = 'المحتوى أو وسائط مطلوب.';
        postError.classList.remove('hidden');
        submitFamilyPostBtn.disabled = false;
        submitFamilyPostBtn.innerHTML = 'نشر في العائلة';
        return;
      }

      try {
        const fd = new FormData();
        fd.append('content', content);
        if (file) fd.append('media', file);

        const res = await fetch(`/api/families/${encodeURIComponent(familyIdFromPath)}/posts/create`, {
          method: 'POST',
          credentials: 'same-origin',
          body: fd
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          postError.textContent = data.error || 'فشل في النشر';
          postError.classList.remove('hidden');
          return;
        }
        closeCreatePostModal();
        await loadFamilyPosts();
      } catch (e) {
        console.error(e);
        postError.textContent = 'خطأ في الاتصال.';
        postError.classList.remove('hidden');
      } finally {
        submitFamilyPostBtn.disabled = false;
        submitFamilyPostBtn.innerHTML = 'نشر في العائلة';
      }
    });

    // load family posts (members only)
    async function loadFamilyPosts() {
      postsFeed.innerHTML = '<div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المنشورات...</div>';
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyIdFromPath)}/posts`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          postsFeed.innerHTML = `<div class="text-sm text-red-400 p-4">${(data && data.error) ? data.error : 'لا يمكن جلب المنشورات.'}</div>`;
          return;
        }

        const posts = data.posts || [];
        if (posts.length === 0) {
          postsFeed.innerHTML = '<div class="text-center text-gray-400 p-6">لا توجد منشورات في هذه العائلة بعد.</div>';
          return;
        }

        postsFeed.innerHTML = posts.map(p => familyPostHtml(p)).join('');
        // initialize wavesurfer for audio posts if any
        posts.forEach(p => {
          if (p.media && p.media.type === 'audio') initializeWave(p.postId, p.media.url);
        });

      } catch (e) {
        console.error(e);
        postsFeed.innerHTML = '<div class="text-sm text-red-400 p-4">خطأ في الاتصال.</div>';
      }
    }

    function familyPostHtml(post) {
      let mediaHtml = '';
      if (post.media) {
        if (post.media.type === 'image') {
          mediaHtml = `<div class="mt-3"><img src="${escapeHtml(post.media.url)}" class="w-full rounded-md object-cover" /></div>`;
        } else if (post.media.type === 'video') {
          mediaHtml = `
            <div class="mt-3 relative aspect-video rounded-md overflow-hidden bg-black">
              <video id="video-${post.postId}" src="${escapeHtml(post.media.url)}" class="w-full h-full object-contain" controls preload="metadata"></video>
            </div>
          `;
        } else if (post.media.type === 'audio') {
          mediaHtml = `
            <div class="mt-3 flex items-center gap-3">
              <button class="audio-play-button text-white text-xl" id="audio-btn-${post.postId}"><i class="fas fa-play"></i></button>
              <div id="wave-${post.postId}" class="waveform-post flex-grow" style="height:60px;"></div>
            </div>
          `;
        }
      }

      return `
        <article class="glass-post-card" data-post-id="${escapeAttr(post.postId)}">
          <div class="flex items-start gap-3">
            <img src="${escapeHtml(post.user.profile_picture_url || 'https://via.placeholder.com/40')}" class="w-10 h-10 rounded-full object-cover" />
            <div class="flex-1">
              <div class="flex items-center justify-between">
                <div>
                  <div class="font-semibold text-white">${escapeHtml(post.user.username || 'مستخدم')}</div>
                  <div class="text-xs text-gray-400">${new Date(post.timestamp || Date.now()).toLocaleString('ar-EG')}</div>
                </div>
                <div class="text-sm text-gray-300">${post.likes || 0} إعجاب</div>
              </div>
              <p class="mt-2 text-gray-200">${escapeHtml(post.content || '')}</p>
              ${mediaHtml}
            </div>
          </div>
        </article>
      `;
    }

    // simple wave init for audio
    function initializeWave(postId, url) {
      const container = document.getElementById(`wave-${postId}`);
      if (!container) return;
      const ws = WaveSurfer.create({
        container: container,
        waveColor: '#374151',
        progressColor: '#60a5fa',
        height: 60,
        responsive: true,
        barWidth: 3
      });
      ws.load(url);
      const btn = document.getElementById(`audio-btn-${postId}`);
      if (btn) {
        btn.addEventListener('click', () => {
          if (ws.isPlaying()) {
            ws.pause();
            btn.innerHTML = '<i class="fas fa-play"></i>';
          } else {
            ws.play();
            btn.innerHTML = '<i class="fas fa-pause"></i>';
          }
        });
        ws.on('finish', () => { btn.innerHTML = '<i class="fas fa-play"></i>'; });
      }
    }

    // media viewer (images/videos)
    function openMediaViewer(url, type) {
      mediaViewerContent.innerHTML = '';
      if (type === 'image') {
        mediaViewerContent.innerHTML = `<img src="${url}" class="w-full h-auto object-contain rounded-md" />`;
      } else if (type === 'video') {
        mediaViewerContent.innerHTML = `<video src="${url}" class="w-full h-auto rounded-md" controls autoplay></video>`;
      } else return;
      mediaViewerModal.classList.remove('hidden');
    }
    function closeMediaViewer(e) {
      if (e && e.target !== mediaViewerModal && !e.target.closest) return;
      mediaViewerModal.classList.add('hidden');
      mediaViewerContent.innerHTML = '';
    }

    // small helpers
    function escapeHtml(s) {
      if (!s && s !== 0) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(s) {
      if (!s && s !== 0) return '';
      return String(s).replace(/"/g, '&quot;');
    }

    // init
    document.addEventListener('DOMContentLoaded', () => {
      if (!familyIdFromPath) {
        familyNameEl.textContent = 'معرف العائلة غير موجود';
        return;
      }
      fetchFamilyInfo();
    });
  </script>
</body>
</html>
