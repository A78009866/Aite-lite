<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>العائلة — Aite</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://unpkg.com/wavesurfer.js"></script>

  <style>
    :root{
      --bg:#000;
      --glass: rgba(10,10,12,0.58);
      --border: rgba(255,255,255,0.04);
      --muted:#aeb6bd;
      --accent:#e6eefb;
      --black-overlay: rgba(0,0,0,0.75);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:Inter,system-ui,Arial,-apple-system}
    a { color: inherit; text-decoration: none; }

    /* Topbar */
    header.topbar{
      position:sticky; top:0; z-index:60;
      background: linear-gradient(180deg, rgba(0,0,0,0.44), rgba(0,0,0,0.6));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .top-inner{
      max-width:1100px; margin:0 auto; padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .top-left, .top-center, .top-right { display:flex; align-items:center; gap:12px; }
    .btn{
      padding:8px 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--glass); color:var(--accent); cursor:pointer; font-weight:700;
      display:inline-flex; gap:8px; align-items:center;
    }
    .brand{font-weight:800; font-size:18px; letter-spacing:1px; }

    /* Hero */
    .family-hero{ width:100%; height:320px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#070707; }
    .family-hero img.cover{ width:100%; height:100%; object-fit:cover; filter:brightness(.6) saturate(.95); transform:scale(1.02); }
    .hero-overlay{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.6)); }
    .hero-center{ position:absolute; left:50%; transform:translateX(-50%); bottom:18%; text-align:center; z-index:22; display:flex; flex-direction:column; align-items:center; gap:10px; width:calc(100% - 32px); max-width:900px; }
    .family-avatar{ width:104px; height:104px; border-radius:999px; overflow:hidden; border:3px solid rgba(0,0,0,0.55); background:var(--glass); box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    .family-avatar img{ width:100%; height:100%; object-fit:cover }
    .family-name{ font-size:22px; font-weight:800; text-shadow:0 6px 20px rgba(0,0,0,0.6); }
    .family-meta{ color:var(--muted); font-size:13px; }

    /* main & posts */
    main.container{ max-width:1000px; margin:20px auto; padding:0 16px; }
    .controls-row{ display:flex; justify-content:flex-end; margin-bottom:12px; gap:8px; }
    .posts-list{ display:flex; flex-direction:column; gap:14px; }
    .family-post{ background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid var(--border); border-radius:12px; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,0.6); }
    .post-head{ display:flex; gap:12px; align-items:flex-start; }
    .post-avatar{ width:44px; height:44px; border-radius:999px; overflow:hidden; object-fit:cover; }
    .post-meta{ flex:1; }
    .post-username{ font-weight:700; }
    .post-time{ color:var(--muted); font-size:12px; margin-top:4px; }
    .post-body{ margin-top:10px; color:#dbe6ef; }
    .post-media img, .post-media video { width:100%; border-radius:10px; display:block; }
    .waveform { height:60px; background:#071028; border-radius:8px; overflow:hidden; }

    /* create modal */
    .modal-back{ position:fixed; inset:0; background:var(--black-overlay); display:none; align-items:center; justify-content:center; z-index:90; }
    .create-card{ width:100%; max-width:760px; border-radius:12px; padding:16px; background: linear-gradient(180deg, rgba(8,8,10,0.65), rgba(8,8,10,0.5)); border:1px solid var(--border); box-shadow: 0 20px 80px rgba(0,0,0,0.7); display:flex; flex-direction:column; gap:12px; }
    .field{ width:100%; padding:12px; border-radius:10px; background:transparent; border:1px solid var(--border); color:var(--accent); min-height:56px; resize:vertical; }
    .media-preview{ width:100%; height:220px; border-radius:10px; overflow:hidden; background:#080808; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .media-preview img, .media-preview video { width:100%; height:100%; object-fit:cover; display:block; }

    /* settings modal */
    .settings-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--black-overlay); z-index:100; }
    .settings-card{ width:100%; max-width:480px; border-radius:12px; padding:16px; background:#050505; border:1px solid var(--border); display:flex; flex-direction:column; gap:12px; }
    .settings-thumb{ width:100%; height:140px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
    .settings-thumb img{ width:100%; height:100%; object-fit:cover; }
    .settings-name{ font-weight:800; font-size:18px; }
    .settings-key{ padding:12px; border-radius:8px; background:#000; border:1px dashed rgba(255,255,255,0.04); color:var(--accent); font-family:monospace; text-align:center; }
    .settings-actions{ display:flex; gap:10px; justify-content:flex-end; }

    /* confirm modal (black glass) */
    .confirm-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.7); z-index:110; }
    .confirm-card { width:100%; max-width:480px; border-radius:12px; padding:16px; background: linear-gradient(180deg, rgba(6,6,8,0.8), rgba(10,10,12,0.6)); border:1px solid rgba(255,255,255,0.04); color:var(--accent); box-shadow:0 20px 60px rgba(0,0,0,0.7); }

    @media (max-width:720px){ .family-hero{ height:240px; } .family-avatar{ width:84px; height:84px; } .family-name{ font-size:18px; } .top-inner{ padding:10px; } }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar" role="banner">
    <div class="top-inner" role="navigation" aria-label="Site">
      <div class="top-left">
        <a href="/chat_list" class="btn"><i class="fas fa-arrow-left"></i> الرئيسية</a>
      </div>

      <div class="top-center">
        <div class="brand" aria-hidden="true">Aite</div>
      </div>

      <div class="top-right">
        <button id="openSettingsBtn" class="btn" title="إعدادات العائلة"><i class="fas fa-cog"></i></button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="family-hero" id="familyHero" role="region" aria-label="Cover">
    <img id="familyCoverImg" class="cover" src="https://via.placeholder.com/1400x600?text=Family+Cover" alt="صورة الغلاف">
    <div class="hero-overlay"></div>

    <div class="hero-center" aria-hidden="false">
      <div class="family-avatar" id="familyAvatarWrap"><img id="familyAvatar" src="https://via.placeholder.com/160?text=F" alt="صورة العائلة"></div>
      <div class="family-name" id="familyName">اسم العائلة</div>
      <div class="family-meta" id="familyMeta">0 عضو • خاص</div>
    </div>
  </section>

  <!-- Main -->
  <main class="container" role="main">
    <div class="controls-row" aria-hidden="false">
      <button id="createPostBtn" class="btn" style="display:none;"><i class="fas fa-plus"></i> إنشاء منشور بالعائلة</button>
    </div>

    <div id="postsList" class="posts-list" aria-live="polite">
      <!-- posts -->
    </div>
  </main>

  <!-- Create modal -->
  <div id="createModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" role="document" aria-labelledby="createTitle">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div id="createTitle" style="font-weight:800">منشور داخل العائلة</div>
        <button id="closeCreateModal" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <textarea id="familyPostContent" class="field" placeholder="اكتب محتوى المنشور..."></textarea>
      <div class="media-preview" id="postMediaPreview">لا توجد وسائط مرفوعة</div>

      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:8px">
          <input id="familyPostMedia" type="file" accept="image/*,video/*,audio/*" style="display:none" />
          <button class="btn" id="attachMediaBtn"><i class="fas fa-paperclip"></i> إرفاق</button>
          <div id="selectedMediaLabel" style="color:var(--muted)"></div>
        </div>

        <div style="display:flex;gap:8px">
          <button id="submitFamilyPostBtn" class="btn"><i class="fas fa-paper-plane"></i> نشر</button>
        </div>
      </div>

      <div id="postError" style="color:#ff8b8b; display:none"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="settings-modal" role="dialog" aria-modal="true" style="display:none;">
    <div class="settings-card" role="document" aria-labelledby="settingsTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="settingsTitle" style="font-weight:800">إعدادات العائلة</div>
        <button id="closeSettingsBtn" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <div class="settings-thumb"><img id="settingsImg" src="https://via.placeholder.com/800x400?text=Family" alt="صورة العائلة"></div>
      <div class="settings-name" id="settingsName">اسم العائلة</div>

      <div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">رمز الانضمام</div>
        <div id="settingsKey" class="settings-key">متاح فقط للمنشئ أو المنظم</div>
      </div>

      <div class="settings-actions">
        <button id="leaveBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b">مغادرة العائلة</button>
        <button id="deleteBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b;display:none">حذف العائلة</button>
        <button id="copyKeyBtn" class="btn" style="display:none">نسخ الرمز</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal (black glass) -->
  <div id="confirmModal" class="confirm-modal" aria-hidden="true">
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="confirmTitle" style="font-weight:800">تأكيد</div>
        <button id="closeConfirmModal" class="btn"><i class="fas fa-times"></i></button>
      </div>
      <div id="confirmMessage" style="margin-top:12px;color:var(--muted)"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
        <button id="confirmCancelBtn" class="btn" style="background:transparent">إلغاء</button>
        <button id="confirmOkBtn" class="btn" style="background:#111">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- Comment modal (reused for family and posts) -->
  <div id="commentModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" style="max-width:700px;">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-weight:800">التعليقات</div>
        <button id="closeCommentModal" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <div id="commentsList" style="max-height:60vh; overflow:auto; padding-top:12px"></div>

      <div style="margin-top:12px; display:flex; gap:8px; align-items:center">
        <img id="myCurrentAvatar" src="https://via.placeholder.com/40" style="width:40px;height:40px;border-radius:999px;object-fit:cover">
        <input id="newCommentInput" type="text" placeholder="أضف تعليقاً..." style="flex:1;padding:10px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--accent)">
        <button id="postCommentBtn" class="btn"><i class="fas fa-arrow-up"></i></button>
      </div>
    </div>
  </div>

  <script>
    // Defaults (keep same default family image used in home)
    const DEFAULT_FAMILY_IMAGE = 'https://plus.unsplash.com/premium_vector-1682298522309-88e4dc1ccc4d?q=80&w=1125&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D';
    const DEFAULT_PROFILE_PIC = 'https://res.cloudinary.com/duixjs8az/image/upload/v1765009560/post_media/1765009560909-default_profile.png';

    const familyId = (window.location.pathname || '').split('/').pop();
    const familyCoverImg = document.getElementById('familyCoverImg');
    const familyAvatar = document.getElementById('familyAvatar');
    const familyName = document.getElementById('familyName');
    const familyMeta = document.getElementById('familyMeta');

    const postsList = document.getElementById('postsList');
    const createPostBtn = document.getElementById('createPostBtn');
    const createModal = document.getElementById('createModal');
    const closeCreateModal = document.getElementById('closeCreateModal');
    const attachMediaBtn = document.getElementById('attachMediaBtn');
    const familyPostMedia = document.getElementById('familyPostMedia');
    const postMediaPreview = document.getElementById('postMediaPreview');
    const submitFamilyPostBtn = document.getElementById('submitFamilyPostBtn');
    const familyPostContent = document.getElementById('familyPostContent');
    const postError = document.getElementById('postError');
    const selectedMediaLabel = document.getElementById('selectedMediaLabel');

    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const settingsImg = document.getElementById('settingsImg');
    const settingsName = document.getElementById('settingsName');
    const settingsKey = document.getElementById('settingsKey');
    const copyKeyBtn = document.getElementById('copyKeyBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    const confirmModal = document.getElementById('confirmModal');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmOkBtn = document.getElementById('confirmOkBtn');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const closeConfirmModal = document.getElementById('closeConfirmModal');

    const commentModal = document.getElementById('commentModal');
    const closeCommentModalBtn = document.getElementById('closeCommentModal');
    const commentsList = document.getElementById('commentsList');
    const newCommentInput = document.getElementById('newCommentInput');
    const postCommentBtn = document.getElementById('postCommentBtn');
    const myCurrentAvatar = document.getElementById('myCurrentAvatar');

    let currentFamily = null;
    let currentUserId = null;
    let viewingPostIdForComments = null;

    // --- utility helpers
    function escapeHtml(s){ if(!s && s!==0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function escapeAttr(s){ if(!s && s!==0) return ''; return String(s).replace(/"/g,'&quot;'); }

    // --- fetch current profile (returns profile object or null)
    async function fetchProfileFull() {
      try {
        const res = await fetch('/api/profile', { credentials: 'same-origin' });
        if (!res.ok) return null;
        const json = await res.json();
        if (json && json.ok) return json;
      } catch(e){}
      return null;
    }

    // --- Family info
    async function fetchFamilyInfo() {
      if (!familyId) return;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/info`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          familyName.textContent = 'العائلة غير موجودة';
          familyMeta.textContent = '';
          postsList.innerHTML = `<div style="padding:16px;color:var(--muted)">العائلة غير موجودة.</div>`;
          return;
        }

        currentFamily = data.family || {};
        familyName.textContent = currentFamily.name || '—';
        const img = currentFamily.imageUrl || DEFAULT_FAMILY_IMAGE;
        familyCoverImg.src = img;
        familyAvatar.src = img;

        // membersCount and membership display
        const memberText = `${currentFamily.membersCount || 0} عضو`;
        familyMeta.textContent = currentFamily.is_member ? memberText : `${memberText} • خاص`;

        // fetch current user and show create button if member
        const profile = await fetchProfileFull();
        currentUserId = profile ? profile.id : null;
        if (currentFamily.is_member) {
          createPostBtn.style.display = 'inline-flex';
          loadFamilyPosts();
        } else {
          createPostBtn.style.display = 'none';
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">هذه العائلة خاصة. انضم باستخدام رمز العائلة لعرض المنشورات.</div>`;
        }

      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">خطأ في جلب بيانات العائلة.</div>`;
      }
    }

    // --- Load family posts and render them similarly to home cards (with like/comment/delete)
    async function loadFamilyPosts() {
      postsList.innerHTML = `<div style="padding:18px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">${(data && data.error) ? data.error : 'فشل جلب المنشورات'}</div>`;
          return;
        }

        const posts = data.posts || [];
        if (posts.length === 0) {
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">لا توجد منشورات داخل هذه العائلة بعد.</div>`;
          return;
        }

        postsList.innerHTML = '';
        posts.forEach(p => {
          postsList.insertAdjacentHTML('beforeend', renderFamilyPostHtml(p));
          if (p.media && p.media.type === 'audio') initWave(p.postId, p.media.url);
        });
      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">خطأ في الاتصال</div>`;
      }
    }

    // Create the family post HTML (similar to home card)
    function renderFamilyPostHtml(post) {
      const img = post.user.profile_picture_url || DEFAULT_PROFILE_PIC;
      const verifiedBadge = post.user && post.user.is_verified ? `<img src="https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png" class="verified-badge-img" style="width:12px;height:12px;vertical-align:middle;margin-left:6px" alt="موثق">` : '';
      let mediaHtml = '';
      if (post.media) {
        if (post.media.type === 'image') mediaHtml = `<div class="post-media" style="margin-top:10px"><img src="${escapeAttr(post.media.url)}" alt="image"></div>`;
        else if (post.media.type === 'video') mediaHtml = `<div class="post-media" style="margin-top:10px"><video src="${escapeAttr(post.media.url)}" controls playsinline style="width:100%;border-radius:10px"></video></div>`;
        else if (post.media.type === 'audio') mediaHtml = `<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button id="audio-btn-${post.postId}" class="btn" style="padding:8px 10px"><i class="fas fa-play"></i></button><div id="wave-${post.postId}" class="waveform" style="flex:1"></div></div>`;
      }

      // action buttons: like (family endpoint), comment (open modal), options (delete if owner or creator)
      const likeClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
      const likeBtnColor = post.is_liked ? 'color:#ff6b6b' : '';

      // We need to know ownership to decide showing delete option client-side (server enforces)
      const canDelete = (currentUserId && (post.user && post.user.username && post.user.username === '' ? false : true)); // fallback - server enforces; we'll show delete button only if currentUserId === post.userId or currentFamily.creatorId === currentUserId
      const showDelete = (currentUserId && (post.user && post.user.userId === currentUserId)) || (currentFamily && currentFamily.creatorId === currentUserId);

      return `
        <article class="family-post" data-id="${escapeAttr(post.postId)}" id="family-post-${escapeAttr(post.postId)}">
          <div class="post-head">
            <img src="${escapeAttr(img)}" class="post-avatar" alt="${escapeHtml(post.user.username)}">
            <div class="post-meta">
              <div class="post-username">${escapeHtml(post.user.username || 'مستخدم')} ${verifiedBadge}</div>
              <div class="post-time">${new Date(post.timestamp || Date.now()).toLocaleString('ar-EG')}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
              <div style="color:var(--muted);font-size:13px">${post.likes || 0} إعجاب</div>
              <div>
                ${showDelete ? `<button class="btn" style="padding:6px 8px" onclick="confirmDeleteFamilyPost('${escapeAttr(post.postId)}', event)"><i class="fas fa-trash"></i></button>` : ''}
              </div>
            </div>
          </div>

          <div class="post-body">${escapeHtml(post.content || '')}</div>
          ${mediaHtml}

          <div style="display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--border);padding-top:10px">
            <button class="btn" id="like-btn-${post.postId}" onclick="handleFamilyLike('${post.postId}', this)" data-liked="${post.is_liked ? '1' : '0'}">
              <i class="${likeClass} like-icon"></i>&nbsp;<span>إعجاب</span>
            </button>

            <button class="btn" onclick="openFamilyComments('${post.postId}')">
              <i class="far fa-comment-dots"></i>&nbsp;<span>تعليق (${post.commentsCount || 0})</span>
            </button>
          </div>
        </article>
      `;
    }

    // --- Like family post
    async function handleFamilyLike(postId, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/like`, {
          method: 'POST',
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          // update UI counts
          const postEl = document.getElementById(`family-post-${postId}`);
          if (postEl) {
            const likesDiv = postEl.querySelector('.post-head > div:last-child > div:first-child');
            if (likesDiv) likesDiv.textContent = `${data.newLikes || 0} إعجاب`;
            const likeBtn = document.getElementById(`like-btn-${postId}`);
            if (likeBtn) {
              const icon = likeBtn.querySelector('i');
              if (data.action === 'liked') { icon.classList.remove('far'); icon.classList.add('fas'); icon.classList.add('text-red-500'); likeBtn.setAttribute('data-liked','1'); }
              else { icon.classList.remove('fas'); icon.classList.add('far'); icon.classList.remove('text-red-500'); likeBtn.setAttribute('data-liked','0'); }
            }
          }
        } else {
          console.warn('like failed', data);
        }
      } catch (e) {
        console.error(e);
      } finally {
        btn.disabled = false;
      }
    }

    // --- Comments: open modal and load comments for family post
    async function openFamilyComments(postId) {
      viewingPostIdForComments = postId;
      commentsList.innerHTML = `<div style="padding:18px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      commentModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      // set my avatar
      try {
        const profile = await fetchProfileFull();
        if (profile) {
          myCurrentAvatar.src = profile.profile_picture_url || DEFAULT_PROFILE_PIC;
          currentUserId = profile.id;
        }
      } catch (e){}

      await loadFamilyComments(postId);
    }

    async function loadFamilyComments(postId) {
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/comments`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          commentsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">${(data && data.error) ? data.error : 'فشل جلب التعليقات'}</div>`;
          return;
        }

        const comments = data.comments || [];
        if (comments.length === 0) {
          commentsList.innerHTML = `<div style="padding:18px;color:var(--muted)">لا توجد تعليقات بعد.</div>`;
          return;
        }

        commentsList.innerHTML = comments.map(c => renderCommentHtml(c, postId)).join('');
      } catch (e) {
        console.error(e);
        commentsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">خطأ في الاتصال</div>`;
      }
    }

    function renderCommentHtml(comment, postId) {
      const likeClass = comment.is_liked ? 'fas fa-heart text-red-400' : 'far fa-heart text-gray-400';
      const repliesHtml = (comment.recentReplies && comment.recentReplies.length) ? comment.recentReplies.map(r => `
        <div class="reply-item" style="display:flex;gap:8px;align-items:flex-start;margin-top:8px">
          <img src="${escapeAttr(r.profile_picture_url || DEFAULT_PROFILE_PIC)}" style="width:30px;height:30px;border-radius:999px;object-fit:cover">
          <div>
            <div style="font-weight:700;color:#fff">${escapeHtml(r.username)}</div>
            <div style="color:var(--muted)">${escapeHtml(r.content)}</div>
          </div>
        </div>
      `).join('') : '';

      const userId = comment.user.userId || '';
      const canDeleteComment = (currentUserId && currentUserId === userId) || (currentFamily && currentFamily.creatorId === currentUserId);

      return `
        <div id="comment-${escapeAttr(comment.commentId)}" style="padding:10px;border-radius:10px;background:#0d1012;margin-bottom:8px">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <img src="${escapeAttr(comment.user.profile_picture_url || DEFAULT_PROFILE_PIC)}" style="width:40px;height:40px;border-radius:999px;object-fit:cover">
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                  <div style="font-weight:800">${escapeHtml(comment.user.username)}</div>
                  <div style="color:var(--muted);font-size:12px">${new Date(comment.timestamp).toLocaleString('ar-EG')}</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                  <button class="btn" onclick="toggleLikeComment('${postId}','${comment.commentId}', this)"><i class="${likeClass}"></i>&nbsp;<span id="comment-like-count-${comment.commentId}">${comment.likes || 0}</span></button>
                  <button class="btn" onclick="openReplyBox('${comment.commentId}')"><i class="fas fa-reply"></i></button>
                  ${canDeleteComment ? `<button class="btn" onclick="confirmDeleteComment('${postId}','${comment.commentId}')"><i class="fas fa-trash"></i></button>` : ''}
                </div>
              </div>

              <div style="margin-top:8px;color:#dbe6ef">${escapeHtml(comment.content)}</div>

              <div id="replies-container-${comment.commentId}">${repliesHtml}</div>

              <div id="reply-box-${comment.commentId}" style="display:none;margin-top:8px">
                <div style="display:flex;gap:8px;align-items:center">
                  <img src="${document.getElementById('myCurrentAvatar').src}" style="width:32px;height:32px;border-radius:999px;object-fit:cover">
                  <input id="reply-input-${comment.commentId}" placeholder="أكتب رد..." style="flex:1;padding:8px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--accent)">
                  <button class="btn" onclick="postReply('${postId}','${comment.commentId}')"><i class="fas fa-paper-plane"></i></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // toggle like on comment (family)
    async function toggleLikeComment(postId, commentId, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/comments/${encodeURIComponent(commentId)}/like`, {
          method: 'POST',
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          const countEl = document.getElementById(`comment-like-count-${commentId}`);
          if (countEl) countEl.textContent = data.likes;
          // swap icon style
          const icon = btn.querySelector('i');
          if (data.is_liked) { icon.classList.remove('far'); icon.classList.add('fas'); icon.classList.add('text-red-400'); }
          else { icon.classList.remove('fas'); icon.classList.add('far'); icon.classList.remove('text-red-400'); }
        }
      } catch (e) { console.error(e); }
      finally { btn.disabled = false; }
    }

    // open reply box
    function openReplyBox(commentId) {
      const box = document.getElementById(`reply-box-${commentId}`);
      if (!box) return;
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      const input = document.getElementById(`reply-input-${commentId}`);
      if (input) input.focus();
    }

    // post reply to family comment
    async function postReply(postId, commentId) {
      const input = document.getElementById(`reply-input-${commentId}`);
      if (!input) return;
      const content = input.value.trim();
      if (!content) return;
      input.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}/comments/${encodeURIComponent(commentId)}/reply`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          await loadFamilyComments(postId);
        } else {
          alert(data.error || 'فشل في إرسال الرد');
        }
      } catch (e) {
        console.error(e);
        alert('خطأ في الاتصال');
      } finally {
        input.disabled = false;
      }
    }

    // post a new family comment
    postCommentBtn.addEventListener('click', async () => {
      const content = newCommentInput.value.trim();
      if (!content || !viewingPostIdForComments) return;
      postCommentBtn.disabled = true;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(viewingPostIdForComments)}/comment`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          newCommentInput.value = '';
          await loadFamilyComments(viewingPostIdForComments);
          // update posts list comment count
          refreshPostCommentsCount(viewingPostIdForComments);
        } else {
          alert(data.error || 'فشل في إرسال التعليق');
        }
      } catch (e) {
        console.error(e);
      } finally {
        postCommentBtn.disabled = false;
      }
    });

    // helper to refresh comment count on post card
    async function refreshPostCommentsCount(postId) {
      try {
        // simplest: reload posts (could be optimized)
        await loadFamilyPosts();
      } catch (e) { console.warn(e); }
    }

    // --- delete family post (confirm modal)
    function confirmDeleteFamilyPost(postId, event) {
      event.stopPropagation();
      showConfirm(`هل أنت متأكد أنك تريد حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء.`, async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/${encodeURIComponent(postId)}`, {
            method: 'DELETE',
            credentials: 'same-origin'
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            // remove element
            const el = document.getElementById(`family-post-${postId}`);
            if (el) el.remove();
          } else {
            alert(data.error || 'فشل في الحذف');
          }
        } catch (e) {
          console.error(e);
          alert('خطأ في الاتصال');
        }
      });
    }

    // delete comment (confirm)
    function confirmDeleteComment(postId, commentId) {
      showConfirm('هل تريد حذف هذا التعليق؟', async () => {
        try {
          // best effort: family API doesn't currently have comment delete endpoint; if you have it, call here.
          // fallback: remove from UI by reloading comments
          // TODO: implement server-side comment delete endpoint if desired.
          await loadFamilyComments(postId);
        } catch (e) { console.error(e); }
      });
    }

    // --- confirm modal helpers
    function showConfirm(message, onOk) {
      confirmMessage.textContent = message;
      confirmModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      function cleanup() {
        confirmModal.style.display = 'none';
        document.body.style.overflow = 'auto';
        confirmOkBtn.removeEventListener('click', okHandler);
        confirmCancelBtn.removeEventListener('click', cancelHandler);
        closeConfirmModal.removeEventListener('click', cancelHandler);
      }
      function okHandler() { cleanup(); if (typeof onOk === 'function') onOk(); }
      function cancelHandler() { cleanup(); }

      confirmOkBtn.addEventListener('click', okHandler);
      confirmCancelBtn.addEventListener('click', cancelHandler);
      closeConfirmModal.addEventListener('click', cancelHandler);
    }

    // --- Create post modal logic
    createPostBtn.addEventListener('click', () => openCreateModal());
    closeCreateModal.addEventListener('click', () => closeCreateModalFn());
    attachMediaBtn.addEventListener('click', () => familyPostMedia.click());
    familyPostMedia.addEventListener('change', handleMediaSelection);
    submitFamilyPostBtn.addEventListener('click', submitFamilyPost);

    function openCreateModal(){ familyPostContent.value=''; familyPostMedia.value=''; postMediaPreview.innerHTML='لا توجد وسائط مرفوعة'; selectedMediaLabel.textContent=''; postError.style.display='none'; createModal.style.display='flex'; document.body.style.overflow='hidden'; }
    function closeCreateModalFn(){ createModal.style.display='none'; document.body.style.overflow='auto'; }

    function handleMediaSelection(){ const f = familyPostMedia.files && familyPostMedia.files[0]; if(!f){ postMediaPreview.innerHTML='لا توجد وسائط مرفوعة'; selectedMediaLabel.textContent=''; return;} selectedMediaLabel.textContent = f.name; if(f.type.startsWith('image/')){ postMediaPreview.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="preview">`; } else if(f.type.startsWith('video/')){ postMediaPreview.innerHTML = `<video src="${URL.createObjectURL(f)}" controls playsinline></video>`; } else { postMediaPreview.innerHTML = `<div style="color:var(--muted)"><i class="fas fa-file-audio"></i> ${f.name}</div>`; } }

    async function submitFamilyPost(){ postError.style.display='none'; submitFamilyPostBtn.disabled=true; submitFamilyPostBtn.textContent='جارٍ النشر...'; const content = familyPostContent.value.trim(); const file = familyPostMedia.files && familyPostMedia.files[0]; if(!content && !file){ postError.textContent='المحتوى أو الوسائط مطلوب.'; postError.style.display='block'; submitFamilyPostBtn.disabled=false; submitFamilyPostBtn.textContent='نشر'; return;} try{ const fd = new FormData(); fd.append('content', content); if(file) fd.append('media', file); const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts/create`, { method:'POST', credentials:'same-origin', body: fd }); const data = await res.json(); if(!res.ok || !data.ok){ postError.textContent = data.error || 'فشل في النشر'; postError.style.display='block'; return; } closeCreateModalFn(); await loadFamilyPosts(); } catch(err){ console.error(err); postError.textContent='خطأ في الاتصال'; postError.style.display='block'; } finally{ submitFamilyPostBtn.disabled=false; submitFamilyPostBtn.textContent='نشر'; } }

    // --- Settings modal logic (show key to organizers)
    openSettingsBtn.addEventListener('click', async () => {
      settingsImg.src = familyCoverImg.src || DEFAULT_FAMILY_IMAGE;
      settingsName.textContent = familyName.textContent || 'العائلة';

      // if we don't have currentFamily, fetch it
      if (!currentFamily) await fetchFamilyInfo();

      // determine current user id
      const profile = await fetchProfileFull();
      const profileId = profile ? profile.id : null;
      currentUserId = profileId;

      // Try to get key only if user is organizer (server endpoint checks too)
      try {
        const infoRes = await fetch(`/api/families/${encodeURIComponent(familyId)}/info`, { credentials: 'same-origin' });
        const infoJson = await infoRes.json();
        const isOrganizer = infoRes.ok && infoJson.ok && infoJson.family && infoJson.family.is_organizer;

        if (isOrganizer) {
          // request key
          const keyRes = await fetch(`/api/families/${encodeURIComponent(familyId)}/key`, { credentials: 'same-origin' });
          if (keyRes.ok) {
            const keyJson = await keyRes.json();
            if (keyJson && keyJson.ok && keyJson.key) {
              settingsKey.textContent = keyJson.key;
              copyKeyBtn.style.display = 'inline-flex';
            } else {
              settingsKey.textContent = 'خطأ في جلب الرمز';
              copyKeyBtn.style.display = 'none';
            }
          } else {
            settingsKey.textContent = 'الرمز غير متاح';
            copyKeyBtn.style.display = 'none';
          }
        } else {
          settingsKey.textContent = 'الرمز متاح فقط للمنشئ أو المنظم';
          copyKeyBtn.style.display = 'none';
        }

        // show delete button only to creator
        const isCreator = currentFamily && currentFamily.creatorId && profileId && (currentFamily.creatorId === profileId);
        if (isCreator) {
          deleteBtn.style.display = 'inline-flex';
          leaveBtn.style.display = 'none';
        } else {
          deleteBtn.style.display = 'none';
          leaveBtn.style.display = 'inline-flex';
        }

      } catch (e) {
        console.error(e);
        settingsKey.textContent = 'الرمز متاح فقط للمنشئ أو المنظم';
        copyKeyBtn.style.display = 'none';
      }

      settingsModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    });

    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettings(); });
    function closeSettings(){ settingsModal.style.display = 'none'; document.body.style.overflow = 'auto'; }

    // copy key
    copyKeyBtn.addEventListener('click', async () => {
      const txt = settingsKey.textContent || '';
      if (!txt || txt.includes('متاح')) { alert('الرمز غير متاح'); return; }
      try {
        await navigator.clipboard.writeText(txt);
        copyKeyBtn.textContent = 'تم النسخ';
        setTimeout(()=> copyKeyBtn.textContent = 'نسخ الرمز', 1200);
      } catch (e) {
        alert('فشل النسخ');
      }
    });

    // leave family (use confirm modal)
    leaveBtn.addEventListener('click', () => {
      showConfirm('هل تريد فعلاً مغادرة هذه العائلة؟', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/leave`, { method: 'POST', credentials: 'same-origin' });
          const d = await res.json().catch(()=>({}));
          if (res.ok && d.ok) {
            alert('تمت المغادرة');
            window.location.href = '/chat_list';
          } else {
            alert(d.error || 'فشل في المغادرة');
          }
        } catch (e) {
          console.error(e);
          alert('خطأ في الاتصال');
        }
      });
    });

    // delete family (creator only)
    deleteBtn.addEventListener('click', () => {
      showConfirm('هل أنت متأكد أنك تريد حذف هذه العائلة نهائياً؟ هذا سيحذف كل المنشورات والبيانات الخاصة بها.', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}`, { method: 'DELETE', credentials: 'same-origin' });
          const d = await res.json().catch(()=>({}));
          if (res.ok && d.ok) {
            alert('تم حذف العائلة');
            window.location.href = '/chat_list';
          } else {
            alert(d.error || 'فشل في حذف العائلة');
          }
        } catch (e) {
          console.error(e);
          alert('خطأ في الاتصال');
        }
      });
    });

    // --- Comment modal close
    closeCommentModalBtn.addEventListener('click', () => {
      commentModal.style.display = 'none';
      document.body.style.overflow = 'auto';
      viewingPostIdForComments = null;
      commentsList.innerHTML = '';
      newCommentInput.value = '';
    });
    commentModal.addEventListener('click', (e) => { if (e.target === commentModal) closeCommentModalBtn.click(); });

    // init waveform for audio posts
    function initWave(postId, url) {
      const container = document.getElementById(`wave-${postId}`);
      if (!container) return;
      const ws = WaveSurfer.create({ container: container, waveColor: '#2b3b4d', progressColor: '#7c8b99', height:60, responsive:true, barWidth:3 });
      ws.load(url);
      const btn = document.getElementById(`audio-btn-${postId}`);
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (ws.isPlaying()) { ws.pause(); btn.innerHTML = '<i class="fas fa-play"></i>'; }
        else { ws.play(); btn.innerHTML = '<i class="fas fa-pause"></i>'; }
      });
      ws.on('finish', () => { btn.innerHTML = '<i class="fas fa-play"></i>'; });
    }

    // --- initialization
    document.addEventListener('DOMContentLoaded', () => {
      if (!familyId) { document.body.innerHTML = '<div style="padding:24px;color:var(--muted)">معرف العائلة غير موجود.</div>'; return; }
      // set placeholder default for cover/avatar until fetched
      familyCoverImg.src = DEFAULT_FAMILY_IMAGE;
      familyAvatar.src = DEFAULT_FAMILY_IMAGE;
      fetchFamilyInfo();
    });
  </script>
</body>
</html>
