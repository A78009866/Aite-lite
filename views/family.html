<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>العائلة — Aite</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Load WaveSurfer.js with a small fallback mechanism to reduce ERR_NAME_NOT_RESOLVED issues -->
  <script>
    (function loadWaveSurfer() {
      const urls = [
        'https://unpkg.com/wavesurfer.js',
        'https://cdn.jsdelivr.net/npm/wavesurfer.js'
      ];
      let i = 0;
      function tryLoad() {
        if (i >= urls.length) {
          console.warn('WaveSurfer failed to load from provided CDNs.');
          return;
        }
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = () => { console.log('WaveSurfer loaded from', s.src); };
        s.onerror = () => { console.warn('WaveSurfer failed to load from', s.src); tryLoad(); };
        document.head.appendChild(s);
      }
      tryLoad();
    })();
  </script>

  <style>
    :root{
      --bg:#000;
      --glass: rgba(10,10,12,0.58);
      --border: rgba(255,255,255,0.04);
      --muted:#aeb6bd;
      --accent:#e6eefb;
      --black-overlay: rgba(0,0,0,0.75);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:Inter,system-ui,Arial,-apple-system}
    a { color: inherit; text-decoration: none; }

    /* Topbar */
    header.topbar{
      position:sticky; top:0; z-index:60;
      background: linear-gradient(180deg, rgba(0,0,0,0.44), rgba(0,0,0,0.6));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .top-inner{
      max-width:1100px; margin:0 auto; padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .top-left, .top-center, .top-right { display:flex; align-items:center; gap:12px; }
    .btn{
      padding:8px 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--glass); color:var(--accent); cursor:pointer; font-weight:700;
      display:inline-flex; gap:8px; align-items:center;
    }
    .brand{font-weight:800; font-size:18px; letter-spacing:1px; }

    /* Hero */
    .family-hero{ width:100%; height:320px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#070707; }
    .family-hero img.cover{ width:100%; height:100%; object-fit:cover; filter:brightness(.6) saturate(.95); transform:scale(1.02); }
    .hero-overlay{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.6)); }
    .hero-center{ position:absolute; left:50%; transform:translateX(-50%); bottom:18%; text-align:center; z-index:22; display:flex; flex-direction:column; align-items:center; gap:10px; width:calc(100% - 32px); max-width:900px; }
    .family-avatar{ width:104px; height:104px; border-radius:999px; overflow:hidden; border:3px solid rgba(0,0,0,0.55); background:var(--glass); box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    .family-avatar img{ width:100%; height:100%; object-fit:cover }
    .family-name{ font-size:22px; font-weight:800; text-shadow:0 6px 20px rgba(0,0,0,0.6); }
    .family-meta{ color:var(--muted); font-size:13px; }

    /* main & posts */
    main.container{ max-width:1000px; margin:20px auto; padding:0 16px; }
    .controls-row{ display:flex; justify-content:flex-end; margin-bottom:12px; gap:8px; }
    .posts-list{ display:flex; flex-direction:column; gap:14px; }

    /* Use same card style as main feed */
    .glass-post-card {
      background-color: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .post-head{ display:flex; gap:12px; align-items:flex-start; }
    .post-avatar{ width:44px; height:44px; border-radius:999px; overflow:hidden; object-fit:cover; }
    .post-meta{ flex:1; }
    .post-username{ font-weight:700; }
    .post-time{ color:var(--muted); font-size:12px; margin-top:4px; }
    .post-body{ margin-top:10px; color:#dbe6ef; white-space:pre-wrap; }
    .post-media img, .post-media video { width:100%; border-radius:10px; display:block; }

    .waveform { height:60px; background:#071028; border-radius:8px; overflow:hidden; }

    .verified-badge-img {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
      object-fit:cover;
    }

    .small-avatar { width:28px; height:28px; border-radius:999px; }

    .comment-item { padding: 8px; border-radius: 12px; background: #131313; border: 1px solid #222; }

    @media (max-width:720px){ .family-hero{ height:240px; } .family-avatar{ width:84px; height:84px; } .family-name{ font-size:18px; } .top-inner{ padding:10px; } }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar" role="banner">
    <div class="top-inner" role="navigation" aria-label="Site">
      <div class="top-left">
        <a href="/chat_list" class="btn"><i class="fas fa-arrow-left"></i> الرئيسية</a>
      </div>

      <div class="top-center">
        <div class="brand" aria-hidden="true">Aite</div>
      </div>

      <div class="top-right">
        <button id="openSettingsBtn" class="btn" title="إعدادات العائلة"><i class="fas fa-cog"></i></button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="family-hero" id="familyHero" role="region" aria-label="Cover">
    <img id="familyCoverImg" class="cover" src="https://via.placeholder.com/1400x600?text=Family+Cover" alt="صورة الغلاف">
    <div class="hero-overlay"></div>

    <div class="hero-center" aria-hidden="false">
      <div class="family-avatar" id="familyAvatarWrap"><img id="familyAvatar" src="https://via.placeholder.com/160?text=F" alt="صورة العائلة"></div>
      <div class="family-name" id="familyName">اسم العائلة</div>
      <div class="family-meta" id="familyMeta">0 عضو • خاص</div>
    </div>
  </section>

  <!-- Main -->
  <main class="container" role="main">
    <div class="controls-row" aria-hidden="false">
      <button id="createPostBtn" class="btn" style="display:none;"><i class="fas fa-plus"></i> إنشاء منشور بالعائلة</button>
    </div>

    <div id="postsList" class="posts-list" aria-live="polite">
      <!-- posts will be injected here using the same card style as the main feed -->
    </div>
  </main>

  <!-- Create modal -->
  <div id="createModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" role="document" aria-labelledby="createTitle">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div id="createTitle" style="font-weight:800">منشور داخل العائلة</div>
        <button id="closeCreateModal" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <textarea id="familyPostContent" class="field" placeholder="اكتب محتوى المنشور..."></textarea>
      <div class="media-preview" id="postMediaPreview">لا توجد وسائط مرفوعة</div>

      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:8px">
          <input id="familyPostMedia" type="file" accept="image/*,video/*,audio/*" style="display:none" />
          <button class="btn" id="attachMediaBtn"><i class="fas fa-paperclip"></i> إرفاق</button>
          <div id="selectedMediaLabel" style="color:var(--muted)"></div>
        </div>

        <div style="display:flex;gap:8px">
          <button id="submitFamilyPostBtn" class="btn"><i class="fas fa-paper-plane"></i> نشر</button>
        </div>
      </div>

      <div id="postError" style="color:#ff8b8b; display:none"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" role="document" aria-labelledby="settingsTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="settingsTitle" style="font-weight:800">إعدادات العائلة</div>
        <button id="closeSettingsBtn" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <div class="settings-thumb"><img id="settingsImg" src="https://via.placeholder.com/800x400?text=Family" alt="صورة العائلة" style="width:100%;height:auto;border-radius:8px"></div>
      <div class="settings-name" id="settingsName">اسم العائلة</div>

      <div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">رمز الانضمام</div>
        <div id="settingsKey" class="field" style="background:#000;border:1px dashed rgba(255,255,255,0.04);">متاح فقط للمنشئ أو المنظم</div>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button id="leaveBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b">مغادرة العائلة</button>
        <button id="deleteBtn" class="btn" style="background:transparent;border:1px solid rgba(255,50,50,0.12);color:#ff8b8b;display:none">حذف العائلة</button>
        <button id="copyKeyBtn" class="btn" style="display:none">نسخ الرمز</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal (black glass) -->
  <div id="confirmModal" class="modal-back" aria-hidden="true" style="display:none;">
    <div class="create-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div id="confirmTitle" style="font-weight:800">تأكيد</div>
        <button id="closeConfirmModal" class="btn"><i class="fas fa-times"></i></button>
      </div>
      <div id="confirmMessage" style="margin-top:12px;color:var(--muted)"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
        <button id="confirmCancelBtn" class="btn" style="background:transparent">إلغاء</button>
        <button id="confirmOkBtn" class="btn" style="background:#111">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- Comment modal (reused for family posts) -->
  <div id="commentModal" class="modal-back" role="dialog" aria-modal="true" style="display:none;">
    <div class="create-card" style="max-width:700px;">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-weight:800">التعليقات</div>
        <button id="closeCommentModal" class="btn"><i class="fas fa-times"></i></button>
      </div>

      <div id="commentsList" style="max-height:60vh; overflow:auto; padding-top:12px"></div>

      <div style="margin-top:12px; display:flex; gap:8px; align-items:center">
        <img id="myCurrentAvatar" src="https://via.placeholder.com/40" style="width:40px;height:40px;border-radius:999px;object-fit:cover">
        <input id="newCommentInput" type="text" placeholder="أضف تعليقاً..." style="flex:1;padding:10px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--accent)">
        <button id="postCommentBtn" class="btn"><i class="fas fa-arrow-up"></i></button>
      </div>
    </div>
  </div>

  <script>
    // Defaults & constants
    const DEFAULT_FAMILY_IMAGE = 'https://plus.unsplash.com/premium_vector-1682298522309-88e4dc1ccc4d?q=80&w=1125&auto=format&fit=crop';
    const DEFAULT_PROFILE_PIC = 'https://res.cloudinary.com/duixjs8az/image/upload/v1765009560/post_media/1765009560909-default_profile.png';
    const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";

    // Page elements
    const familyId = (window.location.pathname || '').split('/').pop();
    const familyCoverImg = document.getElementById('familyCoverImg');
    const familyAvatar = document.getElementById('familyAvatar');
    const familyName = document.getElementById('familyName');
    const familyMeta = document.getElementById('familyMeta');

    const postsList = document.getElementById('postsList');
    const createPostBtn = document.getElementById('createPostBtn');
    const createModal = document.getElementById('createModal');
    const closeCreateModal = document.getElementById('closeCreateModal');
    const attachMediaBtn = document.getElementById('attachMediaBtn');
    const familyPostMedia = document.getElementById('familyPostMedia');
    const postMediaPreview = document.getElementById('postMediaPreview');
    const submitFamilyPostBtn = document.getElementById('submitFamilyPostBtn');
    const familyPostContent = document.getElementById('familyPostContent');
    const postError = document.getElementById('postError');
    const selectedMediaLabel = document.getElementById('selectedMediaLabel');

    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const settingsImg = document.getElementById('settingsImg');
    const settingsName = document.getElementById('settingsName');
    const settingsKey = document.getElementById('settingsKey');
    const copyKeyBtn = document.getElementById('copyKeyBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    const confirmModal = document.getElementById('confirmModal');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmOkBtn = document.getElementById('confirmOkBtn');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const closeConfirmModal = document.getElementById('closeConfirmModal');

    const commentModal = document.getElementById('commentModal');
    const closeCommentModalBtn = document.getElementById('closeCommentModal');
    const commentsList = document.getElementById('commentsList');
    const newCommentInput = document.getElementById('newCommentInput');
    const postCommentBtn = document.getElementById('postCommentBtn');
    const myCurrentAvatar = document.getElementById('myCurrentAvatar');

    let currentFamily = null;
    let currentUserId = null;
    let viewingPostIdForComments = null;
    let activeWaveSurfer = null;
    let activeVideo = null;

    // small helpers
    function escapeHtml(s){ if(!s && s!==0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function escapeAttr(s){ if(!s && s!==0) return ''; return String(s).replace(/"/g,'&quot;'); }

    // formatTimestamp (fixes ReferenceError)
    function formatTimestamp(timestamp) {
        if (!timestamp) return '';
        try {
            const date = new Date(Number(timestamp));
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);

            if (diffInHours < 24) {
                return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 7 * 24) {
                return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
            }
        } catch (e) {
            return '';
        }
    }

    // fetch current profile
    async function fetchProfileFull() {
      try {
        const res = await fetch('/api/profile', { credentials: 'same-origin' });
        if (!res.ok) return null;
        const json = await res.json();
        if (json && json.ok) return json;
      } catch(e){}
      return null;
    }

    // Safe WaveSurfer creation wrapper
    function safeCreateWaveSurfer(opts) {
      if (window.WaveSurfer) {
        return WaveSurfer.create(opts);
      } else {
        console.warn('WaveSurfer not available, skipping waveform.');
        return null;
      }
    }

    // Initialize waveform with fallback
    function initializePostWaveSurfer(postId, url) {
        const container = document.getElementById(`waveform-${postId}`);
        if (!container) return;

        if (!window.WaveSurfer) {
          // try again shortly (in case script loads late)
          setTimeout(() => initializePostWaveSurfer(postId, url), 500);
          return;
        }

        const ws = WaveSurfer.create({
            container: container,
            waveColor: '#4b5563',
            progressColor: '#3b82f6',
            cursorColor: '#10b981',
            barWidth: 3,
            barRadius: 3,
            barGap: 1,
            height: 60,
            responsive: true,
            mediaControls: false,
        });

        ws.load(url);

        const playButton = document.getElementById(`audio-play-${postId}`) || document.getElementById(`audio-play-${postId}`); // ensure id match
        if (playButton) {
            playButton.onclick = () => {
                if (activeWaveSurfer && activeWaveSurfer !== ws) {
                    activeWaveSurfer.pause();
                    const otherPostCard = activeWaveSurfer.container.closest('.glass-post-card');
                    if (otherPostCard) {
                        const pb = otherPostCard.querySelector('.audio-play-button i');
                        if (pb) { pb.classList.remove('fa-pause'); pb.classList.add('fa-play'); }
                    }
                }
                if (activeVideo) {
                    const activePostId = activeVideo.id.split('-')[1];
                    const controlIcon = document.getElementById(`control-icon-${activePostId}`);
                    const playOverlay = document.getElementById(`play-overlay-${activePostId}`);
                    activeVideo.pause();
                    if (controlIcon) {
                        controlIcon.classList.remove('fa-pause');
                        controlIcon.classList.add('fa-play');
                    }
                    if (playOverlay) playOverlay.classList.remove('hidden');
                    activeVideo = null;
                }

                if (ws.isPlaying()) {
                    ws.pause();
                    playButton.querySelector('i').classList.remove('fa-pause');
                    playButton.querySelector('i').classList.add('fa-play');
                } else {
                    ws.play();
                    playButton.querySelector('i').classList.remove('fa-play');
                    playButton.querySelector('i').classList.add('fa-pause');
                    activeWaveSurfer = ws;
                }
            };

            ws.on('finish', () => {
                playButton.querySelector('i').classList.remove('fa-pause');
                playButton.querySelector('i').classList.add('fa-play');
                activeWaveSurfer = null;
            });
        }
    }

    // Create post card (same layout as main feed)
    function createPostCard(post) {
        let mediaContent = '';
        if (post.media) {
            if (post.media.type === 'image') {
                mediaContent = `
                    <div class="mt-3 cursor-pointer post-media" onclick="openMediaViewer('${post.media.url}', 'image', event)">
                        <img src="${escapeAttr(post.media.url)}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg">
                    </div>
                `;
            } else if (post.media.type === 'video') {
                mediaContent = `
                    <div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group">
                        <video id="video-${post.postId}" src="${escapeAttr(post.media.url)}" 
                               class="w-full h-full object-contain" 
                               poster="https://via.placeholder.com/600x400?text=Video+Loading" 
                               preload="metadata"
                               onclick="toggleVideoPlay('${post.postId}', event)">
                        </video>
                        
                        <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 transition-opacity duration-300 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)">
                            <i class="fas fa-play text-white text-5xl opacity-80 transition-transform duration-300 transform scale-100 group-hover:scale-110"></i>
                        </div>

                        <div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center space-x-3 space-x-reverse opacity-0 transition-opacity duration-300 group-hover:opacity-100">
                            
                            <button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                                <i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i>
                            </button>
                            
                            <div class="flex-grow h-1 bg-gray-500 rounded-full cursor-pointer relative" onclick="seekVideo('${post.postId}', event)">
                                <div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div>
                            </div>
                            
                            <span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span>
                            
                            <button onclick="toggleFullscreen('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                                <i class="fas fa-expand text-lg"></i>
                            </button>
                        </div>

                    </div>
                `;
            } else if (post.media.type === 'audio') {
                mediaContent = `
                    <div class="mt-3 flex items-center space-x-3 space-x-reverse bg-gray-800 p-3 rounded-lg">
                        <button id="audio-play-${post.postId}" class="audio-play-button text-white text-xl">
                            <i class="fas fa-play"></i>
                        </button>
                        <div id="waveform-${post.postId}" class="waveform" style="flex:1"></div>
                    </div>
                `;
            }
        }

        const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
        const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';
        const onlineDotHtml = post.user && post.user.is_online ? `<span class="online-dot" title="متصل الآن" style="position:relative;display:inline-block;margin-left:6px;width:10px;height:10px;background:#22c55e;border-radius:999px;border:2px solid #000"></span>` : '';
        const verifiedBadgeHtml = post.user && post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="موثق" title="موثق">` : '';

        const menuButtonHtml = `
            <button class="text-gray-400 hover:text-white transition duration-300 post-menu-button" 
                    onclick="openPostOptions('${post.postId}', '${post.userId}', event)">
                <i class="fas fa-ellipsis-v"></i>
            </button>
        `;

        return `
            <div class="glass-post-card" data-post-id="${escapeAttr(post.postId)}" id="family-post-${escapeAttr(post.postId)}">
                <div class="flex items-start justify-between mb-3">
                    <div class="flex items-center">
                        <a href="/profile?userId=${post.userId}" class="avatar-with-dot" style="display:flex;align-items:center;">
                            <img src="${escapeAttr(post.user.profile_picture_url || DEFAULT_PROFILE_PIC)}" alt="${escapeAttr(post.user.username || 'مستخدم')}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600 hover:ring-2 hover:ring-blue-400 transition duration-300">
                            ${onlineDotHtml}
                        </a>
                        <div>
                             <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">${escapeHtml(post.user.username || 'مستخدم')} ${verifiedBadgeHtml}</a>
                            <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
                        </div>
                    </div>
                    ${menuButtonHtml}
                </div>

                <p class="post-body">${escapeHtml(post.content || '')}</p>

                ${mediaContent}

                <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                    <span><i class="fas fa-heart ml-1"></i> ${post.likes || 0} إعجاب</span>
                    <span class="cursor-pointer hover:text-blue-400 comment-count-display" onclick="openFamilyComments('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                </div>

    // video helpers (same as previous implementation)
    function toggleVideoPlay(postId, event) {
        event.stopPropagation();
        const video = document.getElementById(`video-${postId}`);
        const playOverlay = document.getElementById(`play-overlay-${postId}`);
        const controlIcon = document.getElementById(`control-icon-${postId}`);
        const controlsBar = document.getElementById(`controls-bar-${postId}`);

        if (!video) return;

        if (activeVideo && activeVideo !== video) {
            const activePostId = activeVideo.id.split('-')[1];
            const activeControlIcon = document.getElementById(`control-icon-${activePostId}`);
            const activePlayOverlay = document.getElementById(`play-overlay-${activePostId}`);
            activeVideo.pause();
            if (activeControlIcon) {
                activeControlIcon.classList.remove('fa-pause');
                activeControlIcon.classList.add('fa-play');
            }
            if (activePlayOverlay) activePlayOverlay.classList.remove('hidden');

            activeVideo.removeEventListener('timeupdate', updateVideoProgress);
            activeVideo.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
            activeVideo.removeEventListener('ended', handleVideoEnd);
        }
        if (activeWaveSurfer) {
            activeWaveSurfer.pause();
            activeWaveSurfer = null;
        }

        if (video.paused) {
            video.play();
            if (playOverlay) playOverlay.classList.add('hidden');
            if (controlIcon) { controlIcon.classList.remove('fa-play'); controlIcon.classList.add('fa-pause'); }
            if (controlsBar) controlsBar.classList.remove('opacity-0');
            activeVideo = video;

            video.addEventListener('timeupdate', updateVideoProgress);
            video.addEventListener('loadedmetadata', updateVideoTimeDisplay);
            video.addEventListener('ended', handleVideoEnd);
        } else {
            video.pause();
            if (playOverlay) playOverlay.classList.remove('hidden');
            if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
            activeVideo = null;
        }
    }

    function updateVideoProgress(event) {
        const video = event.target;
        const postId = video.id.split('-')[1];
        const progressBar = document.getElementById(`progress-bar-${postId}`);
        const timeDisplay = document.getElementById(`time-display-${postId}`);

        if (!video.duration || !progressBar || !timeDisplay) return;

        const percent = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${percent}%`;
        timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
    }

    function updateVideoTimeDisplay(event) {
        const video = event.target;
        const postId = video.id.split('-')[1];
        const timeDisplay = document.getElementById(`time-display-${postId}`);

        if (timeDisplay && video.duration) {
            timeDisplay.textContent = `0:00 / ${formatVideoTime(video.duration)}`;
        }
    }

    function handleVideoEnd(event) {
        const video = event.target;
        const postId = video.id.split('-')[1];
        const playOverlay = document.getElementById(`play-overlay-${postId}`);
        const controlIcon = document.getElementById(`control-icon-${postId}`);

        video.currentTime = 0;
        if (playOverlay) playOverlay.classList.remove('hidden');
        if (controlIcon) { controlIcon.classList.remove('fa-pause'); controlIcon.classList.add('fa-play'); }
        activeVideo = null;

        video.removeEventListener('timeupdate', updateVideoProgress);
        video.removeEventListener('loadedmetadata', updateVideoTimeDisplay);
        video.removeEventListener('ended', handleVideoEnd);
    }

    function formatVideoTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

    function seekVideo(postId, event) {
        const video = document.getElementById(`video-${postId}`);
        const bar = event.currentTarget;
        if (!video || !video.duration) return;
        const rect = bar.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const percent = x / rect.width;
        video.currentTime = percent * video.duration;
    }

    function toggleFullscreen(postId, event) {
        event.stopPropagation();
        const video = document.getElementById(`video-${postId}`);
        if (!video) return;
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else {
            if (video.requestFullscreen) video.requestFullscreen();
        }
    }

    // ---------------- Families: fetch & render posts using same card ----------------
    async function loadFamilyPosts() {
      postsList.innerHTML = `<div style="padding:18px;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>`;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/posts`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">${(data && data.error) ? data.error : 'فشل جلب المنشورات'}</div>`;
          return;
        }

        const posts = data.posts || [];
        if (posts.length === 0) {
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">لا توجد منشورات داخل هذه العائلة بعد.</div>`;
          return;
        }

        // fetch profiles for verification flags (best-effort)
        const userIds = [...new Set(posts.map(p => p.userId))].filter(Boolean);
        const profileMap = {};
        try {
          const profilePromises = userIds.map(uid => fetch(`/api/profile?userId=${encodeURIComponent(uid)}`, { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).catch(()=>null));
          const profileResults = await Promise.all(profilePromises);
          profileResults.forEach(pr => { if (pr && pr.id) profileMap[pr.id] = pr; });
        } catch(e){}

        postsList.innerHTML = '';
        const audioToInit = [];
        posts.forEach(post => {
          // enrich with profile verification if available
          const pr = profileMap[post.userId];
          post.user = post.user || {};
          if (pr) post.user.is_verified = !!pr.is_verified;
          post.user.profile_picture_url = post.user.profile_picture_url || DEFAULT_PROFILE_PIC;

          postsList.insertAdjacentHTML('beforeend', createPostCard(post));

          if (post.media && post.media.type === 'audio') {
            audioToInit.push({ postId: post.postId, url: post.media.url });
          }
        });

        // initialize audio waveforms after DOM inserted
        setTimeout(() => {
          audioToInit.forEach(a => initializePostWaveSurfer(a.postId, a.url));
        }, 150);

      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:#ff8b8b">خطأ في الاتصال</div>`;
      }
    }

            const keyJson = await keyRes.json();
            if (keyJson && keyJson.ok && keyJson.key) {
              settingsKey.textContent = keyJson.key;
              copyKeyBtn.style.display = 'inline-flex';
            } else {
              settingsKey.textContent = 'خطأ في جلب الرمز';
              copyKeyBtn.style.display = 'none';
            }
          } else {
            settingsKey.textContent = 'الرمز غير متاح';
            copyKeyBtn.style.display = 'none';
          }
        } else {
          settingsKey.textContent = 'الرمز متاح فقط للمنشئ أو المنظم';
          copyKeyBtn.style.display = 'none';
        }

        const isCreator = currentFamily && currentFamily.creatorId && profileId && (currentFamily.creatorId === profileId);
        if (isCreator) {
          deleteBtn.style.display = 'inline-flex';
          leaveBtn.style.display = 'none';
        } else {
          deleteBtn.style.display = 'none';
          leaveBtn.style.display = 'inline-flex';
        }

      } catch (e) {
        console.error(e);
        settingsKey.textContent = 'الرمز متاح فقط للمنشئ أو المنظم';
        copyKeyBtn.style.display = 'none';
      }

      settingsModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    });

    closeSettingsBtn.addEventListener('click', () => { settingsModal.style.display = 'none'; document.body.style.overflow = 'auto'; });
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) { settingsModal.style.display = 'none'; document.body.style.overflow = 'auto'; } });

    copyKeyBtn.addEventListener('click', async () => {
      const txt = settingsKey.textContent || '';
      if (!txt || txt.includes('متاح')) { alert('الرمز غير متاح'); return; }
      try {
        await navigator.clipboard.writeText(txt);
        copyKeyBtn.textContent = 'تم النسخ';
        setTimeout(()=> copyKeyBtn.textContent = 'نسخ الرمز', 1200);
      } catch (e) {
        alert('فشل النسخ');
      }
    });

    leaveBtn.addEventListener('click', () => {
      showConfirm('هل تريد فعلاً مغادرة هذه العائلة؟', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/leave`, { method: 'POST', credentials: 'same-origin' });
          const d = await res.json().catch(()=>({}));
          if (res.ok && d.ok) {
            alert('تمت المغادرة');
            window.location.href = '/chat_list';
          } else {
            alert(d.error || 'فشل في المغادرة');
          }
        } catch (e) {
          console.error(e);
          alert('خطأ في الاتصال');
        }
      });
    });

    deleteBtn.addEventListener('click', () => {
      showConfirm('هل أنت متأكد أنك تريد حذف هذه العائلة نهائياً؟ هذا سيحذف كل المنشورات والبيانات الخاصة بها.', async () => {
        try {
          const res = await fetch(`/api/families/${encodeURIComponent(familyId)}`, { method: 'DELETE', credentials: 'same-origin' });
          const d = await res.json().catch(()=>({}));
          if (res.ok && d.ok) {
            alert('تم حذف العائلة');
            window.location.href = '/chat_list';
          } else {
            alert(d.error || 'فشل في حذف العائلة');
          }
        } catch (e) {
          console.error(e);
          alert('خطأ في الاتصال');
        }
      });
    });

    // Fetch family info
    async function fetchFamilyInfo() {
      if (!familyId) return;
      try {
        const res = await fetch(`/api/families/${encodeURIComponent(familyId)}/info`, { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          familyName.textContent = 'العائلة غير موجودة';
          familyMeta.textContent = '';
          postsList.innerHTML = `<div style="padding:16px;color:var(--muted)">العائلة غير موجودة.</div>`;
          return;
        }

        currentFamily = data.family || {};
        familyName.textContent = currentFamily.name || '—';
        const img = currentFamily.imageUrl || DEFAULT_FAMILY_IMAGE;
        familyCoverImg.src = img;
        familyAvatar.src = img;

        const memberText = `${currentFamily.membersCount || 0} عضو`;
        familyMeta.textContent = currentFamily.is_member ? memberText : `${memberText} • خاص`;

        const profile = await fetchProfileFull();
        currentUserId = profile ? profile.id : null;
        if (currentFamily.is_member) {
          createPostBtn.style.display = 'inline-flex';
          await loadFamilyPosts();
        } else {
          createPostBtn.style.display = 'none';
          postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">هذه العائلة خاصة. انضم باستخدام رمز العائلة لعرض المنشورات.</div>`;
        }

      } catch (err) {
        console.error(err);
        postsList.innerHTML = `<div style="padding:18px;color:var(--muted)">خطأ في جلب بيانات العائلة.</div>`;
      }
    }

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      if (!familyId) { document.body.innerHTML = '<div style="padding:24px;color:var(--muted)">معرف العائلة غير موجود.</div>'; return; }
      familyCoverImg.src = DEFAULT_FAMILY_IMAGE;
      familyAvatar.src = DEFAULT_FAMILY_IMAGE;
      fetchFamilyInfo();
    });
  </script>
</body>
</html>
