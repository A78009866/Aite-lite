<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء منشور جديد - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');

        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
        }

        /* تأثير الزجاج */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(59, 130, 246, 0.5);
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #3b82f6; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background-color: transparent;
        }

        /* WaveSurfer Styling */
        #waveform-preview {
            height: 80px; 
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        
        /* Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* زر النشر المتدرج */
        .gradient-btn {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            background-size: 200% 200%;
            animation: gradient-anim 3s ease infinite;
        }
        @keyframes gradient-anim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1]">
        <div class="absolute top-10 left-10 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob"></div>
        <div class="absolute top-10 right-10 w-64 h-64 bg-purple-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-64 h-64 bg-pink-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <div class="glass-panel p-6 sm:p-8 rounded-3xl w-full max-w-2xl relative z-10 transition-all duration-300">
        
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10">
            <a href="/chat_list" class="glass-button w-10 h-10 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition duration-300 group" title="العودة للرئيسية">
                 <i class="fas fa-arrow-right text-lg group-hover:-translate-x-1 transition-transform"></i>
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 flex items-center gap-3">
                <i class="fas fa-feather-alt text-white/80"></i>
                نشر فكرة جديدة
            </h1>
            <div class="w-10"></div> 
        </div>
        
        <form id="createPostForm" action="/api/posts/create" method="POST" enctype="multipart/form-data">
            
            <div class="mb-6 group">
                <textarea id="postContent" name="content" rows="5" placeholder="شاركنا بما يدور في ذهنك اليوم..."
                          class="glass-input custom-scroll w-full p-5 rounded-2xl text-lg text-white placeholder-gray-500 resize-none"></textarea>
            </div>
            
            <input type="file" id="mediaFile" name="media" accept="image/*,audio/*,video/*" class="hidden">

            <div id="mediaPreviewContainer" class="hidden mb-6 p-2 glass-input rounded-2xl relative group animate-fade-in-up">
                <div class="flex justify-center items-center bg-black/20 rounded-xl overflow-hidden">
                    <div id="filePreview" class="max-h-80 w-full flex items-center justify-center">
                        </div>
                </div>
                <button type="button" id="removeMediaBtn" class="absolute top-4 left-4 bg-red-500/80 hover:bg-red-600 text-white backdrop-blur-md rounded-full p-2 w-8 h-8 flex items-center justify-center transition duration-300 shadow-lg transform hover:scale-110">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <div id="audioRecorderContainer" class="mb-6 p-5 glass-input rounded-2xl flex flex-col items-center transition-all duration-300">
                <div class="flex items-center justify-between w-full mb-2">
                    <h3 class="text-md font-semibold text-gray-300 flex items-center gap-2">
                        <i class="fas fa-microphone-alt text-blue-500"></i>
                        تسجيل صوتي
                    </h3>
                    <span id="recordingStatus" class="text-xs font-mono text-gray-400 bg-white/5 px-2 py-1 rounded">جاهز</span>
                </div>
                
                <div class="flex items-center justify-center gap-6 my-4">
                    <button type="button" id="startRecordingBtn" class="w-16 h-16 rounded-full bg-gradient-to-br from-red-500 to-pink-600 text-white shadow-lg shadow-red-500/30 flex items-center justify-center transition-all hover:scale-105 disabled:opacity-30 disabled:grayscale disabled:scale-100 disabled:shadow-none" title="بدء التسجيل">
                        <i class="fas fa-microphone text-2xl"></i>
                    </button>
                    
                    <button type="button" id="stopRecordingBtn" class="w-16 h-16 rounded-full glass-button text-white hover:bg-white/10 flex items-center justify-center transition-all hover:scale-105 disabled:opacity-30 disabled:cursor-not-allowed" disabled title="إيقاف التسجيل">
                        <i class="fas fa-stop text-xl text-red-400"></i>
                    </button>
                </div>

                <div id="waveform-preview" class="w-full hidden mt-2 shadow-inner"></div>

                <div id="audioPlaybackContainer" class="w-full mt-4 hidden animate-fade-in">
                    <button id="playPausePreview" type="button" class="w-full py-3 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-blue-400 hover:text-blue-300 rounded-xl transition duration-300 flex items-center justify-center gap-2 font-medium">
                        <i class="fas fa-play"></i> تشغيل / إيقاف المعاينة
                    </button>
                </div>
            </div>
            
            <div class="flex justify-between items-center pt-4 border-t border-white/10 mt-2">
                
                <button type="button" id="addMediaBtn" class="group flex items-center gap-2 text-gray-400 hover:text-white transition duration-300 px-4 py-2 rounded-xl hover:bg-white/5">
                    <div class="w-8 h-8 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center group-hover:bg-green-500 group-hover:text-white transition-all">
                        <i class="fas fa-image text-sm"></i>
                    </div>
                    <span class="text-sm font-medium">صورة / فيديو</span>
                </button>

                <button type="submit" id="submitBtn" class="relative overflow-hidden px-8 py-3 rounded-xl gradient-btn text-white font-bold shadow-lg shadow-blue-900/40 transition-all duration-300 hover:shadow-blue-600/40 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none min-w-[140px]" disabled>
                    <div class="relative z-10 flex items-center justify-center gap-2">
                        <span id="submitBtnText">نشر الآن</span>
                        <i class="fas fa-paper-plane text-sm"></i>
                        <i id="loadingIndicator" class="fas fa-spinner fa-spin hidden"></i>
                    </div>
                </button>
            </div>
            
            <div id="errorMessage" class="text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg p-3 mt-4 text-center text-sm hidden animate-pulse"></div>

        </form>
    </div>
    
    <script>
        // ************** الثوابت والمتغيرات **************
        const form = document.getElementById('createPostForm');
        const mediaFile = document.getElementById('mediaFile');
        const addMediaBtn = document.getElementById('addMediaBtn');
        const removeMediaBtn = document.getElementById('removeMediaBtn');
        const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
        const filePreview = document.getElementById('filePreview');
        const postContent = document.getElementById('postContent');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        const audioRecorderContainer = document.getElementById('audioRecorderContainer');
        
        // متغيرات تسجيل الصوت والـ WaveSurfer
        const startRecordingBtn = document.getElementById('startRecordingBtn');
        const stopRecordingBtn = document.getElementById('stopRecordingBtn');
        const recordingStatus = document.getElementById('recordingStatus');
        const waveformPreview = document.getElementById('waveform-preview'); 
        const audioPlaybackContainer = document.getElementById('audioPlaybackContainer');
        const playPausePreview = document.getElementById('playPausePreview');
        
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let mediaStream = null;
        let wavesurferPreview; 
        
        // ************** تهيئة WaveSurfer **************
        function initializeWaveSurfer() {
            if (wavesurferPreview) {
                 wavesurferPreview.destroy();
            }
            wavesurferPreview = WaveSurfer.create({
                container: '#waveform-preview',
                waveColor: 'rgba(96, 165, 250, 0.5)', // Blue-400 transparent
                progressColor: '#a78bfa', // Purple-400
                cursorColor: '#f472b6', // Pink-400
                barWidth: 3,
                barRadius: 3,
                barGap: 3,
                responsive: true,
                height: 80,
                backend: 'MediaElement',
                rtl: true,
            });
            
            // ربط التحكم بالزر المخصص
            playPausePreview.onclick = () => {
                wavesurferPreview.playPause();
            };

            wavesurferPreview.on('play', () => {
                playPausePreview.innerHTML = '<i class="fas fa-pause"></i> إيقاف مؤقت';
                playPausePreview.classList.add('bg-blue-600/40');
            });
            wavesurferPreview.on('pause', () => {
                playPausePreview.innerHTML = '<i class="fas fa-play"></i> استمع للتسجيل';
                playPausePreview.classList.remove('bg-blue-600/40');
            });
            wavesurferPreview.on('finish', () => {
                 playPausePreview.innerHTML = '<i class="fas fa-redo"></i> إعادة التشغيل';
                 wavesurferPreview.seekTo(0); // العودة للبداية
            });
        }

        // ************** وظائف تسجيل الصوت **************

        async function startRecording() {
            try {
                // إخفاء المعاينة القديمة وتهيئة WaveSurfer
                initializeWaveSurfer();
                waveformPreview.classList.remove('hidden');
                audioPlaybackContainer.classList.add('hidden');
                
                // طلب الوصول إلى الميكروفون
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];
                audioBlob = null;

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                // عند الإيقاف
                mediaRecorder.onstop = () => {
                    // إزالة تأثير النبض
                    startRecordingBtn.classList.remove('recording-pulse');
                    
                    audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    // تحميل ملف الصوت في WaveSurfer لعرض الموجة ومعاينة التشغيل
                    wavesurferPreview.load(audioUrl); 
                    
                    audioPlaybackContainer.classList.remove('hidden');
                    
                    // إعداد ملف الإرسال
                    const recordedFile = new File([audioBlob], "recorded_audio.webm", { type: mediaRecorder.mimeType });
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(recordedFile);
                    mediaFile.files = dataTransfer.files; 
                    
                    recordingStatus.textContent = 'تم التسجيل';
                    recordingStatus.classList.add('text-green-400');
                    checkInputs();
                };

                mediaRecorder.start();
                
                // تحديث واجهة المستخدم
                startRecordingBtn.disabled = true;
                stopRecordingBtn.disabled = false;
                startRecordingBtn.classList.add('recording-pulse'); // إضافة تأثير النبض
                recordingStatus.textContent = 'جاري التسجيل...';
                recordingStatus.classList.remove('text-green-400');
                
            } catch (err) {
                console.error('Error accessing microphone:', err);
                recordingStatus.textContent = 'خطأ في الميكروفون!';
                recordingStatus.classList.add('text-red-400');
                startRecordingBtn.disabled = false;
                stopRecordingBtn.disabled = true;
                startRecordingBtn.classList.remove('recording-pulse');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            startRecordingBtn.disabled = false;
            stopRecordingBtn.disabled = true;
            startRecordingBtn.classList.remove('recording-pulse');
        }
        
        function resetAudioRecording() {
            stopRecording();
            if(wavesurferPreview) {
                wavesurferPreview.empty();
                wavesurferPreview.destroy();
                wavesurferPreview = null;
            }
            audioPlaybackContainer.classList.add('hidden');
            waveformPreview.classList.add('hidden');
            recordingStatus.textContent = 'جاهز';
            recordingStatus.classList.remove('text-green-400', 'text-red-400');
            mediaFile.value = ''; // إزالة الملف الصوتي المسجل
            audioBlob = null;
            audioChunks = [];
        }

        // ************** وظيفة المعاينة للملفات العادية **************
        function setupPreview(file) {
            const fileType = file.type.split('/')[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                let previewElement;
                filePreview.innerHTML = ''; 

                if (fileType === 'image') {
                    previewElement = `<img src="${e.target.result}" alt="Media Preview" class="w-full h-auto max-h-[400px] object-cover rounded-lg shadow-lg">`;
                } else if (fileType === 'video') {
                    previewElement = `<video src="${e.target.result}" controls class="w-full h-auto max-h-[400px] rounded-lg shadow-lg bg-black"></video>`;
                } else if (fileType === 'audio') {
                    previewElement = `<div class="bg-gradient-to-r from-gray-800 to-gray-900 p-6 rounded-xl flex items-center justify-center gap-4 border border-white/10 w-full"><div class="p-3 bg-blue-500/20 rounded-full text-blue-400"><i class="fas fa-music text-2xl"></i></div> <div class="text-gray-200 font-medium truncate">${file.name}</div></div>`;
                } else {
                    previewElement = `<div class="text-red-400 p-4 bg-red-500/10 rounded-lg">لا يمكن معاينة هذا النوع من الملفات.</div>`;
                }

                filePreview.innerHTML = previewElement;
                mediaPreviewContainer.classList.remove('hidden');
                
                // إخفاء مسجل الصوت لتجنب تضارب الواجهة
                audioRecorderContainer.classList.add('hidden');
            };

            reader.readAsDataURL(file);
        }

        // ************** معالجة المدخلات والأزرار **************
        function checkInputs() {
            const hasContent = postContent.value.trim().length > 0;
            const hasMediaFile = mediaFile.files.length > 0;
            
            if (hasContent || hasMediaFile) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('grayscale', 'opacity-50');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('grayscale', 'opacity-50');
            }
        }

        // ربط الأحداث
        addMediaBtn.addEventListener('click', () => {
            resetAudioRecording(); // إعادة التعيين لمسح أي تسجيل صوتي سابق
            audioRecorderContainer.classList.add('hidden'); // إخفاء الواجهة
            mediaFile.click();
        });

        removeMediaBtn.addEventListener('click', () => {
            mediaFile.value = ''; 
            filePreview.innerHTML = '';
            mediaPreviewContainer.classList.add('hidden');
            // إعادة إظهار مسجل الصوت بعد إزالة الملف
            audioRecorderContainer.classList.remove('hidden'); 
            checkInputs(); 
        });

        mediaFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                setupPreview(e.target.files[0]);
                audioRecorderContainer.classList.add('hidden'); 
            }
            checkInputs(); 
        });

        postContent.addEventListener('input', checkInputs); 
        
        // أحداث تسجيل الصوت
        startRecordingBtn.addEventListener('click', startRecording);
        stopRecordingBtn.addEventListener('click', stopRecording);


        // ************** معالجة إرسال النموذج (التوجيه المباشر) **************
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtnText.textContent = 'جاري النشر...';
            loadingIndicator.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            const formData = new FormData();
            formData.append('content', postContent.value.trim());

            // معالجة ملف الوسائط (سواء كان مرفوعاً أو مسجلاً)
            if (mediaFile.files.length > 0) {
                formData.append('media', mediaFile.files[0]);
            } 
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (response.ok && result.ok) {
                    window.location.href = '/chat_list';
                    
                } else {
                    errorMessage.textContent = result.error || 'حدث خطأ غير معروف أثناء النشر.';
                    errorMessage.classList.remove('hidden');
                    
                    submitBtn.disabled = false;
                    submitBtnText.textContent = 'نشر الآن';
                    loadingIndicator.classList.add('hidden');
                }
            } catch (error) {
                console.error('Network or client error:', error);
                errorMessage.textContent = 'فشل الاتصال بالخادم. حاول مرة أخرى.';
                errorMessage.classList.remove('hidden');
                
                submitBtn.disabled = false;
                submitBtnText.textContent = 'نشر الآن';
                loadingIndicator.classList.add('hidden');
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            checkInputs(); 
        });
    </script>
    
</body>
</html>
