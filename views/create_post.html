        .submit-btn-premium {

        .media-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

        }

        .preview-remove-btn {

            transition: all 0.2s ease; font-size: 12px;

        .preview-remove-btn:hover { background: #ef4444; color: #fff; }

        .audio-file-preview { display: flex; align-items: center; gap: 12px; padding: 16px; width: 100%; }
        .audio-file-icon {
            width: 44px; height: 44px; border-radius: 12px;

        #waveform-preview {

        /* ====== SINGLE IMAGE PREVIEW ====== */

        html[data-theme="light"] .submit-btn-premium:hover:not(:disabled) { background: #000 !important; }
        html[data-theme="light"] .submit-btn-premium:disabled { background: #d1d5db !important; color: #9ca3af !important; }

        /* ===== DESKTOP SIDEBAR ===== */
        .desktop-sidebar { display: none; }
        @media (min-width: 768px) {
            .desktop-sidebar {
                display: flex; position: fixed; top: 0; right: 0;

        /* Skeleton */
        @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }

            <div style="margin-bottom:20px;">
                <textarea id="postContent" name="content" rows="4" placeholder="اكتب ما تفكر به..."
                    class="glass-input custom-scroll" style="width:100%;padding:16px;border-radius:16px;font-size:16px;resize:none;line-height:1.6;"></textarea>
            </div>

            <!-- Hidden file input (used for syncing selected media to form) -->
            <input type="file" id="mediaFile" name="media" accept="image/*,audio/*,video/*" style="display:none!important;">

            <!-- Media Tabs -->
            <div class="media-tabs">
                <button type="button" class="media-tab" data-tab="image" onclick="switchMediaTab('image')">
                    <i class="fas fa-image"></i><span data-i18n="صورة">صورة</span>
                </button>
                <button type="button" class="media-tab" data-tab="video" onclick="switchMediaTab('video')">
                    <i class="fas fa-video"></i><span data-i18n="فيديو">${t("فيديو")}</span>
                </button>
                <button type="button" class="media-tab" data-tab="audio" onclick="switchMediaTab('audio')">
                    <i class="fas fa-music"></i><span data-i18n="ملف صوتي" data-i18n="ملف صوتي">${t("ملف صوتي")}</span>
                </button>
                <button type="button" class="media-tab" data-tab="record" onclick="switchMediaTab('record')">
                    <i class="fas fa-microphone"></i><span data-i18n="تسجيل">تسجيل</span>
                </button>
            </div>

            <!-- ====== IMAGE SECTION (Multiple images - Instagram style) ====== -->
            <div id="section-image" class="media-section" style="margin-bottom:20px;">
                <div id="imageUploadZone" class="upload-zone" style="cursor:pointer;position:relative;overflow:hidden;">
                    <input type="file" id="imageFile" accept="image/*" onchange="handleImageChange(this)" style="position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;font-size:200px;">
                    <div class="upload-zone-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <p style="font-size:14px;color:#999;margin:0 0 4px;" data-i18n="اضغط لاختيار صورة">اضغط لاختيار صورة</p>
                    <p style="font-size:12px;color:#555;margin:0;">PNG, JPG, GIF, WEBP</p>
                </div>

                <!-- Multi Image Preview Grid -->
                <div id="imagePreviewArea" style="display:none;">
                    <div id="imagePreviewGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:10px;"></div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                        <span id="imageCountLabel" style="font-size:13px;color:#888;"></span>
                        <div style="display:flex;gap:8px;">
                            <label style="cursor:pointer;background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);border-radius:10px;padding:6px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all 0.2s;">
                                <i class="fas fa-plus" style="font-size:11px;"></i> إضافة المزيد
                                <input type="file" accept="image/*" onchange="handleAddMoreImages(this)" style="display:none;">
                            </label>
                            <button type="button" onclick="removeMedia('image')" style="background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;">
                                <i class="fas fa-trash-alt" style="font-size:11px;"></i> <span data-i18n="حذف الكل">حذف الكل</span></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Video Section -->
            <div id="section-video" class="media-section" style="margin-bottom:20px;">
                <div id="videoUploadZone" class="upload-zone" style="cursor:pointer;position:relative;overflow:hidden;">
                    <input type="file" id="videoFile" accept="video/*" onchange="handleVideoChange(this)" style="position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;font-size:200px;">
                    <div class="upload-zone-icon"><i class="fas fa-film"></i></div>
                    <p style="font-size:14px;color:#999;margin:0 0 4px;" data-i18n="اضغط لاختيار فيديو">اضغط لاختيار فيديو</p>
                    <p style="font-size:12px;color:#555;margin:0;">MP4, MOV, WEBM</p>
                </div>
                <div id="videoPreviewCard" class="preview-card hidden" style="margin-top:12px;">
                    <div class="preview-header">
                        <div class="file-info"><i class="fas fa-video"></i><span id="videoFileName" data-i18n="فيديو">${t("فيديو")}</span></div>
                        <button type="button" class="preview-remove-btn" onclick="removeMedia('video')"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="preview-body">
                        <video id="videoPreviewEl" controls style="max-height:350px;width:100%;background:#000;"></video>
                    </div>
                </div>
            </div>

            <!-- Audio Section -->
            <div id="section-audio" class="media-section" style="margin-bottom:20px;">
                <div id="audioUploadZone" class="upload-zone" style="cursor:pointer;position:relative;overflow:hidden;">
                    <input type="file" id="audioFile" accept="audio/*" onchange="handleAudioChange(this)" style="position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:10;font-size:200px;">
                    <div class="upload-zone-icon"><i class="fas fa-headphones"></i></div>
                    <p style="font-size:14px;color:#999;margin:0 0 4px;" data-i18n="اضغط لاختيار ملف صوتي">اضغط لاختيار ملف صوتي</p>
                    <p style="font-size:12px;color:#555;margin:0;">MP3, WAV, OGG, M4A</p>
                </div>
                <div id="audioPreviewCard" class="preview-card hidden" style="margin-top:12px;">
                    <div class="preview-header">
                        <div class="file-info"><i class="fas fa-music"></i><span id="audioFileName" data-i18n="ملف صوتي" data-i18n="ملف صوتي">${t("ملف صوتي")}</span></div>
                        <button type="button" class="preview-remove-btn" onclick="removeMedia('audio')"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="preview-body">
                        <div class="audio-file-preview">
                            <div class="audio-file-icon"><i class="fas fa-music"></i></div>
                            <div class="audio-file-details">
                                <div id="audioPreviewName" class="audio-file-name" data-i18n="ملف صوتي">ملف صوتي</div>
                                <div id="audioPreviewType" class="audio-file-type">audio</div>
                            </div>
                        </div>
                    </div>
                    <div style="padding:0 16px 16px;">
                        <audio id="audioPreviewEl" controls style="width:100%;height:40px;"></audio>
                    </div>
                </div>
            </div>

            <!-- Recording Section -->
            <div id="section-record" class="media-section" style="margin-bottom:20px;">
                <div id="audioRecorderContainer" style="padding:20px;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);border-radius:16px;display:flex;flex-direction:column;align-items:center;">
                    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:16px;padding:0 8px;">
                        <h3 style="font-size:14px;font-weight:500;color:#888;margin:0;" data-i18n="تسجيل صوتي">تسجيل صوتي</h3>
                        <span id="recordingStatus" style="font-size:12px;font-family:monospace;color:#666;" data-i18n="جاهز">جاهز</span>
                    </div>
                    <div style="display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:16px;">
                        <button type="button" id="startRecordingBtn" style="width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:#000;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;" title="بدء التسجيل">
                            <i class="fas fa-microphone" style="font-size:18px;"></i>
                        </button>
                        <button type="button" id="stopRecordingBtn" style="width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,0.05);background:#1a1a1a;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;" disabled title="إيقاف">
                            <i class="fas fa-stop" style="font-size:18px;"></i>
                        </button>
                    </div>
                    <div id="waveform-preview" style="width:100%;display:none;margin-top:8px;"></div>
                    <div id="audioPlaybackContainer" style="width:100%;display:none;margin-top:16px;">
                        <button id="playPausePreview" type="button" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.05);color:#ccc;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;">
                            <i class="fas fa-play" style="font-size:12px;"></i> <span data-i18n="استمع للتسجيل">استمع للتسجيل</span></button>
                    </div>
                    <div id="recordingPreviewCard" style="width:100%;display:none;margin-top:12px;">
                        <div class="preview-card">
                            <div class="preview-header">
                                <div class="file-info"><i class="fas fa-microphone"></i><span data-i18n="تسجيل صوتي">تسجيل صوتي</span></div>
                                <button type="button" class="preview-remove-btn" onclick="removeMedia('record')"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <div style="padding-top:16px;border-top:1px solid rgba(255,255,255,0.05);">
                <button type="submit" id="submitBtn" class="submit-btn-premium" style="width:100%;padding:14px;border-radius:14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;" disabled>
                    <span id="submitBtnText" data-i18n="نشر المنشور">نشر المنشور</span>
                    <i class="fas fa-paper-plane" style="font-size:13px;transform:scaleX(-1);"></i>
                    <i id="loadingIndicator" class="fas fa-spinner fa-spin" style="display:none;"></i>
                </button>
            </div>

            <div id="errorMessage" style="color:#f87171;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);border-radius:12px;padding:12px;margin-top:16px;text-align:center;font-size:14px;display:none;"></div>
        </form>
    </div>
</div>

<script>var t = (window.AiteI18n && window.AiteI18n.t) ? window.AiteI18n.t : function(s){return s;};

    // ======== CONSTANTS ========
    var form = document.getElementById('createPostForm');
    var mediaFile = document.getElementById('mediaFile');
    var imageFileInput = document.getElementById('imageFile');
    var videoFileInput = document.getElementById('videoFile');
    var audioFileInput = document.getElementById('audioFile');
    var postContent = document.getElementById('postContent');
    var submitBtn = document.getElementById('submitBtn');
    var submitBtnText = document.getElementById('submitBtnText');
    var loadingIndicator = document.getElementById('loadingIndicator');
    var errorMessage = document.getElementById('errorMessage');

    var startRecordingBtn = document.getElementById('startRecordingBtn');
    var stopRecordingBtn = document.getElementById('stopRecordingBtn');
    var recordingStatus = document.getElementById('recordingStatus');
    var waveformPreview = document.getElementById('waveform-preview');
    var audioPlaybackContainer = document.getElementById('audioPlaybackContainer');
    var playPausePreview = document.getElementById('playPausePreview');

    var mediaRecorder;
    var audioChunks = [];
    var audioBlob = null;
    var mediaStream = null;
    var wavesurferPreview;
    var activeTab = null;
    var selectedMediaType = null;

    // ======== MULTI IMAGE STATE ========
    var selectedImageFiles = [];  // Array of File objects
    var MAX_IMAGES = 10;

    // ======== WEBVIEW FILE INPUT FIX ========
    // File inputs are placed INSIDE the upload zones as transparent overlays.
    // This ensures they work natively in WebView without needing programmatic .click().
    // No input replacement is needed since the user taps the overlay directly
    // (not programmatic .click()), which works reliably in Android WebView.

    // ======== TAB SWITCHING ========
    function switchMediaTab(tab) {
        var tabs = document.querySelectorAll('.media-tab');
        var sections = document.querySelectorAll('.media-section');
        if (activeTab === tab) {
            tabs.forEach(function(t) { t.classList.remove('active'); });
            sections.forEach(function(s) { s.classList.remove('active'); });
            activeTab = null;
            return;
        }
        tabs.forEach(function(t) { t.classList.remove('active'); });
        sections.forEach(function(s) { s.classList.remove('active'); });
        var targetTab = document.querySelector('.media-tab[data-tab="' + tab + '"]');
        var targetSection = document.getElementById('section-' + tab);
        if (targetTab) targetTab.classList.add('active');
        if (targetSection) targetSection.classList.add('active');
        activeTab = tab;
    }

    // ======== REMOVE MEDIA ========
    function removeMedia(type) {
        if (type === 'image') {
            selectedImageFiles = []; imageFileInput.value = '';
            document.getElementById('imagePreviewArea').style.display = 'none';
            document.getElementById('imageUploadZone').style.display = '';
            document.getElementById('imagePreviewGrid').innerHTML = '';
            if (selectedMediaType === 'image') { selectedMediaType = null; syncMediaFile(null); }
        } else if (type === 'video') {
            videoFileInput.value = '';
            document.getElementById('videoPreviewCard').classList.add('hidden');
            document.getElementById('videoUploadZone').style.display = '';
            var vid = document.getElementById('videoPreviewEl'); vid.pause(); vid.src = '';
            if (selectedMediaType === 'video') { selectedMediaType = null; syncMediaFile(null); }
        } else if (type === 'audio') {
            audioFileInput.value = '';
            document.getElementById('audioPreviewCard').classList.add('hidden');
            document.getElementById('audioUploadZone').style.display = '';
            var aud = document.getElementById('audioPreviewEl'); aud.pause(); aud.src = '';
            if (selectedMediaType === 'audio') { selectedMediaType = null; syncMediaFile(null); }
        } else if (type === 'record') {
            resetAudioRecording();
            document.getElementById('recordingPreviewCard').style.display = 'none';
            if (selectedMediaType === 'record') { selectedMediaType = null; syncMediaFile(null); }
        }
        checkInputs();
    }

    // ======== SYNC MEDIA FILE ========
    function syncMediaFile(file) {
        if (!file) { try { mediaFile.value = ''; } catch(e) {} return; }
        try {
            var dt = new DataTransfer();
            dt.items.add(file);
            mediaFile.files = dt.files;
        } catch(e) {
            // DataTransfer not supported on some mobile browsers
            console.warn('syncMediaFile fallback:', e);
        }
    }

    // ======== IMAGE HANDLING (MULTIPLE) ========
    function readFileAsDataUrl(file, callback) {
        try {
            var blobUrl = URL.createObjectURL(file);
            callback(blobUrl);
        } catch(err) {
            var reader = new FileReader();
            reader.onload = function(ev) { callback(ev.target.result); };
            reader.onerror = function() { callback(null); };
            reader.readAsDataURL(file);
        }
    }

    function handleImageChange(input) {
        if (!input.files || input.files.length === 0) return;
        var newFiles = Array.from(input.files);
        // Filter only image files
        newFiles = newFiles.filter(function(f) { return f.type && f.type.startsWith('image/'); });
        if (newFiles.length === 0) return;
        // Accumulate files (works in WebView where multiple attribute is not supported)
        var remaining = MAX_IMAGES - selectedImageFiles.length;
        if (remaining <= 0) { input.value = ''; return; }
        selectedImageFiles = selectedImageFiles.concat(newFiles.slice(0, remaining));
        renderImagePreviews();
        document.getElementById('imagePreviewArea').style.display = 'block';
        document.getElementById('imageUploadZone').style.display = 'none';
        selectedMediaType = 'image';
        syncMediaFile(selectedImageFiles[0]);
        clearOtherMedia('image');
        checkInputs();
        input.value = '';
    }

    function handleAddMoreImages(input) {
        if (!input.files || input.files.length === 0) return;
        var newFiles = Array.from(input.files).filter(function(f) { return f.type && f.type.startsWith('image/'); });
        var remaining = MAX_IMAGES - selectedImageFiles.length;
        if (remaining <= 0) { input.value = ''; return; }
        selectedImageFiles = selectedImageFiles.concat(newFiles.slice(0, remaining));
        renderImagePreviews();
        checkInputs();
        input.value = '';
    }

    function removeOneImage(index) {
        selectedImageFiles.splice(index, 1);
        if (selectedImageFiles.length === 0) {
            removeMedia('image');
            return;
        }
        renderImagePreviews();
        syncMediaFile(selectedImageFiles[0]);
        checkInputs();
    }

    function renderImagePreviews() {
        var grid = document.getElementById('imagePreviewGrid');
        var label = document.getElementById('imageCountLabel');
        grid.innerHTML = '';
        selectedImageFiles.forEach(function(file, idx) {
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);background:#111;';
            var img = document.createElement('img');
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
            readFileAsDataUrl(file, function(url) { img.src = url; });
            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.style.cssText = 'position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.7);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:2;transition:background 0.2s;';
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
            removeBtn.onclick = (function(i) { return function() { removeOneImage(i); }; })(idx);
            var numBadge = document.createElement('span');
            numBadge.style.cssText = 'position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;z-index:2;';
            numBadge.textContent = (idx + 1);
            wrapper.appendChild(img);
            wrapper.appendChild(removeBtn);
            wrapper.appendChild(numBadge);
            grid.appendChild(wrapper);
        });
        label.textContent = selectedImageFiles.length + ' / ' + MAX_IMAGES + ' صور';
    }

    // ======== VIDEO HANDLING ========
    function handleVideoChange(input) {
        if (!input.files || !input.files[0]) return;
        var file = input.files[0];
        try {
            document.getElementById('videoPreviewEl').src = URL.createObjectURL(file);
        } catch(err) {
            var reader = new FileReader();
            reader.onload = function(ev) { document.getElementById('videoPreviewEl').src = ev.target.result; };
            reader.readAsDataURL(file);
        }
        document.getElementById('videoFileName').textContent = file.name;
        document.getElementById('videoPreviewCard').classList.remove('hidden');
        document.getElementById('videoUploadZone').style.display = 'none';
        selectedMediaType = 'video'; syncMediaFile(file); clearOtherMedia('video');
        checkInputs();
    }

    // ======== AUDIO HANDLING ========
    function handleAudioChange(input) {
        if (!input.files || !input.files[0]) return;
        var file = input.files[0];
        try {
            document.getElementById('audioPreviewEl').src = URL.createObjectURL(file);
        } catch(err) {
            var reader = new FileReader();
            reader.onload = function(ev) { document.getElementById('audioPreviewEl').src = ev.target.result; };
            reader.readAsDataURL(file);
        }
        document.getElementById('audioPreviewName').textContent = file.name;
        document.getElementById('audioPreviewType').textContent = file.type || 'audio';
        document.getElementById('audioFileName').textContent = file.name;
        document.getElementById('audioPreviewCard').classList.remove('hidden');
        document.getElementById('audioUploadZone').style.display = 'none';
        selectedMediaType = 'audio'; syncMediaFile(file); clearOtherMedia('audio');
        checkInputs();
    }

    // ======== CLEAR OTHER MEDIA ========
    function clearOtherMedia(keepType) {
        if (keepType !== 'image' && selectedImageFiles.length > 0) {
            selectedImageFiles = []; imageFileInput.value = '';
            document.getElementById('imagePreviewArea').style.display = 'none';
            document.getElementById('imageUploadZone').style.display = '';
            document.getElementById('imagePreviewGrid').innerHTML = '';
        }
        if (keepType !== 'video' && videoFileInput.files.length > 0) {
            videoFileInput.value = '';
            document.getElementById('videoPreviewCard').classList.add('hidden');
            document.getElementById('videoUploadZone').style.display = '';
            var vid = document.getElementById('videoPreviewEl'); vid.pause(); vid.src = '';
        }
        if (keepType !== 'audio' && audioFileInput.files.length > 0) {
            audioFileInput.value = '';
            document.getElementById('audioPreviewCard').classList.add('hidden');
            document.getElementById('audioUploadZone').style.display = '';
            var aud = document.getElementById('audioPreviewEl'); aud.pause(); aud.src = '';
        }
        if (keepType !== 'record' && audioBlob) {
            resetAudioRecording();
            document.getElementById('recordingPreviewCard').style.display = 'none';
        }
    }

    // ======== WAVESURFER ========
    function initializeWaveSurfer() {
        if (wavesurferPreview) wavesurferPreview.destroy();
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        wavesurferPreview = WaveSurfer.create({
            container: '#waveform-preview',
            waveColor: isLight ? '#b0b0b0' : '#404040',
            progressColor: isLight ? '#1c1e21' : '#ffffff',
            cursorColor: 'transparent', barWidth: 2, barRadius: 2, barGap: 2,
            responsive: true, height: 80, backend: 'MediaElement', rtl: true,
        });
        playPausePreview.onclick = function() { wavesurferPreview.playPause(); };
        wavesurferPreview.on('play', function() { playPausePreview.innerHTML = '<i class="fas fa-pause" style="font-size:12px;"></i> إيقاف مؤقت'; });
        wavesurferPreview.on('pause', function() { playPausePreview.innerHTML = '<i class="fas fa-play" style="font-size:12px;"></i> استمع للتسجيل'; });
        wavesurferPreview.on('finish', function() { playPausePreview.innerHTML = '<i class="fas fa-redo" style="font-size:12px;"></i> إعادة'; wavesurferPreview.seekTo(0); });
    }

    // ======== RECORDING ========
    async function startRecording() {
        try {
            initializeWaveSurfer();
            waveformPreview.style.display = '';
            audioPlaybackContainer.style.display = 'none';
            document.getElementById('recordingPreviewCard').style.display = 'none';
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(mediaStream);
            audioChunks = []; audioBlob = null;
            mediaRecorder.ondataavailable = function(event) { audioChunks.push(event.data); };
            mediaRecorder.onstop = function() {
                startRecordingBtn.classList.remove('recording-pulse');
                startRecordingBtn.innerHTML = '<i class="fas fa-microphone" style="font-size:18px;"></i>';
                audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                var audioUrl = URL.createObjectURL(audioBlob);
                wavesurferPreview.load(audioUrl);
                audioPlaybackContainer.style.display = '';
                document.getElementById('recordingPreviewCard').style.display = '';
                var recordedFile = new File([audioBlob], "recorded_audio.webm", { type: mediaRecorder.mimeType });
                selectedMediaType = 'record'; syncMediaFile(recordedFile); clearOtherMedia('record');
                recordingStatus.textContent = t('تم الالتقاط'); checkInputs();
            };
            mediaRecorder.start();
            startRecordingBtn.disabled = true; stopRecordingBtn.disabled = false;
            startRecordingBtn.classList.add('recording-pulse');
            startRecordingBtn.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;font-size:12px;"></i>';
            recordingStatus.textContent = t('جاري التسجيل...');
        } catch (err) {
            console.error('Error:', err);
            recordingStatus.textContent = t('خطأ ميكروفون');
            startRecordingBtn.disabled = false; stopRecordingBtn.disabled = true;
            startRecordingBtn.classList.remove('recording-pulse');
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (mediaStream) mediaStream.getTracks().forEach(function(t) { t.stop(); });
        startRecordingBtn.disabled = false; stopRecordingBtn.disabled = true;
        startRecordingBtn.classList.remove('recording-pulse');
    }

    function resetAudioRecording() {
        stopRecording();
        if (wavesurferPreview) { wavesurferPreview.empty(); wavesurferPreview.destroy(); wavesurferPreview = null; }
        audioPlaybackContainer.style.display = 'none';
        waveformPreview.style.display = 'none';
        recordingStatus.textContent = t('جاهز');
        audioBlob = null; audioChunks = [];
    }

    // ======== CHECK INPUTS ========
    function checkInputs() {
        var hasContent = postContent.value.trim().length > 0;
        var hasMedia = mediaFile.files.length > 0 || selectedImageFiles.length > 0;
        submitBtn.disabled = !(hasContent || hasMedia);
    }

    postContent.addEventListener('input', checkInputs);
    startRecordingBtn.addEventListener('click', startRecording);
    stopRecordingBtn.addEventListener('click', stopRecording);

    // ======== IMAGE COMPRESSION (high quality) ========
    async function compressImage(file, maxWidth, maxHeight, quality) {
        maxWidth = maxWidth || 1920; maxHeight = maxHeight || 1920; quality = quality || 0.85;
        if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
        return new Promise(function(resolve) {
            var img = new Image();
            img.onload = function() {
                var w = img.width, h = img.height;
                var ratio = Math.min(maxWidth / w, maxHeight / h, 1);
                var canvas = document.createElement('canvas');
                canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(function(blob) {
                    resolve(blob ? new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg', lastModified: Date.now() }) : file);
                }, 'image/jpeg', quality);
            };
            img.onerror = function() { resolve(file); };
            var objUrl = URL.createObjectURL(file);
            img.src = objUrl;
        });
    }

    // ======== IMAGEKIT UPLOAD (with retry) ========
    async function _uploadToImageKitOnce(file, resourceType, authData) {
        var fd = new FormData();
        fd.append('file', file);
        fd.append('publicKey', authData.publicKey);
        fd.append('signature', authData.signature);
        fd.append('expire', authData.expire);
        fd.append('token', authData.token);
        fd.append('folder', authData.folder);
        fd.append('fileName', Date.now() + '-' + (file.name || 'file'));
        var uploadUrl = 'https://upload.imagekit.io/api/v1/files/upload';
        return new Promise(function(resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', uploadUrl, true);
            xhr.timeout = 300000; // 5 minutes
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    if (submitBtnText) submitBtnText.textContent = t('جاري الرفع ') + pct + '%';
                }
            };
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.error) return reject(new Error(data.error || 'فشل رفع الملف'));
                        resolve(data.url);
                    } catch(e) { reject(new Error('استجابة غير صالحة من خدمة الرفع')); }
                } else reject(new Error('فشل رفع الملف (HTTP ' + xhr.status + ')'));
            };
            xhr.onerror = function() { reject(new Error('خطأ في الاتصال أثناء الرفع')); };
            xhr.ontimeout = function() { reject(new Error('انتهت مهلة الرفع - حاول مرة أخرى')); };
            xhr.send(fd);
        });
    }

    async function uploadToImageKit(file, resourceType) {
        var maxRetries = 3;
        var lastError = null;
        for (var attempt = 0; attempt < maxRetries; attempt++) {
            try {
                if (attempt > 0) {
                    if (submitBtnText) submitBtnText.textContent = t('إعادة المحاولة...');
                    await new Promise(function(r) { setTimeout(r, 1000 * attempt); });
                }
                var authRes = await fetch('/api/imagekit/auth', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folder: 'post_media', resource_type: resourceType }),
                    credentials: 'same-origin'
                });
                if (!authRes.ok) throw new Error('فشل الاتصال بالخادم');
                var authData = await authRes.json();
                if (!authData.ok) throw new Error(authData.error || 'فشل في الحصول على مصادقة الرفع');
                return await _uploadToImageKitOnce(file, resourceType, authData);
            } catch(err) {
                console.warn('Upload attempt ' + (attempt+1) + '/' + maxRetries + ' failed:', err.message);
                lastError = err;
            }
        }
        throw lastError;
    }

    // ======== SUBMIT ========
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtnText.textContent = t('جاري النشر');
        loadingIndicator.style.display = '';
        errorMessage.style.display = 'none';

        var content = postContent.value.trim();
        var mediaUrl = null;
        var mediaType = null;

        var mediaUrls = null;
        try {
            if (selectedImageFiles.length > 0) {
                mediaType = 'image';
                // Upload all selected images
                var uploadedUrls = [];
                for (var i = 0; i < selectedImageFiles.length; i++) {
                    submitBtnText.textContent = t('جاري ضغط الصورة ') + (i + 1) + '/' + selectedImageFiles.length + '...';
                    var compressed = await compressImage(selectedImageFiles[i]);
                    submitBtnText.textContent = t('جاري رفع الصورة ') + (i + 1) + '/' + selectedImageFiles.length + '...';
                    var url = await uploadToImageKit(compressed, 'image');
                    uploadedUrls.push(url);
                }
                mediaUrl = uploadedUrls[0];
                if (uploadedUrls.length > 1) {
                    mediaUrls = uploadedUrls;
                }
            } else if (mediaFile.files.length > 0) {
                var file = mediaFile.files[0];
                var mimeType = file.type || '';
                var resourceType = 'auto';
                if (mimeType.startsWith('image/')) { resourceType = 'image'; mediaType = 'image'; }
                else if (mimeType.startsWith('video/')) { resourceType = 'video'; mediaType = 'video'; }
                else if (mimeType.startsWith('audio/')) { resourceType = 'video'; mediaType = 'audio'; }
                else { resourceType = 'auto'; mediaType = 'raw'; }
                if (mediaType === 'image') {
                    submitBtnText.textContent = t('جاري الضغط...');
                    file = await compressImage(file);
                }
                submitBtnText.textContent = t('جاري رفع الملف...');
                mediaUrl = await uploadToImageKit(file, resourceType);
            }

            submitBtnText.textContent = t('جاري النشر...');
            var bodyData = { content: content, mediaUrl: mediaUrl, mediaType: mediaType };
            if (mediaUrls && mediaUrls.length > 1) {
                bodyData.mediaUrls = mediaUrls;
            }

            var response = await fetch(form.action, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData), credentials: 'same-origin'
            });
            var result = await response.json();
            if (response.ok && result.ok) {
                window.location.href = '/chat_list';
            } else {
                errorMessage.textContent = result.error || 'حدث خطأ';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false; submitBtnText.textContent = t('نشر المنشور');
                loadingIndicator.style.display = 'none';
            }
        } catch (error) {
            console.error('Error:', error);
            errorMessage.textContent = t('خطأ: ') + (error.message || 'فشل الاتصال.');
            errorMessage.style.display = 'block';
            submitBtn.disabled = false; submitBtnText.textContent = t('نشر المنشور');
            loadingIndicator.style.display = 'none';
        }
    });

    document.addEventListener('DOMContentLoaded', function() { checkInputs(); });
</script>

<script>
(function(){
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;

  var bar = document.getElementById('aite-progress-bar');
  var currentProgress = 0;
  var progressTimer = null;
  var isNavigating = false;

  function setProgress(value) {
    currentProgress = Math.min(value, 100);
    if (bar) bar.style.width = currentProgress + '%';
  }

  function startProgress() {
    if (isNavigating) return;
    isNavigating = true;
    currentProgress = 0;
    if (bar) {
      bar.style.transition = 'none';
      bar.style.width = '0';
      bar.style.opacity = '0';
      void bar.offsetWidth;
      bar.classList.add('active');
      bar.style.opacity = '1';
      bar.style.transition = 'width 150ms ease-out';
    }
    setProgress(15);
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(function() {
      if (currentProgress < 50) setProgress(currentProgress + 3);
      else if (currentProgress < 75) setProgress(currentProgress + 1.5);
      else if (currentProgress < 90) setProgress(currentProgress + 0.5);
      if (currentProgress >= 92) { clearInterval(progressTimer); progressTimer = null; }
    }, 150);
  }

  function completeProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (!bar) return;
    bar.style.transition = 'width 100ms ease-out';
    setProgress(100);
    setTimeout(function() {
      bar.style.transition = 'opacity 200ms ease';
      bar.style.opacity = '0';
      setTimeout(function() {
        bar.classList.remove('active');
        bar.style.width = '0';
        bar.style.transition = 'width 150ms ease-out';
        bar.style.opacity = '';
        currentProgress = 0;
        isNavigating = false;
      }, 200);
    }, 150);
  }

  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startProgress();
  });

  window.addEventListener('beforeunload', function() { startProgress(); });
  window.addEventListener('pageshow', function() { completeProgress(); });
  if (document.readyState === 'complete') completeProgress();
  else window.addEventListener('load', function() { completeProgress(); });

  document.addEventListener('contextmenu', function(e) {
    var tag = e.target.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !e.target.isContentEditable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('dragstart', function(e) { e.preventDefault(); }, { passive: false });

  var offlineOverlay = document.getElementById('aite-offline-overlay');
  function checkOnline() {
    if (!navigator.onLine && offlineOverlay) offlineOverlay.classList.add('show');
    else if (offlineOverlay) offlineOverlay.classList.remove('show');
  }
  window.addEventListener('online', checkOnline);
  window.addEventListener('offline', checkOnline);

  var notifSound = null;
  try { notifSound = new Audio('/notification.mp3'); notifSound.volume = 1.0; notifSound.preload = 'auto'; } catch(e) {}
  window.aitePlayNotificationSound = function() {
    try {
      if (notifSound) { notifSound.currentTime = 0; notifSound.play().catch(function(){}); }
      if (navigator.vibrate) navigator.vibrate([0, 300, 200, 300]);
    } catch(e) {}
  };
  document.addEventListener('aite-new-notification', function() { window.aitePlayNotificationSound(); });
})();
</script>

<!-- Aite Web Push Subscription -->
<script>
(function(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  async function subscribeWebPush() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) return; // already subscribed

      const resp = await fetch('/api/vapid-public-key');
      const data = await resp.json();
      if (!data.ok || !data.publicKey) return;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;

      const applicationServerKey = urlBase64ToUint8Array(data.publicKey);
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey
      });

      await fetch('/api/web-push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });
    } catch (e) {
      console.warn('Web Push subscription failed:', e);
    }
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Subscribe after page loads (with small delay to not block rendering)
  if (document.readyState === 'complete') {
    setTimeout(subscribeWebPush, 2000);
  } else {
    window.addEventListener('load', function() {
      setTimeout(subscribeWebPush, 2000);
    });
  }
})();
</script>

.ptr-indicator.ptr-ready .ptr-arrow {
  transform: rotate(135deg);
  margin-top: 4px;
}
.ptr-indicator.ptr-loading .ptr-arrow {
  border: 2px solid #6ee7b7;
  border-radius: 50%;
  border-top-color: transparent;
  width: 18px; height: 18px;
  transform: none;
  margin-top: 0;
  animation: ptr-spin 0.6s linear infinite;
}
@keyframes ptr-spin { to { transform: rotate(360deg); } }
</style>
<div class="ptr-indicator" id="ptr-indicator"><div class="ptr-arrow"></div></div>
<script>
(function() {
  var ptrEl = document.getElementById('ptr-indicator');
  if (!ptrEl) return;
  var startY = 0, pulling = false, activated = false;
  var threshold = 90, deadZone = 15;

  function isAtPageTop() {
    return (window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0) <= 2;
  }

  function isInsideScrollable(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      var style = window.getComputedStyle(el);
      var oy = style.overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight && el.scrollTop > 0) {
        return true;
      }
      el = el.parentElement;
    }
    return false;
  }

  document.addEventListener('touchstart', function(e) {
    if (!isAtPageTop()) return;
    if (isInsideScrollable(e.target)) return;
    startY = e.touches[0].clientY;
    pulling = true;
    activated = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    var currentY = e.touches[0].clientY;
    var dist = currentY - startY;

    if (!isAtPageTop()) {
      pulling = false;
      ptrEl.style.top = '-50px';
      ptrEl.classList.remove('ptr-ready');
      return;
    }

    if (dist < deadZone) return;

    var realDist = dist - deadZone;
    var progress = Math.min(realDist / threshold, 1);
    var top = Math.min(realDist * 0.35, 50);
    ptrEl.style.top = (top - 15) + 'px';
    ptrEl.style.transition = 'none';

    if (progress >= 1) {
      ptrEl.classList.add('ptr-ready');
      activated = true;
    } else {
      ptrEl.classList.remove('ptr-ready');
      activated = false;
    }

    if (realDist > 5 && e.cancelable) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (!pulling) return;
    ptrEl.style.transition = 'top 0.25s ease';
    if (activated) {
      ptrEl.style.top = '12px';
      ptrEl.classList.remove('ptr-ready');
      ptrEl.classList.add('ptr-loading');
      setTimeout(function() { location.reload(); }, 350);
    } else {
      ptrEl.style.top = '-50px';
      ptrEl.classList.remove('ptr-ready');
    }
    pulling = false;
    activated = false;
    startY = 0;
  }, { passive: true });
})();
</script>

</body>
