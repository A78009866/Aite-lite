<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء منشور جديد - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #3b82f6; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background-color: #1f2937;
        }

        /* نمط WaveSurfer لمنطقة المعاينة */
        #waveform-preview {
            height: 80px; 
            background-color: #1f2937;
            border-radius: 6px;
        }
        
        /* تأثير النبض على زر التسجيل أثناء التسجيل */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="fixed top-4 right-4 z-40">
        <a href="/chat_list" class="flex items-center text-blue-500 hover:text-blue-400 transition duration-300 bg-[#18191a] p-2 rounded-lg shadow-lg">
            <i class="fas fa-arrow-right ml-2"></i>
            العودة للرئيسية
        </a>
    </div>

    <div class="bg-[#18191a] p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-2xl">
        <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-white text-center border-b border-gray-700 pb-4">
            <i class="fas fa-feather-alt text-blue-500 ml-2"></i>
            نشر فكرة جديدة
        </h1>
        
        <form id="createPostForm" action="/api/posts/create" method="POST" enctype="multipart/form-data">
            
            <div class="mb-4">
                <textarea id="postContent" name="content" rows="4" placeholder="شاركنا بما يدور في ذهنك اليوم (اختياري)..."
                          class="custom-scroll w-full p-4 bg-[#242526] border border-gray-700 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-500 resize-none transition duration-300"></textarea>
            </div>
            
            <input type="file" id="mediaFile" name="media" accept="image/*,audio/*,video/*" class="hidden">

            <div id="mediaPreviewContainer" class="hidden mb-4 p-4 bg-[#242526] rounded-lg border border-dashed border-gray-600 relative">
                <div class="flex justify-center items-center">
                    <div id="filePreview" class="max-h-60 overflow-hidden rounded-lg w-full">
                    </div>
                </div>
                <button type="button" id="removeMediaBtn" class="absolute top-2 left-2 text-white bg-red-600 hover:bg-red-700 rounded-full p-2 w-8 h-8 flex items-center justify-center transition duration-300">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <div id="audioRecorderContainer" class="mb-4 p-4 bg-[#1f2937] border border-gray-700 rounded-lg flex flex-col items-center">
                <h3 class="text-lg font-semibold text-white mb-4">تسجيل رسالة صوتية</h3>
                
                <div class="flex items-center space-x-4 space-x-reverse mb-3">
                    <button type="button" id="startRecordingBtn" class="p-3 bg-red-600 hover:bg-red-700 rounded-full text-white w-12 h-12 flex items-center justify-center transition disabled:opacity-50" title="بدء التسجيل">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button type="button" id="stopRecordingBtn" class="p-3 bg-gray-500 hover:bg-gray-600 rounded-full text-white w-12 h-12 flex items-center justify-center transition disabled:opacity-50" disabled title="إيقاف التسجيل">
                        <i class="fas fa-stop"></i>
                    </button>
                </div>
                
                <span id="recordingStatus" class="text-white text-lg">جاهز للتسجيل</span>

                <div id="waveform-preview" class="w-full hidden mt-4">
                    </div>

                <div id="audioPlaybackContainer" class="w-full mt-4 hidden">
                    <button id="playPausePreview" type="button" class="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition duration-300 w-full">
                        <i class="fas fa-play ml-2"></i> تشغيل / إيقاف المعاينة
                    </button>
                </div>
            </div>
            
            <div class="flex justify-between items-center border-t border-gray-700 pt-4">
                
                <button type="button" id="addMediaBtn" class="text-gray-400 hover:text-blue-500 transition duration-300 flex items-center text-sm sm:text-base">
                    <i class="fas fa-image text-lg ml-2"></i>
                    أضف صورة/فيديو (اختياري)
                </button>

                <button type="submit" id="submitBtn" class="p-2.5 px-6 bg-blue-600 border-none rounded-lg text-white font-semibold cursor-pointer transition-all duration-300 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center" disabled>
                    <span id="submitBtnText">نشر المنشور</span>
                    <i id="loadingIndicator" class="fas fa-spinner fa-spin mr-2 hidden"></i>
                </button>
            </div>
            
            <div id="errorMessage" class="text-red-500 mt-3 text-center hidden"></div>

        </form>
    </div>
    
    <script>
        // ************** الثوابت والمتغيرات **************
        const form = document.getElementById('createPostForm');
        const mediaFile = document.getElementById('mediaFile');
        const addMediaBtn = document.getElementById('addMediaBtn');
        const removeMediaBtn = document.getElementById('removeMediaBtn');
        const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
        const filePreview = document.getElementById('filePreview');
        const postContent = document.getElementById('postContent');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        const audioRecorderContainer = document.getElementById('audioRecorderContainer');
        
        // متغيرات تسجيل الصوت والـ WaveSurfer
        const startRecordingBtn = document.getElementById('startRecordingBtn');
        const stopRecordingBtn = document.getElementById('stopRecordingBtn');
        const recordingStatus = document.getElementById('recordingStatus');
        const waveformPreview = document.getElementById('waveform-preview'); 
        const audioPlaybackContainer = document.getElementById('audioPlaybackContainer');
        const playPausePreview = document.getElementById('playPausePreview');
        
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let mediaStream = null;
        let wavesurferPreview; 
        
        // ************** تهيئة WaveSurfer **************
        function initializeWaveSurfer() {
            if (wavesurferPreview) {
                 wavesurferPreview.destroy();
            }
            wavesurferPreview = WaveSurfer.create({
                container: '#waveform-preview',
                waveColor: '#4f46e5', // Indigo-600
                progressColor: '#3b82f6', // Blue-500
                cursorColor: '#ef4444', // Red-500
                barWidth: 3,
                barRadius: 3,
                responsive: true,
                height: 80,
                backend: 'MediaElement',
                rtl: true,
            });
            
            // ربط التحكم بالزر المخصص
            playPausePreview.onclick = () => {
                wavesurferPreview.playPause();
            };

            wavesurferPreview.on('play', () => {
                playPausePreview.innerHTML = '<i class="fas fa-pause ml-2"></i> إيقاف مؤقت';
            });
            wavesurferPreview.on('pause', () => {
                playPausePreview.innerHTML = '<i class="fas fa-play ml-2"></i> تشغيل / إيقاف المعاينة';
            });
            wavesurferPreview.on('finish', () => {
                 playPausePreview.innerHTML = '<i class="fas fa-redo ml-2"></i> إعادة التشغيل';
                 wavesurferPreview.seekTo(0); // العودة للبداية
            });
        }

        // ************** وظائف تسجيل الصوت **************

        async function startRecording() {
            try {
                // إخفاء المعاينة القديمة وتهيئة WaveSurfer
                initializeWaveSurfer();
                waveformPreview.classList.remove('hidden');
                audioPlaybackContainer.classList.add('hidden');
                
                // طلب الوصول إلى الميكروفون
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];
                audioBlob = null;

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                // عند الإيقاف
                mediaRecorder.onstop = () => {
                    // إزالة تأثير النبض
                    startRecordingBtn.classList.remove('recording-pulse');
                    
                    audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    // تحميل ملف الصوت في WaveSurfer لعرض الموجة ومعاينة التشغيل
                    wavesurferPreview.load(audioUrl); 
                    
                    audioPlaybackContainer.classList.remove('hidden');
                    
                    // إعداد ملف الإرسال
                    const recordedFile = new File([audioBlob], "recorded_audio.webm", { type: mediaRecorder.mimeType });
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(recordedFile);
                    mediaFile.files = dataTransfer.files; 
                    
                    recordingStatus.textContent = 'تم التسجيل. اضغط للتشغيل.';
                    checkInputs();
                };

                mediaRecorder.start();
                
                // تحديث واجهة المستخدم
                startRecordingBtn.disabled = true;
                stopRecordingBtn.disabled = false;
                startRecordingBtn.classList.add('recording-pulse'); // إضافة تأثير النبض
                recordingStatus.textContent = 'جاري التسجيل...';
                
            } catch (err) {
                console.error('Error accessing microphone:', err);
                recordingStatus.textContent = 'فشل الوصول للميكروفون. تأكد من إعطاء الصلاحية.';
                startRecordingBtn.disabled = false;
                stopRecordingBtn.disabled = true;
                startRecordingBtn.classList.remove('recording-pulse');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            startRecordingBtn.disabled = false;
            stopRecordingBtn.disabled = true;
            startRecordingBtn.classList.remove('recording-pulse');
        }
        
        function resetAudioRecording() {
            stopRecording();
            if(wavesurferPreview) {
                wavesurferPreview.empty();
                wavesurferPreview.destroy();
                wavesurferPreview = null;
            }
            audioPlaybackContainer.classList.add('hidden');
            waveformPreview.classList.add('hidden');
            recordingStatus.textContent = 'جاهز للتسجيل';
            mediaFile.value = ''; // إزالة الملف الصوتي المسجل
            audioBlob = null;
            audioChunks = [];
        }

        // ************** وظيفة المعاينة للملفات العادية **************
        function setupPreview(file) {
            const fileType = file.type.split('/')[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                let previewElement;
                filePreview.innerHTML = ''; 

                if (fileType === 'image') {
                    previewElement = `<img src="${e.target.result}" alt="Media Preview" class="w-full h-full object-contain">`;
                } else if (fileType === 'video') {
                    previewElement = `<video src="${e.target.result}" controls class="rounded-lg mt-3 w-full max-h-60 object-contain"></video>`;
                } else if (fileType === 'audio') {
                    // عرض ملف صوتي عادي كمعاينة إذا لم يكن ملفاً مسجلاً
                    previewElement = `<div class="bg-gray-700 p-3 rounded-lg flex items-center justify-center"><i class="fas fa-music text-blue-400 text-xl ml-2"></i> ملف صوتي جاهز للإرسال: ${file.name}</div>`;
                } else {
                    previewElement = `<div class="text-red-500">لا يمكن معاينة هذا النوع من الملفات.</div>`;
                }

                filePreview.innerHTML = previewElement;
                mediaPreviewContainer.classList.remove('hidden');
                
                // إخفاء مسجل الصوت وإعادة تهيئته لتجنب تضارب الملفات
                audioRecorderContainer.classList.add('hidden');
                resetAudioRecording(); 
            };

            reader.readAsDataURL(file);
        }

        // ************** معالجة المدخلات والأزرار **************
        function checkInputs() {
            const hasContent = postContent.value.trim().length > 0;
            const hasMediaFile = mediaFile.files.length > 0;
            
            if (hasContent || hasMediaFile) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // ربط الأحداث
        addMediaBtn.addEventListener('click', () => {
            // إخفاء مسجل الصوت عند اختيار ملف خارجي
            audioRecorderContainer.classList.add('hidden');
            resetAudioRecording();
            mediaFile.click();
        });

        removeMediaBtn.addEventListener('click', () => {
            mediaFile.value = ''; 
            filePreview.innerHTML = '';
            mediaPreviewContainer.classList.add('hidden');
            // إعادة إظهار مسجل الصوت بعد إزالة الملف
            audioRecorderContainer.classList.remove('hidden'); 
            checkInputs(); 
        });

        mediaFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                setupPreview(e.target.files[0]);
                // عند اختيار ملف، نخفي أي معاينة صوتية سابقة
                resetAudioRecording(); 
            }
            checkInputs(); 
        });

        postContent.addEventListener('input', checkInputs); 
        
        // أحداث تسجيل الصوت
        startRecordingBtn.addEventListener('click', startRecording);
        stopRecordingBtn.addEventListener('click', stopRecording);


        // ************** معالجة إرسال النموذج **************
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtnText.textContent = 'نشر...';
            loadingIndicator.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            const formData = new FormData();
            formData.append('content', postContent.value.trim());

            // معالجة ملف الوسائط (سواء كان مرفوعاً أو مسجلاً)
            if (mediaFile.files.length > 0) {
                formData.append('media', mediaFile.files[0]);
            } 
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (response.ok && result.ok) {
                    sessionStorage.setItem('postSuccess', 'true');
                    window.location.href = '/chat_list';
                    
                } else {
                    errorMessage.textContent = result.error || 'حدث خطأ غير معروف أثناء النشر.';
                    errorMessage.classList.remove('hidden');
                    
                    submitBtn.disabled = false;
                    submitBtnText.textContent = 'نشر المنشور';
                    loadingIndicator.classList.add('hidden');
                }
            } catch (error) {
                console.error('Network or client error:', error);
                errorMessage.textContent = 'فشل الاتصال بالخادم. حاول مرة أخرى.';
                errorMessage.classList.remove('hidden');
                
                submitBtn.disabled = false;
                submitBtnText.textContent = 'نشر المنشور';
                loadingIndicator.classList.add('hidden');
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            checkInputs(); 
        });
    </script>
    
</body>
</html>
