<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - المحادثات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Glassmorphism Styles */
        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        
        .chat-item:active {
            background-color: rgba(255, 255, 255, 0.08);
            transform: scale(0.98);
        }

        /* Verified Badge */
        .verified-badge-img {
            width: 14px;
            height: 14px;
            margin-right: 4px;
            vertical-align: middle;
            display: inline-block;
        }

        /* Online Status */
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border: 2px solid #000;
            border-radius: 50%;
        }

        /* Loading */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass-navbar p-4 flex justify-between items-center h-16">
        <h1 class="text-xl font-bold text-white tracking-wide" style="font-family: 'Montserrat', sans-serif;">Chats</h1>
        <div class="flex gap-4">
            <button class="text-gray-300 hover:text-white transition">
                <i class="fas fa-search text-lg"></i>
            </button>
            <button class="text-gray-300 hover:text-white transition relative">
                <i class="fas fa-edit text-lg"></i>
            </button>
        </div>
    </header>

    <main id="chatListContainer" class="p-2 space-y-2 mt-2">
        <div class="loader" id="initialLoader"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass-navbar flex justify-around items-center py-3 z-50">
        <a href="/" class="flex flex-col items-center text-gray-500 hover:text-white transition group">
            <i class="fas fa-home text-xl mb-1 group-hover:scale-110 transition-transform"></i>
        </a>
        <a href="/explore" class="flex flex-col items-center text-gray-500 hover:text-white transition group">
            <i class="fas fa-compass text-xl mb-1 group-hover:scale-110 transition-transform"></i>
        </a>
        <a href="/create" class="flex flex-col items-center text-white -mt-8">
            <div class="bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/50 hover:bg-blue-500 transition border border-white/20">
                <i class="fas fa-plus text-lg"></i>
            </div>
        </a>
        <a href="/chat_list" class="flex flex-col items-center text-white transition group">
            <div class="relative">
                <i class="fas fa-comment-alt text-xl mb-1 group-hover:scale-110 transition-transform"></i>
                <span id="navUnreadBadge" class="absolute -top-1 -right-1 bg-red-500 text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
            </div>
        </a>
        <a href="/profile" class="flex flex-col items-center text-gray-500 hover:text-white transition group">
            <i class="fas fa-user text-xl mb-1 group-hover:scale-110 transition-transform"></i>
        </a>
    </nav>

    <script>
        const chatListContainer = document.getElementById('chatListContainer');
        const initialLoader = document.getElementById('initialLoader');
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        
        let eventSource = null;

        // بدء الاتصال بالخادم (Real-time)
        function initRealTimeChats() {
            // نستخدم القناة الجديدة التي أنشأناها في السيرفر
            eventSource = new EventSource('/api/chats/live');

            eventSource.onmessage = (event) => {
                if(initialLoader) initialLoader.style.display = 'none';
                
                const chats = JSON.parse(event.data);
                updateChatListUI(chats);
            };

            eventSource.onerror = (err) => {
                console.error("SSE Error:", err);
                eventSource.close();
                // إعادة المحاولة بعد 5 ثواني في حال انقطاع الاتصال
                setTimeout(initRealTimeChats, 5000);
            };
        }

        // تحديث الواجهة بذكاء (Smart Update) بدون حذف كل شيء
        function updateChatListUI(chats) {
            const container = document.getElementById('chatListContainer');
            
            if (chats.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 mt-10 text-sm">لا توجد محادثات. ابدأ محادثة جديدة!</div>';
                return;
            }

            // مصفوفة لتتبع المحادثات الحالية للترتيب
            const currentIds = Array.from(container.children).map(el => el.id.replace('chat-', ''));

            chats.forEach((chat, index) => {
                let chatEl = document.getElementById(`chat-${chat.chatId}`);

                if (chatEl) {
                    // --- تحديث عنصر موجود ---
                    updateChatElementContent(chatEl, chat);
                    
                    // إعادة الترتيب إذا تغير مكانه (نستخدم order في flexbox أو النقل المباشر)
                    // هنا سنقوم بنقله للمكان الصحيح إذا لم يكن في مكانه
                    if (container.children[index] !== chatEl) {
                       container.insertBefore(chatEl, container.children[index]);
                    }

                } else {
                    // --- إنشاء عنصر جديد ---
                    chatEl = createChatElement(chat);
                    // إضافته في المكان الصحيح (الترتيب يأتي جاهزاً من السيرفر)
                    if (container.children[index]) {
                        container.insertBefore(chatEl, container.children[index]);
                    } else {
                        container.appendChild(chatEl);
                    }
                }
            });

            // حذف المحادثات التي تم حذفها من السيرفر
            const newIds = chats.map(c => c.chatId);
            Array.from(container.children).forEach(child => {
                if (child.id.startsWith('chat-') && !newIds.includes(child.id.replace('chat-', ''))) {
                    child.remove();
                }
            });

            // تحديث شارة الرسائل غير المقروءة في الأسفل
            updateTotalUnread(chats);
        }

        // إنشاء كود HTML لعنصر المحادثة
        function createChatElement(chat) {
            const div = document.createElement('div');
            div.id = `chat-${chat.chatId}`;
            div.className = 'chat-item w-full p-3 rounded-xl flex items-center gap-3 cursor-pointer mb-1 relative';
            div.onclick = () => window.location.href = `/chat?chatId=${chat.chatId}`;
            
            // الهيكل الداخلي
            div.innerHTML = `
                <div class="relative">
                    <img id="img-${chat.chatId}" src="${chat.otherUser.profile_picture_url}" class="w-12 h-12 rounded-full object-cover border border-gray-700">
                    <span id="online-${chat.chatId}" class="online-dot ${chat.otherUser.is_online ? '' : 'hidden'}"></span>
                </div>
                <div class="flex-grow min-w-0">
                    <div class="flex justify-between items-baseline mb-1">
                        <h3 class="font-bold text-gray-100 text-sm truncate flex items-center gap-1">
                            <span id="name-${chat.chatId}">${chat.otherUser.username}</span>
                            <span id="verified-${chat.chatId}">${chat.otherUser.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : ''}</span>
                        </h3>
                        <span id="time-${chat.chatId}" class="text-[10px] text-gray-500 font-medium">${formatTime(chat.timestamp)}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p id="msg-${chat.chatId}" class="text-xs text-gray-400 truncate max-w-[80%] ${chat.unreadCount > 0 ? 'font-bold text-gray-200' : ''}">
                            ${chat.lastMessage || 'مرفق...'}
                        </p>
                        <div id="badge-${chat.chatId}" class="${chat.unreadCount > 0 ? 'flex' : 'hidden'} items-center justify-center bg-blue-600 text-white text-[10px] font-bold h-5 min-w-[20px] px-1 rounded-full shadow-lg shadow-blue-500/20">
                            ${chat.unreadCount}
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        // تحديث محتوى عنصر موجود فقط (يمنع الوميض)
        function updateChatElementContent(el, chat) {
            // تحديث الصورة
            const img = el.querySelector(`#img-${chat.chatId}`);
            if (img.src !== chat.otherUser.profile_picture_url) img.src = chat.otherUser.profile_picture_url;

            // تحديث حالة الاتصال
            const online = el.querySelector(`#online-${chat.chatId}`);
            if (chat.otherUser.is_online) online.classList.remove('hidden');
            else online.classList.add('hidden');

            // تحديث الاسم
            el.querySelector(`#name-${chat.chatId}`).innerText = chat.otherUser.username;

            // تحديث التوثيق
            const verEl = el.querySelector(`#verified-${chat.chatId}`);
            verEl.innerHTML = chat.otherUser.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';

            // تحديث الوقت
            el.querySelector(`#time-${chat.chatId}`).innerText = formatTime(chat.timestamp);

            // تحديث الرسالة
            const msgEl = el.querySelector(`#msg-${chat.chatId}`);
            if (msgEl.innerText !== chat.lastMessage) {
                msgEl.innerText = chat.lastMessage || 'مرفق...';
                // ومضة بسيطة عند وصول رسالة جديدة
                msgEl.style.color = '#fff';
                setTimeout(() => msgEl.style.color = '', 1000);
            }
            
            // تحديث ستايل الرسالة (bold)
            if(chat.unreadCount > 0) {
                msgEl.classList.add('font-bold', 'text-gray-200');
                msgEl.classList.remove('text-gray-400');
            } else {
                msgEl.classList.remove('font-bold', 'text-gray-200');
                msgEl.classList.add('text-gray-400');
            }

            // تحديث شارة العدد
            const badge = el.querySelector(`#badge-${chat.chatId}`);
            if (chat.unreadCount > 0) {
                badge.innerText = chat.unreadCount;
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            // إذا كان اليوم
            if (diff < 24 * 60 * 60 * 1000 && date.getDate() === now.getDate()) {
                return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            }
            // إذا كان أمس
            if (diff < 48 * 60 * 60 * 1000) {
                return 'أمس';
            }
            // غير ذلك تاريخ
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'numeric' });
        }

        function updateTotalUnread(chats) {
            const total = chats.reduce((acc, curr) => acc + (curr.unreadCount || 0), 0);
            const badge = document.getElementById('navUnreadBadge');
            if (total > 0) {
                badge.innerText = total > 99 ? '99+' : total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // تشغيل النظام
        document.addEventListener('DOMContentLoaded', initRealTimeChats);

    </script>
</body>
</html>
