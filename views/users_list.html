<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - المحادثات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800;
        }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .glass-user-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-user-card:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .glass-user-card.unread {
            border-right: 4px solid #0d9488;
            background-color: rgba(13, 148, 136, 0.1);
        }
        
        .unread-badge {
            background-color: #0d9488;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 9999px;
            min-width: 24px;
            text-align: center;
        }

        .avatar-with-dot { 
            position: relative; 
            display: inline-block; 
        }
        
        .online-dot {
            position: absolute;
            bottom: 0px;
            left: 0px;
            width: 12px;
            height: 12px;
            background: #22c55e;
            border: 2px solid #000;
            border-radius: 50%;
        }

        /* تنسيق شارة التوثيق مع مسافة */
        .verified-badge-img {
            width: 16px;
            height: 16px;
            margin-right: 6px; /* مسافة بين الاسم والشارة */
            object-fit: cover;
            display: inline-block;
        }

        .animate-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
            <div class="flex items-center">
                <button id="profileMenuButton" class="relative" onclick="toggleProfileDropdown(event)">
                    <img id="userProfilePic" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover">
                </button>
                <div id="profileDropdown" class="absolute top-12 right-0 mt-2 w-48 rounded-lg shadow-xl glass-dropdown hidden">
                    <a href="/profile" class="flex items-center px-4 py-3 text-white hover:bg-white/10">الملف الشخصي</a>
                    <a href="/logout" class="flex items-center px-4 py-3 text-red-400 hover:bg-white/10 border-t border-gray-700">خروج</a>
                </div>
            </div>
            
            <div class="absolute inset-0 flex justify-center items-center pointer-events-none">
                <span class="text-2xl font-extrabold text-white tracking-widest app-logo">المحادثات</span>
            </div>

            <div class="flex items-center">
                <a href="/chat_list" class="text-gray-400 hover:text-white p-2">
                    <i class="fas fa-arrow-left text-2xl"></i>
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="usersListContainer" class="max-w-xl mx-auto mt-4 flex flex-col space-y-3">
            <div id="loadingSpinner" class="text-center text-gray-500 p-4">
                <i class="fas fa-spinner fa-spin ml-2"></i> جاري الاتصال...
            </div>
            <div id="emptyState" class="hidden text-center text-gray-500 p-4">ليس لديك محادثات بعد.</div>
        </div>
    </main>

    <script>
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        const usersListContainer = document.getElementById('usersListContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const emptyState = document.getElementById('emptyState');
        let currentUserId = null;

        function toggleProfileDropdown(e) { e.stopPropagation(); document.getElementById('profileDropdown').classList.toggle('hidden'); }

        function buildCardHTML(user, isUnread, unreadCount, lastMessageText) {
            const chatLink = `/chat?contactId=${user.id}&contactName=${encodeURIComponent(user.username)}`;
            const verifiedHtml = user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img" alt="verified">` : '';

            return `
            <a href="${chatLink}" class="chat-link">
                <div class="glass-user-card flex items-center p-3 rounded-xl ${isUnread ? 'unread' : ''}" id="card-inner-${user.id}">
                    <div class="avatar-with-dot ml-3">
                        <img src="${user.profile_picture_url}" id="img-${user.id}" class="w-12 h-12 rounded-full object-cover border-2 ${isUnread ? 'border-teal-500' : 'border-gray-600'}">
                        <span id="dot-${user.id}" class="online-dot ${user.is_online ? '' : 'hidden'}"></span>
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center mb-0.5">
                            <span id="username-${user.id}" class="text-white font-semibold text-lg truncate">${user.username}</span>
                            <span id="verified-container-${user.id}">${verifiedHtml}</span>
                        </div>
                        <div id="last-msg-${user.id}" class="text-gray-400 text-sm truncate">${lastMessageText}</div>
                    </div>
                    <div class="flex flex-col items-end justify-center">
                        <span id="badge-${user.id}" class="unread-badge mb-1 ${!isUnread ? 'hidden' : ''}">${unreadCount}</span>
                        <i class="fas fa-chevron-left text-gray-400 text-xs"></i>
                    </div>
                </div>
            </a>`;
        }

        function updateOrAddUserCard(user) {
            const unreadCount = user.unread_count || 0;
            const isUnread = unreadCount > 0;
            let lastMessageText = user.last_message ? 
                (user.last_message.senderId === currentUserId ? 'أنت: ' : '') + (user.last_message.content || '[ملف]') : 'ابدأ المحادثة...';

            // الترتيب: نستخدم التوقيت الزمني (timestamp) كقيمة order
            // العناصر في flexbox ترتب تصاعدياً، لذا سنعطي الأحدث قيمة order أعلى
            const orderVal = user.last_message ? new Date(user.last_message.timestamp).getTime() : 0;

            let wrapper = document.getElementById(`user-wrapper-${user.id}`);
            if (wrapper) {
                // تحديث الترتيب (الأحدث يأخذ order أعلى)
                wrapper.style.order = orderVal; 
                document.getElementById(`img-${user.id}`).className = `w-12 h-12 rounded-full object-cover border-2 ${isUnread ? 'border-teal-500' : 'border-gray-600'}`;
                document.getElementById(`dot-${user.id}`).className = `online-dot ${user.is_online ? '' : 'hidden'}`;
                document.getElementById(`last-msg-${user.id}`).innerText = lastMessageText;
                const badge = document.getElementById(`badge-${user.id}`);
                badge.innerText = unreadCount;
                badge.classList.toggle('hidden', !isUnread);
                document.getElementById(`card-inner-${user.id}`).classList.toggle('unread', isUnread);
            } else {
                wrapper = document.createElement('div');
                wrapper.id = `user-wrapper-${user.id}`;
                wrapper.className = 'animate-enter';
                wrapper.style.order = orderVal;
                wrapper.innerHTML = buildCardHTML(user, isUnread, unreadCount, lastMessageText);
                usersListContainer.appendChild(wrapper);
            }
        }

        function initSSE() {
            const es = new EventSource('/api/users/stream', { withCredentials: true });
            es.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.users) {
                    loadingSpinner.style.display = 'none';
                    if (data.users.length === 0) emptyState.classList.remove('hidden');
                    else {
                        emptyState.classList.add('hidden');
                        data.users.forEach(updateOrAddUserCard);
                    }
                }
            };
        }

        // ملاحظة هامة لجعل الأحدث أولاً:
        // الحاوية usersListContainer لديها خاصية flex-col-reverse
        // والعناصر تأخذ order = timestamp. 
        // الأكبر (الأحدث) سيصبح في الأسفل برمجياً لكن بسبب reverse سيظهر في الأعلى للمستخدم.
        usersListContainer.style.display = 'flex';
        usersListContainer.style.flexDirection = 'column-reverse';

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/profile').then(r => r.json()).then(d => {
                if(d && d.id) {
                    currentUserId = d.id;
                    document.getElementById('userProfilePic').src = d.profile_picture_url;
                }
                initSSE();
            });
        });
    </script>
</body>
</html>
