<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - المحادثات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        /* Header action buttons */
        .header-actions { display:flex; gap:8px; align-items:center; }
        .header-actions .action-btn {
            background: rgba(255,255,255,0.04);
            color: #e6eefb;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.06);
            display:flex; gap:8px; align-items:center;
            cursor:pointer;
            font-weight:700;
        }
        .header-actions .action-btn:hover { background: rgba(255,255,255,0.06); }

        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Chat Item Styling */
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .avatar-container { position: relative; }
        .online-dot {
            position: absolute; bottom: 2px; right: 2px;
            width: 12px; height: 12px;
            background: #22c55e;
            border: 2px solid #000; border-radius: 50%;
            display: none; /* Hidden by default */
        }
        .online-dot.active { display: block; }

        .unread-badge {
            background: #ef4444; color: #fff;
            font-size: 10px; font-weight: bold;
            padding: 2px 6px; border-radius: 99px;
            min-width: 18px; text-align: center;
            display: none;
        }
        .unread-badge.active { display: inline-block; }

        /* Verified Badge */
        .verified-badge-img { width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; display: inline-block; }

        /* Loader */
        .loader-container { display: flex; justify-content: center; padding: 20px; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Badges for nav */
        #notifBadge, #msgBadge, #friendReqBadge {
          position: absolute; top: -6px; left: -6px;
          min-width: 18px; height: 18px; padding: 0 6px;
          background: #ef4444; color: #fff;
          font-size: 12px; font-weight: 700;
          border-radius: 999px; display: none;
          align-items: center; justify-content: center; line-height: 1;
        }
    </style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-50 glass-navbar p-3">
    <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
        
        <div class="relative group z-[60]"> 
            <button id="profileMenuButton" class="relative block focus:outline-none" onclick="toggleProfileDropdown(event)">
                <span class="avatar-container">
                    <img id="userProfilePic" src="https://via.placeholder.com/40/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300 cursor-pointer">
                    <span id="meOnlineDot" class="online-dot" style="bottom:0; right:0;"></span>
                </span>
            </button>

            <div id="profileDropdown" class="absolute top-12 right-0 mt-2 w-52 rounded-xl shadow-2xl glass-dropdown hidden border border-gray-700 bg-black/95 backdrop-blur-lg z-[70] overflow-hidden">
                <a href="/profile" class="flex items-center px-4 py-4 text-white hover:bg-white/10 transition duration-200">
                    <div class="bg-blue-500/20 p-2 rounded-lg ml-3">
                        <i class="fas fa-user text-blue-400"></i>
                    </div>
                    <span class="text-sm font-semibold">الملف الشخصي</span>
                </a>
                <div class="border-t border-gray-800 mx-2"></div>
                <a href="/settings" class="flex items-center px-4 py-4 text-white hover:bg-white/10 transition duration-200">
                    <div class="bg-gray-500/20 p-2 rounded-lg ml-3">
                        <i class="fas fa-cog text-gray-400"></i>
                    </div>
                    <span class="text-sm font-semibold">الإعدادات</span>
                </a>
            </div>
        </div>

        <div class="flex-grow flex justify-center">
            <a href="/chat_list" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300 app-logo">
                Aite
            </a>
        </div>

        <div class="header-actions flex items-center gap-2">
            <button id="searchBtn" class="action-btn p-2 text-gray-300 hover:text-white transition" title="بحث" onclick="window.location.href='/search'">
                <i class="fas fa-search text-xl"></i>
            </button>
            <button id="createBtn" class="action-btn p-2 text-gray-300 hover:text-white transition" title="إنشاء" onclick="toggleCreateModal()">
                <i class="fas fa-plus text-xl"></i>
            </button>
        </div>

    </nav>
</header>

<main class="max-w-6xl mx-auto p-4">
    <h2 class="text-white font-bold text-lg mb-4 px-1">المحادثات</h2>
    <div id="chatList" class="max-w-xl mx-auto space-y-2 min-h-[300px]">
        <div class="loader-container" id="initialLoader">
            <div class="spinner"></div>
        </div>
    </div>
</main>
    
<div class="fixed bottom-0 left-0 right-0 z-50 glass-bottom-navbar">
    <nav class="flex justify-around items-center max-w-lg mx-auto h-14 relative">
        <a href="/chat_list" class="flex flex-col items-center justify-center p-2 text-blue-400">
            <i class="fas fa-home text-xl"></i>
        </a>
        <a id="messagesBtn" href="/users_list" class="flex flex-col items-center justify-center p-2 text-white hover:text-white transition duration-300 relative">
            <i class="fas fa-comment-dots text-xl"></i>
            <span id="msgBadge">0</span>
        </a>
        <a href="/reels" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
            <i class="fas fa-clapperboard text-xl"></i>
        </a>
        <a id="notifBtn" href="/notifications" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
            <i class="fas fa-bell text-xl"></i>
            <span id="notifBadge">0</span>
        </a>
        <a id="usersBtn" href="/all_users" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300 relative">
            <i class="fas fa-users text-xl"></i>
            <span id="friendReqBadge">0</span>
        </a>
    </nav>
</div>

<div id="createModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4" style="background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px);">
    <div class="bg-[#1e1e1e] p-8 rounded-3xl shadow-2xl max-w-sm w-full border border-white/20 relative">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-2xl font-bold text-white">ماذا تريد أن تنشر؟</h3>
            <button onclick="toggleCreateModal()" class="text-gray-400 hover:text-white transition text-2xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="grid grid-cols-1 gap-4">
            <a href="/create-post" class="flex items-center p-5 rounded-2xl bg-white/5 hover:bg-white/10 transition border border-white/10">
                <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center ml-4">
                    <i class="fas fa-file-alt text-blue-400 text-xl"></i>
                </div>
                <div class="text-right">
                    <span class="block text-white font-bold text-lg">منشور جديد</span>
                    <span class="block text-gray-400 text-sm">شارك أفكارك وصورك</span>
                </div>
            </a>
            <a href="/create-reel" class="flex items-center p-5 rounded-2xl bg-white/5 hover:bg-white/10 transition border border-white/10">
                <div class="w-12 h-12 bg-purple-500/20 rounded-full flex items-center justify-center ml-4">
                    <i class="fas fa-video text-purple-400 text-xl"></i>
                </div>
                <div class="text-right">
                    <span class="block text-white font-bold text-lg">ريلز</span>
                    <span class="block text-gray-400 text-sm">فيديو قصير</span>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
    const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';
    const chatList = document.getElementById('chatList');
    const initialLoader = document.getElementById('initialLoader');
    let currentUserId = null;
    let eventSource = null;

    // --- UI Interactions ---
    function toggleProfileDropdown(event) {
        event.stopPropagation();
        document.getElementById('profileDropdown').classList.toggle('hidden');
    }
    document.addEventListener('click', (event) => {
        const dropdown = document.getElementById('profileDropdown');
        const button = document.getElementById('profileMenuButton');
        if (!dropdown.classList.contains('hidden') && !button.contains(event.target) && !dropdown.contains(event.target)) {
            dropdown.classList.add('hidden');
        }
    });
    function toggleCreateModal() {
        document.getElementById('createModal').classList.toggle('hidden');
    }

    // --- Main Logic (SSE / Smart Updates) ---

    // 1. Fetch Profile Info First
    fetch('/api/profile').then(r => r.json()).then(user => {
        if(user && user.profile_picture_url) {
            document.getElementById('userProfilePic').src = user.profile_picture_url;
            currentUserId = user.id;
            if(user.is_online) document.getElementById('meOnlineDot').classList.add('active');
            
            // 2. Start Chat Stream after getting user ID
            setupChatStream();
        }
    });

    function setupChatStream() {
        // الاتصال بنقطة النهاية الخاصة بالبث المباشر للمحادثات
        // تأكد من أن ملف server.js يحتوي على /api/chats/live أو /api/chats/stream
        if (eventSource) eventSource.close();
        
        eventSource = new EventSource('/api/chats/live');

        eventSource.onmessage = (event) => {
            if(initialLoader) initialLoader.style.display = 'none';
            try {
                const chats = JSON.parse(event.data);
                updateChatList(chats);
            } catch (e) {
                console.error("Error parsing chat data", e);
            }
        };

        eventSource.onerror = (err) => {
            console.warn("SSE error, retrying...", err);
            eventSource.close();
            setTimeout(setupChatStream, 5000); // Retry connection
        };
    }

    // --- Smart Update Function ---
    // هذه الدالة هي سر التخلص من الوميض. فهي تقارن البيانات الجديدة بالموجودة
    function updateChatList(chats) {
        if (!chats || chats.length === 0) {
            chatList.innerHTML = '<div class="text-center text-gray-500 mt-10">لا توجد محادثات بعد.</div>';
            return;
        }

        const chatIdsInResponse = new Set(chats.map(c => `chat-${c.contact_id || c.chatId}`)); // تعتمد على هيكلة البيانات القادمة من السيرفر

        // 1. Update existing or Create new
        chats.forEach((chat, index) => {
            // توحيد الحقول بناءً على المتغيرات المحتملة من السيرفر
            const contactId = chat.contact_id || chat.otherUser?.userId || chat.chatId; // Fallback
            const username = chat.contact_profile?.username || chat.otherUser?.username || 'مستخدم';
            const avatar = chat.contact_profile?.profile_picture_url || chat.otherUser?.profile_picture_url || DEFAULT_AVATAR;
            const isVerified = chat.contact_profile?.is_verified || chat.otherUser?.is_verified;
            const isOnline = chat.contact_profile?.is_online || chat.otherUser?.is_online;
            const lastMsg = chat.last_message_content || chat.lastMessage || 'بدء محادثة';
            const time = chat.last_message_timestamp || chat.timestamp;
            const unread = chat.unread_count || chat.unreadCount || 0;

            let chatEl = document.getElementById(`chat-${contactId}`);

            if (chatEl) {
                // --- العنصر موجود: تحديث البيانات المتغيرة فقط ---
                
                // تحديث الرسالة
                const msgEl = document.getElementById(`msg-content-${contactId}`);
                if (msgEl.textContent !== lastMsg) {
                    msgEl.textContent = lastMsg;
                    msgEl.className = unread > 0 ? 'text-sm text-white font-bold truncate' : 'text-sm text-gray-400 truncate';
                }

                // تحديث الوقت
                const timeEl = document.getElementById(`time-${contactId}`);
                const timeStr = formatTime(time);
                if (timeEl.textContent !== timeStr) timeEl.textContent = timeStr;

                // تحديث الشارة (Badge)
                const badgeEl = document.getElementById(`badge-${contactId}`);
                if (unread > 0) {
                    badgeEl.textContent = unread;
                    badgeEl.classList.add('active');
                } else {
                    badgeEl.classList.remove('active');
                }

                // تحديث حالة الاتصال (Online)
                const onlineDot = document.getElementById(`online-${contactId}`);
                if (isOnline) onlineDot.classList.add('active'); else onlineDot.classList.remove('active');

                // إعادة الترتيب: إذا لم يكن العنصر في مكانه الصحيح
                const currentAtIndex = chatList.children[index];
                if (currentAtIndex !== chatEl) {
                    chatList.insertBefore(chatEl, currentAtIndex);
                }

            } else {
                // --- العنصر غير موجود: إنشاء جديد ---
                const newEl = createChatHTML(contactId, username, avatar, isVerified, isOnline, lastMsg, time, unread);
                if (chatList.children[index]) {
                    chatList.insertBefore(newEl, chatList.children[index]);
                } else {
                    chatList.appendChild(newEl);
                }
            }
        });

        // 2. Cleanup: حذف المحادثات التي لم تعد موجودة في الرد
        Array.from(chatList.children).forEach(child => {
            if (child.id.startsWith('chat-') && !chatIdsInResponse.has(child.id)) {
                child.remove();
            }
        });

        // تحديث شارة الرسائل في البار السفلي
        updateTotalUnread(chats);
    }

    function createChatHTML(id, username, avatar, isVerified, isOnline, msg, time, unread) {
        const div = document.createElement('div');
        div.id = `chat-${id}`;
        div.className = 'chat-item';
        div.onclick = () => window.location.href = `/chat?chatId=${id}`; // أو الرابط الذي تستخدمه

        const verifiedHtml = isVerified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
        const onlineClass = isOnline ? 'active' : '';
        const badgeClass = unread > 0 ? 'active' : '';
        const msgClass = unread > 0 ? 'text-sm text-white font-bold truncate' : 'text-sm text-gray-400 truncate';

        div.innerHTML = `
            <div class="relative flex-shrink-0 ml-3">
                <img src="${avatar}" class="w-12 h-12 rounded-full object-cover border border-gray-600">
                <span id="online-${id}" class="online-dot ${onlineClass}"></span>
            </div>
            <div class="flex-grow min-w-0">
                <div class="flex justify-between items-baseline mb-1">
                    <h4 class="text-white font-bold text-base truncate flex items-center">
                        ${username} ${verifiedHtml}
                    </h4>
                    <span id="time-${id}" class="text-xs text-gray-500">${formatTime(time)}</span>
                </div>
                <div class="flex justify-between items-center">
                    <p id="msg-content-${id}" class="${msgClass} max-w-[85%]">
                        ${msg}
                    </p>
                    <span id="badge-${id}" class="unread-badge ${badgeClass}">${unread}</span>
                </div>
            </div>
        `;
        return div;
    }

    function formatTime(timestamp) {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        const now = new Date();
        const diff = now - d;
        if (diff < 86400000 && d.getDate() === now.getDate()) {
            return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        } else if (diff < 172800000) {
            return 'أمس';
        } else {
            return d.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' });
        }
    }

    function updateTotalUnread(chats) {
        // يعتمد على هيكلة البيانات، نجمع unread_count
        let total = 0;
        chats.forEach(c => {
            total += (c.unread_count || c.unreadCount || 0);
        });
        const badge = document.getElementById('msgBadge');
        if (total > 0) {
            badge.style.display = 'flex';
            badge.textContent = total > 99 ? '99+' : total;
        } else {
            badge.style.display = 'none';
        }
    }

    // --- Notifications Badge Logic (Separate stream or same) ---
    // يمكنك دمج هذا مع الستريم الرئيسي أو تركه منفصلاً كما هو
    (function setupNotifStream() {
        if(window.EventSource) {
            const es = new EventSource('/api/notifications/stream');
            es.addEventListener('notifications', e => {
                const d = JSON.parse(e.data);
                const nb = document.getElementById('notifBadge');
                if(d.unread_count > 0) {
                    nb.style.display = 'flex';
                    nb.textContent = d.unread_count;
                } else {
                    nb.style.display = 'none';
                }
                
                const fr = document.getElementById('friendReqBadge');
                if(d.pending_friend_requests_count > 0) {
                    fr.style.display = 'flex';
                    fr.textContent = d.pending_friend_requests_count;
                } else {
                    fr.style.display = 'none';
                }
            });
        }
    })();

</script>
</body>
</html>
