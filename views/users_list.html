<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aite - أصدقائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background:#000; color:#e4e6eb; font-family: Inter, system-ui, sans-serif; padding-bottom:80px; }
        .glass-navbar { background-color: rgba(30,30,30,0.5); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .glass-user-card { background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04); border-radius:12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; }
        .glass-user-card.unread { border-right: 4px solid #0d9488; background-color: rgba(13,148,136,0.06); }
        .notif-badge { position:absolute; top:-6px; left:-6px; min-width:18px; height:18px; padding:0 6px; background:#ef4444; color:#fff; font-size:12px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; line-height:1; }
        @media (max-width: 640px) {
            .glass-user-card { padding:10px; gap:8px; }
        }
    </style>
</head>
<body>
  <header class="glass-navbar sticky top-0 z-50 p-3">
    <nav class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/chat_list" class="text-gray-400 hover:text-white p-2"><i class="fas fa-arrow-right text-2xl"></i></a>
      </div>

      <div class="text-center">
        <h1 class="text-xl font-bold">أصدقائي</h1>
      </div>

      <div style="width:40px"></div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-4 pb-36">
    <div id="friendsContainer" class="space-y-3">
      <div class="text-center text-gray-400 p-6" id="loadingMessage">
        <i class="fas fa-spinner fa-spin"></i> جاري تحميل الأصدقاء...
      </div>
    </div>
  </main>

<script>
  async function fetchFriends() {
    const container = document.getElementById('friendsContainer');
    container.innerHTML = '<div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الأصدقاء...</div>';
    try {
      const res = await fetch('/api/friends', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      if (!data.ok) throw new Error('bad data');

      if (!data.friends || data.friends.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 p-6">ليس لديك أصدقاء بعد. يمكنك إضافة أصدقاء من صفحة الاكتشاف.</div>';
        return;
      }

      container.innerHTML = data.friends.map(u => {
        return `
          <a href="/chat?contactId=${u.id}" class="glass-user-card relative">
            <img src="${u.profile_picture_url}" class="w-12 h-12 rounded-full object-cover" alt="${u.username}">
            <div class="flex-grow min-w-0 text-right">
              <div class="text-white font-semibold">${u.username}</div>
              <div class="text-gray-400 text-sm">${u.full_name || ''}</div>
            </div>
            <div class="flex items-center">
              <i class="fas fa-chevron-left text-gray-400"></i>
            </div>
          </a>
        `;
      }).join('');

    } catch (err) {
      console.error(err);
      container.innerHTML = '<div class="text-center text-red-500 p-6">فشل في جلب الأصدقاء.</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    fetchFriends();
    // Refresh periodically
    setInterval(fetchFriends, 15000);
  });

  // SSE: update friend requests badge (if present in UI)
  (function setupSSEFriends() {
    if (!window.EventSource) return;
    const es = new EventSource('/api/notifications/stream', { withCredentials: true });
    es.addEventListener('notifications', (e) => {
      try {
        const payload = JSON.parse(e.data);
        // if you want to show friend request count somewhere in this page, handle it here
        // e.g., update a top badge; not required for base functionality
      } catch (err) { console.error(err); }
    });
  })();
</script>
</body>
</html>
