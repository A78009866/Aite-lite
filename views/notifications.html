<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aite - الإشعارات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background: #000; color: #e4e6eb; font-family: Inter, system-ui, sans-serif; }
    .glass-navbar { background-color: rgba(30,30,30,0.5); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .notification-card { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); border-radius: 12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; position:relative; }
    .notification-card.unread { border-left: 4px solid #007AFF; }
    .notif-avatar { width:48px; height:48px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.06); flex-shrink:0; }
    .badge { background:#ef4444; color:white; font-size:12px; padding:4px 8px; border-radius:999px; }
    .empty { text-align:center; color:#94a3b8; padding:40px 0; }
    .action-small { padding:6px 8px; font-size:12px; border-radius:8px; display:inline-flex; gap:6px; align-items:center; justify-content:center; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:#e6eefb; cursor:pointer; }
    .notif-card-content { flex:1; min-width:0; }
    .notif-title { font-size:14px; color:#e6eefb; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .notif-time { font-size:12px; color:#9fb3c8; }
    .notif-target { margin-top:6px; color:#9fb3c8; font-size:13px; }
    .actions-dropdown {
      position: absolute;
      top: 48px;
      left: 12px;
      background: rgba(20,20,20,0.95);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 1200;
      min-width: 160px;
    }
    .actions-dropdown button { width: 100%; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:8px 10px; border-radius:8px; background:transparent; border:none; color:#e6eefb; cursor:pointer; text-align:right; }
    .actions-dropdown button:hover { background: rgba(255,255,255,0.02); }
    .top-action-btn {
      width:36px; height:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center;
      background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04); color:#e6eefb; cursor:pointer;
    }
  </style>
</head>
<body>
  <header class="glass-navbar sticky top-0 z-50 p-3">
    <nav class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/chat_list" class="text-gray-400 hover:text-white p-2"><i class="fas fa-arrow-right text-2xl"></i></a>
      </div>

      <div class="text-center">
        <h1 class="text-xl font-bold">الإشعارات</h1>
      </div>

      <div style="width:40px; display:flex; gap:8px; align-items:center; justify-content:flex-end; position:relative;">
        <button id="actionsToggleBtn" class="top-action-btn" title="خيارات الإشعارات" aria-haspopup="true" aria-expanded="false">
          <i class="fas fa-ellipsis-v"></i>
        </button>

        <div id="actionsDropdown" class="actions-dropdown hidden" role="menu" aria-label="خيارات الإشعارات">
          <button id="markAllReadBtn" class="action-small" title="تعيين الكل كمقروء">
            <span style="direction:ltr;"><i class="fas fa-check-double" style="font-size:13px"></i></span>
            <span>تعيين الكل كمقروء</span>
          </button>
          <button id="clearAllBtn" class="action-small" style="margin-top:6px;" title="حذف كل الإشعارات">
            <span style="direction:ltr;"><i class="fas fa-trash" style="font-size:13px;color:#f87171"></i></span>
            <span>حذف الكل</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-4 pb-36">
    <div id="notifContainer" class="space-y-3">
      <div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الإشعارات...</div>
    </div>
  </main>

<script>
  // Fetch and render notifications (no per-notif delete)
  async function fetchNotifications() {
    try {
      const res = await fetch('/api/notifications', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      if (!data.ok) throw new Error('bad data');
      renderNotifications(data.notifications);
    } catch (e) {
      document.getElementById('notifContainer').innerHTML = '<div class="empty">فشل في جلب الإشعارات.</div>';
      console.error(e);
    }
  }

  function renderNotifications(notifs) {
    const container = document.getElementById('notifContainer');
    if (!notifs || notifs.length === 0) {
      container.innerHTML = '<div class="empty">لا توجد إشعارات حالياً.</div>';
      return;
    }

    container.innerHTML = notifs.map(n => {
      // Build a human-friendly title/target depending on notification type
      let title = '';
      let targetHint = '';
      const fromName = escapeHtml(n.from_username || n.from || 'مستخدم');
      const snippet = escapeHtml((n.commentContent || n.replyContent || n.preview || '').substring(0,80));
      const postId = n.postId || '';
      const reelId = n.reelId || '';
      const commentId = n.commentId || n.commentId || n.commentId; // consistency
      const replyId = n.replyId || '';

      switch (n.type) {
        case 'post_like':
          title = `<strong>${fromName}</strong> أعجب بمنشورك`;
          targetHint = 'عرض المنشور';
          break;
        case 'reel_like':
          title = `<strong>${fromName}</strong> أعجب بريلك`;
          targetHint = 'عرض الريل';
          break;
        case 'post_comment':
          title = `<strong>${fromName}</strong> علّق: "${snippet}"`;
          targetHint = 'عرض المنشور والتعليق';
          break;
        case 'reel_comment':
          title = `<strong>${fromName}</strong> علّق على ريلك: "${snippet}"`;
          targetHint = 'عرض الريل والتعليق';
          break;
        case 'comment_reply':
          // this type is used for both post and reel replies on server
          title = `<strong>${fromName}</strong> ردّ على تعليقك: "${snippet}"`;
          targetHint = (postId ? 'فتح التعليقات في المنشور' : (reelId ? 'فتح التعليقات في الريل' : 'عرض التعليق'));
          break;
        case 'comment_like':
          title = `<strong>${fromName}</strong> أعجب بتعليقك`;
          targetHint = (postId ? 'عرض التعليق في المنشور' : (reelId ? 'عرض التعليق في الريل' : 'عرض التعليق'));
          break;
        case 'friend_request':
          title = `<strong>${fromName}</strong> أرسل لك طلب صداقة`;
          targetHint = 'إدارة الطلبات';
          break;
        case 'friend_accept':
          title = `<strong>${fromName}</strong> قبِل طلب صداقتك`;
          targetHint = 'عرض الملف الشخصي';
          break;
        case 'message':
          title = `<strong>${fromName}</strong> أرسل لك رسالة: "${snippet}"`;
          targetHint = 'افتح المحادثة';
          break;
        default:
          title = `<strong>${fromName}</strong> حدث جديد`;
          targetHint = '';
      }

      const time = new Date(n.timestamp || Date.now()).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });

      // data attributes for click handler
      const dataAttrs = [
        `data-id="${escapeHtml(n.id || '')}"`,
        `data-type="${escapeHtml(n.type || '')}"`,
        `data-post-id="${escapeHtml(postId)}"`,
        `data-reel-id="${escapeHtml(reelId)}"`,
        `data-from="${escapeHtml(n.from_user_id || '')}"`,
        `data-comment-id="${escapeHtml(n.commentId || n.commentId || '')}"`,
        `data-reply-id="${escapeHtml(n.replyId || '')}"`
      ].join(' ');

      return `
        <div class="notification-card ${n.is_read ? '' : 'unread'}" ${dataAttrs}>
          <img src="${escapeHtml(n.from_profile_picture_url || '')}" class="notif-avatar" alt="">
          <div class="notif-card-content">
            <div style="display:flex; justify-content:space-between; gap:8px; align-items:center">
              <div class="notif-title">${title}</div>
              <div class="notif-time">${time}</div>
            </div>
            <div class="notif-target">${targetHint}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(s) {
    if (s === null || typeof s === 'undefined') return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Delegated click handling on notification cards (navigation + mark read)
  document.addEventListener('click', async (ev) => {
    // if click is inside actions dropdown, ignore here
    if (ev.target.closest('#actionsDropdown') || ev.target.closest('#actionsToggleBtn')) return;

    const card = ev.target.closest('.notification-card');
    if (card) {
      const id = card.dataset.id;
      const type = card.dataset.type;
      const postId = card.dataset.postId;
      const reelId = card.dataset.reelId;
      const fromUser = card.dataset.from;
      const commentId = card.dataset.commentId;
      const replyId = card.dataset.replyId;

      // Mark this notification read (fire-and-forget)
      if (id) {
        fetch('/api/notifications/mark_read', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        }).catch(()=>{});
      }

      // Decide navigation based on type and available ids.
      // For comments/replies/likes on comments we try to open the post/reel and anchor to the specific comment.
      try {
        if (type === 'post_like') {
          if (postId) {
            window.location.href = `/chat_list#post-${encodeURIComponent(postId)}`;
            return;
          }
        } else if (type === 'reel_like') {
          if (reelId) {
            window.location.href = `/reels?id=${encodeURIComponent(reelId)}`;
            return;
          }
        } else if (type === 'post_comment' || type === 'comment_reply' || type === 'comment_like') {
          // prefer postId, if present open chat_list with anchor possibly to comment
          if (postId) {
            let anchor = `post-${encodeURIComponent(postId)}`;
            if (commentId) anchor += `-comment-${encodeURIComponent(commentId)}`;
            else if (replyId) anchor += `-reply-${encodeURIComponent(replyId)}`;
            window.location.href = `/chat_list#${anchor}`;
            return;
          }
          // fallback to chat_list
          window.location.href = '/chat_list';
          return;
        } else if (type === 'reel_comment' || (type === 'comment_reply' && reelId) || (type === 'comment_like' && reelId)) {
          if (reelId) {
            let url = `/reels?id=${encodeURIComponent(reelId)}`;
            if (commentId) url += `&commentId=${encodeURIComponent(commentId)}`;
            else if (replyId) url += `&replyId=${encodeURIComponent(replyId)}`;
            window.location.href = url;
            return;
          }
          window.location.href = '/reels';
          return;
        } else if (type === 'friend_accept') {
          // Open profile of the user who accepted
          if (fromUser) {
            // Use query param 'userId' so client-side profile loader can detect uid reliably
            window.location.href = `/profile?userId=${encodeURIComponent(fromUser)}`;
            return;
          }
          window.location.href = '/users_list';
          return;
        } else if (type === 'friend_request') {
          window.location.href = '/all_users';
          return;
        } else if (type === 'message') {
          if (fromUser) {
            window.location.href = `/chat?contactId=${encodeURIComponent(fromUser)}`;
            return;
          }
          window.location.href = '/chat_list';
          return;
        } else {
          // default fallback
          window.location.href = '/chat_list';
          return;
        }
      } catch (e) {
        console.error('Navigation error for notification click', e);
        window.location.href = '/chat_list';
      }
    }
  });

  // SSE: update list when notifications change
  if (window.EventSource) {
    const es = new EventSource('/api/notifications/stream', { withCredentials: true });
    es.addEventListener('notifications', (e) => {
      try {
        fetchNotifications(); // refresh to reflect DB state
      } catch (err) { console.error('SSE parse error', err); }
    });
    es.addEventListener('error', (err) => { console.warn('Notifications SSE error', err); });
  }

  // Actions dropdown toggle
  const actionsToggleBtn = document.getElementById('actionsToggleBtn');
  const actionsDropdown = document.getElementById('actionsDropdown');

  actionsToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isHidden = actionsDropdown.classList.contains('hidden');
    if (isHidden) {
      actionsDropdown.classList.remove('hidden');
      actionsToggleBtn.setAttribute('aria-expanded', 'true');
    } else {
      actionsDropdown.classList.add('hidden');
      actionsToggleBtn.setAttribute('aria-expanded', 'false');
    }
  });

  // Close dropdown on outside click or Esc
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#actionsDropdown') && !e.target.closest('#actionsToggleBtn')) {
      actionsDropdown.classList.add('hidden');
      actionsToggleBtn.setAttribute('aria-expanded', 'false');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      actionsDropdown.classList.add('hidden');
      actionsToggleBtn.setAttribute('aria-expanded', 'false');
    }
  });

  // Mark all read
  document.getElementById('markAllReadBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    actionsDropdown.classList.add('hidden');
    actionsToggleBtn.setAttribute('aria-expanded', 'false');
    try {
      const res = await fetch('/api/notifications/mark_read', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}) // no id => mark all
      });
      if (res.ok) fetchNotifications();
      else throw new Error('mark all failed');
    } catch (err) {
      console.error('Mark all read failed', err);
      alert('فشل تعيين الكل كمقروء');
    }
  });

  // Clear all with confirmation
  document.getElementById('clearAllBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    actionsDropdown.classList.add('hidden');
    actionsToggleBtn.setAttribute('aria-expanded', 'false');
    if (!confirm('هل تريد حذف كل الإشعارات؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    try {
      const res = await fetch('/api/notifications', {
        method: 'DELETE',
        credentials: 'same-origin'
      });
      if (res.ok) fetchNotifications();
      else { console.error('clear all failed', res.status); alert('فشل حذف الإشعارات'); }
    } catch (err) {
      console.error('Clear all failed', err);
      alert('فشل حذف الإشعارات');
    }
  });

  // initial load
  fetchNotifications();
</script>
</body>
</html>
