<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aite - الإشعارات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background: #000; color: #e4e6eb; font-family: Inter, system-ui, sans-serif; }
    .glass-navbar { background-color: rgba(30,30,30,0.5); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .notification-card { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); border-radius: 12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; position:relative; }
    .notification-card.unread { border-left: 4px solid #007AFF; }
    .notif-avatar { width:48px; height:48px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.06); flex-shrink:0; }
    .badge { background:#ef4444; color:white; font-size:12px; padding:4px 8px; border-radius:999px; }
    .empty { text-align:center; color:#94a3b8; padding:40px 0; }
    .bottom-nav { position:fixed; left:0; right:0; bottom:0; height:60px; background: rgba(20,20,20,0.7); border-top:1px solid rgba(255,255,255,0.04); display:flex; justify-content:center; align-items:center; }
    .action-btn { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:6px 10px; border-radius:8px; color:#e6eefb; cursor:pointer; font-size:13px; }
    /* أصغر زر لتناسق أفضل */
    .action-small { padding:6px 8px; font-size:12px; border-radius:8px; display:inline-flex; gap:6px; align-items:center; justify-content:center; }
    /* زر حذف إشعار فردي */
    .notif-delete-btn {
      position: absolute;
      top: 8px;
      left: 8px; /* left لأن الصفحة dir=rtl، نضع الزر على "الجهة الإدارية" */
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      color: #f87171;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s, transform 0.12s;
      z-index: 5;
    }
    .notif-delete-btn:hover { background: rgba(255,255,255,0.04); transform: translateY(-1px); }
    .notif-card-content { flex:1; min-width:0; }
    .notif-title { font-size:14px; color:#e6eefb; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .notif-time { font-size:12px; color:#9fb3c8; }
    .notif-target { margin-top:6px; color:#9fb3c8; font-size:13px; }
  </style>
</head>
<body>
  <header class="glass-navbar sticky top-0 z-50 p-3">
    <nav class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/chat_list" class="text-gray-400 hover:text-white p-2"><i class="fas fa-arrow-right text-2xl"></i></a>
      </div>
      <div class="text-center">
        <h1 class="text-xl font-bold">الإشعارات</h1>
      </div>
      <div style="width:40px; display:flex; gap:8px; align-items:center; justify-content:flex-end;">
        <button id="markAllReadBtn" class="action-btn action-small" title="تعيين الكل كمقروء">
          <i class="fas fa-check-double" style="font-size:12px"></i>
          <span style="font-size:12px">تعيين الكل</span>
        </button>
        <button id="clearAllBtn" class="action-btn action-small" title="حذف كل الإشعارات">
          <i class="fas fa-trash" style="font-size:12px"></i>
          <span style="font-size:12px">حذف الكل</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-4 pb-36">
    <div id="notifContainer" class="space-y-3">
      <div class="text-center text-gray-400 p-6"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الإشعارات...</div>
    </div>
  </main>

<script>
  async function fetchNotifications() {
    try {
      const res = await fetch('/api/notifications', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      if (!data.ok) throw new Error('bad data');
      renderNotifications(data.notifications);
    } catch (e) {
      document.getElementById('notifContainer').innerHTML = '<div class="empty">فشل في جلب الإشعارات.</div>';
      console.error(e);
    }
  }

  function renderNotifications(notifs) {
    const container = document.getElementById('notifContainer');
    if (!notifs || notifs.length === 0) {
      container.innerHTML = '<div class="empty">لا توجد إشعارات حالياً.</div>';
      return;
    }

    container.innerHTML = notifs.map(n => {
      let title = '';
      let targetHint = '';
      if (n.type === 'post_like') {
        title = `<strong>${escapeHtml(n.from_username)}</strong> أعجب بمنشورك`;
        targetHint = 'عرض المنشور';
      } else if (n.type === 'reel_like') {
        title = `<strong>${escapeHtml(n.from_username)}</strong> أعجب بريلك`;
        targetHint = 'عرض الريل';
      } else if (n.type === 'post_comment') {
        title = `<strong>${escapeHtml(n.from_username)}</strong> علّق: "${escapeHtml((n.commentContent||'').substring(0,80))}"`;
        targetHint = 'عرض المنشور والتعليق';
      } else if (n.type === 'reel_comment') {
        title = `<strong>${escapeHtml(n.from_username)}</strong> علّق على ريلك: "${escapeHtml((n.commentContent||'').substring(0,80))}"`;
        targetHint = 'عرض الريل والتعليق';
      } else if (n.type === 'message') {
        title = `<strong>${escapeHtml(n.from_username)}</strong> أرسل لك رسالة: "${escapeHtml((n.preview||'').substring(0,80))}"`;
        targetHint = 'افتح المحادثة';
      } else {
        title = `<strong>${escapeHtml(n.from_username || 'مستخدم')}</strong> حدث جديد`;
        targetHint = '';
      }

      const time = new Date(n.timestamp || Date.now()).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });

      return `
        <div class="notification-card ${n.is_read ? '' : 'unread'}" data-id="${n.id}" data-type="${n.type}" data-post-id="${n.postId || ''}" data-reel-id="${n.reelId || ''}" data-from="${n.from_user_id || ''}">
          <button class="notif-delete-btn" data-id="${n.id}" title="حذف الإشعار"><i class="fas fa-trash" style="font-size:12px"></i></button>
          <img src="${escapeHtml(n.from_profile_picture_url || '')}" class="notif-avatar" alt="">
          <div class="notif-card-content">
            <div style="display:flex; justify-content:space-between; gap:8px; align-items:center">
              <div class="notif-title">${title}</div>
              <div class="notif-time">${time}</div>
            </div>
            <div class="notif-target">${targetHint}</div>
          </div>
        </div>
      `;
    }).join('');

    // attach click handlers for cards (delegated) in a safe way
    // Card click (navigation) handled by parent click listener below
  }

  function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Delegated click handling:
  document.addEventListener('click', async (ev) => {
    const delBtn = ev.target.closest('.notif-delete-btn');
    if (delBtn) {
      ev.stopPropagation();
      const notifId = delBtn.dataset.id;
      if (!notifId) return;
      if (!confirm('هل تريد حذف هذا الإشعار؟')) return;
      try {
        const res = await fetch(`/api/notifications/${encodeURIComponent(notifId)}`, {
          method: 'DELETE',
          credentials: 'same-origin'
        });
        if (res.ok) {
          // إزالة البطاقة محليًا
          const card = delBtn.closest('.notification-card');
          if (card) card.remove();
          // لو لم يبقِ بطاقات نعيد جلب الواجهة لتحديث الحالة
          const container = document.getElementById('notifContainer');
          if (!container.querySelector('.notification-card')) fetchNotifications();
        } else {
          alert('فشل حذف الإشعار');
        }
      } catch (e) {
        console.error('Delete notification error', e);
        alert('فشل الاتصال بالخادم');
      }
      return;
    }

    // إذا كان النقر داخل بطاقة إشعار (وليس على زر الحذف) — التوجيه وعلامة كمقروء
    const card = ev.target.closest('.notification-card');
    if (card) {
      const id = card.dataset.id;
      const type = card.dataset.type;
      const postId = card.dataset.postId;
      const reelId = card.dataset.reelId;
      const fromUser = card.dataset.from;

      // أولاً: تعليم هذا الإشعار كمقروء (لا ننتظر الاستجابة تماماً)
      if (id) {
        fetch('/api/notifications/mark_read', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        }).catch(()=>{});
      }

      // redirect based on type
      if (type === 'post_like' || type === 'post_comment') {
        if (postId) window.location.href = `/chat_list#post-${encodeURIComponent(postId)}`;
        else window.location.href = '/chat_list';
      } else if (type === 'reel_like' || type === 'reel_comment') {
        if (reelId) window.location.href = `/reels?id=${encodeURIComponent(reelId)}`;
        else window.location.href = '/reels';
      } else if (type === 'message') {
        if (fromUser) window.location.href = `/chat?contactId=${encodeURIComponent(fromUser)}`;
        else window.location.href = '/chat_list';
      } else {
        window.location.href = '/chat_list';
      }
    }
  });

  // initial load
  fetchNotifications();

  // SSE: تحديث القائمة/عداد الإشعارات فورياً عند التغيير
  if (window.EventSource) {
    const es = new EventSource('/api/notifications/stream', { withCredentials: true });
    es.addEventListener('notifications', (e) => {
      try {
        // نعيد جلب القائمة لكي تعكس المحتوى (أسهل من محاولة تحديث محلي)
        fetchNotifications();
      } catch (err) {
        console.error('Failed to parse notifications SSE data', err);
      }
    });
    es.addEventListener('error', (err) => {
      console.warn('Notifications SSE error', err);
    });
  }

  // زر تعيين الكل كمقروء
  document.getElementById('markAllReadBtn').addEventListener('click', async () => {
    try {
      const res = await fetch('/api/notifications/mark_read', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}) // لا id => يعلّم الكل
      });
      if (res.ok) fetchNotifications();
      else throw new Error('mark all failed');
    } catch (e) { console.error('Mark all read failed', e); alert('فشل تعيين الكل كمقروء'); }
  });

  // زر حذف الكل
  document.getElementById('clearAllBtn').addEventListener('click', async () => {
    if (!confirm('هل تريد حذف كل الإشعارات؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    try {
      const res = await fetch('/api/notifications', {
        method: 'DELETE',
        credentials: 'same-origin'
      });
      if (res.ok) fetchNotifications();
      else { console.error('clear all failed', res.status); alert('فشل حذف الإشعارات'); }
    } catch (e) { console.error('Clear all failed', e); alert('فشل حذف الإشعارات'); }
  });
</script>
</body>
</html>
```
