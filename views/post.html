<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المنشور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 20px; 
            overflow-x: hidden;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-post-card {
            background-color: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        /* --- Video large display --- */
        .video-large {
            width: 100%;
            height: 480px;
            max-height: 72vh;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: block;
        }
        .video-large video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            cursor: pointer;
        }
        .video-play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15));
            transition: opacity 0.18s;
            z-index: 30;
        }
        .video-play-overlay i {
            font-size: 54px;
            color: rgba(255,255,255,0.94);
            text-shadow: 0 6px 24px rgba(0,0,0,0.6);
        }
        .video-play-overlay.hidden { opacity: 0; pointer-events: none; }
        .video-fs-btn {
            position: absolute; top: 10px; left: 10px;
            width: 36px; height: 36px; border-radius: 8px;
            background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            color: #fff; z-index: 40; cursor: pointer;
        }

        /* --- Audio Player --- */
        .waveform-post { height: 60px; background: #000000; border-radius: 6px; border: 1px solid rgba(255,255,255,0.04); overflow: hidden; }
        .audio-play-wrapper { background: #000000; border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); padding: 10px; display: flex; align-items: center; gap: 12px; }
        .audio-play-button { background: #ffffff; color: #000000; width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: transform .12s ease; }
        .audio-play-button:hover { transform: translateY(-2px); }
        .audio-play-button i { color: #000000 !important; }

        /* Post text safe display, linkify and show-more */
        .post-content { position: relative; }
        .post-text {
            color: #e6eefb;
            line-height: 1.55;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: pre-wrap; /* keep user's line breaks but wrap long text */
            -webkit-font-smoothing: antialiased;
        }
        .post-text.collapsed {
            max-height: 6.6em; /* about 4 lines */
            overflow: hidden;
        }
        .post-text.expanded { max-height: none; }

        .post-text-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2.2em;
            pointer-events: none;
            background: linear-gradient(to top, rgba(24,25,26,1), rgba(24,25,26,0));
        }

        .read-more-btn {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            margin-top:8px;
            background: transparent;
            border: none;
            color: #60a5fa;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 4px 6px;
        }

        .post-text a {
            color: #60a5fa;
            text-decoration: underline;
            word-break: break-all;
        }

        .post-text a { cursor: pointer; }

        /* --- Comments Modal (Bottom Sheet) --- */
        .glass-comment-modal-content {
            background-color: #18191a;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 75vh; border-radius: 20px 20px 0 0;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
        }
        .glass-comment-modal-content.open { transform: translateY(0); }
        .glass-modal-bg { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); transition: opacity 0.3s; }
        .modal-handle { width: 40px; height: 4px; background-color: rgba(255,255,255,0.3); border-radius: 2px; margin: 12px auto 8px auto; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass-navbar p-3 flex items-center gap-4">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 text-white transition">
            <i class="fas fa-arrow-right text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-white">المنشور</h1>
    </header>

    <main id="postContainer" class="max-w-xl mx-auto p-4 mt-2">
        <div class="text-center py-20 text-gray-500">
            <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
            <p>جاري تحميل المنشور...</p>
        </div>
    </main>

    <div id="postOptionsModal" class="hidden fixed inset-0 z-[80] flex items-end justify-center glass-modal-bg" onclick="closePostOptionsModal()">
      <div class="sheet w-full md:max-w-md" onclick="event.stopPropagation()">
        <div class="modal-handle" style="margin-bottom:8px;"></div>
        <div class="p-3">
          <div id="postOptionsMessage" class="text-sm text-gray-300 mb-2 hidden"></div>
          <div class="option-row">
            <button id="postOptionsDeleteBtn" class="option-btn danger" onclick="confirmDeleteFromOptions(event)">
              <i class="fas fa-trash"></i>
              <span>حذف المنشور</span>
            </button>
          </div>
          <div class="option-row">
            <button id="postOptionsCloseBtn" class="option-btn" onclick="closePostOptionsModal()">
              <i class="fas fa-times"></i>
              <span>إلغاء</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-[90] flex items-center justify-center p-4 glass-modal-bg">
        <div class="bg-[#1f2937] p-6 rounded-xl shadow-2xl max-w-sm w-full border border-gray-700 text-center" onclick="event.stopPropagation()">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-gray-400 mb-6">هل أنت متأكد أنك تريد حذف هذا المنشور؟</p>
            <div class="flex justify-around space-x-4 space-x-reverse">
                <button id="cancelDeleteBtn" class="p-2 w-full bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition duration-300">إلغاء</button>
                <button id="confirmDeleteBtn" class="p-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-300">حذف</button>
            </div>
        </div>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="media-container flex items-center justify-center" onclick="event.stopPropagation()">
        </div>
    </div>

    <div id="commentModal" class="hidden fixed inset-0 z-[70] flex items-end md:items-center justify-center glass-modal-bg transition-opacity duration-300">
        <div id="commentModalContent" class="glass-comment-modal-content w-full md:w-auto" onclick="event.stopPropagation()">
            
            <div class="w-full flex justify-center" onclick="closeCommentModal()">
                <div class="modal-handle"></div>
            </div>

            <div class="flex justify-between items-center px-4 pb-2 pt-2 border-b border-gray-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    التعليقات 
                    <span id="commentCountBadge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full text-gray-300">0</span>
                </h3>
                <button class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-300 hover:text-white" onclick="closeCommentModal()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            
            <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar bg-[#18191a] min-h-0">
            </div>

            <div class="p-3 border-t border-gray-800 bg-[#18191a]">
                <div id="commentError" class="text-red-500 text-xs text-center mb-2 hidden"></div>
                <div class="flex items-center gap-2 bg-[#242526] p-1.5 rounded-3xl border border-gray-700">
                    <img id="myCurrentAvatar" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full object-cover border border-gray-600 ml-1">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." 
                           class="flex-grow bg-transparent text-white text-sm px-2 focus:outline-none" 
                           dir="rtl" autocomplete="off">
                    <button id="postCommentBtn" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition w-9 h-9 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-arrow-up text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Small safe-escaping and linkifying utilities (copied/adapted from chat_list)
        function escapeHtml(s) {
            if (s === undefined || s === null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function escapeAttr(s) {
            if (s === undefined || s === null) return '';
            return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Convert plain text to safe HTML and linkify URLs.
        // Ensures anchors cannot trigger parent click handlers (stopPropagation).
        function formatAndEscapeContent(text) {
            if (text === undefined || text === null) return '';
            // 1. escape
            let escapedText = String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');

            // 2. linkify (simple)
            const urlRegex = /(https?:\/\/[^\s'"]+)/g;
            const replaced = escapedText.replace(urlRegex, function(url) {
                // ensure href is attribute-escaped
                const href = escapeAttr(url);
                const visible = escapeHtml(url);
                // stopPropagation added to prevent parent click handlers (media viewer / navigation) from triggering
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 hover:underline transition" dir="ltr" onclick="event.stopPropagation()">${visible}</a>`;
            });

            return replaced;
        }

        // show-more / collapse helper (copied/adapted)
        function setupShowMoreButtons(containerRoot) {
            const root = containerRoot || document;
            root.querySelectorAll('.post-content').forEach(container => {
                try {
                    const textEl = container.querySelector('.post-text');
                    if (!textEl) return;

                    // Remove previous button/overlay if any
                    const existingBtn = container.querySelector('.read-more-btn');
                    const existingFade = container.querySelector('.post-text-fade');
                    if (existingBtn) existingBtn.remove();
                    if (existingFade) existingFade.remove();

                    // mark collapsed by default
                    textEl.classList.add('collapsed');
                    textEl.classList.remove('expanded');

                    // small timeout to let layout settle
                    setTimeout(() => {
                        if (textEl.scrollHeight > textEl.clientHeight + 3) {
                            const fade = document.createElement('div');
                            fade.className = 'post-text-fade';
                            container.appendChild(fade);

                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'read-more-btn';
                            btn.innerText = 'عرض المزيد';
                            btn.setAttribute('aria-expanded', 'false');

                            btn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                const expanded = textEl.classList.toggle('expanded');
                                if (expanded) {
                                    textEl.classList.remove('collapsed');
                                    btn.innerText = 'عرض أقل';
                                    btn.setAttribute('aria-expanded', 'true');
                                    if (fade) fade.style.display = 'none';
                                } else {
                                    textEl.classList.add('collapsed');
                                    btn.innerText = 'عرض المزيد';
                                    btn.setAttribute('aria-expanded', 'false');
                                    if (fade) fade.style.display = '';
                                    try { container.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch(e){}
                                }
                            });

                            container.appendChild(btn);
                        } else {
                            textEl.classList.remove('collapsed', 'expanded');
                        }
                    }, 60);
                } catch (e) {
                    console.warn('showMore setup failed', e);
                }
            });

            // ensure links inside posts do not propagate clicks higher
            (containerRoot || document).querySelectorAll('.post-text a').forEach(a => {
                a.addEventListener('click', (ev) => {
                    if (ev && ev.stopPropagation) ev.stopPropagation();
                    // allow default navigation
                });
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const postContainer = document.getElementById('postContainer');
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1768036959/post_media/1768036959482-badge.png";
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';
        
        let currentUserId = null;
        let activeWaveSurfer = null;
        let activeVideo = null;
        let currentPostIdForComments = null; // For modal
        let currentOptionsPostId = null; // For delete options

        // Fetch user info first
        fetch('/api/profile').then(r=>r.json()).then(d=> { 
            if(d && d.ok !== false) { 
                currentUserId = d.id || d.id === 0 ? d.id : null; 
                const pic = document.getElementById('myCurrentAvatar');
                if (pic && d.profile_picture_url) pic.src = d.profile_picture_url;
            }
        }).catch(()=>{});

        if (postId) {
            loadPost();
        } else {
            postContainer.innerHTML = '<p class="text-center text-red-500 mt-10">رابط غير صالح</p>';
        }

        async function loadPost() {
            try {
                const res = await fetch(`/api/posts/one/${encodeURIComponent(postId)}`); 
                const data = await res.json();
                
                if (res.ok && data && data.ok && data.post) {
                    renderPost(data.post);
                } else {
                    postContainer.innerHTML = '<p class="text-center text-gray-400 mt-10">المنشور غير موجود أو تم حذفه.</p>';
                }
            } catch (e) {
                console.error(e);
                postContainer.innerHTML = '<p class="text-center text-red-500 mt-10">خطأ في الاتصال</p>';
            }
        }

        function renderPost(post) {
            // Safely prepare fields
            const safeUsername = escapeHtml((post.user && (post.user.username || post.user.name)) || 'مستخدم');
            const profilePic = escapeAttr((post.user && post.user.profile_picture_url) || DEFAULT_AVATAR);
            const verifiedBadgeHtml = (post.user && post.user.is_verified) ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
            const onlineDotHtml = (post.user && post.user.is_online) ? `<span class="online-dot"></span>` : '';
            const formattedContent = formatAndEscapeContent(post.content || '');

            let mediaContent = '';
            if (post.media) {
                if (post.media.type === 'image') {
                    const imgUrl = escapeAttr(post.media.url || '');
                    mediaContent = `
                        <div class="mt-3 cursor-pointer" onclick="openMediaViewer('${imgUrl}', 'image', event)">
                            <img src="${imgUrl}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg border border-gray-800" onerror="this.onerror=null;this.src='${escapeAttr(DEFAULT_AVATAR)}'">
                        </div>
                    `;
                } else if (post.media.type === 'video') {
                     const poster = escapeAttr(post.media.poster || 'https://via.placeholder.com/1200x675?text=Video');
                     const videoSrc = escapeAttr(post.media.url || '');
                     mediaContent = `
                        <div class="mt-3 relative w-full video-large rounded-lg overflow-hidden bg-black group">
                            <video id="video-${escapeAttr(post.postId)}" src="${videoSrc}" 
                                   class="w-full h-full object-cover" 
                                   poster="${poster}" 
                                   preload="metadata"
                                   onclick="toggleVideoPlay('${escapeAttr(post.postId)}', event)">
                            </video>
                            
                            <div id="play-overlay-${escapeAttr(post.postId)}" class="video-play-overlay" onclick="toggleVideoPlay('${escapeAttr(post.postId)}', event)">
                                <i class="fas fa-play"></i>
                            </div>

                            <button class="video-fs-btn" onclick="toggleFullscreen('${escapeAttr(post.postId)}', event)" title="تكبير">
                              <i class="fas fa-expand"></i>
                            </button>
                        </div>
                    `;
                } else if (post.media.type === 'audio') {
                    const url = escapeAttr(post.media.url || '');
                    mediaContent = `
                        <div class="mt-3">
                            <div class="audio-play-wrapper">
                                <button id="audio-btn-${escapeAttr(post.postId)}" class="audio-play-button" onclick="toggleAudioPlay('${escapeAttr(post.postId)}')">
                                    <i class="fas fa-play"></i>
                                </button>
                                <div id="waveform-${escapeAttr(post.postId)}" class="waveform-post flex-grow" data-src="${url}"></div>
                            </div>
                        </div>
                    `;
                }
            }

            const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
            const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';

            postContainer.innerHTML = `
                <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${escapeAttr(post.postId)}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center">
                            <a href="/profile?userId=${escapeAttr(post.userId)}" class="avatar-with-dot" onclick="event.stopPropagation()">
                                <img src="${profilePic}" alt="${safeUsername}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600" onerror="this.onerror=null;this.src='${escapeAttr(DEFAULT_AVATAR)}'">
                                ${onlineDotHtml}
                            </a>
                            <div>
                                 <a href="/profile?userId=${escapeAttr(post.userId)}" class="text-white font-semibold hover:text-blue-400" onclick="event.stopPropagation()">${safeUsername} ${verifiedBadgeHtml}</a>
                                <p class="text-gray-400 text-xs">${new Date(post.timestamp).toLocaleString('ar-EG')}</p>
                            </div>
                        </div>
                        <button class="text-gray-400 hover:text-white transition duration-300 w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/5" 
                                onclick="openPostOptionsModal('${escapeAttr(post.postId)}', '${escapeAttr(post.userId)}')">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>

                    <div class="post-content mt-2">
                        <div class="post-text" dir="auto">${formattedContent}</div>
                    </div>

                    ${mediaContent}

                    <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                        <span id="likesCountDisplay"><i class="fas fa-heart ml-1"></i> ${Number(post.likes || 0)} إعجاب</span>
                        <span class="cursor-pointer hover:text-blue-400 comment-count-display" onclick="handleComment('${escapeAttr(post.postId)}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                    </div>

                    <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
                        <button class="flex items-center ${likeButtonClass} hover:text-red-500 transition duration-300 w-full justify-center gap-2" 
                                onclick="handleLike('${escapeAttr(post.postId)}', this)">
                            <i class="${likeIconClass} ml-2 like-icon text-lg"></i>
                            <span class="text-sm font-medium">إعجاب</span>
                        </button>

                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center gap-2" onclick="handleComment('${escapeAttr(post.postId)}')">
                            <i class="fas fa-comment-dots text-lg"></i>
                            <span class="text-sm font-medium">تعليق</span>
                        </button>

                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center gap-2" onclick="copyPostLink('${escapeAttr(post.postId)}', event)">
                            <i class="fas fa-link text-lg"></i>
                            <span class="text-sm font-medium">نسخ</span>
                        </button>
                    </div>
                </div>
            `;

            // initialize media & UI helpers
            if (post.media && post.media.type === 'audio') {
                setTimeout(() => {
                    initializePostWaveSurfer(post.postId, post.media.url);
                }, 120);
            }

            // setup show-more
            setTimeout(() => setupShowMoreButtons(), 150);
        }

        // --- Logic Functions (copied/adapted from Chat List, with small adjustments) ---

        function initializePostWaveSurfer(id, url) {
            const container = document.getElementById(`waveform-${id}`);
            if(!container) return;
            
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4A4A4A',
                progressColor: '#ffffff',
                cursorColor: 'transparent',
                barWidth: 3,
                barRadius: 3,
                barGap: 1,
                height: 60,
                responsive: true,
                mediaControls: false,
            });
            try { ws.load(url); } catch(e){}

            container.wsInstance = ws;

            ws.on && ws.on('play', () => {
                try { 
                    if (typeof ws.setWaveColor === 'function') ws.setWaveColor('#6b7280');
                    if (typeof ws.setProgressColor === 'function') ws.setProgressColor('#ffffff');
                } catch(e){}
            });
            ws.on && ws.on('pause', () => {
                try { 
                    if (typeof ws.setWaveColor === 'function') ws.setWaveColor('#ffffff');
                    if (typeof ws.setProgressColor === 'function') ws.setProgressColor('#ffffff');
                } catch(e){}
                activeWaveSurfer = null;
                const btn = document.getElementById(`audio-btn-${id}`);
                if(btn) btn.innerHTML = '<i class="fas fa-play"></i>';
            });
            ws.on && ws.on('finish', () => {
                 try {
                    if (typeof ws.setWaveColor === 'function') ws.setWaveColor('#ffffff');
                    if (typeof ws.setProgressColor === 'function') ws.setProgressColor('#ffffff');
                 } catch(e){}
                 activeWaveSurfer = null;
                 const btn = document.getElementById(`audio-btn-${id}`);
                 if(btn) btn.innerHTML = '<i class="fas fa-play"></i>';
                 try { ws.seekTo(0); } catch(e){}
            });
        }

        function toggleAudioPlay(id) {
            const btn = document.getElementById(`audio-btn-${id}`);
            const container = document.getElementById(`waveform-${id}`);
            const ws = container && container.wsInstance ? container.wsInstance : null;
            if (!ws) return;

            if (activeWaveSurfer && activeWaveSurfer !== ws) {
                try { activeWaveSurfer.pause(); } catch(e){}
            }
            if (activeVideo) {
                try { activeVideo.pause(); } catch(e){}
            }

            if (ws.isPlaying()) {
                ws.pause();
                if (btn) { btn.querySelector('i').classList.remove('fa-pause'); btn.querySelector('i').classList.add('fa-play'); }
            } else {
                ws.play();
                if (btn) { btn.querySelector('i').classList.remove('fa-play'); btn.querySelector('i').classList.add('fa-pause'); }
                activeWaveSurfer = ws;
            }
        }

        function toggleVideoPlay(id, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            const video = document.getElementById(`video-${id}`);
            const playOverlay = document.getElementById(`play-overlay-${id}`);

            if (!video) return;

            // Pause other active video/audio
            if (activeVideo && activeVideo !== video) {
                const activeId = activeVideo.id.split('-')[1];
                const overlay = document.getElementById(`play-overlay-${activeId}`);
                try { activeVideo.pause(); } catch(e){}
                if (overlay) overlay.classList.remove('hidden');
                activeVideo = null;
            }
            if (activeWaveSurfer) {
                try { activeWaveSurfer.pause(); } catch(e){}
                activeWaveSurfer = null;
            }

            if (video.paused) {
                video.play().then(() => {
                    if (playOverlay) playOverlay.classList.add('hidden');
                    activeVideo = video;
                    video.addEventListener('ended', () => {
                        if (playOverlay) playOverlay.classList.remove('hidden');
                        activeVideo = null;
                    });
                }).catch(err => console.warn('Video play failed', err));
            } else {
                video.pause();
                if (playOverlay) playOverlay.classList.remove('hidden');
                activeVideo = null;
            }
        }

        function toggleFullscreen(id, ev) {
            if (ev && ev.stopPropagation) ev.stopPropagation();
            const video = document.getElementById(`video-${id}`);
            if (!video) return;
            const container = video.closest('.video-large') || video;
            if (container.requestFullscreen) container.requestFullscreen().catch(()=>{});
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen().catch(()=>{});
            else if (video.requestFullscreen) video.requestFullscreen().catch(()=>{});
        }

        // Media viewer
        function openMediaViewer(url, type, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            if (type !== 'image') return;
            const modal = document.getElementById('mediaViewerModal');
            const content = document.getElementById('mediaViewerContent');
            content.innerHTML = `<img src="${escapeAttr(url)}" class="max-w-full max-h-full object-contain rounded-lg">`;
            modal.classList.remove('hidden');
        }
        function closeMediaViewer(e) {
            if (e && (e.target.id === 'mediaViewerModal' || e.target.closest('.fa-times'))) {
                const activeMedia = document.getElementById('mediaViewerContent').querySelector('video, audio');
                if (activeMedia) activeMedia.pause();
                document.getElementById('mediaViewerModal').classList.add('hidden');
                document.getElementById('mediaViewerContent').innerHTML = '';
            }
        }

        // Like Post
        async function handleLike(id, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(id)}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' });
                const data = await res.json();
                if (res.ok && data.ok) {
                    const icon = btn.querySelector('.like-icon');
                    if (data.action === 'liked') {
                        icon.classList.remove('far'); icon.classList.add('fas');
                        btn.classList.remove('text-gray-400'); btn.classList.add('text-red-500');
                    } else {
                        icon.classList.remove('fas'); icon.classList.add('far');
                        btn.classList.remove('text-red-500'); btn.classList.add('text-gray-400');
                    }
                    if (typeof data.newLikes !== 'undefined') {
                        const likesElem = document.getElementById('likesCountDisplay');
                        if (likesElem) likesElem.innerHTML = `<i class="fas fa-heart ml-1"></i> ${Number(data.newLikes)} إعجاب`;
                    }
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        // Post options modal
        function openPostOptionsModal(pid, uid) {
            currentOptionsPostId = pid;
            const modal = document.getElementById('postOptionsModal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closePostOptionsModal() {
            const modal = document.getElementById('postOptionsModal');
            if (modal) modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            currentOptionsPostId = null;
        }
        function confirmDeleteFromOptions(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (!currentOptionsPostId) return;
            document.getElementById('deleteModal').classList.remove('hidden');
            closePostOptionsModal();
        }

        document.getElementById('cancelDeleteBtn').onclick = () => document.getElementById('deleteModal').classList.add('hidden');
        document.getElementById('confirmDeleteBtn').onclick = async () => {
            if(!currentOptionsPostId) return;
            const btn = document.getElementById('confirmDeleteBtn');
            btn.innerHTML = 'جاري الحذف...';
            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(currentOptionsPostId)}`, { method: 'DELETE', credentials: 'same-origin' });
                const data = await res.json();
                if (res.ok && data.ok) {
                    window.location.href = '/chat_list';
                } else {
                    btn.innerHTML = 'حذف';
                    alert(data && data.error ? data.error : 'فشل الحذف');
                }
            } catch (e) {
                btn.innerHTML = 'حذف';
                alert('فشل الحذف');
            }
        };

        // Comments system (simplified rendering uses formatAndEscapeContent)
        function createCommentHtml(c, pid) {
            const isLiked = c.is_liked ? 'fas text-red-500' : 'far text-gray-400';
            const likeClass = c.is_liked ? 'text-red-500' : 'text-gray-400';
            const badgePlace = `<span class="badge-container" data-uid="${escapeAttr((c.user && c.user.userId) || '')}"></span>`;
            const replies = (c.recentReplies && c.recentReplies.length > 0) ? c.recentReplies.map(r => `
                <div class="mt-2 mr-8 bg-white/5 p-2 rounded-lg flex gap-2">
                    <img src="${escapeAttr(r.profile_picture_url || DEFAULT_AVATAR)}" class="w-5 h-5 rounded-full">
                    <div>
                        <span class="text-xs font-bold text-gray-300">${escapeHtml(r.username)}</span>
                        <span class="text-xs text-gray-400 block">${formatAndEscapeContent(r.content)}</span>
                    </div>
                </div>
            `).join('') : '';

            return `
                <div class="p-2 bg-[#242526] rounded-xl border border-gray-800" id="comment-${escapeAttr(c.commentId)}">
                    <div class="flex gap-3">
                        <img src="${escapeAttr((c.user && c.user.profile_picture_url) || DEFAULT_AVATAR)}" class="w-8 h-8 rounded-full object-cover shrink-0" onclick="window.location.href='/profile?userId=${escapeAttr((c.user && c.user.userId) || '')}'">
                        <div class="flex-grow">
                            <div class="flex justify-between items-start">
                                <div class="text-sm font-bold text-white">
                                    ${escapeHtml((c.user && c.user.username) || 'مستخدم')} ${badgePlace}
                                </div>
                                <div class="text-[10px] text-gray-500">${new Date(c.timestamp).toLocaleDateString()}</div>
                            </div>
                            <div class="text-gray-300 text-sm mt-1">${formatAndEscapeContent(c.content)}</div>
                            
                            <div class="flex items-center gap-4 mt-2">
                                <button class="${likeClass} flex items-center gap-1 text-xs" onclick="toggleCommentLike('${escapeAttr(pid)}', '${escapeAttr(c.commentId)}', this)">
                                    <i class="${isLiked} fa-heart"></i> <span class="count">${c.likes || 0}</span>
                                </button>
                                <button class="text-gray-400 text-xs flex items-center gap-1" onclick="document.getElementById('reply-box-${escapeAttr(c.commentId)}').classList.toggle('hidden')">
                                    <i class="fas fa-reply"></i> رد
                                </button>
                            </div>

                            <div id="reply-box-${escapeAttr(c.commentId)}" class="hidden mt-2 flex gap-2">
                                <input type="text" id="reply-input-${escapeAttr(c.commentId)}" placeholder="اكتب رداً..." class="bg-[#111] text-xs text-white rounded p-1.5 flex-grow border border-gray-700 focus:outline-none">
                                <button onclick="submitReply('${escapeAttr(pid)}', '${escapeAttr(c.commentId)}')" class="text-blue-400 text-xs px-2">إرسال</button>
                            </div>

                            ${replies}
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchComments(id) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin text-blue-500"></i></div>';
            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(id)}/comments`, { credentials: 'same-origin' });
                const data = await res.json();
                if (res.ok && data && data.ok) {
                    const comments = data.comments || [];
                    if (comments.length === 0) {
                        list.innerHTML = '<p class="text-center text-gray-500 py-10">لا توجد تعليقات بعد.</p>';
                        document.getElementById('commentCountBadge').innerText = '0';
                    } else {
                        list.innerHTML = comments.map(c => createCommentHtml(c, id)).join('');
                        document.getElementById('commentCountBadge').innerText = comments.length;
                        // ensure link click handlers inside comments don't bubble
                        setupShowMoreButtons(list);
                    }
                } else {
                    list.innerHTML = '<p class="text-center text-red-400">فشل التحميل</p>';
                }
            } catch (e) {
                console.error(e);
                list.innerHTML = '<p class="text-center text-red-400">خطأ في الاتصال</p>';
            }
        }

        async function toggleCommentLike(pid, cid, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(pid)}/comments/${encodeURIComponent(cid)}/like`, { method: 'POST', credentials: 'same-origin' });
                const data = await res.json();
                if (res.ok && data && data.ok) {
                    const countEl = btn.querySelector('.count');
                    if (countEl) countEl.textContent = data.likes;
                    const i = btn.querySelector('i');
                    if (i) {
                        if (data.is_liked) { i.classList.remove('far'); i.classList.add('fas'); btn.classList.remove('text-gray-400'); btn.classList.add('text-red-500'); }
                        else { i.classList.remove('fas'); i.classList.add('far'); btn.classList.remove('text-red-500'); btn.classList.add('text-gray-400'); }
                    }
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        async function submitReply(pid, cid) {
            const input = document.getElementById(`reply-input-${cid}`);
            if (!input) return;
            const content = input.value.trim();
            if (!content) return;
            input.disabled = true;
            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(pid)}/comments/${encodeURIComponent(cid)}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (res.ok && data && data.ok) {
                    await fetchComments(pid);
                } else {
                    alert(data && data.error ? data.error : 'فشل الإرسال');
                }
            } catch (e) {
                console.error(e);
            } finally {
                input.disabled = false;
            }
        }

        document.getElementById('postCommentBtn').onclick = async () => {
            const input = document.getElementById('newCommentInput');
            const content = input.value.trim();
            if(!content) return;
            const btn = document.getElementById('postCommentBtn');
            btn.disabled = true;
            try {
                const res = await fetch(`/api/posts/${encodeURIComponent(postId)}/comment`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (res.ok && data && data.ok) {
                    input.value = '';
                    await fetchComments(postId);
                } else {
                    alert(data && data.error ? data.error : 'فشل الإرسال');
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        };

        function handleComment(id) {
            currentPostIdForComments = id;
            const modal = document.getElementById('commentModal');
            const content = document.getElementById('commentModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.add('open'), 10);
            fetchComments(id);
        }
        function closeCommentModal() {
            const modal = document.getElementById('commentModal');
            const content = document.getElementById('commentModalContent');
            content.classList.remove('open');
            setTimeout(() => {
                modal.classList.add('hidden');
                currentPostIdForComments = null;
                const input = document.getElementById('newCommentInput');
                if (input) input.value = '';
                const list = document.getElementById('commentsList');
                if (list) list.innerHTML = '';
                const badge = document.getElementById('commentCountBadge');
                if (badge) badge.innerText = '0';
            }, 300);
        }

        function copyPostLink(id, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            if (!id) { showToast('رابط غير متوفر'); return; }
            const url = `${window.location.origin}/post?id=${encodeURIComponent(id)}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => showToast('تم نسخ الرابط')).catch(() => fallbackCopyTextToClipboard(url));
            } else fallbackCopyTextToClipboard(url);
        }
        function fallbackCopyTextToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try { document.execCommand('copy'); showToast('تم نسخ الرابط'); } catch (err) { showToast('فشل نسخ الرابط'); } finally { document.body.removeChild(textarea); }
        }

        // small toast
        function showToast(msg, timeout = 1800) {
            let t = document.getElementById('globalToast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'globalToast';
                t.className = 'toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => {
                t.classList.remove('show');
            }, timeout);
        }

    </script>
</body>
</html>
