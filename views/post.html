<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المنشور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        /* --- نفس تنسيقات الصفحة الرئيسية لضمان التطابق --- */
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* تنسيقات كارت المنشور */
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* تنسيقات الفيديو الكبير */
        .video-large {
            width: 100%;
            height: 480px;
            max-height: 72vh;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: block;
        }
        .video-large video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            cursor: pointer;
        }
        .video-play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15));
            transition: opacity 0.18s;
            z-index: 30;
        }
        .video-play-overlay i {
            font-size: 54px;
            color: rgba(255,255,255,0.94);
            text-shadow: 0 6px 24px rgba(0,0,0,0.6);
        }
        .video-play-overlay.hidden { opacity: 0; pointer-events: none; }
        
        .video-fs-btn {
            position: absolute;
            top: 10px; left: 10px;
            width: 36px; height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            color: #fff; z-index: 40; cursor: pointer;
        }

        /* تنسيقات الصوت */
        .waveform-post {
            height: 60px; 
            background: #000000;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.04);
            overflow: hidden;
        }
        .audio-play-wrapper {
            background: #000000;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 10px;
            display: flex; align-items: center; gap: 12px;
        }
        .audio-play-button {
            background: #ffffff; color: #000000;
            width: 44px; height: 44px;
            border-radius: 10px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 16px; border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: transform .12s ease, box-shadow .12s ease;
            cursor: pointer;
        }
        .audio-play-button:hover { transform: translateY(-2px); }

        /* نافذة التعليقات (Bottom Sheet) */
        .glass-comment-modal-content {
            background-color: #18191a;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            position: fixed; bottom: 0; left: 0; right: 0; top: auto; 
            height: 75vh;
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
        }
        .glass-comment-modal-content.open { transform: translateY(0); }
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }
        .modal-handle {
            width: 40px; height: 4px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 2px; margin: 12px auto 8px auto;
        }

        /* تنسيقات عامة */
        .verified-badge-img { display: inline-block; width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border: 2px solid #000; border-radius: 999px; }
        .avatar-with-dot { position: relative; display: inline-flex; }

        /* Bottom Navbar */
        .glass-bottom-navbar {
            background-color: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Toast */
        .toast {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px;
            background: rgba(0,0,0,0.8); color: #fff; padding: 8px 14px;
            border-radius: 10px; z-index: 2000; font-weight: 600; opacity: 0; transition: opacity .18s;
        }
        .toast.show { opacity: 1; }
        
        /* خيارات المنشور */
        #postOptionsModal .sheet {
          background: #0b0b0c; border-radius: 14px 14px 0 0; padding: 12px; border: 1px solid rgba(255,255,255,0.06);
        }
        .option-btn {
          display:flex; align-items:center; justify-content:center; gap:10px; padding:12px;
          border-radius:10px; width:100%; background: rgba(255,255,255,0.02); color:#e6eefb;
          border:1px solid rgba(255,255,255,0.03); cursor:pointer;
        }
        .option-row { display:flex; gap:10px; margin-bottom:10px; }
        .comment-item { padding: 8px; border-radius: 12px; background: #131313; border: 1px solid #222; margin-bottom: 8px;}
        .reply-item { margin-right: 40px; margin-top: 6px; background: #0f1416; padding: 6px; border-radius: 10px; border: 1px solid #222; }

    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex items-center gap-4 max-w-6xl mx-auto">
            <button onclick="window.location.href='/chat_list'" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 text-white transition">
                <i class="fas fa-arrow-right text-xl"></i>
            </button>
            <h1 class="text-xl font-bold text-white">عرض المنشور</h1>
        </nav>
    </header>

    <main class="max-w-xl mx-auto p-4 mt-2 mb-20">
        <div id="singlePostContainer">
            <div class="text-center py-20 text-gray-500">
                <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                <p>جاري تحميل المنشور...</p>
            </div>
        </div>
    </main>

    <div id="postOptionsModal" class="hidden fixed inset-0 z-[80] flex items-end justify-center glass-modal-bg" onclick="closePostOptionsModal()">
        <div class="sheet w-full md:max-w-md" onclick="event.stopPropagation()">
            <div class="modal-handle" style="margin-bottom:8px;"></div>
            <div class="p-3">
                <div id="postOptionsMessage" class="text-sm text-gray-300 mb-2 hidden"></div>
                
                <div class="option-row">
                    <button id="postOptionsDeleteBtn" class="option-btn" style="background: linear-gradient(90deg,#7f1d1d, #ef4444); border:none;" onclick="confirmDeleteFromOptions(event)">
                        <i class="fas fa-trash"></i> <span>حذف المنشور</span>
                    </button>
                </div>
                <div class="option-row">
                    <button id="postOptionsAddFriendBtn" class="option-btn" onclick="addFriendFromOptions(event)">
                        <i class="fas fa-user-plus"></i> <span>إضافة صديق</span>
                    </button>
                </div>
                <div class="option-row">
                    <button class="option-btn" onclick="copyPostLink(currentOptionsPostId, event); closePostOptionsModal();">
                        <i class="fas fa-link"></i> <span>نسخ الرابط</span>
                    </button>
                </div>
                <div class="option-row">
                    <button id="postOptionsCloseBtn" class="option-btn" onclick="closePostOptionsModal()">
                        <i class="fas fa-times"></i> <span>إلغاء</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal-bg">
        <div class="bg-[#1f2937] p-6 rounded-xl shadow-2xl max-w-sm w-full border border-gray-700 text-center" onclick="event.stopPropagation()">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-gray-400 mb-6">هل أنت متأكد أنك تريد حذف هذا المنشور؟</p>
            <div class="flex justify-around space-x-4 space-x-reverse">
                <button id="cancelDeleteBtn" class="p-2 w-full bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition duration-300">إلغاء</button>
                <button id="confirmDeleteBtn" class="p-2 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-300">تأكيد الحذف</button>
            </div>
            <div id="deleteMessage" class="text-red-500 mt-3 hidden"></div>
        </div>
    </div>

    <div id="commentModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center glass-modal-bg transition-opacity duration-300">
        <div id="commentModalContent" class="glass-comment-modal-content w-full md:w-auto" onclick="event.stopPropagation()">
            
            <div class="md:hidden w-full flex justify-center" onclick="closeCommentModal()">
                <div class="modal-handle"></div>
            </div>

            <div class="flex justify-between items-center px-4 pb-2 pt-2 border-b border-gray-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    التعليقات 
                    <span id="commentCountBadge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full text-gray-300">0</span>
                </h3>
                <button class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-300 hover:text-white" onclick="closeCommentModal()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            
            <div id="commentsList" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar bg-[#18191a] min-h-0">
                </div>

            <div class="p-3 border-t border-gray-800 bg-[#18191a]">
                <div id="commentError" class="text-red-500 text-xs text-center mb-2 hidden"></div>
                <div class="flex items-center gap-2 bg-[#242526] p-1.5 rounded-3xl border border-gray-700">
                    <img id="myCurrentAvatar" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full object-cover border border-gray-600 ml-1">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." 
                           class="flex-grow bg-transparent text-white text-sm px-2 focus:outline-none" 
                           dir="rtl" autocomplete="off">
                    <button id="postCommentBtn" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition w-9 h-9 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-arrow-up text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 glass-modal-bg" onclick="closeMediaViewer(event)">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer(event)">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="max-h-[80vh] w-auto flex items-center justify-center" onclick="event.stopPropagation()">
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 z-50 glass-bottom-navbar">
        <nav class="flex justify-around items-center max-w-lg mx-auto h-14 relative">
            <a href="/chat_list" class="flex flex-col items-center justify-center p-2 text-blue-400">
                <i class="fas fa-home text-xl"></i>
            </a>
            <a href="/users_list" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-comment-dots text-xl"></i>
            </a>
            <a href="/reels" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-clapperboard text-xl"></i>
            </a>
            <a href="/notifications" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-bell text-xl"></i>
            </a>
            <a href="/all_users" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-users text-xl"></i>
            </a>
        </nav>
    </div>

    <script>
        // === Constants & Globals ===
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';
        const urlParams = new URLSearchParams(window.location.search);
        const targetPostId = urlParams.get('id');

        let currentUserId = null;
        let activeWaveSurfer = null;
        let activeVideo = null;
        let currentPostIdForComments = null;
        let currentOptionsPostId = null;
        let currentOptionsUserId = null;
        let currentPostIdToDelete = null;

        // === DOM Elements ===
        const singlePostContainer = document.getElementById('singlePostContainer');
        const mediaViewerModal = document.getElementById('mediaViewerModal');
        const mediaViewerContent = document.getElementById('mediaViewerContent');
        
        // Options Modal
        const postOptionsModal = document.getElementById('postOptionsModal');
        const postOptionsDeleteBtn = document.getElementById('postOptionsDeleteBtn');
        const postOptionsAddFriendBtn = document.getElementById('postOptionsAddFriendBtn');
        const postOptionsMessage = document.getElementById('postOptionsMessage');

        // Delete Modal
        const deleteModal = document.getElementById('deleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteMessage = document.getElementById('deleteMessage');

        // === Initialization ===
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Get Current User Profile
            try {
                const res = await fetch('/api/profile');
                if (res.ok) {
                    const data = await res.json();
                    currentUserId = data.id;
                    const avatarEl = document.getElementById('myCurrentAvatar');
                    if (avatarEl && data.profile_picture_url) avatarEl.src = data.profile_picture_url;
                }
            } catch (e) { console.error("Error fetching profile", e); }

            // 2. Load the Post
            if (targetPostId) {
                fetchAndDisplaySinglePost(targetPostId);
            } else {
                singlePostContainer.innerHTML = '<div class="text-center text-red-500 py-10">رابط غير صالح.</div>';
            }
        });

        // === Logic: Fetch & Render Single Post ===
        async function fetchAndDisplaySinglePost(postId) {
            try {
                // Adjust endpoint according to your API (assuming /api/posts/one/:id or similar)
                // If specific endpoint doesn't exist, we might need to filter from list (less efficient)
                // Using the pattern from your code:
                const res = await fetch(`/api/posts/one/${postId}`);
                const data = await res.json();

                if (res.ok && data.post) {
                    const post = data.post;
                    // Ensure verified status matches current data
                    if(!post.user.is_verified) {
                         // Optional: double check verification if needed, or rely on post data
                    }

                    // Render Card
                    singlePostContainer.innerHTML = createPostCard(post);

                    // Initialize Audio if present
                    if (post.media && post.media.type === 'audio') {
                        setTimeout(() => initializePostWaveSurfer(post.postId, post.media.url), 100);
                    }
                } else {
                    singlePostContainer.innerHTML = '<div class="text-center text-gray-400 py-10">المنشور غير موجود أو تم حذفه.</div>';
                }
            } catch (error) {
                console.error(error);
                singlePostContainer.innerHTML = '<div class="text-center text-red-500 py-10">حدث خطأ في الاتصال.</div>';
            }
        }

        // === HTML Generators (Identical to Chat List) ===
        function createPostCard(post) {
            let mediaContent = '';
            
            if (post.media) {
                if (post.media.type === 'image') {
                    mediaContent = `
                        <div class="mt-3 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image', event)">
                            <img src="${post.media.url}" alt="صورة المنشور" class="w-full max-h-[500px] object-cover rounded-lg border border-gray-800">
                        </div>
                    `;
                } else if (post.media.type === 'video') {
                     const poster = post.media.poster || post.media.thumbnail || 'https://via.placeholder.com/1200x675?text=Video';
                     mediaContent = `
                        <div class="mt-3 relative w-full video-large rounded-lg overflow-hidden bg-black group">
                            <video id="video-${post.postId}" src="${post.media.url}" 
                                   class="w-full h-full object-cover" 
                                   poster="${poster}" 
                                   onclick="toggleVideoPlay('${post.postId}', event)">
                            </video>
                            <div id="play-overlay-${post.postId}" class="video-play-overlay" onclick="toggleVideoPlay('${post.postId}', event)">
                                <i class="fas fa-play"></i>
                            </div>
                            <button class="video-fs-btn" onclick="toggleFullscreen('${post.postId}', event)"><i class="fas fa-expand"></i></button>
                        </div>
                    `;
                } else if (post.media.type === 'audio') {
                    mediaContent = `
                        <div class="mt-3">
                            <div class="audio-play-wrapper">
                                <button id="audio-btn-${post.postId}" class="audio-play-button" onclick="toggleAudioPlay('${post.postId}')">
                                    <i class="fas fa-play"></i>
                                </button>
                                <div id="waveform-${post.postId}" class="waveform-post flex-grow" data-src="${post.media.url}"></div>
                            </div>
                        </div>
                    `;
                }
            }

            const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
            const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';
            const verifiedBadgeHtml = post.user && post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';

            return `
                <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center">
                            <a href="/profile?userId=${post.userId}" class="avatar-with-dot">
                                <img src="${post.user.profile_picture_url || DEFAULT_AVATAR}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600">
                                ${post.user.is_online ? '<span class="online-dot"></span>' : ''}
                            </a>
                            <div>
                                 <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">${post.user.username} ${verifiedBadgeHtml}</a>
                                <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
                            </div>
                        </div>
                        <button class="text-gray-400 hover:text-white transition p-2" onclick="togglePostMenu('${post.postId}', '${post.userId}', event)">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>

                    <p class="text-gray-200 whitespace-pre-wrap text-base leading-relaxed">${post.content}</p>

                    ${mediaContent}

                    <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                        <span><i class="fas fa-heart ml-1"></i> ${post.likes} إعجاب</span>
                        <span class="cursor-pointer hover:text-blue-400 comment-count-display" onclick="handleComment('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                    </div>

                    <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
                        <button class="flex items-center ${likeButtonClass} hover:text-red-500 transition duration-300 w-full justify-center gap-2" 
                                onclick="handleLike('${post.postId}', this)">
                            <i class="${likeIconClass} like-icon text-lg"></i>
                            <span class="text-sm font-medium">إعجاب</span>
                        </button>

                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center gap-2" onclick="handleComment('${post.postId}')">
                            <i class="fas fa-comment-dots text-lg"></i>
                            <span class="text-sm font-medium">تعليق</span>
                        </button>

                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center gap-2" onclick="copyPostLink('${post.postId}', event)">
                            <i class="fas fa-link text-lg"></i>
                            <span class="text-sm font-medium">نسخ</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // === Post Options Logic (Bottom Sheet) ===
        function togglePostMenu(postId, userId, event) {
            if(event) event.stopPropagation();
            currentOptionsPostId = postId;
            currentOptionsUserId = userId;
            postOptionsMessage.classList.add('hidden');

            // Show Delete if Owner
            if (currentUserId && userId === currentUserId) {
                postOptionsDeleteBtn.style.display = 'flex';
                postOptionsAddFriendBtn.style.display = 'none';
            } else {
                postOptionsDeleteBtn.style.display = 'none';
                postOptionsAddFriendBtn.style.display = 'flex'; // Logic to check friendship can be added here
            }

            postOptionsModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePostOptionsModal() {
            postOptionsModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function confirmDeleteFromOptions(e) {
            closePostOptionsModal();
            currentPostIdToDelete = currentOptionsPostId;
            deleteModal.classList.remove('hidden');
        }

        // === Delete Logic ===
        cancelDeleteBtn.addEventListener('click', () => { deleteModal.classList.add('hidden'); currentPostIdToDelete = null; });
        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentPostIdToDelete) return;
            confirmDeleteBtn.innerText = 'جاري الحذف...';
            try {
                const res = await fetch(`/api/posts/${currentPostIdToDelete}`, { method: 'DELETE' });
                const data = await res.json();
                if(res.ok && data.ok) {
                    window.location.href = '/chat_list'; // Redirect after delete
                } else {
                    deleteMessage.textContent = data.error || 'فشل الحذف';
                    deleteMessage.classList.remove('hidden');
                }
            } catch(e) { console.error(e); }
            confirmDeleteBtn.innerText = 'تأكيد الحذف';
        });

        // === Comments Logic (Bottom Sheet) ===
        function handleComment(postId) {
            currentPostIdForComments = postId;
            document.getElementById('commentModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('commentModalContent').classList.add('open'), 10);
            fetchAndDisplayComments(postId);
        }

        function closeCommentModal() {
            document.getElementById('commentModalContent').classList.remove('open');
            setTimeout(() => document.getElementById('commentModal').classList.add('hidden'), 300);
        }

        async function fetchAndDisplayComments(postId) {
            const list = document.getElementById('commentsList');
            const badge = document.getElementById('commentCountBadge');
            list.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin"></i></div>';
            
            try {
                const res = await fetch(`/api/posts/${postId}/comments`);
                const data = await res.json();
                if(res.ok && data.ok) {
                    const comments = data.comments || [];
                    badge.innerText = comments.length;
                    
                    if(comments.length === 0) {
                        list.innerHTML = '<div class="text-center text-gray-500 py-10">لا توجد تعليقات بعد.</div>';
                    } else {
                        list.innerHTML = comments.map(c => {
                            const badgeHtml = (c.user && c.user.is_verified) ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
                            return `
                                <div class="comment-item">
                                    <div class="flex items-start gap-3">
                                        <img src="${c.user.profile_picture_url || DEFAULT_AVATAR}" class="w-8 h-8 rounded-full border border-gray-700">
                                        <div class="flex-1">
                                            <div class="flex justify-between">
                                                <span class="text-sm font-bold text-white">${c.user.username} ${badgeHtml}</span>
                                                <span class="text-[10px] text-gray-500">${new Date(c.timestamp).toLocaleDateString()}</span>
                                            </div>
                                            <p class="text-sm text-gray-200 mt-1">${c.content}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById('postCommentBtn').onclick = async () => {
            const input = document.getElementById('newCommentInput');
            const content = input.value.trim();
            if(!content || !currentPostIdForComments) return;
            
            try {
                const res = await fetch(`/api/posts/${currentPostIdForComments}/comment`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content})
                });
                const data = await res.json();
                if(data.ok) {
                    input.value = '';
                    fetchAndDisplayComments(currentPostIdForComments);
                    // Update main card counter
                    const display = document.querySelector('.comment-count-display');
                    if(display) {
                        const count = parseInt(display.innerText.replace(/\D/g,'')) || 0;
                        display.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${count+1} تعليق`;
                    }
                }
            } catch(e) { console.error(e); }
        };

        // === Like Logic ===
        async function handleLike(postId, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers:{'Content-Type':'application/json'} });
                const data = await res.json();
                if(res.ok && data.ok) {
                    const icon = btn.querySelector('.like-icon');
                    // Update Text
                    const statsSpan = btn.closest('.glass-post-card').querySelector('.flex.justify-between span:first-child');
                    if(statsSpan) statsSpan.innerHTML = `<i class="fas fa-heart ml-1"></i> ${data.newLikes} إعجاب`;

                    if(data.action === 'liked') {
                        icon.classList.remove('far', 'text-gray-400');
                        icon.classList.add('fas', 'text-red-500');
                        btn.classList.add('text-red-500');
                    } else {
                        icon.classList.remove('fas', 'text-red-500');
                        icon.classList.add('far', 'text-gray-400');
                        btn.classList.remove('text-red-500');
                        btn.classList.add('text-gray-400');
                    }
                }
            } catch(e) { console.error(e); }
            btn.disabled = false;
        }

        // === Media Utilities ===
        function openMediaViewer(url, type, event) {
            if(event) event.stopPropagation();
            mediaViewerContent.innerHTML = `<img src="${url}" class="max-w-full max-h-[80vh] rounded-lg">`;
            mediaViewerModal.classList.remove('hidden');
        }
        function closeMediaViewer(e) {
            if(e) e.stopPropagation();
            mediaViewerModal.classList.add('hidden');
        }
        
        // Video
        function toggleVideoPlay(postId, event) {
            if(event) event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const overlay = document.getElementById(`play-overlay-${postId}`);
            
            if(activeVideo && activeVideo !== video) {
                activeVideo.pause();
                const oldOverlay = activeVideo.parentElement.querySelector('.video-play-overlay');
                if(oldOverlay) oldOverlay.classList.remove('hidden');
            }

            if(video.paused) {
                video.play();
                overlay.classList.add('hidden');
                activeVideo = video;
            } else {
                video.pause();
                overlay.classList.remove('hidden');
                activeVideo = null;
            }
        }
        function toggleFullscreen(postId, e) {
            if(e) e.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            if(video.requestFullscreen) video.requestFullscreen();
            else if(video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        }

        // Audio (WaveSurfer)
        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if(!container) return;
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4A4A4A',
                progressColor: '#ffffff',
                barWidth: 3, barRadius: 3, barGap: 1, height: 60,
                cursorColor: 'transparent',
                mediaControls: false
            });
            ws.load(url);
            container.wsInstance = ws;
            
            // Set up button
            const btn = document.getElementById(`audio-btn-${postId}`);
            if(btn) {
                btn.onclick = () => toggleAudioPlay(postId);
            }
            
            ws.on('play', () => {
                if(btn) btn.innerHTML = '<i class="fas fa-pause"></i>';
                // Reset other audios
                if(activeWaveSurfer && activeWaveSurfer !== ws) {
                    activeWaveSurfer.pause();
                    const oldBtn = activeWaveSurfer.container.parentElement.querySelector('.audio-play-button');
                    if(oldBtn) oldBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
                activeWaveSurfer = ws;
            });
            ws.on('pause', () => { if(btn) btn.innerHTML = '<i class="fas fa-play"></i>'; });
            ws.on('finish', () => { if(btn) btn.innerHTML = '<i class="fas fa-play"></i>'; activeWaveSurfer = null; });
        }
        
        function toggleAudioPlay(postId) {
            const container = document.getElementById(`waveform-${postId}`);
            if(container && container.wsInstance) {
                container.wsInstance.playPause();
            }
        }

        // Helper
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour:'2-digit', minute:'2-digit' });
        }
        
        function copyPostLink(postId, event) {
            if(event) event.stopPropagation();
            const url = `${window.location.origin}/post?id=${postId || targetPostId}`;
            navigator.clipboard.writeText(url).then(() => showToast('تم نسخ الرابط'));
        }

        function showToast(msg) {
            let t = document.getElementById('gToast');
            if(!t) {
                t = document.createElement('div'); t.id='gToast'; t.className='toast';
                document.body.appendChild(t);
            }
            t.textContent = msg; t.classList.add('show');
            setTimeout(()=>t.classList.remove('show'), 2000);
        }

    </script>
</body>
</html>
