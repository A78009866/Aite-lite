<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المنشور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            /* مسافة سفلية لحساب حقل الإدخال المثبت */
            padding-bottom: 80px;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-post-card {
            background-color: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- تنسيقات التعليقات (مثل الرئيسية تماماً) --- */
        .comment-item { 
            padding: 10px; 
            border-radius: 12px; 
            background: #131313; 
            border: 1px solid #222; 
            margin-bottom: 10px;
        }
        .reply-item { 
            margin-right: 40px; 
            margin-top: 8px; 
            background: #0f1416; 
            padding: 8px; 
            border-radius: 10px; 
            border: 1px solid #222; 
        }
        .small-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .like-count { font-weight: 700; color: #9ca3af; font-size: 12px; }
        .comment-actions button { font-size: 12px; margin-left: 8px; transition: color 0.2s; }
        .comment-actions button:hover { color: #fff; }

        /* حقل التعليق المثبت في الأسفل */
        .fixed-comment-input {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: #18191a;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* الفيديو والصوت */
        .video-large {
            width: 100%; height: 480px; border-radius: 12px; overflow: hidden; background: #000; position: relative;
        }
        .video-large video { width: 100%; height: 100%; object-fit: cover; }
        .video-play-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); z-index: 30; pointer-events: none;
        }
        .video-play-overlay.hidden { opacity: 0; }
        
        .waveform-post { height: 60px; background: #000; border-radius: 6px; border: 1px solid rgba(255,255,255,0.04); overflow: hidden; }
        .audio-play-wrapper { background: #000; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.04); }
        .audio-play-button { width: 44px; height: 44px; border-radius: 10px; background: #fff; color: #000; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        
        .verified-badge-img { width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; display: inline-block; }
        
        /* Toast */
        .toast {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 100px;
            background: rgba(0,0,0,0.8); color: #fff; padding: 8px 14px;
            border-radius: 10px; z-index: 2000; font-weight: 600; opacity: 0; transition: opacity .18s;
        }
        .toast.show { opacity: 1; }

    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex items-center gap-4 max-w-xl mx-auto">
            <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 text-white transition">
                <i class="fas fa-arrow-right text-xl"></i>
            </button>
            <h1 class="text-xl font-bold text-white">المنشور</h1>
        </nav>
    </header>

    <main class="max-w-xl mx-auto p-4">
        <div id="singlePostContainer" class="mb-6">
            <div class="text-center py-20 text-gray-500">
                <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                <p>جاري تحميل المنشور...</p>
            </div>
        </div>

        <div id="commentsSection">
            <h3 class="text-white font-bold mb-4 border-b border-gray-800 pb-2">
                التعليقات (<span id="totalCommentsCount">0</span>)
            </h3>
            <div id="commentsList" class="space-y-3 pb-4">
                </div>
        </div>
    </main>

    <div class="fixed-comment-input max-w-xl mx-auto md:w-full md:left-auto md:right-auto">
        <img id="myCurrentAvatar" src="https://via.placeholder.com/40" class="w-9 h-9 rounded-full object-cover border border-gray-600 ml-2">
        <div class="flex-grow bg-[#242526] rounded-3xl flex items-center px-4 py-2 border border-gray-700">
            <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." 
                   class="w-full bg-transparent text-white text-sm focus:outline-none" 
                   dir="rtl" autocomplete="off">
            <button id="postCommentBtn" class="mr-2 text-blue-500 hover:text-blue-400 disabled:opacity-50">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div id="mediaViewerModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-2 bg-black/90 backdrop-blur-sm" onclick="closeMediaViewer()">
        <button class="absolute top-4 left-4 text-white text-3xl z-50 p-2 bg-gray-800 rounded-full hover:bg-gray-700 transition" onclick="closeMediaViewer()">
            <i class="fas fa-times"></i>
        </button>
        <div id="mediaViewerContent" class="max-h-[90vh] max-w-full" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        // === ثوابت ومتغيرات ===
        const urlParams = new URLSearchParams(window.location.search);
        const targetPostId = urlParams.get('id');
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        const DEFAULT_AVATAR = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';
        
        let currentUserId = null;
        let activeWaveSurfer = null;
        let activeVideo = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. جلب بيانات المستخدم الحالي
            try {
                const res = await fetch('/api/profile');
                if (res.ok) {
                    const data = await res.json();
                    currentUserId = data.id;
                    document.getElementById('myCurrentAvatar').src = data.profile_picture_url || DEFAULT_AVATAR;
                }
            } catch (e) { console.error("Profile Error", e); }

            // 2. تحميل المنشور والتعليقات
            if (targetPostId) {
                await fetchAndDisplaySinglePost(targetPostId);
                fetchAndDisplayComments(targetPostId);
            } else {
                document.getElementById('singlePostContainer').innerHTML = '<p class="text-center text-red-500 mt-10">رابط غير صالح</p>';
            }
        });

        // === دالة عرض المنشور ===
        async function fetchAndDisplaySinglePost(postId) {
            const container = document.getElementById('singlePostContainer');
            try {
                // افترضنا وجود Endpoint لجلب منشور واحد، أو يمكن تعديلها
                const res = await fetch(`/api/posts/one/${postId}`);
                const data = await res.json();

                if (res.ok && data.post) {
                    container.innerHTML = createPostCard(data.post);
                    if (data.post.media && data.post.media.type === 'audio') {
                        setTimeout(() => initializeWaveSurfer(data.post.postId, data.post.media.url), 100);
                    }
                } else {
                    container.innerHTML = '<p class="text-center text-gray-400 mt-10">المنشور غير متاح.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p class="text-center text-red-500 mt-10">خطأ في الاتصال.</p>';
            }
        }

        function createPostCard(post) {
            let mediaHtml = '';
            if (post.media) {
                if (post.media.type === 'image') {
                    mediaHtml = `<div onclick="openMediaViewer('${post.media.url}')" class="mt-3 cursor-pointer"><img src="${post.media.url}" class="w-full rounded-lg border border-gray-800"></div>`;
                } else if (post.media.type === 'video') {
                    mediaHtml = `
                    <div class="mt-3 relative w-full video-large rounded-lg bg-black">
                        <video id="video-${post.postId}" src="${post.media.url}" class="w-full h-full object-cover" onclick="toggleVideo(this)"></video>
                        <div class="video-play-overlay" onclick="toggleVideo(document.getElementById('video-${post.postId}'))"><i class="fas fa-play text-5xl text-white"></i></div>
                    </div>`;
                } else if (post.media.type === 'audio') {
                    mediaHtml = `
                    <div class="mt-3 audio-play-wrapper">
                        <button id="audio-btn-${post.postId}" class="audio-play-button" onclick="toggleAudio('${post.postId}')"><i class="fas fa-play"></i></button>
                        <div id="waveform-${post.postId}" class="waveform-post flex-grow"></div>
                    </div>`;
                }
            }
            
            const verified = post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
            const likeClass = post.is_liked ? 'text-red-500' : 'text-gray-400';
            const likeIcon = post.is_liked ? 'fas' : 'far';

            return `
                <div class="glass-post-card p-4 rounded-xl">
                    <div class="flex items-center gap-3 mb-3">
                        <img src="${post.user.profile_picture_url || DEFAULT_AVATAR}" class="w-10 h-10 rounded-full object-cover border border-gray-600">
                        <div>
                            <h4 class="text-white font-bold text-sm">${post.user.username} ${verified}</h4>
                            <p class="text-gray-400 text-xs">${new Date(post.timestamp).toLocaleString('ar-EG')}</p>
                        </div>
                    </div>
                    <p class="text-gray-200 whitespace-pre-wrap leading-relaxed">${post.content}</p>
                    ${mediaHtml}
                    
                    <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pt-3 border-t border-gray-700">
                         <button class="flex items-center gap-2 ${likeClass} hover:text-red-500 transition" onclick="handlePostLike('${post.postId}', this)">
                            <i class="${likeIcon} fa-heart text-lg"></i> <span>${post.likes}</span>
                         </button>
                         <div class="flex items-center gap-2">
                             <i class="far fa-comment-dots"></i> <span>${post.commentsCount || 0}</span>
                         </div>
                    </div>
                </div>
            `;
        }

        // === منطق التعليقات الكامل (مثل الرئيسية) ===

        async function fetchAndDisplayComments(postId) {
            const list = document.getElementById('commentsList');
            const countSpan = document.getElementById('totalCommentsCount');
            
            try {
                const res = await fetch(`/api/posts/${postId}/comments`);
                const data = await res.json();
                
                if (res.ok && data.ok) {
                    const comments = data.comments || [];
                    countSpan.innerText = comments.length;
                    
                    if (comments.length === 0) {
                        list.innerHTML = '<div class="text-center text-gray-500 py-6">كن أول من يعلق!</div>';
                    } else {
                        list.innerHTML = comments.map(c => createCommentHtml(c, postId)).join('');
                    }
                }
            } catch (e) { console.error(e); }
        }

        function createCommentHtml(comment, postId) {
            const verifiedHtml = comment.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
            const likedClass = comment.is_liked ? 'text-red-400' : 'text-gray-400';
            const likeIcon = comment.is_liked ? 'fas' : 'far';
            
            // الردود السابقة
            const repliesHtml = (comment.recentReplies && comment.recentReplies.length > 0) ? comment.recentReplies.map(r => `
                <div class="reply-item flex items-start gap-2">
                    <img src="${r.profile_picture_url || DEFAULT_AVATAR}" class="small-avatar flex-shrink-0">
                    <div class="flex-1">
                        <div class="text-xs text-gray-300 font-bold">${r.username}</div>
                        <div class="text-sm text-gray-200">${r.content}</div>
                    </div>
                </div>
            `).join('') : '';

            return `
                <div class="comment-item" id="comment-${comment.commentId}">
                    <div class="flex items-start gap-3">
                        <img src="${comment.user.profile_picture_url || DEFAULT_AVATAR}" class="w-8 h-8 rounded-full flex-shrink-0 object-cover">
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="text-sm font-bold text-white">${comment.user.username} ${verifiedHtml}</div>
                                    <div class="text-xs text-gray-500">${new Date(comment.timestamp).toLocaleDateString()}</div>
                                </div>
                            </div>
                            <div class="mt-1 text-sm text-gray-200 leading-snug">${comment.content}</div>
                            
                            <div class="flex items-center gap-4 mt-2 comment-actions">
                                <button class="flex items-center gap-1 ${likedClass}" onclick="toggleCommentLike('${postId}', '${comment.commentId}', this)">
                                    <i class="${likeIcon} fa-heart"></i>
                                    <span class="like-count">${comment.likes || 0}</span>
                                </button>
                                <button class="flex items-center gap-1 text-gray-400" onclick="openReplyBox('${comment.commentId}')">
                                    <i class="fas fa-reply"></i>
                                    <span>رد</span>
                                </button>
                            </div>

                            <div id="reply-box-${comment.commentId}" class="mt-2 hidden">
                                <div class="flex items-center gap-2 bg-[#111] p-2 rounded-xl border border-gray-800">
                                    <input id="reply-input-${comment.commentId}" class="flex-1 bg-transparent text-sm text-white outline-none" placeholder="اكتب رداً..." />
                                    <button class="text-blue-500 text-sm font-bold px-2" onclick="postReply('${postId}', '${comment.commentId}')">إرسال</button>
                                </div>
                            </div>

                            <div class="mt-2 space-y-2">
                                ${repliesHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 1. الإعجاب بالتعليق
        async function toggleCommentLike(postId, commentId, btn) {
            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent) || 0;

            // تحديث واجهة سريع
            if (icon.classList.contains('fas')) {
                icon.classList.replace('fas', 'far');
                btn.classList.replace('text-red-400', 'text-gray-400');
                countSpan.textContent = Math.max(0, count - 1);
            } else {
                icon.classList.replace('far', 'fas');
                btn.classList.replace('text-gray-400', 'text-red-400');
                countSpan.textContent = count + 1;
            }

            try {
                await fetch(`/api/posts/${postId}/comments/${commentId}/like`, { method: 'POST' });
            } catch (e) { console.error(e); }
        }

        // 2. فتح صندوق الرد
        function openReplyBox(commentId) {
            const box = document.getElementById(`reply-box-${commentId}`);
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
                document.getElementById(`reply-input-${commentId}`).focus();
            }
        }

        // 3. إرسال الرد
        async function postReply(postId, commentId) {
            const input = document.getElementById(`reply-input-${commentId}`);
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`/api/posts/${postId}/comments/${commentId}/reply`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    fetchAndDisplayComments(postId); // إعادة تحميل لرؤية الرد الجديد
                }
            } catch (e) { console.error(e); }
        }

        // 4. إرسال تعليق رئيسي (من الشريط السفلي)
        document.getElementById('postCommentBtn').onclick = async () => {
            const input = document.getElementById('newCommentInput');
            const content = input.value.trim();
            if (!content || !targetPostId) return;

            try {
                const res = await fetch(`/api/posts/${targetPostId}/comment`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    input.value = '';
                    fetchAndDisplayComments(targetPostId);
                    window.scrollTo(0, document.body.scrollHeight);
                }
            } catch (e) { console.error(e); }
        };

        // === دوال الميديا (فيديو/صوت) ===
        function toggleVideo(video) {
            const overlay = video.parentElement.querySelector('.video-play-overlay');
            if (video.paused) {
                if (activeVideo && activeVideo !== video) {
                    activeVideo.pause();
                    activeVideo.parentElement.querySelector('.video-play-overlay').classList.remove('hidden');
                }
                video.play();
                overlay.classList.add('hidden');
                activeVideo = video;
            } else {
                video.pause();
                overlay.classList.remove('hidden');
            }
        }

        function initializeWaveSurfer(id, url) {
            const container = document.getElementById(`waveform-${id}`);
            if(!container) return;
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4A4A4A',
                progressColor: '#fff',
                height: 60,
                barWidth: 3,
                cursorWidth: 0,
                barGap: 2
            });
            ws.load(url);
            container.ws = ws;
        }

        function toggleAudio(id) {
            const container = document.getElementById(`waveform-${id}`);
            const btn = document.getElementById(`audio-btn-${id}`);
            if(container && container.ws) {
                container.ws.playPause();
                container.ws.on('play', () => btn.innerHTML = '<i class="fas fa-pause"></i>');
                container.ws.on('pause', () => btn.innerHTML = '<i class="fas fa-play"></i>');
            }
        }

        function openMediaViewer(url) {
            document.getElementById('mediaViewerContent').innerHTML = `<img src="${url}" class="max-w-full max-h-[85vh] rounded-lg">`;
            document.getElementById('mediaViewerModal').classList.remove('hidden');
        }
        function closeMediaViewer() {
            document.getElementById('mediaViewerModal').classList.add('hidden');
        }

        // إعجاب بالمنشور الرئيسي
        async function handlePostLike(postId, btn) {
            try {
                const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    const icon = btn.querySelector('i');
                    const span = btn.querySelector('span');
                    span.innerText = data.newLikes;
                    if (data.action === 'liked') {
                        icon.className = 'fas fa-heart text-lg';
                        btn.className = 'flex items-center gap-2 text-red-500 hover:text-red-500 transition';
                    } else {
                        icon.className = 'far fa-heart text-lg';
                        btn.className = 'flex items-center gap-2 text-gray-400 hover:text-red-500 transition';
                    }
                }
            } catch(e) {}
        }

    </script>
</body>
</html>
