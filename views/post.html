<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المنشور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #e4e6eb; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 20px; }
        
        .glass-navbar { background-color: rgba(30,30,30,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .glass-post-card { background-color: rgba(20,20,20,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        
        /* Audio Player */
        .audio-play-wrapper { background: #000; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 10px; display: flex; align-items: center; gap: 12px; }
        .audio-play-button { width: 44px; height: 44px; border-radius: 10px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; }
        .audio-play-button:active { transform: scale(0.95); }
        .waveform-post { height: 60px; flex-grow: 1; }

        /* Comment Modal (Bottom Sheet) */
        .glass-modal-bg { background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .glass-comment-modal-content { background: #18191a; border-radius: 20px 20px 0 0; border-top: 1px solid rgba(255,255,255,0.15); height: 75vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-comment-modal-content.open { transform: translateY(0); }
        .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 12px auto; }
        
        /* Verify Badge */
        .verified-badge-img { width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; }

        /* Comments */
        .comment-item { padding: 8px; border-radius: 12px; background: #131313; border: 1px solid #222; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass-navbar p-3 flex items-center gap-4">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 text-white">
            <i class="fas fa-arrow-right text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-white">المنشور</h1>
    </header>

    <main id="postContainer" class="max-w-xl mx-auto p-4 mt-2">
        <div class="text-center py-20 text-gray-500">
            <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
            <p>جاري تحميل المنشور...</p>
        </div>
    </main>

    <div id="commentModal" class="hidden fixed inset-0 z-50 flex items-end justify-center glass-modal-bg" onclick="closeCommentModal()">
        <div id="commentModalContent" class="glass-comment-modal-content w-full max-w-xl" onclick="event.stopPropagation()">
            <div class="w-full flex justify-center" onclick="closeCommentModal()">
                <div class="modal-handle"></div>
            </div>
            <div class="flex justify-between items-center px-4 pb-2 border-b border-gray-800">
                <h3 class="text-lg font-bold text-white">التعليقات</h3>
                <button onclick="closeCommentModal()" class="text-gray-400 p-2"><i class="fas fa-times"></i></button>
            </div>
            <div id="commentsList" class="flex-grow overflow-y-auto p-4 custom-scrollbar"></div>
            <div class="p-3 border-t border-gray-800 bg-[#18191a]">
                <div class="flex items-center gap-2 bg-[#242526] p-2 rounded-3xl border border-gray-700">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقاً..." class="flex-grow bg-transparent text-white text-sm px-2 focus:outline-none">
                    <button id="postCommentBtn" class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white"><i class="fas fa-arrow-up text-sm"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Logic to Fetch and Render Post ---
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const postContainer = document.getElementById('postContainer');
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        
        let currentPostId = postId;
        let activeWaveSurfer = null;
        let activeVideo = null;

        if (!postId) {
            postContainer.innerHTML = '<div class="text-center py-10 text-red-400">رابط المنشور غير صالح.</div>';
        } else {
            fetchPost();
        }

        async function fetchPost() {
            try {
                // Try fetching specific post (Assuming you added the route in server.js)
                const res = await fetch(`/api/posts/one/${postId}`);
                const data = await res.json();

                if (res.ok && data.ok && data.post) {
                    renderPost(data.post);
                } else {
                    postContainer.innerHTML = '<div class="text-center py-10 text-gray-500">لم يتم العثور على المنشور أو تم حذفه.</div>';
                }
            } catch (error) {
                console.error(error);
                postContainer.innerHTML = '<div class="text-center py-10 text-red-400">خطأ في الاتصال.</div>';
            }
        }

        function renderPost(post) {
            let mediaHtml = '';
            
            // Generate Media HTML
            if (post.media) {
                if (post.media.type === 'image') {
                    mediaHtml = `<div class="mt-3"><img src="${post.media.url}" class="w-full rounded-lg object-contain bg-black max-h-[500px]"></div>`;
                } else if (post.media.type === 'video') {
                    mediaHtml = `
                        <div class="mt-3 relative w-full aspect-video bg-black rounded-lg overflow-hidden group">
                            <video id="video-${post.postId}" src="${post.media.url}" class="w-full h-full object-contain" onclick="toggleVideo('${post.postId}')"></video>
                            <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black/30 pointer-events-none">
                                <i class="fas fa-play text-white text-5xl opacity-80"></i>
                            </div>
                        </div>`;
                } else if (post.media.type === 'audio') {
                    mediaHtml = `
                        <div class="mt-3 audio-play-wrapper">
                            <button id="audio-btn-${post.postId}" class="audio-play-button" onclick="toggleAudio('${post.postId}')">
                                <i class="fas fa-play"></i>
                            </button>
                            <div id="waveform-${post.postId}" class="waveform-post" data-url="${post.media.url}"></div>
                        </div>`;
                }
            }

            const verifiedBadge = post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
            const likeClass = post.is_liked ? 'text-red-500 fas' : 'text-gray-400 far';
            const likeBtnColor = post.is_liked ? 'text-red-500' : 'text-gray-400';

            const html = `
                <div class="glass-post-card p-4 shadow-xl">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center" onclick="window.location.href='/profile?userId=${post.userId}'">
                            <img src="${post.user.profile_picture_url}" class="w-12 h-12 rounded-full border border-gray-600 object-cover ml-3 cursor-pointer">
                            <div>
                                <div class="text-white font-bold cursor-pointer hover:text-blue-400 text-lg">${post.user.username} ${verifiedBadge}</div>
                                <div class="text-gray-400 text-xs">${new Date(post.timestamp).toLocaleString('ar-EG')}</div>
                            </div>
                        </div>
                        <button class="text-gray-400 p-2" onclick="openOptions('${post.postId}')"><i class="fas fa-ellipsis-h"></i></button>
                    </div>

                    <p class="text-gray-100 text-lg whitespace-pre-wrap leading-relaxed mb-2" dir="auto">${post.content}</p>

                    ${mediaHtml}

                    <div class="flex justify-between items-center text-gray-400 text-sm mt-4 pb-2 border-b border-gray-700">
                        <span id="likes-count-${post.postId}"><i class="fas fa-heart ml-1"></i> ${post.likes}</span>
                        <span class="cursor-pointer hover:text-white" onclick="openComments('${post.postId}')"><i class="fas fa-comment ml-1"></i> ${post.commentsCount} تعليق</span>
                    </div>

                    <div class="flex justify-around mt-3 pt-2">
                        <button class="flex items-center gap-2 ${likeBtnColor} hover:text-red-500 transition w-full justify-center py-2" onclick="handleLike('${post.postId}', this)">
                            <i class="${likeClass} fa-heart text-xl"></i>
                            <span class="font-bold">إعجاب</span>
                        </button>
                        <button class="flex items-center gap-2 text-gray-400 hover:text-blue-400 transition w-full justify-center py-2" onclick="openComments('${post.postId}')">
                            <i class="far fa-comment-dots text-xl"></i>
                            <span class="font-bold">تعليق</span>
                        </button>
                    </div>
                </div>
            `;

            postContainer.innerHTML = html;

            // Init WaveSurfer if audio
            if (post.media && post.media.type === 'audio') {
                setTimeout(() => initWaveSurfer(post.postId, post.media.url), 100);
            }
        }

        // --- Interaction Functions ---

        async function handleLike(pid, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`/api/posts/${pid}/like`, { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    const icon = btn.querySelector('i');
                    const countSpan = document.getElementById(`likes-count-${pid}`);
                    
                    if (data.action === 'liked') {
                        icon.classList.remove('far', 'text-gray-400');
                        icon.classList.add('fas', 'text-red-500');
                        btn.classList.add('text-red-500');
                        btn.classList.remove('text-gray-400');
                    } else {
                        icon.classList.remove('fas', 'text-red-500');
                        icon.classList.add('far', 'text-gray-400');
                        btn.classList.remove('text-red-500');
                        btn.classList.add('text-gray-400');
                    }
                    if(countSpan) countSpan.innerHTML = `<i class="fas fa-heart ml-1"></i> ${data.newLikes}`;
                }
            } catch(e) { console.error(e); }
            btn.disabled = false;
        }

        // --- Audio Logic ---
        function initWaveSurfer(id, url) {
            const container = document.getElementById(`waveform-${id}`);
            if(!container) return;
            const ws = WaveSurfer.create({
                container: container,
                waveColor: '#4A4A4A',
                progressColor: '#ffffff',
                barWidth: 3,
                barRadius: 3,
                cursorWidth: 0,
                height: 60,
                responsive: true
            });
            ws.load(url);
            container.wsInstance = ws;
            
            ws.on('finish', () => {
                const btn = document.getElementById(`audio-btn-${id}`);
                btn.innerHTML = '<i class="fas fa-play"></i>';
                ws.stop();
            });
        }

        function toggleAudio(id) {
            const container = document.getElementById(`waveform-${id}`);
            const btn = document.getElementById(`audio-btn-${id}`);
            if(!container || !container.wsInstance) return;
            const ws = container.wsInstance;

            // Pause others
            if(activeVideo) { activeVideo.pause(); activeVideo = null; }
            if(activeWaveSurfer && activeWaveSurfer !== ws) {
                activeWaveSurfer.pause();
                const oldBtn = activeWaveSurfer.container.parentElement.querySelector('button');
                if(oldBtn) oldBtn.innerHTML = '<i class="fas fa-play"></i>';
            }

            if(ws.isPlaying()) {
                ws.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                ws.play();
                btn.innerHTML = '<i class="fas fa-pause"></i>';
                activeWaveSurfer = ws;
            }
        }

        // --- Video Logic ---
        function toggleVideo(id) {
            const video = document.getElementById(`video-${id}`);
            const overlay = document.getElementById(`play-overlay-${id}`);
            
            if(activeWaveSurfer) { activeWaveSurfer.pause(); activeWaveSurfer = null; }
            if(activeVideo && activeVideo !== video) {
                activeVideo.pause();
                const oldOverlay = activeVideo.parentElement.querySelector('div[id^="play-overlay"]');
                if(oldOverlay) oldOverlay.classList.remove('hidden');
            }

            if(video.paused) {
                video.play();
                overlay.classList.add('hidden');
                activeVideo = video;
            } else {
                video.pause();
                overlay.classList.remove('hidden');
            }
        }

        // --- Comment Modal Logic ---
        function openComments(pid) {
            currentPostId = pid;
            document.getElementById('commentModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('commentModalContent').classList.add('open'), 10);
            fetchComments(pid);
        }

        function closeCommentModal() {
            document.getElementById('commentModalContent').classList.remove('open');
            setTimeout(() => document.getElementById('commentModal').classList.add('hidden'), 300);
        }

        async function fetchComments(pid) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<div class="text-center p-4"><i class="fas fa-spinner fa-spin"></i></div>';
            
            const res = await fetch(`/api/posts/${pid}/comments`);
            const data = await res.json();
            
            if(data.ok) {
                if(data.comments.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 mt-10">لا توجد تعليقات. كن الأول!</div>';
                    return;
                }
                list.innerHTML = data.comments.map(c => `
                    <div class="comment-item">
                        <div class="flex gap-2">
                            <img src="${c.user.profile_picture_url}" class="w-8 h-8 rounded-full">
                            <div>
                                <div class="text-sm font-bold text-white">${c.user.username}</div>
                                <div class="text-gray-300 text-sm">${c.content}</div>
                                <div class="text-xs text-gray-500 mt-1">${new Date(c.timestamp).toLocaleDateString()}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Post Comment
        document.getElementById('postCommentBtn').onclick = async () => {
            const input = document.getElementById('newCommentInput');
            const content = input.value.trim();
            if(!content) return;

            input.disabled = true;
            await fetch(`/api/posts/${currentPostId}/comment`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content})
            });
            input.value = '';
            input.disabled = false;
            fetchComments(currentPostId); // Refresh
        };

        // --- Options / Delete (Simple Mock) ---
        function openOptions(pid) {
             if(confirm("هل تريد حذف هذا المنشور؟")) {
                 fetch(`/api/posts/${pid}`, { method: 'DELETE' })
                 .then(r => r.json())
                 .then(d => {
                     if(d.ok) {
                         alert('تم الحذف');
                         window.location.href = '/chat_list';
                     } else {
                         alert('فشل الحذف (قد لا تملك الصلاحية)');
                     }
                 });
             }
        }

    </script>
</body>
</html>
