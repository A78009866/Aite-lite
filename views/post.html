<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المنشور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #e4e6eb; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 80px; }
        
        .glass-navbar { background-color: rgba(30,30,30,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .glass-post-card { background-color: rgba(20,20,20,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 20px; }
        
        /* Audio Player */
        .audio-play-wrapper { background: #000; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 10px; display: flex; align-items: center; gap: 12px; }
        .audio-play-button { width: 44px; height: 44px; border-radius: 10px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; border:none;}
        .waveform-post { height: 60px; flex-grow: 1; }

        /* Verified Badge */
        .verified-badge-img { width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; display: inline-block; }

        /* Comments Styling */
        .comment-section { background: #0b0b0c; border-top: 1px solid #222; padding: 16px; border-radius: 20px 20px 0 0; min-height: 300px; }
        .comment-item { padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .reply-item { margin-right: 36px; margin-top: 8px; background: rgba(255,255,255,0.015); padding: 8px; border-radius: 8px; border-right: 2px solid #333; }
        .comment-actions button { font-size: 11px; margin-left: 10px; color: #888; transition: color 0.2s; }
        .comment-actions button:hover { color: #fff; }
        .comment-actions .active-like { color: #ef4444; }
        
        /* Input Area */
        .comment-input-area { position: fixed; bottom: 0; left: 0; right: 0; background: #18191a; padding: 10px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; z-index: 50; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass-navbar p-3 flex items-center gap-4">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 text-white">
            <i class="fas fa-arrow-right text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-white">المنشور</h1>
    </header>

    <main id="postContainer" class="max-w-xl mx-auto p-4 mt-2">
        <div class="text-center py-20 text-gray-500">
            <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
            <p>جاري تحميل المنشور...</p>
        </div>
    </main>

    <section class="max-w-xl mx-auto pb-20">
        <div class="comment-section">
            <h3 class="text-white font-bold mb-4 border-b border-gray-800 pb-2">التعليقات</h3>
            <div id="commentsList" class="space-y-4">
                </div>
        </div>
    </section>

    <div class="comment-input-area max-w-xl mx-auto md:relative md:rounded-b-xl md:border-t-0">
        <img id="myAvatar" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full border border-gray-600">
        <input type="text" id="mainCommentInput" placeholder="أضف تعليقاً..." class="flex-grow bg-[#242526] text-white text-sm px-4 py-2 rounded-full focus:outline-none border border-gray-700">
        <button id="submitCommentBtn" class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white hover:bg-blue-500 transition">
            <i class="fas fa-arrow-up text-sm"></i>
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const postContainer = document.getElementById('postContainer');
        const commentsList = document.getElementById('commentsList');
        const VERIFIED_IMG_URL = "https://res.cloudinary.com/duixjs8az/image/upload/v1766696799/post_media/1766696799284-verified.png";
        
        let currentUserId = null; // Set via profile fetch
        let activeWaveSurfer = null;

        // Fetch user info first
        fetch('/api/profile').then(r=>r.json()).then(d=> { 
            if(d.ok) { 
                currentUserId = d.id; 
                document.getElementById('myAvatar').src = d.profile_picture_url || 'https://via.placeholder.com/40';
            }
        });

        if (postId) {
            loadPostAndComments();
        } else {
            postContainer.innerHTML = '<p class="text-center text-red-500 mt-10">رابط غير صالح</p>';
        }

        async function loadPostAndComments() {
            try {
                // 1. Fetch Post (Assuming you have a single post endpoint, or we filter from list)
                // Note: Standard server usually needs /api/posts/one/:id. I'll use the generic search as fallback or list.
                // For this example, I will assume /api/posts/one/:id exists as per previous context or we fetch all.
                // Let's try to fetch specifically:
                const res = await fetch(`/api/posts/one/${postId}`); 
                const data = await res.json();
                
                if (data.ok && data.post) {
                    renderPost(data.post);
                    fetchComments();
                } else {
                    postContainer.innerHTML = '<p class="text-center text-gray-400 mt-10">المنشور غير موجود أو تم حذفه.</p>';
                }
            } catch (e) {
                console.error(e);
                postContainer.innerHTML = '<p class="text-center text-red-500 mt-10">خطأ في الاتصال</p>';
            }
        }

        function renderPost(post) {
            let mediaHtml = '';
            if (post.media) {
                if (post.media.type === 'image') mediaHtml = `<img src="${post.media.url}" class="w-full rounded-lg mt-3 border border-gray-800">`;
                else if (post.media.type === 'video') mediaHtml = `<video src="${post.media.url}" controls class="w-full rounded-lg mt-3 bg-black max-h-96"></video>`;
                else if (post.media.type === 'audio') {
                    mediaHtml = `
                        <div class="mt-3 audio-play-wrapper">
                            <button id="btn-${post.postId}" class="audio-play-button" onclick="toggleAudio('${post.postId}', '${post.media.url}')">
                                <i class="fas fa-play"></i>
                            </button>
                            <div id="wave-${post.postId}" class="waveform-post"></div>
                        </div>`;
                }
            }

            const verifiedBadge = post.user.is_verified ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : '';
            const likeClass = post.is_liked ? 'fas text-red-500' : 'far text-gray-400';
            
            postContainer.innerHTML = `
                <div class="glass-post-card p-4">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3 mb-3 cursor-pointer" onclick="window.location.href='/profile?userId=${post.userId}'">
                            <img src="${post.user.profile_picture_url}" class="w-12 h-12 rounded-full border border-gray-600 object-cover">
                            <div>
                                <div class="text-white font-bold text-base flex items-center">${post.user.username} ${verifiedBadge}</div>
                                <div class="text-gray-400 text-xs">${new Date(post.timestamp).toLocaleString('ar-EG')}</div>
                            </div>
                        </div>
                        ${(currentUserId === post.userId) ? `<button onclick="deletePost('${post.postId}')" class="text-red-400 hover:bg-red-500/10 p-2 rounded-full"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                    <p class="text-gray-200 whitespace-pre-wrap leading-relaxed text-base">${post.content}</p>
                    ${mediaHtml}
                    <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-700">
                        <button class="flex items-center gap-2 text-gray-300 hover:text-red-500 transition w-full justify-center" onclick="likePost(this)">
                            <i class="${likeClass} fa-heart text-xl"></i> <span>إعجاب</span>
                        </button>
                        <div class="text-gray-500 text-sm">
                            <span id="likesCount">${post.likes}</span> إعجاب • 
                            <span id="commentsCount">${post.commentsCount}</span> تعليق
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Comments Logic ---

        async function fetchComments() {
            const res = await fetch(`/api/posts/${postId}/comments`);
            const data = await res.json();
            if (data.ok) {
                commentsList.innerHTML = data.comments.length ? data.comments.map(c => renderComment(c)).join('') : '<p class="text-center text-gray-600 py-4">لا توجد تعليقات بعد.</p>';
            }
        }

        function renderComment(c) {
            const badge = (c.user && c.user.is_verified) ? `<img src="${VERIFIED_IMG_URL}" class="verified-badge-img">` : ''; // يحتاج التحقق من الباك اند أو جلب البروفايل، هنا سنعتمد على البيانات القادمة
            // ملاحظة: endpoint التعليقات في server.js قد لا يرجع is_verified للمستخدم مباشرة، لذا سنستخدم كود تحقق بسيط (أو يمكن تعديل السيرفر). 
            // سأضيف منطق تحقق في الواجهة إذا كان متاحاً في الكائن.
            
            // تحقق من الاعجاب بالتعليق
            const isLiked = c.is_liked ? 'active-like' : '';
            const likeIcon = c.is_liked ? 'fas' : 'far';

            // الردود
            let repliesHtml = '';
            if (c.recentReplies && c.recentReplies.length > 0) {
                repliesHtml = c.recentReplies.map(r => `
                    <div class="reply-item flex gap-2">
                        <img src="${r.profile_picture_url || 'https://via.placeholder.com/30'}" class="w-6 h-6 rounded-full mt-1">
                        <div>
                            <div class="text-xs font-bold text-gray-300">${r.username}</div>
                            <div class="text-xs text-gray-400">${r.content}</div>
                        </div>
                    </div>
                `).join('');
            }

            // لضمان ظهور الشارة سنحتاج استدعاء بروفايل أو الاعتماد على أن السيرفر يرسلها. سأفترض أنها موجودة في c.user.is_verified أو يتم حقنها.
            // لغرض العرض الصحيح:
            let userBadge = '';
            // هنا يمكنك إضافة منطق تحقق إضافي، حالياً سأعرضها إذا كانت true في البيانات
            
            return `
                <div class="comment-item" id="comment-${c.commentId}">
                    <div class="flex gap-3">
                        <img src="${c.user.profile_picture_url}" class="w-9 h-9 rounded-full object-cover flex-shrink-0" onclick="window.location.href='/profile?userId=${c.user.userId}'">
                        <div class="flex-grow">
                            <div class="flex justify-between items-start">
                                <div class="text-sm font-bold text-white mb-0.5">
                                    ${c.user.username} 
                                    <span class="badge-placeholder" data-uid="${c.user.userId}"></span>
                                </div>
                                <div class="text-[10px] text-gray-500">${new Date(c.timestamp).toLocaleDateString()}</div>
                            </div>
                            <div class="text-gray-300 text-sm leading-snug">${c.content}</div>
                            
                            <div class="comment-actions flex items-center gap-4 mt-2">
                                <button class="${isLiked} flex items-center gap-1" onclick="toggleCommentLike('${c.commentId}', this)">
                                    <i class="${likeIcon} fa-heart"></i> <span class="count">${c.likes || 0}</span>
                                </button>
                                <button onclick="showReplyInput('${c.commentId}')">
                                    <i class="fas fa-reply"></i> رد
                                </button>
                            </div>

                            <div id="reply-box-${c.commentId}" class="hidden mt-2 flex gap-2">
                                <input type="text" id="reply-input-${c.commentId}" placeholder="اكتب رداً..." class="bg-[#222] text-xs text-white rounded p-2 flex-grow border border-gray-700 focus:outline-none">
                                <button onclick="submitReply('${c.commentId}')" class="text-blue-400 text-xs px-2">إرسال</button>
                            </div>

                            <div class="mt-2">
                                ${repliesHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // تحديث الشارات بشكل منفصل (لضمان الدقة)
        async function updateBadges() {
           // هذا الجزء يعتمد على API الخاص بك، ولكن للعرض سأترك مكانها فارغاً إلا إذا توفرت البيانات
           // يمكن تفعيلها ب fetch لبيانات المستخدمين
        }

        // --- Actions ---

        // Like Post
        async function likePost(btn) {
            btn.disabled = true;
            const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST' });
            const data = await res.json();
            if (data.ok) {
                const icon = btn.querySelector('i');
                if (data.action === 'liked') {
                    icon.classList.replace('far', 'fas');
                    icon.classList.add('text-red-500');
                } else {
                    icon.classList.replace('fas', 'far');
                    icon.classList.remove('text-red-500');
                }
                document.getElementById('likesCount').textContent = data.newLikes;
            }
            btn.disabled = false;
        }

        // Like Comment
        async function toggleCommentLike(commentId, btn) {
            const countSpan = btn.querySelector('.count');
            const icon = btn.querySelector('i');
            
            // UI Optimistic update
            const isLiked = btn.classList.contains('active-like');
            let count = parseInt(countSpan.textContent) || 0;
            
            if (isLiked) {
                btn.classList.remove('active-like');
                icon.classList.replace('fas', 'far');
                countSpan.textContent = Math.max(0, count - 1);
            } else {
                btn.classList.add('active-like');
                icon.classList.replace('far', 'fas');
                countSpan.textContent = count + 1;
            }

            try {
                await fetch(`/api/posts/${postId}/comments/${commentId}/like`, { method: 'POST' });
            } catch (e) { console.error(e); }
        }

        // Reply System
        function showReplyInput(commentId) {
            const box = document.getElementById(`reply-box-${commentId}`);
            box.classList.toggle('hidden');
        }

        async function submitReply(commentId) {
            const input = document.getElementById(`reply-input-${commentId}`);
            const content = input.value.trim();
            if (!content) return;

            const res = await fetch(`/api/posts/${postId}/comments/${commentId}/reply`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content })
            });
            
            const data = await res.json();
            if (data.ok) {
                fetchComments(); // Reload to show new reply
            }
        }

        // Main Comment Submit
        document.getElementById('submitCommentBtn').onclick = async () => {
            const input = document.getElementById('mainCommentInput');
            const content = input.value.trim();
            if(!content) return;
            
            const res = await fetch(`/api/posts/${postId}/comment`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content })
            });
            const data = await res.json();
            if (data.ok) {
                input.value = '';
                document.getElementById('commentsCount').textContent = data.newComments || parseInt(document.getElementById('commentsCount').textContent) + 1;
                fetchComments();
            }
        };

        // Delete Post
        async function deletePost(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنشور؟')) {
                const res = await fetch(`/api/posts/${id}`, { method: 'DELETE' });
                if(res.ok) window.location.href = '/chat_list';
            }
        }

        // Audio Handler
        function toggleAudio(id, url) {
            const container = document.getElementById(`wave-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            
            if (!container.innerHTML) {
                const ws = WaveSurfer.create({
                    container: container,
                    waveColor: '#555',
                    progressColor: '#fff',
                    height: 50,
                    barWidth: 2,
                    cursorWidth: 0,
                    barGap: 1
                });
                ws.load(url);
                ws.on('ready', () => {
                    ws.play();
                    btn.innerHTML = '<i class="fas fa-pause"></i>';
                    activeWaveSurfer = ws;
                });
                ws.on('finish', () => btn.innerHTML = '<i class="fas fa-play"></i>');
                container.wsInstance = ws;
            } else {
                const ws = container.wsInstance;
                if (ws.isPlaying()) {
                    ws.pause();
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                } else {
                    if (activeWaveSurfer && activeWaveSurfer !== ws) activeWaveSurfer.pause();
                    ws.play();
                    btn.innerHTML = '<i class="fas fa-pause"></i>';
                    activeWaveSurfer = ws;
                }
            }
        }
    </script>
</body>
</html>
