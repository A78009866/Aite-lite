<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — Trimer</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/46/1000084215-removebg-preview.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(57, 130, 247, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(120, 50, 220, 0.1) 0%, transparent 20%);
            color: #e4e6eb;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Inputs */
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #3982f7;
            box-shadow: 0 0 15px rgba(57, 130, 247, 0.2);
            outline: none;
        }

        .logo-img {
            height: 70px;
            width: 70px;
            object-fit: cover;
            border-radius: 14px;
            margin-left: 15px;
            box-shadow: 0 0 20px rgba(57, 130, 247, 0.3);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            transition: color 0.3s;
        }
        .toggle-password:hover { color: #3982f7; }

        /* Button Glow & States */
        .glow-btn {
            background: linear-gradient(135deg, #3982f7 0%, #2a61b8 100%);
            box-shadow: 0 4px 15px rgba(57, 130, 247, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .glow-btn:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(57, 130, 247, 0.6);
            transform: translateY(-2px);
        }
        .glow-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="flex flex-col justify-center items-center min-h-screen p-5">

    <div class="text-center mb-8 z-10">
        <a class="text-5xl font-bold text-white hover:text-gray-200 no-underline flex items-center tracking-wide justify-center" href="/">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" class="logo-img" alt="شعار Trimer">
            Trimer
        </a>
    </div>

    <div class="glass-card p-10 rounded-2xl w-full max-w-sm relative z-10">
        <h2 class="text-center mb-8 text-3xl font-bold text-white tracking-wide">تسجيل الدخول</h2>
        
        <form id="loginForm" method="post" action="/login">
            <div class="mb-6 group">
                <label for="id_username" class="block mb-2 text-sm font-medium text-gray-300 group-hover:text-[#3982f7] transition-colors">اسم المستخدم</label>
                <input type="text" name="username" id="id_username" class="glass-input w-full p-4 rounded-xl" required autofocus placeholder="ادخل اسم المستخدم">
            </div>

            <div class="mb-8 group">
                <label for="id_password" class="block mb-2 text-sm font-medium text-gray-300 group-hover:text-[#3982f7] transition-colors">كلمة المرور</label>
                <div class="relative">
                    <input type="password" name="password" id="id_password" class="glass-input w-full p-4 pr-4 rounded-xl" required placeholder="ادخل كلمة المرور">
                    <i class="fas fa-eye toggle-password text-gray-500" data-target="id_password"></i>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="glow-btn w-full p-4 rounded-xl text-white font-bold text-lg cursor-pointer flex justify-center items-center gap-2">
                <span id="btnText">دخول</span>
                <i id="btnSpinner" class="fas fa-spinner fa-spin hidden"></i>
            </button>
        </form>

        <div class="text-center mt-8 text-sm text-gray-400">
            ليس لديك حساب؟ <a href="/register" class="text-[#3982f7] font-semibold hover:text-white transition-colors hover:underline">إنشاء حساب جديد</a>
        </div>
        
        <div class="text-center mt-4 text-sm">
            <a href="/accounts" class="text-gray-500 hover:text-gray-300 transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-users"></i>
                الحسابات المحفوظة
            </a>
        </div>
    </div>

    <script>
        // 1. إظهار/إخفاء كلمة المرور
        document.querySelectorAll('.toggle-password').forEach(item => {
            item.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const passwordField = document.getElementById(targetId);
                if (passwordField.type === "password") {
                    passwordField.type = "text";
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    passwordField.type = "password";
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });

        // 2. التعامل مع زر الإرسال والمؤشر
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // تعطيل الزر وإظهار المؤشر
            btn.disabled = true;
            btnText.textContent = "جاري الدخول...";
            btnSpinner.classList.remove('hidden');
        });

        // 3. قراءة اسم المستخدم من الرابط (للدعم مع صفحة accounts.html)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const usernameParam = urlParams.get('username');
            
            if (usernameParam) {
                const usernameInput = document.getElementById('id_username');
                usernameInput.value = usernameParam;
                // التركيز مباشرة على حقل كلمة المرور لتجربة أسرع
                document.getElementById('id_password').focus();
            }
        });
    </script>
</body>
</html>
