<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — Aite</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/46/1000084215-removebg-preview.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(57, 130, 247, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(120, 50, 220, 0.1) 0%, transparent 20%);
            color: #e4e6eb;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #3982f7;
            box-shadow: 0 0 15px rgba(57, 130, 247, 0.2);
            outline: none;
        }
        .glow-btn {
            background: linear-gradient(135deg, #3982f7 0%, #2a61b8 100%);
            box-shadow: 0 4px 15px rgba(57, 130, 247, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="flex flex-col justify-center items-center p-5">

    <div class="text-center mb-8">
        <a class="text-5xl font-bold text-white no-underline flex items-center justify-center gap-4" href="/">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" class="h-[70px] w-[70px] rounded-xl object-cover" alt="Aite">
            Aite
        </a>
    </div>

    <div class="glass-card p-10 rounded-2xl w-full max-w-sm">
        <h2 class="text-center mb-8 text-3xl font-bold text-white">تسجيل الدخول</h2>
        
        <form id="loginForm" method="post" action="/login">
            <div class="mb-6">
                <label class="block mb-2 text-sm font-medium text-gray-300">اسم المستخدم</label>
                <input type="text" name="username" id="id_username" class="glass-input w-full p-4 rounded-xl text-left" dir="ltr" required placeholder="username">
            </div>

            <div class="mb-8">
                <label class="block mb-2 text-sm font-medium text-gray-300">كلمة المرور</label>
                <input type="password" name="password" id="id_password" class="glass-input w-full p-4 rounded-xl text-left" dir="ltr" required placeholder="********">
            </div>

            <button type="submit" id="submitBtn" class="glow-btn w-full p-4 rounded-xl text-white font-bold text-lg flex justify-center items-center gap-2">
                <span id="btnText">دخول</span>
                <i id="btnSpinner" class="fas fa-spinner fa-spin hidden"></i>
            </button>
        </form>

        <div class="text-center mt-8 text-sm text-gray-400">
            ليس لديك حساب؟ <a href="/register" class="text-[#3982f7] font-semibold">إنشاء حساب</a>
        </div>
    </div>

    <script>
        // المفتاح الموحد لجميع الصفحات
        const STORAGE_KEY = 'aite_accounts_secure_v2';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('id_username').value.trim();
            const password = document.getElementById('id_password').value;
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            if(username && password) {
                // إظهار حالة التحميل
                btn.disabled = true;
                btnText.textContent = "جاري التحقق...";
                spinner.classList.remove('hidden');

                try {
                    // 1. جلب البيانات العامة (الاسم والصورة) من السيرفر
                    // ملاحظة: تأكد من إضافة الـ route في server.js كما ذكرت لك سابقاً
                    const response = await fetch(`/api/get-public-info?username=${encodeURIComponent(username)}`);
                    const data = await response.json();
                    
                    let fullName = username; 
                    let profilePic = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';

                    if (data.found) {
                        fullName = data.full_name;
                        profilePic = data.profile_picture_url;
                    }

                    // 2. تشفير كلمة المرور للحفظ المحلي (Base64)
                    const encryptedPass = btoa(password);

                    // 3. تحديث قائمة الحسابات في Local Storage
                    let accounts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    
                    // إزالة أي نسخة قديمة من نفس الحساب
                    accounts = accounts.filter(a => a.username !== username);
                    
                    // إضافة البيانات الجديدة في البداية
                    accounts.unshift({
                        username: username,
                        full_name: fullName,
                        profile_picture_url: profilePic,
                        auth_token: encryptedPass
                    });

                    // حفظ آخر 8 حسابات فقط لضمان الأداء
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts.slice(0, 8)));

                } catch (error) {
                    console.error("Error saving account details:", error);
                }

                // 4. إرسال النموذج فعلياً للسيرفر لإنشاء الجلسة (Session)
                this.submit();
            }
        });

        // لتعبئة الحساب تلقائياً إذا تم اختياره من صفحة الحسابات
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('username');
            if (user) {
                document.getElementById('id_username').value = user;
                document.getElementById('id_password').focus();
            }
        });
    </script>
</body>
</html>
