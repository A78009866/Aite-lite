<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aite">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <title>Aite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(57, 130, 247, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(120, 50, 220, 0.12) 0%, transparent 40%);
            color: #e4e6eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
        }

        .splash-logo {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(57, 130, 247, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        .app-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.8rem;
            font-weight: 800;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #3982f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 15px rgba(57, 130, 247, 0.3));
        }

        /* تنسيق عبارة from salem ahmed بخط تجوال */
        .typing-container {
            font-family: 'Tajawal', sans-serif;
            font-weight: 300; /* وزن خفيف ليعطي مظهر عصري */
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: lowercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .typing-effect {
            position: relative;
            background: linear-gradient(to right, #94a3b8, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* المؤشر النحيف */
        .typing-effect::after {
            content: "";
            display: inline-block;
            width: 1.5px;
            height: 16px;
            background-color: #3982f7;
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    
    /* ===== DESKTOP RESPONSIVE ===== */
    @media (min-width: 768px) {
        body {
            background-size: cover;
        }
        .glass-card {
            max-width: 480px;
        }
    }

    @media (min-width: 1024px) {
        .glass-card {
            max-width: 520px;
            padding: 2.5rem 3rem !important;
        }
    }


    /* ===== SPLASH DESKTOP ADJUSTMENTS ===== */
    @media (min-width: 768px) {
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    }


/* ========== SKELETON / SHIMMER LOADING ========== */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skeleton-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow-y: auto;
  overflow-x: hidden;
  transition: opacity 0.35s ease;
}
.skeleton-loader.hidden {
  opacity: 0;
  pointer-events: none;
}
.skeleton-bone {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: 8px;
}
html[data-theme="light"] .skeleton-bone {
  background: linear-gradient(90deg, rgba(0,0,0,0.06) 25%, rgba(0,0,0,0.10) 50%, rgba(0,0,0,0.06) 75%);
  background-size: 800px 100%;
}
.skeleton-loader .sk-bg {
  background: #000;
}
html[data-theme="light"] .skeleton-loader .sk-bg {
  background: #f0f2f5;
}
.skeleton-circle {
  border-radius: 50%;
}

</style>

<!-- Page Transition Loading Bar -->
<style>
#aite-page-loader {
  position: fixed;
  top: 0;
  left: 0;
  width: 0;
  height: 3px;
  background: linear-gradient(90deg, #3b82f6, #60a5fa, #2563eb, #818cf8, #3b82f6);
  background-size: 300% 100%;
  z-index: 999999;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 10px rgba(59,130,246,0.7), 0 0 5px rgba(59,130,246,0.5);
  animation: aite-loader-gradient 1.5s linear infinite;
  pointer-events: none;
  opacity: 0;
}
#aite-page-loader.active {
  opacity: 1;
}
@keyframes aite-loader-gradient {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
</style>
</head>
<body>

<div id="skeletonLoader" class="skeleton-loader">
  <div class="sk-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div class="skeleton-bone skeleton-circle" style="width:100px;height:100px;"></div>
      <div class="skeleton-bone" style="width:120px;height:24px;border-radius:6px;"></div>
    </div>
  </div>
</div>


    <img src="/icon-192.png" alt="Aite Logo" class="splash-logo">
    
    <h1 class="app-name">Aite</h1>

    <div class="typing-container">
        <span class="typing-effect"></span>
    </div>

    <script>
        const text = "from salem ahmed";
        let index = 0;
        const speed = 100;

        function typeWriter() {
            const element = document.querySelector(".typing-effect");
            if (index < text.length) {
                element.textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    window.location.href = "/check-status";
                }, 2000);
            }
        }

        window.onload = typeWriter;

        function lockOrientation() {
            if (window.screen.orientation && window.screen.orientation.lock) {
                window.screen.orientation.lock('portrait').catch(() => {});
            }
        }
        window.addEventListener('load', lockOrientation);
        // Global Function لاستقبال التوكن من الأندرويد
window.receiveAndroidToken = function(token) {
    console.log("Received FCM Token from Android:", token);
    
    // إرسال التوكن إلى السيرفر لحفظه في قاعدة البيانات للمستخدم الحالي
    fetch('/api/save-fcm-token', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token: token })
    }).catch(err => console.error("Error saving token", err));
};
    </script>

<script>

(function(){
  var sk = document.getElementById('skeletonLoader');
  if (!sk) return;
  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>




<!-- PWA Install Prompt -->
<div id="pwaInstallBar" style="display:none;">
  <style>
    #pwaInstallBar {
      position:fixed; bottom:0; left:0; right:0; z-index:99999;
      animation: pwaBarSlide 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    #pwaInstallBar .pwa-bar-inner {
      background: #111827;
      margin: 10px;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.08);
    }
    #pwaInstallBar .pwa-bar-icon {
      width: 46px; height: 46px;
      border-radius: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #pwaInstallBar .pwa-bar-text {
      flex: 1; min-width: 0;
    }
    #pwaInstallBar .pwa-bar-title {
      font-size: 15px; font-weight: 700; color: #fff;
    }
    #pwaInstallBar .pwa-bar-desc {
      font-size: 12px; color: #9ca3af; margin-top: 1px;
    }
    #pwaInstallBar .pwa-bar-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #pwaInstallBar .pwa-bar-btn:active { background: #2563eb; }
    #pwaInstallBar .pwa-bar-close {
      background: none; border: none;
      color: #6b7280; font-size: 22px;
      cursor: pointer; padding: 2px 4px; line-height: 1;
    }
    @keyframes pwaBarSlide {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    /* iOS overlay */
    #iosInstallOverlay {
      position:fixed; inset:0; z-index:999999;
      background:rgba(0,0,0,0.88);
      display:flex; align-items:center; justify-content:center;
      padding:20px; animation: fadeInOverlay 0.3s ease;
    }
    @keyframes fadeInOverlay {
      from { opacity:0; } to { opacity:1; }
    }
    .ios-install-box {
      background:#1a1a2e; border-radius:20px; padding:28px 24px;
      max-width:340px; width:100%; text-align:center;
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 16px 48px rgba(0,0,0,0.5);
    }
    .ios-step {
      background:rgba(255,255,255,0.05); border-radius:12px;
      padding:12px 16px; margin-bottom:8px; text-align:right;
      direction:rtl; color:#cbd5e1; font-size:14px;
    }
  </style>

  <div class="pwa-bar-inner">
    <img src="/icon-192.png" alt="Aite" class="pwa-bar-icon">
    <div class="pwa-bar-text">
      <div class="pwa-bar-title">Aite</div>
      <div class="pwa-bar-desc" id="pwaBarDesc">تثبيت التطبيق على جهازك</div>
    </div>
    <button class="pwa-bar-btn" id="pwaBarInstallBtn" onclick="pwaInstallApp()">تثبيت</button>
    <button class="pwa-bar-close" onclick="pwaDismiss()">&times;</button>
  </div>
</div>

<script>
(function(){
  // ===== PWA Full App Install =====
  var DISMISS_KEY = 'aite_install_dismiss_v2';
  var bar = document.getElementById('pwaInstallBar');
  var desc = document.getElementById('pwaBarDesc');
  var btn = document.getElementById('pwaBarInstallBtn');
  var _prompt = null;

  // Is app already running in standalone (installed)?
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {
    setTimeout(function(){
      if (desc) desc.textContent = 'أضف Aite إلى الشاشة الرئيسية';
      if (btn) btn.textContent = 'إضافة';
      bar.style.display = 'block';
    }, 2500);
  }

  // Install button click
  window.pwaInstallApp = function() {
    if (_prompt) {
      // Native browser install prompt (Android/Chrome/Edge/Desktop)
      _prompt.prompt();
      _prompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          bar.style.display = 'none';
          try { localStorage.removeItem(DISMISS_KEY); } catch(e){}
        }
        _prompt = null;
      });
    } else if (isIOS) {
      // Show iOS step-by-step instructions
      var ov = document.createElement('div');
      ov.id = 'iosInstallOverlay';
      ov.innerHTML = '<div class="ios-install-box">'
        + '<img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin:0 auto 14px;display:block;">'
        + '<h3 style="color:#fff;font-size:19px;font-weight:700;margin:0 0 6px;">تثبيت Aite</h3>'
        + '<p style="color:#9ca3af;font-size:13px;margin:0 0 18px;">اتبع الخطوات التالية لتثبيت التطبيق:</p>'
        + '<div class="ios-step">1. اضغط على أيقونة المشاركة <span style="font-size:17px;">⬆️</span> في شريط Safari</div>'
        + '<div class="ios-step">2. اختر <b style="color:#fff;">"إضافة إلى الشاشة الرئيسية"</b> <span style="font-size:15px;">📱</span></div>'
        + '<div class="ios-step">3. اضغط <b style="color:#fff;">"إضافة"</b> في الأعلى</div>'
        + '<button onclick="this.closest('#iosInstallOverlay').remove()" style="margin-top:18px;background:#3b82f6;color:#fff;border:none;padding:11px 34px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">فهمت</button>'
        + '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target===ov) ov.remove(); });
    }
  };

  // Dismiss for 12 hours
  window.pwaDismiss = function() {
    bar.style.display = 'none';
    try { localStorage.setItem(DISMISS_KEY, Date.now().toString()); } catch(e){}
  };

  // Auto-hide on successful install
  window.addEventListener('appinstalled', function() {
    bar.style.display = 'none';
    _prompt = null;
  });
})();
</script>
<script>
// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(function(reg) { console.log('SW registered:', reg.scope); })

<!-- Page Transition Loading Bar -->
<div id="aite-page-loader"></div>
<script>
(function(){
  var loader = document.getElementById('aite-page-loader');
  if (!loader) return;
  // Only show in PWA standalone mode, not in WebView or normal browser
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;
  var isNavigating = false;

  function startLoader() {
    if (isNavigating) return;
    isNavigating = true;
    loader.style.width = '0';
    loader.classList.add('active');
    // Force reflow
    void loader.offsetWidth;
    loader.style.width = '70%';
    setTimeout(function(){ if (isNavigating) loader.style.width = '85%'; }, 500);
    setTimeout(function(){ if (isNavigating) loader.style.width = '92%'; }, 1500);
  }

  // Intercept all link clicks
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startLoader();
  });

  // Also trigger on form submissions and programmatic navigation
  window.addEventListener('beforeunload', function() {
    startLoader();
  });

  // Complete the bar when page loads
  window.addEventListener('pageshow', function() {
    if (loader.classList.contains('active')) {
      loader.style.transition = 'width 0.2s ease-out';
      loader.style.width = '100%';
      setTimeout(function(){
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(function(){
          loader.classList.remove('active');
          loader.style.width = '0';
          loader.style.transition = 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          loader.style.opacity = '';
          isNavigating = false;
        }, 300);
      }, 200);
    }
  });
})();
</script>
