<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(57, 130, 247, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(120, 50, 220, 0.12) 0%, transparent 40%);
            color: #e4e6eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
        }

        .splash-logo {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(57, 130, 247, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        .app-name {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ffffff 0%, #3982f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        /* تنسيق الخط الجديد لـ "from salem ahmed" */
        .typing-container {
            /* خط Dancing Script يعطي مظهر توقيع يدوي أنيق */
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
            word-spacing: 4px;
            text-shadow: 0 0 10px rgba(57, 130, 247, 0.3);
        }

        /* جعل كلمة "salem ahmed" بلون مختلف قليلاً لتمييزها */
        .typing-effect {
            position: relative;
        }

        .typing-effect::after {
            content: "";
            display: inline-block;
            width: 2px;
            height: 20px;
            background-color: #3982f7;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" alt="Aite Logo" class="splash-logo">
    
    <h1 class="app-name">Aite</h1>

    <div class="typing-container">
        <span class="typing-effect"></span>
    </div>

    <script>
        const text = "from salem ahmed";
        let index = 0;
        const speed = 100;

        function typeWriter() {
            if (index < text.length) {
                document.querySelector(".typing-effect").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    window.location.href = "/check-status";
                }, 2000);
            }
        }

        window.onload = typeWriter;

        function lockOrientation() {
            if (window.screen.orientation && window.screen.orientation.lock) {
                window.screen.orientation.lock('portrait').catch(() => {});
            }
        }
        window.addEventListener('load', lockOrientation);
    </script>
</body>
</html>
