<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* نفس خلفية باقي الصفحات للحفاظ على الهوية البصرية */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(57, 130, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(120, 50, 220, 0.1) 0%, transparent 40%);
            color: #e4e6eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
        }

        /* تأثير الزجاج الخفيف حول الشعار (اختياري لجمالية أكثر) */
        .glass-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            border-radius: 20px;
            /* خلفية زجاجية شفافة جداً */
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(5px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* تنسيق الصورة */
        .splash-logo {
            width: 100px;
            height: 100px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(57, 130, 247, 0.25);
            animation: float 3s ease-in-out infinite;
        }

        /* اسم التطبيق */
        .app-name {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* تأثير الكتابة */
        .typing-container {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: lowercase;
            min-height: 24px; /* لحجز مكان للنص */
        }

        .typing-effect::after {
            content: "|";
            display: inline-block;
            animation: blink 0.8s infinite;
            font-weight: bold;
            color: #3982f7; /* لون المؤشر أزرق */
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* أنيميشن بسيط للشعار */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" alt="Aite Logo" class="splash-logo">
        
        <h1 class="app-name">Aite</h1>

        <div class="typing-container">
            <span class="typing-effect"></span>
        </div>
    </div>

    <script>
        // النص الذي سيتم كتابته
        const text = "from salem ahmed";
        let index = 0;
        const speed = 100; // سرعة الكتابة

        function typeWriter() {
            if (index < text.length) {
                document.querySelector(".typing-effect").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                // بعد انتهاء الكتابة، انتظر قليلاً ثم انتقل
                setTimeout(function() {
                    window.location.href = "/check-status";
                }, 1500);
            }
        }

        // بدء التأثير عند تحميل الصفحة
        window.onload = typeWriter;

        // دالة قفل الشاشة (كما في كودك السابق)
        function lockOrientation() {
            if (window.screen.orientation && window.screen.orientation.lock) {
                // محاولة القفل على الوضع الطولي
                window.screen.orientation.lock('portrait').catch(function(error) {
                    // السكوت عن الخطأ في المتصفحات التي لا تدعم الخاصية
                    console.log('Orientation lock not supported or failed.');
                });
            }
        }
        
        window.addEventListener('load', lockOrientation);
        window.addEventListener('resize', lockOrientation);
    </script>
</body>
</html>
