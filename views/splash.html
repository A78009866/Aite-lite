<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            /* خلفية متدرجة تملأ الصفحة بالكامل */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(57, 130, 247, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(120, 50, 220, 0.12) 0%, transparent 40%);
            color: #e4e6eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
        }

        /* تنسيق الشعار ليكون حراً بظل ناعم */
        .splash-logo {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            object-fit: cover;
            margin-bottom: 24px;
            /* توهج أزرق ناعم خلف الصورة */
            box-shadow: 0 0 30px rgba(57, 130, 247, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        /* اسم التطبيق بتأثير النص المضيء */
        .app-name {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #3982f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
            letter-spacing: -1px;
        }

        /* نص "from salem ahmed" */
        .typing-container {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            color: rgba(148, 163, 184, 0.8);
            letter-spacing: 3px;
            text-transform: lowercase;
            min-height: 24px;
        }

        .typing-effect::after {
            content: "|";
            display: inline-block;
            animation: blink 0.8s infinite;
            color: #3982f7;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" alt="Aite Logo" class="splash-logo">
    
    <h1 class="app-name">Aite</h1>

    <div class="typing-container">
        <span class="typing-effect"></span>
    </div>

    <script>
        const text = "from salem ahmed";
        let index = 0;
        const speed = 120;

        function typeWriter() {
            if (index < text.length) {
                document.querySelector(".typing-effect").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    window.location.href = "/check-status";
                }, 1800);
            }
        }

        window.onload = typeWriter;

        // قفل التوجه (Orientation)
        function lockOrientation() {
            if (window.screen.orientation && window.screen.orientation.lock) {
                window.screen.orientation.lock('portrait').catch(() => {});
            }
        }
        window.addEventListener('load', lockOrientation);
    </script>
</body>
</html>
