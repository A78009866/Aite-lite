    <script>
        // معاينة الصور
        function previewImage(input, imgId, placeholderId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(imgId).src = e.target.result;
                    document.getElementById(imgId).style.display = 'block';
                    document.getElementById(placeholderId).style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // إظهار/إخفاء كلمة المرور
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
                icon.style.color = "#3982f7"; // تلوين الأيقونة عند الإظهار
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
                icon.style.color = ""; // إعادة اللون الطبيعي
            }
        }

        // رفع ملف مباشرة إلى ImageKit (يتجاوز حد حجم السيرفر)
        async function uploadToImageKit(file, folder) {
            var authRes = await fetch('/api/imagekit/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ folder: folder })
            });
            var authData = await authRes.json();
            if (!authData.ok) throw new Error('فشل في الحصول على مصادقة الرفع');

            var fd = new FormData();
            fd.append('file', file);
            fd.append('publicKey', authData.publicKey);
            fd.append('signature', authData.signature);
            fd.append('expire', authData.expire);
            fd.append('token', authData.token);
            fd.append('folder', authData.folder);
            fd.append('fileName', Date.now() + '-' + (file.name || 'file'));

            var uploadUrl = 'https://upload.imagekit.io/api/v1/files/upload';
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', uploadUrl, true);
                xhr.timeout = 120000;
                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable && btnText) {
                        var pct = Math.round((e.loaded / e.total) * 100);
                        btnText.textContent = 'جاري الرفع ' + pct + '%';
                    }
                };
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var uploadData = JSON.parse(xhr.responseText);
                            if (uploadData.error) return reject(new Error(uploadData.error || 'فشل رفع الملف'));
                            resolve(uploadData.url);
                        } catch(e) { reject(new Error('استجابة غير صالحة من خدمة الرفع')); }
                    } else {
                        reject(new Error('فشل رفع الملف (HTTP ' + xhr.status + ')'));
                    }
                };
                xhr.onerror = function() { reject(new Error('خطأ في الاتصال أثناء الرفع')); };
                xhr.ontimeout = function() { reject(new Error('انتهت مهلة الرفع - حاول مرة أخرى')); };
                xhr.send(fd);
            });
        }

        // مفتاح التخزين الموحد
        const REG_STORAGE_KEY = 'aite_accounts_secure_v2';
        const DEFAULT_PROFILE_IMG = 'https://res.cloudinary.com/duixjs8az/image/upload/v1766905033/post_media/1766905033352-default_profile.png';
        
        function loadAccounts() { try { return JSON.parse(localStorage.getItem(REG_STORAGE_KEY) || '[]'); } catch (e) { return []; } }
        function saveAccounts(list) { localStorage.setItem(REG_STORAGE_KEY, JSON.stringify(list)); }

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            // reset error
            errorBox.style.display = 'none';
            errorBox.textContent = '';

            const username = (document.getElementById('id_username').value || '').trim();
            const fullname = (document.getElementById('id_fullname').value || '').trim() || username;
            const password = document.getElementById('id_password').value;

            // client-side quick validations to give instant clear messages
            if (!username) {
                showError('اسم المستخدم مطلوب.');
                return;
            }
            if (/\s/.test(username)) {
                showError('لا يجب أن يحتوي اسم المستخدم على مسافات.');
                return;
            }
            if (!/^[A-Za-z0-9._-]{3,32}$/.test(username)) {
                showError('اسم المستخدم يجب أن يتكون من أحرف وأرقام ونقاط أو _ أو - وطوله بين 3 و 32.');
                return;
            }
            if (!password || password.length < 6) {
                showError('كلمة المرور قصيرة؛ يجب أن تكون 6 أحرف على الأقل.');
                return;
            }

            // visual loading
            submitBtn.disabled = true;
            btnText.textContent = 'جاري التسجيل...';
            btnSpinner.classList.remove('hidden');

            try {
                // رفع الصور مباشرة إلى ImageKit (يتجاوز حد حجم السيرفر)
                var bodyData = { username: username, password: password, full_name: fullname };

                var profilePicInput = document.getElementById('id_profile_picture');
                if (profilePicInput.files && profilePicInput.files[0]) {
                    btnText.textContent = 'جاري رفع صورة البروفايل...';
                    bodyData.profile_picture_url = await uploadToImageKit(profilePicInput.files[0], 'profile_pics');
                }

                var coverPhotoInput = document.getElementById('id_cover_photo');
                if (coverPhotoInput.files && coverPhotoInput.files[0]) {
                    btnText.textContent = 'جاري رفع صورة الغلاف...';
                    bodyData.cover_photo_url = await uploadToImageKit(coverPhotoInput.files[0], 'cover_photos');
                }

                btnText.textContent = 'جاري التسجيل...';

                const resp = await fetch('/register', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                const data = await resp.json().catch(() => ({ ok: false, error: 'فشل في الاتصال بالخادم' }));

                if (data && data.ok) {
                    // save account info + remember token to local storage AFTER server confirmed registration
                    // SECURITY: Never store passwords - use server-generated remember token instead
                    const profilePic = data.profile_picture_url || DEFAULT_PROFILE_IMG;

                    let accounts = loadAccounts().filter(a => a.username !== username);
                    
                    accounts.unshift({
                        username: username,
                        full_name: data.full_name || fullname,
                        profile_picture_url: profilePic,
                        remember_token: data.remember_token || ''
                    });

                    saveAccounts(accounts.slice(0, 8));

                    // Redirect to chat_list or provided redirect
                    window.location.href = data.redirect || '/chat_list';
                    return;
                } else {
                    const message = (data && data.error) ? data.error : 'فشل في التسجيل';
                    showError(message);
                }
            } catch (err) {
                console.error('Registration request failed:', err);
                showError('فشل في الاتصال بالخادم. حاول مرة أخرى.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'إنشاء حساب';
                btnSpinner.classList.add('hidden');
            }
        });

        function showError(msg) {
            errorBox.style.display = 'block';
            errorBox.textContent = msg;
        }

    </script>

<script>

(function(){
  var sk = document.getElementById('skeletonLoader');
  if (!sk) return;
  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>

<script>
(function(){
  // ===== PWA Full App Install =====
  var DISMISS_KEY = 'aite_install_dismiss_v2';
  var bar = document.getElementById('pwaInstallBar');
  var desc = document.getElementById('pwaBarDesc');
  var btn = document.getElementById('pwaBarInstallBtn');
  var _prompt = null;

  // Is app already running in standalone (installed)?
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {
    setTimeout(function(){
      if (desc) desc.textContent = 'أضف Aite إلى الشاشة الرئيسية';
      if (btn) btn.textContent = 'إضافة';
      bar.style.display = 'block';
    }, 2500);
  }

  // Install button click
  window.pwaInstallApp = function() {
    if (_prompt) {
      // Native browser install prompt (Android/Chrome/Edge/Desktop)
      _prompt.prompt();
      _prompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          bar.style.display = 'none';
          try { localStorage.removeItem(DISMISS_KEY); } catch(e){}
        }
        _prompt = null;
      });
    } else if (isIOS) {
      // Show iOS step-by-step instructions
      var ov = document.createElement('div');
      ov.id = 'iosInstallOverlay';
      ov.innerHTML = '<div class="ios-install-box">'
        + '<img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin:0 auto 14px;display:block;">'
        + '<h3 style="color:#fff;font-size:19px;font-weight:700;margin:0 0 6px;">تثبيت Aite</h3>'
        + '<p style="color:#9ca3af;font-size:13px;margin:0 0 18px;">اتبع الخطوات التالية لتثبيت التطبيق:</p>'
        + '<div class="ios-step">1. اضغط على أيقونة المشاركة <span style="font-size:17px;">⬆️</span> في شريط Safari</div>'
        + '<div class="ios-step">2. اختر <b style="color:#fff;">"إضافة إلى الشاشة الرئيسية"</b> <span style="font-size:15px;">📱</span></div>'
        + '<div class="ios-step">3. اضغط <b style="color:#fff;">"إضافة"</b> في الأعلى</div>'
        + '<button onclick="this.closest('#iosInstallOverlay').remove()" style="margin-top:18px;background:#3b82f6;color:#fff;border:none;padding:11px 34px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">فهمت</button>'
        + '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target===ov) ov.remove(); });
    }
  };

  // Dismiss for 12 hours
  window.pwaDismiss = function() {
    bar.style.display = 'none';
    try { localStorage.setItem(DISMISS_KEY, Date.now().toString()); } catch(e){}
  };

  // Auto-hide on successful install
  window.addEventListener('appinstalled', function() {
    bar.style.display = 'none';
    _prompt = null;
  });
})();
</script>
<script>
// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(function(reg) { console.log('SW registered:', reg.scope); })
      .catch(function(err) { console.log('SW registration failed:', err); });

}
</script>

<!-- Page Transition Loading Bar -->
<div id="aite-page-loader"></div>
<script>
(function(){
  var loader = document.getElementById('aite-page-loader');
  if (!loader) return;
  // Only show in PWA standalone mode, not in WebView or normal browser
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;
  var isNavigating = false;

  function startLoader() {
    if (isNavigating) return;
    isNavigating = true;
    loader.style.width = '0';
    loader.classList.add('active');
    // Force reflow
    void loader.offsetWidth;
    loader.style.width = '70%';
    setTimeout(function(){ if (isNavigating) loader.style.width = '85%'; }, 500);
    setTimeout(function(){ if (isNavigating) loader.style.width = '92%'; }, 1500);
  }

  // Intercept all link clicks
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startLoader();
  });

  // Also trigger on form submissions and programmatic navigation
  window.addEventListener('beforeunload', function() {
    startLoader();
  });

  // Complete the bar when page loads
  window.addEventListener('pageshow', function() {
    if (loader.classList.contains('active')) {
      loader.style.transition = 'width 0.2s ease-out';
      loader.style.width = '100%';
      setTimeout(function(){
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(function(){
          loader.classList.remove('active');
          loader.style.width = '0';
          loader.style.transition = 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          loader.style.opacity = '';
          isNavigating = false;
        }, 300);
      }, 200);
    }
  });
})();
</script>
