    <script>var t = (window.AiteI18n && window.AiteI18n.t) ? window.AiteI18n.t : function(s){return s;};

        // معاينة الصور
        function previewImage(input, imgId, placeholderId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(imgId).src = e.target.result;
                    document.getElementById(imgId).style.display = 'block';
                    document.getElementById(placeholderId).style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // إظهار/إخفاء كلمة المرور
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
                icon.style.color = "#3982f7"; // تلوين الأيقونة عند الإظهار
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
                icon.style.color = ""; // إعادة اللون الطبيعي
            }
        }

        // رفع ملف مباشرة إلى R2 (يتجاوز حد حجم السيرفر) - مع إعادة المحاولة
        async function _uploadToR2Once(file, presignData) {
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('PUT', presignData.uploadUrl, true);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
                xhr.timeout = 300000;
                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable && btnText) {
                        var pct = Math.round((e.loaded / e.total) * 100);
                        btnText.textContent = t('جاري الرفع ') + pct + '%';
                    }
                };
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(presignData.publicUrl);
                    } else {
                        reject(new Error('فشل رفع الملف (HTTP ' + xhr.status + ')'));
                    }
                };
                xhr.onerror = function() { reject(new Error('خطأ في الاتصال أثناء الرفع')); };
                xhr.ontimeout = function() { reject(new Error('انتهت مهلة الرفع - حاول مرة أخرى')); };
                xhr.send(file);
            });
        }

        async function uploadToR2(file, folder) {
            var maxRetries = 3;
            var lastError = null;
            for (var attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    if (attempt > 0) {
                        if (btnText) btnText.textContent = t('إعادة المحاولة...');
                        await new Promise(function(r) { setTimeout(r, 1000 * attempt); });
                    }
                    var presignRes = await fetch('/api/r2/presign', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ folder: folder, fileName: file.name, contentType: file.type })
                    });
                    if (!presignRes.ok) throw new Error('فشل الاتصال بالخادم');
                    var presignData = await presignRes.json();
                    if (!presignData.ok) throw new Error(presignData.error || 'فشل في الحصول على رابط الرفع');
                    return await _uploadToR2Once(file, presignData);
                } catch(err) {
                    console.warn('Upload attempt ' + (attempt+1) + '/' + maxRetries + ' failed:', err.message);
                    lastError = err;
                }
            }
            throw lastError;
        }

        // مفتاح التخزين الموحد
        const REG_STORAGE_KEY = 'aite_accounts_secure_v2';
        const DEFAULT_PROFILE_IMG = 'https://pub-7c93bdf7768e4bd3a90334827b920b16.r2.dev/f547d800625af9056d62efe8969aeea0.jpg';
        
        function loadAccounts() { try { return JSON.parse(localStorage.getItem(REG_STORAGE_KEY) || '[]'); } catch (e) { return []; } }
        function saveAccounts(list) { localStorage.setItem(REG_STORAGE_KEY, JSON.stringify(list)); }

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            // reset error
            errorBox.style.display = 'none';
            errorBox.textContent = '';

            const username = (document.getElementById('id_username').value || '').trim();
            const fullname = (document.getElementById('id_fullname').value || '').trim() || username;
            const password = document.getElementById('id_password').value;

            // client-side quick validations to give instant clear messages
            if (!username) {
                showError('اسم المستخدم مطلوب.');
                return;
            }
            if (/\s/.test(username)) {
                showError('لا يجب أن يحتوي اسم المستخدم على مسافات.');
                return;
            }
            if (!/^[A-Za-z0-9._-]{3,32}$/.test(username)) {
                showError('اسم المستخدم يجب أن يتكون من أحرف وأرقام ونقاط أو _ أو - وطوله بين 3 و 32.');
                return;
            }
            if (!password || password.length < 6) {
                showError('كلمة المرور قصيرة؛ يجب أن تكون 6 أحرف على الأقل.');
                return;
            }

            // visual loading
            submitBtn.disabled = true;
            btnText.textContent = t('جاري التسجيل...');
            btnSpinner.classList.remove('hidden');

            try {
                // رفع الصور مباشرة إلى ImageKit (يتجاوز حد حجم السيرفر)
                var bodyData = { username: username, password: password, full_name: fullname };

                var profilePicInput = document.getElementById('id_profile_picture');
                if (profilePicInput.files && profilePicInput.files[0]) {
                    btnText.textContent = t('جاري رفع صورة البروفايل...');
                    bodyData.profile_picture_url = await uploadToR2(profilePicInput.files[0], 'profile_pics');
                }

                var coverPhotoInput = document.getElementById('id_cover_photo');
                if (coverPhotoInput.files && coverPhotoInput.files[0]) {
                    btnText.textContent = t('جاري رفع صورة الغلاف...');
                    bodyData.cover_photo_url = await uploadToR2(coverPhotoInput.files[0], 'cover_photos');
                }

                btnText.textContent = t('جاري التسجيل...');

                const resp = await fetch('/register', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                const data = await resp.json().catch(() => ({ ok: false, error: 'فشل في الاتصال بالخادم' }));

                if (data && data.ok) {
                    // save account info + remember token to local storage AFTER server confirmed registration
                    // SECURITY: Never store passwords - use server-generated remember token instead
                    const profilePic = data.profile_picture_url || DEFAULT_PROFILE_IMG;

                    let accounts = loadAccounts().filter(a => a.username !== username);
                    
                    accounts.unshift({
                        username: username,
                        full_name: data.full_name || fullname,
                        profile_picture_url: profilePic,
                        remember_token: data.remember_token || ''
                    });

                    saveAccounts(accounts.slice(0, 8));

                    // Redirect to chat_list or provided redirect
                    window.location.href = data.redirect || '/chat_list';
                    return;
                } else {
                    const message = (data && data.error) ? data.error : 'فشل في التسجيل';
                    showError(message);
                }
            } catch (err) {
                console.error('Registration request failed:', err);
                showError('فشل في الاتصال بالخادم. حاول مرة أخرى.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = t('إنشاء حساب');
                btnSpinner.classList.add('hidden');
            }
        });

        function showError(msg) {
            errorBox.style.display = 'block';
            errorBox.textContent = msg;
        }

    </script>

<script>

(function(){
  var sk = document.getElementById('skeletonLoader');
  if (!sk) return;
  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>

  var desc = document.getElementById('pwaBarDesc');

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {

<div id="aite-offline-overlay">

<script>
(function(){
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;

  var bar = document.getElementById('aite-progress-bar');
  var currentProgress = 0;
  var progressTimer = null;
  var isNavigating = false;

  function setProgress(value) {
    currentProgress = Math.min(value, 100);
    if (bar) bar.style.width = currentProgress + '%';
  }

  function startProgress() {
    if (isNavigating) return;
    isNavigating = true;
    currentProgress = 0;
    if (bar) {
      bar.style.transition = 'none';
      bar.style.width = '0';
      bar.style.opacity = '0';
      void bar.offsetWidth;
      bar.classList.add('active');
      bar.style.opacity = '1';
      bar.style.transition = 'width 150ms ease-out';
    }
    setProgress(15);
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(function() {
      if (currentProgress < 50) setProgress(currentProgress + 3);
      else if (currentProgress < 75) setProgress(currentProgress + 1.5);
      else if (currentProgress < 90) setProgress(currentProgress + 0.5);
      if (currentProgress >= 92) { clearInterval(progressTimer); progressTimer = null; }
    }, 150);
  }

  function completeProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (!bar) return;
    bar.style.transition = 'width 100ms ease-out';
    setProgress(100);
    setTimeout(function() {
      bar.style.transition = 'opacity 200ms ease';
      bar.style.opacity = '0';
      setTimeout(function() {
        bar.classList.remove('active');
        bar.style.width = '0';
        bar.style.transition = 'width 150ms ease-out';
        bar.style.opacity = '';
        currentProgress = 0;
        isNavigating = false;
      }, 200);
    }, 150);
  }

  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startProgress();
  });

  window.addEventListener('beforeunload', function() { startProgress(); });
  window.addEventListener('pageshow', function() { completeProgress(); });
  if (document.readyState === 'complete') completeProgress();
  else window.addEventListener('load', function() { completeProgress(); });

  document.addEventListener('contextmenu', function(e) {
    var tag = e.target.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !e.target.isContentEditable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('dragstart', function(e) { e.preventDefault(); }, { passive: false });

  var offlineOverlay = document.getElementById('aite-offline-overlay');
  function checkOnline() {
    if (!navigator.onLine && offlineOverlay) offlineOverlay.classList.add('show');
    else if (offlineOverlay) offlineOverlay.classList.remove('show');
  }
  window.addEventListener('online', checkOnline);
  window.addEventListener('offline', checkOnline);

  var notifSound = null;
  try { notifSound = new Audio('/notification.mp3'); notifSound.volume = 1.0; notifSound.preload = 'auto'; } catch(e) {}
  window.aitePlayNotificationSound = function() {
    try {
      if (notifSound) { notifSound.currentTime = 0; notifSound.play().catch(function(){}); }
      if (navigator.vibrate) navigator.vibrate([0, 300, 200, 300]);
    } catch(e) {}
  };
  document.addEventListener('aite-new-notification', function() { window.aitePlayNotificationSound(); });
})();
</script>

<!-- Aite Web Push Subscription -->
<script>
(function(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  async function subscribeWebPush() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) return; // already subscribed

      const resp = await fetch('/api/vapid-public-key');
      const data = await resp.json();
      if (!data.ok || !data.publicKey) return;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;

      const applicationServerKey = urlBase64ToUint8Array(data.publicKey);
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey
      });

      await fetch('/api/web-push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });
    } catch (e) {
      console.warn('Web Push subscription failed:', e);
    }
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Subscribe after page loads (with small delay to not block rendering)
  if (document.readyState === 'complete') {
    setTimeout(subscribeWebPush, 2000);
  } else {
    window.addEventListener('load', function() {
      setTimeout(subscribeWebPush, 2000);
    });
  }
})();
</script>

<style>

  transform: rotate(135deg);

.ptr-indicator.ptr-loading .ptr-arrow {
  border: 2px solid #6ee7b7;
  border-radius: 50%;

  width: 18px; height: 18px;
  transform: none;
  margin-top: 0;

@keyframes ptr-spin { to { transform: rotate(360deg); } }

<div class="ptr-indicator" id="ptr-indicator"><div class="ptr-arrow"></div></div>
<script>
(function() {
  var ptrEl = document.getElementById('ptr-indicator');
  if (!ptrEl) return;
  var startY = 0, pulling = false, activated = false;
  var threshold = 90, deadZone = 15;

  function isAtPageTop() {
    return (window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0) <= 2;
  }

  function isInsideScrollable(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      var style = window.getComputedStyle(el);
      var oy = style.overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight && el.scrollTop > 0) {
        return true;
      }
      el = el.parentElement;
    }
    return false;
  }

  document.addEventListener('touchstart', function(e) {
    if (!isAtPageTop()) return;
    if (isInsideScrollable(e.target)) return;
    startY = e.touches[0].clientY;
    pulling = true;
    activated = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    var currentY = e.touches[0].clientY;
    var dist = currentY - startY;

    if (!isAtPageTop()) {
      pulling = false;
      ptrEl.style.top = '-50px';
      ptrEl.classList.remove('ptr-ready');
      return;
    }

    if (dist < deadZone) return;

    var realDist = dist - deadZone;
    var progress = Math.min(realDist / threshold, 1);
    var top = Math.min(realDist * 0.35, 50);
    ptrEl.style.top = (top - 15) + 'px';
    ptrEl.style.transition = 'none';

    if (progress >= 1) {
      ptrEl.classList.add('ptr-ready');
      activated = true;
    } else {
      ptrEl.classList.remove('ptr-ready');
      activated = false;
    }

    if (realDist > 5 && e.cancelable) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (!pulling) return;
    ptrEl.style.transition = 'top 0.25s ease';
    if (activated) {
      ptrEl.style.top = '12px';
      ptrEl.classList.remove('ptr-ready');
      ptrEl.classList.add('ptr-loading');
      setTimeout(function() { location.reload(); }, 350);
    } else {
      ptrEl.style.top = '-50px';
      ptrEl.classList.remove('ptr-ready');
    }
    pulling = false;
    activated = false;
    startY = 0;
  }, { passive: true });
})();
</script>
