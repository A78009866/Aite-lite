<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>العائلات — Aite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(180deg,#020202 0%, #070707 100%);
      color: #e6eefb;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .glass-page {
      max-width: 980px;
      margin: 36px auto;
      background: rgba(10,10,12,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .search-container {
      margin-top: 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 40px 12px 12px;
      color: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .search-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .families-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .family-tile {
      background: rgba(20,20,20,0.55);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .family-tile:hover { transform: translateY(-6px); box-shadow: 0 8px 30px rgba(0,0,0,0.7); }

    .family-tile img { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }

    .tile-meta { overflow: hidden; }
    .tile-name {
      font-weight: 800;
      font-size: 1.02rem;
      color: #fff;
      white-space: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .tile-name::-webkit-scrollbar { height: 6px; }
    .tile-name::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 6px; }

    .tile-sub {
      color: #9ca3af;
      font-size: .9rem;
      margin-top: 8px;
    }

    .page-header {
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .page-title { font-size: 1.4rem; font-weight: 900; color: #fff; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.2); }

    /* تمييز زر الإنشاء بلون خفيف */
    .create-btn {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
    }

    .empty-state {
      text-align:center;
      color: #9ca3af;
      padding: 36px 12px;
    }
  </style>
</head>
<body>
  <div class="glass-page">
    <div class="page-header">
      <div>
        <div class="page-title">ابحث عن عائلتك</div>
        <div class="text-sm text-gray-400">أو انضم لعائلة جديدة</div>
      </div>
      <div class="header-actions">
        <button class="btn-action create-btn" onclick="window.location.href='/create-family'" title="إنشاء عائلة">
          <i class="fas fa-plus"></i>
        </button>
        <button class="btn-action" onclick="goBack()" title="رجوع">
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="familySearch" class="search-input" placeholder="اكتب اسم العائلة للبحث..." onkeyup="filterFamilies()">
    </div>

    <div id="familiesGrid" class="families-grid" style="margin-top:18px;">
      </div>

    <div id="emptyState" class="empty-state hidden">
      <i class="far fa-frown text-3xl mb-3"></i>
      <div class="mt-2" id="emptyMessage">لا توجد عائلات بعد.</div>
      <div class="mt-2 text-sm">يمكنك إنشاء عائلة من خلال الزر أعلاه .</div>
    </div>
  </div>

  <script>
    const DEFAULT_FAM_IMG = "https://plus.unsplash.com/premium_vector-1682298522309-88e4dc1ccc4d?q=80&w=1125&auto=format&fit=crop";
    const grid = document.getElementById('familiesGrid');
    const empty = document.getElementById('emptyState');
    let allFamilies = [];

    function goBack() {
      if (document.referrer && document.referrer.includes('/chat_list')) {
        window.history.back();
      } else {
        window.location.href = '/chat_list';
      }
    }

    function escapeHtml(s) {
      if (!s && s !== 0) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function createTileHtml(f) {
      const img = (f.imageUrl && f.imageUrl.length > 0 && !f.imageUrl.includes('placeholder')) ? f.imageUrl : DEFAULT_FAM_IMG;
      const members = f.membersCount || (f.members ? Object.keys(f.members).length : 0);
      const isMember = !!f.is_member;
      const badge = isMember ? '<span style="color:#34d399;font-weight:700;margin-left:8px">عضو</span>' : '<span style="color:#f59e0b;font-weight:700;margin-left:8px">مقفل</span>';
      const idAttr = encodeURIComponent(f.familyId || f.id || '');
      return `
        <div class="family-tile" data-family-id="${idAttr}" onclick="openFamily('${idAttr}')">
          <img src="${escapeHtml(img)}" alt="${escapeHtml(f.name || '')}" onerror="this.onerror=null;this.src='${DEFAULT_FAM_IMG}';">
          <div class="tile-meta">
            <div class="tile-name" title="${escapeHtml(f.name || '')}">${escapeHtml(f.name || '')}</div>
            <div class="tile-sub">${members} عضو ${badge}</div>
          </div>
        </div>
      `;
    }

    function openFamily(id) {
      window.location.href = `/family/${id}`;
    }

    function filterFamilies() {
      const query = document.getElementById('familySearch').value.toLowerCase();
      const filtered = allFamilies.filter(f => (f.name || '').toLowerCase().includes(query));
      
      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        document.getElementById('emptyMessage').innerText = "لم يتم العثور على نتائج للبحث.";
        grid.innerHTML = '';
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = filtered.map(f => createTileHtml(f)).join('');
      }
    }

    async function fetchFamilies() {
      try {
        const res = await fetch('/api/families', { credentials: 'same-origin' });
        const data = await res.json();
        if (res.ok && data.ok) {
          allFamilies = data.families || [];
        } else {
          const res2 = await fetch('/api/families/my', { credentials: 'same-origin' });
          const d2 = await res2.json();
          if (res2.ok && d2.ok && d2.families) {
            allFamilies = d2.families.map(f => ({ ...f, is_member: true }));
          }
        }
        
        if (allFamilies.length === 0) {
          empty.classList.remove('hidden');
          grid.innerHTML = '';
        } else {
          empty.classList.add('hidden');
          grid.innerHTML = allFamilies.map(f => createTileHtml(f)).join('');
        }
      } catch (err) {
        console.error('Failed to fetch families', err);
        empty.classList.remove('hidden');
        grid.innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchFamilies);
  </script>
</body>
</html>
