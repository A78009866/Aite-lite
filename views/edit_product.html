    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; color: #e6eefb;

        .glass-navbar {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(18px);

            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid rgba(0,0,0,0.08);

        html[data-theme="light"] .glass-navbar a,
        html[data-theme="light"] .glass-navbar span,
        html[data-theme="light"] .glass-navbar i { color: #1a1a2e; }

        .desktop-sidebar { display: none; }

            .desktop-sidebar {

            .desktop-sidebar .sidebar-logo {

                font-size: 22px; color: #fff; text-decoration: none;
                padding: 8px 12px; margin-bottom: 28px; display: block;
            }
            html[data-theme="light"] .desktop-sidebar .sidebar-logo { color: #1a1a2e; }
            .desktop-sidebar .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
            .desktop-sidebar .sidebar-link {

<div class="toast" id="toast"></div>

<script>
let currentProduct = null;
let selectedNewImages = [];
let existingImages = [];

async function init() {
    const productId = window.location.pathname.split('/edit_product/')[1];
    if (!productId) { window.location.href = '/marketplace'; return; }

    try {
        const res = await fetch('/api/marketplace/' + productId);
        const data = await res.json();
        if (!data.ok || !data.product) {
            showToast('المنتج غير موجود', 'error');
            setTimeout(() => { window.location.href = '/marketplace'; }, 1500);
            return;
        }
        currentProduct = data.product;
        existingImages = (currentProduct.images || []).slice();
        renderForm();
    } catch (err) {
        showToast('تعذر تحميل المنتج', 'error');
        setTimeout(() => { window.location.href = '/marketplace'; }, 1500);
    }
}

function renderForm() {
    const p = currentProduct;
    const container = document.getElementById('formContainer');
    container.innerHTML =
        '<form id="editForm" onsubmit="handleEditSubmit(event)">' +
            '<div class="form-group">' +
                '<label class="form-label">صور المنتج</label>' +
                (existingImages.length > 0 ?
                    '<p class="existing-images-label">الصور الحالية:</p>' +
                    '<div class="image-previews" id="existingPreviews">' +
                    existingImages.map((img, i) =>
                        '<div class="image-preview-item">' +
                            '<img src="' + img + '" alt="صورة">' +
                            '<button type="button" class="remove-img" onclick="removeExistingImage(' + i + ')"><i class="fas fa-times"></i></button>' +
                        '</div>'
                    ).join('') +
                    '</div>' : '') +
                '<div class="image-upload-area" onclick="document.getElementById(\'newImages\').click()" style="margin-top:12px;">' +
                    '<i class="fas fa-cloud-upload-alt"></i>' +
                    '<p>إضافة صور جديدة</p>' +
                '</div>' +
                '<input type="file" id="newImages" accept="image/*" style="display:none" onchange="handleNewImageSelect(event)">' +
                '<div class="image-previews" id="newPreviews"></div>' +
            '</div>' +
            '<div class="form-group">' +
                '<label class="form-label">اسم المنتج *</label>' +
                '<input type="text" class="form-input" id="productTitle" value="' + escapeAttr(p.title) + '" required maxlength="200">' +
            '</div>' +
            '<div class="form-group">' +
                '<label class="form-label">وصف المنتج</label>' +
                '<textarea class="form-textarea" id="productDescription" maxlength="2000">' + escapeHtml(p.description || '') + '</textarea>' +
            '</div>' +
            '<div class="form-group">' +
                '<label class="form-label">السعر بالدينار الجزائري (DZD) *</label>' +
                '<div class="price-input-wrapper">' +
                    '<input type="number" id="productPrice" value="' + p.price + '" required min="1" step="1">' +
                    '<span class="currency-label">د.ج</span>' +
                '</div>' +
            '</div>' +
            '<button type="submit" class="submit-btn" id="submitBtn">' +
                '<i class="fas fa-save"></i> حفظ التعديلات' +
            '</button>' +
        '</form>';
}

function removeExistingImage(index) {
    existingImages.splice(index, 1);
    renderForm();
}

var newImagePreviews = [];

function handleNewImageSelect(event) {
    var file = event.target.files[0];
    if (!file) return;
    var totalImages = existingImages.length + selectedNewImages.length;
    if (totalImages >= 5) {
        showToast('الحد الأقصى 5 صور إجمالاً', 'error');
        event.target.value = '';
        return;
    }
    // Accept all image types, no file size restriction
    if (!file.type.startsWith('image/')) {
        showToast('يرجى اختيار ملف صورة', 'error');
        event.target.value = '';
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
        selectedNewImages.push(file);
        newImagePreviews.push(e.target.result);
        renderNewPreviews();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function renderNewPreviews() {
    var container = document.getElementById('newPreviews');
    if (!container) return;
    container.innerHTML = '';
    newImagePreviews.forEach(function(src, index) {
        var div = document.createElement('div');
        div.className = 'image-preview-item';
        var img = document.createElement('img');
        img.src = src;
        img.alt = 'صورة جديدة';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove-img';
        btn.innerHTML = '<i class="fas fa-times"></i>';
        btn.setAttribute('data-index', index);
        btn.onclick = function() { removeNewImage(Number(this.getAttribute('data-index'))); };
        div.appendChild(img);
        div.appendChild(btn);
        container.appendChild(div);
    });
    var uploadArea = document.querySelector('.image-upload-area');
    if (uploadArea) {
        var total = existingImages.length + selectedNewImages.length;
        if (total >= 5) {
            uploadArea.style.display = 'none';
        } else {
            uploadArea.style.display = '';
        }
    }
}

function removeNewImage(index) {
    selectedNewImages.splice(index, 1);
    newImagePreviews.splice(index, 1);
    renderNewPreviews();
}

// ======== IMAGE COMPRESSION ========
async function compressImage(file, maxWidth, maxHeight, quality) {
    maxWidth = maxWidth || 1920; maxHeight = maxHeight || 1920; quality = quality || 0.85;
    if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
    return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() {
            var w = img.width, h = img.height;
            var ratio = Math.min(maxWidth / w, maxHeight / h, 1);
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
                if (blob && blob.size < file.size) {
                    resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg', lastModified: Date.now() }));
                } else {
                    resolve(file);
                }
            }, 'image/jpeg', quality);
        };
        img.onerror = function() { resolve(file); };
        img.src = URL.createObjectURL(file);
    });
}

// ======== IMAGEKIT DIRECT UPLOAD (with retry) ========
async function uploadToImageKit(file, statusCallback) {
    var maxRetries = 3;
    var lastError = null;

    for (var attempt = 0; attempt < maxRetries; attempt++) {
        try {
            if (attempt > 0) {
                if (statusCallback) statusCallback('إعادة المحاولة...');
                await new Promise(function(r) { setTimeout(r, 1000 * attempt); });
            }

            var authRes = await fetch('/api/imagekit/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder: 'marketplace', resource_type: 'image' }),
                credentials: 'same-origin'
            });
            if (!authRes.ok) throw new Error('فشل الاتصال بالخادم');
            var authData = await authRes.json();
            if (!authData.ok) throw new Error(authData.error || 'فشل في الحصول على مصادقة الرفع');

            var fd = new FormData();
            fd.append('file', file);
            fd.append('publicKey', authData.publicKey);
            fd.append('signature', authData.signature);
            fd.append('expire', authData.expire);
            fd.append('token', authData.token);
            fd.append('folder', authData.folder);
            fd.append('fileName', Date.now() + '-' + (file.name || 'file'));

            var uploadUrl = 'https://upload.imagekit.io/api/v1/files/upload';
            var result = await new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', uploadUrl, true);
                xhr.timeout = 300000; // 5 minutes
                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable && statusCallback) {
                        var pct = Math.round((e.loaded / e.total) * 100);
                        statusCallback('جاري الرفع ' + pct + '%');
                    }
                };
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data.error) return reject(new Error(data.error || 'فشل رفع الملف'));
                            resolve(data.url);
                        } catch(e) { reject(new Error('استجابة غير صالحة من خدمة الرفع')); }
                    } else reject(new Error('فشل رفع الملف (HTTP ' + xhr.status + ')'));
                };
                xhr.onerror = function() { reject(new Error('خطأ في الاتصال أثناء الرفع')); };
                xhr.ontimeout = function() { reject(new Error('انتهت مهلة الرفع - حاول مرة أخرى')); };
                xhr.send(fd);
            });
            return result;
        } catch(err) {
            console.warn('Upload attempt ' + (attempt + 1) + '/' + maxRetries + ' failed:', err.message);
            lastError = err;
        }
    }
    throw lastError;
}

async function handleEditSubmit(event) {
    event.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<div class="spinner"></div> جاري الحفظ...';

    const title = document.getElementById('productTitle').value.trim();
    const description = document.getElementById('productDescription').value.trim();
    const price = document.getElementById('productPrice').value;

    if (!title || !price) {
        showToast('يرجى ملء الحقول المطلوبة', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
        return;
    }

    try {
        // Upload new images directly to ImageKit with compression
        var newImageUrls = [];
        for (var i = 0; i < selectedNewImages.length; i++) {
            submitBtn.innerHTML = '<div class="spinner"></div> ضغط الصورة ' + (i+1) + '/' + selectedNewImages.length + '...';
            var compressed = await compressImage(selectedNewImages[i]);
            submitBtn.innerHTML = '<div class="spinner"></div> رفع الصورة ' + (i+1) + '/' + selectedNewImages.length + '...';
            var url = await uploadToImageKit(compressed, function(status) {
                submitBtn.innerHTML = '<div class="spinner"></div> صورة ' + (i+1) + ': ' + status;
            });
            newImageUrls.push(url);
        }

        submitBtn.innerHTML = '<div class="spinner"></div> جاري الحفظ...';

        // Send JSON with image URLs (not FormData)
        const res = await fetch('/api/marketplace/' + currentProduct.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: title,
                description: description,
                price: price,
                existing_images: existingImages,
                newImageUrls: newImageUrls
            }),
            credentials: 'same-origin'
        });
        const data = await res.json();
        if (data.ok) {
            showToast('تم تعديل المنتج بنجاح!');
            setTimeout(() => { window.location.href = '/product/' + currentProduct.id; }, 1000);
        } else {
            showToast(data.error || 'حدث خطأ', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
        }
    } catch (err) {
        console.error('Product edit error:', err);
        showToast('خطأ: ' + (err.message || 'فشل الاتصال بالسيرفر'), 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeAttr(text) {
    if (!text) return '';
    return text.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show' + (type === 'error' ? ' error' : '');
    setTimeout(() => { toast.className = 'toast'; }, 3000);
}

init();
</script>

<!-- Pull to Refresh -->
<style>
.ptr-indicator {
  position: fixed;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #1e293b;
  border: 2px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: top 0.2s ease, transform 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.ptr-indicator i {
  color: #6ee7b7;
  font-size: 18px;
  transition: transform 0.2s ease;
}
.ptr-indicator.ptr-loading i {
  animation: ptr-spin 0.8s linear infinite;
}
@keyframes ptr-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
<div class="ptr-indicator" id="ptr-indicator"><i class="fas fa-sync-alt"></i></div>
<script>
(function() {
  var ptrEl = document.getElementById('ptr-indicator');
  if (!ptrEl) return;
  var startY = 0, currentY = 0, pulling = false, threshold = 80;

  function getScrollTop() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }

  document.addEventListener('touchstart', function(e) {
    if (getScrollTop() <= 5) {
      startY = e.touches[0].clientY;
      pulling = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    currentY = e.touches[0].clientY;
    var dist = currentY - startY;
    if (dist > 0 && getScrollTop() <= 5) {
      var progress = Math.min(dist / threshold, 1);
      var top = Math.min(dist * 0.4, 60);
      ptrEl.style.top = (top - 20) + 'px';
      ptrEl.querySelector('i').style.transform = 'rotate(' + (progress * 180) + 'deg)';
      if (dist > 10) { e.preventDefault(); }
    } else {
      pulling = false;
      ptrEl.style.top = '-50px';
    }
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (!pulling) return;
    var dist = currentY - startY;
    if (dist >= threshold && getScrollTop() <= 5) {
      ptrEl.style.top = '10px';
      ptrEl.classList.add('ptr-loading');
      ptrEl.querySelector('i').style.transform = '';
      setTimeout(function() { location.reload(); }, 400);
    } else {
      ptrEl.style.top = '-50px';
    }
    pulling = false;
    startY = 0;
    currentY = 0;
  }, { passive: true });
})();
</script>
