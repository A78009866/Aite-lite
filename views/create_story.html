    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            overflow-wrap: break-word;
            word-wrap: break-word;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        p, span, div, h1, h2, h3, h4, h5, h6, li, td, th, label, a {
            overflow-wrap: break-word; word-wrap: break-word; word-break: break-word;
        }
        .glass-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }
        .upload-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; flex: 1; padding: 28px 16px; border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.02);
            cursor: pointer; transition: all 0.3s ease;
        }
        .upload-btn:hover { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.05); }
        .upload-btn:active { transform: scale(0.97); }
        .upload-btn .icon-circle {
            width: 52px; height: 52px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .media-preview-area {
            position: relative; width: 100%; border-radius: 20px; overflow: hidden;
            background: #000; border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .media-preview-area img {
            width: 100%; max-height: 340px; object-fit: contain; display: block; background: #000;
        }
        .media-preview-area video {
            width: 100%; max-height: 340px; object-fit: contain; display: block; background: #000;
        }
        .media-preview-area video::-webkit-media-controls-panel { background: transparent; }
        .remove-media-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            color: white; width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.15); z-index: 5;
        }
        .remove-media-btn:hover { background: rgba(239, 68, 68, 0.9); border-color: transparent; transform: scale(1.1); }
        .media-type-badge {
            position: absolute; bottom: 12px; left: 12px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            color: #fff; padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 5px;
        }
        .section-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 20px; transition: all 0.3s ease;
        }
        .section-card:hover { border-color: rgba(255, 255, 255, 0.12); }
        .story-color-opt {
            transition: all 0.2s ease; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .story-color-opt:hover { transform: scale(1.15); }
        .story-color-opt.selected {
            border-color: #fff !important; transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: #fff; border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
        .submit-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .glass-input {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.6); border-color: rgba(255, 255, 255, 0.25);
            outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .glass-input::placeholder { color: #555; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #333; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }
        .toast {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 30px;
            background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px 24px;
            border-radius: 14px; z-index: 2000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            font-weight: 600; opacity: 0; transition: opacity 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none;
        }
        .toast.show { opacity: 1; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 3s linear infinite; }

        /* Draggable text overlay */
        .story-text-overlay {
            position: absolute;
            z-index: 4;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 90%;
            transition: opacity 0.2s;
            touch-action: none;
        }
        .story-text-overlay:active { cursor: grabbing; }
        .story-text-overlay.dragging { opacity: 0.85; }

        /* Text controls bar */
        .text-controls-bar {
            display: none;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding: 10px 14px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 10px;
        }
        .text-controls-bar.active { display: flex; }
        .text-ctrl-btn {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .text-ctrl-btn:hover { background: rgba(255,255,255,0.15); }
        .text-ctrl-btn.active { background: rgba(59,130,246,0.4); border-color: rgba(59,130,246,0.6); }
        .text-ctrl-color {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }
        .text-ctrl-color:hover { transform: scale(1.15); }
        .text-ctrl-color.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); transform: scale(1.15); }
        .text-size-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            outline: none;
        }
        .text-size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

       LIGHT MODE THEME

<script>
    var selectedStoryColor = '';
    var selectedAudioBlob = null;
    var selectedMediaFile = null;
    var selectedMediaType = null;
    var previewAudio = new Audio();
    var currentPlayingUrl = '';
    var searchTimeout;

    // Text overlay state
    var storyTextColor = '#ffffff';
    var storyTextSize = 20;
    var storyTextBg = false;
    var storyTextPosX = 50; // percentage
    var storyTextPosY = 50; // percentage

    function updateTextOverlay() {
        var input = document.getElementById('storyTextInput');
        var overlay = document.getElementById('storyTextOverlay');
        var controls = document.getElementById('textControlsBar');
        var previewArea = document.getElementById('mediaPreviewArea');
        var text = input.value.trim();
        if (text && previewArea.style.display !== 'none') {
            overlay.textContent = text;
            overlay.style.display = 'block';
            controls.classList.add('active');
            updateTextStyle();
        } else {
            overlay.style.display = 'none';
            if (!text) controls.classList.remove('active');
        }
    }

    function updateTextStyle() {
        var overlay = document.getElementById('storyTextOverlay');
        var slider = document.getElementById('textSizeSlider');
        storyTextSize = parseInt(slider.value);
        overlay.style.fontSize = storyTextSize + 'px';
        overlay.style.color = storyTextColor;
        if (storyTextBg) {
            overlay.style.background = 'rgba(0,0,0,0.55)';
            overlay.style.borderRadius = '8px';
            overlay.style.padding = '8px 16px';
        } else {
            overlay.style.background = 'transparent';
        }
    }

    function selectTextColor(el) {
        document.querySelectorAll('.text-ctrl-color').forEach(function(c) { c.classList.remove('active'); });
        el.classList.add('active');
        storyTextColor = el.getAttribute('data-tcolor');
        updateTextStyle();
    }

    function toggleTextBg() {
        storyTextBg = !storyTextBg;
        var btn = document.getElementById('textBgToggle');
        if (storyTextBg) btn.classList.add('active');
        else btn.classList.remove('active');
        updateTextStyle();
    }

    // Draggable + Pinch-to-zoom text overlay logic (touch + mouse)
    (function() {
        var overlay, container;
        var isDragging = false;
        var startX, startY, startLeft, startTop;
        // Pinch-to-zoom state
        var isPinching = false;
        var pinchStartDist = 0;
        var pinchStartSize = 20;

        function getOverlayEls() {
            overlay = document.getElementById('storyTextOverlay');
            container = document.getElementById('mediaPreviewArea');
        }

        function getTouchDistance(touches) {
            var dx = touches[0].clientX - touches[1].clientX;
            var dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function pointerDown(clientX, clientY) {
            getOverlayEls();
            if (!overlay || overlay.style.display === 'none') return;
            isDragging = true;
            overlay.classList.add('dragging');
            var rect = container.getBoundingClientRect();
            startX = clientX;
            startY = clientY;
            startLeft = overlay.offsetLeft;
            startTop = overlay.offsetTop;
        }

        function pointerMove(clientX, clientY) {
            if (!isDragging || isPinching) return;
            getOverlayEls();
            var rect = container.getBoundingClientRect();
            var dx = clientX - startX;
            var dy = clientY - startY;
            var newLeft = startLeft + dx;
            var newTop = startTop + dy;
            // Clamp to container bounds
            newLeft = Math.max(0, Math.min(newLeft, rect.width - overlay.offsetWidth));
            newTop = Math.max(0, Math.min(newTop, rect.height - overlay.offsetHeight));
            overlay.style.left = newLeft + 'px';
            overlay.style.top = newTop + 'px';
            overlay.style.transform = 'none';
            // Store as percentage for submission
            storyTextPosX = Math.round((newLeft / rect.width) * 100);
            storyTextPosY = Math.round((newTop / rect.height) * 100);
        }

        function pointerUp() {
            isDragging = false;
            isPinching = false;
            if (overlay) overlay.classList.remove('dragging');
        }

        document.addEventListener('mousedown', function(e) {
            if (e.target.id === 'storyTextOverlay' || e.target.closest('#storyTextOverlay')) {
                e.preventDefault();
                pointerDown(e.clientX, e.clientY);
            }
        });
        document.addEventListener('mousemove', function(e) {
            if (isDragging) { e.preventDefault(); pointerMove(e.clientX, e.clientY); }
        });
        document.addEventListener('mouseup', pointerUp);

        document.addEventListener('touchstart', function(e) {
            var isOverlay = e.target.id === 'storyTextOverlay' || e.target.closest('#storyTextOverlay');
            if (!isOverlay) return;
            e.preventDefault();
            getOverlayEls();
            if (!overlay || overlay.style.display === 'none') return;

            if (e.touches.length === 2) {
                // Start pinch-to-zoom
                isPinching = true;
                isDragging = false;
                pinchStartDist = getTouchDistance(e.touches);
                pinchStartSize = storyTextSize;
            } else if (e.touches.length === 1) {
                // Single finger drag
                isPinching = false;
                var t = e.touches[0];
                pointerDown(t.clientX, t.clientY);
            }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            getOverlayEls();
            if (!overlay || overlay.style.display === 'none') return;

            if (isPinching && e.touches.length === 2) {
                e.preventDefault();
                var currentDist = getTouchDistance(e.touches);
                var scale = currentDist / pinchStartDist;
                var newSize = Math.round(pinchStartSize * scale);
                newSize = Math.max(12, Math.min(72, newSize));
                storyTextSize = newSize;
                overlay.style.fontSize = newSize + 'px';
                // Sync slider
                var slider = document.getElementById('textSizeSlider');
                if (slider) slider.value = Math.min(newSize, parseInt(slider.max));
            } else if (isDragging && !isPinching && e.touches.length === 1) {
                e.preventDefault();
                var t = e.touches[0];
                pointerMove(t.clientX, t.clientY);
            }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            if (e.touches.length < 2) isPinching = false;
            if (e.touches.length === 0) pointerUp();
        });
        document.addEventListener('touchcancel', pointerUp);
    })();

    // ======== WEBVIEW FILE INPUT FIX ========
    // File inputs are now placed INSIDE the upload buttons as transparent overlays.
    // This ensures they work natively in WebView without needing programmatic .click().

    function showToast(msg) {
        var t = document.getElementById('toastEl');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function selectStoryColor(color) {
        selectedStoryColor = color;
        document.querySelectorAll('.story-color-opt').forEach(function(btn) {
            var icon = btn.querySelector('.fa-check');
            if (btn.getAttribute('data-color') === color) {
                btn.classList.add('selected');
                if (icon) icon.classList.remove('hidden');
            } else {
                btn.classList.remove('selected');
                if (icon) icon.classList.add('hidden');
            }
        });
    }

    function isImageFile(file) {
        if (file.type && file.type.startsWith('image/')) return true;
        var name = (file.name || '').toLowerCase();
        return /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif|avif|tiff?)$/i.test(name);
    }

    function isVideoFile(file) {
        if (file.type && file.type.startsWith('video/')) return true;
        var name = (file.name || '').toLowerCase();
        return /\.(mp4|mov|webm|avi|mkv|3gp|ogv|flv|wmv|mpeg?)$/i.test(name);
    }

    function handleMediaSelect(input, type) {
        if (!input.files || !input.files[0]) return;
        var file = input.files[0];
        if (type === 'image' && !isImageFile(file)) {
            showToast('يرجى اختيار ملف صورة صالح');
            input.value = '';
            return;
        }
        if (type === 'video' && !isVideoFile(file)) {
            showToast('يرجى اختيار ملف فيديو صالح');
            input.value = '';
            return;
        }
        selectedMediaFile = file;
        selectedMediaType = type;
        try {
            var url = URL.createObjectURL(file);
        } catch(e) {
            console.error('Error creating preview URL:', e);
            showToast('تعذر معاينة الملف');
            return;
        }
        var previewArea = document.getElementById('mediaPreviewArea');
        var imgEl = document.getElementById('previewImage');
        var vidEl = document.getElementById('previewVideo');
        var buttonsArea = document.getElementById('uploadButtonsArea');
        var badge = document.getElementById('mediaTypeBadge');
        var badgeIcon = document.getElementById('badgeIcon');
        var badgeText = document.getElementById('badgeText');
        buttonsArea.style.display = 'none';
        previewArea.style.display = 'block';
        if (type === 'video') {
            imgEl.style.display = 'none';
            vidEl.style.display = 'block';
            vidEl.style.background = '#000';
            vidEl.src = url;
            vidEl.load();
            vidEl.play().catch(function() {});
            badgeIcon.className = 'fas fa-video';
            badgeText.textContent = 'فيديو';
        } else {
            vidEl.style.display = 'none';
            vidEl.pause();
            vidEl.removeAttribute('src');
            imgEl.style.display = 'block';
            imgEl.src = url;
            badgeIcon.className = 'fas fa-image';
            badgeText.textContent = 'صورة';
        }
        badge.style.display = 'flex';
        // Show text overlay if text exists
        updateTextOverlay();
    }

    function clearMedia() {
        var previewArea = document.getElementById('mediaPreviewArea');
        var imgEl = document.getElementById('previewImage');
        var vidEl = document.getElementById('previewVideo');
        var buttonsArea = document.getElementById('uploadButtonsArea');
        var badge = document.getElementById('mediaTypeBadge');
        vidEl.pause();
        vidEl.removeAttribute('src');
        vidEl.load();
        vidEl.style.display = 'none';
        imgEl.style.display = 'none';
        imgEl.removeAttribute('src');
        previewArea.style.display = 'none';
        badge.style.display = 'none';
        buttonsArea.style.display = 'flex';
        document.getElementById('storyImageInput').value = '';
        document.getElementById('storyVideoInput').value = '';
        selectedMediaFile = null;
        selectedMediaType = null;
        // Reset text overlay
        var overlay = document.getElementById('storyTextOverlay');
        if (overlay) { overlay.style.display = 'none'; overlay.style.left = '50%'; overlay.style.top = '50%'; overlay.style.transform = 'translate(-50%,-50%)'; }
        document.getElementById('textControlsBar').classList.remove('active');
        storyTextPosX = 50;
        storyTextPosY = 50;
    }

    function debounceSearch(query) {
        clearTimeout(searchTimeout);
        var resultsDiv = document.getElementById('musicSearchResults');
        if (!query.trim()) { resultsDiv.innerHTML = ''; return; }
        resultsDiv.innerHTML = '<div class="text-white text-center py-3"><i class="fas fa-circle-notch fa-spin text-xl"></i> جاري البحث...</div>';
        searchTimeout = setTimeout(function() { executeMusicSearch(query); }, 600);
    }

    async function executeMusicSearch(query) {
        var resultsDiv = document.getElementById('musicSearchResults');
        try {
            var res = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=music&limit=10');
            var data = await res.json();
            resultsDiv.innerHTML = '';
            if (!data.results || data.results.length === 0) {
                resultsDiv.innerHTML = '<div class="text-gray-400 text-center py-2 text-sm">لا توجد نتائج</div>';
                return;
            }
            data.results.forEach(function(track) {
                if (!track.previewUrl) return;
                var safeTrackName = (track.trackName || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                var artworkUrl = track.artworkUrl60 || track.artworkUrl30 || '';
                var div = document.createElement('div');
                div.className = "flex items-center justify-between bg-black/40 p-2.5 rounded-xl hover:bg-white/10 transition border border-white/5";
                div.innerHTML = '<div class="flex items-center gap-3 overflow-hidden">' +
                    '<button onclick="togglePreviewPlay(\'' + track.previewUrl + '\', this, event)" class="preview-play-btn w-8 h-8 flex-shrink-0 bg-white/15 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition"><i class="fas fa-play text-xs"></i></button>' +
                    '<img src="' + artworkUrl + '" class="w-9 h-9 rounded-lg shadow-md">' +
                    '<div class="flex flex-col overflow-hidden"><span class="text-white text-xs font-bold truncate w-28">' + (track.trackName || '') + '</span><span class="text-gray-400 text-xs truncate w-28">' + (track.artistName || '') + '</span></div></div>' +
                    '<button onclick="selectTrack(\'' + track.previewUrl + '\', \'' + safeTrackName + '\', event)" class="bg-white text-black rounded-full px-3.5 py-1 text-xs font-bold shrink-0 hover:bg-gray-200 active:scale-95 transition-transform">دمج</button>';
                resultsDiv.appendChild(div);
            });
        } catch (e) {
            resultsDiv.innerHTML = '<div class="text-red-400 text-center py-2 text-sm">حدث خطأ في جلب الموسيقى</div>';
        }
    }

    function togglePreviewPlay(url, btnElement, event) {
        event.stopPropagation();
        document.querySelectorAll('.preview-play-btn').forEach(function(btn) {
            btn.innerHTML = '<i class="fas fa-play text-xs"></i>';
        });
        if (currentPlayingUrl === url && !previewAudio.paused) {
            previewAudio.pause();
            btnElement.innerHTML = '<i class="fas fa-play text-xs"></i>';
        } else {
            previewAudio.src = url;
            previewAudio.play();
            currentPlayingUrl = url;
            btnElement.innerHTML = '<i class="fas fa-pause text-xs"></i>';
        }
    }

    async function selectTrack(previewUrl, trackName, event) {
        if (event) event.stopPropagation();
        previewAudio.pause();
        document.getElementById('musicSearchResults').innerHTML = '';
        document.getElementById('musicSearchInput').value = '';
        document.getElementById('selectedTrackName').textContent = trackName;
        document.getElementById('selectedTrackUI').style.display = 'flex';
        try {
            var res = await fetch(previewUrl);
            selectedAudioBlob = await res.blob();
        } catch (e) {
            showToast("تعذر تحميل المقطع الصوتي");
            clearSelectedTrack();
        }
    }

    function clearSelectedTrack() {
        selectedAudioBlob = null;
        document.getElementById('selectedTrackUI').style.display = 'none';
    }

    // Aggressive client-side image compression - very small files for fast upload
    async function compressImage(file, maxWidth, maxHeight, quality) {
        maxWidth = maxWidth || 800;
        maxHeight = maxHeight || 800;
        quality = quality || 0.45;
        if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
        return new Promise(function(resolve) {
            var img = new Image();
            img.onload = function() {
                var w = img.width, h = img.height;
                var ratio = Math.min(maxWidth / w, maxHeight / h, 1);
                var newW = Math.round(w * ratio);
                var newH = Math.round(h * ratio);
                var canvas = document.createElement('canvas');
                canvas.width = newW;
                canvas.height = newH;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, newW, newH);
                canvas.toBlob(function(blob) {
                    resolve(blob ? new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg', lastModified: Date.now() }) : file);
                }, 'image/jpeg', quality);
            };
            img.onerror = function() { resolve(file); };
            var objUrl = URL.createObjectURL(file);
            img.src = objUrl;
        });
    }

    // رفع ملف مباشرة إلى ImageKit باستخدام مصادقة من السيرفر مع شريط تقدم
    var _storyUploadBtn = null;
    async function uploadToImageKit(file, resourceType) {
        // 1. Get auth from server
        var authRes = await fetch('/api/imagekit/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ folder: 'stories', resource_type: resourceType }),
            credentials: 'same-origin'
        });
        var authData = await authRes.json();
        if (!authData.ok) throw new Error(authData.error || 'فشل في الحصول على مصادقة الرفع');

        // 2. Upload directly to ImageKit
        var fd = new FormData();
        fd.append('file', file);
        fd.append('publicKey', authData.publicKey);
        fd.append('signature', authData.signature);
        fd.append('expire', authData.expire);
        fd.append('token', authData.token);
        fd.append('folder', authData.folder);
        fd.append('fileName', Date.now() + '-' + (file.name || 'file'));

        var uploadUrl = 'https://upload.imagekit.io/api/v1/files/upload';

        // Use XMLHttpRequest for upload progress tracking
        return new Promise(function(resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', uploadUrl, true);
            xhr.timeout = 120000;
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable && _storyUploadBtn) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    _storyUploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الرفع ' + pct + '%';
                }
            };
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var uploadData = JSON.parse(xhr.responseText);
                        if (uploadData.error) return reject(new Error(uploadData.error || 'فشل رفع الملف'));
                        resolve(uploadData.url);
                    } catch(e) { reject(new Error('استجابة غير صالحة من خدمة الرفع')); }
                } else {
                    reject(new Error('فشل رفع الملف (HTTP ' + xhr.status + ')'));
                }
            };
            xhr.onerror = function() { reject(new Error('خطأ في الاتصال أثناء الرفع')); };
            xhr.ontimeout = function() { reject(new Error('انتهت مهلة الرفع - حاول مرة أخرى')); };
            xhr.send(fd);
        });
    }

    async function submitStory(btn) {
        var textInput = document.getElementById('storyTextInput');
        var errorMessage = document.getElementById('errorMessage');
        errorMessage.style.display = 'none';
        if (!selectedMediaFile) {
            errorMessage.textContent = "يجب اختيار صورة أو فيديو للقصة!";
            errorMessage.style.display = 'block';
            return;
        }
        btn.disabled = true;
        var originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري رفع الملف...';
        _storyUploadBtn = btn;

        try {
            // Step 1: Compress image if needed, then upload to ImageKit
            var mediaResourceType = selectedMediaType === 'video' ? 'video' : 'image';
            var fileToUpload = selectedMediaFile;
            if (mediaResourceType === 'image') {
                btn.innerHTML = '<i class="fas fa-compress"></i> جاري الضغط...';
                fileToUpload = await compressImage(selectedMediaFile);
            }
            var mediaUrl = await uploadToImageKit(fileToUpload, mediaResourceType);

            // Step 2: Upload audio if selected
            var audioUrl = null;
            if (selectedAudioBlob) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري رفع الموسيقى...';
                audioUrl = await uploadToImageKit(
                    new File([selectedAudioBlob], "story_music.m4a", { type: selectedAudioBlob.type || "audio/mp4" }),
                    'video'
                );
            }

            // Step 3: Send URLs to server (small JSON, no file - bypasses Vercel limit)
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النشر...';
            var res = await fetch('/api/stories/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mediaUrl: mediaUrl,
                    mediaType: selectedMediaType,
                    audioUrl: audioUrl,
                    text: textInput.value,
                    story_color: selectedStoryColor,
                    text_x: storyTextPosX,
                    text_y: storyTextPosY,
                    text_size: storyTextSize,
                    text_color: storyTextColor,
                    text_bg: storyTextBg
                }),
                credentials: 'same-origin'
            });

            var data;
            var contentType = res.headers.get('content-type') || '';
            if (contentType.indexOf('application/json') !== -1) {
                data = await res.json();
            } else {
                data = { ok: false, error: 'استجابة غير متوقعة من الخادم (HTTP ' + res.status + ')' };
            }

            if (res.ok && data.ok) {
                showToast("تم نشر القصة بنجاح!");
                setTimeout(function() { window.location.href = '/chat_list'; }, 800);
            } else {
                errorMessage.textContent = data.error || "فشل النشر (HTTP " + res.status + ")";
                errorMessage.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        } catch (e) {
            errorMessage.textContent = "خطأ: " + (e.message || e);
            errorMessage.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }
</script>

  function hideSkeleton() {
    sk.classList.add('hidden');
    setTimeout(function(){ sk.style.display = 'none'; }, 400);
  }
  // Hide on DOMContentLoaded + small delay for data fetch
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(hideSkeleton, 600);
  } else {
    window.addEventListener('DOMContentLoaded', function(){ setTimeout(hideSkeleton, 600); });
  }
  // Fallback: max 4 seconds
  setTimeout(hideSkeleton, 4000);
})();

</script>

<script>
(function(){
  // ===== PWA Full App Install =====
  var DISMISS_KEY = 'aite_install_dismiss_v2';
  var bar = document.getElementById('pwaInstallBar');
  var desc = document.getElementById('pwaBarDesc');
  var btn = document.getElementById('pwaBarInstallBtn');
  var _prompt = null;

  // Is app already running in standalone (installed)?
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  // Was banner dismissed in last 12 hours?
  function wasDismissed() {
    try {
      var t = localStorage.getItem(DISMISS_KEY);
      if (!t) return false;
      return (Date.now() - parseInt(t)) < 12*60*60*1000;
    } catch(e){ return false; }
  }

  // Don't show if already installed or dismissed
  if (isStandalone()) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  // ---- Android / Chrome / Edge / Desktop: Native install ----
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _prompt = e;
    if (!wasDismissed()) {
      bar.style.display = 'block';
    }
  });

  // ---- iOS: Show after delay with custom instructions ----
  if (isIOS && !wasDismissed()) {
    setTimeout(function(){
      if (desc) desc.textContent = 'أضف Aite إلى الشاشة الرئيسية';
      if (btn) btn.textContent = 'إضافة';
      bar.style.display = 'block';
    }, 2500);
  }

  // Install button click
  window.pwaInstallApp = function() {
    if (_prompt) {
      // Native browser install prompt (Android/Chrome/Edge/Desktop)
      _prompt.prompt();
      _prompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          bar.style.display = 'none';
          try { localStorage.removeItem(DISMISS_KEY); } catch(e){}
        }
        _prompt = null;
      });
    } else if (isIOS) {
      // Show iOS step-by-step instructions
      var ov = document.createElement('div');
      ov.id = 'iosInstallOverlay';
      ov.innerHTML = '<div class="ios-install-box">'
        + '<img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin:0 auto 14px;display:block;">'
        + '<h3 style="color:#fff;font-size:19px;font-weight:700;margin:0 0 6px;">تثبيت Aite</h3>'
        + '<p style="color:#9ca3af;font-size:13px;margin:0 0 18px;">اتبع الخطوات التالية لتثبيت التطبيق:</p>'
        + '<div class="ios-step">1. اضغط على أيقونة المشاركة <span style="font-size:17px;">⬆️</span> في شريط Safari</div>'
        + '<div class="ios-step">2. اختر <b style="color:#fff;">"إضافة إلى الشاشة الرئيسية"</b> <span style="font-size:15px;">📱</span></div>'
        + '<div class="ios-step">3. اضغط <b style="color:#fff;">"إضافة"</b> في الأعلى</div>'
        + '<button onclick="this.closest('#iosInstallOverlay').remove()" style="margin-top:18px;background:#3b82f6;color:#fff;border:none;padding:11px 34px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">فهمت</button>'
        + '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target===ov) ov.remove(); });
    }
  };

  // Dismiss for 12 hours
  window.pwaDismiss = function() {
    bar.style.display = 'none';
    try { localStorage.setItem(DISMISS_KEY, Date.now().toString()); } catch(e){}
  };

  // Auto-hide on successful install
  window.addEventListener('appinstalled', function() {
    bar.style.display = 'none';
    _prompt = null;
  });
})();
</script>

<!-- Page Transition Loading Bar -->
<div id="aite-page-loader"></div>
<script>
(function(){
  var loader = document.getElementById('aite-page-loader');
  if (!loader) return;
  // Only show in PWA standalone mode, not in WebView or normal browser
  var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isPWA) return;
  var isNavigating = false;

  function startLoader() {
    if (isNavigating) return;
    isNavigating = true;
    loader.style.width = '0';
    loader.classList.add('active');
    // Force reflow
    void loader.offsetWidth;
    loader.style.width = '70%';
    setTimeout(function(){ if (isNavigating) loader.style.width = '85%'; }, 500);
    setTimeout(function(){ if (isNavigating) loader.style.width = '92%'; }, 1500);
  }

  // Intercept all link clicks
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    if (link.target === '_blank') return;
    startLoader();
  });

  // Also trigger on form submissions and programmatic navigation
  window.addEventListener('beforeunload', function() {
    startLoader();
  });

  // Complete the bar when page loads
  window.addEventListener('pageshow', function() {
    if (loader.classList.contains('active')) {
      loader.style.transition = 'width 0.2s ease-out';
      loader.style.width = '100%';
      setTimeout(function(){
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(function(){
          loader.classList.remove('active');
          loader.style.width = '0';
          loader.style.transition = 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
          loader.style.opacity = '';
          isNavigating = false;
        }, 300);
      }, 200);
    }
  });
})();
</script>
