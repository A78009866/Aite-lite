<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>إنشاء قصة جديدة - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .glass-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }
        .upload-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; flex: 1; padding: 28px 16px; border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.02);
            cursor: pointer; transition: all 0.3s ease;
        }
        .upload-btn:hover { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.05); }
        .upload-btn:active { transform: scale(0.97); }
        .upload-btn .icon-circle {
            width: 52px; height: 52px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .media-preview-area {
            position: relative; width: 100%; border-radius: 20px; overflow: hidden;
            background: #000; border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .media-preview-area img {
            width: 100%; max-height: 340px; object-fit: contain; display: block; background: #000;
        }
        .media-preview-area video {
            width: 100%; max-height: 340px; object-fit: contain; display: block; background: #000;
        }
        .media-preview-area video::-webkit-media-controls-panel { background: transparent; }
        .remove-media-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            color: white; width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.15); z-index: 5;
        }
        .remove-media-btn:hover { background: rgba(239, 68, 68, 0.9); border-color: transparent; transform: scale(1.1); }
        .media-type-badge {
            position: absolute; bottom: 12px; left: 12px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            color: #fff; padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 5px;
        }
        .section-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 20px; transition: all 0.3s ease;
        }
        .section-card:hover { border-color: rgba(255, 255, 255, 0.12); }
        .story-color-opt {
            transition: all 0.2s ease; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .story-color-opt:hover { transform: scale(1.15); }
        .story-color-opt.selected {
            border-color: #fff !important; transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: #fff; border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
        .submit-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .glass-input {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.6); border-color: rgba(255, 255, 255, 0.25);
            outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .glass-input::placeholder { color: #555; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #333; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background-color: transparent; }
        .toast {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 30px;
            background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px 24px;
            border-radius: 14px; z-index: 2000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            font-weight: 600; opacity: 0; transition: opacity 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none;
        }
        .toast.show { opacity: 1; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 3s linear infinite; }
    </style>
</head>
<body class="min-h-screen flex items-start justify-center p-4 pt-6 pb-10">
    <div class="glass-panel p-6 sm:p-8 rounded-[2rem] w-full max-w-lg relative z-10">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
            <a href="/chat_list" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/5 transition duration-300" title="العودة">
                <i class="fas fa-arrow-right text-lg"></i>
            </a>
            <h1 class="text-xl font-bold text-white tracking-wide flex items-center gap-2">
                <i class="fas fa-plus-circle text-blue-400"></i>
                قصة جديدة
            </h1>
            <div class="w-10"></div>
        </div>

        <!-- Upload Buttons -->
        <div id="uploadButtonsArea" class="flex gap-3 mb-5">
            <div class="upload-btn" onclick="document.getElementById('storyImageInput').click()">
                <div class="icon-circle bg-gradient-to-br from-pink-500/20 to-purple-500/20 border border-pink-500/30">
                    <i class="fas fa-image text-pink-400"></i>
                </div>
                <span class="text-white font-bold text-sm">اختر صورة</span>
                <span class="text-gray-500 text-xs">JPG, PNG, WEBP</span>
            </div>
            <div class="upload-btn" onclick="document.getElementById('storyVideoInput').click()">
                <div class="icon-circle bg-gradient-to-br from-blue-500/20 to-cyan-500/20 border border-blue-500/30">
                    <i class="fas fa-video text-blue-400"></i>
                </div>
                <span class="text-white font-bold text-sm">اختر فيديو</span>
                <span class="text-gray-500 text-xs">MP4, MOV, WEBM</span>
            </div>
        </div>
        <input type="file" id="storyImageInput" accept="image/*" class="hidden" onchange="handleMediaSelect(this, 'image')">
        <input type="file" id="storyVideoInput" accept="video/*" class="hidden" onchange="handleMediaSelect(this, 'video')">

        <!-- Media Preview -->
        <div id="mediaPreviewArea" class="media-preview-area mb-5" style="display:none;">
            <img id="previewImage" style="display:none;">
            <video id="previewVideo" style="display:none; background:#000;" muted loop playsinline></video>
            <button type="button" onclick="clearMedia()" class="remove-media-btn" title="إزالة">
                <i class="fas fa-times text-sm"></i>
            </button>
            <div id="mediaTypeBadge" class="media-type-badge" style="display:none;">
                <i id="badgeIcon" class="fas fa-image"></i>
                <span id="badgeText">صورة</span>
            </div>
        </div>

        <!-- Text Input -->
        <div class="mb-5">
            <input type="text" id="storyTextInput" placeholder="أضف تعليقاً على القصة..." class="glass-input w-full rounded-2xl py-3.5 px-5 text-sm">
        </div>

        <!-- Music Section -->
        <div class="section-card mb-5">
            <div class="flex items-center gap-2 mb-4 text-white">
                <i class="fas fa-music text-blue-400 text-lg"></i>
                <h3 class="font-bold text-sm">أضف موسيقى</h3>
            </div>
            <div class="mb-3">
                <input type="text" id="musicSearchInput" oninput="debounceSearch(this.value)" placeholder="ابحث عن أغنية أو فنان..." class="glass-input w-full rounded-xl px-4 py-2.5 text-sm">
            </div>
            <div id="selectedTrackUI" style="display:none;" class="items-center justify-between bg-gradient-to-r from-green-500/20 to-emerald-600/20 border border-green-500/40 rounded-xl p-3 mb-3">
                <div class="flex items-center gap-2 overflow-hidden">
                    <i class="fas fa-compact-disc text-green-400 animate-spin-slow"></i>
                    <span id="selectedTrackName" class="text-white text-sm font-bold truncate px-1"></span>
                </div>
                <button onclick="clearSelectedTrack()" class="text-white hover:text-red-400 px-2 transition-colors">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            <div id="musicSearchResults" class="max-h-44 overflow-y-auto flex flex-col gap-2 rounded-xl custom-scroll"></div>
        </div>

        <!-- Color Picker -->
        <div class="section-card mb-6">
            <div class="flex items-center gap-2 mb-4 text-white">
                <i class="fas fa-palette text-purple-400 text-lg"></i>
                <h3 class="font-bold text-sm">لون الدائرة</h3>
            </div>
            <div id="storyColorPicker" class="flex flex-wrap justify-center gap-3">
                <button type="button" onclick="selectStoryColor('')" class="story-color-opt selected w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);" data-color="" title="افتراضي"><i class="fas fa-check text-white text-xs"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #f093fb 0%, #f5576c 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #f093fb 0%, #f5576c 100%);" data-color="linear-gradient(135deg, #f093fb 0%, #f5576c 100%)" title="وردي"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);" data-color="linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)" title="أخضر فاتح"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #fa709a 0%, #fee140 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #fa709a 0%, #fee140 100%);" data-color="linear-gradient(135deg, #fa709a 0%, #fee140 100%)" title="برتقالي"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);" data-color="linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)" title="بنفسجي"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #f6d365 0%, #fda085 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #f6d365 0%, #fda085 100%);" data-color="linear-gradient(135deg, #f6d365 0%, #fda085 100%)" title="ذهبي"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #667eea 0%, #764ba2 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);" data-color="linear-gradient(135deg, #667eea 0%, #764ba2 100%)" title="نيلي"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #ff0844 0%, #ffb199 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #ff0844 0%, #ffb199 100%);" data-color="linear-gradient(135deg, #ff0844 0%, #ffb199 100%)" title="أحمر فاتح"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #ef4444 0%, #dc2626 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #ef4444 0%, #dc2626 100%);" data-color="linear-gradient(135deg, #ef4444 0%, #dc2626 100%)" title="أحمر"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #22c55e 0%, #16a34a 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);" data-color="linear-gradient(135deg, #22c55e 0%, #16a34a 100%)" title="أخضر"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #1f2937 0%, #111827 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #1f2937 0%, #111827 100%);" data-color="linear-gradient(135deg, #1f2937 0%, #111827 100%)" title="أسود"><i class="fas fa-check text-white text-xs hidden"></i></button>
                <button type="button" onclick="selectStoryColor('linear-gradient(135deg, #9ca3af 0%, #6b7280 100%)')" class="story-color-opt w-9 h-9 rounded-full border-2 border-white/30" style="background:linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);" data-color="linear-gradient(135deg, #9ca3af 0%, #6b7280 100%)" title="رمادي"><i class="fas fa-check text-white text-xs hidden"></i></button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="text-red-400 bg-red-900/10 border border-red-900/20 rounded-xl p-3 mb-4 text-center text-sm" style="display:none;"></div>

        <!-- Submit Button -->
        <button id="submitStoryBtn" onclick="submitStory(this)" class="submit-btn w-full rounded-2xl py-4 font-bold text-base flex items-center justify-center gap-2">
            <i class="fas fa-paper-plane text-sm"></i>
            <span>نشر القصة</span>
        </button>
    </div>

    <div id="toastEl" class="toast"></div>

<script>
    var selectedStoryColor = '';
    var selectedAudioBlob = null;
    var selectedMediaFile = null;
    var selectedMediaType = null;
    var previewAudio = new Audio();
    var currentPlayingUrl = '';
    var searchTimeout;

    function showToast(msg) {
        var t = document.getElementById('toastEl');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function selectStoryColor(color) {
        selectedStoryColor = color;
        document.querySelectorAll('.story-color-opt').forEach(function(btn) {
            var icon = btn.querySelector('.fa-check');
            if (btn.getAttribute('data-color') === color) {
                btn.classList.add('selected');
                if (icon) icon.classList.remove('hidden');
            } else {
                btn.classList.remove('selected');
                if (icon) icon.classList.add('hidden');
            }
        });
    }

    function handleMediaSelect(input, type) {
        if (!input.files || !input.files[0]) return;
        var file = input.files[0];
        if (type === 'image' && !file.type.startsWith('image/')) {
            showToast('يرجى اختيار ملف صورة صالح');
            input.value = '';
            return;
        }
        if (type === 'video' && !file.type.startsWith('video/')) {
            showToast('يرجى اختيار ملف فيديو صالح');
            input.value = '';
            return;
        }
        selectedMediaFile = file;
        selectedMediaType = type;
        var url = URL.createObjectURL(file);
        var previewArea = document.getElementById('mediaPreviewArea');
        var imgEl = document.getElementById('previewImage');
        var vidEl = document.getElementById('previewVideo');
        var buttonsArea = document.getElementById('uploadButtonsArea');
        var badge = document.getElementById('mediaTypeBadge');
        var badgeIcon = document.getElementById('badgeIcon');
        var badgeText = document.getElementById('badgeText');
        buttonsArea.style.display = 'none';
        previewArea.style.display = 'block';
        if (type === 'video') {
            imgEl.style.display = 'none';
            vidEl.style.display = 'block';
            vidEl.style.background = '#000';
            vidEl.src = url;
            vidEl.load();
            vidEl.play().catch(function() {});
            badgeIcon.className = 'fas fa-video';
            badgeText.textContent = 'فيديو';
        } else {
            vidEl.style.display = 'none';
            vidEl.pause();
            vidEl.removeAttribute('src');
            imgEl.style.display = 'block';
            imgEl.src = url;
            badgeIcon.className = 'fas fa-image';
            badgeText.textContent = 'صورة';
        }
        badge.style.display = 'flex';
    }

    function clearMedia() {
        var previewArea = document.getElementById('mediaPreviewArea');
        var imgEl = document.getElementById('previewImage');
        var vidEl = document.getElementById('previewVideo');
        var buttonsArea = document.getElementById('uploadButtonsArea');
        var badge = document.getElementById('mediaTypeBadge');
        vidEl.pause();
        vidEl.removeAttribute('src');
        vidEl.load();
        vidEl.style.display = 'none';
        imgEl.style.display = 'none';
        imgEl.removeAttribute('src');
        previewArea.style.display = 'none';
        badge.style.display = 'none';
        buttonsArea.style.display = 'flex';
        document.getElementById('storyImageInput').value = '';
        document.getElementById('storyVideoInput').value = '';
        selectedMediaFile = null;
        selectedMediaType = null;
    }

    function debounceSearch(query) {
        clearTimeout(searchTimeout);
        var resultsDiv = document.getElementById('musicSearchResults');
        if (!query.trim()) { resultsDiv.innerHTML = ''; return; }
        resultsDiv.innerHTML = '<div class="text-white text-center py-3"><i class="fas fa-circle-notch fa-spin text-xl"></i> جاري البحث...</div>';
        searchTimeout = setTimeout(function() { executeMusicSearch(query); }, 600);
    }

    async function executeMusicSearch(query) {
        var resultsDiv = document.getElementById('musicSearchResults');
        try {
            var res = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=music&limit=10');
            var data = await res.json();
            resultsDiv.innerHTML = '';
            if (!data.results || data.results.length === 0) {
                resultsDiv.innerHTML = '<div class="text-gray-400 text-center py-2 text-sm">لا توجد نتائج</div>';
                return;
            }
            data.results.forEach(function(track) {
                if (!track.previewUrl) return;
                var safeTrackName = (track.trackName || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                var artworkUrl = track.artworkUrl60 || track.artworkUrl30 || '';
                var div = document.createElement('div');
                div.className = "flex items-center justify-between bg-black/40 p-2.5 rounded-xl hover:bg-white/10 transition border border-white/5";
                div.innerHTML = '<div class="flex items-center gap-3 overflow-hidden">' +
                    '<button onclick="togglePreviewPlay(\'' + track.previewUrl + '\', this, event)" class="preview-play-btn w-8 h-8 flex-shrink-0 bg-white/15 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition"><i class="fas fa-play text-xs"></i></button>' +
                    '<img src="' + artworkUrl + '" class="w-9 h-9 rounded-lg shadow-md">' +
                    '<div class="flex flex-col overflow-hidden"><span class="text-white text-xs font-bold truncate w-28">' + (track.trackName || '') + '</span><span class="text-gray-400 text-xs truncate w-28">' + (track.artistName || '') + '</span></div></div>' +
                    '<button onclick="selectTrack(\'' + track.previewUrl + '\', \'' + safeTrackName + '\', event)" class="bg-white text-black rounded-full px-3.5 py-1 text-xs font-bold shrink-0 hover:bg-gray-200 active:scale-95 transition-transform">دمج</button>';
                resultsDiv.appendChild(div);
            });
        } catch (e) {
            resultsDiv.innerHTML = '<div class="text-red-400 text-center py-2 text-sm">حدث خطأ في جلب الموسيقى</div>';
        }
    }

    function togglePreviewPlay(url, btnElement, event) {
        event.stopPropagation();
        document.querySelectorAll('.preview-play-btn').forEach(function(btn) {
            btn.innerHTML = '<i class="fas fa-play text-xs"></i>';
        });
        if (currentPlayingUrl === url && !previewAudio.paused) {
            previewAudio.pause();
            btnElement.innerHTML = '<i class="fas fa-play text-xs"></i>';
        } else {
            previewAudio.src = url;
            previewAudio.play();
            currentPlayingUrl = url;
            btnElement.innerHTML = '<i class="fas fa-pause text-xs"></i>';
        }
    }

    async function selectTrack(previewUrl, trackName, event) {
        if (event) event.stopPropagation();
        previewAudio.pause();
        document.getElementById('musicSearchResults').innerHTML = '';
        document.getElementById('musicSearchInput').value = '';
        document.getElementById('selectedTrackName').textContent = trackName;
        document.getElementById('selectedTrackUI').style.display = 'flex';
        try {
            var res = await fetch(previewUrl);
            selectedAudioBlob = await res.blob();
        } catch (e) {
            showToast("تعذر تحميل المقطع الصوتي");
            clearSelectedTrack();
        }
    }

    function clearSelectedTrack() {
        selectedAudioBlob = null;
        document.getElementById('selectedTrackUI').style.display = 'none';
    }

    // رفع ملف مباشرة إلى Cloudinary باستخدام توقيع من السيرفر
    async function uploadToCloudinary(file, resourceType) {
        // 1. Get signature from server
        var signRes = await fetch('/api/cloudinary/sign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ folder: 'stories', resource_type: resourceType }),
            credentials: 'same-origin'
        });
        var signData = await signRes.json();
        if (!signData.ok) throw new Error(signData.error || 'فشل في الحصول على توقيع الرفع');

        // 2. Upload directly to Cloudinary
        var fd = new FormData();
        fd.append('file', file);
        fd.append('api_key', signData.api_key);
        fd.append('timestamp', signData.timestamp);
        fd.append('signature', signData.signature);
        fd.append('folder', signData.folder);

        var uploadUrl = 'https://api.cloudinary.com/v1_1/' + signData.cloud_name + '/' + resourceType + '/upload';
        var uploadRes = await fetch(uploadUrl, { method: 'POST', body: fd });
        var uploadData = await uploadRes.json();

        if (uploadData.error) throw new Error(uploadData.error.message || 'فشل رفع الملف إلى Cloudinary');
        return uploadData.secure_url;
    }

    async function submitStory(btn) {
        var textInput = document.getElementById('storyTextInput');
        var errorMessage = document.getElementById('errorMessage');
        errorMessage.style.display = 'none';
        if (!selectedMediaFile) {
            errorMessage.textContent = "يجب اختيار صورة أو فيديو للقصة!";
            errorMessage.style.display = 'block';
            return;
        }
        btn.disabled = true;
        var originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري رفع الملف...';

        try {
            // Step 1: Upload media directly to Cloudinary
            var mediaResourceType = selectedMediaType === 'video' ? 'video' : 'image';
            var mediaUrl = await uploadToCloudinary(selectedMediaFile, mediaResourceType);

            // Step 2: Upload audio if selected
            var audioUrl = null;
            if (selectedAudioBlob) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري رفع الموسيقى...';
                audioUrl = await uploadToCloudinary(
                    new File([selectedAudioBlob], "story_music.m4a", { type: selectedAudioBlob.type || "audio/mp4" }),
                    'video'
                );
            }

            // Step 3: Send URLs to server (small JSON, no file - bypasses Vercel limit)
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النشر...';
            var res = await fetch('/api/stories/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mediaUrl: mediaUrl,
                    mediaType: selectedMediaType,
                    audioUrl: audioUrl,
                    text: textInput.value,
                    story_color: selectedStoryColor
                }),
                credentials: 'same-origin'
            });

            var data;
            var contentType = res.headers.get('content-type') || '';
            if (contentType.indexOf('application/json') !== -1) {
                data = await res.json();
            } else {
                data = { ok: false, error: 'استجابة غير متوقعة من الخادم (HTTP ' + res.status + ')' };
            }

            if (res.ok && data.ok) {
                showToast("تم نشر القصة بنجاح!");
                setTimeout(function() { window.location.href = '/chat_list'; }, 800);
            } else {
                errorMessage.textContent = data.error || "فشل النشر (HTTP " + res.status + ")";
                errorMessage.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        } catch (e) {
            errorMessage.textContent = "خطأ: " + (e.message || e);
            errorMessage.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }
</script>
