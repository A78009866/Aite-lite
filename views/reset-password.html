<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور — Aite</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(57, 130, 247, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(120, 50, 220, 0.1) 0%, transparent 20%);
            color: #e4e6eb;
            min-height: 100vh;
            overflow-wrap: break-word;
        }
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .input-group input {
            background: rgba(45, 45, 45, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #3982f7 !important;
            background: rgba(45, 45, 45, 0.8) !important;
            box-shadow: 0 0 0 2px rgba(57, 130, 247, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3982f7 0%, #2b61b8 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(57, 130, 247, 0.3); }
        .error-box { background: rgba(255,0,0,0.06); border: 1px solid rgba(255,0,0,0.12); padding: 8px; border-radius: 8px; color: #ffdddd; display: none; margin-bottom: 12px;}
        .success-box { background: rgba(0,200,0,0.06); border: 1px solid rgba(0,200,0,0.12); padding: 8px; border-radius: 8px; color: #ddffdd; display: none; margin-bottom: 12px;}
        .eye-btn {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: #6b7280; cursor: pointer; padding: 4px; z-index: 10;
        }
        .input-password-safe { padding-left: 45px !important; }
        @media (min-width: 768px) { .glass-card { max-width: 480px; } }
        @media (min-width: 1024px) { .glass-card { max-width: 520px; padding: 2.5rem 3rem !important; } }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-3xl p-8 md:p-10">
        <div class="text-center mb-6">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Sond_skyline_from_top_City_Hall_-_Aug_2025.jpg" 
                 class="h-14 w-14 rounded-xl mx-auto mb-4 object-cover shadow-lg shadow-blue-500/20" alt="Aite">
            <h1 class="text-2xl font-bold mb-2 text-white">إعادة تعيين كلمة المرور</h1>
            <p class="text-gray-400 text-sm">أدخل كلمة المرور الجديدة</p>
        </div>

        <div id="errorBox" class="error-box"></div>
        <div id="successBox" class="success-box"></div>

        <div id="formContainer">
            <form id="resetForm" class="space-y-4">
                <div class="input-group space-y-2">
                    <label for="new_password" class="text-sm font-medium text-gray-300 mr-1">كلمة المرور الجديدة</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="new_password" required minlength="6"
                               class="w-full pr-11 pl-12 py-3.5 rounded-xl text-white placeholder-gray-500 outline-none focus:ring-0 input-password-safe" 
                               placeholder="••••••••">
                        <button type="button" class="eye-btn" onclick="togglePassword('new_password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group space-y-2">
                    <label for="confirm_password" class="text-sm font-medium text-gray-300 mr-1">تأكيد كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="confirm_password" required minlength="6"
                               class="w-full pr-11 pl-12 py-3.5 rounded-xl text-white placeholder-gray-500 outline-none focus:ring-0 input-password-safe" 
                               placeholder="••••••••">
                        <button type="button" class="eye-btn" onclick="togglePassword('confirm_password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg mt-2 flex items-center justify-center gap-3">
                    <span id="submitBtnText">تغيير كلمة المرور</span>
                    <i id="submitSpinner" class="fas fa-spinner fa-spin hidden"></i>
                </button>
            </form>
        </div>

        <div id="invalidToken" style="display:none;" class="text-center py-8">
            <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
            <p class="text-gray-300 mb-4">رابط إعادة التعيين غير صالح أو منتهي الصلاحية.</p>
            <a href="/forgot-password" class="btn-primary inline-block py-3 px-6 rounded-xl text-white font-medium">طلب رابط جديد</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');
        const submitSpinner = document.getElementById('submitSpinner');
        const submitBtnText = document.getElementById('submitBtnText');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword.length < 6) { showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل.'); return; }
            if (newPassword !== confirmPassword) { showError('كلمتا المرور غير متطابقتين.'); return; }

            submitBtn.disabled = true;
            submitSpinner.classList.remove('hidden');
            submitBtnText.textContent = 'جاري التغيير...';

            try {
                const resp = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await resp.json();

                if (data.ok) {
                    successBox.textContent = data.message || 'تم تغيير كلمة المرور بنجاح.';
                    successBox.style.display = 'block';
                    document.getElementById('formContainer').innerHTML = '<div class="text-center mt-4"><a href="/login" class="btn-primary inline-block py-3 px-6 rounded-xl text-white font-medium">تسجيل الدخول</a></div>';
                } else {
                    showError(data.error || 'حدث خطأ.');
                    submitBtnText.textContent = 'تغيير كلمة المرور';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showError('فشل في الاتصال بالخادم.');
                submitBtnText.textContent = 'تغيير كلمة المرور';
                submitBtn.disabled = false;
            }
            submitSpinner.classList.add('hidden');
        });

        function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
    </script>
</body>
</html>
