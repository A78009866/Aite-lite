<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الملف الشخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cover-photo {
            height: 200px;
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
        }
        .profile-picture {
            width: 120px;
            height: 120px;
            border: 4px solid #000000;
            object-fit: cover;
            margin-top: -60px;
        }
        .post-card {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="min-h-screen">
        <header class="bg-gray-900 shadow-md p-4 flex justify-between items-center fixed top-0 w-full z-10">
            <a href="/chat_list" class="text-white text-lg"><i class="fas fa-arrow-right"></i></a>
            <h1 class="text-xl font-bold text-white" id="headerUsername">الملف الشخصي</h1>
            <div></div> </header>
        
        <main class="pt-16 pb-16">
            <div id="profileContainer" class="max-w-3xl mx-auto">
                
                <div class="bg-gray-800 shadow-lg rounded-lg overflow-hidden">
                    <div id="coverPhoto" class="cover-photo" style="background-image: url('/assets/default_cover_photo.jpg');"></div>
                    
                    <div class="p-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end">
                            <img id="profilePicture" class="profile-picture rounded-full bg-gray-600" src="/profile_pics/default_profile.png" alt="صورة الملف الشخصي">
                            
                            <div id="actionButtons" class="mt-4 sm:mt-0 flex space-x-2 space-x-reverse">
                                <button id="sendMessageBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1 rounded-full transition duration-150 ease-in-out font-bold hidden">
                                    مراسلة
                                </button>
                                <a id="editProfileBtn" href="/edit_profile" class="bg-gray-700 hover:bg-gray-600 text-white text-sm px-3 py-1 rounded-full transition duration-150 ease-in-out font-bold hidden">
                                    <i class="fas fa-edit ml-1"></i> تعديل
                                </a>
                            </div>
                        </div>
                        
                        <h2 id="fullName" class="text-2xl font-bold mt-4">الاسم الكامل</h2>
                        <p id="username" class="text-gray-400 text-sm">@username</p>
                        
                        <div class="mt-4 border-t border-gray-700 pt-4">
                            <h3 class="text-lg font-semibold mb-2">السيرة الذاتية</h3>
                            <p id="bioText" class="text-gray-300"></p> 
                        </div>
                        
                        <div class="flex space-x-4 space-x-reverse mt-4 text-sm text-gray-400">
                            <p>المنشورات: <span id="postsCount" class="font-bold text-white">0</span></p>
                            </div>
                    </div>
                </div>
                
                <div class="mt-8">
                    <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">منشورات المستخدم</h2>
                    <div id="postsList">
                        <p id="noPostsMessage" class="text-gray-500 text-center py-8 hidden">لا توجد منشورات حتى الآن.</p>
                    </div>
                </div>
            </div>
            
            <div id="loadingError" class="text-red-500 text-center p-4 hidden">
                فشل في تحميل الملف الشخصي. يرجى إعادة المحاولة.
            </div>
        </main>
        
        <nav class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-700 shadow-lg flex justify-around p-3">
            <a href="/chat_list" class="text-gray-400 hover:text-blue-500 flex flex-col items-center">
                <i class="fas fa-comments text-xl"></i>
                <span class="text-xs">الدردشات</span>
            </a>
            <a href="/users_list" class="text-gray-400 hover:text-blue-500 flex flex-col items-center">
                <i class="fas fa-users text-xl"></i>
                <span class="text-xs">المستخدمون</span>
            </a>
            <a href="/profile" class="text-blue-500 flex flex-col items-center">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs">البروفايل</span>
            </a>
        </nav>
        
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const requestedUserId = urlParams.get('userId');
        let currentProfileData = {};

        function getRelativeTime(timestamp) {
            const now = Date.now();
            const seconds = Math.floor((now - timestamp) / 1000);
            
            if (seconds < 60) return `${seconds} ثواني مضت`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقائق مضت`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعات مضت`;
            const days = Math.floor(hours / 24);
            if (days < 30) return `${days} أيام مضت`;
            
            return new Date(timestamp).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function createPostElement(post) {
            const postElement = document.createElement('div');
            postElement.className = 'post-card p-4 rounded-lg shadow-md mb-4';
            
            const user = post.user || { username: 'مستخدم', profile_picture_url: '/profile_pics/default_profile.png' };

            postElement.innerHTML = `
                <div class="flex items-center mb-3">
                    <img src="${user.profile_picture_url || '/profile_pics/default_profile.png'}" alt="صورة بروفايل" class="w-10 h-10 rounded-full object-cover ml-3">
                    <div>
                        <a href="/profile?userId=${post.userId}" class="font-bold text-white">${user.username}</a>
                        <p class="text-gray-500 text-xs">${getRelativeTime(post.timestamp)}</p>
                    </div>
                </div>

                <p class="text-gray-300 mb-3">${post.content}</p>

                ${post.media ? `
                    <div class="my-3 rounded-lg overflow-hidden">
                        ${post.media.type === 'image' ? `<img src="${post.media.url}" alt="صورة المنشور" class="w-full object-cover">` : 
                          post.media.type === 'video' ? `<video src="${post.media.url}" controls class="w-full"></video>` : 
                          post.media.type === 'audio' ? `<audio src="${post.media.url}" controls class="w-full"></audio>` : ''}
                    </div>
                ` : ''}

                <div class="flex justify-between items-center text-sm text-gray-400 border-t border-gray-700 pt-3">
                    <div class="flex space-x-3 space-x-reverse">
                        <button class="like-btn flex items-center hover:text-red-500 transition duration-150 ${post.is_liked ? 'text-red-500' : ''}" data-post-id="${post.postId}" data-is-liked="${post.is_liked}">
                            <i class="fas fa-heart ml-1"></i>
                            <span class="like-count">${post.likes || 0}</span>
                        </button>
                        <button class="comment-btn flex items-center hover:text-blue-500 transition duration-150" data-post-id="${post.postId}">
                            <i class="fas fa-comment-dots ml-1"></i>
                            <span class="comment-count">${post.commentsCount || 0}</span>
                        </button>
                    </div>
                </div>
            `;
            return postElement;
        }

        async function fetchProfileData() {
            try {
                const response = await fetch(`/api/profile${requestedUserId ? `?userId=${requestedUserId}` : ''}`);
                if (!response.ok) throw new Error('Failed to fetch profile data');
                
                const data = await response.json();
                currentProfileData = data;

                // تحديث العناصر
                document.getElementById('pageTitle').textContent = data.full_name || data.username || 'الملف الشخصي';
                document.getElementById('headerUsername').textContent = data.username;
                document.getElementById('fullName').textContent = data.full_name || data.username;
                document.getElementById('username').textContent = `@${data.username}`;
                
                // ✅ عرض الصورة الافتراضية أو صورة المستخدم
                document.getElementById('profilePicture').src = data.profile_picture_url;
                
                if (data.cover_photo_url) {
                    document.getElementById('coverPhoto').style.backgroundImage = `url('${data.cover_photo_url}')`;
                }

                // ✅ عرض السيرة الذاتية (ستكون فارغة إذا لم تكن موجودة)
                document.getElementById('bioText').textContent = data.bio; 

                // عرض أزرار الإجراءات
                const sendMessageBtn = document.getElementById('sendMessageBtn');
                const editProfileBtn = document.getElementById('editProfileBtn');

                if (data.is_owner) {
                    // المستخدم هو المالك، إظهار زر التعديل الصغير وإخفاء المراسلة
                    editProfileBtn.classList.remove('hidden');
                    sendMessageBtn.classList.add('hidden');
                } else {
                    // المستخدم زائر، إظهار زر المراسلة الصغير وإخفاء التعديل
                    sendMessageBtn.classList.remove('hidden');
                    editProfileBtn.classList.add('hidden');
                    
                    // ربط زر المراسلة
                    sendMessageBtn.onclick = () => {
                        window.location.href = `/chat?user_id=${data.id}`;
                    };
                }
                
                fetchUserPosts(data.id);

            } catch (error) {
                console.error('Error in fetchProfileData:', error);
                document.getElementById('loadingError').classList.remove('hidden');
            }
        }

        async function fetchUserPosts(userId) {
            try {
                const response = await fetch(`/api/posts/user/${userId}`);
                if (!response.ok) throw new Error('Failed to fetch user posts');
                
                const data = await response.json();
                const postsList = document.getElementById('postsList');
                postsList.innerHTML = ''; 
                document.getElementById('noPostsMessage').classList.add('hidden');

                document.getElementById('postsCount').textContent = data.posts.length;

                if (data.posts && data.posts.length > 0) {
                    data.posts.forEach(post => {
                        postsList.appendChild(createPostElement(post));
                    });
                } else {
                    document.getElementById('noPostsMessage').classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error in fetchUserPosts:', error);
                document.getElementById('noPostsMessage').textContent = 'فشل في تحميل المنشورات.';
                document.getElementById('noPostsMessage').classList.remove('hidden');
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchProfileData);
    </script>
</body>
</html>
