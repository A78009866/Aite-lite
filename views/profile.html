<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الملف الشخصي - Aite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px; 
        }

        /* **************** أنماط Glassmorphism **************** */
        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .glass-profile-card {
            background-color: rgba(0, 0, 0, 0.4); /* خلفية سوداء شفافة للبطاقة */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* نمط المودال الزجاجي للتعديل */
        .glass-edit-modal-content {
            background-color: rgba(0, 0, 0, 0.85); /* أسود أكثر عمقاً للنافذة */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-modal-bg {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        
        /* نمط بطاقة المنشور الزجاجية الجديدة */
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3); /* خلفية سوداء شفافة */
            backdrop-filter: blur(10px); /* تأثير زجاجي */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); /* حدود بيضاء خفيفة */
        }
        
        /* **************** نهاية أنماط Glassmorphism **************** */

    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
            
            <div class="flex items-center">
                <a href="/chat_list" class="text-gray-400 hover:text-white transition duration-300">
                    <i class="fas fa-arrow-right text-xl"></i>
                </a>
            </div>
            
            <div class="flex-grow flex justify-center">
                <span class="text-3xl font-extrabold text-white tracking-widest app-logo">
                    Aite
                </span>
            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="/create-post" class="bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-4 rounded-full transition duration-300 shadow-lg flex items-center border border-gray-700">
                    <i class="fas fa-plus ml-2"></i>
                    إنشاء منشور
                </a>
            </div>

        </nav>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        
        <div id="profileCard" class="glass-profile-card rounded-xl shadow-2xl overflow-hidden mb-8 p-0">
            <div class="relative h-40 bg-gray-900">
                <img id="coverPhoto" src="https://via.placeholder.com/1200x400/111827/FFFFFF?text=Cover+Photo" alt="صورة الغلاف" class="w-full h-full object-cover">
                <button id="changeCoverButton" class="absolute top-3 left-3 bg-black/50 text-white p-2 rounded-full hover:bg-black/80 transition duration-300 hidden" onclick="document.getElementById('cover_file_input').click()">
                    <i class="fas fa-camera"></i>
                </button>
            </div>

            <div class="p-6 pt-0 relative">
                <div class="flex justify-center -mt-20 sm:justify-start sm:mr-6 sm:-mt-24">
                    <div class="w-32 h-32 rounded-full border-4 border-black bg-gray-800 shadow-lg relative">
                         <img id="profilePhoto" src="https://via.placeholder.com/150/3182CE/FFFFFF?text=P" alt="صورة الملف الشخصي" class="w-full h-full object-cover rounded-full border-4 border-blue-500">
                        <button id="changeProfileButton" class="absolute bottom-0 left-0 bg-black/50 text-white p-2 rounded-full hover:bg-black/80 transition duration-300 hidden" onclick="document.getElementById('profile_file_input').click()">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                </div>

                <div class="mt-4 flex flex-col sm:flex-row justify-between items-start">
                    <div>
                        <h1 id="profileUsername" class="text-3xl font-bold text-white mt-4">@username</h1>
                        <p id="profileFullName" class="text-xl text-gray-400"></p>
                    </div>
                    
                    <div class="mt-4 sm:mt-0 flex space-x-3 space-x-reverse">
                        <button id="editProfileButton" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-full transition duration-300 shadow-lg hidden" onclick="openEditModal()">
                            <i class="fas fa-edit ml-2"></i> تعديل
                        </button>
                        
                        <a id="sendMessageButton" href="#" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-full transition duration-300 shadow-lg hidden">
                            <i class="fas fa-comment-alt ml-2"></i> إرسال رسالة
                        </a>
                    </div>
                </div>

                <p id="profileBio" class="text-gray-300 mt-4 mb-6 whitespace-pre-wrap italic">
                    جاري التحميل...
                </p>

                <div class="flex justify-around text-center border-t border-gray-700 pt-4">
                    <div>
                        <p id="postsCount" class="text-xl font-bold text-blue-400">0</p>
                        <p class="text-sm text-gray-400">منشور</p>
                    </div>
                    <div>
                        <p id="followersCount" class="text-xl font-bold text-blue-400">0</p>
                        <p class="text-sm text-gray-400">متابع</p>
                    </div>
                    <div>
                        <p id="followingCount" class="text-xl font-bold text-blue-400">0</p>
                        <p class="text-sm text-gray-400">يتابع</p>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-white mb-4 border-b border-gray-700 pb-2">منشورات المستخدم</h2>
        
        <div id="userPostsFeed" class="max-w-xl mx-auto space-y-4">
            <div class="text-center text-gray-500 p-4">جاري تحميل المنشورات...</div>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 right-0 z-50 glass-navbar">
        <nav class="flex justify-around items-center max-w-lg mx-auto h-14">
            <a href="/chat_list" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs mt-1">الرئيسية</span>
            </a>
            <a href="/users_list" class="flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition duration-300">
                <i class="fas fa-comment-dots text-xl"></i>
                <span class="text-xs mt-1">الدردشات</span>
            </a>
            <a href="/profile" class="flex flex-col items-center justify-center p-2 text-blue-400">
                <i class="fas fa-user-circle text-xl"></i>
                <span class="text-xs mt-1">البروفايل</span>
            </a>
        </nav>
    </div>
    
    <div id="editModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 glass-modal-bg">
        <div class="glass-edit-modal-content p-6 rounded-xl shadow-2xl max-w-lg w-full" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center pb-4 border-b border-gray-700">
                <h3 class="text-2xl font-bold text-white">تعديل الملف الشخصي</h3>
                <button id="closeEditModalBtn" class="text-gray-400 hover:text-white transition duration-300 text-3xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="editProfileForm" class="mt-4 space-y-4">
                
                <input type="file" id="profile_file_input" name="profile_picture" accept="image/*" class="hidden">
                <input type="file" id="cover_file_input" name="cover_picture" accept="image/*" class="hidden">
                
                <div>
                    <label for="editBio" class="block text-sm font-medium text-gray-300 mb-2">السيرة الذاتية (Bio)</label>
                    <textarea id="editBio" name="bio" rows="4" 
                              class="w-full p-3 bg-gray-800 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 border border-gray-700" 
                              placeholder="أكتب شيئاً عنك..." dir="rtl"></textarea>
                </div>
                
                <div class="flex items-center space-x-4 space-x-reverse">
                    <img id="editProfilePreview" src="https://via.placeholder.com/150/3182CE/FFFFFF?text=P" alt="بروفايل" class="w-16 h-16 rounded-full object-cover border border-blue-500">
                    <button type="button" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded-full transition duration-300" 
                            onclick="document.getElementById('profile_file_input').click()">
                        <i class="fas fa-camera ml-2"></i> تغيير صورة البروفايل
                    </button>
                    <span id="profileFileName" class="text-sm text-gray-400">لم يتم اختيار ملف</span>
                </div>

                <div class="flex items-center space-x-4 space-x-reverse">
                    <img id="editCoverPreview" src="https://via.placeholder.com/150/111827/FFFFFF?text=Cover" alt="غلاف" class="w-16 h-10 object-cover rounded-lg border border-gray-700">
                    <button type="button" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded-full transition duration-300" 
                            onclick="document.getElementById('cover_file_input').click()">
                        <i class="fas fa-image ml-2"></i> تغيير صورة الغلاف
                    </button>
                    <span id="coverFileName" class="text-sm text-gray-400">لم يتم اختيار ملف</span>
                </div>
                
                <div id="editError" class="text-red-500 mt-2 text-center hidden"></div>
                
                <button type="submit" id="saveEditButton" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-300 mt-4">
                    <i class="fas fa-save ml-2"></i> حفظ التعديلات
                </button>
            </form>
        </div>
    </div>
    
    <script>
    // **************** متغيرات رئيسية ****************
    let currentUserId = null; 
    let activeWaveSurfer = null; 
    let activeVideo = null; 
    let isOwner = false;
    let currentProfileData = {};

    // **************** عناصر الـ DOM ****************
    const profilePhoto = document.getElementById('profilePhoto');
    const coverPhoto = document.getElementById('coverPhoto');
    const profileUsername = document.getElementById('profileUsername');
    const profileFullName = document.getElementById('profileFullName');
    const profileBio = document.getElementById('profileBio');
    const postsCountElement = document.getElementById('postsCount');
    const followersCount = document.getElementById('followersCount');
    const followingCount = document.getElementById('followingCount');
    const editProfileButton = document.getElementById('editProfileButton');
    const sendMessageButton = document.getElementById('sendMessageButton');
    const pageTitle = document.getElementById('pageTitle');
    
    // عناصر التعديل
    const editModal = document.getElementById('editModal');
    const closeEditModalBtn = document.getElementById('closeEditModalBtn');
    const editProfileForm = document.getElementById('editProfileForm');
    const editBio = document.getElementById('editBio');
    const saveEditButton = document.getElementById('saveEditButton');
    const editError = document.getElementById('editError');
    const editProfilePreview = document.getElementById('editProfilePreview');
    const editCoverPreview = document.getElementById('editCoverPreview');
    const profileFileInput = document.getElementById('profile_file_input');
    const coverFileInput = document.getElementById('cover_file_input');
    const profileFileName = document.getElementById('profileFileName');
    const coverFileName = document.getElementById('coverFileName');
    const changeProfileButton = document.getElementById('changeProfileButton');
    const changeCoverButton = document.getElementById('changeCoverButton');
    const userPostsFeed = document.getElementById('userPostsFeed');

    
    // **************** 1. وظائف مودال التعديل ****************
    
    function openEditModal() {
        // ملء النموذج بالبيانات الحالية
        editBio.value = currentProfileData.bio || '';
        editProfilePreview.src = currentProfileData.profile_picture_url || 'https://via.placeholder.com/150';
        editCoverPreview.src = currentProfileData.cover_picture_url || 'https://via.placeholder.com/1200x400/111827/FFFFFF?text=Cover+Photo';
        
        // إعادة تعيين حقول الملفات
        profileFileInput.value = '';
        coverFileInput.value = '';
        profileFileName.textContent = 'لم يتم اختيار ملف';
        coverFileName.textContent = 'لم يتم اختيار ملف';
        editError.classList.add('hidden');
        
        editModal.classList.remove('hidden');
    }

    function closeEditModal() {
        editModal.classList.add('hidden');
    }

    closeEditModalBtn.addEventListener('click', closeEditModal);
    editModal.addEventListener('click', closeEditModal); 
    document.querySelector('.glass-edit-modal-content').addEventListener('click', (e) => e.stopPropagation()); // منع الإغلاق عند النقر داخل المودال

    // معاينة الملفات
    profileFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            editProfilePreview.src = URL.createObjectURL(file);
            profileFileName.textContent = file.name;
        } else {
            profileFileName.textContent = 'لم يتم اختيار ملف';
        }
    });

    coverFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            editCoverPreview.src = URL.createObjectURL(file);
            coverFileName.textContent = file.name;
        } else {
            coverFileName.textContent = 'لم يتم اختيار ملف';
        }
    });

    // إرسال نموذج التعديل
    editProfileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('bio', editBio.value.trim());
        if (profileFileInput.files[0]) {
            formData.append('profile_picture', profileFileInput.files[0]);
        }
        if (coverFileInput.files[0]) {
            formData.append('cover_picture', coverFileInput.files[0]);
        }

        saveEditButton.disabled = true;
        saveEditButton.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحفظ';
        editError.classList.add('hidden');

        try {
            const response = await fetch('/api/profile/update', { 
                method: 'POST',
                body: formData 
            });

            const result = await response.json();

            if (response.ok && result.ok) {
                // تحديث الواجهة الأمامية بالبيانات الجديدة
                fetchProfileData(currentProfileData.id); // إعادة جلب البيانات
                closeEditModal();
            } else {
                editError.textContent = result.error || 'فشل في حفظ التعديلات.';
                editError.classList.remove('hidden');
            }
            
        } catch (error) {
            editError.textContent = 'حدث خطأ في الاتصال بالخادم.';
            editError.classList.remove('hidden');
        } finally {
            saveEditButton.disabled = false;
            saveEditButton.innerHTML = '<i class="fas fa-save ml-2"></i> حفظ التعديلات';
        }
    });

    // **************** 2. جلب بيانات البروفايل ****************

    async function fetchProfileData(userId) {
        // إذا كان يتم جلب البروفايل الخاص بالمستخدم الحالي، لا نرسل المعرّف
        const url = userId ? `/api/profile?userId=${userId}` : '/api/profile';
        
        try {
            const response = await fetch(url);
            const data = await response.json();

            if (response.ok && data.ok) {
                currentProfileData = data;
                isOwner = data.is_owner;
                
                // تحديث الواجهة
                profilePhoto.src = data.profile_picture_url || 'https://via.placeholder.com/150';
                coverPhoto.src = data.cover_picture_url || 'https://via.placeholder.com/1200x400/111827/FFFFFF?text=Cover+Photo';
                profileUsername.textContent = `@${data.username}`;
                profileFullName.textContent = data.full_name || '';
                profileBio.textContent = data.bio || 'لم يقم المستخدم بإضافة سيرة ذاتية بعد.';
                postsCountElement.textContent = data.postsCount || 0;
                followersCount.textContent = data.followersCount || 0;
                followingCount.textContent = data.followingCount || 0;
                pageTitle.textContent = `${data.username} - الملف الشخصي`;
                
                // إظهار/إخفاء الأزرار بناءً على ملكية الحساب
                if (isOwner) {
                    editProfileButton.classList.remove('hidden');
                    changeProfileButton.classList.remove('hidden');
                    changeCoverButton.classList.remove('hidden');
                    sendMessageButton.classList.add('hidden');
                } else {
                    editProfileButton.classList.add('hidden');
                    changeProfileButton.classList.add('hidden');
                    changeCoverButton.classList.add('hidden');
                    sendMessageButton.classList.remove('hidden');
                    // تحديث رابط الرسالة (بافتراض أن Chat ID هو userId)
                    sendMessageButton.href = `/chat?id=${userId}`; 
                }
                
                fetchUserPosts(data.id); // جلب المنشورات باستخدام الـ ID الذي تم إرجاعه

            } else {
                alert(data.error || 'فشل في جلب بيانات الملف الشخصي.');
                userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-4">لم يتم العثور على الملف الشخصي.</div>';
            }

        } catch (error) {
            console.error('Error fetching profile:', error);
            alert('حدث خطأ في الاتصال بالخادم.');
        }
    }
    
    // **************** 3. جلب منشورات المستخدم ****************
    
    async function fetchUserPosts(userId) {
        userPostsFeed.innerHTML = '<div class="text-center text-gray-500 p-4"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';
        
        try {
            const response = await fetch(`/api/posts/user/${userId}`); 
            const result = await response.json();
            
            userPostsFeed.innerHTML = '';
            
            if (response.ok && result.ok) {
                if (result.posts.length === 0) {
                    userPostsFeed.innerHTML = '<div class="text-center text-gray-500 p-4">لم يقم المستخدم بالنشر بعد.</div>';
                    return;
                }
                
                result.posts.forEach(post => {
                    const mediaHtml = post.media ? renderMedia(post.media, post.postId) : '';
                    const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400 hover:text-red-500';

                    userPostsFeed.innerHTML += `
                         <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
                            <div class="flex items-center space-x-3 space-x-reverse mb-3">
                                <img src="${currentProfileData.profile_picture_url}" alt="صورة المستخدم" class="w-10 h-10 rounded-full object-cover">
                                <div>
                                    <p class="font-bold text-white">${currentProfileData.full_name}</p>
                                    <p class="text-sm text-gray-400">@${currentProfileData.username}</p>
                                </div>
                            </div>

                            <p class="text-gray-200 whitespace-pre-wrap mb-3">${post.content}</p>
                            
                            ${mediaHtml}

                            <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pt-3 border-t border-gray-700">
                                <button class="like-button ${likeButtonClass}" data-post-id="${post.postId}" onclick="handleLike(this)">
                                     <i class="fas fa-heart ml-1"></i> <span id="like-count-${post.postId}">${post.likes || 0}</span>
                                </button>
                                
                                <span><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount || 0} تعليق</span>
                                <span class="text-xs">${formatTimestamp(post.timestamp)}</span>
                            </div>
                        </div>
                    `;
                    
                    if (post.media && post.media.type === 'audio') {
                        // يجب إعادة تهيئة Wavesurfer إذا كان موجوداً
                        // initializePostWaveSurfer(post.postId, post.media.url); 
                    }
                });
                
            } else {
                userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-4">فشل في جلب منشورات المستخدم.</div>';
            }
        } catch (error) {
            console.error('Error fetching user posts:', error);
            userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-4">حدث خطأ في الاتصال بالخادم.</div>';
        }
    }
    
    // دالة عرض الوسائط (محاكاة)
    function renderMedia(media, postId) {
        if (media.type === 'image') {
            return `<img src="${media.url}" class="mt-3 w-full h-auto max-h-96 object-cover rounded-lg">`;
        } else if (media.type === 'video') {
            return `
                <div class="relative mt-3 w-full rounded-lg overflow-hidden">
                    <video id="video-${postId}" src="${media.url}" controls class="w-full h-full object-cover"></video>
                </div>
            `;
        } else if (media.type === 'audio') {
            return `
                <div id="waveform-${postId}" class="mt-3 h-10 w-full bg-gray-800 rounded-lg p-2 flex items-center">
                    <button class="text-white hover:text-blue-400 transition" onclick="toggleAudioPlay('${postId}', '${media.url}')">
                        <i class="fas fa-play" id="play-icon-${postId}"></i>
                    </button>
                    <div id="wave-${postId}" class="flex-grow mx-2"></div>
                </div>
            `;
        }
        return '';
    }

    // **************** 4. وظائف التفاعل (الإعجاب) ****************

    async function handleLike(button) {
        const postId = button.dataset.postId;
        const likeCountElement = document.getElementById(`like-count-${postId}`);
        
        // إيقاف النقر أثناء المعالجة
        button.disabled = true;
        
        try {
            const response = await fetch(`/api/posts/${postId}/like`, { method: 'POST' });
            const result = await response.json();

            if (result.ok) {
                likeCountElement.textContent = result.newCount;
                if (result.action === 'liked') {
                    button.classList.add('text-red-500');
                    button.classList.remove('text-gray-400', 'hover:text-red-500');
                } else {
                    button.classList.remove('text-red-500');
                    button.classList.add('text-gray-400', 'hover:text-red-500');
                }
            } else {
                 alert('فشل في الإعجاب: ' + (result.error || 'خطأ غير معروف'));
            }
        } catch (error) {
            console.error('Error liking post:', error);
            alert('فشل الاتصال بالخادم لعملية الإعجاب.');
        } finally {
            button.disabled = false;
        }
    }

    // **************** 5. بدء التحميل ****************

    document.addEventListener('DOMContentLoaded', () => {
        // جلب مُعرّف المستخدم من شريط العنوان (URL)
        const urlParams = new URLSearchParams(window.location.search);
        const requestedUserId = urlParams.get('userId');
        
        // إذا كان هناك مُعرّف في الرابط، ابحث عن بروفايل هذا المستخدم
        if (requestedUserId) {
            fetchProfileData(requestedUserId);
        } else {
            // إذا لم يكن هناك مُعرّف، ابحث عن بروفايل المستخدم الحالي
            fetchProfileData(null); 
        }
    });
    
    // دالة تنسيق الوقت (منقولة من chat_list.html)
    function formatTimestamp(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diffInHours = (now - date) / (1000 * 60 * 60);

        if (diffInHours < 24) {
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        } else if (diffInHours < 7 * 24) {
            return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
        } else {
            return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }
    }
    
    // (يجب أن يتم تضمين وظائف Wavesurfer مثل initializePostWaveSurfer و toggleAudioPlay هنا إذا كنت تستخدم الصوت)

</script>
