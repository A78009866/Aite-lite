<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Aite - الملف الشخصي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/wavesurfer.js"></script> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px; 
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .app-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        
        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-profile-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .waveform-post {
            height: 60px; 
            background-color: #0f172a; 
            border-radius: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* notification badge in top bar */
        .notif-badge {
          position: absolute;
          top: -6px;
          left: -6px;
          min-width: 18px;
          height: 18px;
          padding: 0 6px;
          background: #ef4444;
          color: #fff;
          font-size: 12px;
          border-radius: 999px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 18px;
            background: rgba(185, 28, 28, 0.4); 
            font-size: 12px;
            color: #fca5a5;
            flex: 1;
        }

    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 glass-navbar p-3">
        <nav class="flex justify-between items-center max-w-6xl mx-auto relative">
            
            <div class="flex items-center">
                <a href="/chat_list" class="text-gray-400 hover:text-white transition duration-300">
                    <i class="fas fa-arrow-right text-2xl"></i>
                </a>
            </div>
            
            <div class="flex-grow flex justify-center">
                <a href="/chat_list" class="text-3xl font-extrabold text-white tracking-widest hover:text-gray-300 transition duration-300 app-logo">
                    Aite
                </a>
            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse relative">
                <!-- Notifications icon with badge in top bar -->
                <a id="notifTopBtn" href="/notifications" class="text-gray-300 hover:text-white p-2 relative" title="الإشعارات">
                    <i class="fas fa-bell text-xl"></i>
                    <span id="notifBadgeProfile" class="notif-badge" style="display:none">0</span>
                </a>

                <button id="profileMenuButton" class="relative block" onclick="toggleProfileDropdown(event)">
                    <img id="userProfilePic" src="/assets/default_profile_pic.png" alt="صورة P" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover hover:ring-2 hover:ring-blue-400 transition duration-300 cursor-pointer">
                </button>
            </div>

            <div id="profileDropdown" class="absolute top-14 left-0 mt-2 w-48 rounded-lg shadow-xl glass-dropdown hidden">
                <a href="/profile" class="flex items-center px-4 py-3 text-white hover:bg-white/10 rounded-t-lg transition duration-200">
                    <i class="fas fa-user-circle text-xl ml-3"></i>
                    الملف الشخصي
                </a>
                <a href="/logout" class="flex items-center px-4 py-3 text-red-400 hover:bg-white/10 rounded-b-lg transition duration-200 border-t border-gray-700">
                    <i class="fas fa-sign-out-alt text-xl ml-3"></i>
                    تسجيل الخروج
                </a>
            </div>

        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        
        <div class="max-w-xl mx-auto">
            
            <div id="profileCard" class="glass-profile-card rounded-xl shadow-2xl p-0 overflow-hidden mb-4 animate-fadeIn">
                
                <div id="coverPhotoContainer" class="w-full h-40 bg-gray-900 relative" 
                     style="background-image: url('/assets/default_cover_photo.jpg'); background-size: cover; background-position: center;">
                    <div class="absolute inset-0 bg-black/30"></div>
                </div>

                <div class="p-4 pt-0 -mt-20 relative">
                    
                    <img id="profileImage" src="/assets/default_profile_pic.png" alt="صورة الملف الشخصي" 
                         class="w-32 h-32 rounded-full object-cover border-4 border-black shadow-lg mb-3 hover:ring-4 hover:ring-blue-400 transition duration-300">
                    
                    <div class="flex justify-between items-start">
                        <div>
                            <h1 id="profileUsername" class="text-3xl font-bold text-white">تحميل...</h1>
                            <p id="profileFullName" class="text-gray-400 text-lg">الاسم الكامل</p>
                            <p id="profileBio" class="text-gray-300 mt-1 whitespace-pre-wrap">السيرة الذاتية...</p>
                        </div>
                        
                        <a id="editProfileButton" href="/edit_profile" 
                                class="hidden bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1 px-4 rounded-lg transition duration-300 flex items-center text-sm shadow-md">
                            تعديل
                        </a>
                        
                        <a id="chatButton" 
                                class="hidden bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-full transition duration-300 flex items-center shadow-md">
                            <i class="fas fa-comment-dots ml-2"></i>
                           مراسلة
                        </a>
                    </div>
                    
                    </div>
            </div>

            
            <div id="userPostsFeed" class="space-y-4">
                <div class="text-center text-gray-500 p-8"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>
            </div>
            
        </div>

    </main>
    
    <!-- NO bottom navbar on profile page (as requested) -->

    <div id="mediaViewerModal" class="fixed inset-0 bg-black bg-opacity-90 z-[1000] hidden flex items-center justify-center p-4" onclick="closeMediaViewer()">
        <div class="relative w-full max-w-4xl max-h-full overflow-hidden" onclick="event.stopPropagation()">
            <button class="absolute top-4 right-4 text-white text-3xl z-10 hover:text-gray-300" onclick="closeMediaViewer()">&times;</button>
            <img id="mediaViewerImage" src="" alt="Post Media" class="max-w-full max-h-[90vh] object-contain mx-auto hidden">
            <video id="mediaViewerVideo" src="" controls class="max-w-full max-h-[90vh] object-contain mx-auto hidden"></video>
        </div>
    </div>
    
    <div id="postMenu" class="absolute z-40 bg-[#242526] rounded-lg shadow-xl border border-gray-700 hidden w-40">
        <button id="deleteOptionBtn" class="flex items-center w-full p-3 text-red-400 hover:bg-[#343536] rounded-lg transition duration-300">
            <i class="fas fa-trash ml-3"></i>
            حذف المنشور
        </button>
    </div>
    
    <div id="commentModal" class="fixed inset-0 z-[1000] hidden flex items-end justify-center">
        <div id="commentModalBackdrop" class="fixed inset-0 bg-black bg-opacity-70" onclick="closeCommentModal()"></div>
        <div class="relative w-full max-w-lg h-5/6 bg-[#18191a] rounded-t-2xl shadow-2xl flex flex-col animate-slideUp">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">التعليقات</h3>
                <button class="text-gray-400 p-2" onclick="closeCommentModal()">&times;</button>
            </div>
            <div id="commentsList" class="flex-grow overflow-y-auto custom-scrollbar p-4 space-y-3">
                </div>
            <div class="p-4 border-t border-gray-700">
                <div id="commentError" class="text-red-500 mb-2 hidden"></div>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <input type="text" id="newCommentInput" placeholder="أضف تعليقًا..." class="flex-grow p-3 rounded-full bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="postCommentBtn" class="bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-700 transition duration-300">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ******************** الوظائف الرئيسية لصفحة الملف الشخصي ********************

        let currentProfileId = null; 
        let currentUserId = null; 
        let activeWaveSurfer = null; 
        let audioWaveSurfers = {}; // map postId -> wavesurfer
        let activeVideo = null;
        let currentPostIdForComment = null; 
        let currentPostIdToDelete = null; 

        const userPostsFeed = document.getElementById('userPostsFeed');
        const profileDropdown = document.getElementById('profileDropdown'); 
        const profileMenuButton = document.getElementById('profileMenuButton'); 
        const editProfileButton = document.getElementById('editProfileButton'); 
        const chatButton = document.getElementById('chatButton');
        const pageTitle = document.getElementById('pageTitle');

        function toggleProfileDropdown(event) {
            event.stopPropagation();
            profileDropdown.classList.toggle('hidden');
        }
        function closeProfileDropdownOnClickOutside(event) {
            if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
                profileDropdown.classList.add('hidden');
            }
        }
        document.addEventListener('click', closeProfileDropdownOnClickOutside);
        
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);
            if (diffInHours < 24) {
                return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 7 * 24) {
                return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
            }
        }
        
        // Create post card (same structure as before)
        function createPostCard(post) {
            let mediaContent = '';
            if (post.media) {
                if (post.media.type === 'image') {
                    mediaContent = `
                        <div class="mt-3 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image', event)">
                            <img src="${post.media.url}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg">
                        </div>
                    `;
                } else if (post.media.type === 'video') {
                     mediaContent = `
                        <div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group">
                            <video id="video-${post.postId}" src="${post.media.url}" 
                                   class="w-full h-full object-contain" 
                                   poster="https://via.placeholder.com/600x400?text=Video+Loading" 
                                   preload="metadata"
                                   onclick="toggleVideoPlay('${post.postId}', event)">
                            </video>
                            
                            <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 transition-opacity duration-300 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)">
                                <i class="fas fa-play text-white text-5xl opacity-80 transition-transform duration-300 transform scale-100 group-hover:scale-110"></i>
                            </div>

                            <div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center space-x-3 space-x-reverse opacity-0 transition-opacity duration-300 group-hover:opacity-100">
                                
                                <button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                                    <i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i>
                                </button>
                                
                                <div class="flex-grow h-1 bg-gray-500 rounded-full cursor-pointer relative" onclick="seekVideo('${post.postId}', event)">
                                    <div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div>
                                </div>
                                
                                <span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span>
                                
                                <button onclick="toggleFullscreen('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                                    <i class="fas fa-expand text-lg"></i>
                                </button>
                            </div>

                        </div>
                    `;
                } else if (post.media.type === 'audio') {
                    mediaContent = `
                        <div class="mt-3 flex items-center space-x-3 space-x-reverse bg-gray-800 p-3 rounded-lg">
                            <button id="audio-btn-${post.postId}" class="audio-play-button text-white text-xl hover:text-blue-400 transition duration-300 flex-shrink-0" onclick="toggleAudioPlay('${post.postId}')">
                                <i class="fas fa-play"></i>
                            </button>
                            <div id="waveform-${post.postId}" class="waveform-post flex-grow" data-src="${post.media.url}"></div>
                        </div>
                    `;
                }
            }

            const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
            const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';
            
            const isOwner = post.userId === currentUserId; 
            const menuButtonHtml = isOwner ? `
                <button class="text-gray-400 hover:text-white transition duration-300 post-menu-button" 
                        onclick="togglePostMenu('${post.postId}', '${post.userId}', event, this)">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            ` : '';

            return `
                <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center">
                            <img src="${post.user.profile_picture_url}" alt="${post.user.username}" class="w-10 h-10 rounded-full object-cover ml-3 border border-gray-600">
                            <div>
                                <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">@${post.user.username}</a>
                                <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
                            </div>
                        </div>
                        ${menuButtonHtml}
                    </div>

                    <p class="text-gray-200 whitespace-pre-wrap">${post.content}</p>

                    ${mediaContent}

                    <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                        <span><i class="fas fa-heart ml-1"></i> ${post.likes} إعجاب</span>
                        <span class="cursor-pointer hover:text-blue-400" onclick="handleComment('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount} تعليق</span>
                    </div>

                    <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
                        <button class="flex items-center ${likeButtonClass} hover:text-red-500 transition duration-300 w-full justify-center post-like-button" 
                                data-is-liked="${post.is_liked}" 
                                onclick="handleLike('${post.postId}', this)">
                            <i class="${likeIconClass} ml-2 like-icon"></i> إعجاب
                        </button>
                        <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center" onclick="handleComment('${post.postId}')">
                            <i class="far fa-comment-alt ml-2"></i> تعليق
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Initialize WaveSurfer for a post and return the instance
        function initializePostWaveSurfer(postId, url) {
            const container = document.getElementById(`waveform-${postId}`);
            if (!container) return null;
            // prevent double-init
            if (audioWaveSurfers[postId]) return audioWaveSurfers[postId];

            const wavesurfer = WaveSurfer.create({
                container: container,
                waveColor: '#4f46e5',
                progressColor: '#06b6d4',
                cursorColor: '#1d4ed8',
                barWidth: 3,
                barRadius: 3,
                barGap: 3,
                responsive: true,
                height: 60,
                backend: 'MediaElement',
            });

            wavesurfer.load(url);

            wavesurfer.on('ready', () => {
                const btn = document.getElementById(`audio-btn-${postId}`);
                if (btn) btn.querySelector('i').className = 'fas fa-play';
            });

            wavesurfer.on('play', () => {
                const btn = document.getElementById(`audio-btn-${postId}`);
                if (btn) btn.querySelector('i').className = 'fas fa-pause';
                if (activeWaveSurfer && activeWaveSurfer !== wavesurfer) {
                    activeWaveSurfer.pause();
                }
                activeWaveSurfer = wavesurfer;
            });

            wavesurfer.on('pause', () => {
                const btn = document.getElementById(`audio-btn-${postId}`);
                if (btn) btn.querySelector('i').className = 'fas fa-play';
            });

            wavesurfer.on('finish', () => {
                const btn = document.getElementById(`audio-btn-${postId}`);
                if (btn) btn.querySelector('i').className = 'fas fa-play';
                wavesurfer.seekTo(0);
                activeWaveSurfer = null;
            });

            audioWaveSurfers[postId] = wavesurfer;
            return wavesurfer;
        }

        function toggleAudioPlay(postId) {
            const ws = audioWaveSurfers[postId];
            if (!ws) {
                // maybe still loading; try to initialize from DOM dataset
                const container = document.getElementById(`waveform-${postId}`);
                if (container && container.dataset && container.dataset.src) {
                    initializePostWaveSurfer(postId, container.dataset.src);
                }
            }
            const wavesurfer = audioWaveSurfers[postId];
            if (!wavesurfer) return;
            if (wavesurfer.isPlaying()) wavesurfer.pause();
            else wavesurfer.play();
        }

        async function handleLike(postId, buttonElement) {
            const isLiked = buttonElement.getAttribute('data-is-liked') === 'true';
            const newIsLiked = !isLiked;
            const icon = buttonElement.querySelector('.like-icon');
            let likesSpan;
            try {
                // optimistic UI
                if (newIsLiked) {
                    icon.classList.remove('far', 'text-gray-400');
                    icon.classList.add('fas', 'text-red-500');
                    buttonElement.classList.remove('text-gray-400');
                    buttonElement.classList.add('text-red-500');
                    buttonElement.setAttribute('data-is-liked', 'true');
                } else {
                    icon.classList.remove('fas', 'text-red-500');
                    icon.classList.add('far', 'text-gray-400');
                    buttonElement.classList.remove('text-red-500');
                    buttonElement.classList.add('text-gray-400');
                    buttonElement.setAttribute('data-is-liked', 'false');
                }

                const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                // update count if provided
                if (res.ok && data.ok && data.newLikes !== undefined) {
                    const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
                    if (postCard) {
                        const likesElem = postCard.querySelector('.flex.justify-between span:first-child');
                        if (likesElem) likesElem.innerHTML = `<i class="fas fa-heart ml-1"></i> ${data.newLikes} إعجاب`;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function createCommentElement(comment) {
            return `
                <div class="flex items-start p-3 bg-[#242526] rounded-lg shadow-md">
                    <img src="${comment.user.profile_picture_url}" alt="${comment.user.username}" class="w-8 h-8 rounded-full object-cover ml-3 flex-shrink-0">
                    <div class="flex-grow">
                        <p class="text-white font-semibold text-sm">@${comment.user.username} <span class="text-gray-500 text-xs mr-2">${formatTimestamp(comment.timestamp)}</span></p>
                        <p class="text-gray-200 mt-1 whitespace-pre-wrap">${comment.content}</p>
                    </div>
                </div>
            `;
        }

        async function fetchAndDisplayProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const requestedUserId = urlParams.get('userId'); 
            
            // current user
            try {
                const currentUserResponse = await fetch('/api/profile');
                if (currentUserResponse.ok) {
                    const currentUserIdData = await currentUserResponse.json();
                    currentUserId = currentUserIdData.id;
                    document.getElementById('userProfilePic').src = currentUserIdData.profile_picture_url || '/assets/default_profile_pic.png';
                }
            } catch (error) {
                 console.error('Failed to fetch current user profile:', error);
            }
            
            currentProfileId = requestedUserId || currentUserId;
            if (!currentProfileId) {
                userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-8">خطأ: لا يمكن تحديد الملف الشخصي.</div>';
                return;
            }

            try {
                const response = await fetch(`/api/profile?userId=${currentProfileId}`);
                const data = await response.json();
                
                if (response.ok && data.ok) {
                    
                    document.getElementById('profileImage').src = data.profile_picture_url || '/assets/default_profile_pic.png';
                    if (data.cover_photo_url) {
                        document.getElementById('coverPhotoContainer').style.backgroundImage = `url('${data.cover_photo_url}')`;
                    }
                    
                    document.getElementById('profileUsername').textContent = `@${data.username}`;
                    document.getElementById('profileFullName').textContent = data.full_name || 'لا يوجد اسم كامل';
                    document.getElementById('profileBio').textContent = data.bio || '';
                    
                    pageTitle.textContent = `Aite - @${data.username}`;
                    
                    if (currentUserId && data.id === currentUserId) { 
                        editProfileButton.classList.remove('hidden');
                        chatButton.classList.add('hidden');
                    } else {
                        editProfileButton.classList.add('hidden');
                        chatButton.href = `/chat?contactId=${currentProfileId}`;
                        chatButton.classList.remove('hidden');
                    }
                    
                    fetchAndDisplayUserPosts(currentProfileId);

                } else {
                    userPostsFeed.innerHTML = `<div class="text-center text-red-500 p-8">لم يتم العثور على المستخدم @${currentProfileId}</div>`;
                }

            } catch (error) {
                console.error('Error fetching profile:', error);
                userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-8">حدث خطأ في جلب بيانات الملف الشخصي.</div>';
            }
        }
        
        async function fetchAndDisplayUserPosts(userId) {
            userPostsFeed.innerHTML = '<div class="text-center text-gray-500 p-8"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';
            
            try {
                const response = await fetch(`/api/posts/user/${userId}`); 
                const result = await response.json();
                
                userPostsFeed.innerHTML = '';
                
                if (response.ok && result.ok) {
                    if (result.posts.length === 0) {
                        userPostsFeed.innerHTML = '<div class="text-center text-gray-500 p-8">لا توجد منشورات لعرضها بعد.</div>';
                        return;
                    }
                    
                    const audioPostsToInit = [];

                    result.posts.forEach(post => {
                        userPostsFeed.innerHTML += createPostCard(post);
                        if (post.media && post.media.type === 'audio') {
                            audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                        }
                    });
                    
                    setTimeout(() => {
                        audioPostsToInit.forEach(ap => {
                            initializePostWaveSurfer(ap.postId, ap.url);
                        });
                    }, 100); 

                } else {
                    userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-8">فشل في جلب المنشورات.</div>';
                }
            } catch (error) {
                console.error('Error fetching user posts:', error);
                userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-8">حدث خطأ في الاتصال بالخادم.</div>';
            }
        }
        
        // comment modal functions
        function openCommentModal() {
            document.getElementById('commentModal').classList.remove('hidden');
            document.getElementById('newCommentInput').focus();
        }
        function closeCommentModal() {
            document.getElementById('commentModal').classList.add('hidden');
            currentPostIdForComment = null;
            commentsList.innerHTML = '';
        }
        async function handleComment(postId) {
            currentPostIdForComment = postId;
            openCommentModal();
            await fetchComments(postId);
        }
        async function fetchComments(postId) {
            commentsList.innerHTML = '<div class="text-center text-gray-500"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل التعليقات...</div>';
            try {
                const response = await fetch(`/api/posts/${postId}/comments`);
                const result = await response.json();
                commentsList.innerHTML = '';
                if (response.ok && result.ok && result.comments.length > 0) {
                    result.comments.forEach(c => commentsList.innerHTML += createCommentElement(c));
                } else {
                    commentsList.innerHTML = '<div class="text-center text-gray-500 mt-4">لا توجد تعليقات حتى الآن.</div>';
                }
            } catch (e) {
                commentsList.innerHTML = '<div class="text-center text-red-500 mt-4">فشل في جلب التعليقات.</div>';
            }
        }
        async function postComment() {
            const input = document.getElementById('newCommentInput');
            const content = input.value.trim();
            if (!content || !currentPostIdForComment) return;
            try {
                const res = await fetch(`/api/posts/${currentPostIdForComment}/comment`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    commentsList.innerHTML += createCommentElement(data.comment);
                    input.value = '';
                } else {
                    alert('فشل في نشر التعليق');
                }
            } catch (e) { alert('فشل الاتصال'); }
        }
        document.getElementById('postCommentBtn').addEventListener('click', postComment);
        document.getElementById('newCommentInput').addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); postComment(); }});
        
        document.addEventListener('DOMContentLoaded', fetchAndDisplayProfile);

        // ---------------- Notifications SSE for profile page ----------------
        (function setupNotifSSEProfile() {
          if (!window.EventSource) return;
          const es = new EventSource('/api/notifications/stream');
          es.addEventListener('notifications', (e) => {
            try {
              const payload = JSON.parse(e.data);
              const unread = payload.unread_count || 0;
              const badge = document.getElementById('notifBadgeProfile');
              if (unread > 0) {
                badge.style.display = 'inline-flex';
                badge.textContent = unread > 99 ? '99+' : String(unread);
              } else {
                badge.style.display = 'none';
              }
            } catch (err) {
              console.error('Failed to parse notifications SSE data', err);
            }
          });
          es.addEventListener('error', (err) => {
            console.warn('Notifications SSE error', err);
          });
        })();

        // fallback initial unread count
        (function initUnreadProfile() {
          fetch('/api/notifications/unread_count', { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.ok) {
                const badge = document.getElementById('notifBadgeProfile');
                if (d.unread_count > 0) { badge.style.display = 'inline-flex'; badge.textContent = d.unread_count > 99 ? '99+' : String(d.unread_count); }
              }
            }).catch(()=>{});
        })();

        // Utility: open media viewer
        function openMediaViewer(url, type, event) {
            event.stopPropagation();
            const modal = document.getElementById('mediaViewerModal');
            const image = document.getElementById('mediaViewerImage');
            const video = document.getElementById('mediaViewerVideo');
            image.classList.add('hidden'); video.classList.add('hidden');
            if (type === 'image') { image.src = url; image.classList.remove('hidden'); }
            else if (type === 'video') { video.src = url; video.classList.remove('hidden'); video.play(); }
            modal.classList.remove('hidden');
        }
        function closeMediaViewer() {
            const modal = document.getElementById('mediaViewerModal');
            modal.classList.add('hidden');
            const video = document.getElementById('mediaViewerVideo');
            if (video) { video.pause(); video.currentTime = 0; video.src = ''; }
        }

        // VIDEO control helpers reused from main file (kept minimal for profile)
        function toggleVideoPlay(postId, event) {
            event.stopPropagation();
            const video = document.getElementById(`video-${postId}`);
            const playOverlay = document.getElementById(`play-overlay-${postId}`);
            const controlIcon = document.getElementById(`control-icon-${postId}`);
            if (!video) return;
            if (activeWaveSurfer) { activeWaveSurfer.pause(); activeWaveSurfer = null; }
            if (video.paused) {
                video.play().catch(()=>{});
                if (controlIcon) controlIcon.classList.remove('fa-play'), controlIcon.classList.add('fa-pause');
                if (playOverlay) playOverlay.classList.add('hidden');
                activeVideo = video;
                video.addEventListener('timeupdate', (e) => {
                    const progressBar = document.getElementById(`progress-bar-${postId}`);
                    const timeDisplay = document.getElementById(`time-display-${postId}`);
                    if (progressBar && video.duration) progressBar.style.width = (video.currentTime / video.duration * 100) + '%';
                    if (timeDisplay && video.duration) timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
                });
            } else {
                video.pause();
                if (controlIcon) controlIcon.classList.remove('fa-pause'), controlIcon.classList.add('fa-play');
                if (playOverlay) playOverlay.classList.remove('hidden');
                activeVideo = null;
            }
        }
        function formatVideoTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

    </script>
