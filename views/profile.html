<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الملف الشخصي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-dark: #121212;
            --card-glass-bg: rgba(30, 30, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-light: #f8f9fa;
            --text-muted: #adb5bd;
            --glow-color: rgba(0, 123, 255, 0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--background-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at top left, #2c3e50 0%, #121212 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Glassmorphism Card Styling */
        .glass-card {
            background: var(--card-glass-bg);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 20px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 var(--glow-color);
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            padding-bottom: 20px;
        }

        .cover-photo {
            width: calc(100% + 40px); /* 100% + padding */
            margin: -20px -20px 20px -20px;
            height: 200px;
            background-size: cover;
            background-position: center;
            border-radius: 15px 15px 0 0;
            overflow: hidden;
            position: relative;
        }
        .cover-photo::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(18, 18, 18, 0.8), transparent);
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid var(--background-dark);
            background-color: var(--background-dark);
            object-fit: cover;
            margin-top: -60px; /* Pull up over the cover photo */
            display: inline-block;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .username {
            margin-top: 10px;
            font-size: 1.8em;
            color: var(--text-light);
            font-weight: 700;
        }

        .bio {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1em;
            font-style: italic;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        .stat-item strong {
            display: block;
            font-size: 1.2em;
            color: var(--primary-color);
        }

        .stat-item span {
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .edit-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .edit-button:hover {
            background: #0056b3;
        }

        /* Posts Section */
        .posts-section h3 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .post-card {
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(30, 30, 30, 0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .post-card p {
            margin: 0 0 10px 0;
        }

        .post-card small {
            color: var(--text-muted);
            display: block;
            text-align: left;
        }

        .post-media {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        /* Modal Styling (for Edit Profile) */
        .modal {
            display: none; 
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            padding-top: 60px;
        }

        .modal-content {
            background: var(--card-glass-bg);
            margin: 5% auto;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            width: 80%;
            max-width: 500px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .close {
            color: var(--text-light);
            float: left;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
        }
        
        .modal-content label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: var(--text-light);
        }
        
        .modal-content textarea, .modal-content input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-light);
            box-sizing: border-box;
        }
        
        .modal-content button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .modal-content button:hover {
            background: #0056b3;
        }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="profile-card" class="glass-card">
            <div id="cover-photo" class="cover-photo"></div>

            <div class="profile-header">
                <img id="profile-picture" class="profile-picture" src="https://via.placeholder.com/150" alt="صورة الملف الشخصي">
                <h2 id="username" class="username"></h2>
                <p id="bio" class="bio"></p>
                
                <div class="stats">
                    <div class="stat-item">
                        <strong id="posts-count">0</strong>
                        <span>منشورات</span>
                    </div>
                    </div>
                
                <button id="edit-profile-btn" class="edit-button" style="display: none;">تعديل البروفايل</button>
            </div>
        </div>

        <div id="posts-section" class="glass-card posts-section">
            <h3>منشوراتي</h3>
            <div id="posts-list">
                <p id="no-posts-message" style="text-align: center; color: var(--text-muted);">لا يوجد منشورات لعرضها.</p>
            </div>
        </div>

    </div>
    
    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>تعديل الملف الشخصي</h2>
        <form id="edit-profile-form">
          
          <label for="edit-bio">النبذة (Bio):</label>
          <textarea id="edit-bio" name="bio" rows="4" maxlength="160"></textarea>

          <label for="edit-profile-pic">تغيير صورة البروفايل:</label>
          <input type="file" id="edit-profile-pic" name="profile_picture_file" accept="image/*">
          
          <label for="edit-cover-photo">تغيير صورة الغلاف:</label>
          <input type="file" id="edit-cover-photo" name="cover_photo_file" accept="image/*">

          <button type="submit" id="save-btn">حفظ التغييرات</button>
          <div class="loader" id="modal-loader"></div>
        </form>
      </div>
    </div>


    <script>
        const profileId = new URLSearchParams(window.location.search).get('userId');
        const postsList = document.getElementById('posts-list');
        const noPostsMessage = document.getElementById('no-posts-message');
        const editButton = document.getElementById('edit-profile-btn');
        const modal = document.getElementById('edit-modal');
        const closeBtn = document.querySelector('.close');
        const editForm = document.getElementById('edit-profile-form');
        const modalLoader = document.getElementById('modal-loader');
        const saveBtn = document.getElementById('save-btn');

        async function fetchProfileData() {
            try {
                const url = profileId ? `/api/profile?userId=${profileId}` : '/api/profile';
                const response = await fetch(url);
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();

                if (data.ok) {
                    // Update DOM with profile data
                    document.getElementById('pageTitle').textContent = `${data.username} | البروفايل`;
                    document.getElementById('username').textContent = `@${data.username}`;
                    document.getElementById('bio').textContent = data.bio || 'لم يقم المستخدم بإضافة نبذة بعد.';
                    document.getElementById('profile-picture').src = data.profile_picture_url;
                    document.getElementById('posts-count').textContent = data.postsCount;
                    
                    const coverPhotoDiv = document.getElementById('cover-photo');
                    coverPhotoDiv.style.backgroundImage = `url('${data.cover_photo_url}')`;

                    // Handle Edit Button visibility
                    if (data.is_owner) {
                        editButton.style.display = 'block';
                        // Populate modal fields
                        document.getElementById('edit-bio').value = data.bio || '';
                    } else {
                        editButton.style.display = 'none';
                    }

                    // Fetch posts for this user
                    fetchPosts(data.id);
                } else {
                    alert(`خطأ: ${data.error}`);
                    // Redirect back if profile not found
                    window.location.href = '/chat_list'; 
                }
            } catch (error) {
                console.error('Error fetching profile:', error);
                alert('حدث خطأ أثناء جلب بيانات الملف الشخصي.');
            }
        }
        
        async function fetchPosts(userId) {
            try {
                const response = await fetch(`/api/posts?userId=${userId}`);
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();

                postsList.innerHTML = '';
                if (data.ok && data.posts.length > 0) {
                    noPostsMessage.style.display = 'none';
                    data.posts.forEach(post => {
                        postsList.appendChild(createPostCard(post));
                    });
                } else {
                    noPostsMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error fetching posts:', error);
            }
        }

        function createPostCard(post) {
            const card = document.createElement('div');
            card.className = 'post-card';
            
            const content = document.createElement('p');
            content.textContent = post.content;
            card.appendChild(content);

            if (post.media && post.media.url) {
                let mediaElement;
                if (post.media.type === 'image') {
                    mediaElement = document.createElement('img');
                    mediaElement.src = post.media.url;
                    mediaElement.className = 'post-media';
                } else if (post.media.type === 'video') {
                    mediaElement = document.createElement('video');
                    mediaElement.src = post.media.url;
                    mediaElement.className = 'post-media';
                    mediaElement.controls = true;
                }
                // Add support for audio/raw if needed, but for now only image/video
                if (mediaElement) {
                    card.appendChild(mediaElement);
                }
            }

            const info = document.createElement('small');
            const date = new Date(post.timestamp).toLocaleString('ar-EG');
            info.textContent = `الإعجابات: ${post.likes} | التعليقات: ${post.commentsCount} | نشر في: ${date}`;
            card.appendChild(info);

            return card;
        }

        // --- Modal Control ---
        editButton.onclick = function() {
            modal.style.display = "block";
        }

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
        
        // --- Handle Form Submission ---
        editForm.onsubmit = async function(e) {
            e.preventDefault();
            
            modalLoader.style.display = 'block';
            saveBtn.disabled = true;

            const formData = new FormData(editForm);
            
            // Note: Cloudinary storage expects file fields to be present even if empty.
            // Remove empty file fields to avoid sending unnecessary data
            if (formData.get('profile_picture_file').name === '') {
                formData.delete('profile_picture_file');
            }
            if (formData.get('cover_photo_file').name === '') {
                formData.delete('cover_photo_file');
            }

            try {
                const response = await fetch('/api/profile/update', {
                    method: 'POST',
                    body: formData // FormData is used when submitting file uploads
                });
                
                const data = await response.json();

                if (data.ok) {
                    alert('تم تحديث الملف الشخصي بنجاح!');
                    modal.style.display = "none";
                    await fetchProfileData(); // Reload profile data
                } else {
                    alert(`فشل التحديث: ${data.error}`);
                }

            } catch (error) {
                console.error('Error updating profile:', error);
                alert('حدث خطأ في الاتصال بالخادم أثناء التحديث.');
            } finally {
                modalLoader.style.display = 'none';
                saveBtn.disabled = false;
                // Reset file inputs so the user has to re-select if they want to update again
                document.getElementById('edit-profile-pic').value = '';
                document.getElementById('edit-cover-photo').value = '';
            }
        }


        // Initialize
        document.addEventListener('DOMContentLoaded', fetchProfileData);
    </script>
</body>
</html>
