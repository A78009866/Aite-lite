<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف المستخدم - Trimer</title>
    <style>
        /* ---------------------------------
           1. CSS Reset & Global
           --------------------------------- */
        :root {
            --glass-bg: rgba(0, 0, 0, 0.45); /* خلفية شبه شفافة سوداء أغمق */
            --glass-border: rgba(255, 255, 255, 0.1); /* إطار فاتح */
            --main-text: #f0f0f0;
            --accent-color: #00bcd4; /* لون التمييز - سماوي */
            --cover-placeholder: linear-gradient(135deg, #1f1c2c, #4a2c4a); /* غلاف افتراضي */
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f1c2c, #4a2c4a); /* خلفية متدرجة داكنة */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--main-text);
            padding: 20px;
        }

        /* ---------------------------------
           2. Glassmorphism Card & Structure
           --------------------------------- */
        .profile-card {
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            background: var(--glass-bg);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); /* ظل كبير وأغمق */
            backdrop-filter: blur(15px); /* تأثير زجاج أقوى */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            text-align: center;
            overflow: hidden; /* لحصر الصورة داخل حدود الكارد */
        }
        
        .card-content {
            padding: 20px;
        }

        /* ---------------------------------
           3. Cover Photo Area
           --------------------------------- */
        .cover-area {
            position: relative;
            height: 150px;
            background: var(--cover-placeholder);
            background-size: cover;
            background-position: center;
        }
        .cover-area.has-image {
             /* يتم تحديد الصورة الفعلي بواسطة JS عند التحميل */
        }

        /* ---------------------------------
           4. Profile Picture Area
           --------------------------------- */
        .profile-pic-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--glass-bg); /* إطار يدمجها مع الخلفية الزجاجية */
            margin: -60px auto 10px; /* سحب الصورة للأعلى لتظهر على الغلاف */
            position: relative;
            background-color: #333;
        }
        .profile-picture {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* ---------------------------------
           5. Text Information
           --------------------------------- */
        .username {
            font-size: 2em;
            margin-bottom: 5px;
            color: var(--main-text);
        }
        .full-name {
            font-size: 1.1em;
            color: var(--accent-color);
            margin-bottom: 15px;
        }
        .bio {
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        /* ---------------------------------
           6. Edit Overlays (لصاحب البروفايل فقط)
           --------------------------------- */
        .edit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }
        .cover-area:hover .edit-overlay,
        .profile-pic-container:hover .edit-overlay {
            opacity: 1;
        }
        
        .edit-overlay span {
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            background: rgba(0, 188, 212, 0.7);
            font-weight: bold;
            font-size: 0.9em;
        }

        .hidden-input {
            display: none; /* إخفاء حقل تحميل الملف الأصلي */
        }

        .loading-text {
            padding: 50px;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div id="profile-data">
            <p class="loading-text">جاري تحميل بيانات المستخدم...</p>
        </div>
    </div>

    <input type="file" id="cover-photo-input" class="hidden-input" accept="image/*">
    <input type="file" id="profile-photo-input" class="hidden-input" accept="image/*">

    <script>
        const profileDataContainer = document.getElementById('profile-data');
        const defaultPic = 'https://via.placeholder.com/120/444444/FFFFFF?text=P';
        const defaultCover = ''; // لا يوجد صورة غلاف افتراضية

        // تعريف دالة لجلب البيانات وعرضها
        async function fetchUserProfile() {
            try {
                // جلب بيانات المستخدم من API (سواء لنفسه أو لغيره)
                const urlParams = new URLSearchParams(window.location.search);
                const requestedUserId = urlParams.get('userId'); // للبروفايل العام
                
                // يتم إرسال is_owner = true إذا كان المستخدم هو صاحب البروفايل
                const apiURL = requestedUserId ? `/api/profile?userId=${requestedUserId}` : '/api/profile';
                
                const response = await fetch(apiURL); 
                const data = await response.json();

                if (data.ok) {
                    const profile = data;
                    const isOwner = profile.is_owner; // تحديد ما إذا كان هو صاحب البروفايل
                    
                    // يتم افتراض وجود حقل cover_photo_url، إن لم يكن موجوداً استخدم الخلفية الافتراضية
                    const coverPhotoURL = profile.cover_photo_url || defaultCover; 

                    profileDataContainer.innerHTML = `
                        <div class="cover-area" id="cover-area" style="background-image: url('${coverPhotoURL}'); background-color: ${coverPhotoURL ? 'transparent' : '#333'}">
                            ${isOwner ? `
                                <label for="cover-photo-input" class="edit-overlay">
                                    <span>تغيير الغلاف</span>
                                </label>
                            ` : ''}
                        </div>

                        <div class="card-content">
                            <div class="profile-pic-container">
                                <img src="${profile.profile_picture_url || defaultPic}" alt="صورة الملف الشخصي" class="profile-picture" id="profile-picture">
                                ${isOwner ? `
                                    <label for="profile-photo-input" class="edit-overlay">
                                        <span>تغيير الصورة</span>
                                    </label>
                                ` : ''}
                            </div>
                            
                            <h1 class="username">@${profile.username || 'N/A'}</h1>
                            <h2 class="full-name">${profile.full_name || 'غير متوفر'}</h2>
                            <p class="bio">${profile.bio || 'لم يقم المستخدم بإضافة سيرة ذاتية بعد.'}</p>
                        </div>
                    `;

                    // ربط مدخلات الملفات بالـ Uploader
                    if (isOwner) {
                        setupImageUploadEvents(profile.id);
                    }
                    
                } else {
                    profileDataContainer.innerHTML = '<p style="color: red;">تعذر جلب البيانات: المستخدم غير مصرح له أو غير موجود.</p>';
                }

            } catch (error) {
                console.error('Error:', error);
                profileDataContainer.innerHTML = '<p style="color: red;">حدث خطأ في الاتصال بالخادم.</p>';
            }
        }

        // دالة لمعالجة حدث تغيير الصورة
        function setupImageUploadEvents(userId) {
            const coverInput = document.getElementById('cover-photo-input');
            const profileInput = document.getElementById('profile-photo-input');
            const profileImg = document.getElementById('profile-picture');
            const coverArea = document.getElementById('cover-area');
            
            // تغيير صورة البروفايل
            profileInput.addEventListener('change', (event) => {
                if (event.target.files && event.target.files[0]) {
                    const file = event.target.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        profileImg.src = e.target.result; // عرض الصورة الجديدة
                        // **ملاحظة:** هنا يجب استدعاء API لرفع الملف وتحديث حقل Firebase
                        alert('تم اختيار صورة البروفايل. (تحتاج إلى تطبيق API لرفعها وتحديثها)');
                        // مثال: callApiToUpload(file, 'profile_picture');
                    };
                    reader.readAsDataURL(file);
                }
            });

            // تغيير صورة الغلاف
            coverInput.addEventListener('change', (event) => {
                if (event.target.files && event.target.files[0]) {
                    const file = event.target.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        coverArea.style.backgroundImage = `url('${e.target.result}')`; // عرض الصورة الجديدة
                        // **ملاحظة:** هنا يجب استدعاء API لرفع الملف وتحديث حقل Firebase
                        alert('تم اختيار صورة الغلاف. (تحتاج إلى تطبيق API لرفعها وتحديثها)');
                        // مثال: callApiToUpload(file, 'cover_photo');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        fetchUserProfile();
    </script>
</body>
</html>
