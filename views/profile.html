<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف المستخدم - Trimer</title>
    <style>
        /* ---------------------------------
           1. CSS Reset & Global
           --------------------------------- */
        :root {
            --glass-bg: rgba(0, 0, 0, 0.4); /* خلفية شبه شفافة سوداء */
            --glass-border: rgba(255, 255, 255, 0.1); /* إطار فاتح */
            --main-text: #f0f0f0;
            --accent-color: #00bcd4; /* لون التمييز - سماوي */
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f1c2c, #4a2c4a); /* خلفية متدرجة داكنة */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--main-text);
        }

        /* ---------------------------------
           2. Glassmorphism Card Style
           --------------------------------- */
        .profile-card {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            background: var(--glass-bg);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); /* ظل كبير */
            backdrop-filter: blur(10px); /* تأثير الزجاج */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------------------------------
           3. Profile Elements
           --------------------------------- */
        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.5); /* ظل لوني */
        }

        .username {
            font-size: 2em;
            margin-bottom: 5px;
            color: var(--main-text);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .full-name {
            font-size: 1.1em;
            color: var(--accent-color);
            margin-bottom: 15px;
        }
        
        .bio {
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        
        .stats-grid {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        .stat-item h3 {
            font-size: 1.5em;
            color: var(--accent-color);
        }
        .stat-item p {
            font-size: 0.9em;
            color: var(--main-text);
            margin-top: 5px;
        }

        .loading-text {
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div id="profile-data">
            <p class="loading-text">جاري تحميل بيانات المستخدم...</p>
        </div>
    </div>

    <script>
        const profileDataContainer = document.getElementById('profile-data');
        const defaultPic = 'https://via.placeholder.com/150/444444/FFFFFF?text=P'; // صورة افتراضية

        async function fetchUserProfile() {
            try {
                // استخدام المسار الذي أنشأته في server.js لجلب بيانات المستخدم
                const response = await fetch('/api/profile'); 
                const data = await response.json();

                if (data.ok) {
                    const profile = data; // البيانات مباشرة في الكائن الجذري

                    // التحقق من وجود postsCount في ملفك
                    const postsCount = profile.postsCount || 0; 
                    
                    profileDataContainer.innerHTML = `
                        <img src="${profile.profile_picture_url || defaultPic}" alt="صورة الملف الشخصي" class="profile-picture">
                        <h1 class="username">@${profile.username || 'N/A'}</h1>
                        <h2 class="full-name">${profile.full_name || 'غير متوفر'}</h2>
                        <p class="bio">${profile.bio || 'لم يقم المستخدم بإضافة سيرة ذاتية بعد.'}</p>
                        
                    `;
                } else {
                    profileDataContainer.innerHTML = '<p style="color: red;">تعذر جلب البيانات: المستخدم غير مصرح له أو غير موجود.</p>';
                }

            } catch (error) {
                console.error('Error:', error);
                profileDataContainer.innerHTML = '<p style="color: red;">حدث خطأ في الاتصال بالخادم.</p>';
            }
        }

        fetchUserProfile();
    </script>
</body>
</html>
