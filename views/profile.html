<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Aite - الملف الشخصي</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body {
            background-color: #000000;
            color: #e4e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .glass-navbar {
            background-color: rgba(30, 30, 30, 0.5);

            font-weight: 800;
        }

        .glass-dropdown {
            background-color: rgba(30, 30, 30, 0.9);

        .glass-post-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-profile-card {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .waveform-post {
            height: 60px;

            border-radius: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* --- تحسينات صور البروفايل ونقاط النشاط --- */
        
        /* حاوية الصورة لتسمح بالتموضع المطلق للنقطة داخلها */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            line-height: 0; /* لمنع مسافات إضافية */
        }

        /* النقطة الخضراء العامة */
        .status-indicator {
            position: absolute;
            background-color: #22c55e; /* لون أخضر فاقع */
            border-radius: 50%;
            display: none; /* مخفي افتراضياً ويظهر بالجافاسكربت */
            z-index: 10;
        }

        /* تنسيق النقطة في صفحة البروفايل (كبيرة) */
        .status-indicator.large {
            width: 24px;
            height: 24px;
            bottom: 15px; /* رفع قليلاً من الحافة السفلية */
            left: 10px;   /* في اليمين (أو اليسار حسب التفضيل، هنا وضعناها يساراً لتناسب RTL أو يميناً حسب التصميم) */
            /* لنجعلها على اليسار (بداية السطر في العربية) أو اليمين. 
               المعتاد عالمياً هو Bottom-Right. في RTL الـ Right هو بداية السطر أحياناً.
               سنستخدم left هنا لأن الصورة محاذاة لليمين والنص يسارها، فالزاوية اليسرى للصورة هي الأقرب للمحتوى */
            left: 5px; 
            bottom: 12px;
            border: 4px solid #000000; /* حدود بنفس لون خلفية الصفحة لتبدو مفصولة */
        }

        /* تنسيق النقطة في المنشورات (صغيرة) */
        .status-indicator.small {
            width: 13px;
            height: 13px;
            bottom: 0px;
            left: 0px; /* الزاوية السفلية اليسرى للصورة */
            border: 2px solid #242526; /* حدود بلون خلفية الكرت */
        }

        /* Status text shown under username on profile */
        #profileStatus {
          display: block;
          margin-top: 6px;
          color: #9ca3af;
          font-size: 13px;
        }

        @media (max-width: 480px) {
           /* تعديلات للموبايل */
           .status-indicator.large {
               width: 20px;
               height: 20px;
               bottom: 12px;
               left: 4px;
               border-width: 3px;
           }
        }

    </style>
</head>

<script>
/*
  ملف profile.html محدث:
  - تم تحسين ظهور مؤشر النشاط (Online Dot) ليكون مثل مواقع التواصل (فوق الصورة من الأسفل).
  - تم تعديل طريقة عرض المنشورات لتشمل النقطة.
*/

let currentProfileId = null;
let currentUserId = null;
let activeWaveSurfer = null;
let audioWaveSurfers = {};
let activeVideo = null;
let currentPostIdForComment = null;
let statusPollInterval = null;

function toggleProfileDropdown(event) {
    event.stopPropagation();
    const profileDropdown = document.getElementById('profileDropdown');
    profileDropdown.classList.toggle('hidden');
}
function closeProfileDropdownOnClickOutside(event) {
    const profileDropdown = document.getElementById('profileDropdown');
    const profileMenuButton = document.getElementById('profileMenuButton');
    if (!profileDropdown.contains(event.target) && !profileMenuButton.contains(event.target)) {
        profileDropdown.classList.add('hidden');
    }
}
document.addEventListener('click', closeProfileDropdownOnClickOutside);

function formatTimestamp(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diffInHours = (now - date) / (1000 * 60 * 60);
    if (diffInHours < 24) {
        return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    } else if (diffInHours < 7 * 24) {
        return date.toLocaleDateString('ar-EG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    } else {
        return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
    }
}

function formatLastSeen(lastSeenTs) {
    if (!lastSeenTs) return '';
    const now = Date.now();
    const diff = Math.max(0, now - lastSeenTs);
    const seconds = Math.floor(diff / 1000);
    if (seconds < 60) return 'متصل منذ لحظات';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `آخر ظهور منذ ${minutes} دقيقة${minutes > 1 ? 'ً' : ''}`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `آخر ظهور منذ ${hours} ساعة${hours > 1 ? 'ً' : ''}`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `آخر ظهور منذ ${days} يوم${days > 1 ? 'ً' : ''}`;
    const d = new Date(lastSeenTs);
    return `آخر ظهور في ${d.toLocaleDateString('ar-EG')}`;
}

// إنشاء كرت المنشور مع تضمين online dot بشكل صحيح
function createPostCard(post) {
    let mediaContent = '';

    if (post.media) {
        if (post.media.type === 'image') {
            mediaContent = `
                <div class="mt-3 cursor-pointer" onclick="openMediaViewer('${post.media.url}', 'image', event)">
                    <img src="${post.media.url}" alt="صورة المنشور" class="w-full max-h-96 object-cover rounded-lg">
                </div>
            `;
        } else if (post.media.type === 'video') {
            mediaContent = `
                <div class="mt-3 relative w-full aspect-video rounded-lg overflow-hidden bg-black group">
                    <video id="video-${post.postId}" src="${post.media.url}" class="w-full h-full object-contain" poster="https://via.placeholder.com/600x400?text=Video+Loading" preload="metadata" onclick="toggleVideoPlay('${post.postId}', event)"></video>
                    <div id="play-overlay-${post.postId}" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 transition-opacity duration-300 cursor-pointer" onclick="toggleVideoPlay('${post.postId}', event)">
                        <i class="fas fa-play text-white text-5xl opacity-80 transition-transform duration-300 transform scale-100 group-hover:scale-110"></i>
                    </div>
                    <div id="controls-bar-${post.postId}" class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent flex items-center space-x-3 space-x-reverse opacity-0 transition-opacity duration-300 group-hover:opacity-100">
                        <button onclick="toggleVideoPlay('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                            <i id="control-icon-${post.postId}" class="fas fa-play text-xl"></i>
                        </button>
                        <div class="flex-grow h-1 bg-gray-500 rounded-full cursor-pointer relative" onclick="seekVideo('${post.postId}', event)">
                            <div id="progress-bar-${post.postId}" class="absolute top-0 right-0 h-full bg-blue-500 rounded-full w-0"></div>
                        </div>
                        <span id="time-display-${post.postId}" class="text-white text-xs font-mono">0:00 / 0:00</span>
                        <button onclick="toggleFullscreen('${post.postId}', event)" class="text-white hover:text-blue-400 transition">
                            <i class="fas fa-expand text-lg"></i>
                        </button>
                    </div>
                </div>
            `;
        } else if (post.media.type === 'audio') {
            mediaContent = `
                <div class="mt-3 flex items-center space-x-3 space-x-reverse bg-gray-800 p-3 rounded-lg">
                    <button id="audio-btn-${post.postId}" class="audio-play-button text-white text-xl hover:text-blue-400 transition duration-300 flex-shrink-0" onclick="toggleAudioPlay('${post.postId}')">
                        <i class="fas fa-play"></i>
                    </button>
                    <div id="waveform-${post.postId}" class="waveform-post flex-grow" data-src="${post.media.url}"></div>
                </div>
            `;
        }
    }

    const likeIconClass = post.is_liked ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-400';
    const likeButtonClass = post.is_liked ? 'text-red-500' : 'text-gray-400';

    // نقطة الأونلاين للمنشور
    const isOnline = post.user && post.user.is_online;
    // نستخدم style display بدلاً من hidden class لسهولة التحكم عبر JS لاحقاً
    const dotDisplay = isOnline ? 'block' : 'none';

    return `
        <div class="glass-post-card p-4 rounded-xl shadow-lg" data-post-id="${post.postId}">
            <div class="flex items-start justify-between mb-3">
                <div class="flex items-center">
                    <a href="/profile?userId=${post.userId}" class="avatar-wrapper ml-3" data-user-id="${post.userId}">
                        <img src="${post.user.profile_picture_url}" alt="${post.user.username}" class="w-10 h-10 rounded-full object-cover border border-gray-600">
                        <span class="status-indicator small" style="display: ${dotDisplay};" title="متصل الآن"></span>
                    </a>
                    
                    <div>
                        <a href="/profile?userId=${post.userId}" class="text-white font-semibold hover:text-blue-400">@${post.user.username}</a>
                        <p class="text-gray-400 text-xs">${formatTimestamp(post.timestamp)}</p>
                    </div>
                </div>
                ${post.userId === currentUserId ? `
                  <button class="text-gray-400 hover:text-white transition duration-300 post-menu-button" onclick="togglePostMenu('${post.postId}', '${post.userId}', event, this)"><i class="fas fa-ellipsis-v"></i></button>
                ` : ''}
            </div>

            <p class="text-gray-200 whitespace-pre-wrap">${post.content}</p>

            ${mediaContent}

            <div class="flex justify-between items-center text-gray-400 text-sm mt-3 pb-2 border-b border-gray-700">
                <span><i class="fas fa-heart ml-1"></i> ${post.likes} إعجاب</span>
                <span class="cursor-pointer hover:text-blue-400" onclick="handleComment('${post.postId}')"><i class="far fa-comment-dots ml-1"></i> ${post.commentsCount} تعليق</span>
            </div>

            <div class="flex justify-around border-t border-gray-700 mt-3 pt-3">
                <button class="flex items-center ${likeButtonClass} hover:text-red-500 transition duration-300 w-full justify-center post-like-button" data-is-liked="${post.is_liked}" onclick="handleLike('${post.postId}', this)">
                    <i class="${likeIconClass} ml-2 like-icon"></i> إعجاب
                </button>
                <button class="flex items-center text-gray-400 hover:text-blue-500 transition duration-300 w-full justify-center" onclick="handleComment('${post.postId}')">
                    <i class="far fa-comment-alt ml-2"></i> تعليق
                </button>
            </div>
        </div>
    `;
}

// WaveSurfer init (for audio posts)
function initializePostWaveSurfer(postId, url) {
    const container = document.getElementById(`waveform-${postId}`);
    if (!container) return null;
    if (audioWaveSurfers[postId]) return audioWaveSurfers[postId];

    const wavesurfer = WaveSurfer.create({
        container: container,
        waveColor: '#4f46e5',
        progressColor: '#06b6d4',
        cursorColor: '#1d4ed8',
        barWidth: 3,
        barRadius: 3,
        barGap: 3,
        responsive: true,
        height: 60,
        backend: 'MediaElement',
    });

    wavesurfer.load(url);

    wavesurfer.on('ready', () => {
        const btn = document.getElementById(`audio-btn-${postId}`);
        if (btn) btn.querySelector('i').className = 'fas fa-play';
    });

    wavesurfer.on('play', () => {
        const btn = document.getElementById(`audio-btn-${postId}`);
        if (btn) btn.querySelector('i').className = 'fas fa-pause';
        if (activeWaveSurfer && activeWaveSurfer !== wavesurfer) activeWaveSurfer.pause();
        activeWaveSurfer = wavesurfer;
    });

    wavesurfer.on('pause', () => {
        const btn = document.getElementById(`audio-btn-${postId}`);
        if (btn) btn.querySelector('i').className = 'fas fa-play';
    });

    wavesurfer.on('finish', () => {
        const btn = document.getElementById(`audio-btn-${postId}`);
        if (btn) btn.querySelector('i').className = 'fas fa-play';
        wavesurfer.seekTo(0);
        activeWaveSurfer = null;
    });

    audioWaveSurfers[postId] = wavesurfer;
    return wavesurfer;
}

function toggleAudioPlay(postId) {
    const ws = audioWaveSurfers[postId];
    if (!ws) {
        const container = document.getElementById(`waveform-${postId}`);
        if (container && container.dataset && container.dataset.src) initializePostWaveSurfer(postId, container.dataset.src);
    }
    const wavesurfer = audioWaveSurfers[postId];
    if (!wavesurfer) return;
    if (wavesurfer.isPlaying()) wavesurfer.pause();
    else wavesurfer.play();
}

// Like/Comment helpers
async function handleLike(postId, buttonElement) {
    const isLiked = buttonElement.getAttribute('data-is-liked') === 'true';
    const likeIcon = buttonElement.querySelector('.like-icon');
    buttonElement.disabled = true;
    try {
        const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const data = await res.json();
        if (res.ok && data.ok) {
            if (data.action === 'liked') {
                likeIcon.classList.remove('far', 'text-gray-400');
                likeIcon.classList.add('fas', 'text-red-500');
                buttonElement.classList.remove('text-gray-400');
                buttonElement.classList.add('text-red-500');
                buttonElement.setAttribute('data-is-liked', 'true');
            } else {
                likeIcon.classList.remove('fas', 'text-red-500');
                likeIcon.classList.add('far', 'text-gray-400');
                buttonElement.classList.remove('text-red-500');
                buttonElement.classList.add('text-gray-400');
                buttonElement.setAttribute('data-is-liked', 'false');
            }
            if (data.newLikes !== undefined) {
                const postCard = document.querySelector(`div[data-post-id="${postId}"]`);
                if (postCard) {
                    const likesElem = postCard.querySelector('.flex.justify-between span:first-child');
                    if (likesElem) likesElem.innerHTML = `<i class="fas fa-heart ml-1"></i> ${data.newLikes} إعجاب`;
                }
            }
        }
    } catch (e) {
        console.error(e);
    } finally {
        buttonElement.disabled = false;
    }
}

async function handleComment(postId) {
    currentPostIdForComment = postId;
    openCommentModal();
    await fetchComments(postId);
}

async function fetchComments(postId) {
    const commentsList = document.getElementById('commentsList');
    const commentError = document.getElementById('commentError');
    commentsList.innerHTML = '<div class="text-center text-gray-500"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل التعليقات...</div>';
    commentError.classList.add('hidden');
    try {
        const response = await fetch(`/api/posts/${postId}/comments`);
        const result = await response.json();
        commentsList.innerHTML = '';
        if (response.ok && result.ok && result.comments.length > 0) {
            result.comments.forEach(c => commentsList.innerHTML += createCommentElement(c));
        } else {
            commentsList.innerHTML = '<div class="text-center text-gray-500 mt-4">لا توجد تعليقات حتى الآن.</div>';
        }
    } catch (e) {
        commentsList.innerHTML = '<div class="text-center text-red-500 mt-4">فشل في جلب التعليقات.</div>';
    }
}

function createCommentElement(comment) {
    return `
        <div class="flex items-start p-3 bg-[#242526] rounded-lg shadow-md">
            <img src="${comment.user.profile_picture_url}" alt="${comment.user.username}" class="w-8 h-8 rounded-full object-cover ml-3 flex-shrink-0">
            <div class="flex-grow">
                <p class="text-white font-semibold text-sm">@${comment.user.username} <span class="text-gray-500 text-xs mr-2">${formatTimestamp(comment.timestamp)}</span></p>
                <p class="text-gray-200 mt-1 whitespace-pre-wrap">${comment.content}</p>
            </div>
        </div>
    `;
}

async function postComment() {
    const input = document.getElementById('newCommentInput');
    const commentError = document.getElementById('commentError');
    const content = input.value.trim();
    if (!content || !currentPostIdForComment) return;
    try {
        const res = await fetch(`/api/posts/${currentPostIdForComment}/comment`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
            const commentsList = document.getElementById('commentsList');
            commentsList.innerHTML += createCommentElement(data.comment);
            input.value = '';
            // update comments count in post card if available
            if (data.newComments !== undefined) {
                const postCard = document.querySelector(`div[data-post-id="${currentPostIdForComment}"]`);
                if (postCard) {
                    const commentsSpan = postCard.querySelector('.flex.justify-between span:last-child');
                    if (commentsSpan) commentsSpan.innerHTML = `<i class="far fa-comment-dots ml-1"></i> ${data.newComments} تعليق`;
                }
            }
        } else {
            commentError.textContent = data.error || 'فشل في إضافة التعليق.';
            commentError.classList.remove('hidden');
        }
    } catch (e) {
        commentError.textContent = 'فشل الاتصال بالخادم.';
        commentError.classList.remove('hidden');
    }
}

function openCommentModal() {
    document.getElementById('commentModal').classList.remove('hidden');
    document.getElementById('newCommentInput').focus();
}
function closeCommentModal() {
    document.getElementById('commentModal').classList.add('hidden');
    currentPostIdForComment = null;
    document.getElementById('commentsList').innerHTML = '';
}

// Media viewer
function openMediaViewer(url, type, event) {
    event.stopPropagation();
    const modal = document.getElementById('mediaViewerModal');
    const image = document.getElementById('mediaViewerImage');
    const video = document.getElementById('mediaViewerVideo');
    image.classList.add('hidden'); video.classList.add('hidden');
    if (type === 'image') { image.src = url; image.classList.remove('hidden'); }
    else if (type === 'video') { video.src = url; video.classList.remove('hidden'); video.play(); }
    modal.classList.remove('hidden');
}
function closeMediaViewer() {
    const modal = document.getElementById('mediaViewerModal');
    modal.classList.add('hidden');
    const video = document.getElementById('mediaViewerVideo');
    if (video) { video.pause(); video.currentTime = 0; video.src = ''; }
}

// Video controls (minimal)
function toggleVideoPlay(postId, event) {
    event.stopPropagation();
    const video = document.getElementById(`video-${postId}`);
    const playOverlay = document.getElementById(`play-overlay-${postId}`);
    const controlIcon = document.getElementById(`control-icon-${postId}`);
    if (!video) return;
    if (activeWaveSurfer) { activeWaveSurfer.pause(); activeWaveSurfer = null; }
    if (video.paused) {
        video.play().catch(()=>{});
        if (controlIcon) controlIcon.classList.remove('fa-play'), controlIcon.classList.add('fa-pause');
        if (playOverlay) playOverlay.classList.add('hidden');
        activeVideo = video;
        video.addEventListener('timeupdate', (e) => {
            const progressBar = document.getElementById(`progress-bar-${postId}`);
            const timeDisplay = document.getElementById(`time-display-${postId}`);
            if (progressBar && video.duration) progressBar.style.width = (video.currentTime / video.duration * 100) + '%';
            if (timeDisplay && video.duration) timeDisplay.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(video.duration)}`;
        });
    } else {
        video.pause();
        if (controlIcon) controlIcon.classList.remove('fa-pause'), controlIcon.classList.add('fa-play');
        if (playOverlay) playOverlay.classList.remove('hidden');
        activeVideo = null;
    }
}
function formatVideoTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);
    return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
}
function seekVideo(postId, event) {
    event.stopPropagation();
    const video = document.getElementById(`video-${postId}`);
    const progressContainer = event.currentTarget;
    if (!video || !video.duration) return;
    const rect = progressContainer.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const percentage = clickX / rect.width;
    video.currentTime = video.duration * percentage;
    if (video.paused) toggleVideoPlay(postId, event);
}
function toggleFullscreen(postId, event) {
    event.stopPropagation();
    const video = document.getElementById(`video-${postId}`);
    if (video) {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.mozRequestFullScreen) video.mozRequestFullScreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        else if (video.msRequestFullscreen) video.msRequestFullscreen();
    }
}

// --- Presence UI helpers ---
// Set online dot and profile status for a given user across the page
function setUserOnlineUI(userId, isOnline, lastSeenTs) {
    // update all avatars with data-user-id == userId (includes posts)
    const selectors = document.querySelectorAll(`.avatar-wrapper[data-user-id="${userId}"]`);
    selectors.forEach(av => {
        const dot = av.querySelector('.status-indicator');
        if (!dot) return;
        if (isOnline) {
            dot.style.display = 'block';
        } else {
            dot.style.display = 'none';
        }
    });

    // if viewing the profile of this user, update big dot & status text
    const profileAvatarWrap = document.getElementById('profileAvatarWrap');
    if (profileAvatarWrap && profileAvatarWrap.dataset.userId === userId) {
        const bigDot = document.getElementById('profileOnlineDot');
        const profileStatus = document.getElementById('profileStatus');
        
        if (isOnline) {
            if (bigDot) bigDot.style.display = 'block';
            if (profileStatus) profileStatus.textContent = 'متصل الآن';
            if (profileStatus) profileStatus.className = 'text-green-500 font-semibold text-sm block mt-1';
        } else {
            if (bigDot) bigDot.style.display = 'none';
            if (profileStatus) {
                profileStatus.textContent = formatLastSeen(lastSeenTs) || '';
                profileStatus.className = 'text-gray-400 text-sm block mt-1';
            }
        }
    }
}

// Poll only the status (and last_seen) for the displayed profile
async function pollProfileStatus() {
    if (!currentProfileId) return;
    try {
        const r = await fetch(`/api/profile?userId=${currentProfileId}`, { cache: 'no-store' });
        if (!r.ok) return;
        const d = await r.json();
        if (d && d.ok) {
            setUserOnlineUI(currentProfileId, !!d.is_online, d.last_seen);
        }
    } catch (e) {
        // ignore
    }
}

function startStatusPolling() {
    if (statusPollInterval) clearInterval(statusPollInterval);
    pollProfileStatus();
    statusPollInterval = setInterval(pollProfileStatus, 15000); // كل 15 ثانية
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') pollProfileStatus();
    });
    window.addEventListener('beforeunload', () => {
        if (statusPollInterval) clearInterval(statusPollInterval);
    });
}

// Fetch current user (to know whether to show edit/delete controls)
async function fetchCurrentUser() {
    try {
        const resp = await fetch('/api/profile');
        if (!resp.ok) return;
        const data = await resp.json();
        if (data && data.id) {
            currentUserId = data.id;
            const smallPic = document.getElementById('userProfilePic');
            if (smallPic && data.profile_picture_url) smallPic.src = data.profile_picture_url;
        }
    } catch (e) {
        console.error('fetchCurrentUser failed', e);
    }
}

// Fetch and render profile + posts
async function fetchAndDisplayProfile() {
    await fetchCurrentUser();

    const urlParams = new URLSearchParams(window.location.search);
    const requestedUserId = urlParams.get('userId');
    currentProfileId = requestedUserId || currentUserId;
    if (!currentProfileId) {
        document.getElementById('userPostsFeed').innerHTML = '<div class="text-center text-red-500 p-8">خطأ: لا يمكن تحديد الملف الشخصي.</div>';
        return;
    }

    try {
        const response = await fetch(`/api/profile?userId=${currentProfileId}`);
        const data = await response.json();

        if (response.ok && data.ok) {
            // update avatar wrap data attribute and image
            const profileAvatarWrap = document.getElementById('profileAvatarWrap');
            profileAvatarWrap.dataset.userId = data.id;
            document.getElementById('profileImage').src = data.profile_picture_url || '/assets/default_profile_pic.png';
            if (data.cover_photo_url) document.getElementById('coverPhotoContainer').style.backgroundImage = `url('${data.cover_photo_url}')`;
            document.getElementById('profileUsername').textContent = `@${data.username}`;
            document.getElementById('profileFullName').textContent = data.full_name || 'لا يوجد اسم كامل';
            document.getElementById('profileBio').textContent = data.bio || '';
            document.getElementById('pageTitle').textContent = `Aite - @${data.username}`;

            // update profile online UI immediately
            setUserOnlineUI(data.id, !!data.is_online, data.last_seen);

            // show actions
            const friendActionContainer = document.getElementById('friendActionContainer');
            friendActionContainer.innerHTML = '';
            const editProfileButton = document.getElementById('editProfileButton');
            const chatButton = document.getElementById('chatButton');

            if (currentUserId && data.id === currentUserId) {
                editProfileButton.classList.remove('hidden');
                chatButton.classList.add('hidden');
            } else {
                editProfileButton.classList.add('hidden');
                if (data.is_friend) {
                    chatButton.href = `/chat?contactId=${currentProfileId}`;
                    chatButton.classList.remove('hidden');
                } else {
                    chatButton.classList.add('hidden');
                }

                if (data.request_received) {
                    friendActionContainer.innerHTML = `
                      <button id="acceptFriendBtn" class="btn-accept">قبول</button>
                      <button id="rejectFriendBtn" class="btn-reject">رفض</button>
                    `;
                    document.getElementById('acceptFriendBtn').addEventListener('click', async () => {
                        try {
                            const r = await fetch('/api/friends/accept', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from_id: currentProfileId })});
                            const j = await r.json();
                            if (r.ok && j.ok) { alert('تمت الموافقة — أصبح هذا المستخدم صديقك.'); fetchAndDisplayProfile(); }
                            else alert('فشل في قبول الطلب.');
                        } catch (e) { alert('خطأ في الشبكة'); }
                    });
                    document.getElementById('rejectFriendBtn').addEventListener('click', async () => {
                        try {
                            const r = await fetch('/api/friends/reject', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from_id: currentProfileId })});
                            const j = await r.json();
                            if (r.ok && j.ok) { alert('تم رفض الطلب.'); fetchAndDisplayProfile(); }
                            else alert('فشل في رفض الطلب.');
                        } catch (e) { alert('خطأ في الشبكة'); }
                    });
                } else if (data.request_sent) {
                    friendActionContainer.innerHTML = `<button id="cancelFriendBtn" class="btn-add-friend">طلب مرسل</button>`;
                    document.getElementById('cancelFriendBtn').addEventListener('click', async () => {
                        try {
                            const r = await fetch('/api/friends/cancel', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to_id: currentProfileId })});
                            const j = await r.json();
                            if (r.ok && j.ok) { alert('تم إلغاء الطلب.'); fetchAndDisplayProfile(); } else alert('فشل في إلغاء الطلب.');
                        } catch (e) { alert('خطأ في الشبكة'); }
                    });
                } else if (!data.is_friend) {
                    friendActionContainer.innerHTML = `<button id="addFriendBtn" class="btn-add-friend">إضافة صديق</button>`;
                    document.getElementById('addFriendBtn').addEventListener('click', async () => {
                        try {
                            const r = await fetch('/api/friends/request', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to_id: currentProfileId })});
                            const j = await r.json();
                            if (r.ok && j.ok) { alert('تم إرسال طلب الصداقة.'); fetchAndDisplayProfile(); } else alert(j.error || 'فشل في إرسال الطلب.');
                        } catch (e) { alert('خطأ في الشبكة'); }
                    });
                }
            }

            // fetch and render posts
            await fetchAndDisplayUserPosts(currentProfileId);
        } else {
            document.getElementById('userPostsFeed').innerHTML = `<div class="text-center text-red-500 p-8">لم يتم العثور على المستخدم @${currentProfileId}</div>`;
        }
    } catch (error) {
        console.error('Error fetching profile:', error);
        document.getElementById('userPostsFeed').innerHTML = '<div class="text-center text-red-500 p-8">حدث خطأ في جلب بيانات الملف الشخصي.</div>';
    }
}

async function fetchAndDisplayUserPosts(userId) {
    const userPostsFeed = document.getElementById('userPostsFeed');
    userPostsFeed.innerHTML = '<div class="text-center text-gray-500 p-8"><i class="fas fa-spinner fa-spin ml-2"></i> جاري تحميل المنشورات...</div>';

    try {
        const response = await fetch(`/api/posts/user/${userId}`);
        const result = await response.json();

        userPostsFeed.innerHTML = '';

        if (response.ok && result.ok) {
            if (result.posts.length === 0) {
                userPostsFeed.innerHTML = '<div class="text-center text-gray-500 p-8">لا توجد منشورات لعرضها بعد.</div>';
            } else {
                const audioPostsToInit = [];
                result.posts.forEach(post => {
                    userPostsFeed.innerHTML += createPostCard(post);
                    if (post.media && post.media.type === 'audio') audioPostsToInit.push({ postId: post.postId, url: post.media.url });
                });

                // small timeout to let DOM settle
                setTimeout(() => {
                    audioPostsToInit.forEach(ap => initializePostWaveSurfer(ap.postId, ap.url));
                }, 100);

                // Start polling presence for this profile
                startStatusPolling();
            }
        } else {
            userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-8">فشل في جلب المنشورات.</div>';
        }
    } catch (error) {
        console.error('Error fetching user posts:', error);
        userPostsFeed.innerHTML = '<div class="text-center text-red-500 p-8">حدث خطأ في الاتصال بالخادم.</div>';
    }
}

// SSE listener
(function setupNotifSSEProfile() {
    if (!window.EventSource) return;
    try {
        const es = new EventSource('/api/notifications/stream', { withCredentials: true });
        es.addEventListener('notifications', (e) => {
            try {
                const payload = JSON.parse(e.data);
                // If needed, handle global notifications here
                if (payload.presenceUpdates && Array.isArray(payload.presenceUpdates)) {
                    payload.presenceUpdates.forEach(p => setUserOnlineUI(p.userId, !!p.is_online, p.last_seen));
                }
            } catch (err) {
                console.error('Failed to parse notifications SSE data', err);
            }
        });
        es.addEventListener('error', (err) => {
            console.warn('Notifications SSE error', err);
        });
    } catch (e) {
        // ignore
    }
})();

// Hook up comment button events after DOM is ready
document.addEventListener('DOMContentLoaded', () => {
    // wire comment post button
    const postCommentBtn = document.getElementById('postCommentBtn');
    if (postCommentBtn) postCommentBtn.addEventListener('click', postComment);

    const newCommentInput = document.getElementById('newCommentInput');
    if (newCommentInput) {
        newCommentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); postComment(); }
        });
    }

    // initial load
    fetchAndDisplayProfile();
});
